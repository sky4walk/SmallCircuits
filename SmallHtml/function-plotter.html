<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuncPlot — Funktionsgenerator</title>
<style>
  /* Offline-safe font stacks — no external requests */
  :root {
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', 'Monaco', 'Courier New', monospace;
    --font-ui:   'Futura', 'Century Gothic', 'Trebuchet MS', 'Gill Sans', ui-rounded, system-ui, sans-serif;

    --bg: #f5f2eb;
    --surface: #faf8f3;
    --border: #d8d2c4;
    --border-dark: #b8b0a0;
    --text: #1a1814;
    --text-dim: #7a7268;
    --text-mid: #4a4540;
    --accent: #c84b1e;
    --accent2: #1e6bc8;
    --accent-soft: rgba(200,75,30,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -1px;
    color: var(--text);
  }
  .logo em { color: var(--accent); font-style: normal; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .blog-link { color: var(--accent2); text-decoration: none; }
  .blog-link:hover { text-decoration: underline; }

  /* ---- Layout ---- */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .add-row { display: flex; gap: 8px; align-items: center; }

  .fn-input-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .fn-input-wrap:focus-within { border-color: var(--accent); }

  .fn-prefix {
    padding: 0 10px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
    border-right: 1px solid var(--border);
    height: 38px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .fn-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    padding: 0 10px;
    height: 38px;
    outline: none;
  }

  .syntax-hint {
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.5;
    color: var(--text-dim);
  }

  .btn-add {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 1.5px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 20px;
    font-weight: 300;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.12s, transform 0.08s;
  }
  .btn-add:hover { background: #a83c14; }
  .btn-add:active { transform: scale(0.92); }

  /* Function list */
  .fn-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .fn-list::-webkit-scrollbar { width: 4px; }
  .fn-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .fn-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    transition: border-color 0.15s, opacity 0.15s;
    animation: slideIn 0.2s ease;
    flex-shrink: 0;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fn-item.hidden-fn { opacity: 0.4; }
  .fn-item.has-error { border-color: rgba(200,75,30,0.5); }

  .fn-swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(0,0,0,0.1);
  }

  .fn-label {
    flex: 1;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
  }
  .fn-expr {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fn-prefix-lbl { color: var(--text-dim); font-size: 10px; }

  .fn-error-badge {
    display: block;
    margin-top: 3px;
    font-size: 9px;
    color: var(--accent);
    white-space: normal;
  }

  .fn-actions { display: flex; gap: 4px; }

  .fn-btn {
    width: 26px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }
  .fn-btn:hover { border-color: var(--border-dark); color: var(--text); }
  .fn-btn.del:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .fn-btn.edit:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(30,107,200,0.08); }

  .fn-item.editing { border-color: var(--accent2); background: var(--surface); }

  .fn-edit-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    border: 1.5px solid var(--accent2);
    border-radius: 6px;
    background: var(--bg);
    overflow: hidden;
  }
  .fn-edit-prefix {
    padding: 0 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    border-right: 1px solid var(--border);
    height: 30px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .fn-edit-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    padding: 0 8px;
    height: 30px;
    outline: none;
    min-width: 0;
  }
  .fn-btn.confirm { border-color: var(--accent2); color: var(--accent2); font-size: 14px; font-weight: 700; }
  .fn-btn.confirm:hover { background: rgba(30,107,200,0.1); }

  /* Viewport controls */
  .viewport-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vc-group label {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-family: var(--font-mono);
  }
  .vc-row { display: flex; gap: 4px; }
  .vc-input {
    width: 100%;
    min-width: 0;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    padding: 5px 8px;
    outline: none;
    transition: border-color 0.12s;
  }
  .vc-input:focus { border-color: var(--accent); }
  .vc-full { grid-column: span 2; }

  .step-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .step-btn {
    padding: 4px 10px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.12s;
  }
  .step-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    font-weight: 600;
  }
  .step-info {
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  /* Examples */
  .examples-section { flex: 1; overflow-y: auto; }
  .examples-list { display: flex; flex-direction: column; gap: 4px; }
  .ex-btn {
    text-align: left;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ex-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .ex-cat {
    font-size: 9px;
    color: var(--text-dim);
    background: var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: var(--font-ui);
    font-weight: 600;
  }

  /* ---- Canvas area ---- */
  .canvas-wrap {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;   /* Pan/Pinch selbst behandeln */
  }
  canvas.dragging { cursor: grabbing; }

  .cursor-info {
    position: absolute;
    bottom: 14px;
    right: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(245,242,235,0.88);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    pointer-events: none;
  }

  .zoom-btns {
    position: absolute;
    top: 14px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .zoom-btn {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text-mid);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .zoom-btn:hover { border-color: var(--border-dark); background: var(--bg); }
  .reset-btn { font-size: 13px; }

  .toast {
    position: absolute;
    top: 14px;
    left: 50%;
    max-width: 80%;
    transform: translateX(-50%) translateY(-120%);
    opacity: 0;
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    text-align: center;
    pointer-events: none;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---- Schmale Bildschirme (Handy/Tablet hochkant) ---- */
  @media (max-width: 760px) {
    header { padding: 10px 16px; }
    .header-hint { display: none; }
    .main { flex-direction: column; }
    .sidebar {
      width: 100%;
      max-height: 42%;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-y: auto;
    }
    .sidebar-section { padding: 12px 16px; }
    .fn-list { flex: none; overflow: visible; padding: 8px 16px; }
    .examples-section { flex: none; overflow: visible; }
    .examples-list { flex-direction: row; flex-wrap: wrap; }
    .ex-btn { gap: 6px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Func<em>Plot</em></div>
  <div class="header-right">
    <span class="header-hint">Ziehen: verschieben · Mausrad / zwei Finger: zoomen</span>
    <a class="blog-link" href="https://itzwieseltal.wordpress.com" target="_blank" rel="noopener">itzwieseltal.wordpress.com</a>
  </div>
</header>

<div class="main">
  <div class="sidebar">

    <div class="sidebar-section">
      <div class="section-label">Funktion hinzufügen</div>
      <div class="add-row">
        <div class="fn-input-wrap">
          <div class="fn-prefix">f(x) =</div>
          <input class="fn-input" id="fnInput" type="text" placeholder="sin(x) * x" autocomplete="off" spellcheck="false" autocapitalize="off">
        </div>
        <button class="btn-add" id="btnAdd" title="Hinzufügen (Enter)">+</button>
      </div>
      <div class="syntax-hint">+ − * / ^ mod · 2x = 2*x · pi, e<br>sin cos tan asin … exp log ln log2 log10 sqrt abs floor …</div>
    </div>

    <div class="fn-list" id="fnList"></div>

    <div class="sidebar-section">
      <div class="section-label">Ansichtsbereich</div>
      <div class="viewport-controls">
        <div class="vc-group">
          <label>x min / max</label>
          <div class="vc-row">
            <input class="vc-input" id="xMin" type="number" value="-10" step="any">
            <input class="vc-input" id="xMax" type="number" value="10" step="any">
          </div>
        </div>
        <div class="vc-group">
          <label>y min / max</label>
          <div class="vc-row">
            <input class="vc-input" id="yMin" type="number" value="-10" step="any">
            <input class="vc-input" id="yMax" type="number" value="10" step="any">
          </div>
        </div>
        <div class="vc-group vc-full">
          <label>Schrittweite (Abstand der Stützstellen in x)</label>
          <div class="step-row" id="stepRow">
            <button class="step-btn" data-step="0.001">0.001</button>
            <button class="step-btn active" data-step="0.01">0.01</button>
            <button class="step-btn" data-step="0.1">0.1</button>
            <button class="step-btn" data-step="1">1</button>
          </div>
          <div class="step-info" id="stepInfo"></div>
        </div>
      </div>
    </div>

    <div class="sidebar-section examples-section">
      <div class="section-label">Beispiele</div>
      <div class="examples-list" id="examplesList"></div>
    </div>

  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="plotCanvas"></canvas>
    <div class="zoom-btns">
      <button class="zoom-btn" data-zoom="0.7" title="Hineinzoomen">+</button>
      <button class="zoom-btn" data-zoom="1.4" title="Herauszoomen">−</button>
      <button class="zoom-btn reset-btn" id="btnReset" title="Zurücksetzen">⌂</button>
    </div>
    <div class="cursor-info" id="cursorInfo">x = —  y = —</div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
'use strict';

// ===== State =====
let functions = [];
let fnIdCounter = 0;
let step = 0.01;

const DEFAULT_VIEW = { xMin: -10, xMax: 10, yMin: -10, yMax: 10 };
let view = { ...DEFAULT_VIEW };

const MAX_SAMPLES = 50000;    // Obergrenze Stützstellen je Funktion (hält Zoomen flüssig)
const MIN_SPAN_ABS = 1e-9;    // kleinste Bereichsbreite
const MIN_SPAN_REL = 1e-9;    // relativ zur Lage (Gleitkomma-Auflösung)
const MAX_SPAN = 1e12;        // größte Bereichsbreite

const FN_COLORS = [
  '#c84b1e','#1e6bc8','#2a9d5c','#8b2fc8',
  '#c8a01e','#c81e6b','#0ea5e9','#6b6b6b'
];

const EXAMPLES = [
  { label: 'sin(x)', cat: 'TRIG' },
  { label: 'cos(x)', cat: 'TRIG' },
  { label: 'tan(x)', cat: 'TRIG' },
  { label: 'sin(x)/x', cat: 'TRIG' },
  { label: 'asin(x)', cat: 'TRIG' },
  { label: 'x^2', cat: 'POLY' },
  { label: 'x^3 - 3x', cat: 'POLY' },
  { label: 'x^4 - 4x^2 + 2', cat: 'POLY' },
  { label: '-x^2 + 5', cat: 'POLY' },
  { label: 'exp(x)', cat: 'EXP' },
  { label: 'exp(-x^2)', cat: 'EXP' },
  { label: '2^x', cat: 'EXP' },
  { label: 'exp(-x)*sin(x)', cat: 'EXP' },
  { label: 'log(x)', cat: 'LOG' },
  { label: 'log2(x)', cat: 'LOG' },
  { label: 'log10(x)', cat: 'LOG' },
  { label: 'sqrt(x)', cat: 'GEO' },
  { label: 'sqrt(4 - x^2)', cat: 'GEO' },
  { label: 'abs(sin(x))', cat: 'GEO' },
  { label: '1/x', cat: 'GEO' },
  { label: '2pi sin(x)', cat: 'MISC' },
  { label: 'floor(x)', cat: 'MISC' },
  { label: 'x * sin(1/x)', cat: 'MISC' },
  { label: 'x mod 3', cat: 'MISC' },
];

// ===== Ausdrucksparser =====
// Grammatik (Rang aufsteigend):
//   summe    := produkt (('+'|'-') produkt)*
//   produkt  := vorzeich (('*'|'/'|'%'|'mod'|<implizit>) potenz)*
//   vorzeich := ('-'|'+') vorzeich | potenz
//   potenz   := atom ('^' vorzeich)?          (rechtsassoziativ, -x^2 = -(x^2))
//   atom     := zahl | x | konstante | funktion '(' args ')' | '(' summe ')'
// Nur Bezeichner aus der Whitelist sind erlaubt; erzeugt wird reiner Math.*-Code.

const FUNCS = {
  sin:['Math.sin',1], cos:['Math.cos',1], tan:['Math.tan',1],
  asin:['Math.asin',1], acos:['Math.acos',1], atan:['Math.atan',1], atan2:['Math.atan2',2],
  sinh:['Math.sinh',1], cosh:['Math.cosh',1], tanh:['Math.tanh',1],
  asinh:['Math.asinh',1], acosh:['Math.acosh',1], atanh:['Math.atanh',1],
  exp:['Math.exp',1], log:['Math.log',1], ln:['Math.log',1],
  log2:['Math.log2',1], log10:['Math.log10',1],
  sqrt:['Math.sqrt',1], cbrt:['Math.cbrt',1], abs:['Math.abs',1],
  floor:['Math.floor',1], ceil:['Math.ceil',1], round:['Math.round',1],
  trunc:['Math.trunc',1], sign:['Math.sign',1],
  pow:['Math.pow',2], max:['Math.max',-1], min:['Math.min',-1],
};
const CONSTS = { pi: 'Math.PI', 'π': 'Math.PI', e: 'Math.E' };

function tokenize(src) {
  const tokens = [];
  const numRe = /(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/y;
  const idRe  = /[A-Za-z_π][A-Za-z0-9_]*/y;
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    numRe.lastIndex = i;
    let m = numRe.exec(src);
    if (m) { tokens.push({ t: 'num', v: m[0], pos: i }); i += m[0].length; continue; }
    idRe.lastIndex = i;
    m = idRe.exec(src);
    if (m) { tokens.push({ t: 'id', v: m[0].toLowerCase(), raw: m[0], pos: i }); i += m[0].length; continue; }
    if (c === '*' && src[i+1] === '*') { tokens.push({ t: 'op', v: '^', pos: i }); i += 2; continue; }
    if ('+-*/%^(),'.includes(c)) { tokens.push({ t: 'op', v: c, pos: i }); i++; continue; }
    throw new Error(`Unerwartetes Zeichen „${c}“ an Stelle ${i + 1}`);
  }
  return tokens;
}

function compileExpr(src) {
  const tk = tokenize(src);
  let p = 0;
  const peek = () => tk[p];
  const isOp = (t, v) => t && t.t === 'op' && t.v === v;
  const describe = t => t ? `„${t.raw || t.v}“ an Stelle ${t.pos + 1}` : 'Ende';
  const expect = v => {
    if (!isOp(peek(), v)) throw new Error(`„${v}“ erwartet, gefunden: ${describe(peek())}`);
    p++;
  };
  const startsAtom = t => t && (t.t === 'num' || (t.t === 'id' && t.v !== 'mod') || isOp(t, '('));

  function sum() {
    let l = product();
    while (isOp(peek(), '+') || isOp(peek(), '-')) {
      const op = tk[p++].v;
      l = `(${l}${op}${product()})`;
    }
    return l;
  }
  function product() {
    let l = unary();
    for (;;) {
      const t = peek();
      if (isOp(t, '*') || isOp(t, '/') || isOp(t, '%')) { p++; l = `(${l}${t.v}${unary()})`; }
      else if (t && t.t === 'id' && t.v === 'mod') { p++; l = `(${l}%${unary()})`; }
      else if (startsAtom(t)) { l = `(${l}*${power()})`; }      // implizite Multiplikation
      else return l;
    }
  }
  function unary() {
    if (isOp(peek(), '-')) { p++; return `(-${unary()})`; }
    if (isOp(peek(), '+')) { p++; return unary(); }
    return power();
  }
  function power() {
    const base = atom();
    if (isOp(peek(), '^')) { p++; return `Math.pow(${base},${unary()})`; }
    return base;
  }
  function atom() {
    const t = peek();
    if (!t) throw new Error('Ausdruck ist unvollständig');
    if (t.t === 'num') { p++; return `(${Number(t.v)})`; }
    if (isOp(t, '(')) { p++; const e = sum(); expect(')'); return `(${e})`; }
    if (t.t === 'id') {
      p++;
      if (t.v === 'x') return 'x';
      if (t.v in CONSTS) return CONSTS[t.v];
      if (t.v in FUNCS) {
        const [js, arity] = FUNCS[t.v];
        if (!isOp(peek(), '(')) throw new Error(`Nach „${t.raw}“ fehlt „(“`);
        p++;
        const args = [sum()];
        while (isOp(peek(), ',')) { p++; args.push(sum()); }
        expect(')');
        if (arity > 0 && args.length !== arity)
          throw new Error(`${t.raw}() erwartet ${arity} Argument${arity > 1 ? 'e' : ''}`);
        return `${js}(${args.join(',')})`;
      }
      throw new Error(`Unbekannter Name „${t.raw}“`);
    }
    throw new Error(`Unerwartet: ${describe(t)}`);
  }

  if (tk.length === 0) throw new Error('Leerer Ausdruck');
  const js = sum();
  if (p < tk.length) throw new Error(`Unerwartet: ${describe(tk[p])}`);
  return new Function('x', '"use strict"; return ' + js + ';');
}

// ===== Unicode-Normalisierung (x² → x^2, x⁻¹ → x^-1, × ÷ −) =====
const SUP = {
  '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9',
  '⁺':'+','⁻':'-','⁽':'(','⁾':')','×':'*','÷':'/','−':'-','·':'*',
};
function normalizeExpr(str) {
  return str
    .replace(/[⁺⁻]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^' + [...m].map(c => SUP[c]).join(''))
    .replace(/[⁺⁻⁽⁾×÷−·]/g, c => SUP[c]);
}

// ===== Canvas setup =====
const canvas = document.getElementById('plotCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
let W = 1, H = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(1, wrap.clientWidth);
  H = Math.max(1, wrap.clientHeight);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  draw();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
else window.addEventListener('resize', resize);

// ===== Koordinaten =====
function worldToScreen(wx, wy) {
  return [
    (wx - view.xMin) / (view.xMax - view.xMin) * W,
    H - (wy - view.yMin) / (view.yMax - view.yMin) * H,
  ];
}
function screenToWorld(sx, sy, v = view) {
  return [
    v.xMin + (sx / W) * (v.xMax - v.xMin),
    v.yMin + ((H - sy) / H) * (v.yMax - v.yMin),
  ];
}
function eventPos(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

// ===== Ansicht setzen (mit Grenzen) =====
function clampAxis(lo, hi) {
  const c = (lo + hi) / 2;
  const minSpan = Math.max(MIN_SPAN_ABS, Math.abs(c) * MIN_SPAN_REL);
  let span = hi - lo;
  if (span < minSpan) span = minSpan;
  if (span > MAX_SPAN) span = MAX_SPAN;
  return [c - span / 2, c + span / 2];
}
function setView(v) {
  if (![v.xMin, v.xMax, v.yMin, v.yMax].every(Number.isFinite)) return;
  const [xMin, xMax] = clampAxis(v.xMin, v.xMax);
  const [yMin, yMax] = clampAxis(v.yMin, v.yMax);
  view = { xMin, xMax, yMin, yMax };
  syncViewportInputs();
  requestDraw();
}

// ===== Zeichnen =====
let drawPending = false;
function requestDraw() {
  if (drawPending) return;
  drawPending = true;
  requestAnimationFrame(() => { drawPending = false; draw(); });
}

function niceStep(range, targetDivs) {
  const raw = range / targetDivs;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const nice = norm < 1.5 ? 1 : norm < 3.5 ? 2 : norm < 7.5 ? 5 : 10;
  return nice * mag;
}

// Gitterwerte über einen Ganzzahlindex (kein Aufsummieren → keine Endlosschleife)
function gridValues(min, max, st) {
  const out = [];
  const k0 = Math.ceil(min / st), k1 = Math.floor(max / st);
  for (let k = k0; k <= k1 && out.length < 400; k++) out.push(k * st);
  return out;
}

function fmtTick(v, st) {
  if (Math.abs(v) < st * 1e-6) return '0';
  if (Math.abs(v) >= 1e7) return v.toExponential(2);
  const d = Math.min(12, Math.max(0, -Math.floor(Math.log10(st) + 1e-9)));
  return v.toFixed(d);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f5f2eb';
  ctx.fillRect(0, 0, W, H);

  const xRange = view.xMax - view.xMin;
  const yRange = view.yMax - view.yMin;

  // --- Gitter ---
  const xStep = niceStep(xRange, Math.max(2, Math.round(W / 90)));
  const yStep = niceStep(yRange, Math.max(2, Math.round(H / 70)));
  const xs = gridValues(view.xMin, view.xMax, xStep);
  const ys = gridValues(view.yMin, view.yMax, yStep);

  ctx.strokeStyle = '#ddd8cf';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath();
  for (const x of xs) { const [sx] = worldToScreen(x, 0); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); }
  for (const y of ys) { const [, sy] = worldToScreen(0, y); ctx.moveTo(0, sy); ctx.lineTo(W, sy); }
  ctx.stroke();

  // --- Achsen ---
  const [ox, oy] = worldToScreen(0, 0);
  const xAxisVisible = oy >= 0 && oy <= H;
  const yAxisVisible = ox >= 0 && ox <= W;
  const axisY = Math.max(0, Math.min(H, oy));
  const axisX = Math.max(0, Math.min(W, ox));
  ctx.strokeStyle = '#9a9080';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (xAxisVisible) { ctx.moveTo(0, axisY); ctx.lineTo(W, axisY); }
  if (yAxisVisible) { ctx.moveTo(axisX, 0); ctx.lineTo(axisX, H); }
  ctx.stroke();

  // --- Beschriftung ---
  ctx.fillStyle = '#7a7268';
  ctx.font = '10px Cascadia Code, Fira Code, Consolas, Menlo, monospace';

  ctx.textAlign = 'center';
  const labelY = Math.min(H - 6, Math.max(14, axisY + 14));
  for (const x of xs) {
    if (Math.abs(x) < xStep * 1e-6) continue;
    const [sx] = worldToScreen(x, 0);
    ctx.fillText(fmtTick(x, xStep), sx, labelY);
  }
  ctx.textAlign = 'right';
  const labelX = Math.min(W - 4, Math.max(40, axisX - 6));
  for (const y of ys) {
    if (Math.abs(y) < yStep * 1e-6) continue;
    const [, sy] = worldToScreen(0, y);
    ctx.fillText(fmtTick(y, yStep), labelX, sy + 4);
  }
  if (xAxisVisible && yAxisVisible) ctx.fillText('0', axisX - 6, axisY + 14);

  // --- Funktionen ---
  // Stützstellen auf Vielfache der Schrittweite legen; bei zu vielen vergröbern
  let dx = step;
  let coarsened = false;
  if (xRange / dx > MAX_SAMPLES) { dx = xRange / MAX_SAMPLES; coarsened = true; }
  const k0 = Math.floor(view.xMin / dx);
  const k1 = Math.ceil(view.xMax / dx);
  const nSamples = k1 - k0 + 1;
  const showDots = dx / xRange * W >= 6;

  // y begrenzen, damit Canvas keine Riesenkoordinaten bekommt
  const yLo = view.yMin - 10 * yRange;
  const yHi = view.yMax + 10 * yRange;

  for (const fn of functions) {
    if (!fn.visible || !fn.compiled) continue;

    ctx.strokeStyle = fn.color;
    ctx.fillStyle = fn.color;
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();

    let penDown = false;
    let prevY = null;
    const dots = [];

    for (let k = k0; k <= k1; k++) {
      const x = k * dx;
      let y;
      try { y = fn.compiled(x); } catch { y = NaN; }

      if (typeof y !== 'number' || !Number.isFinite(y)) { penDown = false; prevY = null; continue; }

      // Sprungstelle (z. B. tan, 1/x): Linie unterbrechen
      if (prevY !== null && Math.abs(y - prevY) > yRange * 2) penDown = false;
      prevY = y;

      const [sx, sy] = worldToScreen(x, Math.max(yLo, Math.min(yHi, y)));
      if (penDown) ctx.lineTo(sx, sy); else { ctx.moveTo(sx, sy); penDown = true; }
      if (showDots && y >= view.yMin && y <= view.yMax) dots.push(sx, sy);
    }
    ctx.stroke();

    for (let i = 0; i < dots.length; i += 2) {
      ctx.beginPath();
      ctx.arc(dots[i], dots[i + 1], 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const info = document.getElementById('stepInfo');
  info.textContent = coarsened
    ? `Auf ${fmtSci(dx)} vergröbert (max. ${MAX_SAMPLES.toLocaleString('de-DE')} Punkte)`
    : `${nSamples.toLocaleString('de-DE')} Stützstellen je Funktion`;
}

function fmtSci(v) { return Number(v.toPrecision(3)).toString(); }

// ===== Funktionen verwalten =====
function compileSafe(expr) {
  try { return { compiled: compileExpr(expr), error: null }; }
  catch (e) { return { compiled: null, error: e.message }; }
}

function addFunction(expr) {
  expr = normalizeExpr(expr.trim());
  if (!expr) return;
  const { compiled, error } = compileSafe(expr);
  if (error) showToast(error);
  const color = FN_COLORS[fnIdCounter % FN_COLORS.length];
  functions.push({ id: fnIdCounter++, expr, compiled, color, visible: true, error });
  renderFnList();
  draw();
}

function addFromInput() {
  const input = document.getElementById('fnInput');
  if (!input.value.trim()) return;
  addFunction(input.value);
  input.value = '';
}

function removeFunction(id) {
  functions = functions.filter(f => f.id !== id);
  renderFnList();
  draw();
}

function toggleVisible(id) {
  const fn = functions.find(f => f.id === id);
  if (fn) fn.visible = !fn.visible;
  renderFnList();
  draw();
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderFnList() {
  const list = document.getElementById('fnList');
  if (functions.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:12px;padding:20px 0;font-family:var(--font-mono);">Noch keine Funktionen.<br>Füge oben eine hinzu.</div>';
    return;
  }
  list.innerHTML = functions.map(fn => `
    <div class="fn-item${fn.visible ? '' : ' hidden-fn'}${fn.error ? ' has-error' : ''}" data-fnid="${fn.id}">
      <div class="fn-swatch" style="background:${fn.color}"></div>
      <div class="fn-label" title="${escHtml(fn.expr)}">
        <span class="fn-expr"><span class="fn-prefix-lbl">f(x) = </span>${escHtml(fn.expr)}</span>
        ${fn.error ? `<span class="fn-error-badge">⚠ ${escHtml(fn.error)}</span>` : ''}
      </div>
      <div class="fn-actions">
        <button class="fn-btn" data-act="toggle" title="${fn.visible ? 'Ausblenden' : 'Einblenden'}">${fn.visible ? '●' : '○'}</button>
        <button class="fn-btn edit" data-act="edit" title="Bearbeiten">✎</button>
        <button class="fn-btn del" data-act="del" title="Löschen">✕</button>
      </div>
    </div>`).join('');
}

// Ereignisdelegation für die Liste
document.getElementById('fnList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = Number(btn.closest('.fn-item').dataset.fnid);
  switch (btn.dataset.act) {
    case 'toggle':  toggleVisible(id); break;
    case 'edit':    startEdit(id); break;
    case 'del':     removeFunction(id); break;
    case 'confirm': confirmEdit(id); break;
    case 'cancel':  renderFnList(); break;
  }
});

// ===== Bearbeiten =====
function attachNormalizer(inp) {
  inp.addEventListener('input', () => {
    const raw = inp.value;
    const norm = normalizeExpr(raw);
    if (norm !== raw) {
      const pos = Math.max(0, inp.selectionStart + (norm.length - raw.length));
      inp.value = norm;
      inp.setSelectionRange(pos, pos);
    }
  });
}

function startEdit(id) {
  const fn = functions.find(f => f.id === id);
  if (!fn) return;
  renderFnList();   // evtl. offene andere Bearbeitung schließen
  const item = document.querySelector(`#fnList [data-fnid="${id}"]`);
  if (!item) return;

  item.classList.add('editing');
  item.innerHTML = `
    <div class="fn-swatch" style="background:${fn.color}"></div>
    <div class="fn-edit-wrap">
      <div class="fn-edit-prefix">f(x) =</div>
      <input class="fn-edit-input" value="${escHtml(fn.expr)}" autocomplete="off" spellcheck="false" autocapitalize="off">
    </div>
    <div class="fn-actions">
      <button class="fn-btn confirm" data-act="confirm" title="Übernehmen (Enter)">✓</button>
      <button class="fn-btn del" data-act="cancel" title="Abbrechen (Esc)">✕</button>
    </div>`;

  const inp = item.querySelector('.fn-edit-input');
  inp.focus();
  inp.select();
  attachNormalizer(inp);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); confirmEdit(id); }
    if (e.key === 'Escape') { e.preventDefault(); renderFnList(); }
  });
}

function confirmEdit(id) {
  const fn = functions.find(f => f.id === id);
  const inp = document.querySelector(`#fnList [data-fnid="${id}"] .fn-edit-input`);
  if (!fn || !inp) return;
  const newExpr = normalizeExpr(inp.value.trim());
  if (!newExpr) return;
  const { compiled, error } = compileSafe(newExpr);
  if (error) showToast(error);
  Object.assign(fn, { expr: newExpr, compiled, error });
  renderFnList();
  draw();
}

// ===== Ansichtsbereich =====
const vcIds = ['xMin', 'xMax', 'yMin', 'yMax'];
function applyViewport() {
  const [xMin, xMax, yMin, yMax] = vcIds.map(id => parseFloat(document.getElementById(id).value));
  if (![xMin, xMax, yMin, yMax].every(Number.isFinite) || xMin >= xMax || yMin >= yMax) {
    showToast('Ungültiger Bereich: min muss kleiner als max sein');
    syncViewportInputs();
    return;
  }
  setView({ xMin, xMax, yMin, yMax });
}
vcIds.forEach(id => document.getElementById(id).addEventListener('change', applyViewport));

function syncViewportInputs() {
  vcIds.forEach(id => {
    const el = document.getElementById(id);
    if (document.activeElement !== el) el.value = parseFloat(view[id].toPrecision(6));
  });
}

function zoom(factor) {
  const cx = (view.xMin + view.xMax) / 2;
  const cy = (view.yMin + view.yMax) / 2;
  const hw = (view.xMax - view.xMin) / 2 * factor;
  const hh = (view.yMax - view.yMin) / 2 * factor;
  setView({ xMin: cx - hw, xMax: cx + hw, yMin: cy - hh, yMax: cy + hh });
}

document.querySelectorAll('.zoom-btn[data-zoom]').forEach(b =>
  b.addEventListener('click', () => zoom(parseFloat(b.dataset.zoom))));
document.getElementById('btnReset').addEventListener('click', () => setView({ ...DEFAULT_VIEW }));

// ===== Schrittweite =====
document.getElementById('stepRow').addEventListener('click', e => {
  const b = e.target.closest('.step-btn');
  if (!b) return;
  step = parseFloat(b.dataset.step);
  document.querySelectorAll('.step-btn').forEach(x => x.classList.toggle('active', x === b));
  draw();
});

// ===== Verschieben / Zoomen (Maus, Stift, Touch) =====
const pointers = new Map();
let gesture = null;

function startGesture() {
  const pts = [...pointers.values()];
  if (pts.length === 1) gesture = { type: 'pan', p0: pts[0], view0: { ...view } };
  else if (pts.length >= 2) gesture = { type: 'pinch', a0: pts[0], b0: pts[1], view0: { ...view } };
  else gesture = null;
  canvas.classList.toggle('dragging', !!gesture);
}

function applyGesture() {
  if (!gesture) return;
  const v0 = gesture.view0;
  const spanX = v0.xMax - v0.xMin, spanY = v0.yMax - v0.yMin;

  if (gesture.type === 'pan') {
    const p = [...pointers.values()][0];
    const dx = (p[0] - gesture.p0[0]) / W * spanX;
    const dy = (p[1] - gesture.p0[1]) / H * spanY;
    setView({ xMin: v0.xMin - dx, xMax: v0.xMax - dx, yMin: v0.yMin + dy, yMax: v0.yMax + dy });
  } else {
    const [a, b] = [...pointers.values()];
    const m0 = [(gesture.a0[0] + gesture.b0[0]) / 2, (gesture.a0[1] + gesture.b0[1]) / 2];
    const m1 = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const d0 = Math.hypot(gesture.a0[0] - gesture.b0[0], gesture.a0[1] - gesture.b0[1]);
    const d1 = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (d0 < 1 || d1 < 1) return;
    const f = d0 / d1;
    const [wx, wy] = screenToWorld(m0[0], m0[1], v0);   // Weltpunkt unter der Startmitte
    const nsx = spanX * f, nsy = spanY * f;
    const xMin = wx - (m1[0] / W) * nsx;
    const yMin = wy - ((H - m1[1]) / H) * nsy;
    setView({ xMin, xMax: xMin + nsx, yMin, yMax: yMin + nsy });
  }
}

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, eventPos(e));
  startGesture();
});

canvas.addEventListener('pointermove', e => {
  const pos = eventPos(e);
  const [wx, wy] = screenToWorld(pos[0], pos[1]);
  document.getElementById('cursorInfo').textContent =
    'x = ' + wx.toPrecision(4) + '   y = ' + wy.toPrecision(4);
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, pos);
  applyGesture();
});

function endPointer(e) {
  if (!pointers.delete(e.pointerId)) return;
  startGesture();   // verbleibende Finger neu als Ausgangslage
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [sx, sy] = eventPos(e);
  const [wx, wy] = screenToWorld(sx, sy);
  const factor = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  setView({
    xMin: wx + (view.xMin - wx) * factor,
    xMax: wx + (view.xMax - wx) * factor,
    yMin: wy + (view.yMin - wy) * factor,
    yMax: wy + (view.yMax - wy) * factor,
  });
}, { passive: false });

// ===== Toast =====
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== Beispiele =====
function buildExamples() {
  const list = document.getElementById('examplesList');
  for (const ex of EXAMPLES) {
    const btn = document.createElement('button');
    btn.className = 'ex-btn';
    btn.innerHTML = `<span>${escHtml(ex.label)}</span><span class="ex-cat">${ex.cat}</span>`;
    btn.addEventListener('click', () => addFunction(ex.label));
    list.appendChild(btn);
  }
}

// ===== Eingabe =====
const fnInputEl = document.getElementById('fnInput');
attachNormalizer(fnInputEl);
fnInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addFromInput(); });
document.getElementById('btnAdd').addEventListener('click', addFromInput);

// ===== Start =====
buildExamples();
renderFnList();
resize();
addFunction('sin(x)');
addFunction('x^2/10');
</script>
</body>
