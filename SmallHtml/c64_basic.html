<script>
'use strict';
/* ============================================================
   COMMODORE 64 - BASIC V2 EMULATION
   Reine Software-Nachbildung des BASIC-Interpreters und des
   Bildschirmeditors, kein echter 6502/VIC/SID.
   ============================================================ */

const COLS = 40;
const ROWS = 25;

// C64-Farbpalette (PEPTO), Index 0-15
const C64_COLORS = [
  '#000000', // 0 Black
  '#FFFFFF', // 1 White
  '#68372B', // 2 Red
  '#70A4B2', // 3 Cyan
  '#6F3D86', // 4 Purple
  '#588D43', // 5 Green
  '#352879', // 6 Blue
  '#B8C76F', // 7 Yellow
  '#6F4F25', // 8 Orange
  '#433900', // 9 Brown
  '#9A6759', // 10 Light Red
  '#444444', // 11 Dark Grey
  '#6C6C6C', // 12 Grey
  '#9AD284', // 13 Light Green
  '#6C5EB5', // 14 Light Blue
  '#959595', // 15 Light Grey
];

// CHR$-Code -> Farbindex (PETSCII-Farbsteuercodes)
const CHR_COLOR_MAP = {
  144: 0, 5: 1, 28: 2, 159: 3, 156: 4, 30: 5, 31: 6, 158: 7,
  129: 8, 149: 9, 150: 10, 151: 11, 152: 12, 153: 13, 154: 14, 155: 15,
};

// ---------------------------------------------------------
// PETSCII / Bildschirmcode
// ---------------------------------------------------------
// Der eingebettete Zeichensatz ist nach Bildschirmcode + 0xE000 indiziert.
// Buchstaben, Ziffern und Satzzeichen (Bildschirmcode 1-63) werden als
// normales ASCII abgelegt, alles andere als E000+Bildschirmcode.

function isControlCode(code) {
  return code < 32 || (code >= 128 && code < 160);
}

// PETSCII-Codes, die als Zeichen aus dem eingebetteten Zeichensatz
// (statt als ASCII) dargestellt werden: Pfund, Pfeil hoch, Pfeil links
// sowie alle Grafikzeichen.
function isPetsciiGraphic(code) {
  return code === 92 || code === 94 || code === 95 || (code >= 96 && code <= 127) || code >= 160;
}

function petsciiToScreenCode(code) {
  if (code >= 32 && code <= 63) return code;
  if (code >= 64 && code <= 95) return code - 64;
  if (code >= 96 && code <= 127) return code - 32;
  if (code >= 160 && code <= 191) return code - 64;
  if (code >= 192 && code <= 223) return code - 128;
  if (code >= 224 && code <= 254) return code - 128;
  if (code === 255) return 94;
  return code;
}

// CHR$(n) -> Zeichen im internen Format
function petsciiChr(code) {
  if (isPetsciiGraphic(code)) return String.fromCharCode(0xE000 + petsciiToScreenCode(code));
  return String.fromCharCode(code);
}

// Bildschirmcode (0-127) -> kanonischer PETSCII-Code
function screenCodeToPetscii(sc) {
  if (sc >= 0 && sc <= 31) return sc + 64;
  if (sc >= 32 && sc <= 63) return sc;
  if (sc >= 64 && sc <= 95) return sc + 32;
  if (sc >= 96 && sc <= 127) return sc + 64;
  return sc;
}

// Bildschirmcode -> darstellbares Zeichen
function scToChar(sc) {
  sc &= 127;
  if (sc === 0) return '@';
  if (sc <= 26) return String.fromCharCode(64 + sc);
  if (sc === 27) return '[';
  if (sc === 29) return ']';
  if (sc >= 32 && sc <= 63) return String.fromCharCode(sc);
  return String.fromCharCode(0xE000 + sc);
}

// Darstellbares Zeichen -> Bildschirmcode (0-127)
function charToSc(ch) {
  const cp = ch.charCodeAt(0);
  if (cp >= 0xE000 && cp <= 0xE0FF) return (cp - 0xE000) & 127;
  if (cp === 64) return 0;
  if (cp >= 65 && cp <= 90) return cp - 64;
  if (cp >= 97 && cp <= 122) return cp - 96;
  if (cp >= 32 && cp <= 63) return cp;
  if (cp === 91) return 27;
  if (cp === 92 || cp === 163) return 28;
  if (cp === 93) return 29;
  if (cp === 94) return 30;
  if (cp === 95) return 31;
  return 32;
}

// Zeichen im internen Format -> PETSCII-Code (für ASC)
function petsciiCodeOf(ch) {
  const cp = ch.charCodeAt(0);
  if (cp >= 0xE000 && cp <= 0xE0FF) return screenCodeToPetscii((cp - 0xE000) & 127);
  if (cp === 163) return 92;
  if (cp >= 97 && cp <= 122) return cp - 32;
  return cp & 255;
}

// Steuercode -> reverses Ersatzzeichen (Darstellung im Quote-Modus)
function controlGlyph(code) {
  return scToChar(code < 32 ? code : code - 128 + 64);
}

// Zeichen für die Ausgabe auf dem Bildschirm aufbereiten
function displayChar(ch) {
  const cp = ch.charCodeAt(0);
  if (cp >= 97 && cp <= 122) return String.fromCharCode(cp - 32);
  if (cp === 92 || cp === 163) return ''; // Pfund
  if (cp === 94) return '';               // Pfeil hoch
  if (cp === 95) return '';               // Pfeil links
  return ch;
}

// ---------------------------------------------------------
// BASIC-V2-Tastatur-Abkürzungen (Keyword Abbreviations)
// ---------------------------------------------------------
// Ein oder zwei normale Buchstaben, gefolgt von SHIFT+Buchstabe (das als
// Grafikzeichen erscheint), stehen für ein Schlüsselwort. Expandiert wird
// beim Übernehmen der Zeile (RETURN). Tabelle nach C64 Programmer's
// Reference Guide, Table 2-1.
const KEYWORD_ABBREV_3 = {
  'CLO': 'CLOSE', 'GOS': 'GOSUB', 'LEF': 'LEFT$', 'RES': 'RESTORE',
  'RET': 'RETURN', 'STE': 'STEP', 'STR': 'STR$',
};
const KEYWORD_ABBREV_2 = {
  'AB': 'ABS', 'AN': 'AND', 'AS': 'ASC', 'AT': 'ATN', 'CH': 'CHR$', 'CL': 'CLR',
  'CM': 'CMD', 'CO': 'CONT', 'DA': 'DATA', 'DE': 'DEF', 'DI': 'DIM', 'EN': 'END',
  'EX': 'EXP', 'FO': 'FOR', 'FR': 'FRE', 'GE': 'GET', 'GO': 'GOTO', 'IN': 'INPUT#',
  'LE': 'LET', 'LI': 'LIST', 'LO': 'LOAD', 'MI': 'MID$', 'NE': 'NEXT', 'NO': 'NOT',
  'OP': 'OPEN', 'PE': 'PEEK', 'PO': 'POKE', 'PR': 'PRINT#', 'RE': 'READ',
  'RI': 'RIGHT$', 'RN': 'RND', 'RU': 'RUN', 'SA': 'SAVE', 'SG': 'SGN', 'SI': 'SIN',
  'SP': 'SPC(', 'SQ': 'SQR', 'ST': 'STOP', 'SY': 'SYS', 'TA': 'TAB(', 'TH': 'THEN',
  'US': 'USR', 'VA': 'VAL', 'VE': 'VERIFY', 'WA': 'WAIT',
};
const SHIFT_LETTER_GRAPHIC_BASE = 0xE041; // SHIFT+A ... SHIFT+Z

function expandKeywordAbbreviations(line) {
  let result = '';
  let inString = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inString = !inString; result += ch; continue; }
    if (!inString) {
      const cp = line.charCodeAt(i);
      if (cp >= SHIFT_LETTER_GRAPHIC_BASE && cp <= SHIFT_LETTER_GRAPHIC_BASE + 25) {
        const shiftLetter = String.fromCharCode(65 + (cp - SHIFT_LETTER_GRAPHIC_BASE));
        if (/[A-Z]{2}$/.test(result)) {
          const kw = KEYWORD_ABBREV_3[result.slice(-2) + shiftLetter];
          if (kw) { result = result.slice(0, -2) + kw; continue; }
        }
        if (/[A-Z]$/.test(result)) {
          const kw = KEYWORD_ABBREV_2[result.slice(-1) + shiftLetter];
          if (kw) { result = result.slice(0, -1) + kw; continue; }
        }
      }
    }
    result += ch;
  }
  return result;
}

// ============================================================
// BILDSCHIRM
// ============================================================
let screenBuf = [];   // Zeichen pro Zelle
let screenAttr = [];  // true = revers
let screenColor = []; // Farbindex pro Zelle
let rowLink = [];     // true = Zeile setzt die vorherige logische Zeile fort (max. 80 Zeichen)
for (let r = 0; r < ROWS; r++) {
  screenBuf.push(new Array(COLS).fill(' '));
  screenAttr.push(new Array(COLS).fill(false));
  screenColor.push(new Array(COLS).fill(14));
  rowLink.push(false);
}

let borderColor = 14;      // Rahmen: Hellblau
let bgColor = 6;           // Hintergrund: Blau
let currentTextColor = 14; // Schrift: Hellblau
let reverseMode = false;   // RVS ON bei Ausgabe
let outputQuote = false;   // Quote-Modus bei Ausgabe
let reverseTyping = false; // RVS ON beim Tippen

let cursorRow = 0;
let cursorCol = 0;
let cursorVisible = true;
let dirty = true;

const screenEl = document.getElementById('screen');
const frameEl = document.getElementById('frame');
const hiddenInput = document.getElementById('hidden-input');

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function cursorEnabled() {
  return state === 'idle' || state === 'input';
}

function render() {
  const bgHex = C64_COLORS[bgColor];
  const showCur = cursorVisible && cursorEnabled();
  const lines = [];
  for (let r = 0; r < ROWS; r++) {
    let line = '';
    let runKey = null, runText = '';
    for (let c = 0; c < COLS; c++) {
      const isCur = showCur && r === cursorRow && c === cursorCol;
      const rev = screenAttr[r][c] !== isCur;
      const col = isCur ? currentTextColor : screenColor[r][c];
      const key = (rev ? 'r' : 'n') + col;
      if (key !== runKey) {
        if (runKey !== null) line += renderRun(runKey, runText, bgHex);
        runKey = key; runText = '';
      }
      runText += screenBuf[r][c];
    }
    line += renderRun(runKey, runText, bgHex);
    lines.push(line);
  }
  screenEl.innerHTML = lines.join('\n');
  const borderHex = C64_COLORS[borderColor];
  frameEl.style.background = borderHex;
  frameEl.style.borderColor = borderHex;
  screenEl.style.background = bgHex;
}

function renderRun(key, text, bgHex) {
  const hex = C64_COLORS[+key.slice(1)];
  const esc = escapeHtml(text);
  if (key[0] === 'r') {
    return '<span class="rv" style="background:' + hex + ';color:' + bgHex + '">' + esc + '</span>';
  }
  return '<span style="color:' + hex + '">' + esc + '</span>';
}

function renderLoop() {
  if (dirty) { dirty = false; render(); }
  requestAnimationFrame(renderLoop);
}

// Cursor blinkt etwa alle 20 Jiffies
setInterval(() => { cursorVisible = !cursorVisible; dirty = true; }, 333);

// ---------------------------------------------------------
// Bildschirm-Grundoperationen
// ---------------------------------------------------------
function scrollUp() {
  screenBuf.shift(); screenAttr.shift(); screenColor.shift(); rowLink.shift();
  screenBuf.push(new Array(COLS).fill(' '));
  screenAttr.push(new Array(COLS).fill(false));
  screenColor.push(new Array(COLS).fill(currentTextColor));
  rowLink.push(false);
  rowLink[0] = false;
  if (inputState) inputState.startRow--;
  dirty = true;
}

// Wagenrücklauf: Anfang der nächsten Zeile, die eine neue logische Zeile beginnt
function newline() {
  cursorCol = 0;
  cursorRow++;
  if (cursorRow >= ROWS) { scrollUp(); cursorRow = ROWS - 1; }
  rowLink[cursorRow] = false;
  dirty = true;
}

function ensureNewLine() {
  if (cursorCol !== 0) newline();
}

// Cursor eine Position weiter; link = true verbindet beim Umbruch die
// Folgezeile mit der aktuellen zu einer logischen Zeile (max. 2 Zeilen)
function wrapForward(link) {
  cursorCol++;
  if (cursorCol >= COLS) {
    cursorCol = 0;
    const isContinuation = rowLink[cursorRow];
    cursorRow++;
    if (cursorRow >= ROWS) { scrollUp(); cursorRow = ROWS - 1; }
    if (link) rowLink[cursorRow] = !isContinuation;
  }
  dirty = true;
}

function cursorLeftMove() {
  if (cursorCol > 0) cursorCol--;
  else if (cursorRow > 0) { cursorRow--; cursorCol = COLS - 1; }
  dirty = true;
}
function cursorUpMove() {
  if (cursorRow > 0) cursorRow--;
  dirty = true;
}
function cursorDownMove() {
  cursorRow++;
  if (cursorRow >= ROWS) { scrollUp(); cursorRow = ROWS - 1; }
  dirty = true;
}
function moveRight(n) {
  for (let i = 0; i < n; i++) wrapForward(true);
}
function setCursor(r, c) {
  cursorRow = Math.min(ROWS - 1, Math.max(0, r));
  cursorCol = Math.min(COLS - 1, Math.max(0, c));
  dirty = true;
}

function putCell(ch, rev) {
  screenBuf[cursorRow][cursorCol] = ch;
  screenAttr[cursorRow][cursorCol] = !!rev;
  screenColor[cursorRow][cursorCol] = currentTextColor;
  wrapForward(true);
}

function clearScreen() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      screenBuf[r][c] = ' ';
      screenAttr[r][c] = false;
      screenColor[r][c] = currentTextColor;
    }
    rowLink[r] = false;
  }
  cursorRow = 0;
  cursorCol = 0;
  dirty = true;
}

// --- logische Zeilen (bis 80 Zeichen über zwei Bildschirmzeilen) ---
function logicalStart(r) {
  while (r > 0 && rowLink[r]) r--;
  return r;
}
function logicalRowCount(start) {
  return (start + 1 < ROWS && rowLink[start + 1]) ? 2 : 1;
}
function logicalPos() {
  return (cursorRow - logicalStart(cursorRow)) * COLS + cursorCol;
}

// Liest eine logische Zeile vom Bildschirm. Reverse Zeichen (im
// Quote-Modus eingegebene Steuercodes) werden in Steuercodes zurückgewandelt.
function readLogicalLine(start) {
  const n = logicalRowCount(start);
  let s = '';
  for (let r = start; r < start + n; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = screenBuf[r][c];
      if (screenAttr[r][c]) {
        const sc = charToSc(ch);
        if (sc < 32) { s += String.fromCharCode(sc); continue; }
        if (sc >= 64 && sc < 96) { s += String.fromCharCode(sc + 64); continue; }
      }
      s += ch;
    }
  }
  return s.replace(/ +$/, '');
}

function moveBelowLogical(start) {
  cursorRow = start + logicalRowCount(start) - 1;
  newline();
}

function cellAt(start, i) {
  return [start + Math.floor(i / COLS), i % COLS];
}

// INST/DEL: Zeichen links vom Cursor löschen, Rest der logischen Zeile nachziehen
function editorDelete() {
  const start = logicalStart(cursorRow);
  const total = logicalRowCount(start) * COLS;
  let pos = (cursorRow - start) * COLS + cursorCol;
  if (pos === 0) return;
  pos--;
  for (let i = pos; i < total - 1; i++) {
    const [r1, c1] = cellAt(start, i);
    const [r2, c2] = cellAt(start, i + 1);
    screenBuf[r1][c1] = screenBuf[r2][c2];
    screenAttr[r1][c1] = screenAttr[r2][c2];
    screenColor[r1][c1] = screenColor[r2][c2];
  }
  const [rl, cl] = cellAt(start, total - 1);
  screenBuf[rl][cl] = ' ';
  screenAttr[rl][cl] = false;
  [cursorRow, cursorCol] = cellAt(start, pos);
  dirty = true;
}

// SHIFT+INST/DEL: Leerzeichen am Cursor einfügen
function editorInsert() {
  const start = logicalStart(cursorRow);
  const total = logicalRowCount(start) * COLS;
  const pos = (cursorRow - start) * COLS + cursorCol;
  for (let i = total - 1; i > pos; i--) {
    const [r1, c1] = cellAt(start, i);
    const [r2, c2] = cellAt(start, i - 1);
    screenBuf[r1][c1] = screenBuf[r2][c2];
    screenAttr[r1][c1] = screenAttr[r2][c2];
    screenColor[r1][c1] = screenColor[r2][c2];
  }
  screenBuf[cursorRow][cursorCol] = ' ';
  screenAttr[cursorRow][cursorCol] = false;
  dirty = true;
}

// ---------------------------------------------------------
// Textausgabe
// ---------------------------------------------------------
function outputControl(code) {
  switch (code) {
    case 147: clearScreen(); break;
    case 19: cursorRow = 0; cursorCol = 0; break;
    case 17: cursorDownMove(); break;
    case 145: cursorUpMove(); break;
    case 29: wrapForward(true); break;
    case 157: cursorLeftMove(); break;
    case 18: reverseMode = true; break;
    case 146: reverseMode = false; break;
    case 13: case 141:
      newline();
      reverseMode = false;
      outputQuote = false;
      break;
    case 20: editorDelete(); break;
    case 148: editorInsert(); break;
    default:
      if (CHR_COLOR_MAP[code] !== undefined) currentTextColor = CHR_COLOR_MAP[code];
      // übrige Steuercodes (z.B. 14/142 Zeichensatz) werden ignoriert
  }
  dirty = true;
}

// Ausgabe wie PRINT: Steuercodes werden ausgeführt, im Quote-Modus
// (nach einem ungeraden Anführungszeichen) aber revers angezeigt.
function printString(s) {
  for (const ch of s) {
    const code = ch.charCodeAt(0);
    if (code < 256 && isControlCode(code)) {
      if (outputQuote && code !== 13 && code !== 141 && code !== 20) {
        putCell(controlGlyph(code), !reverseMode);
      } else {
        outputControl(code);
      }
      continue;
    }
    if (ch === '"') outputQuote = !outputQuote;
    putCell(displayChar(ch), reverseMode);
  }
}

// Systemmeldungen (READY., Fehler ...)
function printSys(text) {
  for (const ch of text) putCell(displayChar(ch), false);
}
function printLine(text) {
  printSys(text);
  newline();
}

// LIST-Ausgabe: Steuercodes in Strings revers darstellen
function printListing(text) {
  for (const ch of text) {
    const code = ch.charCodeAt(0);
    if (code < 256 && isControlCode(code)) putCell(controlGlyph(code), true);
    else putCell(displayChar(ch), false);
  }
}

function bootScreen() {
  clearScreen();
  cursorRow = 1;
  printLine('    **** COMMODORE 64 BASIC V2 ****');
  newline();
  printLine(' 64K RAM SYSTEM  38911 BASIC BYTES FREE');
  newline();
  printLine('READY.');
}

// ============================================================
// BASIC-INTERPRETER
// ============================================================

class BasicError extends Error {
  constructor(code) {
    super(code);
    this.code = code;
  }
}
function err(code) { return new BasicError(code); }

// ---------------------------------------------------------
// Tokenizer ("Crunch") wie beim echten C64: Schlüsselwörter werden an
// jeder Stelle außerhalb von Strings erkannt, auch ohne Leerzeichen
// (FORI=1TO10). Reihenfolge = Token-Tabelle im BASIC-ROM.
// ---------------------------------------------------------
const KEYWORDS = [
  'END', 'FOR', 'NEXT', 'DATA', 'INPUT#', 'INPUT', 'DIM', 'READ', 'LET', 'GOTO', 'RUN',
  'IF', 'RESTORE', 'GOSUB', 'RETURN', 'REM', 'STOP', 'ON', 'WAIT', 'LOAD', 'SAVE',
  'VERIFY', 'DEF', 'POKE', 'PRINT#', 'PRINT', 'CONT', 'LIST', 'CLR', 'CMD', 'SYS',
  'OPEN', 'CLOSE', 'GET', 'NEW', 'TAB(', 'TO', 'FN', 'SPC(', 'THEN', 'NOT', 'STEP',
  'AND', 'OR', 'SGN', 'INT', 'ABS', 'USR', 'FRE', 'POS', 'SQR', 'RND', 'LOG', 'EXP',
  'COS', 'SIN', 'TAN', 'ATN', 'PEEK', 'LEN', 'STR$', 'VAL', 'ASC', 'CHR$', 'LEFT$',
  'RIGHT$', 'MID$', 'GO',
];

function matchKeyword(s, i) {
  for (const kw of KEYWORDS) {
    if (s.startsWith(kw, i)) return kw;
  }
  return null;
}

// Großbuchstaben außerhalb von Anführungszeichen
function upperOutsideQuotes(s) {
  let out = '', q = false;
  for (const ch of s) {
    if (ch === '"') q = !q;
    out += q ? ch : ch.toUpperCase();
  }
  return out;
}

// Liefert {toks, text}. Token-Typen:
//  K Schlüsselwort, N Zahl, S String, I Variable (2 signifikante Zeichen
//  + $/%), O Operator/Satzzeichen, R Rohtext (nach REM bzw. DATA).
// text = Zeile in LIST-Form (Schlüsselwörter ausgeschrieben, "?" -> PRINT).
function tokenizeLine(src) {
  const toks = [];
  let text = '';
  let i = 0;
  const n = src.length;
  while (i < n) {
    const ch = src[i];
    if (ch === ' ') { text += ' '; i++; continue; }
    if (ch === '"') {
      let j = i + 1;
      while (j < n && src[j] !== '"') j++;
      toks.push({ t: 'S', v: src.slice(i + 1, j) });
      text += src.slice(i, Math.min(j + 1, n));
      i = j + 1;
      continue;
    }
    if (ch === '?') { toks.push({ t: 'K', v: 'PRINT' }); text += 'PRINT'; i++; continue; }
    const kw = matchKeyword(src, i);
    if (kw) {
      toks.push({ t: 'K', v: kw });
      text += kw;
      i += kw.length;
      if (kw === 'REM') {
        toks.push({ t: 'R', v: src.slice(i) });
        text += src.slice(i);
        i = n;
      } else if (kw === 'DATA') {
        let j = i, q = false;
        while (j < n && (q || src[j] !== ':')) { if (src[j] === '"') q = !q; j++; }
        toks.push({ t: 'R', v: src.slice(i, j) });
        text += src.slice(i, j);
        i = j;
      }
      continue;
    }
    if ((ch >= '0' && ch <= '9') || ch === '.') {
      let j = i;
      while (j < n && src[j] >= '0' && src[j] <= '9') j++;
      if (src[j] === '.') { j++; while (j < n && src[j] >= '0' && src[j] <= '9') j++; }
      if (src[j] === 'E') {
        let k = j + 1;
        if (src[k] === '+' || src[k] === '-') k++;
        if (src[k] >= '0' && src[k] <= '9') {
          j = k;
          while (j < n && src[j] >= '0' && src[j] <= '9') j++;
        }
      }
      const s = src.slice(i, j);
      const v = s === '.' ? 0 : parseFloat(s);
      toks.push({ t: 'N', v: v });
      text += s;
      i = j;
      continue;
    }
    if (ch >= 'A' && ch <= 'Z') {
      let j = i + 1;
      while (j < n && /[A-Z0-9]/.test(src[j]) && !matchKeyword(src, j)) j++;
      let suffix = '';
      if (src[j] === '$' || src[j] === '%') { suffix = src[j]; j++; }
      toks.push({ t: 'I', v: src.slice(i, Math.min(i + 2, j)).replace(/[$%]$/, '') + suffix });
      text += src.slice(i, j);
      i = j;
      continue;
    }
    if (ch === '') { toks.push({ t: 'N', v: Math.PI }); text += ch; i++; continue; } // Pi
    if (ch === '') { toks.push({ t: 'O', v: '^' }); text += ch; i++; continue; } // Pfeil hoch
    toks.push({ t: 'O', v: ch });
    text += ch;
    i++;
  }
  return { toks, text };
}

// ---------------------------------------------------------
// Programmspeicher
// ---------------------------------------------------------
let program = new Map();   // Zeilennummer -> {text, toks}
let runLines = [];         // sortierte Zeilennummern
let lineIndex = new Map(); // Zeilennummer -> Index in runLines
let directoryLines = null; // nach LOAD"$": Verzeichnis für LIST

function rebuildLineIndex() {
  runLines = Array.from(program.keys()).sort((a, b) => a - b);
  lineIndex = new Map();
  runLines.forEach((ln, i) => lineIndex.set(ln, i));
}

// Programm wurde geändert: wie am C64 werden die Variablen gelöscht
// und CONT ist nicht mehr möglich.
function progChanged(keepVars) {
  rebuildLineIndex();
  if (!keepVars) clearVariables();
  contPos = null;
  dataItems = null;
  dataPtr = 0;
  directoryLines = null;
}

function storeLine(num, code) {
  code = code.replace(/^ +/, '');
  if (code.trim() === '') {
    program.delete(num);
  } else {
    const tk = tokenizeLine(upperOutsideQuotes(code));
    program.set(num, { text: tk.text, toks: tk.toks });
  }
}

function setProgramFromLines(lines, keepVars) {
  program.clear();
  for (const [num, code] of lines) storeLine(num, code);
  progChanged(keepVars);
}

function diskBlocks(entry) {
  const bytes = entry.lines.reduce((s, l) => s + l[1].length + 5, 2);
  return Math.max(1, Math.ceil(bytes / 254));
}

// Name mit Jokern * und ? suchen (wie am Laufwerk 1541)
function findDiskEntry(pattern) {
  const rx = new RegExp('^' + pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&')
    .replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
  return VIRTUAL_DISK.find(e => rx.test(e.name));
}

// Verzeichnis wie bei LOAD"$",8 + LIST
function buildDirectoryLines() {
  const lines = [];
  const diskNameField = '"DEMO DISK       "';
  lines.push([0, diskNameField + ' C6 2A', 2, 2 + diskNameField.length]);
  let used = 0;
  for (const entry of VIRTUAL_DISK) {
    const blocks = diskBlocks(entry);
    used += blocks;
    const blocksStr = String(blocks);
    const leftPad = ' '.repeat(Math.max(1, 5 - blocksStr.length));
    const nameField = '"' + entry.name + '"';
    const namePadded = nameField + ' '.repeat(Math.max(1, 19 - nameField.length));
    lines.push([blocks, leftPad + namePadded + 'PRG']);
  }
  lines.push([664 - used, 'BLOCKS FREE.']);
  return lines;
}

// ---------------------------------------------------------
// Variablen, Arrays, Funktionen
// ---------------------------------------------------------
let vars = new Map();    // "A", "AB$", "I%" ...
let arrays = new Map();  // gleiche Namen, eigener Namensraum
let fnDefs = new Map();  // DEF FN
let stack = [];          // gemeinsamer FOR/GOSUB-Stapel (wie am C64)
let stackBytes = 0;
const STACK_LIMIT = 180; // FOR = 18 Byte, GOSUB = 7 Byte (vereinfacht)

let dataItems = null;    // Liste {text, line} aller DATA-Werte
let dataPtr = 0;

function clearVariables() {
  vars.clear();
  arrays.clear();
  fnDefs.clear();
  stack = [];
  stackBytes = 0;
  dataPtr = 0;
}

function pushStack(frame) {
  const size = frame.type === 'for' ? 18 : 7;
  if (stackBytes + size > STACK_LIMIT) throw err('OUT OF MEMORY');
  stackBytes += size;
  stack.push(frame);
}
function truncateStack(len) {
  while (stack.length > len) {
    stackBytes -= stack.pop().type === 'for' ? 18 : 7;
  }
}

function toInt16(v) {
  const n = Math.floor(v);
  if (n < -32768 || n > 32767) throw err('ILLEGAL QUANTITY');
  return n;
}

function coerce(name, val) {
  if (name.endsWith('$')) {
    if (typeof val !== 'string') throw err('TYPE MISMATCH');
    return val;
  }
  if (typeof val !== 'number') throw err('TYPE MISMATCH');
  if (name.endsWith('%')) return toInt16(val);
  return val;
}

function getVar(name) {
  if (name === 'TI') return jiffies();
  if (name === 'TI$') return tiString();
  if (name === 'ST') return 0;
  const v = vars.get(name);
  if (v !== undefined) return v;
  return name.endsWith('$') ? '' : 0;
}

function assignVar(name, val) {
  if (name === 'TI' || name === 'ST') throw err('SYNTAX');
  if (name === 'TI$') {
    if (typeof val !== 'string') throw err('TYPE MISMATCH');
    setClock(val);
    return;
  }
  vars.set(name, coerce(name, val));
}

function makeArray(name, dims) {
  let size = 1;
  for (const d of dims) size *= d + 1;
  if (size > 200000) throw err('OUT OF MEMORY');
  return { dims: dims, data: new Array(size).fill(name.endsWith('$') ? '' : 0) };
}

// Nicht dimensionierte Arrays bekommen automatisch 0..10 je Dimension
function arrayFor(name, nDims) {
  let a = arrays.get(name);
  if (!a) {
    a = makeArray(name, new Array(nDims).fill(10));
    arrays.set(name, a);
  }
  if (a.dims.length !== nDims) throw err('BAD SUBSCRIPT');
  return a;
}

function arrIndex(a, idx) {
  let flat = 0, mult = 1;
  for (let d = 0; d < a.dims.length; d++) {
    const i = Math.floor(idx[d]);
    if (i < 0 || i > 32767) throw err('ILLEGAL QUANTITY');
    if (i > a.dims[d]) throw err('BAD SUBSCRIPT');
    flat += i * mult;
    mult *= a.dims[d] + 1;
  }
  return flat;
}

// --- Systemuhr TI / TI$ (Jiffies seit dem Einschalten) ---
let clockBase = performance.now();
function jiffies() {
  return Math.floor((performance.now() - clockBase) * 0.06) % 5184000;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function tiString() {
  const s = Math.floor(jiffies() / 60);
  return pad2(Math.floor(s / 3600) % 24) + pad2(Math.floor(s / 60) % 60) + pad2(s % 60);
}
function setClock(str) {
  if (!/^\d{6}$/.test(str)) throw err('ILLEGAL QUANTITY');
  const h = +str.slice(0, 2), m = +str.slice(2, 4), s = +str.slice(4, 6);
  if (h > 23 || m > 59 || s > 59) throw err('ILLEGAL QUANTITY');
  clockBase = performance.now() - ((h * 3600 + m * 60 + s) * 60) / 0.06;
}

// --- Zufallszahlen (RND) ---
let rndSeed = (Math.random() * 4294967296) >>> 0;
function rndNext() {
  rndSeed = (rndSeed + 0x6D2B79F5) >>> 0;
  let t = rndSeed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rnd(x) {
  if (x < 0) {
    // RND(negativ) setzt den Startwert: gleiches Argument -> gleiche Folge
    const f = new Float64Array([x]);
    const u = new Uint32Array(f.buffer);
    rndSeed = (u[0] ^ u[1]) >>> 0;
    return rndNext();
  }
  if (x === 0) return Math.random();
  return rndNext();
}

// --- Zahlen formatieren wie das BASIC-ROM ---
function fmtNumCore(n) {
  if (n === 0) return '0';
  const neg = n < 0;
  const parts = Math.abs(n).toExponential(8).split('e');
  const exp = parseInt(parts[1], 10);
  const digits = parts[0].replace('.', '').replace(/0+$/, '');
  let s;
  if (exp > 8 || exp < -2) {
    s = digits[0] + (digits.length > 1 ? '.' + digits.slice(1) : '') +
        'E' + (exp < 0 ? '-' : '+') + pad2(Math.abs(exp));
  } else if (exp >= 0) {
    s = digits.length <= exp + 1 ? digits.padEnd(exp + 1, '0')
                                 : digits.slice(0, exp + 1) + '.' + digits.slice(exp + 1);
  } else {
    s = '.' + '0'.repeat(-exp - 1) + digits;
  }
  return (neg ? '-' : '') + s;
}
// Führendes Leerzeichen bei positiven Zahlen (wie STR$)
function numToStr(n) {
  return (n < 0 ? '' : ' ') + fmtNumCore(n);
}

// Zahl aus INPUT/READ: muss vollständig gültig sein
function parseNumberStrict(s) {
  const t = s.replace(/ /g, '');
  if (t === '' || t === '.') return 0;
  if (!/^[+-]?(\d+\.?\d*|\.\d+)(E[+-]?\d+)?$/i.test(t)) return null;
  return parseFloat(t);
}

// VAL: liest so viel wie möglich, Leerzeichen werden ignoriert
function valOf(s) {
  const t = s.replace(/ /g, '');
  const m = t.match(/^[+-]?(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/i);
  return m ? parseFloat(m[0]) : 0;
}

// Komma-getrennte Felder (INPUT und DATA), Anführungszeichen optional
function splitFields(s) {
  const out = [];
  let i = 0;
  while (true) {
    while (s[i] === ' ') i++;
    let text = '';
    if (s[i] === '"') {
      i++;
      while (i < s.length && s[i] !== '"') text += s[i++];
      i++;
      while (i < s.length && s[i] !== ',') i++;
    } else {
      while (i < s.length && s[i] !== ',') text += s[i++];
      text = text.replace(/ +$/, '');
    }
    out.push(text);
    if (i < s.length && s[i] === ',') { i++; continue; }
    break;
  }
  return out;
}

// ---------------------------------------------------------
// Speicher (PEEK/POKE) mit einigen nachgebildeten Adressen
// ---------------------------------------------------------
const mem = new Uint8Array(65536);
let currentKeyCode = 64; // Speicherstelle 197: gedrückte Taste (64 = keine)
let shiftFlags = 0;      // Speicherstelle 653

function peekMem(a) {
  if (a >= 1024 && a < 2024) {
    const o = a - 1024, r = Math.floor(o / COLS), c = o % COLS;
    return charToSc(screenBuf[r][c]) | (screenAttr[r][c] ? 128 : 0);
  }
  if (a >= 55296 && a < 56296) {
    const o = a - 55296;
    return screenColor[Math.floor(o / COLS)][o % COLS];
  }
  switch (a) {
    case 53280: return 240 | borderColor;
    case 53281: return 240 | bgColor;
    case 646: return currentTextColor;
    case 199: return reverseMode ? 18 : 0;
    case 211: return cursorCol;
    case 214: return cursorRow;
    case 197: return currentKeyCode;
    case 198: return keyBuffer.length;
    case 653: return shiftFlags;
    case 160: return (jiffies() >> 16) & 255;
    case 161: return (jiffies() >> 8) & 255;
    case 162: return jiffies() & 255;
    case 53266: return Math.floor(performance.now() * 15.7) & 255; // Rasterzeile (grob)
    case 54299: case 54300: return Math.floor(Math.random() * 256); // SID-Oszillator 3
    case 56320: return 127; // Joystick Port 2: nichts gedrückt
    case 56321: return 255; // Joystick Port 1: nichts gedrückt
  }
  return mem[a];
}

function pokeMem(a, v) {
  mem[a] = v;
  if (a >= 1024 && a < 2024) {
    const o = a - 1024, r = Math.floor(o / COLS), c = o % COLS;
    screenBuf[r][c] = scToChar(v & 127);
    screenAttr[r][c] = v >= 128;
    dirty = true;
    return;
  }
  if (a >= 55296 && a < 56296) {
    const o = a - 55296;
    screenColor[Math.floor(o / COLS)][o % COLS] = v & 15;
    dirty = true;
    return;
  }
  switch (a) {
    case 53280: borderColor = v & 15; dirty = true; break;
    case 53281: bgColor = v & 15; dirty = true; break;
    case 646: currentTextColor = v & 15; break;
    case 199: reverseMode = v !== 0; break;
    case 198: keyBuffer.length = Math.min(keyBuffer.length, v); break;
  }
}

function freBytes() {
  let used = 0;
  for (const l of program.values()) used += l.text.length + 5;
  for (const [n, v] of vars) used += 7 + (typeof v === 'string' ? v.length : 0);
  for (const [n, a] of arrays) {
    used += 7 + a.data.length * (n.endsWith('%') ? 2 : n.endsWith('$') ? 3 : 5);
    if (n.endsWith('$')) for (const s of a.data) used += s.length;
  }
  let free = Math.max(0, 38911 - used);
  return free > 32767 ? free - 65536 : free; // FRE liefert einen vorzeichenbehafteten Wert
}

// ---------------------------------------------------------
// Ausführungszustand
// ---------------------------------------------------------
let state = 'idle';  // idle | run | input | wait
let T = [];          // aktuelle Token-Liste
let P = 0;           // Position darin
let curLi = -1;      // Index in runLines, -1 = Direktmodus
let stmtStart = 0;   // Beginn der aktuellen Anweisung
let flowChanged = false;
let contPos = null;  // Fortsetzungspunkt für CONT
let inputState = null;
let waitSpec = null;
let keyBuffer = [];  // Tastaturpuffer (max. 10 Zeichen wie am C64)
let breakRequested = false;
let resetRequested = false;
let pasteQueue = [];

let turbo = false;
const STATEMENTS_PER_MS = 1.0; // ungefähres Original-Tempo (~1000 Anweisungen/s)
let budget = 0;
let lastTick = 0;
let timer = null;

function curLineNum() {
  return curLi >= 0 ? runLines[curLi] : null;
}
function setPos(pos) {
  T = pos.toks; curLi = pos.li; P = pos.p;
  flowChanged = true;
}
function progPos() {
  return curLi >= 0 ? { toks: T, li: curLi, p: P } : null;
}
function gotoLine(num) {
  const idx = lineIndex.get(num);
  if (idx === undefined) throw err("UNDEF'D STATEMENT");
  curLi = idx;
  T = program.get(num).toks;
  P = 0;
  flowChanged = true;
}

// --- Token-Hilfen ---
function isOp(t, v) { return t !== undefined && t.t === 'O' && t.v === v; }
function isKw(t, v) { return t !== undefined && t.t === 'K' && t.v === v; }
function expectOp(v) { if (!isOp(T[P], v)) throw err('SYNTAX'); P++; }
function expectKw(v) { if (!isKw(T[P], v)) throw err('SYNTAX'); P++; }
function atStmtEnd() { return P >= T.length || isOp(T[P], ':'); }
function skipToStmtEnd() { while (!atStmtEnd()) P++; }

// ---------------------------------------------------------
// Ausdrucksauswertung (Rangfolge wie BASIC V2:
// ^  >  Vorzeichen  >  * /  >  + -  >  Vergleiche  >  NOT  >  AND  >  OR)
// ---------------------------------------------------------
function needNum(v) { if (typeof v !== 'number') throw err('TYPE MISMATCH'); return v; }
function needStr(v) { if (typeof v !== 'string') throw err('TYPE MISMATCH'); return v; }
function chk(x) {
  if (!isFinite(x) || Math.abs(x) >= 1.70141183e38) throw err('OVERFLOW');
  return x;
}
function evalExpr() { return parseOr(); }
function evalNum() { return needNum(evalExpr()); }
function evalStr() { return needStr(evalExpr()); }
function evalByte() {
  const n = Math.floor(evalNum());
  if (n < 0 || n > 255) throw err('ILLEGAL QUANTITY');
  return n;
}
function evalAddr() {
  const n = Math.floor(evalNum());
  if (n < 0 || n > 65535) throw err('ILLEGAL QUANTITY');
  return n;
}

function parseOr() {
  let l = parseAnd();
  while (isKw(T[P], 'OR')) {
    P++;
    const r = parseAnd();
    l = toInt16(needNum(l)) | toInt16(needNum(r));
  }
  return l;
}
function parseAnd() {
  let l = parseNot();
  while (isKw(T[P], 'AND')) {
    P++;
    const r = parseNot();
    l = toInt16(needNum(l)) & toInt16(needNum(r));
  }
  return l;
}
function parseNot() {
  if (isKw(T[P], 'NOT')) {
    P++;
    return ~toInt16(needNum(parseNot()));
  }
  return parseRel();
}
function parseRel() {
  let l = parseAdd();
  while (true) {
    const t = T[P];
    if (!t || t.t !== 'O' || '<>='.indexOf(t.v) < 0) break;
    let op = t.v;
    P++;
    const t2 = T[P];
    if (t2 && t2.t === 'O' && '<>='.indexOf(t2.v) >= 0 && t2.v !== op) { op += t2.v; P++; }
    const r = parseAdd();
    let c;
    if (typeof l === 'string' && typeof r === 'string') c = l < r ? -1 : (l > r ? 1 : 0);
    else if (typeof l === 'number' && typeof r === 'number') c = l < r ? -1 : (l > r ? 1 : 0);
    else throw err('TYPE MISMATCH');
    let res;
    switch (op) {
      case '=': res = c === 0; break;
      case '<>': case '><': res = c !== 0; break;
      case '<': res = c < 0; break;
      case '>': res = c > 0; break;
      case '<=': case '=<': res = c <= 0; break;
      case '>=': case '=>': res = c >= 0; break;
      default: throw err('SYNTAX');
    }
    l = res ? -1 : 0;
  }
  return l;
}
function parseAdd() {
  let l = parseMul();
  while (isOp(T[P], '+') || isOp(T[P], '-')) {
    const op = T[P++].v;
    const r = parseMul();
    if (op === '+') {
      if (typeof l === 'string' && typeof r === 'string') {
        l = l + r;
        if (l.length > 255) throw err('STRING TOO LONG');
      } else if (typeof l === 'number' && typeof r === 'number') {
        l = chk(l + r);
      } else {
        throw err('TYPE MISMATCH');
      }
    } else {
      l = chk(needNum(l) - needNum(r));
    }
  }
  return l;
}
function parseMul() {
  let l = parseUnary();
  while (isOp(T[P], '*') || isOp(T[P], '/')) {
    const op = T[P++].v;
    const r = needNum(parseUnary());
    needNum(l);
    if (op === '*') {
      l = chk(l * r);
    } else {
      if (r === 0) throw err('DIVISION BY ZERO');
      l = chk(l / r);
    }
  }
  return l;
}
function parseUnary() {
  if (isOp(T[P], '-')) { P++; return -needNum(parseUnary()); }
  if (isOp(T[P], '+')) { P++; return parseUnary(); }
  return parsePow();
}
// ^ wird von links nach rechts ausgewertet (2^3^2 = 64 wie am C64)
function parsePow() {
  let l = parsePrimary();
  while (isOp(T[P], '^')) {
    P++;
    const r = needNum(parsePowOperand());
    needNum(l);
    let v;
    if (l === 0 && r < 0) throw err('DIVISION BY ZERO');
    v = Math.pow(l, r);
    if (isNaN(v)) throw err('ILLEGAL QUANTITY');
    l = chk(v);
  }
  return l;
}
function parsePowOperand() {
  if (isOp(T[P], '-')) { P++; return -needNum(parsePowOperand()); }
  if (isOp(T[P], '+')) { P++; return parsePowOperand(); }
  return parsePrimary();
}

function parseSubscripts() {
  expectOp('(');
  const idx = [evalNum()];
  while (isOp(T[P], ',')) { P++; idx.push(evalNum()); }
  expectOp(')');
  return idx;
}

function parsePrimary() {
  const t = T[P];
  if (!t) throw err('SYNTAX');
  switch (t.t) {
    case 'N': P++; return t.v;
    case 'S': P++; return t.v;
    case 'O':
      if (t.v === '(') {
        P++;
        const v = evalExpr();
        expectOp(')');
        return v;
      }
      throw err('SYNTAX');
    case 'I': {
      P++;
      if (isOp(T[P], '(')) {
        const idx = parseSubscripts();
        const a = arrayFor(t.v, idx.length);
        return a.data[arrIndex(a, idx)];
      }
      return getVar(t.v);
    }
    case 'K':
      P++;
      return callFunction(t.v);
  }
  throw err('SYNTAX');
}

const ONE_ARG_FUNCS = new Set([
  'SGN', 'INT', 'ABS', 'USR', 'FRE', 'POS', 'SQR', 'RND', 'LOG', 'EXP', 'COS', 'SIN',
  'TAN', 'ATN', 'PEEK', 'LEN', 'STR$', 'VAL', 'ASC', 'CHR$',
]);

function callFunction(kw) {
  switch (kw) {
    case 'NOT':
      return ~toInt16(needNum(parseRel()));
    case 'FN': {
      const nt = T[P];
      if (!nt || nt.t !== 'I') throw err('SYNTAX');
      P++;
      expectOp('(');
      const arg = evalNum();
      expectOp(')');
      return callFn(nt.v, arg);
    }
    case 'LEFT$':
    case 'RIGHT$': {
      expectOp('(');
      const s = evalStr();
      expectOp(',');
      const n = evalByte();
      expectOp(')');
      return kw === 'LEFT$' ? s.slice(0, n) : s.slice(Math.max(0, s.length - n));
    }
    case 'MID$': {
      expectOp('(');
      const s = evalStr();
      expectOp(',');
      const start = evalByte();
      if (start < 1) throw err('ILLEGAL QUANTITY');
      let len = 255;
      if (isOp(T[P], ',')) { P++; len = evalByte(); }
      expectOp(')');
      return s.substr(start - 1, len);
    }
  }
  if (!ONE_ARG_FUNCS.has(kw)) throw err('SYNTAX');
  expectOp('(');
  const v = evalExpr();
  expectOp(')');
  switch (kw) {
    case 'SGN': return Math.sign(needNum(v)) + 0;
    case 'INT': return Math.floor(needNum(v));
    case 'ABS': return Math.abs(needNum(v));
    case 'USR': throw err('ILLEGAL QUANTITY'); // USR-Vektor zeigt am C64 auf diese Fehlermeldung
    case 'FRE': return freBytes();
    case 'POS': return logicalPos();
    case 'SQR': if (needNum(v) < 0) throw err('ILLEGAL QUANTITY'); return Math.sqrt(v);
    case 'RND': return rnd(needNum(v));
    case 'LOG': if (needNum(v) <= 0) throw err('ILLEGAL QUANTITY'); return Math.log(v);
    case 'EXP': return chk(Math.exp(needNum(v)));
    case 'COS': return Math.cos(needNum(v));
    case 'SIN': return Math.sin(needNum(v));
    case 'TAN': return chk(Math.tan(needNum(v)));
    case 'ATN': return Math.atan(needNum(v));
    case 'PEEK': {
      const a = Math.floor(needNum(v));
      if (a < 0 || a > 65535) throw err('ILLEGAL QUANTITY');
      return peekMem(a);
    }
    case 'LEN': return needStr(v).length;
    case 'STR$': return numToStr(needNum(v));
    case 'VAL': return valOf(needStr(v));
    case 'ASC': {
      const s = needStr(v);
      if (s.length === 0) throw err('ILLEGAL QUANTITY');
      return petsciiCodeOf(s[0]);
    }
    case 'CHR$': {
      const n = Math.floor(needNum(v));
      if (n < 0 || n > 255) throw err('ILLEGAL QUANTITY');
      return petsciiChr(n);
    }
  }
  throw err('SYNTAX');
}

function callFn(name, arg) {
  const def = fnDefs.get(name);
  if (!def) throw err("UNDEF'D FUNCTION");
  const had = vars.has(def.param);
  const old = vars.get(def.param);
  vars.set(def.param, arg);
  const savedT = T, savedP = P;
  T = def.toks; P = def.p;
  try {
    return needNum(evalExpr());
  } finally {
    T = savedT; P = savedP;
    if (had) vars.set(def.param, old); else vars.delete(def.param);
  }
}

// --- Zuweisungsziele (Variable oder Array-Element) ---
function parseLValue() {
  const t = T[P];
  if (!t || t.t !== 'I') throw err('SYNTAX');
  P++;
  let idx = null;
  if (isOp(T[P], '(')) idx = parseSubscripts();
  return { name: t.v, idx: idx };
}
function assign(lv, val) {
  if (lv.idx) {
    const a = arrayFor(lv.name, lv.idx.length);
    a.data[arrIndex(a, lv.idx)] = coerce(lv.name, val);
  } else {
    assignVar(lv.name, val);
  }
}

// ---------------------------------------------------------
// Anweisungen
// ---------------------------------------------------------
function execOneStatement() {
  while (P < T.length && isOp(T[P], ':')) P++;
  if (P >= T.length) {
    // Zeilenende
    if (curLi < 0) { stopExecution(); return; }
    curLi++;
    if (curLi >= runLines.length) { contPos = null; stopExecution(); return; }
    T = program.get(runLines[curLi]).toks;
    P = 0;
    return;
  }
  stmtStart = P;
  flowChanged = false;
  execStatement();
  if (state !== 'run' || flowChanged) return;
  if (!atStmtEnd()) throw err('SYNTAX');
}

function execStatement() {
  const t = T[P];
  if (t.t === 'I') { doLet(); return; }
  if (t.t !== 'K') throw err('SYNTAX');
  P++;
  switch (t.v) {
    case 'LET': doLet(); return;
    case 'PRINT': doPrint(); return;
    case 'REM': P = T.length; return;
    case 'DATA': if (T[P] && T[P].t === 'R') P++; return;
    case 'IF': doIf(); return;
    case 'FOR': doFor(); return;
    case 'NEXT': doNext(); return;
    case 'GOTO': gotoLine(parseLineNumber()); return;
    case 'GO': expectKw('TO'); gotoLine(parseLineNumber()); return;
    case 'GOSUB': {
      const n = parseLineNumber();
      pushStack({ type: 'gosub', pos: { toks: T, li: curLi, p: P } });
      gotoLine(n);
      return;
    }
    case 'RETURN': doReturn(); return;
    case 'ON': doOn(); return;
    case 'END':
      contPos = progPos();
      stopExecution();
      return;
    case 'STOP': {
      contPos = progPos();
      const ln = curLineNum();
      newline();
      printSys('BREAK' + (ln !== null ? ' IN ' + ln : ''));
      newline();
      stopExecution();
      return;
    }
    case 'INPUT': doInput(); return;
    case 'GET': doGet(); return;
    case 'DIM': doDim(); return;
    case 'READ': doRead(); return;
    case 'RESTORE': dataPtr = 0; return;
    case 'CLR': clearVariables(); return;
    case 'NEW':
      program.clear();
      progChanged(false);
      stopExecution();
      return;
    case 'RUN': doRun(); return;
    case 'CONT':
      if (!contPos) throw err("CAN'T CONTINUE");
      setPos(contPos);
      return;
    case 'LIST':
      doList();
      stopExecution();
      return;
    case 'POKE': {
      const a = evalAddr();
      expectOp(',');
      pokeMem(a, evalByte());
      return;
    }
    case 'WAIT': doWait(); return;
    case 'SYS': doSys(); return;
    case 'DEF': doDef(); return;
    case 'LOAD': doLoad(); return;
    case 'SAVE': doSave(); return;
    case 'VERIFY': case 'OPEN': case 'CLOSE': case 'PRINT#': case 'INPUT#': case 'CMD':
      throw err('UNIMPLEMENTED ' + t.v);
  }
  throw err('SYNTAX');
}

function parseLineNumber() {
  const t = T[P];
  if (t && t.t === 'N') { P++; return Math.floor(t.v); }
  if (atStmtEnd()) return 0; // GOTO ohne Zahl = GOTO 0 (wie am C64)
  throw err('SYNTAX');
}

function doLet() {
  const lv = parseLValue();
  expectOp('=');
  assign(lv, evalExpr());
}

function doPrint() {
  let lastSep = false;
  while (!atStmtEnd()) {
    const t = T[P];
    if (isOp(t, ';')) { P++; lastSep = true; continue; }
    if (isOp(t, ',')) {
      // nächste 10er-Spalte (Cursor-rechts, überschreibt nicht)
      P++;
      const pos = logicalPos();
      moveRight((Math.floor(pos / 10) + 1) * 10 - pos);
      lastSep = true;
      continue;
    }
    if (isKw(t, 'TAB(') || isKw(t, 'SPC(')) {
      P++;
      const n = evalByte();
      expectOp(')');
      if (t.v === 'TAB(') {
        const pos = logicalPos();
        if (n > pos) moveRight(n - pos);
      } else {
        moveRight(n);
      }
      lastSep = true;
      continue;
    }
    // Ausdrücke dürfen ohne Trennzeichen aufeinander folgen: PRINT "A"B
    const v = evalExpr();
    if (typeof v === 'string') printString(v);
    else printString(numToStr(v) + '\x1d'); // Zahl + Cursor rechts
    lastSep = false;
  }
  if (!lastSep) printString('\r');
}

function doIf() {
  const v = evalExpr();
  const cond = typeof v === 'string' ? v.length > 0 : v !== 0;
  if (isKw(T[P], 'THEN')) {
    P++;
    if (T[P] && T[P].t === 'N') {
      const n = Math.floor(T[P].v);
      P++;
      if (cond) gotoLine(n); else skipLine();
      return;
    }
    if (!cond) { skipLine(); return; }
    flowChanged = true; // weiter mit der Anweisung nach THEN
    return;
  }
  if (isKw(T[P], 'GOTO')) {
    P++;
    const n = parseLineNumber();
    if (cond) gotoLine(n); else skipLine();
    return;
  }
  throw err('SYNTAX');
}
function skipLine() {
  P = T.length;
  flowChanged = true;
}

function doFor() {
  const t = T[P];
  if (!t || t.t !== 'I' || /[$%]$/.test(t.v)) throw err('SYNTAX');
  P++;
  expectOp('=');
  const start = evalNum();
  expectKw('TO');
  const to = evalNum();
  let step = 1;
  if (isKw(T[P], 'STEP')) { P++; step = evalNum(); }
  if (!atStmtEnd()) throw err('SYNTAX');
  assignVar(t.v, start);
  // vorhandene Schleife mit derselben Variable ersetzen (wie am C64)
  for (let i = stack.length - 1; i >= 0; i--) {
    const f = stack[i];
    if (f.type === 'gosub') break;
    if (f.var === t.v) { truncateStack(i); break; }
  }
  pushStack({ type: 'for', var: t.v, to: to, step: step, pos: { toks: T, li: curLi, p: P } });
}

function doNext() {
  while (true) {
    let name = null;
    if (!atStmtEnd()) {
      const t = T[P];
      if (!t || t.t !== 'I') throw err('SYNTAX');
      name = t.v;
      P++;
    }
    let fi = -1;
    for (let i = stack.length - 1; i >= 0; i--) {
      const f = stack[i];
      if (f.type === 'gosub') break;
      if (name === null || f.var === name) { fi = i; break; }
    }
    if (fi < 0) throw err('NEXT WITHOUT FOR');
    truncateStack(fi + 1);
    const f = stack[fi];
    const v = chk(needNum(getVar(f.var)) + f.step);
    assignVar(f.var, v);
    const done = f.step >= 0 ? v > f.to : v < f.to;
    if (!done) { setPos(f.pos); return; }
    truncateStack(fi);
    if (isOp(T[P], ',')) { P++; continue; }
    return;
  }
}

function doReturn() {
  for (let i = stack.length - 1; i >= 0; i--) {
    if (stack[i].type === 'gosub') {
      const f = stack[i];
      truncateStack(i);
      setPos(f.pos);
      skipToStmtEnd();
      return;
    }
  }
  throw err('RETURN WITHOUT GOSUB');
}

function doOn() {
  const n = Math.floor(evalNum());
  if (n < 0 || n > 255) throw err('ILLEGAL QUANTITY');
  let gosub;
  if (isKw(T[P], 'GOTO')) gosub = false;
  else if (isKw(T[P], 'GOSUB')) gosub = true;
  else throw err('SYNTAX');
  P++;
  const targets = [];
  while (true) {
    const t = T[P];
    if (!t || t.t !== 'N') throw err('SYNTAX');
    targets.push(Math.floor(t.v));
    P++;
    if (isOp(T[P], ',')) { P++; continue; }
    break;
  }
  if (n < 1 || n > targets.length) return; // kein Sprung
  if (gosub) pushStack({ type: 'gosub', pos: { toks: T, li: curLi, p: P } });
  gotoLine(targets[n - 1]);
}

function doInput() {
  if (curLi < 0) throw err('ILLEGAL DIRECT');
  const stmtPos = { toks: T, li: curLi, p: stmtStart };
  let prompt = '';
  if (T[P] && T[P].t === 'S' && isOp(T[P + 1], ';')) {
    prompt = T[P].v;
    P += 2;
  }
  const lvs = [parseLValue()];
  while (isOp(T[P], ',')) { P++; lvs.push(parseLValue()); }
  if (!atStmtEnd()) throw err('SYNTAX');
  inputState = { lvs: lvs, idx: 0, resume: { toks: T, li: curLi, p: P }, stmtPos: stmtPos, startRow: 0, startCol: 0 };
  printString(prompt);
  askInput('? ');
}

function askInput(q) {
  printSys(q);
  inputState.startRow = cursorRow;
  inputState.startCol = cursorCol;
  state = 'input';
  flowChanged = true;
  dirty = true;
}

// RETURN während INPUT
function handleInputEnter() {
  const start = logicalStart(cursorRow);
  let text = readLogicalLine(start);
  const is = inputState;
  if (is.startRow >= 0 && start === logicalStart(is.startRow)) {
    text = text.slice((is.startRow - start) * COLS + is.startCol);
  }
  moveBelowLogical(start);
  reverseTyping = false;
  quoteTyping = false;
  try {
    processInputText(text);
  } catch (e) {
    runtimeError(e);
  }
}

function processInputText(text) {
  const is = inputState;
  if (text.trim() === '' && is.idx === 0) { finishInput(); return; } // Variablen bleiben unverändert
  const fields = splitFields(text);
  const take = fields.slice(0, is.lvs.length - is.idx);
  const vals = [];
  for (let k = 0; k < take.length; k++) {
    const lv = is.lvs[is.idx + k];
    if (lv.name.endsWith('$')) {
      vals.push(take[k]);
    } else {
      const n = parseNumberStrict(take[k]);
      if (n === null) {
        printLine('?REDO FROM START');
        is.idx = 0;
        askInput('? ');
        return;
      }
      vals.push(n);
    }
  }
  for (let k = 0; k < vals.length; k++) assign(is.lvs[is.idx + k], vals[k]);
  is.idx += vals.length;
  if (is.idx < is.lvs.length) { askInput('?? '); return; }
  if (fields.length > take.length) printLine('?EXTRA IGNORED');
  finishInput();
}

function finishInput() {
  const is = inputState;
  inputState = null;
  setPos(is.resume);
  startExecution();
}

function doGet() {
  if (isOp(T[P], '#')) throw err('UNIMPLEMENTED GET#');
  if (curLi < 0) throw err('ILLEGAL DIRECT');
  while (true) {
    const lv = parseLValue();
    const ch = keyBuffer.length ? keyBuffer.shift() : '';
    if (lv.name.endsWith('$')) {
      assign(lv, ch);
    } else if (ch === '') {
      assign(lv, 0);
    } else if (ch >= '0' && ch <= '9') {
      assign(lv, ch.charCodeAt(0) - 48);
    } else {
      throw err('SYNTAX');
    }
    if (isOp(T[P], ',')) { P++; continue; }
    break;
  }
}

function doDim() {
  while (true) {
    const t = T[P];
    if (!t || t.t !== 'I') throw err('SYNTAX');
    P++;
    if (!isOp(T[P], '(')) throw err('SYNTAX');
    const idx = parseSubscripts();
    if (arrays.has(t.v)) throw err("REDIM'D ARRAY");
    const dims = idx.map(x => {
      const n = Math.floor(x);
      if (n < 0 || n > 32767) throw err('ILLEGAL QUANTITY');
      return n;
    });
    arrays.set(t.v, makeArray(t.v, dims));
    if (isOp(T[P], ',')) { P++; continue; }
    break;
  }
}

function ensureData() {
  if (dataItems) return;
  dataItems = [];
  for (const ln of runLines) {
    const toks = program.get(ln).toks;
    for (let i = 0; i < toks.length; i++) {
      if (isKw(toks[i], 'DATA')) {
        const raw = toks[i + 1] && toks[i + 1].t === 'R' ? toks[i + 1].v : '';
        for (const s of splitFields(raw)) dataItems.push({ text: s, line: ln });
      }
    }
  }
}

function doRead() {
  ensureData();
  while (true) {
    const lv = parseLValue();
    if (dataPtr >= dataItems.length) throw err('OUT OF DATA');
    const item = dataItems[dataPtr++];
    if (lv.name.endsWith('$')) {
      assign(lv, item.text);
    } else {
      const n = parseNumberStrict(item.text);
      if (n === null) {
        const e = err('SYNTAX');
        e.line = item.line; // Fehler wird in der DATA-Zeile gemeldet
        throw e;
      }
      assign(lv, n);
    }
    if (isOp(T[P], ',')) { P++; continue; }
    break;
  }
}

function doRun() {
  let start = null;
  if (T[P] && T[P].t === 'N') { start = Math.floor(T[P].v); P++; }
  clearVariables();
  contPos = null;
  dataItems = null;
  keyBuffer = [];
  if (start !== null) { gotoLine(start); return; }
  if (runLines.length === 0) { stopExecution(); return; }
  curLi = 0;
  T = program.get(runLines[0]).toks;
  P = 0;
  flowChanged = true;
}

function doList() {
  let from = 0, to = Infinity;
  if (!atStmtEnd()) {
    if (T[P].t === 'N') {
      from = to = Math.floor(T[P].v);
      P++;
      if (isOp(T[P], '-')) {
        P++;
        to = Infinity;
        if (T[P] && T[P].t === 'N') { to = Math.floor(T[P].v); P++; }
      }
    } else if (isOp(T[P], '-')) {
      P++;
      if (!(T[P] && T[P].t === 'N')) throw err('SYNTAX');
      to = Math.floor(T[P].v);
      P++;
    } else {
      throw err('SYNTAX');
    }
  }
  ensureNewLine();
  if (directoryLines) {
    for (const [num, code, revStart, revEnd] of directoryLines) {
      const full = num + ' ' + code;
      if (revStart !== undefined) {
        printSys(full.substring(0, revStart));
        for (const ch of full.substring(revStart, revEnd)) putCell(ch, true);
        printSys(full.substring(revEnd));
        newline();
      } else {
        printLine(full);
      }
    }
    return;
  }
  for (const ln of runLines) {
    if (ln < from || ln > to) continue;
    printListing(ln + ' ' + program.get(ln).text);
    newline();
  }
}

function doWait() {
  const a = evalAddr();
  expectOp(',');
  const mask = evalByte();
  let x = 0;
  if (isOp(T[P], ',')) { P++; x = evalByte(); }
  waitSpec = { a: a, mask: mask, x: x };
  if (!waitSatisfied()) state = 'wait';
}
function waitSatisfied() {
  return ((peekMem(waitSpec.a) ^ waitSpec.x) & waitSpec.mask) !== 0;
}

function doSys() {
  const a = evalAddr();
  if (a === 64738) { resetRequested = true; return; }          // Reset
  if (a === 58640) { setCursor(mem[214], mem[211]); return; }  // Cursor aus 214/211 setzen
  if (a === 65520) {                                            // PLOT
    if ((mem[783] & 1) === 0) setCursor(mem[781], mem[782]);
    else { mem[781] = cursorRow; mem[782] = cursorCol; }
    return;
  }
  throw err('UNIMPLEMENTED SYS');
}

function doDef() {
  if (curLi < 0) throw err('ILLEGAL DIRECT');
  expectKw('FN');
  const nt = T[P];
  if (!nt || nt.t !== 'I' || /[$%]$/.test(nt.v)) throw err('SYNTAX');
  P++;
  expectOp('(');
  const pt = T[P];
  if (!pt || pt.t !== 'I' || /[$%]$/.test(pt.v)) throw err('SYNTAX');
  P++;
  expectOp(')');
  expectOp('=');
  fnDefs.set(nt.v, { param: pt.v, toks: T, p: P });
  skipToStmtEnd();
}

function parseFileArgs() {
  if (atStmtEnd()) throw err('MISSING FILE NAME');
  const name = evalStr();
  if (isOp(T[P], ',')) {
    P++; evalByte();
    if (isOp(T[P], ',')) { P++; evalByte(); }
  }
  if (name === '') throw err('MISSING FILE NAME');
  return name;
}

function doLoad() {
  const name = parseFileArgs();
  const inProgram = curLi >= 0;
  ensureNewLine();
  printLine('SEARCHING FOR ' + name);
  if (name === '$') {
    printLine('LOADING');
    setProgramFromLines([], false);
    directoryLines = buildDirectoryLines();
    stopExecution();
    return;
  }
  const entry = findDiskEntry(name);
  if (!entry) throw err('FILE NOT FOUND');
  printLine('LOADING');
  if (inProgram) {
    // LOAD im Programm: nachladen und von vorn starten, Variablen bleiben
    setProgramFromLines(entry.lines, true);
    if (runLines.length === 0) { stopExecution(); return; }
    curLi = 0;
    T = program.get(runLines[0]).toks;
    P = 0;
    flowChanged = true;
    return;
  }
  setProgramFromLines(entry.lines, false);
  stopExecution();
}

function doSave() {
  const name = parseFileArgs().slice(0, 16);
  ensureNewLine();
  printLine('SAVING ' + name);
  const lines = runLines.map(ln => [ln, program.get(ln).text]);
  const existing = VIRTUAL_DISK.findIndex(e => e.name === name);
  const entry = { name: name, lines: lines };
  if (existing >= 0) VIRTUAL_DISK[existing] = entry; else VIRTUAL_DISK.push(entry);
}

// ---------------------------------------------------------
// Ablaufsteuerung
// ---------------------------------------------------------
function startExecution() {
  state = 'run';
  lastTick = performance.now();
  budget = 1;
  if (!timer) timer = setTimeout(tick, 0);
}

function tick() {
  timer = null;
  if (state !== 'run' && state !== 'wait') return;
  const now = performance.now();
  let limit, deadline;
  if (turbo) {
    limit = Infinity;
    deadline = now + 12;
  } else {
    budget = Math.min(budget + (now - lastTick) * STATEMENTS_PER_MS, 100);
    limit = Math.floor(budget);
    budget -= limit;
    deadline = Infinity;
  }
  lastTick = now;
  try {
    let i = 0;
    while (true) {
      if (breakRequested) { doBreak(); break; }
      if (state === 'wait') {
        if (!waitSatisfied()) break;
        state = 'run';
      }
      if (state !== 'run' || i >= limit) break;
      execOneStatement();
      i++;
      if (resetRequested) { resetRequested = false; hardReset(); return; }
      if ((i & 255) === 0 && performance.now() > deadline) break;
    }
  } catch (e) {
    runtimeError(e);
  }
  dirty = true;
  if (state === 'run' || state === 'wait') timer = setTimeout(tick, turbo ? 0 : 4);
}

function stopExecution() {
  if (timer) { clearTimeout(timer); timer = null; }
  state = 'idle';
  inputState = null;
  waitSpec = null;
  breakRequested = false;
  reverseMode = false;
  outputQuote = false;
  keyBuffer = [];
  quoteTyping = false;
  ensureNewLine();
  printLine('READY.');
  dirty = true;
  if (pasteQueue.length) setTimeout(pumpPaste, 0);
}

function doBreak() {
  const ln = curLineNum();
  if (state === 'input') contPos = ln !== null ? inputState.stmtPos : null;
  else contPos = ln !== null ? { toks: T, li: curLi, p: P } : null;
  newline();
  printSys('BREAK' + (ln !== null ? ' IN ' + ln : ''));
  newline();
  stopExecution();
}

function requestBreak() {
  if (state === 'run' || state === 'wait') breakRequested = true;
  else if (state === 'input') doBreak();
}

function runtimeError(e) {
  if (!(e instanceof BasicError)) {
    console.error(e);
    e = err('SYNTAX');
  }
  const ln = e.line !== undefined ? e.line : curLineNum();
  contPos = null;
  reverseMode = false;
  outputQuote = false;
  newline();
  printSys('?' + e.code + '  ERROR' + (ln !== null ? ' IN ' + ln : ''));
  newline();
  stopExecution();
}

function abortExecution() {
  if (timer) { clearTimeout(timer); timer = null; }
  state = 'idle';
  inputState = null;
  waitSpec = null;
  breakRequested = false;
}

// Kompletter Neustart (wie Aus- und wieder Einschalten)
function hardReset() {
  abortExecution();
  keyBuffer = [];
  pasteQueue = [];
  program.clear();
  progChanged(false);
  mem.fill(0);
  borderColor = 14;
  bgColor = 6;
  currentTextColor = 14;
  reverseMode = false;
  outputQuote = false;
  reverseTyping = false;
  clockBase = performance.now();
  bootScreen();
}

// ============================================================
// EINGABE IM DIREKTMODUS
// ============================================================

// Eine (logische) Zeile wurde mit RETURN übernommen
function processInputLine(raw) {
  const line = expandKeywordAbbreviations(raw);
  const m = line.match(/^ *([0-9]+)(.*)$/);
  if (m) {
    const num = parseInt(m[1], 10);
    if (m[1].length > 5 || num > 63999) {
      curLi = -1;
      runtimeError(err('SYNTAX'));
      return;
    }
    storeLine(num, m[2]);
    progChanged(false);
    return;
  }
  if (line.trim() === '') return;
  const tk = tokenizeLine(upperOutsideQuotes(line));
  T = tk.toks;
  P = 0;
  curLi = -1;
  startExecution();
}

function handleEnterIdle() {
  const start = logicalStart(cursorRow);
  const text = readLogicalLine(start);
  moveBelowLogical(start);
  reverseTyping = false;
  quoteTyping = false;
  processInputLine(text);
}

// Quote-Modus beim Tippen: wird wie am C64 durch jedes getippte
// Anführungszeichen umgeschaltet und mit RETURN beendet.
let quoteTyping = false;

function editorControl(code) {
  if (code !== 20 && code !== 148 && quoteTyping) {
    // im Quote-Modus werden Steuertasten als reverses Zeichen eingefügt
    putCell(controlGlyph(code), true);
    return;
  }
  switch (code) {
    case 17: cursorDownMove(); break;
    case 145: cursorUpMove(); break;
    case 29: wrapForward(false); break;
    case 157: cursorLeftMove(); break;
    case 19: cursorRow = 0; cursorCol = 0; break;
    case 147: clearScreen(); break;
    case 20: editorDelete(); break;
    case 148: editorInsert(); break;
    case 18: reverseTyping = true; break;
    case 146: reverseTyping = false; break;
    default:
      if (CHR_COLOR_MAP[code] !== undefined) currentTextColor = CHR_COLOR_MAP[code];
  }
  dirty = true;
}

// Mehrzeiliges Einfügen: Zeilen nacheinander eintippen
function pumpPaste() {
  while (state === 'idle' && pasteQueue.length) {
    const line = pasteQueue.shift();
    ensureNewLine();
    for (const ch of line) putCell(displayChar(ch), false);
    newline();
    processInputLine(line);
  }
}

// Text aus Datei oder Zwischenablage: ASCII-Kleinbuchstaben werden wie in
// üblichen Listings als normale C64-Buchstaben (Großbuchstaben) gelesen.
function normalizeAsciiText(s) {
  let out = '';
  for (const ch of s.replace(/\t/g, ' ')) {
    const cp = ch.charCodeAt(0);
    if (cp >= 97 && cp <= 122) out += ch.toUpperCase();
    else if (cp === 163) out += '';
    else if ((cp >= 32 && cp <= 126) || (cp >= 0xE000 && cp <= 0xE0FF) || (cp < 256 && isControlCode(cp))) out += ch;
  }
  return out;
}

// ---------------------------------------------------------
// LOAD/SAVE aus lokaler .bas-Datei
// ---------------------------------------------------------
function loadProgramFromText(text, filename) {
  if (state !== 'idle') abortExecution();
  ensureNewLine();
  printLine('SEARCHING FOR ' + filename);
  printLine('LOADING');
  const lines = [];
  for (const raw of text.split(/\r\n|\r|\n/)) {
    const m = raw.match(/^\s*([0-9]{1,5})(.*)$/);
    if (!m) continue;
    const num = parseInt(m[1], 10);
    if (num > 63999) continue;
    lines.push([num, normalizeAsciiText(m[2])]);
  }
  if (lines.length === 0) {
    newline();
    printLine('?FILE NOT FOUND  ERROR');
  } else {
    setProgramFromLines(lines, false);
  }
  printLine('READY.');
}

function saveProgramToFile() {
  if (runLines.length === 0) return;
  let name = window.prompt('Dateiname für das BASIC-Programm:', 'programm.bas');
  if (!name) return;
  if (!/\.[a-z0-9]+$/i.test(name)) name += '.bas';
  const text = runLines.map(ln => ln + ' ' + program.get(ln).text).join('\n') + '\n';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ============================================================
// TASTATUR
// ============================================================
const KEY_MATRIX = {
  'BACKSPACE': 0, 'ENTER': 1, 'ARROWRIGHT': 2, 'ARROWLEFT': 2, 'F7': 3, 'F8': 3,
  'F1': 4, 'F2': 4, 'F3': 5, 'F4': 5, 'F5': 6, 'F6': 6, 'ARROWDOWN': 7, 'ARROWUP': 7,
  '3': 8, 'W': 9, 'A': 10, '4': 11, 'Z': 12, 'S': 13, 'E': 14, '5': 16, 'R': 17,
  'D': 18, '6': 19, 'C': 20, 'F': 21, 'T': 22, 'X': 23, '7': 24, 'Y': 25, 'G': 26,
  '8': 27, 'B': 28, 'H': 29, 'U': 30, 'V': 31, '9': 32, 'I': 33, 'J': 34, '0': 35,
  'M': 36, 'K': 37, 'O': 38, 'N': 39, '+': 40, 'P': 41, 'L': 42, '-': 43, '.': 44,
  ':': 45, '@': 46, ',': 47, '*': 49, ';': 50, 'HOME': 51, '=': 53, '/': 55,
  '1': 56, '2': 59, ' ': 60, 'Q': 62, 'ESCAPE': 63,
};
const FKEY_CODES = { F1: 133, F3: 134, F5: 135, F7: 136, F2: 137, F4: 138, F6: 139, F8: 140 };
const CTRL_DIGIT_CODES = [146, 144, 5, 28, 159, 156, 30, 31, 158, 18];   // Strg+0..9
const CBM_DIGIT_CODES = [null, 129, 149, 150, 151, 152, 153, 154, 155];  // C= +1..8

function keyMatrixName(e) {
  if (/^[a-zA-Z]$/.test(e.key)) return e.key.toUpperCase();
  if (/^Digit[0-9]$/.test(e.code)) return e.code.slice(5);
  return e.key.toUpperCase();
}

function updateShiftFlags(e) {
  shiftFlags = (e.shiftKey ? 1 : 0) | (e.altKey ? 2 : 0) | (e.ctrlKey ? 4 : 0);
}

// Liefert die Taste als PETSCII: {code} für Steuertasten, {ch} für Zeichen
function translateKey(e, altGr) {
  if (e.key === 'Enter') return { code: 13 };
  if (!altGr && (e.ctrlKey || e.altKey) && /^Digit[0-9]$/.test(e.code)) {
    const d = +e.code.slice(5);
    if (e.ctrlKey) return { code: CTRL_DIGIT_CODES[d] };
    if (CBM_DIGIT_CODES[d]) return { code: CBM_DIGIT_CODES[d] };
    return null;
  }
  if ((e.ctrlKey && !altGr) || e.metaKey || (e.altKey && !altGr)) return null;
  switch (e.key) {
    case 'ArrowUp': return { code: 145 };
    case 'ArrowDown': return { code: 17 };
    case 'ArrowLeft': return { code: 157 };
    case 'ArrowRight': return { code: 29 };
    case 'Home': return { code: e.shiftKey ? 147 : 19 };
    case 'Backspace': return { code: e.shiftKey ? 148 : 20 };
    case 'Insert': return { code: 148 };
  }
  if (FKEY_CODES[e.key]) return { code: FKEY_CODES[e.key] };
  if (e.key.length !== 1) return null;
  let ch = e.key;
  if (/^[a-zA-Z]$/.test(ch)) {
    // SHIFT+Buchstabe ergibt ein PETSCII-Grafikzeichen
    if (e.shiftKey) return { ch: petsciiChr(97 + ch.toUpperCase().charCodeAt(0) - 65) };
    return { ch: ch.toUpperCase() };
  }
  if (ch === '£') return { ch: '' };
  const cp = ch.charCodeAt(0);
  if (cp < 32 || cp > 126) return null;
  return { ch: ch };
}

function onKeyDown(e) {
  if (e.target && e.target.id === 'file-input') return;
  const altGr = !!(e.getModifierState && e.getModifierState('AltGraph'));
  updateShiftFlags(e);
  hiddenInput.focus();

  // RUN/STOP: Escape (oder Strg+C, solange etwas läuft)
  if (e.key === 'Escape' || (state !== 'idle' && e.ctrlKey && !altGr && (e.key === 'c' || e.key === 'C'))) {
    e.preventDefault();
    currentKeyCode = 63;
    requestBreak();
    return;
  }

  const k = translateKey(e, altGr);
  if (!k) return; // Browser-Kürzel (Strg+R, Strg+V ...) nicht blockieren
  e.preventDefault();
  const mk = KEY_MATRIX[keyMatrixName(e)];
  currentKeyCode = mk !== undefined ? mk : 64;

  // Programm läuft: Taste in den Tastaturpuffer (für GET / WAIT)
  if (state === 'run' || state === 'wait') {
    if (keyBuffer.length < 10) keyBuffer.push(k.ch !== undefined ? k.ch : String.fromCharCode(k.code));
    return;
  }

  // Bildschirmeditor (Direktmodus oder INPUT)
  if (k.code === 13) {
    if (e.shiftKey) { // SHIFT+RETURN: nur in die nächste Zeile
      moveBelowLogical(logicalStart(cursorRow));
      reverseTyping = false;
      quoteTyping = false;
      return;
    }
    if (state === 'input') handleInputEnter();
    else handleEnterIdle();
    return;
  }
  if (k.code !== undefined) {
    if (FKEY_CODES[e.key]) return; // Funktionstasten haben im Editor keine Wirkung
    editorControl(k.code);
    return;
  }
  if (k.ch === '"') quoteTyping = !quoteTyping;
  putCell(k.ch, reverseTyping);
}

document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', (e) => {
  updateShiftFlags(e);
  currentKeyCode = 64;
});

document.addEventListener('paste', (e) => {
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  if (!txt) return;
  e.preventDefault();
  const lines = txt.replace(/\r\n?/g, '\n').split('\n').map(normalizeAsciiText);
  // Ohne Zeilenumbruch: Text an der Cursorposition eintippen,
  // mit Zeilenumbruch: jede Zeile wie mit RETURN übernehmen
  if (state === 'input' || (state === 'idle' && lines.length === 1)) {
    for (const ch of lines[0]) putCell(displayChar(ch), reverseTyping);
    return;
  }
  if (state !== 'idle') return;
  for (const l of lines) if (l.trim() !== '') pasteQueue.push(l);
  pumpPaste();
});

// Fokus halten
document.addEventListener('click', () => hiddenInput.focus());
hiddenInput.focus();

// STOP-Button (RUN/STOP)
document.getElementById('stop-btn').addEventListener('click', () => {
  requestBreak();
  hiddenInput.focus();
});

// RESET-Button
document.getElementById('reset-btn').addEventListener('click', () => {
  hardReset();
  hiddenInput.focus();
});

// TEMPO-Button: Original-Tempo <-> maximal
const speedBtn = document.getElementById('speed-btn');
speedBtn.addEventListener('click', () => {
  turbo = !turbo;
  speedBtn.textContent = turbo ? 'TEMPO: MAX' : 'TEMPO: C64';
  lastTick = performance.now();
  budget = 0;
  hiddenInput.focus();
});

// LOAD FILE / SAVE FILE
const fileInput = document.getElementById('file-input');
document.getElementById('load-file-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    loadProgramFromText(String(reader.result), file.name.toUpperCase());
    hiddenInput.focus();
  };
  reader.onerror = () => {
    ensureNewLine();
    printLine('?FILE NOT FOUND  ERROR');
    printLine('READY.');
  };
  reader.readAsText(file);
  fileInput.value = '';
});
document.getElementById('save-file-btn').addEventListener('click', () => {
  saveProgramToFile();
  hiddenInput.focus();
});

// ============================================================
// START
// ============================================================
bootScreen();
requestAnimationFrame(renderLoop);
</script>
</body>
</html>
