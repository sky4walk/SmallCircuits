<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM&middot;DX 6-OP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:'Courier New',monospace;display:flex;justify-content:center;padding:16px}
#app{width:100%;max-width:1040px}
.header{display:flex;align-items:center;gap:12px;border-bottom:0.5px solid #2a2a2a;padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.logo{font-size:16px;font-weight:700;letter-spacing:4px;color:#e8a030}
.sub2{font-size:9px;color:#666;letter-spacing:2px}
#midi{font-size:9px;color:#3ab0e8;letter-spacing:1px}
.led{width:8px;height:8px;border-radius:50%;background:#333;margin-left:auto}
.led.on{background:#e8a030}
.bar{background:#161616;border:0.5px solid #2a2a2a;border-radius:6px;padding:8px 10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{background:#1e1e1e;color:#e0e0e0;border:0.5px solid #333;border-radius:4px;padding:4px 8px;font-size:10px;font-family:inherit;cursor:pointer}
.btn{background:#1e1e1e;border:0.5px solid #333;color:#aaa;font-size:9px;padding:5px 10px;border-radius:4px;font-family:inherit;cursor:pointer;letter-spacing:1px}
.btn:hover{border-color:#e8a030;color:#e8a030}
.lbl{font-size:9px;letter-spacing:2px;color:#666}
.top{display:grid;grid-template-columns:280px 1fr 1fr;gap:8px;margin-bottom:8px}
@media(max-width:820px){.top{grid-template-columns:1fr}}
.panel{background:#1a1a1a;border:0.5px solid #2a2a2a;border-radius:6px;padding:8px}
.ptitle{font-size:8px;letter-spacing:3px;color:#666;margin-bottom:7px;border-bottom:0.5px solid #252525;padding-bottom:5px}
#ops{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
@media(max-width:1000px){#ops{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){#ops{grid-template-columns:repeat(2,1fr)}}
.opcol{background:#1a1a1a;border:0.5px solid #2a2a2a;border-radius:6px;padding:7px}
.ophd{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.opname{font-size:10px;color:#e8a030;letter-spacing:2px}
.badge{font-size:7px;letter-spacing:1px;padding:1px 4px;border-radius:3px;border:0.5px solid #333;color:#666}
.badge.car{border-color:#e8a030;color:#e8a030}
.badge.mod{border-color:#3a3a3a;color:#777}
.ratio{font-size:9px;color:#3ab0e8;margin-bottom:6px;letter-spacing:1px}
.sub{font-size:7px;letter-spacing:2px;color:#555;margin:7px 0 4px;border-top:0.5px solid #252525;padding-top:5px}
.egrow{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.egc{width:100%;height:40px;background:#141414;border:0.5px solid #252525;border-radius:3px;margin:4px 0}
.mini{margin-bottom:4px}
.mini-l{font-size:7px;color:#666;letter-spacing:1px;display:flex;justify-content:space-between}
.mini-v{color:#e8a030;font-size:8px}
input[type=range]{width:100%;height:3px;accent-color:#e8a030;cursor:pointer;display:block}
#scope{display:block;width:100%;height:70px;background:#141414;border-radius:4px}
#kb{position:relative;height:90px;display:flex;gap:1px;margin-top:8px;user-select:none}
.wkey{background:#d8d8d8;border:0.5px solid #999;border-radius:0 0 4px 4px;position:relative;cursor:pointer}
.wkey.dn{background:#e8a030}
.bkey{position:absolute;top:0;height:56%;background:#222;border:0.5px solid #555;border-radius:0 0 3px 3px;z-index:10;cursor:pointer}
.bkey.dn{background:#666}
.klbl{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:7px;color:#999;pointer-events:none}
.hint{font-size:8px;color:#555;letter-spacing:1px;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">FM&middot;DX</div>
    <div class="sub2">6 OPERATOR / AUDIOWORKLET</div>
    <div id="midi" class="sub2">MIDI: &hellip;</div>
    <div class="led" id="led"></div>
  </div>
  <div class="bar">
    <span class="lbl">PRESET</span><select id="preset"></select>
    <span class="lbl">ALGORITHM</span><select id="alg"></select>
    <button class="btn" id="start">&#9654; AUDIO AN</button>
    <button class="btn" id="panic">PANIC</button>
    <button class="btn" id="dump">&#8599; PATCH</button>
    <button class="btn" id="octdn">OCT -</button><span class="lbl" id="oct">0</span><button class="btn" id="octup">OCT +</button>
  </div>
  <div class="top">
    <div class="panel"><div class="ptitle">ALGORITHM</div><div id="algsvg"></div></div>
    <div class="panel"><div class="ptitle">GLOBAL</div><div id="globals"></div></div>
    <div class="panel"><div class="ptitle">SCOPE</div><canvas id="scope" width="500" height="70"></canvas></div>
  </div>
  <div id="ops"></div>
  <div id="kb"></div>
  <div class="hint">Tasten: y&hellip;m untere Oktave, q&hellip;i obere, Pfeil links/rechts = Oktave. Anschlagstaerke = vertikale Klickposition auf der Taste. MIDI-Keyboard wird automatisch erkannt.</div>
</div>
<script>
const WORKLET_SRC = `/* ---- 6-Operator FM-Kernel, laeuft im AudioWorkletGlobalScope ---- */
const MODSCALE = 2.0;          /* Modulator-Ausgang 1.0 == 2 volle Phasenumlaeufe */
const TBL = 4096;
const SIN = new Float32Array(TBL + 1);
for (let i = 0; i <= TBL; i++) SIN[i] = Math.sin(2 * Math.PI * i / TBL);

/* Sinus per Tabelle mit linearer Interpolation. p in Umlaeufen, beliebig gross/negativ. */
function osc(p) {
  const x = p - Math.floor(p);
  const f = x * TBL, i = f | 0, a = SIN[i];
  return a + (SIN[i + 1] - a) * (f - i);
}
/* DX-Rate 0..99 -> Sekunden. 99 = 2.5 ms, 0 = ca. 39 s */
function rateTime(r) { return 0.0025 * Math.pow(10, (99 - r) / 99 * 4.2); }
/* DX-Level 0..99 -> lineare Amplitude, 0.75 dB pro Schritt */
function lvlAmp(l) { return l <= 0 ? 1e-5 : Math.pow(10, (l - 99) * 0.75 / 20); }

const NOP = 6;

class Voice {
  constructor() {
    this.ph = new Float64Array(NOP);
    this.inc = new Float64Array(NOP);
    this.amp = new Float32Array(NOP);
    this.tgt = new Float32Array(NOP);
    this.coef = new Float32Array(NOP);
    this.stage = new Int8Array(NOP);
    this.out = new Float32Array(NOP);
    this.lvl = new Float32Array(NOP);
    this.fb1 = 0; this.fb2 = 0;
    this.on = false; this.held = false; this.note = -1; this.age = 0;
    this.base = 440; this.pegT = 0;
  }
}

class FMProcessor extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    this.patch = null;
    this.counter = 0;
    const n = (opts && opts.processorOptions && opts.processorOptions.polyphony) || 16;
    this.voices = []; for (let i = 0; i < n; i++) this.voices.push(new Voice());
    this.port.onmessage = e => this.onMsg(e.data);
  }

  onMsg(m) {
    if (m.type === 'patch') { this.patch = m.patch; }
    else if (m.type === 'noteOn') this.noteOn(m.note, m.vel);
    else if (m.type === 'noteOff') this.noteOff(m.note);
    else if (m.type === 'allOff') this.voices.forEach(v => { v.on = false; v.held = false; });
  }

  /* --- Huellkurven-Stufe vorbereiten: Zielwert + multiplikativer Koeffizient --- */
  setStage(v, o) {
    const p = this.patch, op = p.ops[o], s = v.stage[o];
    if (s === 3) { v.coef[o] = 1; return; }              /* Sustain: halten */
    const li = s <= 2 ? s : 3;
    let t = lvlAmp(op.l[li]);
    const r = op.r[li];
    /* Rate Scaling: hohe Toene laufen schneller durch die Huellkurve */
    const ks = Math.pow(2, (v.note - 60) / 12 * op.krs * 0.25);
    const time = Math.max(rateTime(r) / ks, 1 / sampleRate);
    const start = Math.max(v.amp[o], 1e-5);
    t = Math.max(t, 1e-5);
    v.tgt[o] = t;
    /* linear in dB == multiplikativ in der Amplitude */
    v.coef[o] = Math.pow(t / start, 1 / (time * sampleRate));
    if (Math.abs(v.coef[o] - 1) < 1e-12) v.coef[o] = 1;
  }

  noteOn(note, vel) {
    const p = this.patch; if (!p) return;
    let v = this.voices.find(x => !x.on);
    if (!v) {                                            /* Voice Stealing: aelteste losgelassene, sonst aelteste */
      const rel = this.voices.filter(x => !x.held);
      const pool = rel.length ? rel : this.voices;
      v = pool.reduce((a, b) => a.age < b.age ? a : b);
    }
    v.on = true; v.held = true; v.note = note; v.age = ++this.counter;
    v.base = 440 * Math.pow(2, (note - 69) / 12) * Math.pow(2, p.transpose / 12);
    v.fb1 = 0; v.fb2 = 0; v.pegT = 0;
    for (let o = 0; o < NOP; o++) {
      const op = p.ops[o];
      v.ph[o] = 0;                                       /* Phasenreset - beim DX7 identisch */
      v.out[o] = 0;
      const vs = 1 - op.vs / 7 + (op.vs / 7) * vel;      /* Velocity -> Operator-Pegel */
      const ks = Math.pow(2, -(note - 60) / 12 * op.kls / 100);
      v.lvl[o] = lvlAmp(op.level) * vs * ks;
      v.amp[o] = 1e-5;
      v.stage[o] = 0;
      this.setStage(v, o);
    }
    this.updateInc(v);
  }

  noteOff(note) {
    for (const v of this.voices) {
      if (v.on && v.held && v.note === note) {
        v.held = false; v.stage.fill(4);
        for (let o = 0; o < NOP; o++) this.setStage(v, o);
      }
    }
  }

  /* Pitch-EG wirkt blockweise auf alle Operatoren gemeinsam */
  updateInc(v) {
    const p = this.patch;
    const pe = p.pitchDepth * Math.exp(-v.pegT / Math.max(p.pitchTime, 0.001));
    const f0 = v.base * Math.pow(2, pe / 12);
    for (let o = 0; o < NOP; o++) {
      const op = p.ops[o];
      const f = op.fixed ? op.fixedHz : f0 * op.ratio * Math.pow(2, op.detune / 1200);
      v.inc[o] = f / sampleRate;
    }
  }

  process(inputs, outputs) {
    const out = outputs[0], L = out[0], n = L.length;
    const p = this.patch;
    if (!p) { L.fill(0); if (out[1]) out[1].fill(0); return true; }

    const mods = p.algo.mods, carr = p.algo.carriers, nc = carr.length;
    const fbOp = p.algo.fbOp, fbAmt = p.fbAmt, g = p.master;

    for (const v of this.voices) if (v.on) { this.updateInc(v); v.pegT += n / sampleRate; }

    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let vi = 0; vi < this.voices.length; vi++) {
        const v = this.voices[vi];
        if (!v.on) continue;
        /* Operatoren absteigend: Modulatoren haben im DX7 immer die hoehere Nummer */
        for (let o = NOP - 1; o >= 0; o--) {
          let a = v.amp[o];
          const c = v.coef[o];
          if (c !== 1) {
            a *= c;
            const t = v.tgt[o];
            if ((c > 1 && a >= t) || (c < 1 && a <= t)) {
              a = t; v.amp[o] = a;
              if (v.stage[o] < 4) { v.stage[o]++; this.setStage(v, o); }
              else v.coef[o] = 1;
            }
          }
          v.amp[o] = a;

          let m = 0;
          const ms = mods[o];
          for (let k = 0; k < ms.length; k++) m += v.out[ms[k]];
          if (o === fbOp) m += (v.fb1 + v.fb2) * 0.5 * fbAmt;

          let ph = v.ph[o] + v.inc[o];
          ph -= Math.floor(ph);
          v.ph[o] = ph;

          const y = osc(ph + m * MODSCALE) * a * v.lvl[o];
          v.out[o] = y;
          if (o === fbOp) { v.fb2 = v.fb1; v.fb1 = y; }
        }
        for (let k = 0; k < nc; k++) s += v.out[carr[k]];
      }
      s *= g;
      L[i] = s < -1 || s > 1 ? Math.tanh(s) : s;         /* weiche Begrenzung nur bei Bedarf */
    }
    if (out[1]) out[1].set(L);

    for (const v of this.voices) {
      if (!v.on || v.held) continue;
      let dead = true;
      for (let o = 0; o < nc; o++) if (v.amp[carr[o]] > 2e-4) { dead = false; break; }
      if (dead) v.on = false;
    }
    return true;
  }
}
registerProcessor('fm-dx', FMProcessor);
`;
/* ================= Algorithmen =================
   mods[o] = Operatoren (0-basiert), die Operator o modulieren.
   Im DX7 hat ein Modulator immer die hoehere Nummer als sein Ziel -
   deshalb reicht im Kernel die Auswertung von OP6 abwaerts. */
const ALGOS=[
 {n:'DX 1   [1]<2  |  [3]<4<5<6', mods:[[1],[],[3],[4],[5],[]],  carriers:[0,2],       fbOp:5},
 {n:'DX 2   [1]<2* |  [3]<4<5<6', mods:[[1],[],[3],[4],[5],[]],  carriers:[0,2],       fbOp:1},
 {n:'DX 3   [1]<2<3 | [4]<5<6',   mods:[[1],[2],[],[4],[5],[]],  carriers:[0,3],       fbOp:5},
 {n:'DX 5   [1]<2 | [3]<4 | [5]<6',mods:[[1],[],[3],[],[5],[]],  carriers:[0,2,4],     fbOp:5},
 {n:'DX 7   [1]<2 | [3]<4,5<6',   mods:[[1],[],[3,4],[],[5],[]], carriers:[0,2],       fbOp:5},
 {n:'DX 8   [1]<2 | [3]<4*,5<6',  mods:[[1],[],[3,4],[],[5],[]], carriers:[0,2],       fbOp:3},
 {n:'DX 31  [1][2][3][4] [5]<6',  mods:[[],[],[],[],[5],[]],     carriers:[0,1,2,3,4], fbOp:5},
 {n:'DX 32  [1][2][3][4][5][6]',  mods:[[],[],[],[],[],[]],      carriers:[0,1,2,3,4,5],fbOp:5},
 {n:'Stack  [1]<2<3<4<5<6',       mods:[[1],[2],[3],[4],[5],[]], carriers:[0],         fbOp:5}
];

const OPDEF={coarse:1,fine:0,detune:0,fixed:false,fixedHz:100,level:0,r:[99,60,40,70],l:[99,80,60,0],vs:0,kls:0,krs:0};
const mkop=o=>{const d=JSON.parse(JSON.stringify(OPDEF));Object.assign(d,o||{});return d;};
const mkpatch=(algo,fb,master,ops,extra)=>Object.assign(
  {algo,fb,master,transpose:0,pitchDepth:0,pitchTime:0.1,ops:ops.map(mkop)},extra||{});

const PRESETS={
 'Init  (Sinus)':mkpatch(7,0,60,[{level:99,r:[99,50,50,70],l:[99,99,99,0]},{},{},{},{},{}]),

 'E-Piano  (Tine)':mkpatch(3,2,60,[
   {level:95,r:[99,45,30,55],l:[99,88,78,0],vs:5,krs:3,kls:30},
   {coarse:1,level:72,r:[99,58,45,60],l:[99,55,25,0],vs:6,krs:3},
   {level:82,r:[99,50,35,58],l:[99,85,72,0],vs:5,krs:4,kls:35},
   {coarse:14,level:66,r:[99,90,84,72],l:[99,18,0,0],vs:7,krs:5},
   {detune:7,level:48,r:[99,62,50,60],l:[99,72,55,0],vs:4,krs:3,kls:40},
   {coarse:1,detune:-9,level:44,r:[99,72,60,64],l:[99,42,18,0],vs:6,krs:4}]),

 'Grand Piano':mkpatch(0,3,58,[
   {level:96,r:[99,36,26,52],l:[99,92,78,0],vs:4,kls:25,krs:4},
   {coarse:1,level:74,r:[99,72,58,62],l:[99,42,12,0],vs:7,krs:4},
   {detune:-6,level:88,r:[99,38,27,52],l:[99,90,74,0],vs:4,kls:30,krs:4},
   {coarse:2,level:60,r:[99,74,62,64],l:[99,38,8,0],vs:6,krs:5},
   {coarse:3,level:46,r:[99,80,68,66],l:[99,28,4,0],vs:6,krs:5},
   {coarse:7,level:34,r:[99,92,84,72],l:[99,12,0,0],vs:7,krs:6}]),

 'Tubular Bell':mkpatch(3,1,55,[
   {level:92,r:[99,26,20,30],l:[99,88,72,0],krs:2},
   {coarse:3,fine:50,level:62,r:[99,32,26,34],l:[99,58,36,0],krs:2},
   {coarse:2,detune:9,level:74,r:[99,28,21,31],l:[99,85,68,0],krs:2},
   {coarse:7,level:52,r:[99,40,32,38],l:[99,50,28,0],krs:3},
   {coarse:5,detune:-11,level:50,r:[99,30,23,32],l:[99,80,60,0],krs:2},
   {coarse:11,level:38,r:[99,55,45,45],l:[99,35,10,0],krs:3}]),

 'Brass Section':mkpatch(2,4,52,[
   {level:94,r:[72,48,40,58],l:[99,92,88,0],vs:3},
   {coarse:1,level:72,r:[66,44,38,54],l:[99,82,74,0],vs:6},
   {coarse:1,level:58,r:[62,42,36,52],l:[99,72,62,0],vs:7},
   {detune:-6,level:84,r:[74,48,40,58],l:[99,90,85,0],vs:3},
   {coarse:1,level:64,r:[66,44,38,54],l:[99,80,70,0],vs:6},
   {coarse:2,level:42,r:[64,42,36,52],l:[99,62,52,0],vs:7}],
   {pitchDepth:0.35,pitchTime:0.05}),

 'FM Bass':mkpatch(3,2,58,[
   {level:97,r:[99,58,44,72],l:[99,82,58,0],vs:4,kls:20,krs:3},
   {coarse:1,level:74,r:[99,92,82,76],l:[99,32,4,0],vs:7,krs:4},
   {level:62,r:[99,62,48,72],l:[99,78,50,0],vs:4,krs:3},
   {coarse:3,level:50,r:[99,88,78,74],l:[99,26,2,0],vs:7,krs:4},
   {detune:5,level:42,r:[99,66,52,72],l:[99,70,44,0],vs:4,krs:3},
   {coarse:11,level:28,r:[99,95,90,80],l:[99,8,0,0],vs:7,krs:6}],
   {transpose:-12,pitchDepth:0.25,pitchTime:0.025}),

 'Drawbar Organ':mkpatch(7,0,48,[
   {coarse:1,level:92,r:[92,60,60,82],l:[99,99,99,0],krs:1},
   {coarse:2,level:80,r:[92,60,60,82],l:[99,99,99,0],krs:1},
   {coarse:3,level:58,r:[92,60,60,82],l:[99,99,99,0],krs:1},
   {coarse:4,level:66,r:[92,60,60,82],l:[99,99,99,0],krs:1},
   {coarse:6,level:44,r:[92,60,60,82],l:[99,99,99,0],krs:1},
   {coarse:8,level:38,r:[92,60,60,82],l:[99,99,99,0],krs:1}])
};

/* ================= Zustand ================= */
let patch=JSON.parse(JSON.stringify(PRESETS['E-Piano  (Tine)']));
let ctx=null,node=null,analyser=null,ready=false;
const held=new Map();
let octave=0;

const ratioOf=o=>(o.coarse===0?0.5:o.coarse)*(1+o.fine/100);
function resolved(){
  return{
    algo:ALGOS[patch.algo],
    fbAmt:patch.fb/7,
    transpose:patch.transpose,
    master:patch.master/99*0.6,
    pitchDepth:patch.pitchDepth,pitchTime:patch.pitchTime,
    ops:patch.ops.map(o=>({ratio:ratioOf(o),detune:o.detune,fixed:o.fixed,fixedHz:o.fixedHz,
      level:o.level,r:o.r.slice(),l:o.l.slice(),vs:o.vs,kls:o.kls,krs:o.krs}))
  };
}
function push(){if(node)node.port.postMessage({type:'patch',patch:resolved()});}

async function initAudio(){
  if(ctx){if(ctx.state==='suspended')await ctx.resume();return;}
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  const url=URL.createObjectURL(new Blob([WORKLET_SRC],{type:'application/javascript'}));
  await ctx.audioWorklet.addModule(url);URL.revokeObjectURL(url);
  node=new AudioWorkletNode(ctx,'fm-dx',{numberOfInputs:0,numberOfOutputs:1,
    outputChannelCount:[2],processorOptions:{polyphony:16}});
  analyser=ctx.createAnalyser();analyser.fftSize=2048;
  node.connect(analyser);analyser.connect(ctx.destination);
  ready=true;push();scope();
}
async function noteOn(n,v){await initAudio();if(held.has(n))return;held.set(n,1);node.port.postMessage({type:'noteOn',note:n,vel:v});setLed(true);}
function noteOff(n){if(!held.has(n))return;held.delete(n);if(node)node.port.postMessage({type:'noteOff',note:n});setLed(held.size>0);}
const setLed=on=>document.getElementById('led').classList.toggle('on',on);

/* ================= UI-Aufbau ================= */
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e;};
function mini(label,min,max,step,val,cb,fmt){
  const w=el('div','mini');
  const lb=el('div','mini-l');lb.appendChild(el('span',null,label));
  const vv=el('span','mini-v',fmt?fmt(val):val);lb.appendChild(vv);
  const inp=document.createElement('input');
  inp.type='range';inp.min=min;inp.max=max;inp.step=step;inp.value=val;
  inp.addEventListener('input',()=>{const x=parseFloat(inp.value);vv.textContent=fmt?fmt(x):x;cb(x);});
  w.appendChild(lb);w.appendChild(inp);w._set=x=>{inp.value=x;vv.textContent=fmt?fmt(x):x;};
  return w;
}
const opCtl=[];
function buildOps(){
  const host=document.getElementById('ops');host.innerHTML='';opCtl.length=0;
  patch.ops.forEach((o,i)=>{
    const col=el('div','opcol');const c={};
    const hd=el('div','ophd');
    hd.appendChild(el('span','opname','OP '+(i+1)));
    c.badge=el('span','badge','');hd.appendChild(c.badge);
    col.appendChild(hd);

    c.ratio=el('div','ratio','');col.appendChild(c.ratio);
    const setRatio=()=>{c.ratio.textContent=o.fixed?o.fixedHz.toFixed(0)+' Hz':'x '+ratioOf(o).toFixed(2);};

    c.coarse=mini('COARSE',0,31,1,o.coarse,v=>{o.coarse=v;setRatio();push();},v=>v==0?'0.5':v);
    c.fine  =mini('FINE',0,99,1,o.fine,v=>{o.fine=v;setRatio();push();});
    c.det   =mini('DETUNE',-30,30,1,o.detune,v=>{o.detune=v;push();},v=>v+'ct');
    c.lvl   =mini('LEVEL',0,99,1,o.level,v=>{o.level=v;push();});
    [c.coarse,c.fine,c.det,c.lvl].forEach(x=>col.appendChild(x));

    const cv=document.createElement('canvas');cv.width=150;cv.height=40;cv.className='egc';
    col.appendChild(cv);c.cv=cv;

    col.appendChild(el('div','sub','ENVELOPE'));
    c.r=[];c.l=[];
    for(let s=0;s<4;s++){
      const row=el('div','egrow');
      c.r[s]=mini('R'+(s+1),0,99,1,o.r[s],v=>{o.r[s]=v;drawEG(i);push();});
      c.l[s]=mini('L'+(s+1),0,99,1,o.l[s],v=>{o.l[s]=v;drawEG(i);push();});
      row.appendChild(c.r[s]);row.appendChild(c.l[s]);col.appendChild(row);
    }
    col.appendChild(el('div','sub','SCALING'));
    c.vs =mini('VELOCITY',0,7,1,o.vs,v=>{o.vs=v;push();});
    c.kls=mini('LEVEL/KEY',-99,99,1,o.kls,v=>{o.kls=v;push();});
    c.krs=mini('RATE/KEY',0,7,1,o.krs,v=>{o.krs=v;push();});
    [c.vs,c.kls,c.krs].forEach(x=>col.appendChild(x));

    setRatio();host.appendChild(col);opCtl.push(c);
  });
  markCarriers();patch.ops.forEach((_,i)=>drawEG(i));
}
function markCarriers(){
  const a=ALGOS[patch.algo];
  opCtl.forEach((c,i)=>{
    const carrier=a.carriers.includes(i);
    c.badge.textContent=carrier?'CARRIER':'MOD';
    c.badge.className='badge '+(carrier?'car':'mod');
    if(i===a.fbOp){c.badge.textContent+=' \u21BB';}
  });
}
const rateTime=r=>0.0025*Math.pow(10,(99-r)/99*4.2);
function drawEG(i){
  const o=patch.ops[i],cv=opCtl[i].cv,g=cv.getContext('2d'),w=cv.width,h=cv.height;
  g.clearRect(0,0,w,h);
  const t=[0,1,2,3].map(s=>Math.min(rateTime(o.r[s]),4));
  const tot=t.reduce((a,b)=>a+b,0)+0.4;
  const y=v=>h-2-(h-5)*(v/99);
  let x=1;g.beginPath();g.moveTo(x,y(0));
  for(let s=0;s<3;s++){x+=t[s]/tot*(w-2);g.lineTo(x,y(o.l[s]));}
  x+=0.4/tot*(w-2);g.lineTo(x,y(o.l[2]));
  x+=t[3]/tot*(w-2);g.lineTo(x,y(o.l[3]));
  g.strokeStyle='#e8a030';g.lineWidth=1.3;g.stroke();
  g.strokeStyle='#333';g.beginPath();g.moveTo(0,h-1.5);g.lineTo(w,h-1.5);g.stroke();
}

/* Algorithmus-Grafik direkt aus der Datenstruktur */
function drawAlgo(){
  const a=ALGOS[patch.algo],svg=document.getElementById('algsvg');
  const depth=new Array(6).fill(0),seen=new Array(6).fill(false);
  const walk=(o,d)=>{depth[o]=Math.max(depth[o],d);seen[o]=true;a.mods[o].forEach(m=>walk(m,d+1));};
  a.carriers.forEach(c=>walk(c,0));
  const maxD=Math.max(...depth);
  const rows={};depth.forEach((d,o)=>{if(seen[o]){(rows[d]=rows[d]||[]).push(o);}});
  const W=260,H=26+maxD*34,BW=30,BH=20;
  const pos=[];
  Object.keys(rows).forEach(d=>{
    const list=rows[d],step=W/(list.length+1);
    list.forEach((o,k)=>{pos[o]={x:step*(k+1),y:H-10-d*34};});
  });
  let s='<svg viewBox="0 0 '+W+' '+(H+6)+'" width="100%" height="'+(H+6)+'">';
  for(let o=0;o<6;o++){if(!seen[o])continue;
    a.mods[o].forEach(m=>{s+='<line x1="'+pos[m].x+'" y1="'+(pos[m].y+BH/2)+'" x2="'+pos[o].x+'" y2="'+(pos[o].y-BH/2)+'" stroke="#555" stroke-width="1"/>';});}
  for(let o=0;o<6;o++){if(!seen[o])continue;
    const carrier=a.carriers.includes(o),p=pos[o];
    s+='<rect x="'+(p.x-BW/2)+'" y="'+(p.y-BH/2)+'" width="'+BW+'" height="'+BH+'" rx="3" fill="'+(carrier?'#2a2013':'#191919')+'" stroke="'+(carrier?'#e8a030':'#444')+'"/>';
    s+='<text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" font-size="11" font-family="Courier New" fill="'+(carrier?'#e8a030':'#999')+'">'+(o+1)+'</text>';
    if(o===a.fbOp)s+='<text x="'+(p.x+BW/2+4)+'" y="'+(p.y+4)+'" font-size="12" fill="#3ab0e8">\u21BB</text>';}
  svg.innerHTML=s+'</svg>';
}

/* ================= Klaviatur ================= */
const WHITE=[0,2,4,5,7,9,11];
function buildKeys(){
  const kb=document.getElementById('kb');kb.innerHTML='';
  const lo=48,hi=84,whites=[];
  for(let n=lo;n<=hi;n++)if(WHITE.includes(n%12))whites.push(n);
  const wPct=100/whites.length,bPct=wPct*0.6;
  const vel=e=>{const r=e.currentTarget.getBoundingClientRect();return Math.max(0.25,Math.min(1,(e.clientY-r.top)/r.height*0.85+0.3));};
  whites.forEach((n,i)=>{
    const k=el('div','wkey');k.style.width='calc('+wPct+'% - 1px)';
    if(n%12===0)k.appendChild(el('span','klbl','C'+(n/12-1)));
    k.addEventListener('mousedown',e=>{e.preventDefault();noteOn(n+octave*12,vel(e));k.classList.add('dn');});
    k.addEventListener('mouseup',()=>{noteOff(n+octave*12);k.classList.remove('dn');});
    k.addEventListener('mouseleave',()=>{noteOff(n+octave*12);k.classList.remove('dn');});
    kb.appendChild(k);
  });
  let wi=0;
  for(let n=lo;n<=hi;n++){
    if(WHITE.includes(n%12)){wi++;continue;}
    const k=el('div','bkey');
    k.style.left='calc('+(wi*wPct)+'% - '+(bPct/2)+'%)';k.style.width=bPct+'%';
    k.addEventListener('mousedown',e=>{e.preventDefault();noteOn(n+octave*12,vel(e));k.classList.add('dn');});
    k.addEventListener('mouseup',()=>{noteOff(n+octave*12);k.classList.remove('dn');});
    k.addEventListener('mouseleave',()=>{noteOff(n+octave*12);k.classList.remove('dn');});
    kb.appendChild(k);
  }
}
/* QWERTZ */
const KEYMAP={'y':48,'s':49,'x':50,'d':51,'c':52,'v':53,'g':54,'b':55,'h':56,'n':57,'j':58,'m':59,
 'q':60,'2':61,'w':62,'3':63,'e':64,'r':65,'5':66,'t':67,'6':68,'z':69,'7':70,'u':71,'i':72};
addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.key==='ArrowLeft'){octave=Math.max(-2,octave-1);showOct();return;}
  if(e.key==='ArrowRight'){octave=Math.min(2,octave+1);showOct();return;}
  const n=KEYMAP[e.key.toLowerCase()];if(n===undefined||e.repeat)return;noteOn(n+octave*12,0.85);
});
addEventListener('keyup',e=>{const n=KEYMAP[e.key.toLowerCase()];if(n!==undefined)noteOff(n+octave*12);});
const showOct=()=>document.getElementById('oct').textContent=(octave>0?'+':'')+octave;

/* Web MIDI */
function initMidi(){
  if(!navigator.requestMIDIAccess){document.getElementById('midi').textContent='MIDI: n/a';return;}
  navigator.requestMIDIAccess().then(a=>{
    const bind=()=>{let c=0;a.inputs.forEach(i=>{c++;i.onmidimessage=m=>{
      const[st,d1,d2]=m.data,cmd=st&0xf0;
      if(cmd===0x90&&d2>0)noteOn(d1,d2/127);
      else if(cmd===0x80||(cmd===0x90&&d2===0))noteOff(d1);
    };});document.getElementById('midi').textContent='MIDI: '+c+' in';};
    bind();a.onstatechange=bind;
  }).catch(()=>{document.getElementById('midi').textContent='MIDI: blocked';});
}

function scope(){
  const cv=document.getElementById('scope'),g=cv.getContext('2d'),b=new Uint8Array(analyser.fftSize);
  (function d(){requestAnimationFrame(d);analyser.getByteTimeDomainData(b);
    g.fillStyle='#141414';g.fillRect(0,0,cv.width,cv.height);
    g.strokeStyle='#e8a030';g.lineWidth=1.3;g.beginPath();
    const st=b.length/cv.width;
    for(let i=0;i<cv.width;i++){const v=b[Math.floor(i*st)]/128-1,y=v*cv.height/2*0.9+cv.height/2;i?g.lineTo(i,y):g.moveTo(i,y);}
    g.stroke();})();
}

/* ================= Verdrahtung ================= */
function refreshAll(){
  document.getElementById('alg').value=patch.algo;
  gFb._set(patch.fb);gTr._set(patch.transpose);gPd._set(patch.pitchDepth);
  gPt._set(Math.round(patch.pitchTime*1000));gMa._set(patch.master);
  buildOps();drawAlgo();push();
}
const gHost=document.getElementById('globals');
const gFb=mini('FEEDBACK',0,7,1,patch.fb,v=>{patch.fb=v;push();});
const gTr=mini('TRANSPOSE',-24,24,1,patch.transpose,v=>{patch.transpose=v;push();},v=>(v>0?'+':'')+v);
const gPd=mini('PITCH EG',-2,2,0.05,patch.pitchDepth,v=>{patch.pitchDepth=v;push();},v=>v.toFixed(2)+'st');
const gPt=mini('PITCH TIME',5,500,1,Math.round(patch.pitchTime*1000),v=>{patch.pitchTime=v/1000;push();},v=>v+'ms');
const gMa=mini('MASTER',0,99,1,patch.master,v=>{patch.master=v;push();});
[gFb,gTr,gPd,gPt,gMa].forEach(x=>gHost.appendChild(x));

const algSel=document.getElementById('alg');
ALGOS.forEach((a,i)=>{const o=document.createElement('option');o.value=i;o.textContent=a.n;algSel.appendChild(o);});
algSel.addEventListener('change',()=>{patch.algo=+algSel.value;markCarriers();drawAlgo();push();});

const preSel=document.getElementById('preset');
Object.keys(PRESETS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;preSel.appendChild(o);});
preSel.value='E-Piano  (Tine)';
preSel.addEventListener('change',()=>{patch=JSON.parse(JSON.stringify(PRESETS[preSel.value]));refreshAll();});

document.getElementById('panic').addEventListener('click',()=>{held.clear();setLed(false);if(node)node.port.postMessage({type:'allOff'});});
document.getElementById('start').addEventListener('click',()=>initAudio());
document.getElementById('octdn').addEventListener('click',()=>{octave=Math.max(-2,octave-1);showOct();});
document.getElementById('octup').addEventListener('click',()=>{octave=Math.min(2,octave+1);showOct();});
document.getElementById('dump').addEventListener('click',()=>{
  const b=new Blob([JSON.stringify(patch,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fm-patch.json';a.click();URL.revokeObjectURL(a.href);

buildKeys();showOct();refreshAll();initMidi();
