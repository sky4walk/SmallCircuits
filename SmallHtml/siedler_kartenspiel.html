<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das schnelle Kartenspiel</title>
<style>
:root{
  --tisch:#1f2b1c; --tisch-hell:#2c3b26; --linie:#43533a;
  --pergament:#f0e2c0; --pergament-tief:#d9c396; --tinte:#2a1e0e;
  --rot:#8f2420; --gold:#cfa244;
  --strasse:#6d9b4b; --ritter:#8288bd; --siedlung:#c8683a; --ausbau:#a8422c;
  --gut:#4f8a3d; --schlecht:#a33;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --kw:104px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(ellipse at 50% 0%,#33452b 0%,var(--tisch) 55%,#141d12 100%);
  color:var(--pergament); font-family:var(--ui); font-size:14px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}

/* ---------- Rahmen ---------- */
#app{display:flex;flex-direction:column;min-height:100%;max-width:1400px;margin:0 auto;padding:10px 12px 0}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--linie)}
header h1{font-size:20px;letter-spacing:.02em;color:var(--gold)}
header .sub{font-size:12px;opacity:.6;font-family:var(--display);font-style:italic}
header .spacer{flex:1}
button{font:inherit;cursor:pointer}
.btn{
  background:linear-gradient(#3a4b32,#2a3925);border:1px solid var(--linie);
  color:var(--pergament);border-radius:5px;padding:6px 12px;line-height:1.3;
  transition:background .12s,border-color .12s;
}
.btn:hover:not(:disabled){background:linear-gradient(#4a5f3f,#35472e);border-color:var(--gold)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.prim{background:linear-gradient(#a52c26,#7b1e1a);border-color:#c4574f;font-weight:600}
.btn.prim:hover:not(:disabled){background:linear-gradient(#c0362f,#8f2521)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Karten ---------- */
.karte{
  width:var(--kw); aspect-ratio:449/683; border-radius:6px; flex:none;
  background:#0006 center/cover no-repeat; box-shadow:0 2px 5px #0007;
  position:relative; display:block; border:0; padding:0;
}
.karte.klick{cursor:pointer;transition:transform .12s,box-shadow .12s}
.karte.klick:hover{transform:translateY(-6px);box-shadow:0 8px 16px #0009}
.karte.gewaehlt{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 8px 18px #000a}
.karte .zahl{
  position:absolute;right:-5px;top:-5px;background:var(--rot);color:#fff;
  border-radius:999px;min-width:21px;height:21px;font-size:12px;font-weight:700;
  display:grid;place-items:center;padding:0 5px;box-shadow:0 1px 3px #0008;
}
.karte.leer{background:#0004;border:1px dashed var(--linie);display:grid;place-items:center;
  font-size:11px;color:#ffffff55;text-align:center;padding:4px}

/* ---------- Bereiche ---------- */
.zone{margin:12px 0}
.zone > h2{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  opacity:.85;margin-bottom:7px;font-family:var(--ui);font-weight:700;
}
.reihe{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.stapel{display:flex;flex-direction:column;align-items:center;gap:5px}
.stapel .lbl{font-size:11px;opacity:.7;text-align:center;max-width:var(--kw);line-height:1.25}

/* Tableau eines Spielers */
.spieler{
  border:1px solid var(--linie);border-radius:8px;padding:9px 11px;background:#ffffff06;
  margin-bottom:9px;
}
.spieler.dran{border-color:var(--gold);background:#cfa2440f;box-shadow:0 0 0 1px #cfa24433}
.spieler .kopf{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.spieler .name{font-family:var(--display);font-size:16px}
.sp{background:var(--rot);border-radius:999px;padding:1px 9px;font-weight:700;font-size:12px}
.tag{font-size:11px;border:1px solid var(--linie);border-radius:999px;padding:1px 8px;opacity:.85}
.hand-anz{font-size:12px;opacity:.7}
.auslage{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.gruppe{display:flex;gap:5px;align-items:flex-start}
.gruppe .kleben{margin-left:-72px}

/* gestapelte Straßen/Ritter: nur unteres Drittel sichtbar */
.turm{position:relative;width:var(--kw)}
.turm .karte{position:absolute;left:0}
.seite{
  position:absolute;left:4px;bottom:4px;background:#f4ecd8;color:#2a1e0e;
  border-radius:4px;width:17px;height:17px;font-size:11px;font-weight:700;
  display:grid;place-items:center;font-family:var(--display);
}

/* Hand */
#hand .reihe{gap:6px}
.hinweis{font-size:12.5px;opacity:.75;line-height:1.5;max-width:62ch}

/* Aktionsleiste */
#aktionen{
  position:sticky;bottom:0;background:linear-gradient(180deg,#1a2417f0,#141d12);
  border-top:1px solid var(--linie);margin:14px -12px 0;padding:10px 12px;
  backdrop-filter:blur(6px);
}
.phasen{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.phase{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;
  border:1px solid var(--linie);border-radius:999px;opacity:.45}
.phase.aktiv{opacity:1;border-color:var(--gold);color:var(--gold)}
.knopfreihe{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.kosten{font-size:11px;opacity:.7;display:block;margin-top:2px;font-variant-numeric:tabular-nums}

/* Log */
#log{
  height:132px;overflow:auto;border:1px solid var(--linie);border-radius:6px;
  padding:8px 10px;background:#0000002e;font-size:12.5px;line-height:1.55;
}
#log p{margin:0 0 3px}
#log .zug{color:var(--gold);font-weight:600;margin-top:6px}
#log .ereignis{color:#e8a86a}

/* Dialog */
dialog{
  border:1px solid var(--gold);border-radius:10px;background:#22301d;color:var(--pergament);
  padding:0;max-width:min(680px,94vw);box-shadow:0 20px 60px #000b;
}
dialog::backdrop{background:#000a}
dialog .inhalt{padding:18px 20px}
dialog h3{font-size:19px;color:var(--gold);margin-bottom:8px}
dialog p{margin:0 0 12px;line-height:1.55;font-size:13.5px}
dialog .reihe{margin-bottom:14px}
dialog .schluss{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.res-wahl{display:flex;gap:7px;flex-wrap:wrap}
.res-wahl button{
  background:#0003;border:1px solid var(--linie);border-radius:6px;padding:4px;
  color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;
}
.res-wahl button:hover:not(:disabled){border-color:var(--gold)}
.res-wahl img{width:52px;border-radius:3px;display:block}

@media(max-width:760px){
  :root{--kw:74px}
  header h1{font-size:17px}
  .gruppe .kleben{margin-left:-52px}
  #log{height:100px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Das schnelle Kartenspiel</h1>
    <span class="sub">Catan · 2–4 Spieler · 10 Siegpunkte</span>
    <span class="spacer"></span>
    <button class="btn" id="btn-neu">Neues Spiel</button>
    <button class="btn" id="btn-regeln">Regeln</button>
  </header>

  <div id="gegner" class="zone"></div>

  <div class="zone" id="tisch">
    <h2>Tisch</h2>
    <div class="reihe" id="tisch-reihe"></div>
  </div>

  <div class="zone" id="ich"></div>

  <div class="zone">
    <h2>Verlauf</h2>
    <div id="log"></div>
  </div>

  <div id="aktionen">
    <div class="phasen" id="phasen"></div>
    <div class="knopfreihe" id="knoepfe"></div>
    <div class="hinweis" id="hinweis" style="margin-top:7px"></div>
  </div>
</div>

<dialog id="dlg"><div class="inhalt" id="dlg-inhalt"></div></dialog>

  bibliothek:    {name:'Bibliothek',    sp:3, text:'Wenn Sie mit einem Mitspieler tauschen, dürfen Sie 1 Rohstoffkarte aus seiner offenen Hand aussuchen (1× pro Zug).'},
  rathaus:       {name:'Rathaus',       sp:4, text:'Wenn Sie das Rathaus bauen, müssen Sie 2 Erz zusätzlich zahlen.'},
};

// Kartenbestand nach Spielerzahl (Spielerzahlsymbole auf den Karten)
const BESTAND = {
  2:{strasse:5, ritter:2, ausbau:['kirche','stadtburg','universitaet','rathaus','bibliothek'],
     stadt:{raeuber:5, markt:2}},
  3:{strasse:7, ritter:4, ausbau:['kirche','kirche','stadtburg','haendlergilde','universitaet','rathaus','bibliothek'],
     stadt:{raeuber:8, markt:3}},
  4:{strasse:9, ritter:5, ausbau:['kirche','kirche','stadtburg','stadtburg','haendlergilde','haendlergilde','universitaet','rathaus','bibliothek'],
     stadt:{raeuber:11, markt:4}},
};

const BILD_AUSBAU = {kirche:'kirche',stadtburg:'stadtburg',haendlergilde:'haendlergilde',
                     universitaet:'universitaet',rathaus:'rathaus',bibliothek:'bibliothek'};

let S = null;              // Spielzustand
let wahl = null;           // ausgewählte Handkarte (Index)
let modus = null;          // laufende Interaktion

const $  = s => document.querySelector(s);
const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
const misch = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a; };
const zaehl = h => { const c={}; RES.forEach(r=>c[r]=0); h.forEach(r=>c[r]++); return c; };

/* ---------------------------------------------------------------- Aufbau */

function neuesSpiel(anzahl){
  const b = BESTAND[anzahl];

  const stadtStapel = misch([
    ...Array(b.stadt.raeuber).fill('raeuber'),
    ...Array(b.stadt.markt).fill('markt'),
  ]);

  const zieh = misch(RES.flatMap(r => Array(RES_ANZAHL[r]).fill(r)));

  S = {
    anzahl,
    spieler: Array.from({length:anzahl}, (_,i)=>({
      id:i,
      name: i===0 ? 'Sie' : ['Nord','Ost','Süd'][i-1],
      ki: i!==0,
      hand: [],
      siedlungen: [],        // {stadt:false, ereignis:'raeuber'|'markt', ausbau:null}
      strassen: 1,           // Startauslage: 1 Straße (A-Seite)
      ritter: 0,
      genutzt: {},
    })),
    vorratStadt: stadtStapel,
    vorrat: {strasse: b.strasse - anzahl, ritter: b.ritter, ausbau: b.ausbau.slice()},
    zieh, ablage: [], markt: [],
    richtung: 1,             // Pfeilrichtung der Schicksalskarte (nur 3–4 Spieler)
    dran: 0, phase:'tausch',
    tauschRest: 0, gebaut: {},
    abwerfen: 0,             // offene Abwürfe des menschlichen Spielers (Räuberüberfall)
    fortsetzen: null,        // Rückruf, wenn der Abwurf erledigt ist
    ohneBau: 0, bestJe: 1,   // Züge ohne neuen Punkterekord – erkennt ein Patt
    log: [], vorbei:false,
  };

  // Startauslage: je 1 Siedlung, 1 Straße, Baukosten-Übersicht
  S.spieler.forEach(p => p.siedlungen.push({stadt:false, ereignis:S.vorratStadt.pop(), ausbau:null}));
  // Markt: 5 offene Rohstoffkarten
  for(let i=0;i<5;i++) S.markt.push(ziehen());
  // je 3 Handkarten
  S.spieler.forEach(p => { for(let i=0;i<3;i++) p.hand.push(ziehen()); });

  logRaw('Neues Spiel mit '+anzahl+' Spielern. Wer zuerst 10 Siegpunkte erreicht, gewinnt.','zug');
  zugBeginn();
}

function ziehen(){
  if(!S.zieh.length){
    if(!S.ablage.length) return null;
    S.zieh = misch(S.ablage); S.ablage = [];
    log('Der Nachziehstapel war leer – die Ablage wurde gemischt.');
  }
  return S.zieh.pop();
}

/* ------------------------------------------------------------ Siegpunkte */

function sp(p){
  let n = 0;
  p.siedlungen.forEach(s => {
    if(s.ausbau) n += AUSBAU[s.ausbau].sp;   // Stadt zählt darunter nicht mehr
    else n += s.stadt ? 2 : 1;
  });
  n += Math.floor(p.strassen/2);             // B-Seiten: 2., 4., … Karte
  n += Math.floor(p.ritter/2);
  return n;
}
const aSeiten = n => Math.ceil(n/2);         // A-Seiten (Vorteil) im Turm
const hatAusbau = (p,typ) => p.siedlungen.some(s => s.ausbau===typ);

/* ------------------------------------------------------- Baukosten zahlen */
/* Ersatzregeln: 3 gleiche Rohstoffe → 1 beliebiger (beliebig oft);
   Universität: 1× pro Zug 1 Kostenrohstoff durch beliebigen anderen ersetzen. */

function planZahlung(p, kosten){
  const c = zaehl(p.hand);
  const plan = [];                       // zu zahlende Karten
  const fehlt = [];
  for(const r in kosten){
    const direkt = Math.min(c[r], kosten[r]);
    for(let i=0;i<direkt;i++) plan.push(r);
    c[r] -= direkt;
    for(let i=direkt;i<kosten[r];i++) fehlt.push(r);
  }
  if(!fehlt.length) return {plan, uni:false};

  const uniFrei = hatAusbau(p,'universitaet') && !p.genutzt.uni;

  // Variante A: Universität deckt einen Fehlbetrag, Rest über 3:1
  const versuch = (mitUni) => {
    const rest = zaehl([]); RES.forEach(r=>rest[r]=c[r]);
    const zusatz = [];
    let offen = fehlt.length;
    if(mitUni){
      const r = RES.filter(r=>rest[r]>0).sort((a,b)=>rest[b]-rest[a])[0];
      if(!r) return null;
      rest[r]--; zusatz.push(r); offen--;
    }
    for(let i=0;i<offen;i++){
      const r = RES.filter(r=>rest[r]>=3).sort((a,b)=>rest[b]-rest[a])[0];
      if(!r) return null;
      rest[r]-=3; zusatz.push(r,r,r);
    }
    return zusatz;
  };

  let z = versuch(false);
  if(z) return {plan:[...plan,...z], uni:false};
  if(uniFrei){ z = versuch(true); if(z) return {plan:[...plan,...z], uni:true}; }
  return null;
}

const kannZahlen = (p,k) => planZahlung(p,k) !== null;

function zahle(p, kosten){
  const z = planZahlung(p, kosten);
  if(!z) return false;
  z.plan.forEach(r => { p.hand.splice(p.hand.indexOf(r),1); S.ablage.push(r); });
  if(z.uni){ p.genutzt.uni = true; log(p.name+' nutzt die Universität beim Bezahlen.'); }
  return true;
}

const kostenText = k => Object.entries(k).map(([r,n]) => n+'× '+RES_NAME[r]).join(', ');

/* ------------------------------------------------------------- Bauobjekte */

function ausbauKosten(typ){
  const k = {...KOSTEN.ausbau};
  if(typ==='rathaus') k.erz += 2;
  return k;
}

function kannBauen(p, was){
  if(S.gebaut[was]) return false;                       // je Zug nur einmal
  switch(was){
    case 'siedlung': return S.vorratStadt.length>0 && kannZahlen(p,KOSTEN.siedlung);
    case 'stadt':    return p.siedlungen.some(s=>!s.stadt) && kannZahlen(p,KOSTEN.stadt);
    case 'ausbau':   return offeneAusbauten(p).length>0;
    case 'strasse':  return (S.vorrat.strasse>0 || opferFuer(p,'strassen')!==null) && kannZahlen(p,KOSTEN.strasse);
    case 'ritter':   return (S.vorrat.ritter>0  || opferFuer(p,'ritter')  !==null) && kannZahlen(p,KOSTEN.ritter);
  }
  return false;
}

function offeneAusbauten(p){
  if(!p.siedlungen.some(s=>s.stadt && !s.ausbau)) return [];
  const schon = new Set(p.siedlungen.filter(s=>s.ausbau).map(s=>s.ausbau));
  return [...new Set(S.vorrat.ausbau)]
    .filter(t => !schon.has(t))
    .filter(t => kannZahlen(p, ausbauKosten(t)));
}

/* Wem wird eine Straße / ein Ritter weggenommen, wenn der Vorrat leer ist?
   Reihenfolge: in Pfeilrichtung der Schicksalskarte, geschützte Spieler
   (Kirche: 1. Ritter, Stadtburg: erste drei Straßen) werden übersprungen. */
function opferFuer(p, feld){
  const n = S.anzahl;
  for(let k=1;k<n;k++){
    const q = S.spieler[((p.id + k*S.richtung) % n + n) % n];
    if(!q[feld]) continue;
    if(feld==='ritter'   && hatAusbau(q,'kirche')    && q.ritter   <= 1) continue;
    if(feld==='strassen' && hatAusbau(q,'stadtburg') && q.strassen <= 3) continue;
    return q;
  }
  return null;
}

function baue(p, was, extra){
  switch(was){
    case 'siedlung': {
      zahle(p, KOSTEN.siedlung);
      p.siedlungen.push({stadt:false, ereignis:S.vorratStadt.pop(), ausbau:null});
      log(p.name+' baut eine Siedlung.');
      break;
    }
    case 'stadt': {
      zahle(p, KOSTEN.stadt);
      const s = extra;  // gewählte Siedlung
      s.stadt = true;
      log(p.name+' baut eine Stadt.');
      ereignis(s.ereignis);
      break;
    }
    case 'ausbau': {
      const typ = extra.typ;
      zahle(p, ausbauKosten(typ));
      extra.stadt_.ausbau = typ;
      S.vorrat.ausbau.splice(S.vorrat.ausbau.indexOf(typ),1);
      log(p.name+' baut den Stadtausbau „'+AUSBAU[typ].name+'“.');
      break;
    }
    case 'strasse': case 'ritter': {
      const feld = was==='strasse' ? 'strassen' : 'ritter';
      zahle(p, KOSTEN[was]);
      if(S.vorrat[was] > 0){
        S.vorrat[was]--;
      } else {
        const q = opferFuer(p, feld);
        q[feld]--;
        log(p.name+' nimmt '+q.name+' die oberste '+(was==='strasse'?'Straßenkarte':'Ritterkarte')+' weg.','ereignis');
      }
      p[feld]++;
      log(p.name+' baut '+(was==='strasse'?'eine Straße':'einen Ritter')+
          ' ('+(p[feld]%2===1?'A':'B')+'-Seite).');
      break;
    }
  }
  S.gebaut[was] = true;
  pruefeSieg();
}

/* -------------------------------------------------------------- Ereignisse */

function ereignis(art){
  if(art==='markt'){
    log('Markttag: Die Karten des Marktes kommen auf die Ablage, 5 neue werden ausgelegt.','ereignis');
    S.ablage.push(...S.markt); S.markt = [];
    for(let i=0;i<5;i++){ const k=ziehen(); if(k) S.markt.push(k); }
  } else {
    log('Räuberüberfall: Wer mehr als 7 Rohstoffkarten hat, gibt bis auf 7 ab.','ereignis');
    S.spieler.forEach(q => {
      if(q.ki || q.id!==0){                     // Computer wirft selbst ab
        while(q.hand.length > 7){
          const c = zaehl(q.hand);
          const r = RES.filter(r=>c[r]>0).sort((a,b)=>c[b]-c[a])[0];
          q.hand.splice(q.hand.indexOf(r),1); S.ablage.push(r);
        }
      } else if(q.hand.length > 7){
        S.abwerfen = q.hand.length - 7;         // Mensch wählt selbst aus
      }
    });
    if(S.anzahl > 2){ S.richtung *= -1; log('Die Schicksalskarte wird gewendet.','ereignis'); }
  }
}

function abwerfenKlick(idx){
  const p = S.spieler[0];
  const r = p.hand.splice(idx,1)[0]; S.ablage.push(r);
  S.abwerfen--; wahl = null;
  log('Sie werfen 1× '+RES_NAME[r]+' ab.');
  if(S.abwerfen === 0 && S.fortsetzen){ const f = S.fortsetzen; S.fortsetzen = null; f(); }
  else zeichne();
}

/* ------------------------------------------------------------- Zugablauf */

function zugBeginn(){
  const p = S.spieler[S.dran];
  p.genutzt = {};
  S.gebaut = {};
  S.phase = 'tausch';
  S.tauschRest = Math.max(1, aSeiten(p.strassen));
  logRaw('— '+p.name+' ist am Zug —','zug');
  if(p.ki) setTimeout(kiZug, 550); else zeichne();
}

function phaseWeiter(){
  if(S.phase==='tausch'){ S.phase='bau'; }
  else if(S.phase==='bau'){ nachziehen(); }
  zeichne();
}

function nachziehen(){
  const p = S.spieler[S.dran];
  const n = 2 + aSeiten(p.ritter);
  for(let i=0;i<n;i++){ const k=ziehen(); if(k) p.hand.push(k); }
  log(p.name+' zieht '+n+' Rohstoffkarten nach.');
  if(S.vorbei) return;

  // Patt erkennen: bewegt sich der Punktestand über viele Runden nicht mehr,
  // ist das Spiel festgefahren (z. B. wenn sich zwei Spieler dieselbe Straße
  // immer wieder gegenseitig wegnehmen).
  const best = Math.max(...S.spieler.map(sp));
  if(best > S.bestJe){ S.bestJe = best; S.ohneBau = 0; } else S.ohneBau++;
  if(!nochPunkteMoeglich() || S.ohneBau >= 25 * S.anzahl){ patt(); return; }

  S.dran = (S.dran + 1) % S.anzahl;      // immer im Uhrzeigersinn
  zugBeginn();
}

/* Kann überhaupt noch irgendjemand einen Siegpunkt gewinnen? Rohstoffe bleiben
   dabei außen vor – die fließen ja weiter nach. */
function nochPunkteMoeglich(){
  if(S.vorratStadt.length) return true;                       // neue Siedlung = 1 SP
  if(S.vorrat.strasse > 0 || S.vorrat.ritter > 0) return true;
  for(const p of S.spieler){
    if(p.siedlungen.some(s => !s.stadt)) return true;          // Siedlung → Stadt
    if(p.siedlungen.some(s => s.stadt && !s.ausbau)){
      const schon = new Set(p.siedlungen.filter(s=>s.ausbau).map(s=>s.ausbau));
      if([...new Set(S.vorrat.ausbau)].some(t => !schon.has(t))) return true;
    }
    if(opferFuer(p,'strassen') || opferFuer(p,'ritter')) return true;
  }
  return false;
}

function patt(){
  S.vorbei = true;
  const best = Math.max(...S.spieler.map(sp));
  const fuehrend = S.spieler.filter(p => sp(p) === best);
  logRaw('Patt – seit vielen Zügen kann niemand mehr bauen. '+
         'Vorne '+fuehrend.map(p=>p.name).join(' und ')+' mit '+best+' Siegpunkten.','zug');
  zeichne();
  setTimeout(()=>zeigeDialog(
    '<h3>Patt</h3><p>Der Vorrat ist erschöpft und niemand kann mehr bauen. '+
    'Nach Siegpunkten führt '+fuehrend.map(p=>p.name).join(' und ')+' mit '+best+'.</p>'+
    '<p>Endstand: '+S.spieler.map(p=>p.name+' '+sp(p)).join(' · ')+'</p>'+
    '<div class="schluss"><button class="btn prim" onclick="this.closest(\'dialog\').close()">Schließen</button></div>'
  ), 400);
}

function pruefeSieg(){
  const g = S.spieler.find(p => sp(p) >= 10);
  if(g && !S.vorbei){
    S.vorbei = true;
    logRaw(g.name+' erreicht 10 Siegpunkte und gewinnt!','zug');
    setTimeout(()=>zeigeDialog(
      '<h3>'+(g.ki?g.name+' gewinnt':'Sie gewinnen!')+'</h3>'+
      '<p>Endstand: '+S.spieler.map(p=>p.name+' '+sp(p)).join(' · ')+'</p>'+
      '<div class="schluss"><button class="btn prim" onclick="this.closest(\'dialog\').close()">Schließen</button></div>'
    ), 400);
  }
}

/* --------------------------------------------------------------- Tauschen */

function tauschStapel(idx){
  const p = S.spieler[S.dran];
  const r = p.hand.splice(idx,1)[0]; S.ablage.push(r);
  const neu = ziehen(); if(neu) p.hand.push(neu);
  S.tauschRest--; wahl=null;
  log(p.name+' tauscht 1 Karte mit dem Nachziehstapel.');
  zeichne();
}

function tauschMarkt(idx, marktIdx){
  const p = S.spieler[S.dran];
  const geben = p.hand.splice(idx,1)[0];
  p.hand.push(S.markt[marktIdx]);
  S.markt[marktIdx] = geben;
  S.tauschRest--; wahl=null; modus=null;
  log(p.name+' tauscht 1 Karte mit dem Markt.');
  zeichne();
}

function tauschSpieler(idx, ziel, gezielt){
  const p = S.spieler[S.dran], q = S.spieler[ziel];
  if(!q.hand.length) return;
  const geben = p.hand.splice(idx,1)[0];
  let nehmen;
  if(gezielt != null){ nehmen = q.hand.splice(gezielt,1)[0]; p.genutzt.biblio = true; }
  else nehmen = q.hand.splice(Math.random()*q.hand.length|0,1)[0];
  p.hand.push(nehmen); q.hand.push(geben);
  S.tauschRest--; wahl=null; modus=null;
  log(p.name+' tauscht 1 Karte mit '+q.name+(gezielt!=null?' (Bibliothek)':'')+'.');
  zeichne();
}

function haendlergilde(ziel){
  const p = S.spieler[S.dran], q = S.spieler[ziel];
  if(!q.hand.length) return;
  p.hand.push(q.hand.splice(Math.random()*q.hand.length|0,1)[0]);
  p.genutzt.gilde = true; modus=null;
  log(p.name+' zieht mit der Händlergilde 1 Karte bei '+q.name+'.');
  zeichne();
}

const gildeZiele = p => hatAusbau(p,'haendlergilde') && !p.genutzt.gilde
  ? S.spieler.filter(q => q.id!==p.id && q.hand.length && sp(q) >= sp(p)) : [];

/* --------------------------------------------------------------------- KI */

function kiZug(){
  if(S.vorbei) return;
  const p = S.spieler[S.dran];

  // Händlergilde nutzen
  const zi = gildeZiele(p);
  if(zi.length) haendlergilde(zi.sort((a,b)=>b.hand.length-a.hand.length)[0].id);

  // Tauschphase: gezielt die Rohstoffe für das nächste Bauziel besorgen
  let schutz = 0;
  while(S.tauschRest > 0 && schutz++ < 12 && kiTausch(p)) {}

  S.phase = 'bau';
  let s2 = 0;
  while(s2++ < 8 && kiBau(p)) {}

  zeichne();
  kiEnde();
}

function kiEnde(){
  if(S.vorbei){ zeichne(); return; }
  if(S.abwerfen > 0){ S.fortsetzen = kiEnde; zeichne(); return; }  // wartet auf den Abwurf
  setTimeout(() => { if(!S.vorbei) nachziehen(); else zeichne(); }, 500);
}

function kiZiel(p){
  // Bauziele in Prioritätsreihenfolge
  const l = [];
  if(p.ritter   < 2) l.push(['ritter',   KOSTEN.ritter]);      // Motor: +1 nachziehen
  if(p.strassen < 3) l.push(['strasse',  KOSTEN.strasse]);     // Motor: +1 Tausch
  if(p.siedlungen.some(s=>s.stadt && !s.ausbau)) l.push(['ausbau', ausbauKosten('kirche')]);
  if(p.siedlungen.some(s=>!s.stadt))             l.push(['stadt',    KOSTEN.stadt]);
  if(S.vorratStadt.length)                        l.push(['siedlung', KOSTEN.siedlung]);
  l.push(['ritter', KOSTEN.ritter], ['strasse', KOSTEN.strasse]);
  return l;
}

function kiTausch(p){
  // erstes Ziel, das noch nicht bezahlbar ist
  const ziel = kiZiel(p).find(([,k]) => !kannZahlen(p, k));
  if(!ziel) return false;                       // alles Wichtige ist bezahlbar
  const k = ziel[1], c = zaehl(p.hand);
  const fehlt = RES.filter(r => (k[r]||0) > c[r]);
  if(!fehlt.length) return false;

  // abzugeben: was am wenigsten gebraucht wird (nie unter den Bedarf gehen)
  const geben = RES.filter(r => c[r] > 0 && c[r] > (k[r]||0))
                   .sort((a,b) => (c[b]-(k[b]||0)) - (c[a]-(k[a]||0)))[0];
  if(!geben) return false;
  const idx = p.hand.indexOf(geben);
  const mA = aSeiten(p.strassen) > 0;

  if(mA){
    const mi = S.markt.findIndex(r => fehlt.includes(r));
    if(mi >= 0){ tauschMarkt(idx, mi); return true; }
    const ziele = S.spieler.filter(q => q.id!==p.id && q.hand.length >= 3);
    if(ziele.length && Math.random() < .55){
      const q = ziele.sort((a,b)=>b.hand.length-a.hand.length)[0];
      let gezielt = null;
      if(hatAusbau(p,'bibliothek') && !p.genutzt.biblio){
        const i = q.hand.findIndex(r => fehlt.includes(r));
        if(i >= 0) gezielt = i;
      }
      tauschSpieler(idx, q.id, gezielt);
      return true;
    }
  }
  tauschStapel(idx);
  return true;
}

function kiBau(p){
  // Stadtausbau (3–4 SP)
  const off = offeneAusbauten(p);
  if(!S.gebaut.ausbau && off.length){
    const typ = off.sort((a,b)=>AUSBAU[b].sp-AUSBAU[a].sp)[0];
    const ziel = p.siedlungen.find(s=>s.stadt && !s.ausbau);
    baue(p,'ausbau',{typ, stadt_:ziel}); return true;
  }
  if(kannBauen(p,'stadt')){
    baue(p,'stadt', p.siedlungen.find(s=>!s.stadt)); return true;
  }
  if(kannBauen(p,'siedlung')){ baue(p,'siedlung'); return true; }
  if(p.ritter < 3 && kannBauen(p,'ritter')){ baue(p,'ritter'); return true; }
  if(p.strassen < 4 && kannBauen(p,'strasse')){ baue(p,'strasse'); return true; }
  // Endspurt: jede B-Seite bringt 1 SP
  if(sp(p) >= 7){
    if(kannBauen(p,'ritter')){ baue(p,'ritter'); return true; }
    if(kannBauen(p,'strasse')){ baue(p,'strasse'); return true; }
  }
  return false;
}

/* ------------------------------------------------------------------- Log */

function logRaw(t, cls){ S.log.push({t, cls}); }
function log(t, cls){ logRaw(t, cls); }

/* --------------------------------------------------------------- Zeichnen */

function bild(id){ return IMG[id]; }

function karteEl(id, opt={}){
  const n = el(opt.klick ? 'button' : 'div', 'karte' + (opt.klick?' klick':'') + (opt.gewaehlt?' gewaehlt':''));
  if(opt.leer){ n.classList.add('leer'); n.textContent = opt.leer; }
  else n.style.backgroundImage = 'url('+bild(id)+')';
  if(opt.titel) n.title = opt.titel;
  if(opt.zahl != null){ const z=el('div','zahl',String(opt.zahl)); n.appendChild(z); }
  if(opt.seite){ const s=el('div','seite',opt.seite); n.appendChild(s); }
  if(opt.klick){ n.type='button'; n.addEventListener('click',opt.klick); n.setAttribute('aria-label', opt.titel||''); }
  return n;
}

function turmEl(anz, bildA, bildB, name){
  // Karten überlappend: unterste zuerst, A/B abwechselnd
  const w = el('div','turm');
  const versatz = 26;
  const h = Math.max(1, anz);
  w.style.height = 'calc(var(--kw)*683/449*'+ (anz?1:1) +' + '+ ((h-1)*versatz) +'px)';
  if(!anz){ w.appendChild(karteEl(null,{leer:name})); w.style.height='auto'; return w; }
  for(let i=0;i<anz;i++){
    const a = (i%2===0);
    const k = karteEl(a?bildA:bildB, {titel:name+' '+(i+1)+' ('+(a?'A':'B')+'-Seite)', seite:a?'A':'B'});
    k.style.top = (i*versatz)+'px';
    k.style.zIndex = String(i);
    w.appendChild(k);
  }
  return w;
}

function spielerEl(p, ichs){
  const box = el('div','spieler'+(p.id===S.dran?' dran':''));
  const kopf = el('div','kopf');
  kopf.appendChild(el('span','name',p.name));
  kopf.appendChild(el('span','sp',sp(p)+' SP'));
  if(p.ki) kopf.appendChild(el('span','tag','Computer'));
  kopf.appendChild(el('span','hand-anz', p.hand.length+' Handkarten'));
  if(p.strassen) kopf.appendChild(el('span','tag', aSeiten(p.strassen)+'× Tausch'));
  if(p.ritter)   kopf.appendChild(el('span','tag','+'+aSeiten(p.ritter)+' nachziehen'));
  box.appendChild(kopf);

  const aus = el('div','auslage');

  // Siedlungen / Städte / Ausbauten
  const g1 = el('div','gruppe');
  p.siedlungen.forEach(s => {
    const st = el('div','stapel');
    if(s.ausbau){
      st.appendChild(karteEl(BILD_AUSBAU[s.ausbau], {titel:AUSBAU[s.ausbau].name+' – '+AUSBAU[s.ausbau].text}));
      st.appendChild(el('div','lbl',AUSBAU[s.ausbau].name+' · '+AUSBAU[s.ausbau].sp+' SP'));
    } else if(s.stadt){
      st.appendChild(karteEl(s.ereignis==='markt'?'stadt_markt':'stadt_raeuber',{titel:'Stadt'}));
      st.appendChild(el('div','lbl','Stadt · 2 SP'));
    } else {
      st.appendChild(karteEl('siedlung',{titel:'Siedlung'}));
      st.appendChild(el('div','lbl','Siedlung · 1 SP'));
    }
    g1.appendChild(st);
  });
  if(p.siedlungen.length) aus.appendChild(g1);

  if(p.strassen){
    const st = el('div','stapel');
    st.appendChild(turmEl(p.strassen,'strasse_a','strasse_b','Straße'));
    st.appendChild(el('div','lbl',p.strassen+' Straßen · '+Math.floor(p.strassen/2)+' SP'));
    aus.appendChild(st);
  }
  if(p.ritter){
    const st = el('div','stapel');
    st.appendChild(turmEl(p.ritter,'ritter_a','ritter_b','Ritter'));
    st.appendChild(el('div','lbl',p.ritter+' Ritter · '+Math.floor(p.ritter/2)+' SP'));
    aus.appendChild(st);
  }
  box.appendChild(aus);

  if(ichs){
    const h = el('div','zone'); h.id='hand';
    h.appendChild(el('h2',null,'Ihre Handkarten ('+p.hand.length+')'));
    const r = el('div','reihe');
    const sortiert = p.hand.map((res,i)=>({res,i})).sort((a,b)=>RES.indexOf(a.res)-RES.indexOf(b.res));
    sortiert.forEach(({res,i}) => {
      r.appendChild(karteEl(res, {
        titel: RES_NAME[res],
        gewaehlt: wahl===i,
        klick: S.abwerfen > 0
          ? () => abwerfenKlick(i)
          : () => { wahl = (wahl===i ? null : i); modus=null; zeichne(); }
      }));
    });
    if(!p.hand.length) r.appendChild(karteEl(null,{leer:'keine Karten'}));
    h.appendChild(r);
    box.appendChild(h);
  }
  return box;
}

function zeichne(){
  // Gegner
  const g = $('#gegner'); g.innerHTML='';
  S.spieler.filter(p=>p.id!==0).forEach(p => g.appendChild(spielerEl(p,false)));

  // Tisch
  const t = $('#tisch-reihe'); t.innerHTML='';
  const marktSt = el('div','stapel');
  const mr = el('div','reihe');
  S.markt.forEach((r,i) => {
    const aktiv = modus==='markt' && wahl!=null;
    mr.appendChild(karteEl(r,{
      titel:RES_NAME[r],
      klick: aktiv ? () => tauschMarkt(wahl,i) : null,
    }));
  });
  marktSt.appendChild(mr);
  const ml = el('div','lbl','Markt'); ml.style.maxWidth='none'; marktSt.appendChild(ml);
  t.appendChild(marktSt);

  const mk = (id,label,zahl) => {
    const st = el('div','stapel');
    st.appendChild(karteEl(id,{zahl}));
    st.appendChild(el('div','lbl',label));
    return st;
  };
  t.appendChild(mk('rohstoff_back','Nachziehstapel', S.zieh.length));
  t.appendChild(mk('bau_back','Ablage', S.ablage.length));
  t.appendChild(mk('siedlung','Siedlungen', S.vorratStadt.length));
  t.appendChild(mk('strasse_a','Straßen', S.vorrat.strasse));
  t.appendChild(mk('ritter_a','Ritter', S.vorrat.ritter));
  t.appendChild(mk('kirche','Stadtausbauten', S.vorrat.ausbau.length));
  if(S.anzahl > 2){
    const st = el('div','stapel');
    st.appendChild(karteEl(S.richtung===1?'schicksal_strasse':'schicksal_ritter',
      {titel:'Schicksalskarte – Pfeilrichtung '+(S.richtung===1?'im Uhrzeigersinn':'gegen den Uhrzeigersinn')}));
    st.appendChild(el('div','lbl','Schicksalskarte'));
    t.appendChild(st);
  }

  // Ich
  const i = $('#ich'); i.innerHTML='';
  i.appendChild(spielerEl(S.spieler[0], true));

  // Log
  const L = $('#log'); L.innerHTML='';
  S.log.slice(-140).forEach(e => { const p=el('p',e.cls||null,e.t); L.appendChild(p); });
  L.scrollTop = L.scrollHeight;

  zeichneAktionen();
}

function zeichneAktionen(){
  const ph = $('#phasen'); ph.innerHTML='';
  [['tausch','1 · Tauschen'],['bau','2 · Bauen'],['zieh','3 · Nachziehen']].forEach(([k,n])=>{
    ph.appendChild(el('span','phase'+(S.phase===k?' aktiv':''), n));
  });

  const K = $('#knoepfe'); K.innerHTML='';
  const H = $('#hinweis'); H.textContent='';
  const p = S.spieler[0];
  const meinZug = S.dran===0 && !S.vorbei;

  if(S.vorbei){ H.textContent = 'Das Spiel ist beendet.'; return; }
  if(S.abwerfen > 0){
    H.textContent = 'Räuberüberfall: Sie müssen noch '+S.abwerfen+
      ' Rohstoffkarte(n) abgeben. Klicken Sie die Karten in Ihrer Hand an.';
    return;
  }
  if(!meinZug){ H.textContent = S.spieler[S.dran].name+' überlegt …'; return; }

  const knopf = (label, aktiv, fn, unter) => {
    const b = el('button','btn');
    b.appendChild(document.createTextNode(label));
    if(unter) b.appendChild(el('span','kosten',unter));
    b.disabled = !aktiv; if(aktiv) b.addEventListener('click',fn);
    K.appendChild(b); return b;
  };

  if(S.phase==='tausch'){
    const zi = gildeZiele(p);
    if(zi.length){
      knopf('Händlergilde nutzen', true, () => waehleSpieler(zi, q=>haendlergilde(q.id)),
            '1 Karte ziehen (1× pro Zug)');
    }
    if(S.tauschRest > 0 && p.hand.length){
      if(wahl==null){
        H.textContent = 'Sie dürfen noch '+S.tauschRest+' Rohstoffkarte(n) tauschen. '+
          'Wählen Sie dazu eine Handkarte aus.';
      } else {
        const mitA = aSeiten(p.strassen) > 0;
        knopf('Mit Nachziehstapel', true, ()=>tauschStapel(wahl));
        knopf('Mit dem Markt', mitA, ()=>{ modus='markt'; zeichne(); },
              mitA?'Karte im Markt anklicken':'braucht eine A-Straße');
        knopf('Mit einem Mitspieler', mitA, ()=>waehleTauschpartner(),
              mitA?null:'braucht eine A-Straße');
        H.textContent = 'Ausgewählt: '+RES_NAME[p.hand[wahl]]+
          ' · noch '+S.tauschRest+' Tausch(e)'+
          (modus==='markt' ? ' · jetzt eine Marktkarte anklicken' : '');
      }
    } else {
      H.textContent = S.tauschRest>0 ? 'Keine Handkarten zum Tauschen.' : 'Keine Tauschmöglichkeit mehr.';
    }
    knopf('Weiter zum Bauen', true, phaseWeiter).classList.add('prim');
    return;
  }

  if(S.phase==='bau'){
    const b = (was,label,kosten) =>
      knopf(label, kannBauen(p,was), ()=>bauKlick(was), kostenText(kosten));
    b('strasse','Straße', KOSTEN.strasse);
    b('ritter','Ritter', KOSTEN.ritter);
    b('siedlung','Siedlung', KOSTEN.siedlung);
    b('stadt','Stadt', KOSTEN.stadt);
    knopf('Stadtausbau', kannBauen(p,'ausbau'), ()=>bauKlick('ausbau'), kostenText(KOSTEN.ausbau));
    knopf('Zug beenden & nachziehen', true, phaseWeiter,
          (2+aSeiten(p.ritter))+' Karten').classList.add('prim');
    H.textContent = 'Jedes Bauobjekt darf pro Zug nur einmal gebaut werden. '+
      '1 fehlender Rohstoff lässt sich durch 3 gleiche ersetzen'+
      (hatAusbau(p,'universitaet') && !p.genutzt.uni ? '; die Universität ersetzt zusätzlich 1 Rohstoff beliebig.' : '.');
  }
}

/* -------------------------------------------------------- Interaktionen */

function bauKlick(was){
  const p = S.spieler[0];
  if(was==='stadt'){
    const kandidaten = p.siedlungen.filter(s=>!s.stadt);
    if(kandidaten.length===1){ baue(p,'stadt',kandidaten[0]); zeichne(); return; }
    waehleKarte('Welche Siedlung wird zur Stadt?',
      kandidaten.map(s=>({bild:'siedlung', label:'Siedlung', wert:s})),
      s=>{ baue(p,'stadt',s); zeichne(); });
    return;
  }
  if(was==='ausbau'){
    const typen = offeneAusbauten(p);
    const staedte = p.siedlungen.filter(s=>s.stadt && !s.ausbau);
    const waehleStadt = (typ) => {
      if(staedte.length===1){ baue(p,'ausbau',{typ, stadt_:staedte[0]}); zeichne(); return; }
      waehleKarte('Auf welche Stadt?',
        staedte.map(s=>({bild:s.ereignis==='markt'?'stadt_markt':'stadt_raeuber',label:'Stadt',wert:s})),
        s=>{ baue(p,'ausbau',{typ, stadt_:s}); zeichne(); });
    };
    waehleKarte('Welchen Stadtausbau?',
      typen.map(t=>({bild:BILD_AUSBAU[t], label:AUSBAU[t].name+' · '+AUSBAU[t].sp+' SP',
                     titel:AUSBAU[t].text+' Kosten: '+kostenText(ausbauKosten(t)), wert:t})),
      waehleStadt);
    return;
  }
  baue(p, was); zeichne();
}

function waehleTauschpartner(){
  const p = S.spieler[0];
  const ziele = S.spieler.filter(q=>q.id!==0 && q.hand.length);
  if(!ziele.length){ H_hinweis('Kein Mitspieler hat Handkarten.'); return; }
  waehleSpieler(ziele, q => {
    if(hatAusbau(p,'bibliothek') && !p.genutzt.biblio){
      waehleKarte('Bibliothek: Karte aus der offenen Hand von '+q.name+' aussuchen',
        q.hand.map((r,i)=>({bild:r, label:RES_NAME[r], wert:i})),
        i => tauschSpieler(wahl, q.id, i),
        'Verdeckt ziehen', () => tauschSpieler(wahl, q.id, null));
    } else tauschSpieler(wahl, q.id, null);
  });
}

function H_hinweis(t){ $('#hinweis').textContent = t; }

function waehleSpieler(ziele, fn){
  const d = $('#dlg-inhalt');
  d.innerHTML = '<h3>Welcher Mitspieler?</h3><div class="schluss" id="wahl-knoepfe"></div>';
  const box = d.querySelector('#wahl-knoepfe');
  box.style.justifyContent = 'flex-start';
  ziele.forEach(q => {
    const b = el('button','btn', q.name+' ('+q.hand.length+' Karten, '+sp(q)+' SP)');
    b.onclick = () => { $('#dlg').close(); fn(q); };
    box.appendChild(b);
  });
  const ab = el('button','btn','Abbrechen'); ab.onclick = ()=>$('#dlg').close(); box.appendChild(ab);
  $('#dlg').showModal();
}

function waehleKarte(titel, optionen, fn, altLabel, altFn){
  const d = $('#dlg-inhalt');
  d.innerHTML = '<h3>'+titel+'</h3>';
  const r = el('div','reihe');
  optionen.forEach(o => {
    const st = el('div','stapel');
    const k = karteEl(o.bild,{klick:()=>{ $('#dlg').close(); fn(o.wert); }, titel:o.titel||o.label});
    st.appendChild(k); st.appendChild(el('div','lbl',o.label));
    r.appendChild(st);
  });
  d.appendChild(r);
  const s = el('div','schluss');
  if(altLabel){ const a=el('button','btn',altLabel); a.onclick=()=>{$('#dlg').close(); altFn();}; s.appendChild(a); }
  const ab = el('button','btn','Abbrechen'); ab.onclick=()=>$('#dlg').close(); s.appendChild(ab);
  d.appendChild(s);
  $('#dlg').showModal();
}

function zeigeDialog(html){ $('#dlg-inhalt').innerHTML = html; $('#dlg').showModal(); }

/* --------------------------------------------------------------- Start */

$('#btn-neu').onclick = () => zeigeDialog(

  '</div>'
);
document.addEventListener('click', e => {
  const b = e.target.closest('#dlg [data-n]');
  if(b){ $('#dlg').close(); neuesSpiel(+b.dataset.n); }
});

</script>
