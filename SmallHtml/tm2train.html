<!--
  Eingebettete Turingmaschine: wird beim Öffnen der Seite automatisch geladen.
  "💾 HTML + TM" schreibt die jeweils geladene TM hier hinein.
  data-name = Dateiname der TM (für Anzeige und Speichername).
  data-bruecken="1" = Haken "Brücken statt Kreuzungen" beim Öffnen gesetzt.
-->
<script type="text/plain" id="tm-embedded" data-name="tm2trainDemo.tm">
# (start zustand, start band position)
(1,0)
# turing band
(tt)
#transitionen (aktueller zustand, gelesenes symbol,neuer zustand,schreibendes symbol,bewegung)
(1,t,2,f,R) (1,f,2,f,L)
(2,t,1,f,R) (2,f,1,f,L)
</script>
<script>
// Unveränderte Kopie des Dokuments, bevor das Skript irgendetwas am DOM ändert –
// Grundlage für "HTML + TM speichern".
const PRISTINE_DOC=document.documentElement.cloneNode(true);
// =============================================================
// COLORS (RGBA arrays)
// =============================================================
const W=[255,255,255,255],BK=[0,0,0,255],GR=[0,188,0,255],RE=[149,0,0,255],BL=[0,0,220,255];

// =============================================================
// PIXEL DATA  9×9 per element
// =============================================================
const ED={};
const M=(r)=>r;
ED[1]=M([[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W],[BK,BK,BK,BK,BK,BK,BK,BK,BK],[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W]]);
ED[2]=M([[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[BK,BK,BK,W,W,W,W,W,W],[W,W,W,BK,W,W,W,W,W],[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W],[W,W,W,W,BK,W,W,W,W]]);
ED[3]=M([[W,W,W,W,GR,W,W,W,W],[W,W,W,GR,W,W,W,W,W],[W,W,GR,W,W,W,W,W,W],[W,GR,W,W,W,W,W,W,W],[BK,BK,BK,BK,BK,BK,BK,BK,BK],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[4]=M([[W,W,W,W,BK,W,W,W,W],[W,W,W,BK,W,W,W,W,W],[W,W,BK,W,W,W,W,W,W],[W,BK,W,W,W,W,W,W,W],[BK,GR,GR,GR,GR,BK,BK,BK,BK],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[5]=M([[W,W,W,W,RE,W,W,W,W],[W,W,W,RE,W,W,W,W,W],[W,W,RE,W,W,W,W,W,W],[W,RE,W,W,W,W,W,W,W],[BK,BK,BK,BK,BK,BK,BK,BK,BK],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[6]=M([[W,W,W,W,BK,W,W,W,W],[W,W,W,BK,W,W,W,W,W],[W,W,BK,W,W,W,W,W,W],[W,BK,W,W,W,W,W,W,W],[BK,RE,RE,RE,RE,BK,BK,BK,BK],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[7]=M([[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[BK,BK,BK,BK,BK,BK,BK,BK,BK],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[8]=M([[W,W,W,W,BL,W,W,W,W],[W,W,W,BL,W,W,W,W,W],[W,W,BL,W,W,W,W,W,W],[W,BL,W,W,W,W,W,W,W],[BK,BK,BK,BK,BK,BK,BK,BK,BK],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[9]=M([[W,W,W,W,BK,W,W,W,W],[W,W,W,BK,W,W,W,W,W],[W,W,BK,W,W,W,W,W,W],[W,BK,W,W,W,W,W,W,W],[BK,BL,BL,BL,BL,BK,BK,BK,BK],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[10]=M([[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,BK,BK,BK,W,W,W],[W,W,BK,W,W,W,BK,W,W],[BK,BK,BK,W,W,W,BK,BK,BK],[W,W,BK,W,W,W,BK,W,W],[W,W,W,BK,BK,BK,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);
ED[11]=M([[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,BK,W],[W,W,W,W,W,W,W,BK,W],[BK,BK,BK,BK,BK,BK,BK,BK,W],[W,W,W,W,W,W,W,BK,W],[W,W,W,W,W,W,W,BK,W],[W,W,W,W,W,W,W,W,W],[W,W,W,W,W,W,W,W,W]]);

// =============================================================
// TOKEN PARSING
// =============================================================
function parseTok(tok){
  tok=(tok||'').trim();
  if(!tok||tok==='0')return null;
  const ci=tok.indexOf(':');
  if(ci<0)return null;
  const nr=parseInt(tok.slice(0,ci));
  const rest=tok.slice(ci+1);
  if(!rest.startsWith('r'))return null;
  const drehen=parseInt(rest[1]);
  const s=rest.slice(2);
  if(!ED[nr]||![1,2,3,4].includes(drehen))return null;
  return{nr,drehen,hFlip:s.includes('H'),vFlip:s.includes('V')};
}

// =============================================================
// PIXEL TRANSFORMS
// =============================================================
function rot90CW(a){
  const n=9,o=Array.from({length:n},()=>Array(n));
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)o[c][n-1-r]=a[r][c];
  return o;
}
function flipH(a){return a.map(r=>[...r].reverse());}
function flipV(a){return[...a].reverse();}

function getPixels(nr,drehen,hFlip,vFlip){
  let a=ED[nr].map(r=>r.map(p=>[...p]));
  const steps={1:0,2:1,3:2,4:3}[drehen];
  for(let i=0;i<steps;i++)a=rot90CW(a);
  if(hFlip)a=flipH(a);
  if(vFlip)a=flipV(a);
  return a;
}

// =============================================================
// RENDER
// =============================================================
let SCALE=3;
const canvas=document.getElementById('C');
const ctx=canvas.getContext('2d');

// Gleisbild: Kachel-Sprites werden je Zoomstufe einmal erzeugt, das Grundbild
// (Weichen in Ausgangsstellung) einmal je Layout/Zoom. Pro Frame wird nur das
// Grundbild kopiert und die Weichen übermalt, die gerade anders stehen.
const SPRITES=new Map();
function sprite(nr,dr,h,v){
  const key=`${nr}:${dr}${h?'H':''}${v?'V':''}@${SCALE}`;
  let c=SPRITES.get(key);
  if(c)return c;
  const cell=9*SCALE,px=getPixels(nr,dr,h,v);
  c=document.createElement('canvas');c.width=c.height=cell;
  const id=c.getContext('2d').createImageData(cell,cell),buf=id.data;
  for(let gy=0;gy<cell;gy++)for(let gx=0;gx<cell;gx++){
    const col=px[Math.floor(gy/SCALE)][Math.floor(gx/SCALE)],i=(gy*cell+gx)*4;
    buf[i]=col[0];buf[i+1]=col[1];buf[i+2]=col[2];buf[i+3]=col[3];
  }
  c.getContext('2d').putImageData(id,0,0);
  SPRITES.set(key,c);
  return c;
}
// Weichenstellung → anzuzeigendes Element (zeigt den gestellten Strang farbig)
function weichenNr(nr,v){
  const rmp={3:v===1?3:4,4:v===1?3:4,5:v===1?5:6,6:v===1?5:6,8:v===1?8:9,9:v===1?8:9};
  return rmp[nr]!==undefined?rmp[nr]:nr;
}
let BASIS=null;
function basisBild(){
  if(BASIS&&BASIS.mat===st.mat&&BASIS.scale===SCALE)return BASIS.canvas;
  const m=st.mat,cell=9*SCALE,c=document.createElement('canvas');
  c.width=mW(m)*cell;c.height=m.length*cell;
  const c2=c.getContext('2d');
  c2.fillStyle='#fff';c2.fillRect(0,0,c.width,c.height);
  for(let r=0;r<m.length;r++)for(let x=0;x<m[r].length;x++){
    const p=parseTok(m[r][x]);
    if(p)c2.drawImage(sprite(p.nr,p.drehen,p.hFlip,p.vFlip),x*cell,r*cell);
  }
  BASIS={mat:m,scale:SCALE,canvas:c};
  return c;
}
function zeichneGleise(c2,ss){
  c2.drawImage(basisBild(),0,0);
  if(!ss)return;
  const cell=9*SCALE;
  for(const key in ss){
    const u=key.indexOf('_'),r=+key.slice(0,u),x=+key.slice(u+1);
    const p=parseTok(st.mat[r][x]);if(!p)continue;
    const n=weichenNr(p.nr,ss[key]);
    if(n!==p.nr)c2.drawImage(sprite(n,p.drehen,p.hFlip,p.vFlip),x*cell,r*cell);
  }
}
// Größte Zoomstufe, die ein Browser-Canvas noch schafft (Kantenlänge und Fläche)
function maxScale(){
  if(!st.mat)return 12;
  const w=mW(st.mat)*9,h=st.mat.length*9;
  let s=12;
  while(s>1&&(w*s>32000||h*s>32000||w*h*s*s>120e6))s--;
  return s;
}
function zoomOptionenPruefen(){
  const mx=maxScale(),sel=document.getElementById('zoom-sel');
  for(const o of sel.options)o.disabled=+o.value>mx;
  if(SCALE>mx){
    const erlaubt=[...sel.options].map(o=>+o.value).filter(v=>v<=mx);
    SCALE=erlaubt.length?Math.max(...erlaubt):1;sel.value=SCALE;
  }
}

// Lok in Draufsicht, Spitze zeigt in Fahrtrichtung f (N/O/S/W).
// Bis ca. 4x Zoom etwa 1,8 Zellen lang (mit Mindestgröße für kleinen Zoom), darüber
// stetig flacher (8x ≈ 1,2 Zellen, 12x ≈ 1 Zelle), damit sie bei großem Zoom keine Nachbarweichen verdeckt.
function lokMass(){
  const cell=9*SCALE;
  const L=Math.max(26,Math.min(cell*1.8,cell*0.6+43.2));
  return{L,B:L/2,halo:L*0.75};
}
const LOK_WINKEL={O:0,S:Math.PI/2,W:Math.PI,N:-Math.PI/2};
function rrect(c2,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c2.beginPath();
  c2.moveTo(x+r,y);c2.lineTo(x+w-r,y);c2.quadraticCurveTo(x+w,y,x+w,y+r);
  c2.lineTo(x+w,y+h-r);c2.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c2.lineTo(x+r,y+h);c2.quadraticCurveTo(x,y+h,x,y+h-r);
  c2.lineTo(x,y+r);c2.quadraticCurveTo(x,y,x+r,y);c2.closePath();
}
function drawTrain(c2,y,x,f){
  const cell=9*SCALE,cx=x*cell+cell/2,cy=y*cell+cell/2;
  const{L,B}=lokMass();
  c2.save();
  c2.translate(cx,cy);
  // Leuchthof, damit die Lok auf dem Gleisbild sofort auffällt
  const g=c2.createRadialGradient(0,0,B*0.3,0,0,L*0.75);
  g.addColorStop(0,'rgba(255,230,0,0.55)');g.addColorStop(1,'rgba(255,230,0,0)');
  c2.fillStyle=g;c2.beginPath();c2.arc(0,0,L*0.75,0,2*Math.PI);c2.fill();
  c2.rotate(LOK_WINKEL[f]||0);
  const lw=Math.max(1.5,SCALE*0.35);
  c2.lineWidth=lw;c2.strokeStyle='#111';
  // Räder (seitlich überstehend)
  c2.fillStyle='#222';
  const rw=L*0.14,rh=B*0.16;
  for(const rx of[-0.30,-0.08,0.14]){
    c2.fillRect(rx*L,-B/2-rh*0.6,rw,rh);
    c2.fillRect(rx*L,B/2-rh*0.4,rw,rh);
  }
  // Kessel
  rrect(c2,-L*0.22,-B*0.36,L*0.68,B*0.72,B*0.3);
  c2.fillStyle='#1e8a3a';c2.fill();c2.stroke();
  // Führerhaus hinten
  rrect(c2,-L/2,-B/2,L*0.30,B,B*0.12);
  c2.fillStyle='#145c27';c2.fill();c2.stroke();
  c2.fillStyle='#bfe9ff';
  c2.fillRect(-L*0.42,-B*0.30,L*0.14,B*0.60);
  // Schornstein
  c2.beginPath();c2.arc(L*0.28,0,B*0.17,0,2*Math.PI);
  c2.fillStyle='#111';c2.fill();
  // Pufferbohle vorne
  c2.fillStyle='#c0392b';
  c2.fillRect(L*0.44,-B*0.45,L*0.06,B*0.9);
  c2.strokeRect(L*0.44,-B*0.45,L*0.06,B*0.9);
  // Spitzenlicht
  c2.beginPath();c2.arc(L*0.50,0,B*0.13,0,2*Math.PI);
  c2.fillStyle='#ffe14d';c2.fill();c2.stroke();
  c2.restore();
}
function drawHLite(c2,y,x){
  const cell=9*SCALE;
  c2.strokeStyle='rgba(255,220,0,0.75)';c2.lineWidth=2;
  c2.strokeRect(x*cell+1,y*cell+1,cell-2,cell-2);
}

// =============================================================
// TM PARSER
// =============================================================
function parseTM(text){
  const tm={startZ:null,startPos:null,band:[],trans:[],tmap:new Map()};
  for(const line of text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'))){
    let m=line.match(/^\((\d+),(\d+)\)$/);
    if(m){tm.startZ=+m[1];tm.startPos=+m[2];continue;}
    m=line.match(/^\(([tf]+)\)$/);
    if(m){tm.band=[...m[1]].map(c=>c==='t'?1:0);continue;}
    const re=/\((\d+),([tf]),(\d+),([tf]),([LR])\)/g;
    let t;
    while((t=re.exec(line))){
      const tr={z:+t[1],sym:t[2]==='t'?1:0,nz:+t[3],sch:t[4]==='t'?1:0,r:t[5]};
      tm.trans.push(tr);
      tm.tmap.set(tr.z+'_'+tr.sym, tr);
    }
  }
  tm.zustaende=[...new Set(tm.trans.map(t=>t.z))].sort((a,b)=>a-b);
  tm.n=tm.zustaende.length;
  tm.getT=(z,sym)=>tm.tmap.get(z+'_'+sym)||null;
  tm.schalter=()=>{
    const s=[];
    for(const z of tm.zustaende)for(const sym of[0,1]){
      const t=tm.getT(z,sym);s.push(t?(t.sym!==t.sch?1:0):0);
    }
    return s;
  };
  tm.richtungen=()=>{
    const r=[];
    for(const z of tm.zustaende)for(const sym of[0,1]){
      const t=tm.getT(z,sym);r.push(t?t.r:'L');
    }
    return r;
  };
  return tm;
}

// LAYOUT BUILDER  (faithful JS port of Python)
// =============================================================
const mW=(m)=>m.reduce((mx,r)=>Math.max(mx,r.length),0);
const padR=(r,w)=>{while(r.length<w)r.push('0');};
const padM=(m,w)=>{for(const r of m)padR(r,w);};

// ShellC matrices
function parseMS(s){return s.trim().split('\n').map(l=>l.trim().split(',').map(c=>c.trim()));}
const SC0=parseMS(`7:r2,0,0,3:r4HV,2:r1
7:r2,0,2:r1H,9:r1,1:r1
7:r2,0,7:r2,0,7:r2
1:r1,8:r1HV,5:r1,7:r1,9:r1
7:r2,2:r1HV,7:r1,2:r1,0`);
const SC1=parseMS(`7:r2,0,0,4:r4HV,2:r1
7:r2,0,2:r1H,9:r1,1:r1
7:r2,0,7:r2,0,7:r2
1:r1,8:r1HV,6:r1,7:r1,9:r1
7:r2,2:r1HV,7:r1,2:r1,0`);

function ShellC(z){return(z===0?SC0:SC1).map(r=>[...r]);}

function stackShellC(n,z){
  const m=[['2:r1H','7:r1','7:r1','7:r1','2:r1'],['7:r2','0','0','2:r1H','9:r1H']];
  const sc=z===0?SC0:SC1;
  for(let i=0;i<n;i++)for(const r of sc)m.push([...r]);
  m.push(['2:r1HV','7:r1','7:r1','2:r1V','0']);
  return m;
}

function ShellB(n,z,sch){
  if(!sch)sch=Array(n*2).fill(1);
  const m=stackShellC(n,z);
  const H=2,SH=5;
  function _s(y,x,v){while(m.length<=y)m.push([]);while(m[y].length<=x)m[y].push('0');m[y][x]=v;}

  // step1
  for(let i=0;i<n*2;i++)m[1].push(sch[i]===1?'6:r1V':'7:r1');

  // step2
  for(let i=0;i<n;i++){
    const b=H+i*SH,sa=5+2*i,sb=6+2*i;
    if(sch[i*2]===1){_s(b,sa,'8:r4HV');_s(b+1,sa,'8:r1');}
    if(sch[i*2+1]===1){_s(b+2,sb,'8:r4HV');_s(b+3,sb,'8:r1');}
  }

  // step3
  const GZ=new Set();
  function _sg(y,x,v){_s(y,x,v);GZ.add(y+'_'+x);}
  for(let i=0;i<n;i++){
    const b=H+i*SH,sa=5+2*i,sb=6+2*i;
    if(sch[i*2]===0){
      _sg(b+1,sa,'7:r1');_sg(b+3,sa,'7:r1');
      for(let j=i+1;j<n;j++){const bj=H+j*SH;_sg(bj+1,sa,'7:r1');_sg(bj+3,sa,'7:r1');}
      for(let j=i+1;j<n;j++){
        const spa=5+2*j,spb=6+2*j;
        if(sch[j*2]===1){_s(b,spa,'7:r2');_s(b+2,spa,'7:r2');}
        if(sch[j*2+1]===1){_s(b,spb,'7:r2');_s(b+2,spb,'7:r2');}
      }
    }
    if(sch[i*2+1]===0){
      _sg(b+3,sb,'7:r1');
      for(let j=i+1;j<n;j++){const bj=H+j*SH;_sg(bj+1,sb,'7:r1');_sg(bj+3,sb,'7:r1');}
      for(let j=i+1;j<n;j++){
        const spa=5+2*j,spb=6+2*j;
        if(sch[j*2]===1)_s(b+2,spa,'7:r2');
        if(sch[j*2+1]===1)_s(b+2,spb,'7:r2');
      }
    }
  }

  // step4: pad + fill
  const maxB=mW(m);
  for(let yi=0;yi<m.length;yi++){
    const row=m[yi];
    const hw=row.slice(5).some(c=>['8:r4HV','8:r1','9:r1'].includes(c));
    const hg=!hw&&row.slice(5).some(c=>c==='7:r1');
    if(hw){
      const pr=row.findIndex((c,i)=>i>=5&&['8:r1','9:r1'].includes(c));
      const p4=row.findIndex((c,i)=>i>=5&&c==='8:r4HV');
      if(pr>=0){
        for(let j=5;j<pr;j++)if(row[j]==='0')row[j]='7:r1';
        row.splice(pr+1);
        while(row.length<maxB){const x=row.length;row.push(GZ.has(yi+'_'+x)?'7:r1':'0');}
      }else if(p4>=0){
        row.splice(p4+1);
        while(row.length<maxB)row.push('7:r1');
      }
    }else if(hg){
      for(let j=5;j<row.length;j++){if(row[j]==='0'){row[j]='7:r1';GZ.add(yi+'_'+j);}else if(row[j]==='7:r1')GZ.add(yi+'_'+j);}
      while(row.length<maxB){row.push('7:r1');GZ.add(yi+'_'+(row.length-1));}
    }else{while(row.length<maxB)row.push('0');}
  }

  // step5
  const WS=new Set();
  for(const row of m)for(let x=0;x<row.length;x++)if(row[x]==='8:r4HV')WS.add(x);
  for(let i=0;i<n-1;i++){
    const zi=H+i*SH+(SH-1),nb=H+(i+1)*SH;
    let ss=maxB;
    for(let x=0;x<(m[nb]||[]).length;x++)if(m[nb][x]==='8:r4HV'){ss=x;break;}
    padR(m[zi],maxB);
    for(let j=ss;j<maxB;j++)if(m[zi][j]==='0'&&WS.has(j))m[zi][j]='7:r2';
  }

  // step6
  const AZ=new Set();
  for(let y=0;y<m.length;y++)for(const v of m[y])if(v==='8:r1'||v==='9:r1')AZ.add(y);
  for(let y=0;y<m.length;y++){
    for(let x=0;x<m[y].length;x++){
      if(m[y][x]==='8:r4HV'){
        for(let yy=y-1;yy>=1;yy--){
          padR(m[yy],x+1);
          const c=m[yy][x];
          if(c==='0'){m[yy][x]='7:r2';}
          else if(c==='7:r1'){
            const row=m[yy];
            const pr=row.findIndex((v,i)=>i>=5&&['8:r1','9:r1'].includes(v));
            const p4=row.findIndex((v,i)=>i>=5&&v==='8:r4HV');
            if(GZ.has(yy+'_'+x)){m[yy][x]='1:r1';}
            else if(AZ.has(yy)){
              const bel=(yy+1<m.length&&x<m[yy+1].length)?m[yy+1][x]:'0';
              m[yy][x]=(bel==='8:r4HV')?'7:r2':'1:r1';
            }else if(pr>=0&&x>pr){m[yy][x]='7:r2';}
            else if(p4>=0&&x>p4){m[yy][x]='1:r1';}
          }
        }
      }
    }
  }
  return m;
}

function ShellBmK(n,z,sch){
  const m=ShellB(n,z,sch);
  const sn=sch||Array(2*n).fill(1);
  const bA=mW(m),hA=m.length,nB=bA+2*n;
  padM(m,nB);
  function _z(y,x){return(y>=0&&y<m.length&&x>=0&&x<(m[y]||[]).length)?m[y][x]:'0';}

  const wz=[];
  for(let y=0;y<m.length;y++)for(const v of m[y])if(['3:r4HV','4:r4HV'].includes(v)){wz.push(y);break;}

  const kz=[];
  for(let i=0;i<wz.length;i++){
    const wy=wz[i];
    kz.push(wy+(sn[i*2]===1?0:1));
    kz.push(wy+2+(sn[i*2+1]===1?0:1));
  }

  for(let k=0;k<kz.length;k++){
    const ky=kz[k],kx=bA+(2*n-1-k);
    for(let x=bA;x<kx;x++){const c=_z(ky,x);if(c==='0')m[ky][x]='7:r1';else if(c==='7:r2')m[ky][x]='1:r1';}
    m[ky][kx]='2:r1';
    for(let y=ky+1;y<hA;y++){const c=_z(y,kx);if(c==='0')m[y][kx]='7:r2';else if(c==='7:r1')m[y][kx]='1:r1';}
  }
  return[m,kz];
}

function ShellBmR(n,z,sch,richt){
  if(!richt)richt=Array(2*n).fill('R');
  const[m,kz]=ShellBmK(n,z,sch);
  const hA=m.length,bA=mW(m),bSB=bA-2*n;
  padM(m,bA);
  for(let i=0;i<2*n;i++)m.push(Array(bA).fill('0'));
  function _z(y,x){return(y>=0&&y<m.length&&x>=0&&x<(m[y]||[]).length)?m[y][x]:'0';}
  const kxs=Array.from({length:2*n},(_,k)=>bSB+(2*n-1-k));
  for(let k=0;k<2*n;k++){
    const kx=kxs[k],by=hA+(2*n-1-k),r=richt[k];
    for(let y=hA;y<by;y++){const c=_z(y,kx);if(c==='0')m[y][kx]='7:r2';else if(c==='7:r1')m[y][kx]='1:r1';}
    if(r==='L'){
      m[by][kx]='2:r1V';
      for(let x=kx-1;x>=0;x--){const c=_z(by,x);if(c==='0')m[by][x]='7:r1';else if(c==='7:r2')m[by][x]='1:r1';}
    }else{
      m[by][kx]='2:r1HV';
      for(let x=kx+1;x<bA;x++){const c=_z(by,x);if(c==='0')m[by][x]='7:r1';else if(c==='7:r2')m[by][x]='1:r1';}
    }
  }
  return m;
}

function ShellA_links(n,z,sch,richt){
  const m=ShellBmR(n,z,sch,richt);
  const ez=Array.from({length:n},(_,i)=>5*(i+1));
  const vs=2*n+1,lb=n*vs,ob=mW(m),nb=lb+ob;
  for(const r of m){for(let i=0;i<lb;i++)r.unshift('0');while(r.length<nb)r.push('0');}
  for(let i=0;i<ez.length;i++){
    const y=ez[i],x0=i*vs;
    for(let x=0;x<lb;x++)if(m[y][x]==='0')m[y][x]='7:r1';
    m[y][x0]='9:r1H';
    for(let k=0;k<2*n;k++)m[y][x0+1+k]='9:r1V';
  }
  return[m,ez];
}

function ShellA_mB(n,z,sch,richt){
  let[m,ez]=ShellA_links(n,z,sch,richt);
  const vs=2*n+1,rb=n*vs,ob=mW(m),nb=ob+rb;
  padM(m,nb);
  function _z(y,x){return(y>=0&&y<m.length&&x>=0&&x<(m[y]||[]).length)?m[y][x]:'0';}
  function _s(y,x,v){m[y][x]=v;}
  const rp=[];
  for(let i=0;i<ez.length;i++){
    const y=ez[ez.length-1-i],x0=ob+i*vs;
    rp.push([y,x0]);_s(y,x0,'2:r1HV');
    for(let k=0;k<2*n;k++)_s(y,x0+1+k,'9:r1HV');
    for(let x=x0+vs;x<nb;x++)if(m[y][x]==='0')_s(y,x,'7:r1');
  }
  const lp=ez.map((y,i)=>[y,i*vs]);
  const nb2=n;
  for(const r of m)for(let i=0;i<nb2;i++)r.unshift('0');
  for(let i=0;i<nb2;i++)m.unshift(Array(nb+nb2).fill('0'));
  ez=ez.map(y=>y+nb2);
  const srp=rp.map(([y,x])=>[y+nb2,x]);
  const slp=lp.map(([y,x])=>[y+nb2,x]);

  const nr1h=new Set();
  for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]==='9:r1H')nr1h.add(y+'_'+x);

  for(let i=0;i<n;i++){
    const by=nb2-1-i;
    const[ry,rx]=srp[i];
    const[ly,lx]=slp[n-1-i];
    const blx=lx+nb2,rvt=rx+nb2,brx=rx+nb2;
    m[by][blx]='2:r1H';
    for(let y=by+1;y<ly;y++){
      const c=_z(y,blx);
      if(nr1h.has(y+'_'+blx))m[y][blx]='1:r1';
      else if(c==='0')m[y][blx]='7:r2';
      else if(c==='7:r1')m[y][blx]='1:r1';
    }
    for(let y=ry-1;y>by;y--){
      const c=_z(y,rvt);
      if(c==='0')m[y][rvt]='7:r2';else if(c==='7:r1')m[y][rvt]='1:r1';
    }
    m[by][brx]='2:r1';
    for(let x=brx-1;x>blx;x--){const c=_z(by,x);if(c==='0')m[by][x]='7:r1';else if(c==='7:r2')m[by][x]='1:r1';}
  }
  for(let i=0;i<m.length;i++)m[i]=m[i].slice(nb2);
  return[m,ez];
}

function ShellA_v(n,z,sch,richt,zustaende,tmap){
  let[m,ez]=ShellA_mB(n,z,sch,richt);
  function _z(y,x){return(y>=0&&y<m.length&&x>=0&&x<(m[y]||[]).length)?m[y][x]:'0';}
  function _s(y,x,v){while(m.length<=y)m.push([]);while(m[y].length<=x)m[y].push('0');m[y][x]=v;}

  const nv={},nhv={};
  for(let y=0;y<m.length;y++){
    const vc=[],hvc=[];
    for(let x=0;x<m[y].length;x++){if(m[y][x]==='9:r1V')vc.push(x);if(m[y][x]==='9:r1HV')hvc.push(x);}
    if(vc.length)nv[y]=vc;if(hvc.length)nhv[y]=hvc;
  }

  const lastEz=ez[ez.length-1];
  const rc=[];
  for(let y=lastEz+1;y<m.length;y++)
    for(let x=0;x<m[y].length;x++){const v=m[y][x];if(v==='2:r1V'||v==='2:r1HV')rc.push([y,x,v]);}
  let routing=[...rc.slice(-2*n)].reverse();

  const vb=[];
  for(let k=0;k<routing.length;k++){
    const[ry,rx,rv]=routing[k];
    const zi=Math.floor(k/2),sym=k%2;
    let isH=false,t=null;
    if(zustaende&&tmap){
      const z2=zustaende[zi];
      t=tmap.get(z2+'_'+sym)||null;
      isH=(t===null||!zustaende.includes(t.nz));
    }
    if(isH){
      const hr=rv==='2:r1V'?'L':'R';
      vb.push({ry,rx,zy:null,vx:null,ri:hr,sym,h:true});continue;
    }
    let zi2=zi,ri2=richt?richt[k]:(rv==='2:r1HV'?'L':'R');
    if(t){zi2=zustaende.indexOf(t.nz);ri2=t.r;}
    const zy=ez[zi2],pl=zi*2+sym;
    let vx;
    if(ri2==='L'){
      if(!nv[zy]||pl>=nv[zy].length)continue;
      vx=nv[zy][pl];
    }else{
      const idx=(2*n-1)-pl;
      if(!nhv[zy]||idx<0||idx>=nhv[zy].length)continue;
      vx=nhv[zy][idx];
    }
    vb.push({ry,rx,zy,vx,ri:ri2,sym,h:false});
  }

  // Phase 1 horizontal
  function kH(y,x){const c=_z(y,x);if(c==='0')_s(y,x,'7:r1');else if(c==='7:r2')_s(y,x,'1:r1');}
  for(const{ry,rx,zy,vx,ri,h}of vb){
    if(h){if(ri==='L')_s(ry,rx-1,'11:r3');else _s(ry,rx+1,'11:r1');continue;}
    if(vx>rx)for(let x=rx+1;x<vx;x++)kH(ry,x);
    else if(vx<rx)for(let x=rx-1;x>vx;x--)kH(ry,x);
  }
  for(const{ry,vx,ri,h}of vb){if(h)continue;_s(ry,vx,ri==='R'?'2:r1V':'2:r1HV');}

  // Phase 2 vertical
  function kV(y,x){const c=_z(y,x);if(c==='0')_s(y,x,'7:r2');else if(c==='7:r1')_s(y,x,'1:r1');}
  for(const{ry,zy,vx,h}of vb){if(h)continue;for(let y=ry-1;y>zy;y--)kV(y,vx);}

  // Cleanup
  const cs=5*n+3;const GP=new Set(ez);
  let ch=true;
  while(ch){
    ch=false;
    for(let y=cs;y<m.length;y++){
      if(GP.has(y))continue;
      const w=m[y].length;
      for(let x=0;x<w;x++){
        if(m[y][x]==='7:r1'){
          let hl=false;
          for(let xl=x-1;xl>=0;xl--){if(m[y][xl]==='0'||m[y][xl]==='7:r2')continue;hl=true;break;}
          if(!hl){m[y][x]='0';ch=true;}
        }
      }
      for(let x=1;x<w-1;x++){
        if(m[y][x]==='1:r1'){
          const l=m[y][x-1],r2=(x+1<w)?m[y][x+1]:'0';
          if((l==='0'||l==='7:r2')||(r2==='0'||r2==='7:r2')){m[y][x]='7:r2';ch=true;}
        }
      }
    }
  }
  const mxw=mW(m);for(const r of m)while(r.length<mxw)r.push('0');
  return[m,ez];
}

function kaskadiereTM(tm,spalt=3){
  const n=tm.n,s=tm.schalter(),r=tm.richtungen();
  const shells=[];
  for(const sym of tm.band){
    const[ma,ez]=ShellA_v(n,sym,s,r,tm.zustaende,tm.tmap);
    shells.push([ma,ez]);
  }
  if(!shells.length)return[null,null];
  const[sh0,ez]=shells[0];
  const h=sh0.length,ab=mW(sh0),k=shells.length;
  const gb=spalt+k*ab+(k-1)*spalt;
  const mat=Array.from({length:h},()=>Array(gb).fill('0'));
  const xo=[];
  for(let i=0;i<k;i++){
    const[sh]=shells[i],x0=spalt+i*(ab+spalt);xo.push(x0);
    for(let y=0;y<h;y++)for(let x=0;x<(sh[y]||[]).length;x++)if(sh[y][x]!=='0')mat[y][x0+x]=sh[y][x];
  }
  for(let i=0;i<k-1;i++){
    const xs=xo[i]+ab,xe=xo[i+1];
    for(const ey of ez)for(let x=xs;x<xe;x++)mat[ey][x]='7:r1';
  }
  const sp=tm.startPos!==null?tm.startPos:0,sz=tm.startZ!==null?tm.startZ:tm.zustaende[0];
  if(sp>=0&&sp<k&&tm.zustaende.includes(sz)){
    const zi=tm.zustaende.indexOf(sz),sy2=ez[zi];
    const gs=xo[sp]-spalt,ge=xo[sp];
    for(let x=gs;x<ge;x++)mat[sy2][x]='7:r1';
    mat[sy2][Math.floor((gs+ge)/2)]='10:r1';
  }
  return[mat,{ez,spalt,xo,xe:xo.map(x=>x+ab),ab,sp,sz}];
}

// =============================================================
// BRÜCKE STATT KREUZUNG  (Chalcraft & Greene: "One further result")
// =============================================================
// Eine Kreuzung (Element 1) wird durch vier sich berührende Schleifen mit
// gefederten Weichen ersetzt – kreuzungsfrei in der Ebene. Je Arm i (W,N,O,S):
//   O_i  Anschlussweiche am Arm, P_i/Q_i die beiden Weichen der Berührung
//   zwischen Schleife i und i+1 (gemeinsames Stück P_i.F–Q_i.F).
// Q0..Q3 bilden den inneren Ring. Alle 12 Weichen sind auf den abzweigenden
// Strang gefedert (Element 8). Ein Zug von W läuft O_W → P/Q(W|N) → Q/P(N|O)
// → O_O und verlässt die Brücke nach O; die anderen Arme entsprechend gedreht.
// Ein Sektor (Arm W + Ecke NW) im 9×9-Block, die übrigen durch Drehung.
const BR_K=9;
const BR_SEKTOR=[
  {y:4,x:0,p:['W','O']},                 // Arm West
  {y:4,x:1,f:'W',s1:'N',s2:'O'},         // O_W
  {y:4,x:2,p:['W','S']},                 // O_W.B → hinunter zu P_SW
  {y:3,x:1,p:['N','S']},{y:2,x:1,p:['N','S']},
  {y:1,x:1,p:['S','O']},{y:1,x:2,p:['W','O']},{y:1,x:3,p:['W','S']},
  {y:2,x:3,f:'S',s1:'O',s2:'N'},         // P_NW (X von oben, Y von O_N)
  {y:3,x:3,f:'N',s1:'O',s2:'S'},         // Q_NW (innerer Ring)
  {y:3,x:4,p:['W','O']},                 // Ring Q_NW → Q_NO
];
const DREH_CW={N:'O',O:'S',S:'W',W:'N'};
function tokFuer(nr,lokal,welt){
  // passende Lage (Drehung + Spiegelung) suchen, sodass lokal[i] → welt[i]
  for(let dr=1;dr<=4;dr++)for(const h of[0,1])for(const v of[0,1]){
    const w=lokal.map(d=>l2w(d,dr,h,v));
    const ok=nr===8?w.every((d,i)=>d===welt[i]):(w.length===welt.length&&w.every(d=>welt.includes(d)));
    if(ok)return`${nr}:r${dr}${h?'H':''}${v?'V':''}`;
  }
  throw new Error('keine Lage für '+nr+' '+welt);
}
let BR_BLOCK=null;
function brueckenBlock(){
  if(BR_BLOCK)return BR_BLOCK;
  const k=BR_K,b=Array.from({length:k},()=>Array(k).fill('0'));
  let teile=BR_SEKTOR;
  for(let r=0;r<4;r++){
    for(const t of teile){
      if(b[t.y][t.x]!=='0')throw new Error('Brücke: Feld doppelt belegt');
      b[t.y][t.x]=t.f?tokFuer(8,['W','N','O'],[t.f,t.s1,t.s2])
        :tokFuer(t.p[0]===DREH_CW[DREH_CW[t.p[1]]]?7:2,t.p[0]===DREH_CW[DREH_CW[t.p[1]]]?['W','O']:['W','S'],t.p);
    }
    // 90° im Uhrzeigersinn drehen: (y,x) → (x, k-1-y)
    teile=teile.map(t=>t.f?{y:t.x,x:k-1-t.y,f:DREH_CW[t.f],s1:DREH_CW[t.s1],s2:DREH_CW[t.s2]}
                          :{y:t.x,x:k-1-t.y,p:t.p.map(d=>DREH_CW[d])});
  }
  return BR_BLOCK=b;
}
const PORTS={1:['N','O','S','W'],2:['W','S'],7:['W','O'],10:['W','O'],11:['W'],
  3:['W','N','O'],4:['W','N','O'],5:['W','N','O'],6:['W','N','O'],8:['W','N','O'],9:['W','N','O']};
// Streckt nur die Zeilen und Spalten, in denen eine Kreuzung liegt, auf BR_K Kacheln.
// Alle übrigen Elemente sitzen in der Blockmitte und werden mit Geraden bis zum
// Blockrand verlängert, damit die Anschlüsse ausgerichtet bleiben.
function ersetzeKreuzungen(mat,info){
  const H=mat.length,B=mW(mat),k=BR_K,m=(k-1)/2;
  const RH=Array(H).fill(1),CW=Array(B).fill(1);
  let anzahl=0;
  for(let y=0;y<H;y++)for(let x=0;x<(mat[y]||[]).length;x++){
    const p=parseTok(mat[y][x]);if(p&&p.nr===1){RH[y]=k;CW[x]=k;anzahl++;}
  }
  if(!anzahl)return[mat,info,0];
  const Y0=[0],X0=[0];
  for(let y=0;y<H;y++)Y0.push(Y0[y]+RH[y]);
  for(let x=0;x<B;x++)X0.push(X0[x]+CW[x]);
  const out=Array.from({length:Y0[H]},()=>Array(X0[B]).fill('0'));
  const blk=brueckenBlock();
  for(let y=0;y<H;y++)for(let x=0;x<B;x++){
    const tok=(mat[y]||[])[x]||'0';if(tok==='0')continue;
    const p=parseTok(tok);
    const cy=Y0[y]+(RH[y]-1)/2,cx=X0[x]+(CW[x]-1)/2;
    if(p&&p.nr===1){
      for(let i=0;i<k;i++)for(let j=0;j<k;j++)if(blk[i][j]!=='0')out[Y0[y]+i][X0[x]+j]=blk[i][j];
      continue;
    }
    out[cy][cx]=tok;
    if(!p||!PORTS[p.nr])continue;
    for(const lp of PORTS[p.nr]){
      const d=l2w(lp,p.drehen,p.hFlip,p.vFlip);
      if(d==='W')for(let xx=X0[x];xx<cx;xx++)out[cy][xx]='7:r1';
      if(d==='O')for(let xx=cx+1;xx<X0[x+1];xx++)out[cy][xx]='7:r1';
      if(d==='N')for(let yy=Y0[y];yy<cy;yy++)out[yy][cx]='7:r2';
      if(d==='S')for(let yy=cy+1;yy<Y0[y+1];yy++)out[yy][cx]='7:r2';
    }
  }
  const neu={...info,
    ez:info.ez.map(y=>Y0[y]+(RH[y]-1)/2),
    xo:info.xo.map(x=>X0[x]),
    xe:info.xe.map(x=>X0[Math.min(x,B)])};
  return[out,neu,anzahl];
}

// =============================================================
// TRAIN SIMULATION
// =============================================================
const GEGEN={N:'S',S:'N',W:'O',O:'W'};
const DELTA={N:[0,-1],S:[0,1],W:[-1,0],O:[1,0]};
const CW=['N','O','S','W'];
const WT={3:'ff',4:'ff',5:'la',6:'la',8:'sp',9:'sp'};
const WV={3:1,4:2,5:1,6:2,8:1,9:2};

function rotCW(d,t){return CW[(CW.indexOf(d)+t)%4];}
function fHd(d){return{O:'W',W:'O',N:'N',S:'S'}[d];}
function fVd(d){return{N:'S',S:'N',O:'O',W:'W'}[d];}
function l2w(d,dr,h,v){const s={1:0,2:1,3:2,4:3}[dr];d=rotCW(d,s);if(h)d=fHd(d);if(v)d=fVd(d);return d;}
function w2l(d,dr,h,v){const s={1:0,2:1,3:2,4:3}[dr];if(v)d=fVd(d);if(h)d=fHd(d);d=rotCW(d,(4-s)%4);return d;}

class Sim{
  constructor(mat){
    this.m=mat.map(r=>[...r]);this.H=mat.length;
    this.B=mat.reduce((mx,r)=>Math.max(mx,r.length),0);
    this.ss={};
    for(let y=0;y<this.H;y++)for(let x=0;x<(mat[y]||[]).length;x++){
      const p=parseTok(mat[y][x]);if(p&&WT[p.nr])this.ss[y+'_'+x]=WV[p.nr];
    }
  }
  tile(y,x){if(y<0||y>=this.H||x<0||x>=(this.m[y]||[]).length)return null;return parseTok(this.m[y][x]);}
  step(y,x,f){
    const p=this.tile(y,x);if(!p)return[null,'leer'];
    const{nr,drehen,hFlip,vFlip}=p;
    const el=w2l(GEGEN[f],drehen,hFlip,vFlip);
    if(nr===7||nr===10){const e={W:'O',O:'W'}[el];if(!e)return[null,'Linie?'];return[l2w(e,drehen,hFlip,vFlip),'Linie'];}
    if(nr===2){const e={W:'S',S:'W'}[el];if(!e)return[null,'Kurve?'];return[l2w(e,drehen,hFlip,vFlip),'Kurve'];}
    if(nr===1){const e={W:'O',O:'W',N:'S',S:'N'}[el];if(!e)return[null,'Kreuz?'];return[l2w(e,drehen,hFlip,vFlip),'Kreuz'];}
    if(nr===11)return[null,'Endpuffer'];
    if(WT[nr]){
      const typ=WT[nr],key=y+'_'+x,v=this.ss[key]||WV[nr];
      let port=el==='W'?'F':el==='N'?'S1':el==='O'?'S2':null;
      if(!port)return[null,'Weiche?'+el];
      if(typ==='sp'){const e=port==='F'?(v===1?'N':'O'):'W';return[l2w(e,drehen,hFlip,vFlip),`Sp${v}${port}`];}
      if(typ==='la'){
        if(port==='F'){const e=v===1?'N':'O';return[l2w(e,drehen,hFlip,vFlip),`La F->${e}(v${v})`];}
        else{this.ss[key]=port==='S1'?1:2;return[l2w('W',drehen,hFlip,vFlip),`La ${port}->F(v${this.ss[key]})`];}
      }
      if(typ==='ff'){
        if(port==='F'){const e=v===1?'N':'O';this.ss[key]=v===1?2:1;return[l2w(e,drehen,hFlip,vFlip),`FF F->${e}(v${this.ss[key]})`];}
        else return[l2w('W',drehen,hFlip,vFlip),`FF ${port}->F`];
      }
    }
    return[null,'?'+nr];
  }
  fahre(sy,sx,sf,maxS=100000){
    const pfad=[];let y=sy,x=sx,f=sf;
    for(let i=0;i<maxS;i++){
      if(y<0||y>=this.H||x<0||x>=(this.m[y]||[]).length)break;
      const[nf,desc]=this.step(y,x,f);
      pfad.push({y,x,f,ss:{...this.ss},desc});
      if(!nf)break;
      const[dx,dy]=DELTA[nf];y+=dy;x+=dx;f=nf;
    }
    return pfad;
  }
}

function findStart(mat){
  for(let y=0;y<mat.length;y++)for(let x=0;x<(mat[y]||[]).length;x++)
    if((mat[y][x]||'').startsWith('10:'))return[y,x];
  return null;
}

// =============================================================
// APP STATE
// =============================================================
const st={tm:null,tmText:null,tmName:null,mat:null,info:null,pfad:null,si:-1,timer:null,fps:15};

function setStatus(m){document.getElementById('status').textContent=m;}

// Band so, wie es in der Schaltung steht: je Bandzelle die Lazy-Weiche (5/6) auswerten.
// Ergebnis: Array aus 1 (t), 0 (f) oder null (nicht ermittelbar).
function bandAt(ss){
  const{ez,xo,xe}=st.info,band=[];
  for(let c=0;c<xo.length;c++){
    let sym=null;
    for(const ey of ez){
      for(let x=xo[c];x<xe[c]&&sym===null;x++){
        const p=parseTok((st.mat[ey]||[])[x]);
        if(p&&(p.nr===5||p.nr===6)){const v=ss[ey+'_'+x];if(v!==undefined)sym=v===1?0:1;}
      }
      if(sym!==null)break;
    }
    band.push(sym);
  }
  return band;
}
const symTxt=v=>v===1?'t':v===0?'f':'?';

// TM-Ablauf aus der Zugfahrt ableiten: Jede Einfahrt des Zugs auf einer Zustandszeile ez[zi]
// in den Block einer Bandzelle c ist ein TM-Schritt "Zustand zi, Kopf auf c".
// Gelesenes Symbol = Bandinhalt der Schaltung in diesem Moment. Zur Kontrolle läuft
// die TM zusätzlich abstrakt mit; Abweichungen werden markiert.
function analyseTM(){
  const{ez,xo,xe}=st.info,P=st.pfad,tm=st.tm;
  const cellOf=x=>{for(let c=0;c<xo.length;c++)if(x>=xo[c]&&x<xe[c])return c;return -1;};
  const schritte=[],stepAt=new Int32Array(P.length).fill(-1);
  for(let i=1;i<P.length;i++){
    const a=P[i-1],b=P[i],zi=ez.indexOf(b.y);
    if(zi>=0&&a.y===b.y){
      const ca=cellOf(a.x),cb=cellOf(b.x);
      if(cb>=0&&ca!==cb){
        const sym=bandAt(b.ss)[cb],z=tm.zustaende[zi];
        schritte.push({i,c:cb,z,sym,t:sym===null?null:tm.getT(z,sym)});
      }
    }
    stepAt[i]=schritte.length-1;
  }
  // abstrakte Kontrolle
  let band=[...tm.band],pos=tm.startPos??0,z=tm.startZ??tm.zustaende[0],abw=0;
  for(const sc of schritte){
    sc.ok=pos===sc.c&&z===sc.z&&band[pos]===sc.sym;
    if(!sc.ok)abw++;
    const t=tm.getT(z,band[pos]);
    if(!t||pos<0||pos>=band.length)break;
    band[pos]=t.sch;pos+=t.r==='R'?1:-1;z=t.nz;
  }
  st.lauf={schritte,stepAt,abw};
  // Protokoll einmal aufbauen, danach nur Markierung umschalten
  const log=document.getElementById('tm-log');
  log.innerHTML='';
  schritte.forEach((sc,k)=>{
    const d=document.createElement('div');
    d.textContent=`#${k+1}  q${sc.z} @${sc.c} liest ${symTxt(sc.sym)}  → `+
      (sc.t?`(${sc.z},${symTxt(sc.sym)},${sc.t.nz},${symTxt(sc.t.sch)},${sc.t.r})`:'HALT')+(sc.ok?'':'  ⚠');
    log.appendChild(d);
  });
  st.logAktiv=-1;
}

function updateTMPanel(){
  const bandEl=document.getElementById('tm-band'),zEl=document.getElementById('tm-zeile');
  if(!st.pfad||st.si<0||!st.lauf){bandEl.innerHTML='';zEl.textContent='Keine TM geladen';return;}
  const P=st.pfad,s=P[st.si],{schritte,stepAt,abw}=st.lauf;
  const k=stepAt[st.si],sc=k>=0?schritte[k]:null;
  const kopf=sc?sc.c:(st.info.sp??0),zustand=sc?sc.z:st.info.sz;
  // Band
  const band=bandAt(s.ss);
  bandEl.innerHTML=band.map((v,c)=>{
    const cls=v===1?'t':v===0?'f':'u';
    return `<div class="zelle${c===kopf?' aktiv':''}"><div class="kopf">${c===kopf?'▼ q'+zustand:''}</div>`+
      `<div class="sym ${cls}">${symTxt(v)}</div><div class="idx">${c}</div></div>`;
  }).join('');
  // Textzeile
  const richtung=r=>r==='R'?'rechts':'links';
  let html;
  if(!sc){
    html=`Start: Zug fährt in Zustand <b>q${zustand}</b> zur Bandzelle <b>${kopf}</b>`;
  }else{
    html=`TM-Schritt <b>${k+1}</b>/${schritte.length} · Zustand <b>q${sc.z}</b> · liest <b>${symTxt(sc.sym)}</b>`;
    if(sc.t){
      html+=` · Übergang <code>(${sc.z},${symTxt(sc.sym)},${sc.t.nz},${symTxt(sc.t.sch)},${sc.t.r})</code>`+
        ` → schreibt <b>${symTxt(sc.t.sch)}</b>, Kopf nach ${richtung(sc.t.r)}, neuer Zustand <b>q${sc.t.nz}</b>`;
    }else{
      html+=` · <span class="ende">keine Transition für (${sc.z},${symTxt(sc.sym)}) → HALT</span>`;
    }
    if(!sc.ok)html+=` <span class="warn">⚠ weicht von der abstrakten TM ab</span>`;
  }
  if(st.si===P.length-1){
    const letzter=schritte[schritte.length-1];
    if(letzter&&letzter.t){
      const ziel=letzter.c+(letzter.t.r==='R'?1:-1);
      html+=`<br><span class="ende">Ende: Kopf läuft auf Zelle ${ziel} – außerhalb des Bands, der Zug verlässt die Schaltung.</span>`;
    }else if(letzter){
      html+=`<br><span class="ende">Ende: Maschine hält.</span>`;
    }
    html+=`  Band am Ende: <b>${band.map(symTxt).join('')}</b>`;
  }
  if(abw)html+=`<br><span class="warn">⚠ ${abw} Schritt(e) weichen von der abstrakten TM ab</span>`;
  zEl.innerHTML=html;
  // Protokoll
  const log=document.getElementById('tm-log');
  if(st.logAktiv!==k){
    [...log.children].forEach((d,j)=>{d.className=j<k?'done':j===k?'aktiv':'';});
    if(k>=0&&log.children[k]){
      const d=log.children[k];
      if(d.offsetTop<log.scrollTop||d.offsetTop+d.offsetHeight>log.scrollTop+log.clientHeight)
        log.scrollTop=d.offsetTop-log.clientHeight/2;
    }
    st.logAktiv=k;
  }
}

function updateInfo(){
  if(!st.pfad||st.si<0){
    ['i-step','i-tile','i-dir','i-band','i-tok'].forEach(id=>document.getElementById(id).textContent=id.replace('i-','').replace('-',' ')+': —');
    return;
  }
  const s=st.pfad[st.si];
  document.getElementById('i-step').textContent=`Schritt: ${st.si+1}/${st.pfad.length}`;
  document.getElementById('i-tile').textContent=`(${s.y},${s.x})`;
  document.getElementById('i-dir').textContent=`→${s.f}`;
  document.getElementById('i-tok').textContent=(st.mat[s.y]||[])[s.x]||'0';
  if(st.info)document.getElementById('i-band').textContent='Band: '+bandAt(s.ss).map(symTxt).join('');
  updateTMPanel();
}

function renderFrame(){
  if(!st.mat)return;
  const sw=st.si>=0&&st.pfad?st.pfad[st.si].ss:null;
  zoomOptionenPruefen();
  const b=basisBild();
  if(canvas.width!==b.width||canvas.height!==b.height){canvas.width=b.width;canvas.height=b.height;}
  zeichneGleise(ctx,sw);
  if(st.si>=0&&st.pfad){const s=st.pfad[st.si];drawHLite(ctx,s.y,s.x);drawTrain(ctx,s.y,s.x,s.f);}
  updateInfo();
}

function loadTM(text,name){
  stopPlay();
  try{
    // Erst alles in lokale Variablen bauen und nur bei Erfolg in st übernehmen –
    // sonst würde eine fehlerhafte Datei die zuletzt gültige TM halb überschreiben
    // (und "HTML + TM" würde den kaputten Text zur alten Grafik speichern).
    const tm=parseTM(text);
    if(!tm.n)throw new Error('Keine Zustände mit Übergängen');
    const tmName=name||'turingmaschine.tm';
    setStatus(`Parsen OK (n=${tm.n}). Baue Layout...`);
    setTimeout(()=>{
      try{
        let[mat,info]=kaskadiereTM(tm);
        if(!mat)throw new Error('Layout leer');
        let bruecken=0;
        if(document.getElementById('chk-bruecke').checked)[mat,info,bruecken]=ersetzeKreuzungen(mat,info);
        const start=findStart(mat);
        if(!start)throw new Error('Kein Startsymbol');
        const sim=new Sim(mat);
        const pfad=sim.fahre(start[0],start[1],'O');
        st.tm=tm;st.tmText=text;st.tmName=tmName;
        st.mat=mat;st.info=info;st.pfad=pfad;
        analyseTM();
        st.si=0;
        fitZoom();
        setStatus(`${st.tmName}: bereit – ${st.pfad.length} Schritte · Band: ${st.tm.band.map(b=>b?'t':'f').join('')}`+
          (document.getElementById('chk-bruecke').checked?` · ${bruecken} Kreuzung(en) als Brücke`:''));
        ['btn-step','btn-play','btn-reset','btn-savehtml'].forEach(id=>document.getElementById(id).disabled=false);
      }catch(e){setStatus('Fehler: '+e.message);console.error(e);}
    },10);
  }catch(e){setStatus('Parse-Fehler: '+e.message);console.error(e);}
}

function stepOnce(){
  if(!st.pfad)return;
  if(st.si<st.pfad.length-1){st.si++;renderFrame();}
  else{setStatus('Simulation beendet');stopPlay();}
}

function startPlay(){
  if(st.timer||!st.pfad)return;
  document.getElementById('btn-play').disabled=true;
  document.getElementById('btn-stop').disabled=false;
  st.timer=setInterval(()=>{
    if(st.si>=st.pfad.length-1){stopPlay();setStatus('Simulation beendet');return;}
    st.si++;renderFrame();
  },Math.round(1000/st.fps));
}

function stopPlay(){
  if(st.timer){clearInterval(st.timer);st.timer=null;}
  document.getElementById('btn-play').disabled=false;
  document.getElementById('btn-stop').disabled=true;
}

function resetSim(){
  stopPlay();
  if(!st.mat)return;
  const s=findStart(st.mat);if(!s)return;
  const sim=new Sim(st.mat);
  st.pfad=sim.fahre(s[0],s[1],'O');
  analyseTM();
  st.si=0;renderFrame();
  setStatus(`Reset – ${st.pfad.length} Schritte`);
}

function updateSpeed(){
  st.fps=+document.getElementById('speed').value;
  document.getElementById('speed-val').textContent=st.fps+' fps';
  if(st.timer){stopPlay();startPlay();}
}

function changeZoom(){
  SCALE=+document.getElementById('zoom-sel').value;
  renderFrame();
}

function fitZoom(){
  if(!st.mat)return;
  const wrap=document.getElementById('canvas-wrap');
  const ww=wrap.clientWidth-32,wh=wrap.clientHeight-32;
  const nC=st.mat.reduce((mx,r)=>Math.max(mx,r.length),0);
  const nR=st.mat.length;
  const scaleX=Math.floor(ww/(nC*9));
  const scaleY=Math.floor(wh/(nR*9));
  SCALE=Math.max(1,Math.min(scaleX,scaleY,maxScale()));
  // update select to closest option
  const sel=document.getElementById('zoom-sel');
  const opts=[...sel.options].map(o=>+o.value).filter(v=>v<=maxScale());
  const closest=opts.reduce((a,b)=>Math.abs(b-SCALE)<Math.abs(a-SCALE)?b:a);
  sel.value=closest;
  SCALE=closest;
  renderFrame();
}

function savePng(){
  if(!st.mat)return;
  const sw=st.si>=0&&st.pfad?st.pfad[st.si].ss:null;
  const b=basisBild();
  // weißer Rand in Größe des Lok-Leuchthofs, damit die Lok am Bildrand nicht abgeschnitten wird
  const pad=Math.ceil(lokMass().halo);
  const tmp=document.createElement('canvas');
  tmp.width=b.width+2*pad;tmp.height=b.height+2*pad;
  const tc=tmp.getContext('2d');
  tc.fillStyle='#fff';tc.fillRect(0,0,tmp.width,tmp.height);
  tc.translate(pad,pad);
  zeichneGleise(tc,sw);
  if(st.si>=0&&st.pfad){const s=st.pfad[st.si];drawTrain(tc,s.y,s.x,s.f);}
  const a=document.createElement('a');
  a.href=tmp.toDataURL('image/png');
  a.download=`tm2train_step${st.si+1}.png`;a.click();
}

function brueckeUmschalten(){
  if(st.tmText)loadTM(st.tmText,st.tmName);
}

// Speichert diese Seite als eigenständige HTML-Datei, in die die aktuell
// geladene TM eingebettet ist. Beim Öffnen der Datei wird sie sofort geladen.
function saveHtml(){
  if(!st.tmText)return;
  const doc=PRISTINE_DOC.cloneNode(true);
  const emb=doc.querySelector('#tm-embedded');
  // "</script" im Text würde den Block vorzeitig beenden
  emb.textContent='\n'+st.tmText.replace(/<\/(script)/gi,'<\\/$1').replace(/\s+$/,'')+'\n';
  emb.setAttribute('data-name',st.tmName);
  if(document.getElementById('chk-bruecke').checked)emb.setAttribute('data-bruecken','1');
  else emb.removeAttribute('data-bruecken');
  const html='<!DOCTYPE html>\n'+doc.outerHTML;
  const base=st.tmName.replace(/\.[^.]*$/,'')||'tm2train';
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`tm2train_${base}.html`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  setStatus(`Gespeichert: tm2train_${base}.html (mit ${st.tmName})`);
}

// Eingebettete TM beim Öffnen automatisch laden
(function(){
  const emb=document.getElementById('tm-embedded');
  const txt=emb?emb.textContent.trim():'';
  if(emb&&emb.getAttribute('data-bruecken')==='1')document.getElementById('chk-bruecke').checked=true;
  if(txt)loadTM(txt,emb.getAttribute('data-name')||'eingebettet.tm');
})();

document.getElementById('fi').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>loadTM(ev.target.result,f.name);r.readAsText(f);
  e.target.value='';
});

canvas.addEventListener('mousemove',e=>{
  if(!st.mat)return;
  const rect=canvas.getBoundingClientRect(),cell=9*SCALE;
  const cx=Math.floor((e.clientX-rect.left)/cell),cy=Math.floor((e.clientY-rect.top)/cell);
  if(cy>=0&&cy<st.mat.length&&cx>=0)canvas.title=`(${cy},${cx}): ${(st.mat[cy]||[])[cx]||'0'}`;
});
</script>
</body>
</html>
