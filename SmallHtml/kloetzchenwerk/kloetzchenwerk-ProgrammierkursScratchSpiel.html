<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProgrammierkursScratchSpiel – Klötzchenwerk</title>
<style>
:root{--bg:#e5f0ff;--panel:#fff;--line:#d9e3f2;--text:#575e75;--accent:#855cd6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;font:14px/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--accent);color:#fff;flex:none;flex-wrap:wrap}
header .logo{font-weight:800;font-size:18px;margin-right:6px}
header .logo span{color:#ffd88a}
header button,header select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
header button:hover{background:rgba(255,255,255,.28)}
header select option{color:#333}
#projName{background:#fff;border:none;border-radius:6px;padding:5px 8px;font:inherit;width:170px;color:#333}
header label{display:flex;align-items:center;gap:4px;font-size:13px}
header a{color:#fff;font-size:12px;opacity:.95}
.grow{flex:1}
main{flex:1;display:flex;min-height:0;gap:8px;padding:8px}
#editor{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#tabs{display:flex;gap:2px;background:#e9eef6;padding:4px 4px 0;flex:none}
#tabs button{border:1px solid var(--line);border-bottom:none;background:#dfe7f3;padding:7px 16px;border-radius:8px 8px 0 0;font:inherit;color:var(--text);cursor:pointer}
#tabs button.on{background:#fff;color:var(--accent);font-weight:700}
.tab{display:none;flex:1;min-height:0}
.tab.on{display:flex}
#cats{width:64px;flex:none;overflow-y:auto;border-right:1px solid var(--line);padding:4px 0;background:#fff}
#cats .cat{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;padding:6px 2px;cursor:pointer;text-align:center}
#cats .cat.on{background:#e9f1fc;color:var(--accent);font-weight:700}
#cats .dot{width:20px;height:20px;border-radius:50%;background:var(--c);border:1px solid var(--d)}
#palette{width:280px;flex:none;overflow:auto;background:#f9f9f9;border-right:1px solid var(--line);padding:4px 10px 300px;position:relative}
body.del-hint #palette{background:#fde9ec}
.palhead{font-weight:700;font-size:14px;color:#575e75;margin:14px 0 6px}
.palnote{font-size:12px;color:#8a90a3;margin:4px 0}
.pblock{margin:7px 0;display:flex;align-items:center;gap:6px}
.pblock.gap{margin-top:16px}
.palbtn{display:block;margin:8px 0;padding:6px 10px;border:1px solid #c9d2e3;background:#fff;border-radius:6px;font:inherit;font-size:12px;color:var(--text);cursor:pointer}
.palbtn:hover{border-color:var(--accent);color:var(--accent)}
#ws{flex:1;min-width:0;overflow:auto;position:relative;background:#f9f9f9}
#wsInner{position:relative;min-width:100%;min-height:100%;background-image:radial-gradient(#d3d9e2 1.2px,transparent 1.4px);background-size:24px 24px}
.script{position:absolute}
.script.running{filter:drop-shadow(0 0 2px #ffd500) drop-shadow(0 0 3px #ffbf00)}
#ghost{position:absolute;display:none;height:8px;width:100px;background:rgba(0,0,0,.28);border-radius:4px;pointer-events:none;z-index:50}
/* Blöcke */
.blk{--c:#888;--d:#555;color:#fff;font:600 12px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;white-space:nowrap;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;touch-action:none}
.cat-motion{--c:#4C97FF;--d:#3373CC}.cat-looks{--c:#9966FF;--d:#774DCB}.cat-sound{--c:#CF63CF;--d:#BD42BD}
.cat-events{--c:#FFBF00;--d:#CC9900}.cat-control{--c:#FFAB19;--d:#CF8B17}.cat-sensing{--c:#5CB1D6;--d:#2E8EB8}
.cat-operators{--c:#59C059;--d:#389438}.cat-variables{--c:#FF8C1A;--d:#DB6E00}.cat-lists{--c:#FF661A;--d:#E64D00}
.cat-myblocks{--c:#FF6680;--d:#FF3355}.cat-unknown{--c:#a3a8b5;--d:#7d8292}.cat-pen{--c:#0FBD8C;--d:#0B8E69}.cat-music{--c:#0FA3BD;--d:#0B7F94}
.stack{display:flex;flex-direction:column;align-items:flex-start}
.row{display:flex;align-items:center;gap:5px;padding:6px 9px;min-height:40px}
.cmd,.hat{background:var(--c);border:1px solid var(--d);border-radius:4px}
.hat{border-radius:24px 24px 4px 4px/16px 16px 4px 4px}
.hat>.row{padding-top:15px}
.cmd::after,.hat::after,.cblk>.foot::after,.cblk>.row::after{content:"";position:absolute;left:12px;bottom:-7px;width:22px;height:7px;background:var(--c);border:1px solid var(--d);border-top:none;border-radius:0 0 6px 6px;z-index:3}
.cblk>.row::after{left:28px}
.cmd.cap::after,.cblk.cap>.foot::after{display:none}
.cblk{display:flex;flex-direction:column;align-items:flex-start}
.cblk>.row{background:var(--c);border:1px solid var(--d);border-radius:4px 4px 4px 0;position:relative;min-width:110px}
.cblk>.row.mid{border-radius:0 4px 4px 0;min-height:30px}
.cblk>.mouth{border-left:16px solid var(--c);min-height:24px;min-width:40px;display:flex;flex-direction:column;box-shadow:-1px 0 0 var(--d)}
.cblk>.foot{background:var(--c);border:1px solid var(--d);border-radius:0 4px 4px 4px;height:22px;width:110px;position:relative}
.rep{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;min-height:28px;border-radius:999px;background:var(--c);border:1px solid var(--d)}
.bool{display:inline-flex;align-items:center;gap:4px;padding:3px 16px;min-height:28px;background:var(--c);clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,13px 100%,0 50%)}
.param{cursor:grab}
.lbl{pointer-events:none}
.blk input.in{font:inherit;font-weight:500;color:#575e75;background:#fff;border:1px solid rgba(0,0,0,.18);border-radius:999px;height:24px;padding:0 6px;text-align:center;min-width:30px;outline:none}
.blk input.in:focus{box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.bslot{display:inline-block;width:40px;height:22px;background:rgba(0,0,0,.2);clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%)}
.blk select{font:inherit;color:#fff;background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.22);border-radius:6px;height:24px;padding:0 3px;cursor:pointer;max-width:190px}
.blk select option{color:#222;background:#fff}
.blk input.cin{width:34px;height:22px;border:2px solid #fff;border-radius:999px;padding:0;background:none;cursor:pointer}
.hot{outline:3px solid #fff;box-shadow:0 0 0 6px rgba(255,255,255,.45)!important}
#dragLayer{position:fixed;left:0;top:0;pointer-events:none;z-index:1000}
.dragwrap{position:absolute;left:0;top:0;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.valbub{position:fixed;background:#fff;border:1px solid #c9d2e3;border-radius:8px;padding:5px 10px;font:600 13px Helvetica,Arial,sans-serif;color:#575e75;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:900;max-width:320px;white-space:pre-wrap;word-break:break-word}
/* Seite rechts */
#side{width:min(500px,42vw);flex:none;display:flex;flex-direction:column;gap:8px;min-height:0}
#stageBar{display:flex;align-items:center;gap:6px;flex:none}
.sbtn{width:40px;height:32px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.sbtn:hover{background:#f2edfc}
#flag.on{background:#e3f6e3;border-color:#59c059}
#info2{font-size:12px;color:#8a90a3}
#stageWrap{position:relative;width:100%;aspect-ratio:4/3;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
#stage{width:100%;height:100%;display:block;touch-action:none}
body.full #stageWrap{position:fixed;z-index:600;left:50%;top:calc(50% + 22px);transform:translate(-50%,-50%);width:min(96vw,calc((100vh - 70px)*4/3));border-radius:0}
#bOsFull{display:none}body.full #bOsFull{display:grid}
body.full #stageBar{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:700;background:#fff;padding:4px 8px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#fullBg{display:none;position:fixed;inset:0;background:#20202e;z-index:550}
body.full #fullBg{display:block}
#monitors{position:absolute;inset:0;pointer-events:none}
.mon{position:absolute;pointer-events:auto;background:#e6f0ff;border:1px solid #c4ccd8;border-radius:5px;padding:3px 5px;font:600 12px Helvetica,Arial,sans-serif;color:#575e75;display:flex;gap:6px;align-items:center;cursor:move;white-space:nowrap}
.mon .v{background:#ff8c1a;color:#fff;border-radius:4px;padding:2px 6px;min-width:34px;text-align:center}
.lmon{flex-direction:column;align-items:stretch;width:150px;height:180px;padding:0;gap:0}
.lmon .ml{padding:4px;text-align:center;border-bottom:1px solid #c4ccd8}
.lmon .li{flex:1;overflow:auto;background:#fff;padding:2px}
.lmon .lr{display:flex;gap:4px;align-items:center;margin:2px 0}
.lmon .ln{width:20px;text-align:right;font-size:10px}
.lmon .lv{flex:1;background:#ff661a;color:#fff;border-radius:3px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis}
.lmon .lf{padding:3px;text-align:center;border-top:1px solid #c4ccd8;font-size:11px}
.lempty{text-align:center;color:#999;padding:8px;font-weight:400}
#askBox{position:absolute;left:3%;right:3%;bottom:3%;background:#fff;border:2px solid #d0d8e8;border-radius:8px;padding:8px;display:none}
#askBox.on{display:block}
#askQ{font-weight:700;margin-bottom:6px}
#askRow{display:flex;gap:6px}
#askIn{flex:1;border:2px solid var(--accent);border-radius:999px;padding:5px 10px;font:inherit;outline:none}
#askOk{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:16px}
#spriteInfo{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;flex:none}
#spriteInfo label{display:flex;align-items:center;gap:4px}
#spriteInfo input{width:58px;padding:4px 6px;border:1px solid #c9d2e3;border-radius:6px;font:inherit}
#spriteInfo #iName{width:110px}
#spriteInfo input[type=checkbox]{width:auto}
#spriteInfo.stage .sp{display:none}
#targets{flex:1;min-height:0;display:flex;gap:8px}
#spritePane{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px}
#stagePane{width:100px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.tile{width:78px;height:84px;border:2px solid #dbe2ee;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;background:#fff;font-size:11px}
.tile.sel{border-color:var(--accent);background:#f2edfc}
.tile.flash{animation:fl .6s}
@keyframes fl{50%{background:#fff2b3;transform:scale(1.08)}}
.tile .tname{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tdel{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:14px;line-height:1}
.tile.add{border-style:dashed;font-size:28px;color:var(--accent)}
.addbtn{border:1px dashed var(--accent);color:var(--accent);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font:inherit;font-size:12px}
/* Kostüme & Klänge */
.assetList{width:130px;flex:none;overflow-y:auto;border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;background:#f9f9f9}
.asset{border:2px solid #dbe2ee;border-radius:8px;background:#fff;padding:4px;cursor:pointer;position:relative;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center}
.asset.sel{border-color:var(--accent);background:#f2edfc}
.asset .num{position:absolute;left:5px;top:3px;font-size:10px}
.asset .x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer}
.asset .an{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#paint{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px;gap:8px;overflow:auto}
.ptools{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ptools button{min-width:34px;height:32px;border:1px solid #c9d2e3;background:#fff;border-radius:6px;cursor:pointer;font:inherit;padding:0 8px}
.ptools button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ptools input[type=text]{padding:5px 8px;border:1px solid #c9d2e3;border-radius:6px;font:inherit}
.ptools .sep{width:1px;height:24px;background:#d9e3f2;margin:0 4px}
#pcWrap{position:relative;width:min(100%,640px);aspect-ratio:4/3;background:repeating-conic-gradient(#eef1f5 0 25%,#fff 0 50%) 0 0/20px 20px;border:1px solid var(--line);flex:none}
#pc{width:100%;height:100%;cursor:crosshair;touch-action:none;display:block}
#pcCross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;pointer-events:none;background:linear-gradient(#855cd6,#855cd6) center/2px 100% no-repeat,linear-gradient(#855cd6,#855cd6) center/100% 2px no-repeat;opacity:.6}
#sndPane{flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.srow input{padding:5px 8px;border:1px solid #c9d2e3;border-radius:6px;font:inherit;width:160px}
.srow button{border:1px solid #c9d2e3;background:#fff;border-radius:6px;cursor:pointer;padding:5px 9px;font:inherit}
.srow canvas{border-radius:4px;background:#f6f0fb}
.sinfo{font-size:11px;color:#8a90a3}
/* Dialoge & Menüs */
#ctxMenu{position:fixed;display:none;background:#fff;border:1px solid #c9d2e3;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:3000;padding:4px 0;min-width:160px}
#ctxMenu.on{display:block}
#ctxMenu .mi{padding:7px 14px;cursor:pointer;font-size:13px}
#ctxMenu .mi:hover{background:var(--accent);color:#fff}
#modal{position:fixed;inset:0;background:rgba(40,40,70,.45);display:none;align-items:center;justify-content:center;z-index:2000}
#modal.on{display:flex}
.dlg{background:#fff;border-radius:12px;padding:16px 18px;min-width:320px;max-width:min(580px,92vw);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;color:var(--accent)}
.dlg p{margin:0;font-size:13px;line-height:1.45}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.dlg label.chk,.radios label{flex-direction:row;align-items:center;gap:6px}
.dlg input.t{padding:7px 10px;border:2px solid #d9e3f2;border-radius:8px;font:inherit}
.dlgbar{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.dlgbar button{padding:7px 14px;border-radius:8px;border:1px solid #d0d8e6;background:#fff;cursor:pointer;font:inherit}
.dlgbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.dlg.lib{max-width:min(880px,94vw)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;overflow:auto;padding:4px}
.libitem{border:2px solid #e1e7f0;border-radius:10px;padding:8px;text-align:center;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.libitem:hover{border-color:var(--accent);background:#f5f1fd}
.libitem img{width:92px;height:68px;object-fit:contain}
.libicon{font-size:34px;height:68px;display:grid;place-items:center;color:var(--accent)}
.dlg ul{margin:0;padding-left:18px;font-size:13px;line-height:1.5}
@media (max-width:900px){main{flex-direction:column;overflow:auto}#side{width:100%}#editor{min-height:70vh}}

<script>
'use strict';
// Quelltext der Seite im Originalzustand (für den HTML-Schnappschuss), bevor das Skript die Seite verändert
const PAGE_SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
/* ===================== Hilfsfunktionen ===================== */
const $=s=>document.querySelector(s);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
const now=()=>performance.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mod=(a,n)=>((a%n)+n)%n;
const R=2; // Bühnen-Renderauflösung
let uidN=0;const uid=(p='b')=>p+(++uidN).toString(36)+Math.random().toString(36).slice(2,7);
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const STOP={stop:1},STOP_THIS={stopThis:1};
function num(v){if(typeof v==='number')return isNaN(v)?0:v;if(typeof v==='boolean')return v?1:0;const n=Number(v);return isNaN(n)?0:n;}
function str(v){if(v===true)return'true';if(v===false)return'false';if(v==null)return'';return String(v);}
function bool(v){if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0&&!isNaN(v);const s=String(v==null?'':v).toLowerCase();return!(s===''||s==='0'||s==='false');}
function isWhite(v){return typeof v==='string'&&v.trim()==='';}
function cmp(a,b){const n1=Number(a),n2=Number(b);if(isWhite(a)||isWhite(b)||isNaN(n1)||isNaN(n2)||typeof a==='boolean'||typeof b==='boolean'){const s1=str(a).toLowerCase(),s2=str(b).toLowerCase();return s1<s2?-1:s1>s2?1:0;}return n1-n2;}
function isIntLike(v){if(typeof v==='number')return Number.isInteger(v);return!String(v).includes('.');}
function lim(x){const r=Math.round(x);return Math.abs(x-r)<1e-9?r:Math.round(x*1e8)/1e8;}
function hexRgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255];}
function rgbHex(d){return'#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');}
function hsvToRgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return[f(5)*255,f(3)*255,f(1)*255];}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return[h,mx?d/mx:0,mx];}
function uniqName(base,taken){if(!taken.includes(base))return base;let m=base.match(/^(.*?)(\d+)$/),stem=m?m[1]:base,i=m?+m[2]+1:2;while(taken.includes(stem+i))i++;return stem+i;}
function pushText(out,s){s=s.trim();if(s)out.push({t:'text',v:s});}
function parseSpec(text){const out=[];const re=/%([nsbc])|%([mM])\.(\w+)/g;let last=0,m;while((m=re.exec(text))){if(m.index>last)pushText(out,text.slice(last,m.index));out.push(m[1]?{t:'arg',k:m[1]}:{t:'arg',k:m[2],menu:m[3]});last=re.lastIndex;}if(last<text.length)pushText(out,text.slice(last));return out;}

/* ===================== Blockdefinitionen ===================== */
const CATS=[['motion','Bewegung'],['looks','Aussehen'],['sound','Klang'],['events','Ereignisse'],['control','Steuerung'],['sensing','Fühlen'],['operators','Operatoren'],['variables','Variablen'],['myblocks','Meine Blöcke'],['pen','Malstift'],['music','Musik']];
const DEFS={};
function def(op,cat,type,text,defaults,o={}){const d=Object.assign({op,cat,type,text,defaults:defaults||[],tok:parseSpec(text)},o);DEFS[op]=d;}
const fv=t=>{const v=allVarsFor(t,'vars');return v.length?v[0].id:'';};
const fl=t=>{const v=allVarsFor(t,'lists');return v.length?v[0].id:'';};
// Bewegung
def('motion_move','motion','c','gehe %n er-Schritt',[10],{where:'s'});

def('motion_changey','motion','c','ändere y um %n',[10],{where:'s'});
def('motion_sety','motion','c','setze y auf %n',t=>[Math.round(t.y)],{where:'s'});
def('motion_bounce','motion','c','pralle vom Rand ab',[],{where:'s',gap:1});

// Aussehen
def('looks_sayfor','looks','c','sage %s für %n Sekunden',['Hallo!',2],{where:'s'});

function procTokens(b,isDef){const out=[];const parts=String(b.code||'').split(/(%[sb])/);let k=0;for(const p of parts){if(p==='%s'||p==='%b'){if(isDef)out.push({t:'param',v:(b.names||[])[k]||'?',k:p[1]});else out.push({t:'arg',k:p[1]});k++;}else pushText(out,p);}return out;}
function tokensOf(b,t){const d=DEFS[b.op];return d.dyn?d.dyn(b,t):d.tok;}
function argKinds(b,t){return tokensOf(b,t).filter(x=>x.t==='arg');}
const isRepType=b=>{const d=DEFS[b.op];return!!d&&(d.type==='r'||d.type==='b');};
const lastOf=b=>{while(b.next)b=b.next;return b;};

function starPts(cx,cy,r1,r2,n){const p=[];for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=-Math.PI/2+i*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}

 project.name=d.name||'Projekt';project.tempo=d.tempo||60;project.messages=Array.isArray(d.messages)&&d.messages.length?d.messages:['Nachricht1'];
 stage=mkTarget(d.stage,true);project.stage=stage;project.sprites=(d.sprites||[]).map(s=>mkTarget(s,false));
 RT.order=project.sprites.slice().sort((a,b)=>a._layer-b._layer);penCtx.clearRect(0,0,penCv.width,penCv.height);
 editing=project.sprites[0]||stage;$('#projName').value=project.name;RT.timerStart=now();RT.answer='';RT.monDirty=true;
 for(const t of[stage,...project.sprites])t.sounds.forEach(s=>{try{prepSound(s);}catch(e){}});
 renderAll();Promise.all([stage,...project.sprites].flatMap(t=>t.costumes.map(c=>c._p))).then(()=>{renderSpriteList();if(curTab==='costumes')renderCostumes();});
 dirty=false;}

/* ===================== Blöcke erzeugen & suchen ===================== */
let BLK=new Map(),dirty=false;
function makeBlock(op,t){const d=DEFS[op];const b={id:uid(),op,args:[],next:null};
 if(d.type==='C'||d.type==='F'||d.type==='E')b.sub=null;if(d.type==='E')b.sub2=null;
 const dv=typeof d.defaults==='function'?d.defaults(t):(d.defaults||[]);let i=0;
 for(const tk of d.tok){if(tk.t!=='arg')continue;let v=dv[i];
  if(v===undefined||(v===null&&tk.k!=='b')){if(tk.k==='b')v=null;else if(tk.k==='m'||tk.k==='M'){const o=MENUS[tk.menu](t,b);v=o.length?o[0][1]:'';}else if(tk.k==='c')v='#4c97ff';else v='';}
  b.args[i++]=v;}
 return b;}
function makeCall(d){return{id:uid(),op:'procedures_call',code:d.code,args:d.types.map(k=>k==='b'?null:''),next:null};}
function makeArg(name,kind){return{id:uid(),op:kind==='b'?'argument_bool':'argument_reporter',name,args:[],next:null};}
function cloneBlock(b,withNext){const saved=b.next;if(!withNext)b.next=null;const c=JSON.parse(JSON.stringify(b));b.next=saved;reid(c);return c;}
function reid(b){if(!b)return;b.id=uid();(b.args||[]).forEach(a=>{if(a&&typeof a==='object')reid(a);});reid(b.sub);reid(b.sub2);reid(b.next);}
function walk(b,fn){while(b){fn(b);for(const a of b.args||[])if(a&&typeof a==='object')walk(a,fn);if(b.sub)walk(b.sub,fn);if(b.sub2)walk(b.sub2,fn);b=b.next;}}
function walkTarget(t,fn){for(const top of t.scripts)walk(top,fn);}
function walkAll(fn){for(const t of[stage,...project.sprites])walkTarget(t,fn);}
function allMessages(){const set=new Set(project.messages);walkAll(b=>{if(/^event_(receive|broadcast|broadcastwait)$/.test(b.op)&&typeof b.args[0]==='string'&&b.args[0]&&b.args[0]!=='__new__')set.add(b.args[0]);});return[...set];}
function findProc(t,code){return t.scripts.find(s=>s.op==='procedures_definition'&&s.code===code);}
function spriteByName(n){return project.sprites.find(s=>s.name===n);}
function walkFind(cur,b){while(cur){for(let i=0;i<(cur.args||[]).length;i++){const a=cur.args[i];if(a&&typeof a==='object'){if(a===b)return{kind:'arg',parent:cur,i};const r=walkFind(a,b);if(r)return r;}}
  for(const k of['sub','sub2'])if(cur[k]){if(cur[k]===b)return{kind:'sub',parent:cur,key:k};const r=walkFind(cur[k],b);if(r)return r;}
  if(cur.next===b)return{kind:'next',parent:cur};cur=cur.next;}return null;}
function findLoc(b,t=editing){for(let i=0;i<t.scripts.length;i++){const top=t.scripts[i];if(top===b)return{kind:'top',i};const r=walkFind(top,b);if(r)return r;}return null;}
function topOf(b,t=editing){for(const top of t.scripts){if(top===b||walkFind(top,b))return top;}return null;}
function restoreLit(p,i){const k=argKinds(p,editing)[i];p.args[i]=(p.lits&&p.lits[i]!==undefined)?p.lits[i]:(k&&k.k==='b'?null:'');}
function detach(b){const L=findLoc(b);if(!L)return;
 if(L.kind==='top')editing.scripts.splice(L.i,1);else if(L.kind==='next')L.parent.next=null;else if(L.kind==='sub')L.parent[L.key]=null;else if(L.kind==='arg')restoreLit(L.parent,L.i);}

/* ===================== Blöcke darstellen ===================== */
function renderBlock(b,t,pal){const d=DEFS[b.op];if(!d){const x=el('div','blk cmd','? '+b.op);x.dataset.id=b.id;BLK.set(b.id,b);return x;}
 BLK.set(b.id,b);const cat='cat-'+(d.cls||d.cat);let e;
 if(d.type==='r'||d.type==='b'){e=el('span','blk '+(d.type==='r'?'rep ':'bool ')+cat);fillRow(e,b,tokensOf(b,t),t);}
 else if(d.type==='C'||d.type==='F'||d.type==='E'){e=el('div','blk cblk '+cat+(d.type==='F'?' cap':''));const r1=el('div','row');fillRow(r1,b,tokensOf(b,t),t);e.append(r1,mouth(b,'sub',t,pal));
  if(d.type==='E'){const r2=el('div','row mid');r2.append(el('span','lbl',d.text2));e.append(r2,mouth(b,'sub2',t,pal));}e.append(el('div','foot'));}
 else{e=el('div','blk '+(d.type==='h'?'hat ':'cmd ')+cat+(d.type==='x'?' cap':''));const r=el('div','row');fillRow(r,b,tokensOf(b,t),t);e.append(r);}
 e.dataset.id=b.id;return e;}
function mouth(b,key,t,pal){const m=el('div','mouth');m.dataset.mowner=b.id;m.dataset.key=key;if(b[key])m.append(renderStack(b[key],t,pal));return m;}
function renderStack(b,t,pal){const s=el('div','stack');for(let x=b;x;x=x.next)s.append(renderBlock(x,t,pal));return s;}
function fillRow(row,b,toks,t){let ai=0;
 for(const tk of toks){
  if(tk.t==='text'){row.append(el('span','lbl',tk.v));continue;}
  if(tk.t==='param'){const p=el('span','blk param cat-myblocks '+(tk.k==='b'?'bool':'rep'),tk.v);p.dataset.name=tk.v;p.dataset.kind=tk.k;row.append(p);continue;}
  const i=ai++;const v=b.args[i];
  if(v&&typeof v==='object'){const c=renderBlock(v,t);if(tk.k!=='m'&&tk.k!=='c'){c.dataset.owner=b.id;c.dataset.idx=i;c.dataset.kind=tk.k;}row.append(c);continue;}
  row.append(renderInput(b,i,tk,t));}}
const sizeIn=inp=>{inp.style.width=`calc(${Math.max(1,[...inp.value].length)}ch + 14px)`;};
function renderInput(b,i,tk,t){const v=b.args[i];
 if(tk.k==='b'){const s=el('span','bslot');s.dataset.owner=b.id;s.dataset.idx=i;s.dataset.kind='b';return s;}
 if(tk.k==='n'||tk.k==='s'){const inp=el('input','in '+tk.k);inp.value=v==null?'':String(v);inp.spellcheck=false;if(tk.k==='n')inp.inputMode='decimal';sizeIn(inp);
  inp.addEventListener('input',()=>{b.args[i]=inp.value;sizeIn(inp);dirty=true;});inp.dataset.owner=b.id;inp.dataset.idx=i;inp.dataset.kind=tk.k;return inp;}
 if(tk.k==='c'){const inp=el('input','cin');inp.type='color';inp.value=/^#[0-9a-f]{6}$/i.test(v)?v:'#000000';inp.addEventListener('input',()=>{b.args[i]=inp.value;dirty=true;});return inp;}
 const sel=el('select');const opts=MENUS[tk.menu](t,b);let found=false;
 for(const[lab,val]of opts){const o=el('option',null,lab);o.value=val;if(String(val)===String(v)){o.selected=true;found=true;}sel.append(o);}
 if(!found){if(tk.menu==='ofprop'&&opts.length){b.args[i]=opts[0][1];sel.value=opts[0][1];}
  else if(v!==''&&v!=null){const o=el('option',null,(tk.menu==='var'||tk.menu==='list')?'?':String(v));o.value=v;o.selected=true;sel.prepend(o);}}
 sel.addEventListener('change',async()=>{dirty=true;if(sel.value==='__new__'){const r=await dialog({title:'Neue Nachricht',inputs:[{label:'Name der Nachricht',value:''}]});const n=r&&r.values[0].trim();
   if(n){if(!project.messages.includes(n))project.messages.push(n);b.args[i]=n;}renderWorkspace();renderPalette();return;}
  b.args[i]=sel.value;if(tk.menu==='oftarget'){renderWorkspace();renderPalette();}});
 if(tk.k==='M'){sel.dataset.owner=b.id;sel.dataset.idx=i;sel.dataset.kind='M';}
 return sel;}

/* ===================== Palette ===================== */
const okWhere=(d,t)=>!d.where||(d.where==='s'?!t.isStage:t.isStage);
function addPal(pal,b,gap,extra){const w=el('div','pblock'+(gap?' gap':''));if(extra)w.append(extra);w.append(renderBlock(b,editing,true));pal.append(w);}
function palBtn(pal,txt,fn){const b=el('button','palbtn',txt);b.onclick=fn;pal.append(b);}
function renderPalette(){const t=editing,pal=$('#palette'),st=pal.scrollTop;pal.innerHTML='';
 for(const[cid,cname]of CATS){const h=el('div','palhead',cname);h.dataset.cat=cid;pal.append(h);
  if(cid==='variables'){paletteVars(pal,t);continue;}
  if(cid==='myblocks'){palBtn(pal,'Neuen Block erstellen',newProc);for(const top of t.scripts)if(top.op==='procedures_definition')addPal(pal,makeCall(top));continue;}
  if(cid==='motion'&&t.isStage)pal.append(el('div','palnote','Die Bühne hat keine Bewegungsblöcke. Wähle eine Figur aus.'));
  for(const d of Object.values(DEFS))if(d.cat===cid&&d.pal!==false&&okWhere(d,t))addPal(pal,makeBlock(d.op,t),d.gap);}
 pal.scrollTop=st;renderCats();}
function monCheck(v){const cb=el('input');cb.type='checkbox';cb.title='Auf der Bühne anzeigen';cb.checked=!!(v.monitor&&v.monitor.visible);cb.onchange=()=>setMonitor(v,cb.checked);return cb;}
function paletteVars(pal,t){palBtn(pal,'Neue Variable',()=>newVar(false));
 const vars=allVarsFor(t,'vars');for(const v of vars){const b=makeBlock('data_var',t);b.var=v.id;addPal(pal,b,false,monCheck(v));}
 if(vars.length)['data_setvar','data_changevar','data_showvar','data_hidevar'].forEach((op,k)=>addPal(pal,makeBlock(op,t),k===0));
 palBtn(pal,'Neue Liste',()=>newVar(true));
 const lists=allVarsFor(t,'lists');for(const l of lists){const b=makeBlock('data_list',t);b.list=l.id;addPal(pal,b,false,monCheck(l));}
 if(lists.length)['data_addtolist','data_deleteoflist','data_deletealloflist','data_insertatlist','data_replaceitem','data_itemoflist','data_itemnum','data_lengthoflist','data_listcontains','data_showlist','data_hidelist'].forEach((op,k)=>addPal(pal,makeBlock(op,t),k===0||op==='data_itemoflist'||op==='data_showlist'));}
function renderCats(){const C=$('#cats');C.innerHTML='';for(const[id,name]of CATS){const c=el('div','cat');c.dataset.cat=id;c.append(el('span','dot cat-'+id),el('span',null,name));
 c.onclick=()=>{const h=$('#palette').querySelector(`.palhead[data-cat="${id}"]`);if(h)$('#palette').scrollTo({top:h.offsetTop-4,behavior:'smooth'});};C.append(c);}spyCats();}
function spyCats(){const pal=$('#palette');let cur=CATS[0][0];pal.querySelectorAll('.palhead').forEach(h=>{if(h.offsetTop-8<=pal.scrollTop)cur=h.dataset.cat;});$('#cats').querySelectorAll('.cat').forEach(c=>c.classList.toggle('on',c.dataset.cat===cur));}

/* ===================== Arbeitsfläche ===================== */
function renderWorkspace(){const t=editing,wi=$('#wsInner');wi.innerHTML='';
 for(const top of t.scripts){const sc=el('div','script');sc.dataset.top=top.id;sc.style.left=(top.x||0)+'px';sc.style.top=(top.y||0)+'px';sc.append(isRepType(top)?renderBlock(top,t):renderStack(top,t));wi.append(sc);}
 const g=el('div');g.id='ghost';wi.append(g);
 let mx=0,my=0;wi.querySelectorAll('.script').forEach(s=>{mx=Math.max(mx,s.offsetLeft+s.offsetWidth);my=Math.max(my,s.offsetTop+s.offsetHeight);});
 wi.style.width=(mx+700)+'px';wi.style.height=(my+500)+'px';dirty=true;}
function cleanUp(){const wi=$('#wsInner');const items=editing.scripts.map(top=>({top,el:wi.querySelector(`.script[data-top="${top.id}"]`)})).sort((a,b)=>(a.top.y||0)-(b.top.y||0));
 let y=20;for(const it of items){it.top.x=20;it.top.y=y;y+=(it.el?it.el.offsetHeight:40)+28;}renderWorkspace();}

/* ===================== Ziehen & Ablegen ===================== */
let PD=null,DR=null,PAN=null;
function onBlockDown(e){if(e.button!==0)return;
 if(e.target.closest('input,select,button'))return;
 const inPal=!!e.target.closest('#palette');const param=e.target.closest('.param');const be=e.target.closest('.blk[data-id]');
 if(!be&&!param){if(!inPal&&e.target.closest('#ws')){const ws=$('#ws');PAN={x:e.clientX,y:e.clientY,l:ws.scrollLeft,t:ws.scrollTop};e.preventDefault();}return;}
 e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 PD={x:e.clientX,y:e.clientY,be,inPal,param};}
function startDrag(e){const P=PD;let b,rect;
 if(P.param){b=makeArg(P.param.dataset.name,P.param.dataset.kind);rect=P.param.getBoundingClientRect();}
 else{const src=BLK.get(P.be.dataset.id);if(!src){PD=null;return;}rect=P.be.getBoundingClientRect();if(P.inPal)b=cloneBlock(src,false);else{b=src;detach(b);renderWorkspace();}}
 const layer=$('#dragLayer');layer.innerHTML='';const isRep=isRepType(b);const wrap=el('div','dragwrap');wrap.append(isRep?renderBlock(b,editing):renderStack(b,editing));layer.append(wrap);
 DR={b,ox:P.x-rect.left,oy:P.y-rect.top,wrap,isRep,fromPal:P.inPal||!!P.param,origin:{x:rect.left,y:rect.top}};
 collectTargets();moveDrag(e);}
function collectTargets(){const T=[],b=DR.b,wi=$('#wsInner');
 if(DR.isRep){const isBool=DEFS[b.op].type==='b';
  wi.querySelectorAll('[data-owner]').forEach(s=>{if(s.dataset.kind==='b'&&!isBool)return;const owner=BLK.get(s.dataset.owner);if(owner)T.push({kind:'slot',el:s,owner,idx:+s.dataset.idx});});}
 else{const d0=DEFS[b.op],topHat=d0.type==='h',last=lastOf(b),capEnd=['x','F'].includes((DEFS[last.op]||{}).type);
  const dragH=DR.wrap.firstChild.getBoundingClientRect().height;DR.dragH=dragH;
  wi.querySelectorAll('.script').forEach(sc=>{const top=BLK.get(sc.dataset.top);if(!top||isRepType(top)||DEFS[top.op].type==='h'||capEnd)return;const fe=sc.querySelector(':scope>.stack>.blk');if(!fe)return;const r=fe.getBoundingClientRect();T.push({kind:'above',top,x:r.left,y:r.top-dragH,gx:r.left,gy:r.top});});
  if(!topHat){wi.querySelectorAll('.blk[data-id]').forEach(be=>{const bb=BLK.get(be.dataset.id);if(!bb)return;const dd=DEFS[bb.op];if(!dd||dd.type==='r'||dd.type==='b'||dd.type==='x'||dd.type==='F')return;if(capEnd&&bb.next)return;const r=be.getBoundingClientRect();T.push({kind:'after',blk:bb,x:r.left,y:r.bottom,gx:r.left,gy:r.bottom});});
   wi.querySelectorAll('.mouth').forEach(m=>{const owner=BLK.get(m.dataset.mowner),key=m.dataset.key;if(!owner||(capEnd&&owner[key]))return;const r=m.getBoundingClientRect();T.push({kind:'mouth',blk:owner,key,x:r.left+16,y:r.top,gx:r.left+16,gy:r.top});});}}
 DR.targets=T;}
let hotEl=null;
function moveDrag(e){const x=e.clientX-DR.ox,y=e.clientY-DR.oy;DR.wrap.style.transform=`translate(${x}px,${y}px)`;DR.x=x;DR.y=y;let best=null,bd=1e9;
 if(DR.isRep){const r=DR.wrap.getBoundingClientRect();const px=x,py=y+r.height/2;for(const T of DR.targets){const s=T.el.getBoundingClientRect();if(px>=s.left-16&&px<=s.right&&py>=s.top-10&&py<=s.bottom+10){const d=Math.hypot(px-s.left,py-(s.top+s.height/2));if(d<bd){bd=d;best=T;}}}}
 else for(const T of DR.targets){const d=Math.hypot(x-T.x,y-T.y);if(d<bd&&d<40){bd=d;best=T;}}
 DR.best=best;if(hotEl){hotEl.classList.remove('hot');hotEl=null;}const g=$('#ghost');
 if(best&&best.kind==='slot'){hotEl=best.el;hotEl.classList.add('hot');g.style.display='none';}
 else if(best){const ir=$('#wsInner').getBoundingClientRect();g.style.display='block';g.style.left=(best.gx-ir.left)+'px';g.style.top=(best.gy-ir.top-4)+'px';}
 else g.style.display='none';
 const pr=$('#palette').getBoundingClientRect();document.body.classList.toggle('del-hint',e.clientX<pr.right&&curTab==='code');}
function endDrag(e){const D=DR;DR=null;document.body.classList.remove('del-hint');if(hotEl){hotEl.classList.remove('hot');hotEl=null;}const g=$('#ghost');if(g)g.style.display='none';$('#dragLayer').innerHTML='';
 const pr=$('#palette').getBoundingClientRect();const ir=$('#wsInner').getBoundingClientRect();const wr=$('#ws').getBoundingClientRect();
 const isDef=D.b.op==='procedures_definition';
 if(e.clientX<pr.right&&e.clientY>=pr.top&&curTab==='code'){renderWorkspace();if(isDef)renderPalette();return;}
 const hit=document.elementFromPoint(e.clientX,e.clientY);const tile=hit&&hit.closest('.tile[data-uid]');
 if(tile){const tgt=[stage,...project.sprites].find(s=>s.uid===tile.dataset.uid);if(tgt&&tgt!==editing){const c=cloneBlock(D.b,true);c.x=20+Math.random()*80;c.y=20+Math.random()*80;tgt.scripts.push(c);tile.classList.remove('flash');void tile.offsetWidth;tile.classList.add('flash');}
  if(!D.fromPal){D.b.x=Math.max(0,D.origin.x-ir.left);D.b.y=Math.max(0,D.origin.y-ir.top);editing.scripts.push(D.b);}renderWorkspace();return;}
 const inWs=e.clientX>=wr.left&&e.clientX<=wr.right&&e.clientY>=wr.top&&e.clientY<=wr.bottom;const T=D.best;
 if(T&&inWs)applyDrop(T,D);
 else if(inWs||!D.fromPal){const px=(inWs?D.x:D.origin.x)-ir.left,py=(inWs?D.y:D.origin.y)-ir.top;D.b.x=Math.max(0,Math.round(px));D.b.y=Math.max(0,Math.round(py));editing.scripts.push(D.b);}
 renderWorkspace();if(isDef)renderPalette();}
function applyDrop(T,D){const b=D.b;
 if(T.kind==='slot'){const o=T.owner,i=T.idx,old=o.args[i];if(old&&typeof old==='object'){const ir=$('#wsInner').getBoundingClientRect(),r=T.el.getBoundingClientRect();old.x=r.left-ir.left+24;old.y=r.bottom-ir.top+24;editing.scripts.push(old);}else{o.lits=o.lits||[];o.lits[i]=old;}o.args[i]=b;}
 else if(T.kind==='after'){lastOf(b).next=T.blk.next;T.blk.next=b;}
 else if(T.kind==='mouth'){lastOf(b).next=T.blk[T.key];T.blk[T.key]=b;}
 else if(T.kind==='above'){const idx=editing.scripts.indexOf(T.top);lastOf(b).next=T.top;b.x=T.top.x;b.y=Math.max(0,(T.top.y||0)-Math.round(D.dragH));editing.scripts[idx]=b;delete T.top.x;delete T.top.y;}}
function clickBlock(P){if(P.param)return;const b=BLK.get(P.be.dataset.id);if(!b)return;
 if(P.inPal){if(isRepType(b))showVal(P.be,evalIn(b));else{const th=new Thread(editing,b);RT.threads.push(th);}return;}
 const top=topOf(b);if(!top)return;if(isRepType(top)){showVal(P.be.closest('.script')||P.be,evalIn(top));return;}
 const ex=RT.threads.filter(x=>x.t===editing&&x.top===top&&!x.done);if(ex.length)ex.forEach(x=>x.done=true);else RT.threads.push(new Thread(editing,top));}
function evalIn(b){try{return ev(b,{t:editing,frames:[],warp:0});}catch(e){return'';}}
function showVal(elm,v){document.querySelectorAll('.valbub').forEach(x=>x.remove());const r=elm.getBoundingClientRect();const b=el('div','valbub',str(v));b.style.left=r.left+'px';b.style.top=(r.bottom+6)+'px';document.body.append(b);setTimeout(()=>b.remove(),4000);}
function deleteSingle(b){const L=findLoc(b);if(!L)return;
 if(isRepType(b)){if(L.kind==='top')editing.scripts.splice(L.i,1);else if(L.kind==='arg')restoreLit(L.parent,L.i);renderWorkspace();return;}
 const nx=b.next;b.next=null;
 if(L.kind==='top'){if(nx){nx.x=b.x;nx.y=b.y;editing.scripts[L.i]=nx;}else editing.scripts.splice(L.i,1);}
 else if(L.kind==='next')L.parent.next=nx;else if(L.kind==='sub')L.parent[L.key]=nx;
 renderWorkspace();if(b.op==='procedures_definition')renderPalette();}
function duplicate(b,be){const c=cloneBlock(b,!isRepType(b));const ir=$('#wsInner').getBoundingClientRect(),r=be.getBoundingClientRect();c.x=Math.round(r.left-ir.left+30);c.y=Math.round(r.top-ir.top+30);editing.scripts.push(c);renderWorkspace();}

/* ===================== Dialoge & Kontextmenü ===================== */
function dialog(o){return new Promise(res=>{const ov=$('#modal');ov.innerHTML='';ov.onclick=null;ov.classList.add('on');const box=el('div','dlg');box.append(el('h3',null,o.title||''));
 if(o.text)box.append(el('p',null,o.text));if(o.html){const d=el('div');d.innerHTML=o.html;box.append(d);}
 const ins=(o.inputs||[]).map(inp=>{const l=el('label',null,inp.label);const i=el('input','t');i.value=inp.value??'';l.append(i);box.append(l);return i;});

function thumbCanvas(c,W,H){const cv=el('canvas');cv.width=W*2;cv.height=H*2;cv.style.width=W+'px';cv.style.height=H+'px';
 const draw=()=>{const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);if(!c||!c.ok)return;const bb=c.bb||{x0:0,y0:0,x1:c.w,y1:c.h};const bw=Math.max(1,bb.x1-bb.x0),bh=Math.max(1,bb.y1-bb.y0);
  const s=Math.min(cv.width/bw,cv.height/bh,4)*.92;x.drawImage(c.img,(cv.width-bw*s)/2-bb.x0*s,(cv.height-bh*s)/2-bb.y0*s,c.w*s,c.h*s);};
 if(c&&c.ok)draw();else if(c&&c._p)c._p.then(draw);return cv;}

async function fileToCostume(f){const name=f.name.replace(/\.[^.]+$/,'')||'Bild';
 if(f.type==='image/svg+xml'||/\.svg$/i.test(f.name)){const n=normSVG(await readText(f));if(!n)return Object.assign(emptyCostume(),{name});return{name,src:svgURL(n.text),w:Math.max(1,n.w),h:Math.max(1,n.h),cx:n.w/2,cy:n.h/2,vx:n.vx,vy:n.vy,res:1};}
 const src=await readURL(f);const img=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});if(!img)return Object.assign(emptyCostume(),{name});
 const w=img.naturalWidth||1,h=img.naturalHeight||1,k=Math.max(w/480,h/360);
 if(k>1||!/^image\/(png|jpeg)$/.test(f.type)){const sc=k>2?2/k:1;const cv=el('canvas');cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  const r=k>1?2:1;return{name,src:cv.toDataURL('image/png'),w:cv.width/r,h:cv.height/r,cx:cv.width/r/2,cy:cv.height/r/2,res:r};}
 return{name,src,w,h,cx:w/2,cy:h/2,res:1};}

function deleteCostume(i){const t=editing;if(t.costumes.length<2)return;t.costumes.splice(i,1);for(const o of[t,...RT.order.filter(x=>x.def===t)])if(o.costume>=t.costumes.length||o.costume>i)o.costume=Math.max(0,o.costume-1);RT.redraw=true;renderCostumes();renderSpriteList();renderPalette();renderWorkspace();}
function paintLoad(){const t=editing,c=t.costumes[t.costume];P.ctx.clearRect(0,0,960,720);P.undo=[];$('#pcName').value=c?c.name:'';$('#pcCross').style.display=t.isStage?'none':'';
 if(!c)return;if(!c.ok){if(c._p)c._p.then(()=>{if(editing.costumes[editing.costume]===c)paintLoad();});return;}P.ctx.drawImage(c.img,(240-c.cx)*2,(180-c.cy)*2,c.w*2,c.h*2);}
function commitPaint(){const t=editing,c=t.costumes[t.costume];if(!c)return;
 if(t.isStage){Object.assign(c,{src:P.cv.toDataURL('image/png'),w:480,h:360,cx:240,cy:180,res:2});}
 else{const d=P.ctx.getImageData(0,0,960,720).data;let x0=960,y0=720,x1=-1,y1=-1;for(let y=0;y<720;y++)for(let x=0;x<960;x++)if(d[(y*960+x)*4+3]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)Object.assign(c,emptyCostume(),{name:c.name});
  else{x0=Math.max(0,x0-2);y0=Math.max(0,y0-2);x1=Math.min(959,x1+2);y1=Math.min(719,y1+2);const w=x1-x0+1,h=y1-y0+1;const cv=el('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(P.cv,x0,y0,w,h,0,0,w,h);
   Object.assign(c,{src:cv.toDataURL('image/png'),w:w/2,h:h/2,cx:240-x0/2,cy:180-y0/2,res:2});}}
 c.ok=false;c._p=loadCostume(c);c._p.then(()=>{const a=$('#cosList').querySelectorAll('.asset')[t.costume];if(a){const old=a.querySelector('canvas');if(old)old.replaceWith(thumbCanvas(c,90,66));}renderSpriteList();});dirty=true;}
function pushUndo(){P.undo.push(P.ctx.getImageData(0,0,960,720));if(P.undo.length>15)P.undo.shift();}
function flood(x,y,col){const img=P.ctx.getImageData(0,0,960,720),d=img.data,W=960,H=720;const i0=(y*W+x)*4;const t=[d[i0],d[i0+1],d[i0+2],d[i0+3]];
 if(Math.abs(t[0]-col[0])<4&&Math.abs(t[1]-col[1])<4&&Math.abs(t[2]-col[2])<4&&t[3]===255)return;
 const m=i=>Math.abs(d[i]-t[0])<=60&&Math.abs(d[i+1]-t[1])<=60&&Math.abs(d[i+2]-t[2])<=60&&Math.abs(d[i+3]-t[3])<=60;const seen=new Uint8Array(W*H);const st=[x,y];
 while(st.length){const py=st.pop(),px=st.pop();if(px<0||py<0||px>=W||py>=H)continue;const p=py*W+px;if(seen[p])continue;seen[p]=1;const i=p*4;if(!m(i))continue;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;st.push(px+1,py,px-1,py,px,py+1,px,py-1);}
 P.ctx.putImageData(img,0,0);}
function initPaint(){P.cv=$('#pc');P.cv.width=960;P.cv.height=720;P.ctx=P.cv.getContext('2d',{willReadFrequently:true});
 document.querySelectorAll('.ptools [data-tool]').forEach(b=>b.onclick=()=>{P.tool=b.dataset.tool;document.querySelectorAll('.ptools [data-tool]').forEach(x=>x.classList.toggle('on',x===b));});
 const pos=e=>{const r=P.cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*960,y:(e.clientY-r.top)/r.height*720};};
 const col=()=>$('#pcColor').value,size=()=>+$('#pcSize').value;
 const shape=(a,b,shift)=>{const x=P.ctx;x.putImageData(P.snap,0,0);let w=b.x-a.x,h=b.y-a.y;if(shift&&P.tool!=='line'){const m=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*m;h=Math.sign(h||1)*m;}
  x.save();x.strokeStyle=x.fillStyle=col();x.lineWidth=size()*2;x.lineCap='round';x.lineJoin='round';x.beginPath();
  if(P.tool==='line'){x.moveTo(a.x,a.y);x.lineTo(a.x+w,a.y+h);x.stroke();}
  else if(P.tool==='rect'){x.rect(a.x,a.y,w,h);$('#pcFill').checked?x.fill():x.stroke();}
  else{x.ellipse(a.x+w/2,a.y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);$('#pcFill').checked?x.fill():x.stroke();}x.restore();};
 P.cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=pos(e),x=P.ctx;
  if(P.tool==='pick'){const d=x.getImageData(p.x|0,p.y|0,1,1).data;if(d[3])$('#pcColor').value=rgbHex(d);return;}
  pushUndo();
  if(P.tool==='fill'){flood(p.x|0,p.y|0,hexRgb(col()));commitPaint();return;}
  if(P.tool==='text'){dialog({title:'Text einfügen',inputs:[{label:'Text',value:''}]}).then(r=>{if(r&&r.values[0]){x.save();x.fillStyle=col();x.font=`bold ${Math.max(16,size()*6)}px Helvetica, Arial, sans-serif`;x.textBaseline='middle';x.fillText(r.values[0],p.x,p.y);x.restore();commitPaint();}else P.undo.pop();});return;}
  P.cv.setPointerCapture(e.pointerId);P.down=true;P.start=p;P.last=p;
  if(P.tool==='brush'||P.tool==='eraser'){x.save();x.globalCompositeOperation=P.tool==='eraser'?'destination-out':'source-over';x.fillStyle=col();x.beginPath();x.arc(p.x,p.y,size(),0,7);x.fill();x.restore();}
  else P.snap=x.getImageData(0,0,960,720);});
 P.cv.addEventListener('pointermove',e=>{if(!P.down)return;const p=pos(e),x=P.ctx;
  if(P.tool==='brush'||P.tool==='eraser'){x.save();x.globalCompositeOperation=P.tool==='eraser'?'destination-out':'source-over';x.strokeStyle=col();x.lineWidth=size()*2;x.lineCap='round';x.beginPath();x.moveTo(P.last.x,P.last.y);x.lineTo(p.x,p.y);x.stroke();x.restore();P.last=p;}
  else shape(P.start,p,e.shiftKey);});
 const up=()=>{if(P.down){P.down=false;P.snap=null;commitPaint();}};P.cv.addEventListener('pointerup',up);P.cv.addEventListener('pointercancel',up);
 $('#pcUndo').onclick=()=>{if(!P.undo.length)return;P.ctx.putImageData(P.undo.pop(),0,0);commitPaint();};
 const flip=(h)=>{pushUndo();const cv=el('canvas');cv.width=960;cv.height=720;const c=cv.getContext('2d');c.translate(h?960:0,h?0:720);c.scale(h?-1:1,h?1:-1);c.drawImage(P.cv,0,0);P.ctx.clearRect(0,0,960,720);P.ctx.drawImage(cv,0,0);commitPaint();};
 $('#pcFlipH').onclick=()=>flip(true);$('#pcFlipV').onclick=()=>flip(false);
 $('#pcClear').onclick=()=>{pushUndo();P.ctx.clearRect(0,0,960,720);if(editing.isStage){P.ctx.fillStyle='#fff';P.ctx.fillRect(0,0,960,720);}commitPaint();};
 $('#pcName').onchange=()=>{const t=editing,c=t.costumes[t.costume];const n=$('#pcName').value.trim();if(!n){$('#pcName').value=c.name;return;}
  const nn=uniqName(n,t.costumes.filter(x=>x!==c).map(x=>x.name));const old=c.name;c.name=nn;$('#pcName').value=nn;
  walkAll(b=>{if((b.op==='looks_costume'&&!t.isStage)||((b.op==='looks_backdrop'||b.op==='event_backdropswitch')&&t.isStage))if(b.args[0]===old)b.args[0]=nn;});renderCostumes();renderPalette();};}

function drawWave(cv,buf){const x=cv.getContext('2d');const W=cv.width,H=cv.height;x.clearRect(0,0,W,H);if(!buf)return;const d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/W));x.strokeStyle='#cf63cf';x.beginPath();

function frameLoop(ts){requestAnimationFrame(frameLoop);if(ts-frameLoop.last<1000/30-2)return;frameLoop.last=ts;
 try{runFrame();}catch(e){console.error(e);}renderScene(stageCtx,R,null,true);updateMonitors();updateAsk();
 const act=new Set();for(const th of RT.threads)if(!th.done&&th.t.def===editing)act.add(th.top.id);document.querySelectorAll('#wsInner .script').forEach(s=>s.classList.toggle('running',act.has(s.dataset.top)));
 $('#flag').classList.toggle('on',RT.threads.length>0);
 if(ts-(frameLoop.info||0)>200){frameLoop.info=ts;updateInfo();const nc=RT.order.filter(o=>o.isClone).length;$('#info2').textContent=nc?nc+' Klon'+(nc===1?'':'e'):'';}}

function help(){dialog({title:'Klötzchenwerk – Kurzanleitung',noCancel:true,html:`<ul>
<li><b>Blöcke ziehen</b> aus der Palette auf die Arbeitsfläche, dort zu Skripten zusammenstecken. Zurück in die Palette ziehen = löschen.</li>
<li><b>Anklicken</b> eines Skripts startet bzw. stoppt es. Ein angeklickter Werteblock zeigt seinen Wert.</li>
<li><b>Rechtsklick</b> auf Blöcke: duplizieren, löschen. Rechtsklick auf die Fläche: aufräumen.</li>
<li>Skripte auf eine andere <b>Figur in der Liste ziehen</b> kopiert sie dorthin.</li>
<li>Figuren lassen sich auf der Bühne mit der Maus verschieben. ⛶ schaltet die Vollbildbühne (Esc beendet).</li>
<li><b>Eigene Blöcke</b> unter „Meine Blöcke“: Parameter in [ ] oder &lt; &gt;. Parameter aus dem „definiere“-Block herausziehen.</li>
<li><b>Als HTML-Seite…</b> speichert eine eigenständige HTML-Datei mit dem Projekt, die beim Öffnen gleich im Vollbild startet – ideal zum Weitergeben. 🖵 schaltet zusätzlich den Browser auf Vollbild.</li>
<li><b>Speichern</b> lädt das Projekt als Scratch-3-Datei (.sb3) herunter. <b>Öffnen</b> lädt Scratch-3-Projekte (.sb3), ältere Scratch-2-Projekte (.sb2) sowie Figuren (.sprite3/.sprite2); man kann sie auch einfach auf die Seite ziehen. Es wird nichts im Browser gespeichert.</li>
<li>Scratch-Blöcke, die Klötzchenwerk nicht kennt, erscheinen grau mit ⚠. Sie tun nichts, bleiben beim Speichern aber erhalten.</li></ul>`});}
