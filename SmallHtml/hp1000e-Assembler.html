<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hp1000e-Assembler2 – HP 1000 E-Serie</title>
<style>
/* Gestaltung: Instrumenten-Look der 21MX-E-Frontplatte – dunkles Gehäuse,
   rote LED-Lampen, helle Tasten, bernsteinfarbene Beschriftung.
   Bewusst einheitlich dunkel (Gerätegehäuse), Schriften aus dem System (offline). */
:root {
  --case: #17191c;       /* Gehäuse */
  --case-2: #202328;     /* Einschübe/Flächen */
  --case-3: #2b2f35;     /* Linien, Felder */
  --ink: #e8e3d4;        /* Beschriftung */
  --dim: #9a968a;        /* Nebenschrift */
  --amber: #e0a43c;      /* Akzent (Frontplatten-Schrift) */
  --led: #ff4a36; --led-off: #3b1c19;
  --key: #d9d6cc; --key-ink: #1b1c1e; --key-dark: #5e6168;
  --phos: #a7f0b1; --phos-bg: #0b120d;
  --ok: #6fcf7f; --warn: #e8b64a; --bad: #ff6b5b;
  --mine: #5aa9ff;
  --f-label: "Helvetica Neue", "Arial Narrow", "Liberation Sans Narrow", Arial, sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", "Menlo", "Consolas", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--case); color: var(--ink); }
body { font: 14px/1.45 var(--f-label); padding-inline: 16px; padding-block: 0 24px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--amber); }
header.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 12px 10px; border-bottom: 1px solid var(--case-3); position: sticky; top: 0; background: var(--case); z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-size: 20px; letter-spacing: .02em; font-stretch: condensed; }
.brand span { color: var(--amber); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.ctrl .stat { font: 12px var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; min-width: 17em; }
.btn { background: var(--case-2); border: 1px solid var(--case-3); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn:focus-visible, .key:focus-visible, .tab:focus-visible, .sw:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn.primary { background: var(--amber); color: #1b1407; border-color: var(--amber); font-weight: 600; }
.btn.small { padding: 2px 7px; font-size: 12px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding-block: 8px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--dim); letter-spacing: .04em; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--amber); }
section.page { display: none; }
section.page.on { display: block; }
h2 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); margin: 18px 0 8px; font-weight: 600; }
h3 { font-size: 14px; margin: 12px 0 6px; }
p.note { color: var(--dim); max-width: 75ch; margin: 4px 0 8px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
@media (max-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--case-2); border: 1px solid var(--case-3); border-radius: 4px; padding: 12px; min-width: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
label.inl { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); font-size: 13px; }
input[type=text], select, textarea { background: #101215; border: 1px solid var(--case-3); border-radius: 3px; padding: 3px 6px; }
input.oct { width: 7.5em; font-family: var(--f-mono); }
.scroll { overflow: auto; max-height: 420px; }
table.t { border-collapse: collapse; font: 12px/1.35 var(--f-mono); width: 100%; }
table.t td, table.t th { padding: 1px 6px; text-align: left; white-space: pre; vertical-align: top; }
table.t th { color: var(--dim); font-weight: normal; border-bottom: 1px solid var(--case-3); position: sticky; top: 0; background: var(--case-2); }
table.t tr.cur td { background: #3a2e14; }
table.t tr.bp td:first-child { color: var(--led); }
table.t tr.bp td:first-child::before { content: "● "; }
table.t tr:hover td { background: #262a30; }
table.t tr.cur:hover td { background: #463719; }
.lbl { color: var(--amber); }
.cmt { color: var(--dim); }
.okc { color: var(--ok); } .badc { color: var(--bad); } .warnc { color: var(--warn); }
.pill { display: inline-block; padding: 0 8px; border-radius: 9px; font-size: 12px; border: 1px solid currentColor; }

/* ---------------- Frontplatte ---------------- */
.panel { background: linear-gradient(#24272b, #1a1c1f); border: 1px solid #3a3e44; border-radius: 6px; padding: 16px 18px 14px; overflow-x: auto; }
.panel .nameplate { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.panel .nameplate b { font-size: 15px; letter-spacing: .08em; }
.panel .nameplate span { color: var(--dim); font-size: 11px; letter-spacing: .2em; }
.reg { display: flex; gap: 14px; align-items: flex-end; min-width: 760px; }
.octgrp { display: flex; gap: 6px; padding: 6px 7px 4px; border-radius: 4px; }
.octgrp.a { background: #2a2d33; } .octgrp.b { background: #33373e; }
.bit { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 30px; }
.bit .n { font: 10px var(--f-mono); color: var(--dim); }
.lamp { width: 12px; height: 12px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 1px 2px #0008; }
.lamp.on { background: var(--led); box-shadow: 0 0 8px var(--led), inset 0 -1px 2px #0005; }
.sw { width: 18px; height: 30px; border-radius: 3px; background: #0d0e10; border: 1px solid #45484e; position: relative; cursor: pointer; padding: 0; }
.sw::after { content: ""; position: absolute; left: 2px; right: 2px; height: 12px; top: 15px; border-radius: 2px; background: var(--key); transition: top .08s; }
.sw.up::after { top: 2px; }
.ind { display: flex; gap: 16px; margin: 14px 0 6px; flex-wrap: wrap; align-items: center; min-width: 760px; }
.ind .il { display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .08em; }
.keys { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-width: 760px; align-items: flex-end; }
.key { min-width: 58px; padding: 7px 8px 6px; background: var(--key); color: var(--key-ink); border: 0; border-radius: 3px; box-shadow: 0 2px 0 #7c7a73, 0 3px 4px #0007; cursor: pointer; font-size: 11px; letter-spacing: .06em; font-weight: 600; }
.key:active, .key.held { transform: translateY(2px); box-shadow: 0 0 0 #7c7a73; }
.key.dark { background: var(--key-dark); color: var(--ink); box-shadow: 0 2px 0 #34363a, 0 3px 4px #0007; }
.key.red { background: #b8352a; color: #fff; box-shadow: 0 2px 0 #6e1f19, 0 3px 4px #0007; }
.key.green { background: #3b7d4a; color: #fff; box-shadow: 0 2px 0 #1f4428, 0 3px 4px #0007; }
.keygrp { display: flex; gap: 6px; padding: 6px; border: 1px solid #3a3e44; border-radius: 4px; position: relative; }
.keygrp > small { position: absolute; top: -9px; left: 8px; background: #1f2125; padding: 0 5px; font-size: 10px; color: var(--dim); letter-spacing: .14em; }
.lock { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }

/* ---------------- Terminal ---------------- */
.term { background: var(--phos-bg); color: var(--phos); font: 13px/1.25 var(--f-mono); border-radius: 6px; padding: 10px 12px; height: 380px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; border: 1px solid #1f3a26; outline: none; }
.term:focus { border-color: var(--phos); box-shadow: 0 0 0 2px rgba(167,240,177,.35); }
.termwrap { position: relative; cursor: text; }
.termhint { position: absolute; right: 10px; top: 8px; font: 11px var(--f-label); color: var(--phos-bg); background: var(--phos); padding: 1px 8px; border-radius: 9px; pointer-events: none; opacity: .85; }
.termroot.focus .termhint { display: none; }
.termfoot { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.termpastebox { margin-top: 8px; }
textarea.src.termpaste { width: 100%; min-height: 160px; height: 200px; margin: 6px 0; }
.termq { font-size: 12px; color: var(--warn); }
.term .cur { background: var(--phos); color: var(--phos-bg); }
.termhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.termgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.termgrid .term { height: 300px; }

/* ---------------- Register-Anzeigen ---------------- */
.regs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px 10px; font: 12px var(--f-mono); }
.regs div { display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px dotted var(--case-3); }
.regs div span:first-child { color: var(--dim); }
.regs .chg span:last-child { color: var(--amber); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.flag { font: 11px var(--f-mono); padding: 0 5px; border: 1px solid var(--case-3); border-radius: 3px; color: var(--dim); }
.flag.on { color: #1b1407; background: var(--amber); border-color: var(--amber); }
textarea.src { width: 100%; min-height: 360px; font: 13px/1.35 var(--f-mono); white-space: pre; tab-size: 8; resize: vertical; }
.ruler { font: 13px var(--f-mono); color: var(--dim); white-space: pre; overflow: hidden; padding-left: 7px; }
ol.guide { padding-left: 1.4em; max-width: 90ch; } ol.guide li { margin: 3px 0; }
pre.out { font: 12px/1.35 var(--f-mono); background: #101215; border: 1px solid var(--case-3); border-radius: 3px; padding: 8px; overflow: auto; max-height: 360px; margin: 6px 0; white-space: pre; }
.memmap { display: grid; grid-template-columns: repeat(64, minmax(0, 1fr)); gap: 1px; margin: 6px 0; }
.memmap div { height: 16px; background: var(--case-3); position: relative; }
.memmap div.flash { outline: 2px solid var(--bad); z-index: 1; }
.cmmap { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; margin: 6px 0; }
.cmmap div { font: 10px var(--f-mono); padding: 2px 3px; background: var(--case-3); border-radius: 2px; white-space: nowrap; overflow: hidden; }
.cmmap div.rom { background: #4a3a1c; color: var(--ink); }
.cmmap div.used { box-shadow: inset 0 -3px 0 var(--amber); }
.cmmap div.flash { outline: 2px solid var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
.t0 { background: #3f7fd9 !important; } .t1 { background: #3fa36a !important; } .t2 { background: #b2663c !important; } .t3 { background: #9b58b6 !important; } .mon { background: #6b6f76 !important; }
ul.plain { margin: 4px 0; padding-left: 18px; }
ul.plain li { margin: 3px 0; max-width: 90ch; }
footer { margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--case-3); color: var(--dim); font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }
.hide { display: none !important; }
@media (prefers-reduced-motion: reduce) { .sw::after { transition: none; } }
</style>
</head>

<header class="top">
  <div class="brand"><b>HP 1000 E-Serie</b><span>21MX-E · mikroprogrammierbar</span></div>

    <button class="btn" id="bSave" title="Speichert diese Seite samt komplettem Maschinenzustand (Speicher, Mikrocode/WCS, Register, E/A, Konsole, Quelltexte) als eigenständige HTML-Datei">Seite mit Zustand sichern</button>
    <button class="btn" id="bSaveJ" title="Kompletten Zustand als JSON-Datei speichern (z. B. zum Weitergeben oder Analysieren)">Zustand als JSON</button>
    <button class="btn" id="bLoadJ" title="Zustand aus einer JSON-Datei in diese Seite laden">JSON laden</button>
  </div>
</header>

  // =================== SEITE MIT ZUSTAND SICHERN ===================
  const UIP = {};   // Texte für noch nicht aufgebaute Reiter
  function u8ToB64(u) { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  function b64ToU8(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function collectState() {
    const m = EMU.m; const val = (id, k) => { const e = $('#' + id); return e ? e.value : UIP[k]; };
    return {
      v: 1, saved: new Date().toISOString(),
      cpu: m.cpu.snapshot(), bus: m.bus.snapshot(), panel: m.panel.snapshot(),
      running: EMU.running, speed: EMU.speed, tab: current ? current.id : 'front',
      term: consoleTerm.snapshot(), romNames: romNames.slice(0, 4),
      devs: { ptr: EMU.m.ptr.sc, ptp: EMU.m.ptp.sc, tbg: EMU.m.tbg.sc },
      tapes: EMU.tapes.map(t => ({ name: t.name, b64: u8ToB64(t.data) })),
      wcsSrc: [...wcsSrc], wcsLabel: [...wcsLabelOf],
      ui: { isrc: val('isrc', 'isrc'), msrc: val('msrc', 'msrc'), mloadat: val('mloadat', 'mloadat') },
      multi: EMU.multi && EMU.multi.active ? EMU.multi.snapshot() : null
    };
  }
  function savePage() {
    const def = (SAVED && SAVED.name) || 'hp1000e-zustand';
    let name = prompt('Name der gesicherten Seite (wird zum Dateinamen):', def);
    if (name === null) return; name = name.trim().replace(/\.html?$/i, '') || def;
    const st = collectState(); st.name = name;
    const json = JSON.stringify(st).replace(/</g, '\\u003c');
    const i = PRISTINE.indexOf('<script>');
    let html = PRISTINE.slice(0, i) + '<script type="application/json" ' + 'id="hp-state">' + json + '<\/script>\n' + PRISTINE.slice(i);
    html = html.replace(/<title>[^<]*<\/title>/, '<title>' + esc(name) + ' – HP 1000 E-Serie</title>');
    download(name.replace(/[\\/:*?"<>|]+/g, '_') + '.html', html, 'text/html');
    msg('Seite „' + name + '.html“ mit dem kompletten Maschinenzustand gespeichert (' + Math.round(html.length / 1024) + ' KB).');
  }
  function restoreState(S) {
    const m = EMU.m;
    m.cpu.restore(S.cpu); m.panel.restore(S.panel);
    applyDevs(S.devs || DEVCFG.std);
    if (S.tapes) { EMU.tapes = S.tapes.map(t => ({ name: t.name, data: b64ToU8(t.b64) })); if (EMU.refreshTapeSel) EMU.refreshTapeSel(); }
    for (let i = 0; i < 4; i++) { romWords[i] = m.cpu.ldr[i]; romNames[i] = (S.romNames || [])[i]; }
    for (const [a, v] of S.wcsSrc || []) wcsSrc.set(a, v);
    for (const [a, v] of S.wcsLabel || []) wcsLabelOf.set(a, v);
    consoleTerm.restore(S.term);
    Object.assign(UIP, S.ui || {});
    if (S.multi) { const pg = pages.find(p => p.id === 'multi'); if (!pg.built) { pg.build(pg.sec); pg.built = true; } EMU.multi.start(S.multi.n, S.multi); }
    m.bus.restore(S.bus);
    EMU.speed = S.speed || 0; $('#speed').value = String(EMU.speed);
    setRunning(!!S.running);
  }
  $('#bSave').addEventListener('click', savePage);
  // Zustand als JSON (zum Weitergeben/Mitdebuggen) und Laden in die laufende Seite
  function saveJSON() {
    const st = collectState(); const c = EMU.m.cpu;
    st.summary = { hinweis: 'HP-1000-E-Emulator, Zustand; Werte oktal', zeit_s: (c.time / 1e9).toFixed(6), RUN: c.RUN, CMAR: o(c.cmar, 5),
      P: o(c.P), A: o(c.A), B: o(c.B), X: o(c.X), Y: o(c.Y), E: c.E, O: c.O, M: o(c.M), T: o(c.T), S: o(c.S), IR: o(c.IR), IE: c.IE,
      befehl_bei_P: HP.dis(c.mem[c.P & 0x7fff], c.P & 0x7fff, c.mem).text, meldung: EMU.lastMsg };
    const d = new Date(), z = n => String(n).padStart(2, '0');
    download(`hp1000e-zustand-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.json`, JSON.stringify(st, null, 1), 'application/json');
    msg('Zustand als JSON gespeichert.');
  }
  function loadJSON(data, name) {
    let S; try { S = JSON.parse(new TextDecoder().decode(data)); } catch (e) { msg('JSON-Datei „' + name + '“ nicht lesbar: ' + e.message); return; }
    if (!S || !S.cpu || !S.bus) { msg('„' + name + '“ ist kein Emulatorzustand.'); return; }
    try {
      if (EMU.multi && EMU.multi.active) EMU.multi.stopQuiet();
      EMU.lockstep = null; const ls = $('#lsref'); if (ls) ls.checked = false;
      wcsSrc.clear(); wcsLabelOf.clear();
      restoreState(S); applyUI();
      msg('Zustand aus „' + name + '“ geladen (gesichert ' + new Date(S.saved).toLocaleString('de-DE') + ').');
      refreshAll(true);
    } catch (e) { console.error(e); msg('Laden fehlgeschlagen: ' + e.message); }
  }
  // Alles auf Anfang: wie eine frisch geöffnete hp1000e.html (auf Wunsch ROMs und Streifensammlung behalten)
  function resetAll() {
    if (!confirm('Alles zurücksetzen?\n\nSpeicher, Mikroprogramme im WCS, Register, Konsole, Stanzer, Leser, Haltepunkte, Quelltexte und Gerätebelegung werden auf den Anfangszustand gesetzt. Danach läuft der Kaltstart.')) return;
    const keep = confirm('Loader-ROMs und Streifensammlung behalten?\n\nOK = behalten, Abbrechen = ebenfalls löschen');
    const m = EMU.m, c = m.cpu;
    if (EMU.multi && EMU.multi.active) EMU.multi.stopQuiet();
    EMU.lockstep = null; const ls = $('#lsref'); if (ls) ls.checked = false;
    for (let a = 0o2000; a < 16384; a++) c.writeCM(a, 0, true);
    loadBase(c); for (let a = 0o2000; a < 16384; a++) c.cmWritable[a] = 1;
    wcsSrc.clear(); wcsLabelOf.clear(); c.bpMicro.fill(0); c.bpInstr.clear();
    if (!keep) { for (let i = 0; i < 4; i++) { romWords[i] = null; romNames[i] = undefined; c.ldr[i] = null; } EMU.tapes = []; }
    applyDevs(DEVCFG.std);
    m.ptr.load(new Uint8Array(0)); m.ptr.fname = ''; m.ptp.out = [];
    m.panel.operate = true; m.panel.des = 0xffff;
    c.mem.fill(0); c.powerOn(true);
    consoleTerm.lines = ['']; consoleTerm.col = 0; consoleTerm.dirty = true;
    delete UIP.isrc; delete UIP.msrc; delete UIP.mloadat;
    const is = $('#isrc'); if (is) is.value = EXAMPLES.macro['Shell-Sort per Mikroprogramm (OCT 105600)'];
    const ms = $('#msrc'); if (ms) ms.value = EXAMPLES.micro[Object.keys(EXAMPLES.micro)[0]];
    const la = $('#mloadat'); if (la) la.value = '';
    for (const id of ['mlst', 'merrs', 'iout']) { const e = $('#' + id); if (e) e.textContent = ''; }
    if (EMU.refreshTapeSel) EMU.refreshTapeSel();
    applyUI(); setRunning(true); refreshAll(true);
    msg('Alles zurückgesetzt' + (keep ? ' (Loader-ROMs und Streifensammlung behalten)' : '') + '. Kaltstart: Speichertest des Mikrocodes läuft …');
  }
  $('#bReset').addEventListener('click', resetAll);
  function applyUI() {
    const set = (id, v) => { const e = $('#' + id); if (e && v !== undefined) e.value = v; };
    set('isrc', UIP.isrc); set('msrc', UIP.msrc); set('mloadat', UIP.mloadat);
    const p = EMU.m.panel; const lk = $('#lockop'); if (lk) lk.checked = p.operate;
    [15, 14, 10, 9, 8, 7, 6, 0].forEach((b, i) => { const cb = $('#des' + i); if (cb) cb.checked = !!((p.des >>> b) & 1); });
    for (let i = 0; i < 4; i++) { const inf = $('#rominfo' + i); if (inf) inf.textContent = romWords[i] ? (romNames[i] ? romNames[i] + ' · ' : '') + '1. Wort ' + o(romWords[i][0]) : 'leer'; }
    if (EMU.updPT) EMU.updPT(); lastPanelState = '';
  }
  const jsonIn = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none', onchange: e => readFile(e.target, loadJSON) });
  document.body.append(jsonIn);
  $('#bSaveJ').addEventListener('click', saveJSON);
  $('#bLoadJ').addEventListener('click', () => jsonIn.click());

  addPage('front', 'Frontplatte', buildFront, null);
  addPage('micro', 'Mikro-Debugger', buildMicro, refreshMicro);
  addPage('instr', 'Befehls-Debugger', buildInstr, refreshInstr);
  addPage('masm', 'Mikroassembler', buildMasm, refreshMasm);
  addPage('report', 'Prüfbericht Anhang G', buildReport, null);
  addPage('tests', 'Selbsttests', buildTests, null);
  addPage('multi', 'Mehrplatzbetrieb', buildMulti, () => { if (EMU.multi) EMU.multi.refresh(); });
  addPage('info', 'Info & Annahmen', buildInfo, null);
  let restoredMsg = '';
  if (SAVED) {
    try { restoreState(SAVED); restoredMsg = 'Gesicherter Zustand „' + (SAVED.name || '') + '“ vom ' + new Date(SAVED.saved).toLocaleString('de-DE') + ' wiederhergestellt' + (SAVED.running ? ' – die Maschine läuft weiter.' : ' (angehalten; „Weiter“ setzt fort).'); }
    catch (e) { console.error(e); restoredMsg = 'Gesicherter Zustand konnte nicht wiederhergestellt werden: ' + e.message; }
  }
  const start = SAVED && SAVED.tab ? SAVED.tab : (location.hash || '').replace('#', '');
  show(pages.some(p => p.id === start) ? start : 'front');
  if (restoredMsg) msg(restoredMsg);
  window.EMU = EMU; window.createMachine = createMachine;
  requestAnimationFrame(loop);
})();
