    ov.classList.remove('hidden');
    ov.innerHTML = '';
    const box = el('div', 'setup');

    const hero = el('div', 'hero');
    hero.appendChild(el('div', 'eyebrow', 'Programmierte Roboter, unprogrammierte Folgen'));
    hero.appendChild(el('h1', '', 'Robotfabrik'));
    hero.appendChild(el('p', 'lede', 'Fünf Befehle im Voraus. Danach entscheiden Förderbänder, Pressen und die anderen, wo du wirklich landest.'));
    box.appendChild(hero);

    /* Regelwerk */
    const s0 = this.section(box, 'Regelwerk');
    const rl = el('div', 'chips');
    for (const [v, t, d] of [
      ['classic', 'Grundspiel', 'Gemeinsames Kartendeck, Schadensmarker, drei Leben, Optionskarten von Werkbänken.'],
      ['modern', 'Neuauflage', 'Eigenes Deck je Roboter, Schadenskarten im Deck, Energie und Upgrade-Laden, Prioritätsantenne.']
    ]) {
      const c = el('button', 'chip-btn' + (this.rules === v ? ' on' : ''), t);
      c.title = d;
      c.onclick = () => {
        this.rules = v;
        if (v === 'modern' && this.players.length > 6) this.players.length = 6;
        const list = this.boardList();
        if (!list.some(b => b.i === this.boardIdx)) this.boardIdx = list.length ? list[0].i : 0;
        this.flags = Math.min(this.flags, countFlags(this.getBoard(this.boardIdx)));
        this.show();
      };
      rl.appendChild(c);
    }
    s0.appendChild(rl);
    s0.appendChild(el('p', 'dim', this.rules === 'classic'
      ? 'Neun Karten pro Runde, abzüglich einer je Schadenspunkt. Ab fünf Schaden frieren Register ein, bei zehn ist der Roboter Schrott. Drei Leben.'
      : 'Jeder Roboter hat ein eigenes Deck aus 20 Karten. Schaden kommt als SPAM-, VIRUS-, TROJANER- und WURM-Karte ins Deck und verstopft künftige Hände. Statt Zerstörung gibt es Reboot.'));

    /* Kurs */
    const s1 = this.section(box, 'Kurs');
    const bl = el('div', 'chips');
    this.boardList().forEach(b => {
      const c = el('button', 'chip-btn' + (b.i === this.boardIdx ? ' on' : ''), b.name);
      c.onclick = () => { this.boardIdx = b.i; this.show(); };
      bl.appendChild(c);
    });
    s1.appendChild(bl);

    const fl = el('div', 'chips');
    fl.appendChild(el('span', 'lbl', 'Flaggen'));
    const maxF = countFlags(this.getBoard(this.boardIdx));
    for (let n = 1; n <= maxF; n++) {
      const c = el('button', 'chip-btn sm' + (n === this.flags ? ' on' : ''), String(n));
      c.onclick = () => { this.flags = n; this.show(); };
      fl.appendChild(c);
    }
    s1.appendChild(fl);

    /* Spieler */
    const s2 = this.section(box, 'Roboter');
    const list = el('div', 'plist');
    this.players.forEach((p, i) => {
      const row = el('div', 'prow');
      row.style.setProperty('--rc', ROBOT_COLORS[i][0]);
      row.appendChild(el('span', 'chip'));
      const nm = el('input', 'nin'); nm.value = p.name;
      nm.oninput = () => { p.name = nm.value || ROBOT_COLORS[i][1]; };
      row.appendChild(nm);
      const kind = el('select', 'sel');
      for (const [v, t] of [['h', 'Mensch'], ['b', 'Bot']]) {
        const o = el('option', '', t); o.value = v; kind.appendChild(o);
      }
      kind.value = p.bot ? 'b' : 'h';
      kind.onchange = () => { p.bot = kind.value === 'b'; this.show(); };
      row.appendChild(kind);
      if (p.bot) {
        const lv = el('select', 'sel');
        for (const [v, t] of [[1, 'nachlässig'], [2, 'solide'], [3, 'gnadenlos']]) {
          const o = el('option', '', t); o.value = v; lv.appendChild(o);
        }
        lv.value = String(p.level);
        lv.onchange = () => { p.level = parseInt(lv.value, 10); };
        row.appendChild(lv);
      }
      if (this.players.length > 2) {
        const del = el('button', 'x', '×');
        del.onclick = () => { this.players.splice(i, 1); this.show(); };
        row.appendChild(del);
      }
      list.appendChild(row);
    });
    s2.appendChild(list);
    const maxP = this.rules === 'modern' ? 6 : 8;
    if (this.players.length > maxP) this.players.length = maxP;
    if (this.players.length < maxP) {
      const add = el('button', 'ghost', '+ Roboter');
      add.onclick = () => {
        const i = this.players.length;
        this.players.push({ name: ROBOT_COLORS[i][1], bot: true, level: 2 });
        this.show();
      };
      s2.appendChild(add);
    }

    /* Regeln */
    const s3 = this.section(box, 'Regeln');
    const opt = el('label', 'toggle');
    const oc = el('input'); oc.type = 'checkbox'; oc.checked = this.options;
    oc.onchange = () => { this.options = oc.checked; };
    opt.appendChild(oc);
    opt.appendChild(el('span', '', this.rules === 'classic' ? 'Optionskarten (alle 26)' : 'Upgradekarten und Laden (alle 40)'));
    s3.appendChild(opt);
    const sd = el('label', 'toggle');
    const si = el('input', 'nin'); si.placeholder = 'zufällig'; si.value = this.seed;
    si.oninput = () => { this.seed = si.value; };
    sd.appendChild(el('span', '', 'Seed')); sd.appendChild(si);
    sd.title = 'Gleicher Seed und gleiche Züge ergeben denselben Spielverlauf';
    s3.appendChild(sd);


    /* Start */
    const foot = el('div', 'sfoot');
    const go = el('button', 'go big', 'Rennen starten');
    go.onclick = () => {
      App.cfg = {
        boardIdx: this.boardIdx, flags: this.flags, options: this.options, rules: this.rules,
        seed: this.seed ? (parseInt(this.seed, 10) || hashStr(this.seed)) : 0,
        players: this.players.map(p => ({ ...p }))
      };
      App.cfg.getBoard = () => this.getBoard(this.boardIdx);
      App.start();
    };
    foot.appendChild(go);
    const ed = el('button', 'ghost', 'Board-Editor');
    ed.onclick = () => Editor.show();
    foot.appendChild(ed);
    const tst = el('button', 'ghost', 'Selbsttest');
    tst.onclick = () => showTestReport();
    foot.appendChild(tst);
    box.appendChild(foot);

    const help = el('details', 'help');
    help.appendChild(el('summary', '', 'Wie das Spiel läuft'));
    const ul = el('div', 'helpbody');
    ul.innerHTML = this.rules === 'classic'
      ? `<p>Jede Runde bekommst du neun Programmkarten, abzüglich einer je Schadenspunkt. Fünf davon legst du in die Register 1 bis 5. Danach hast du keine Kontrolle mehr.</p>
      <p>Die fünf Register werden nacheinander abgearbeitet. In jedem Register gilt: alle Karten nach Priorität ausführen, dann Expressbänder, dann alle Bänder, dann Schieber, Zahnräder und Pressen, dann Laser, zuletzt Flaggen berühren.</p>
      <p>Flaggen müssen in der Reihenfolge ihrer Nummern berührt werden. Wer alle hat, gewinnt.</p>`
      : `<p>Jeder Roboter hat sein eigenes Deck aus 20 Karten und zieht daraus neun pro Runde. Fünf davon legst du in die Register 1 bis 5.</p>
      <p>Wer zuerst dran ist, entscheidet die Prioritätsantenne: der nächstgelegene Roboter zuerst, bei gleichem Abstand im Uhrzeigersinn.</p>
      <p>Schaden kommt als Karte in deinen Ablagestapel und taucht später in deiner Hand wieder auf. SPAM zieht eine Ersatzkarte, TROJANER bringt zwei weitere SPAM, VIRUS steckt alles im Umkreis von sechs Feldern an, WURM startet dich neu.</p>
      <p>Auf Energiefeldern sammelst du Energie und kaufst damit vor jeder Runde ein Upgrade aus dem Laden — höchstens drei permanente und drei temporäre gleichzeitig.</p>
      <p>Reihenfolge im Register: Karten, blaue Bänder (zwei Felder), grüne Bänder, Schieber, Zahnräder, Boardlaser, Roboterlaser, Energiefelder, Flaggen.</p>`;
    help.appendChild(ul);
    box.appendChild(help);

    ov.appendChild(box);
  },
  section(parent, title) {
    const s = el('section', 'sec');
    s.appendChild(el('h3', '', title));
    parent.appendChild(s);
    return s;
  }
};
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 1;
}

/* ============================================================================
   BOARD-EDITOR
   ========================================================================= */
const Editor = {
  board: null, tool: 'wall', view: null, hover: null,
  TOOLS: [
    ['wall', 'Wand'], ['oneway', 'Einwegwand'], ['erase', 'Löschen'],
    ['cv_n', 'Band ↑'], ['cv_e', 'Band →'], ['cv_s', 'Band ↓'], ['cv_w', 'Band ←'],
    ['xv_n', 'Express ↑'], ['xv_e', 'Express →'], ['xv_s', 'Express ↓'], ['xv_w', 'Express ←'],
    ['gear_r', 'Zahnrad ↻'], ['gear_l', 'Zahnrad ↺'],
    ['push_n', 'Schieber ↑'], ['push_e', 'Schieber →'], ['push_s', 'Schieber ↓'], ['push_w', 'Schieber ←'],
    ['laser_n', 'Laser ↑'], ['laser_e', 'Laser →'], ['laser_s', 'Laser ↓'], ['laser_w', 'Laser ←'],
    ['pit', 'Grube'], ['trap', 'Fallgrube'], ['crush', 'Presse'], ['flame', 'Flamme'],
    ['oil', 'Öl'], ['water', 'Wasser'], ['radiation', 'Strahlung'],
    ['repair', 'Reparatur'], ['upgrade', 'Werkbank'], ['tele', 'Teleporter'],
    ['portal1', 'Portal grün'], ['portal2', 'Portal orange'],
    ['flag', 'Flagge'], ['start', 'Startplatz'],
    ['energy', 'Energiefeld'], ['antenna', 'Antenne'],
    ['respawn_n', 'Reboot ↑'], ['respawn_e', 'Reboot →'], ['respawn_s', 'Reboot ↓'], ['respawn_w', 'Reboot ←']
  ],

  show(board) {
    App.mode = 'editor';
    this.board = board || emptyBoard(12, 12, 'Eigener Kurs');
    $('#app').classList.add('hidden');
    const ov = $('#overlay');
    ov.classList.remove('hidden');
    ov.innerHTML = '';
    const box = el('div', 'editor');

    const head = el('div', 'ehead');
    const nm = el('input', 'nin'); nm.value = this.board.name;
    nm.oninput = () => { this.board.name = nm.value; };
    head.appendChild(el('span', 'lbl', 'Name'));
    head.appendChild(nm);
    for (const [w, h] of [[12, 12], [12, 16], [16, 16]]) {
      const b = el('button', 'chip-btn sm' + (this.board.w === w && this.board.h === h ? ' on' : ''), w + '×' + h);
      b.onclick = () => { this.resize(w, h); this.show(this.board); };
      head.appendChild(b);
    }
    const back = el('button', 'ghost', '← Zurück');
    back.onclick = () => Setup.show();
    head.appendChild(back);
    box.appendChild(head);

    const main = el('div', 'emain');
    const pal = el('div', 'pal');
    for (const [id, label] of this.TOOLS) {
      const b = el('button', 'tool' + (this.tool === id ? ' on' : ''), label);
      b.onclick = () => { this.tool = id; this.show(this.board); };
      pal.appendChild(b);
    }
    main.appendChild(pal);

    const cw2 = el('div', 'ecanvas');
    const cv = el('canvas'); cv.id = 'edboard';
    cw2.appendChild(cv);
    main.appendChild(cw2);
    box.appendChild(main);

    const foot = el('div', 'efoot');
    const hint = el('div', 'hint', 'Wände: an den Feldrand klicken. Phasenelemente wiederholt anklicken schaltet die Phasen weiter. Löschen leert das Feld.');
    foot.appendChild(hint);
    const ta = el('textarea', 'json'); ta.id = 'edjson';
    ta.spellcheck = false;
    foot.appendChild(ta);
    const brow = el('div', 'brow');
    const exp = el('button', 'ghost', 'Als JSON zeigen');
    exp.onclick = () => { ta.value = JSON.stringify(this.board); };
    const imp = el('button', 'ghost', 'JSON übernehmen');
    imp.onclick = () => {
      try {
        const b2 = JSON.parse(ta.value);
        if (!b2.w || !b2.h || !Array.isArray(b2.cells)) throw new Error('Feld w, h oder cells fehlt');
        this.board = b2; this.show(this.board);
      } catch (e) { hint.textContent = 'JSON nicht lesbar: ' + e.message; hint.classList.add('err'); }
    };
    const save = el('button', 'go', 'Kurs übernehmen');
    save.onclick = () => {
      const err = this.validate();
      if (err) { hint.textContent = err; hint.classList.add('err'); return; }
      Setup.customBoards.push(JSON.parse(JSON.stringify(this.board)));
      Setup.boardIdx = 1000 + Setup.customBoards.length - 1;
      Setup.flags = Math.min(Setup.flags, countFlags(this.board));
      Setup.show();
    };
    brow.appendChild(exp); brow.appendChild(imp); brow.appendChild(save);
    foot.appendChild(brow);
    box.appendChild(foot);
    ov.appendChild(box);

    this.view = new BoardView(cv);
    this.view.fit(this.board, Math.min(640, window.innerWidth - 260), window.innerHeight - 300);
    const fake = { board: this.board, robots: [] };
    const paint = e => {
      const rect = cv.getBoundingClientRect();
      const cs = this.view.cell;
      const fx = (e.clientX - rect.left) / cs, fy = (e.clientY - rect.top) / cs;
      const x = Math.floor(fx), y = Math.floor(fy);
      if (!inBounds(this.board, x, y)) return;
      this.apply(x, y, fx - x, fy - y);
      this.view.draw(fake, { showStarts: true, cursor: [x, y] });
    };
    cv.onclick = paint;
    cv.onmousemove = e => {
      const rect = cv.getBoundingClientRect();
      const cs = this.view.cell;
      const x = Math.floor((e.clientX - rect.left) / cs), y = Math.floor((e.clientY - rect.top) / cs);
      if (inBounds(this.board, x, y)) this.view.draw(fake, { showStarts: true, cursor: [x, y] });
    };
    this.view.draw(fake, { showStarts: true });
  },
  resize(w, h) {
    const nb = emptyBoard(w, h, this.board.name);
    for (let y = 0; y < Math.min(h, this.board.h); y++)
      for (let x = 0; x < Math.min(w, this.board.w); x++)
        nb.cells[y * w + x] = this.board.cells[y * this.board.w + x];
    this.board = nb;
  },
  /* Naechstliegende Kante bestimmen (fx, fy sind Bruchteile innerhalb der Zelle) */
  edge(fx, fy) {
    const d = [fy, 1 - fx, 1 - fy, fx];
    let best = 0;
    for (let i = 1; i < 4; i++) if (d[i] < d[best]) best = i;
    return d[best] < 0.28 ? best : -1;
  },
  cyclePhases(cur) {
    const seq = [[1, 3, 5], [2, 4], [1, 4], [2, 5], [3], null];
    const i = seq.findIndex(s => JSON.stringify(s) === JSON.stringify(cur || null));
    return seq[(i + 1) % seq.length];
  },
  apply(x, y, fx, fy) {
    const c = cellAt(this.board, x, y);
    const t = this.tool;
    if (t === 'wall' || t === 'oneway') {
      const d = this.edge(fx, fy);
      if (d < 0) return;
      const key = t === 'wall' ? 'w' : 'ow';
      c[key] = (c[key] || 0) ^ WBIT[d];
      if (!c[key]) delete c[key];
      return;
    }
    if (t === 'erase') { for (const k of Object.keys(c)) delete c[k]; return; }
    if (t.startsWith('cv_') || t.startsWith('xv_')) {
      const d = 'nesw'.indexOf(t[3]);
      c.cv = { d, x: t[0] === 'x' };
      delete c.t; return;
    }
    if (t.startsWith('gear_')) { c.gear = t.endsWith('r') ? 1 : -1; return; }
    if (t.startsWith('push_')) {
      const d = 'nesw'.indexOf(t[5]);
      c.push = c.push && c.push.d === d ? { d, phases: this.cyclePhases(c.push.phases) } : { d, phases: [1, 3, 5] };
      if (!c.push.phases) delete c.push;
      return;
    }
    if (t.startsWith('laser_')) {
      const d = 'nesw'.indexOf(t[6]);
      if (c.laser && c.laser.d === d) c.laser.n = c.laser.n >= 3 ? (delete c.laser, 0) : c.laser.n + 1;
      else c.laser = { d, n: 1 };
      return;
    }
    if (t === 'trap' || t === 'crush' || t === 'flame') {
      const key = t === 'crush' ? 'crush' : t === 'trap' ? 'trap' : 'flame';
      c[key] = this.cyclePhases(c[key]);
      if (!c[key]) delete c[key];
      return;
    }
    if (t === 'tele') { c.tele = !c.tele; if (!c.tele) delete c.tele; return; }
    if (t === 'portal1' || t === 'portal2') {
      const id = t === 'portal1' ? 1 : 2;
      if (c.portal === id) delete c.portal; else c.portal = id;
      return;
    }
    if (t === 'energy') { c.energy = !c.energy; if (!c.energy) delete c.energy; return; }
    if (t === 'antenna') { c.antenna = !c.antenna; if (!c.antenna) delete c.antenna; return; }
    if (t.startsWith('respawn_')) {
      const d = 'nesw'.indexOf(t[8]);
      if (c.respawn && c.respawn.d === d) delete c.respawn; else c.respawn = { d };
      return;
    }
    if (t === 'flag') { c.flag = (c.flag || 0) + 1; if (c.flag > 8) delete c.flag; return; }
    if (t === 'start') { c.start = (c.start || 0) + 1; if (c.start > 8) delete c.start; return; }
    // Untergrund
    if (c.t === t) delete c.t; else { c.t = t; delete c.cv; }
  },
  validate() {
    const b = this.board;
    const n = countFlags(b);
    if (n < 1) return 'Der Kurs braucht mindestens eine Flagge.';
    const nums = new Set();
    for (const c of b.cells) if (c.flag) { if (nums.has(c.flag)) return 'Flagge ' + c.flag + ' kommt doppelt vor.'; nums.add(c.flag); }
    for (let i = 1; i <= n; i++) if (!nums.has(i)) return 'Flagge ' + i + ' fehlt — die Nummern müssen lückenlos sein.';
    const sp = startPositions(b).filter(s => cellAt(b, s.x, s.y).start);
    if (sp.length < 2) return 'Der Kurs braucht mindestens zwei Startplätze.';
    for (let f = 1; f <= n; f++) {
      const [fx, fy] = flagPos(b, f);
      const df = distField(b, fx, fy);
      for (const s of sp)
        if (df[s.y * b.w + s.x] >= 9999)
          return 'Flagge ' + f + ' ist von Startplatz ' + s.n + ' aus nicht erreichbar.';
    }
    for (const c of b.cells) if (c.t === 'pit' && c.flag) return 'Eine Flagge liegt auf einer Grube.';
    return null;
  }
};

/* --- Selbsttestbericht --------------------------------------------------- */
async function showTestReport() {
  const ov = $('#overlay');
  ov.classList.remove('hidden');
  ov.innerHTML = '';
  const box = el('div', 'setup');
  box.appendChild(el('h1', '', 'Selbsttest'));
  const out = el('div', 'testout', 'läuft …');
  box.appendChild(out);
  const back = el('button', 'ghost', '← Zurück');
  back.onclick = () => Setup.show();
  box.appendChild(back);
  ov.appendChild(box);
  await new Promise(r => setTimeout(r, 30));
  const t0 = performance.now();
  const res = await runTests();
  out.innerHTML = '';
  for (const [s, n, m] of res.lines) {
    const d = el('div', 'tline ' + s);
    d.appendChild(el('span', 'mark', s === 'ok' ? '✓' : '✕'));
    d.appendChild(el('span', 'nm', n));
    if (m) d.appendChild(el('span', 'msg', m));
    out.appendChild(d);
  }
  const sum = el('div', 'tsum' + (res.fail ? ' bad' : ''),
    res.pass + ' bestanden, ' + res.fail + ' fehlgeschlagen · ' + Math.round(performance.now() - t0) + ' ms');
  out.insertBefore(sum, out.firstChild);
}
/* ============================================================================
   START
   ========================================================================= */
window.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search);
  if (q.get('test') === '1') { showTestReport(); return; }
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (h.get('seed')) Setup.seed = h.get('seed');
  Setup.show();
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (App.mode === 'play' && App.st) App.layout(); }, 120);
  });
  document.addEventListener('keydown', e => {
    if (App.mode !== 'play') return;
    if (e.key === ' ') { e.preventDefault(); const b = document.querySelector('#btn-pause'); if (b) b.click(); }
    if (e.key === 'ArrowRight') { const b = document.querySelector('#btn-step'); if (b) b.click(); }
  });
});
