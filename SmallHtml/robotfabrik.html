const UPG_IDS = Object.keys(UPGRADES);
const MAX_PERM = 3, MAX_TEMP = 3;

function buildUpgradeDeck() { return UPG_IDS.slice(); }
function hasUpg(r, id) {
  if (!r || !r.upgrades) return null;
  return r.upgrades.find(u => u.id === id && UPGRADES[id].kind === 'perm') || null;
}
function heldTemp(r) { return r.upgrades.filter(u => UPGRADES[u.id].kind === 'temp'); }
function heldPerm(r) { return r.upgrades.filter(u => UPGRADES[u.id].kind === 'perm'); }

async function installUpgrade(st, r, id, io) {
  const perm = UPGRADES[id].kind === 'perm';
  const list = perm ? heldPerm(r) : heldTemp(r);
  const max = perm ? MAX_PERM : MAX_TEMP;
  if (list.length >= max) {
    const drop = await io.choose(r, 'dropUpgrade', { ids: list.map(u => u.id), incoming: id });
    const i = r.upgrades.findIndex(u => u.id === drop);
    if (i >= 0) { st.upgDisc.push(drop); r.upgrades.splice(i, 1); }
    else { st.upgDisc.push(id); return; }              // nichts abgelegt: Kauf verfällt
  }
  r.upgrades.push({ id });
  await io.emit({ t: 'upgGain', r: r.id, id });
}
function discardUpgrade(st, r, id) {
  const i = r.upgrades.findIndex(u => u.id === id);
  if (i >= 0) { st.upgDisc.push(id); r.upgrades.splice(i, 1); }
}

/* --- Temporäre Karte einsetzen ------------------------------------------ */
async function useTemp(st, r, id, io) {
  const reg = st.register;
  switch (id) {
    case 'jumper': {
      const d = await io.choose(r, 'anyDir', { def: r.dir, prompt: 'In welche Richtung springen?' });
      const keep = r.dir;
      await stepMove(st, r, d, 'card', io);
      r.dir = keep;
      break;
    }
    case 'rotation':
      r.dir = await io.choose(r, 'anyDir', { def: r.dir, prompt: 'In welche Richtung drehen?' });
      await io.emit({ t: 'rotate', r: r.id, from: r.dir, to: r.dir, cause: 'card' });
      break;
    case 'reboot_t': {
      const fw = hasUpg(r, 'firewall');
      if (!fw) r.upgrades.push({ id: 'firewall', temp: true });   // dieser Reboot bleibt schadenfrei
      await rebootRobot(st, r, io, 'Reboot-Karte');
      if (!fw) r.upgrades.splice(r.upgrades.findIndex(u => u.temp), 1);
      break;
    }
    case 'speichertausch': {
      for (let i = 0; i < 3; i++) r.hand.push(drawFrom(st, r));
      const pick = await io.choose(r, 'pickCards', { n: 3, prompt: 'Drei Karten oben aufs Deck legen' });
      for (const idx of (pick || []).slice().sort((a, b) => b - a)) {
        const c = r.hand.splice(idx, 1)[0];
        if (c) r.deck.push(c);
      }
      break;
    }
    case 'hacker':
      if (reg >= 1 && r.regs[reg - 1]) await mResolve(st, r, r.regs[reg - 1].c, reg, io, 1);
      break;
    case 'update':
      for (const c of r.hand) binCard(st, r, c);
      r.hand = [];
      for (let i = 0; i < 9 + (hasUpg(r, 'memory_stick') ? 1 : 0); i++) r.hand.push(drawFrom(st, r));
      break;
    case 'aufladung':
      r.energy += 3;
      await io.emit({ t: 'energy', r: r.id, n: r.energy, gain: 3 });
      break;
    case 'spam_blocker': {
      let n = 0;
      for (let i = 0; i < r.hand.length; i++)
        if (r.hand[i].t === 'spam') { st.piles.spam++; r.hand[i] = drawFrom(st, r); n++; }
      await io.emit({ t: 'note', r: r.id, msg: n + ' SPAM-Karten ersetzt' });
      break;
    }
    case 'manuelle_kontrolle':
      r.claimPriority = st.turn * 10 + reg;
      await io.emit({ t: 'note', r: r.id, msg: 'übernimmt die Priorität' });
      break;
    case 'register_refresh': {
      const t = await io.choose(r, 'sandbox', { extra: true });
      if (t && r.regs[reg - 1]) { binCard(st, r, r.regs[reg - 1].c); r.regs[reg - 1] = { c: { t }, sub: null, mode: null }; }
      break;
    }
    default: {
      const rt = UPGRADES[id].routine;
      if (rt && st.special[rt] > 0) {
        st.special[rt]--;
        r.disc.push({ t: rt });
        await io.emit({ t: 'note', r: r.id, msg: MCARDNAME[rt] + ' ins Deck gelegt' });
      } else if (rt) {
        await io.emit({ t: 'note', r: r.id, msg: MCARDNAME[rt] + ' ist bereits vergeben' });
      }
    }
  }
  discardUpgrade(st, r, id);
  await io.emit({ t: 'upgUse', r: r.id, id });
}

/* --- Permanente Effekte beim Programmieren ------------------------------ */
async function useRoundPower(st, r, id, io) {
  if (r.usedThisRound[id]) return false;
  if (id === 'dings_defrag') {
    const i = r.hand.findIndex(c => isDmgCard(c));
    if (i < 0) return false;
    st.piles[r.hand[i].t]++;
    r.hand.splice(i, 1);
    r.hand.push(drawFrom(st, r));
  } else if (id === 'zwischenspeicher') {
    const pick = await io.choose(r, 'pickCards', { n: 0, prompt: 'Karten oben aufs Deck legen (ohne Ersatz)' });
    for (const idx of (pick || []).slice().sort((a, b) => b - a)) {
      const c = r.hand.splice(idx, 1)[0];
      if (c) r.deck.push(c);
    }
  } else return false;
  r.usedThisRound[id] = true;
  await io.emit({ t: 'upgUse', r: r.id, id });
  return true;
}

/* --- Schieben ------------------------------------------------------------ */
async function onPush(st, mover, pushed, d, io) {
  if (st.rules !== 'modern') {
    if (pushed.length && hasOpt(mover, 'ramming_gear'))
      for (const p of pushed) await damage(st, p, 1, io, mover, 'ramming');
    return;
  }
  for (const p of pushed) {
    if (hasUpg(mover, 'rammgetriebe')) await damage(st, p, 1, io, mover, 'push');
    if (hasUpg(mover, 'virusmodul')) await takeCards(st, p, 1, 'virus', io);
    if (hasUpg(mover, 'modulares_chassis') && p.upgrades.length) {
      const take = await io.choose(mover, 'stealUpgrade', { target: p });
      if (take) {
        discardUpgrade(st, mover, 'modulares_chassis');
        const i = p.upgrades.findIndex(u => u.id === take);
        if (i >= 0) { p.upgrades.splice(i, 1); mover.upgrades.push({ id: take }); }
        p.upgrades.push({ id: 'modulares_chassis' });
        await io.emit({ t: 'note', r: mover.id, msg: 'nimmt ' + UPGRADES[take].n + ' von ' + p.name });
      }
    }
  }
}

/* --- Roboterlaser in der Fassung 2016 ----------------------------------- */
async function mFireRobots(st, io) {
  const shots = [];
  for (const r of mAlive(st)) {
    if (r.rebooted) continue;
    const pierce = hasUpg(r, 'power_laser') ? 99 : 0;
    const tr = traceLaser(st, r.x, r.y, r.dir, pierce);
    shots.push({ r, dir: r.dir, from: [r.x, r.y], path: tr.path, targets: tr.hit, main: true });
    if (hasUpg(r, 'heck_laser')) {
      const d = opp(r.dir);
      const t2 = traceLaser(st, r.x, r.y, d, 0);
      shots.push({ r, dir: d, from: [r.x, r.y], path: t2.path, targets: t2.hit.slice(0, 1), main: false });
    }
  }
  for (const s of shots)
    await io.emit({ t: 'laser', from: s.from, dir: s.dir, path: s.path, kind: 'robot', n: 1, r: s.r.id });

  const forced = [];
  for (const s of shots) {
    for (const tgt of s.targets) {
      if (tgt.rebooted || tgt.out) continue;
      let n = 1;
      if (s.main && hasUpg(s.r, 'doppel_laser')) n++;
      if (s.main && hasUpg(s.r, 'mini_haubitze') && s.r.energy > 0 && !s.r.usedThisReg.mini_haubitze &&
          await io.ask(s.r, 'mini_haubitze', 'Mini-Haubitze: 1 Energie für zwei zusätzliche SPAM und einen Schub?')) {
        s.r.energy--; s.r.usedThisReg.mini_haubitze = true;
        n += 2;
        forced.push({ r: tgt, d: s.dir, by: s.r });
      }
      await damage(st, tgt, n, io, s.r, 'robot');
      const dist = Math.abs(tgt.x - s.r.x) + Math.abs(tgt.y - s.r.y);
      if (hasUpg(s.r, 'schubsstrahl') && await io.ask(s.r, 'schubsstrahl', tgt.name + ' ein Feld wegschieben?'))
        forced.push({ r: tgt, d: s.dir, by: s.r });
      if (hasUpg(s.r, 'magnetstrahl') && dist > 1 && await io.ask(s.r, 'magnetstrahl', tgt.name + ' ein Feld heranziehen?'))
        forced.push({ r: tgt, d: opp(s.dir), by: s.r });
      // Quirl: das nächste Register des Ziels wird überschrieben.
      // „sofern das nächste Register nicht das letzte ist" — hier als
      // „es muss ein nächstes Register geben" ausgelegt.
      if (hasUpg(s.r, 'quirl') && st.register < 5) {
        const i = st.register;
        binCard(st, tgt, tgt.regs[i] && tgt.regs[i].c);
        tgt.regs[i] = { c: drawFrom(st, tgt), sub: null, mode: null };
        await io.emit({ t: 'note', r: s.r.id, msg: 'verquirlt Register ' + (i + 1) + ' von ' + tgt.name });
      }
    }
  }
  for (const f of forced) {
    if (f.r.rebooted || f.r.out) continue;
    await stepMove(st, f.r, f.d, 'weapon', io);
  }
}
/* ============================================================================
   BOT-KI (Fassung 2016)
   Gleiches Prinzip wie beim alten Regelwerk: alle Registerbelegungen
   durchprobieren. Schadenskarten sind unbekannt und werden mit einem
   Abschlag bewertet, „Wiederholung" wird auf die Vorkarte aufgelöst.
   ========================================================================= */

const MOVECARDS = ['m1', 'm2', 'm3', 'bu', 'rl', 'rr', 'u'];
/* „Wiederholung" darf laut Karte nicht ins erste Register. */
const noFirstReg = c => c.t === 'again' || c.t === 'r_repeat';

function mSimRun(board, start, plan, blockers) {
  const s = { x: start.x, y: start.y, dir: start.dir, dead: false, dmg: 0, energy: 0 };
  const occupied = (x, y) => blockers.some(b => b.x === x && b.y === y);
  const step = d => {
    if (s.dead) return false;
    if (wallBlocks(board, s.x, s.y, d)) return false;
    const nx = s.x + DX[d], ny = s.y + DY[d];
    if (occupied(nx, ny)) return false;
    s.x = nx; s.y = ny;
    if (!inBounds(board, s.x, s.y)) { s.dead = true; return false; }
    if (board.cells[s.y * board.w + s.x].t === 'pit') { s.dead = true; return false; }
    return true;
  };
  const apply = (card, reg, depth) => {
    if (!card || s.dead || depth > 3) return;
    const t = card.t;
    if (t === 'spam' || t === 'trojan' || t === 'virus') { s.dmg += t === 'trojan' ? 2 : 1; return; }
    if (t === 'worm') { s.dead = true; return; }
    if (t === 'pwr' || t === 'r_energy') { s.energy++; return; }
    if (t === 'again' || t === 'r_repeat') {
      const prev = reg >= 2 ? plan[reg - 2] : null;
      if (prev) apply(prev.c, reg - 1, depth + 1);
      return;
    }
    if (t === 'r_spin' || t === 'r_sandbox' || t === 'r_spamfilter') return;
    if (t === 'r_speed') { for (let i = 0; i < 3; i++) if (!step(s.dir)) break; return; }
    if (t === 'rl') { s.dir = ccw(s.dir); return; }
    if (t === 'rr') { s.dir = cw(s.dir); return; }
    if (t === 'u') { s.dir = opp(s.dir); return; }
    const n = baseSteps(card);
    const d = n >= 0 ? s.dir : opp(s.dir);
    for (let i = 0; i < Math.abs(n); i++) if (!step(d)) break;
  };
  for (let k = 0; k < plan.length && !s.dead; k++) {
    const reg = k + 1;
    if (plan[k]) apply(plan[k].c, reg, 0);
    if (s.dead) break;
    for (const pass of [1, 0]) {
      const c = board.cells[s.y * board.w + s.x];
      if (c && c.cv && (pass === 0 || c.cv.x)) {
        const md = c.cv.d;
        if (step(md)) {
          const tc = board.cells[s.y * board.w + s.x];
          if (tc && tc.cv) {
            const diff = (tc.cv.d - md + 4) & 3;
            if (diff === 1) s.dir = cw(s.dir); else if (diff === 3) s.dir = ccw(s.dir);
          }
        }
      }
      if (s.dead) break;
    }
    if (s.dead) break;
    let c = board.cells[s.y * board.w + s.x];
    if (c.push && activeIn(c.push.phases, reg)) step(c.push.d);
    if (s.dead) break;
    c = board.cells[s.y * board.w + s.x];
    if (c.gear) s.dir = c.gear > 0 ? cw(s.dir) : ccw(s.dir);
    if (c.laser) s.dmg += c.laser.n || 1;
    if (c.energy) s.energy++;
  }
  return s;
}

function mBotProgram(st, r) {
  const board = st.board;
  const [fx, fy] = flagPos(board, Math.min(r.nextFlag, st.totalFlags));
  const df = distField(board, fx, fy);
  const blockers = st.robots.filter(o => o !== r && !o.out).map(o => ({ x: o.x, y: o.y }));
  const hand = r.hand.slice();
  const k = Math.min(5, hand.length);
  const CAP = 192;
  const results = [];
  let cut = -1e9, total = 0;
  const used = new Array(hand.length).fill(false);
  const pick = new Array(k).fill(null);

  const evaluate = () => {
    const plan = [];
    for (let i = 0; i < 5; i++) plan.push(i < k ? { c: hand[pick[i]] } : null);
    const s = mSimRun(board, r, plan, blockers);
    let score = 0;
    if (s.dead) score -= 900;
    else {
      const d = df[s.y * board.w + s.x];
      score -= (d >= 9999 ? 60 : d) * 10;
      if (d === 0) score += 1200;
      const ax = Math.max(0, Math.min(board.w - 1, s.x + DX[s.dir]));
      const ay = Math.max(0, Math.min(board.h - 1, s.y + DY[s.dir]));
      if (df[ay * board.w + ax] < d) score += 15;
      score -= laserExposure(board, s.x, s.y) * 20;
    }
    score -= s.dmg * 25;
    score += s.energy * 8;
    total++;
    if (results.length < CAP) {
      results.push({ score, order: pick.slice() });
      if (results.length === CAP) { results.sort((a, z) => z.score - a.score); cut = results[CAP - 1].score; }
    } else if (score > cut) {
      results[CAP - 1] = { score, order: pick.slice() };
      for (let i = CAP - 1; i > 0 && results[i].score > results[i - 1].score; i--)
        [results[i], results[i - 1]] = [results[i - 1], results[i]];
      cut = results[CAP - 1].score;
    }
  };
  const rec = depth => {
    if (depth === k) { evaluate(); return; }
    for (let i = 0; i < hand.length; i++) {
      if (used[i]) continue;
      if (depth === 0 && noFirstReg(hand[i])) continue;
      used[i] = true; pick[depth] = i;
      rec(depth + 1);
      used[i] = false;
    }
  };
  rec(0);
  if (!results.length) {            // Notfall: nur Wiederholungskarten auf der Hand
    for (let i = 0; i < k; i++) pick[i] = i;
    evaluate();
  }
  results.sort((a, b) => b.score - a.score);
  const frac = r.level >= 3 ? 0 : r.level === 2 ? 0.05 : 0.30;
  const band = Math.max(1, Math.min(results.length, Math.round(total * frac)));
  const chosen = results[st.rng.int(band)];
  const take = chosen.order.map(i => hand[i]);
  for (let i = 0; i < 5; i++) r.regs[i] = i < take.length ? { c: take[i], sub: null, mode: null } : null;
  const set = new Set(chosen.order);
  r.hand = hand.filter((_, i) => !set.has(i));
}

/* Kaufentscheidung: was am meisten hilft und bezahlbar ist */
function mBotShop(st, r, offers) {
  const rank = {
    memory_stick: 9, firewall: 8, doppel_laser: 7, power_laser: 7, heck_laser: 6,
    bremse: 6, krabbenbeine: 6, deflektorschild: 6, flugmodul: 5, teleporter: 5,
    rammgetriebe: 5, dings_defrag: 5, adminrechte: 5, schubsstrahl: 4, magnetstrahl: 4,
    mini_haubitze: 4, zwischenspeicher: 4, aufladung: 4, spam_blocker: 4,
    r_speed_up: 3, r_energy_up: 3, update: 3
  };
  let best = null, bs = -1;
  for (const id of offers) {
    if (UPGRADES[id].cost > r.energy) continue;
    const s = (rank[id] || 2) - UPGRADES[id].cost * 0.6;
    if (s > bs) { bs = s; best = id; }
  }
  // Energie zurückhalten, wenn das Angebot schwach ist
  return bs >= 1.5 ? best : null;
}

function mBotAnswer(st, r, kind, data) {
  data = data || {};
  const bestDir = () => {
    const [fx, fy] = flagPos(st.board, Math.min(r.nextFlag, st.totalFlags));
    const df = distField(st.board, fx, fy);
    let best = data.def != null ? data.def : r.dir, bd = 1e9;
    for (let d = 0; d < 4; d++) {
      const nx = r.x + DX[d], ny = r.y + DY[d];
      if (!inBounds(st.board, nx, ny) || wallBlocks(st.board, r.x, r.y, d)) continue;
      const v = df[ny * st.board.w + nx];
      if (v < bd) { bd = v; best = d; }
    }
    return best;
  };
  switch (kind) {
    case 'rebootDir': case 'anyDir': return bestDir();
    case 'sandbox': return 'm2';
    case 'crabSide': return null;
    case 'bremse': return false;
    case 'teleporter': return r.energy >= 2;
    case 'deflektorschild': return r.energy >= 1;
    case 'mini_haubitze': return r.energy >= 2;
    case 'schubsstrahl': case 'magnetstrahl': return true;
    case 'korruptionswelle': return true;
    case 'blauer_todesbildschirm': return true;
    case 'pickCards': {
      const idx = [];
      for (let i = 0; i < r.hand.length && idx.length < (data.n || 3); i++)
        if (isDmgCard(r.hand[i])) idx.push(i);
      return idx;
    }
    case 'dropUpgrade': {
      const ids = data.ids || [];
      return ids.slice().sort((a, b) => UPGRADES[a].cost - UPGRADES[b].cost)[0] || null;
    }
    case 'stealUpgrade': {
      const t = data.target;
      const ids = t.upgrades.map(u => u.id);
      return ids.slice().sort((a, b) => UPGRADES[b].cost - UPGRADES[a].cost)[0] || null;
    }
    default: return null;
  }
}

/* Temporäre Karten, die ein Bot von sich aus einsetzt */
async function mBotTemps(st, r, io, when) {
  for (const u of heldTemp(r).slice()) {
    const w = UPGRADES[u.id].when;
    if (when === 'reg' && w === 'prog') continue;    // Bot spart sich das Sinnlose
    let use = false;
    if (u.id === 'aufladung') use = r.energy <= 3;
    else if (u.id === 'update') use = r.hand.filter(isDmgCard).length >= 3;
    else if (u.id === 'spam_blocker') use = r.hand.filter(c => c.t === 'spam').length >= 2;
    else if (UPGRADES[u.id].routine) use = st.special[UPGRADES[u.id].routine] > 0;
    else if (u.id === 'speichertausch') use = r.hand.filter(isDmgCard).length >= 2;
    if (use) await useTemp(st, r, u.id, io);
  }
}
/* ============================================================================
   SELBSTTEST — prueft die Engine ohne Oberflaeche
   ========================================================================= */
const TESTS = [];
const test = (name, fn) => TESTS.push({ name, fn });
function eq(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  if (sa !== sb) throw new Error((msg || '') + ' — erwartet ' + sb + ', bekommen ' + sa);
}
const ok = (v, msg) => { if (!v) throw new Error(msg || 'Bedingung verletzt'); };

function headlessIO(st, opts) {
  opts = opts || {};
  const mod = () => st.rules === 'modern';
  const io = {
    emit: async ev => { if (opts.trace) opts.trace(ev); },
    ask: async (r, id) => mod() ? mBotAnswer(st, r, id, {}) : (r.isBot ? botAnswer(st, r, id, {}) : false),
    choose: async (r, kind, data) => mod() ? mBotAnswer(st, r, kind, data || {}) : botAnswer(st, r, kind, data || {}),
    program: async r => {
      if (mod()) { await mBotTemps(st, r, io, 'prog'); mBotProgram(st, r); }
      else { botPickWeapon(st, r); botChooseProgram(st, r); }
    },
    shop: async (r, offers) => mBotShop(st, r, offers),
    scramble: (a, b) => applyScramble(st, b),
    radio: (a, b) => applyRadio(st, a, b)
  };
  return io;
}
/* Zustand nach den Regeln von 2016 */
function mstate(board, robots, seed) {
  const st = newState(board, robots, seed || 99, { rules: 'modern', optionsOn: true });
  st.totalFlags = countFlags(board) || 1;
  return st;
}
const nonDmg = c => !isDmgCard(c) && !ROUTINES[c.t];
/* Testboard aus Textkarte, ohne Flaggen */
function tb(ground, extra) {
  return parseBoard(Object.assign({ name: 'test', ground }, extra || {}));
}
function tstate(board, robots) {
  const st = newState(board, robots, 1234, { optionsOn: false });
  st.totalFlags = countFlags(board) || 1;
  return st;
}
const R = (id, x, y, dir, o) => makeRobot(id, 'R' + id, '#fff', x, y, dir, o);

  const a = R(1, 0, 0, 1);
  const st = mstate(b, [a]);
  a.deck = [{ t: 'm1' }];
  const card = { t: 'spam' };
  a.regs[0] = { c: card, sub: null, mode: null };
  const before = st.piles.spam;
  await mResolve(st, a, card, 1, headlessIO(st), 0);
  eq(st.piles.spam, before + 1, 'sofort abgelegt');
  clearRegs(st, a, 0);
  eq(st.piles.spam, before + 1, 'am Rundenende nicht noch einmal');
});

test('2016: leerer Ziehstapel wird durch eine andere Art ersetzt', async () => {
  const b = tb(`.....`);
  const a = R(1, 0, 0, 1);
  const st = mstate(b, [a]);
  st.piles.spam = 0;
  await takeCards(st, a, 2, 'spam', headlessIO(st));
  eq(a.disc.length, 2, 'trotzdem zwei Karten');
  ok(a.disc.every(c => c.t !== 'spam'), 'aber keine SPAM-Karten');
});

test('2016: Reboot schiebt den Vorgaenger in Pfeilrichtung der Marke', async () => {
  const b = tb(`......`, { respawn: [[2, 0, 1]] });   // Pfeil zeigt nach Osten
  const a = R(1, 2, 0, 0), c = R(2, 5, 0, 3);
  const st = mstate(b, [a, c]);
  await rebootRobot(st, c, headlessIO(st), 'Test');
  eq([c.x, c.y], [2, 0], 'Neustarter steht auf der Marke');
  eq(a.x, 3, 'Vorgaenger wurde nach Osten geschoben');
});

test('Beide Regelwerke laufen ueber denselben Einstieg', async () => {
  for (const [rules, bi] of [['classic', 0], ['modern', 3]]) {
    const b = loadBoard(bi);
    const sp = startPositions(b);
    const rs = [0, 1].map(i => makeRobot(i + 1, 'B' + i, '#fff', sp[i].x, sp[i].y,
      startFacing(b, sp[i].x, sp[i].y), { isBot: true, level: 2 }));
    const st = newState(b, rs, 4711, { rules, optionsOn: true });
    st.totalFlags = countFlags(b);
    const io = headlessIO(st);
    for (let i = 0; i < 3 && !st.over; i++) await playRound(st, io);
    eq(st.rules, rules, 'Regelwerk gesetzt');
    ok(st.turn >= 3 || st.over, rules + ': Runden gespielt');
  }
});

async function runTests(report) {
  let pass = 0, fail = 0;
  const lines = [];
  for (const t of TESTS) {
    try { await t.fn(); pass++; lines.push(['ok', t.name, '']); }
    catch (e) { fail++; lines.push(['fail', t.name, e.message]); }
  }
  if (report) report(lines, pass, fail);
  return { pass, fail, lines };
}
/* ============================================================================
   RENDERER — alles prozedural auf Canvas, keine Bilddateien
   ========================================================================= */
const C = {
  floor: '#26231d', floor2: '#2b2820', grid: '#332f27', edge: '#141210',
  pit: '#0d0c0b', wall: '#c9b98a', wallDark: '#8a7c58',
  belt: '#3c4a4e', beltX: '#3a5560', beltArrow: '#7fc0cf',
  gear: '#57503f', push: '#8a6a2a', crush: '#7a2f31', trap: '#1a1714',
  oil: '#1e1c22', water: '#243a44', rad: '#4a4a1e', tele: '#3b2f4a',
  repair: '#2f4230', upgrade: '#3d4a26', flag: '#f0c419',
  energy: '#2b3b52', antenna: '#4a3a52', respawn: '#2f3a2a',
  laser: '#d0393b', flame: '#dd6b20', ink: '#ede7d8', dim: '#8f877a'
};

class BoardView {
  constructor(canvas) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.cell = 44;
    this.anim = null;          // {type, ...} temporaerer Zeichenzustand
    this.flashes = [];         // kurzlebige Effekte
    this.st = null;
  }
  fit(board, maxW, maxH) {
    const cell = Math.max(18, Math.floor(Math.min(maxW / board.w, maxH / board.h)));
    this.cell = cell;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.cv.width = board.w * cell * dpr;
    this.cv.height = board.h * cell * dpr;
    this.cv.style.width = (board.w * cell) + 'px';
    this.cv.style.height = (board.h * cell) + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  px(x) { return x * this.cell; }

  draw(st, opts) {
    this.st = st;
    const { ctx, cell } = this, b = st.board;
    opts = opts || {};
    ctx.clearRect(0, 0, this.cv.width, this.cv.height);
    // Untergrund
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) this.drawCell(b, x, y);
    // Waende und Laseremitter liegen ueber den Feldern
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) this.drawWalls(b, x, y);
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) this.drawBeams(st, x, y);
    // Flaggen
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      const c = cellAt(b, x, y);
      if (c.flag) this.drawFlag(x, y, c.flag);
      if (c.start && opts.showStarts) this.drawStart(x, y, c.start);
    }
    // Effekte unter den Robotern
    for (const f of this.flashes) if (f.under) this.drawFlash(f);
    // Roboter
    for (const r of st.robots) {
      if (r.out || (r.destroyed && !(this.anim && this.anim.dying === r.id))) continue;
      let px = this.px(r.x) + cell / 2, py = this.px(r.y) + cell / 2, dir = r.dir;
      const a = this.anim;
      if (a && a.moving === r.id) {
        px = this.px(a.fx + (a.tx - a.fx) * a.t) + cell / 2;
        py = this.px(a.fy + (a.ty - a.fy) * a.t) + cell / 2;
      }
      if (a && a.turning === r.id) {
        let d0 = a.from, d1 = a.to, dd = ((d1 - d0 + 5) % 4) - 1;   // -1,0,1,2
        dir = d0 + dd * a.t;
      }
      this.drawRobot(r, px, py, dir);
    }
    for (const f of this.flashes) if (!f.under) this.drawFlash(f);
    if (opts.cursor) this.drawCursor(opts.cursor);
  }

  drawCell(b, x, y) {
    const { ctx, cell } = this, c = cellAt(b, x, y);
    const X = this.px(x), Y = this.px(y);
    ctx.fillStyle = ((x + y) & 1) ? C.floor : C.floor2;
    ctx.fillRect(X, Y, cell, cell);

    if (c.cv) this.drawBelt(X, Y, c.cv);
    if (c.t === 'oil') { ctx.fillStyle = C.oil; this.blob(X, Y); }
    if (c.t === 'water') { ctx.fillStyle = C.water; ctx.fillRect(X, Y, cell, cell); this.ripples(X, Y); }
    if (c.t === 'radiation') { ctx.fillStyle = C.rad; ctx.fillRect(X, Y, cell, cell); this.trefoil(X, Y); }
    if (c.t === 'repair') { ctx.fillStyle = C.repair; ctx.fillRect(X, Y, cell, cell); this.wrench(X, Y, 1); }
    if (c.t === 'upgrade') { ctx.fillStyle = C.upgrade; ctx.fillRect(X, Y, cell, cell); this.wrench(X, Y, 2); }
    if (c.tele) { ctx.fillStyle = C.tele; ctx.fillRect(X, Y, cell, cell); this.rings(X, Y, '#a98fd0'); }
    if (c.portal != null) { ctx.fillStyle = C.tele; ctx.fillRect(X, Y, cell, cell); this.rings(X, Y, c.portal === 1 ? '#74ad46' : '#dd6b20'); }
    if (c.energy) { ctx.fillStyle = C.energy; ctx.fillRect(X, Y, cell, cell); this.drawEnergy(X, Y, this.st && this.st.cubes ? this.st.cubes[x + ',' + y] : true); }
    if (c.antenna) { ctx.fillStyle = C.antenna; ctx.fillRect(X, Y, cell, cell); this.drawAntenna(X, Y, c.antenna.d == null ? 2 : c.antenna.d); }
    if (c.respawn) { ctx.fillStyle = C.respawn; ctx.fillRect(X, Y, cell, cell); this.drawRespawn(X, Y, c.respawn.d); }
    if (c.gear) this.drawGear(X, Y, c.gear);
    if (c.push) this.drawPusher(X, Y, c.push);
    if (c.crush) this.drawCrusher(X, Y, c.crush);
    if (c.trap) this.drawTrap(X, Y, c.trap);
    if (c.flame) this.drawFlameTile(X, Y, c.flame);
    if (c.t === 'pit') this.drawPit(X, Y);

    ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
    ctx.strokeRect(X + .5, Y + .5, cell - 1, cell - 1);
  }

  drawBelt(X, Y, cv) {
    const { ctx, cell } = this;
    ctx.fillStyle = cv.x ? C.beltX : C.belt;
    ctx.fillRect(X, Y, cell, cell);
    // Querstreben
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
    const horiz = cv.d === 1 || cv.d === 3;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      if (horiz) { ctx.moveTo(X + i * cell / 4, Y + 3); ctx.lineTo(X + i * cell / 4, Y + cell - 3); }
      else { ctx.moveTo(X + 3, Y + i * cell / 4); ctx.lineTo(X + cell - 3, Y + i * cell / 4); }
      ctx.stroke();
    }
    this.arrow(X + cell / 2, Y + cell / 2, cv.d, cell * .3, C.beltArrow, cv.x ? 2 : 1);
  }
  arrow(cx, cy, d, len, col, n) {
    const { ctx } = this;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(d * Math.PI / 2);
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, this.cell * .06);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let k = 0; k < (n || 1); k++) {
      const o = (n > 1 ? (k - .5) * len * .55 : 0);
      ctx.beginPath();
      ctx.moveTo(-len * .45, -o + len * .3);
      ctx.lineTo(0, -o - len * .35);
      ctx.lineTo(len * .45, -o + len * .3);
      ctx.stroke();
    }
    ctx.restore();
  }
  drawGear(X, Y, g) {
    const { ctx, cell } = this, cx = X + cell / 2, cy = Y + cell / 2, R = cell * .36;
    ctx.save(); ctx.translate(cx, cy);
    ctx.fillStyle = C.gear;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a0 = i * Math.PI / 4, a1 = a0 + Math.PI / 8;
      ctx.lineTo(Math.cos(a0) * R, Math.sin(a0) * R);
      ctx.lineTo(Math.cos(a1) * R * .78, Math.sin(a1) * R * .78);
    }
    ctx.closePath(); ctx.fill();
    // Anleitung: rote Drehscheiben drehen nach links, grüne nach rechts
    ctx.strokeStyle = g > 0 ? '#74ad46' : '#d0393b'; ctx.lineWidth = Math.max(1.5, cell * .055);
    ctx.beginPath(); ctx.arc(0, 0, R * .48, g > 0 ? -1.9 : 1.9, g > 0 ? 1.2 : -1.2, g < 0);
    ctx.stroke();
    const ea = g > 0 ? 1.2 : -1.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ea) * R * .48, Math.sin(ea) * R * .48);
    ctx.lineTo(Math.cos(ea) * R * .78, Math.sin(ea) * R * .30);
    ctx.lineTo(Math.cos(ea) * R * .20, Math.sin(ea) * R * .72);
    ctx.closePath(); ctx.fillStyle = g > 0 ? '#74ad46' : '#d0393b'; ctx.fill();
    ctx.restore();
  }
  drawPusher(X, Y, p) {
    const { ctx, cell } = this;
    ctx.save(); ctx.translate(X + cell / 2, Y + cell / 2); ctx.rotate(p.d * Math.PI / 2);
    ctx.fillStyle = C.push;
    ctx.fillRect(-cell * .34, cell * .30, cell * .68, cell * .13);
    for (let i = -1; i <= 1; i++) ctx.fillRect(i * cell * .20 - cell * .05, cell * .12, cell * .10, cell * .20);
    ctx.fillStyle = C.ink;
    ctx.font = `600 ${Math.round(cell * .24)}px ui-monospace,monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.phases.join(''), 0, cell * .37);
    ctx.restore();
  }
  drawCrusher(X, Y, ph) {
    const { ctx, cell } = this;
    ctx.fillStyle = C.crush; ctx.fillRect(X + 3, Y + 3, cell - 6, cell - 6);
    ctx.strokeStyle = '#1b1917'; ctx.lineWidth = Math.max(2, cell * .08);
    for (let i = -1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(X + i * cell / 2.2 + 3, Y + 3);
      ctx.lineTo(X + i * cell / 2.2 + cell - 3, Y + cell - 3);
      ctx.stroke();
    }
    this.phaseTag(X, Y, ph);
  }
  drawTrap(X, Y, ph) {
    const { ctx, cell } = this;
    ctx.fillStyle = C.trap; ctx.fillRect(X + 4, Y + 4, cell - 8, cell - 8);
    ctx.strokeStyle = '#4a443a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X + cell / 2, Y + 4); ctx.lineTo(X + cell / 2, Y + cell - 4); ctx.stroke();
    this.phaseTag(X, Y, ph);
  }
  drawFlameTile(X, Y, ph) {
    const { ctx, cell } = this;
    ctx.strokeStyle = C.flame; ctx.lineWidth = Math.max(1.5, cell * .06);
    const cx = X + cell / 2, cy = Y + cell * .58;
    ctx.beginPath();
    ctx.moveTo(cx, cy + cell * .18);
    ctx.quadraticCurveTo(cx - cell * .22, cy - cell * .02, cx, cy - cell * .26);
    ctx.quadraticCurveTo(cx + cell * .22, cy - cell * .02, cx, cy + cell * .18);
    ctx.stroke();
    this.phaseTag(X, Y, ph);
  }
  phaseTag(X, Y, ph) {
    const { ctx, cell } = this;
    ctx.fillStyle = C.ink;
    ctx.font = `600 ${Math.round(cell * .22)}px ui-monospace,monospace`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(ph.join(''), X + 3, Y + 2);
  }
  drawPit(X, Y) {
    const { ctx, cell } = this;
    const g = ctx.createRadialGradient(X + cell / 2, Y + cell / 2, cell * .05, X + cell / 2, Y + cell / 2, cell * .52);
    g.addColorStop(0, '#000'); g.addColorStop(.7, C.pit); g.addColorStop(1, '#1d1a16');
    ctx.fillStyle = g; ctx.fillRect(X, Y, cell, cell);
    ctx.strokeStyle = '#3a342a'; ctx.lineWidth = Math.max(1, cell * .05);
    ctx.setLineDash([cell * .12, cell * .09]);
    ctx.strokeRect(X + cell * .12, Y + cell * .12, cell * .76, cell * .76);
    ctx.setLineDash([]);
  }
  blob(X, Y) {
    const { ctx, cell } = this;
    ctx.beginPath();
    ctx.ellipse(X + cell * .5, Y + cell * .52, cell * .42, cell * .34, .4, 0, 7);
    ctx.fill();
    ctx.strokeStyle = '#6b5f86'; ctx.lineWidth = Math.max(1, cell * .04);
    ctx.stroke();
    ctx.fillStyle = 'rgba(190,180,220,.45)';
    ctx.beginPath(); ctx.ellipse(X + cell * .40, Y + cell * .42, cell * .13, cell * .06, .4, 0, 7); ctx.fill();
  }
  ripples(X, Y) {
    const { ctx, cell } = this;
    ctx.strokeStyle = 'rgba(150,200,215,.35)'; ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      for (let t = 0; t <= 1.001; t += .1)
        ctx.lineTo(X + t * cell, Y + cell * (.22 * i + .05) + Math.sin(t * 7 + i) * cell * .035);
      ctx.stroke();
    }
  }
  trefoil(X, Y) {
    const { ctx, cell } = this, cx = X + cell / 2, cy = Y + cell / 2;
    ctx.fillStyle = '#d9d24a';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, cell * .34, i * 2.094 - .5, i * 2.094 + .5);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, cell * .09, 0, 7); ctx.fill();
  }
  wrench(X, Y, n) {
    const { ctx, cell } = this;
    ctx.strokeStyle = '#b9c98a'; ctx.lineWidth = Math.max(1.6, cell * .07); ctx.lineCap = 'round';
    for (let k = 0; k < n; k++) {
      const cx = X + cell / 2 + (n === 2 ? (k - .5) * cell * .26 : 0), cy = Y + cell / 2;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(k ? -.6 : .6);
      ctx.beginPath(); ctx.moveTo(0, -cell * .20); ctx.lineTo(0, cell * .20); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -cell * .22, cell * .085, .6, 5.7); ctx.stroke();
      ctx.restore();
    }
  }
  rings(X, Y, col) {
    const { ctx, cell } = this;
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.4, cell * .055);
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 1 - i * .22;
      ctx.beginPath(); ctx.arc(X + cell / 2, Y + cell / 2, cell * .10 * i, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  drawEnergy(X, Y, full) {
    const { ctx, cell } = this, cx = X + cell * .5, cy = Y + cell * .5;
    ctx.strokeStyle = full ? '#7fc9f0' : '#4a5a68';
    ctx.lineWidth = Math.max(1.3, cell * .05);
    ctx.strokeRect(X + cell * .30, Y + cell * .26, cell * .40, cell * .48);
    ctx.fillStyle = full ? '#7fc9f0' : '#4a5a68';
    ctx.fillRect(X + cell * .42, Y + cell * .19, cell * .16, cell * .07);
    if (full) {
      ctx.beginPath();
      ctx.moveTo(cx + cell * .05, cy - cell * .16);
      ctx.lineTo(cx - cell * .07, cy + cell * .02);
      ctx.lineTo(cx + cell * .01, cy + cell * .02);
      ctx.lineTo(cx - cell * .05, cy + cell * .18);
      ctx.lineTo(cx + cell * .08, cy - cell * .01);
      ctx.lineTo(cx, cy - cell * .01);
      ctx.closePath();
      ctx.fillStyle = '#f0c419'; ctx.fill();
    }
  }
  drawAntenna(X, Y, d) {
    const { ctx, cell } = this, cx = X + cell * .5;
    this.arrow(cx, Y + cell * .5, d, cell * .22, 'rgba(198,168,224,.45)', 1);
    ctx.strokeStyle = '#c6a8e0'; ctx.lineWidth = Math.max(1.4, cell * .055);
    ctx.beginPath(); ctx.moveTo(cx, Y + cell * .82); ctx.lineTo(cx, Y + cell * .26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - cell * .14, Y + cell * .84); ctx.lineTo(cx + cell * .14, Y + cell * .84); ctx.stroke();
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 1 - i * .22;
      ctx.beginPath();
      ctx.arc(cx, Y + cell * .26, cell * .09 * i, -2.5, -0.65);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  drawRespawn(X, Y, d) {
    const { ctx, cell } = this;
    ctx.strokeStyle = '#9ec97a'; ctx.lineWidth = Math.max(1.4, cell * .055);
    ctx.setLineDash([cell * .10, cell * .07]);
    ctx.strokeRect(X + cell * .16, Y + cell * .16, cell * .68, cell * .68);
    ctx.setLineDash([]);
    this.arrow(X + cell * .5, Y + cell * .5, d, cell * .26, '#9ec97a', 1);
  }
  drawFlag(x, y, n) {
    const { ctx, cell } = this, X = this.px(x), Y = this.px(y);
    ctx.strokeStyle = '#6b6355'; ctx.lineWidth = Math.max(1.5, cell * .06);
    ctx.beginPath(); ctx.moveTo(X + cell * .32, Y + cell * .82); ctx.lineTo(X + cell * .32, Y + cell * .18); ctx.stroke();
    ctx.fillStyle = C.flag;
    ctx.beginPath();
    ctx.moveTo(X + cell * .32, Y + cell * .18);
    ctx.lineTo(X + cell * .80, Y + cell * .32);
    ctx.lineTo(X + cell * .32, Y + cell * .46);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1b1917';
    ctx.font = `700 ${Math.round(cell * .26)}px ui-monospace,monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n, X + cell * .46, Y + cell * .32);
  }
  drawStart(x, y, n) {
    const { ctx, cell } = this, X = this.px(x), Y = this.px(y);
    ctx.strokeStyle = 'rgba(240,196,25,.45)'; ctx.lineWidth = 2;
    ctx.strokeRect(X + 4, Y + 4, cell - 8, cell - 8);
    ctx.fillStyle = 'rgba(240,196,25,.65)';
    ctx.font = `700 ${Math.round(cell * .3)}px ui-monospace,monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n, X + cell / 2, Y + cell / 2);
  }
  drawWalls(b, x, y) {
    const { ctx, cell } = this, c = cellAt(b, x, y);
    const X = this.px(x), Y = this.px(y), t = Math.max(3, cell * .11);
    const seg = (d, col) => {
      ctx.fillStyle = col;
      if (d === 0) ctx.fillRect(X, Y, cell, t);
      if (d === 2) ctx.fillRect(X, Y + cell - t, cell, t);
      if (d === 3) ctx.fillRect(X, Y, t, cell);
      if (d === 1) ctx.fillRect(X + cell - t, Y, t, cell);
    };
    for (let d = 0; d < 4; d++) {
      if ((c.w || 0) & WBIT[d]) { seg(d, C.wall); }
      if ((c.ow || 0) & WBIT[d]) { seg(d, C.laser); }
    }
  }
  drawBeams(st, x, y) {
    const { ctx, cell } = this, c = cellAt(st.board, x, y);
    if (!c.laser) return;
    const d = c.laser.d, X = this.px(x), Y = this.px(y);
    // Emitter
    ctx.save(); ctx.translate(X + cell / 2, Y + cell / 2); ctx.rotate(d * Math.PI / 2);
    ctx.fillStyle = '#5a4a3a'; ctx.fillRect(-cell * .18, cell * .28, cell * .36, cell * .22);
    ctx.fillStyle = C.laser; ctx.fillRect(-cell * .07, cell * .20, cell * .14, cell * .10);
    ctx.restore();
    // Ruhestrahl
    const tr = traceLaser(st, x, y, d, false);
    if (!tr.path.length) return;
    const last = tr.path[tr.path.length - 1];
    ctx.save();
    ctx.globalAlpha = .30; ctx.strokeStyle = C.laser;
    ctx.lineWidth = Math.max(1.5, cell * .05 * (c.laser.n || 1));
    ctx.beginPath();
    ctx.moveTo(X + cell / 2, Y + cell / 2);
    ctx.lineTo(this.px(last[0]) + cell / 2, this.px(last[1]) + cell / 2);
    ctx.stroke(); ctx.restore();
  }
  drawRobot(r, cx, cy, dirF) {

    ctx.save(); ctx.translate(cx, cy);
    if (r.virtual) ctx.globalAlpha = .45;
    ctx.rotate(dirF * Math.PI / 2);
    // Laufwerk
    ctx.fillStyle = '#15130f';
    ctx.fillRect(-R * 1.14, -R * .62, R * .26, R * 1.24);
    ctx.fillRect(R * .88, -R * .62, R * .26, R * 1.24);
    // Chassis mit abgeschraegter Front — die Schraege zeigt die Blickrichtung
    ctx.beginPath();
    ctx.moveTo(0, -R * 1.16);
    ctx.lineTo(R * .92, -R * .30);
    ctx.lineTo(R * .92, R * .82);
    ctx.quadraticCurveTo(R * .92, R, R * .74, R);
    ctx.lineTo(-R * .74, R);
    ctx.quadraticCurveTo(-R * .92, R, -R * .92, R * .82);
    ctx.lineTo(-R * .92, -R * .30);
    ctx.closePath();
    ctx.fillStyle = r.color; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = Math.max(1.2, cell * .045);
    ctx.lineJoin = 'round'; ctx.stroke();
    // Helle Bugplatte
    ctx.beginPath();
    ctx.moveTo(0, -R * 1.02);
    ctx.lineTo(R * .70, -R * .28);
    ctx.lineTo(-R * .70, -R * .28);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.42)'; ctx.fill();
    // Laserkanzel
    ctx.fillStyle = '#15130f';
    ctx.fillRect(-R * .13, -R * .95, R * .26, R * .62);
    ctx.fillStyle = C.laser;
    ctx.fillRect(-R * .06, -R * 1.00, R * .12, R * .22);

    if (r.poweredDown) {
      ctx.fillStyle = 'rgba(20,18,15,.55)';
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.1, 0, 7); ctx.fill();
      ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(1.6, cell * .06);
      ctx.beginPath(); ctx.arc(cx, cy + R * .05, R * .48, .9, 5.4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - R * .62); ctx.lineTo(cx, cy + R * .02); ctx.stroke();
    }
    // Schadensring
    if (r.dmg > 0) {
      ctx.strokeStyle = 'rgba(20,18,15,.8)'; ctx.lineWidth = Math.max(3, cell * .105);
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.30, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, r.dmg / 10)); ctx.stroke();
      ctx.strokeStyle = C.laser; ctx.lineWidth = Math.max(2, cell * .07);
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.30, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, r.dmg / 10)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  drawCursor(cur) {
    const { ctx, cell } = this;
    ctx.strokeStyle = C.flag; ctx.lineWidth = 2;
    ctx.strokeRect(this.px(cur[0]) + 1, this.px(cur[1]) + 1, cell - 2, cell - 2);
  }
  drawFlash(f) {
    const { ctx, cell } = this;
    const a = 1 - f.t;
    ctx.save(); ctx.globalAlpha = Math.max(0, a);
    if (f.type === 'laser') {
      ctx.strokeStyle = f.kind === 'board' ? C.laser : '#ff8a5c';
      ctx.lineWidth = Math.max(2, cell * .09 * (f.n || 1));
      ctx.lineCap = 'round';
      const p = f.path;
      if (p.length) {
        ctx.beginPath();
        ctx.moveTo(this.px(f.from[0]) + cell / 2, this.px(f.from[1]) + cell / 2);
        ctx.lineTo(this.px(p[p.length - 1][0]) + cell / 2, this.px(p[p.length - 1][1]) + cell / 2);
        ctx.stroke();
      }
    } else if (f.type === 'damage') {
      ctx.fillStyle = C.laser;
      ctx.font = `700 ${Math.round(cell * .38)}px ui-monospace,monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('−1', this.px(f.at[0]) + cell / 2, this.px(f.at[1]) + cell * .5 - a * cell * .3);
    } else if (f.type === 'burst') {
      ctx.strokeStyle = f.col || C.flame; ctx.lineWidth = Math.max(2, cell * .07);
      ctx.beginPath();
      ctx.arc(this.px(f.at[0]) + cell / 2, this.px(f.at[1]) + cell / 2, cell * (.15 + f.t * .5), 0, 7);
      ctx.stroke();
    } else if (f.type === 'text') {
      ctx.fillStyle = f.col || C.flag;
      ctx.font = `700 ${Math.round(cell * .30)}px ui-monospace,monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(f.msg, this.px(f.at[0]) + cell / 2, this.px(f.at[1]) + cell * .5 - a * cell * .35);
    }
    ctx.restore();

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const DIRLABEL = ['Norden ↑', 'Osten →', 'Süden ↓', 'Westen ←'];
/* Karten gibt es in beiden Regelwerken — hier steht, wo nachzuschlagen ist. */
const cardInfo = id => OPTIONS[id] || UPGRADES[id] || { n: id, d: '' };

const App = {
  st: null, view: null, io: null,
  speed: 1, paused: false, stepping: false, stepResolve: null,
  running: false, mode: 'setup', selected: null, gen: 0,
  cfg: { boardIdx: 0, flags: 3, options: true, seed: 0, players: null, rules: 'classic' },
  get modern() { return this.st && this.st.rules === 'modern'; },

  /* --- Ablaufsteuerung ------------------------------------------------- */
  async start() {
    // Jede Partie bekommt eine Kennung. Läuft noch eine ältere Runde in einem
    // await, laufen deren io-Aufrufe damit ins Leere statt sich in die neue
    // Partie zu mischen.
    const gen = ++this.gen;
    const live = () => this.gen === gen;
    const b = this.cfg.getBoard ? this.cfg.getBoard() : loadBoard(this.cfg.boardIdx);
    trimFlags(b, this.cfg.flags);
    const sp = startPositions(b);
    const robots = this.cfg.players.map((p, i) => {
      const s = sp[i % sp.length];
      return makeRobot(i + 1, p.name, ROBOT_COLORS[i][0], s.x, s.y,
        startFacing(b, s.x, s.y), { isBot: p.bot, level: p.level });
    });
    this.st = newState(b, robots, this.cfg.seed || (Date.now() & 0x7fffffff),
      { optionsOn: this.cfg.options, rules: this.cfg.rules || 'classic' });
    location.hash = 'seed=' + this.st.seed;
    this.io = {
      emit: ev => live() ? this.animate(ev) : Promise.resolve(),
      ask: (r, id, q) => live() ? this.askRuntime(r, id, q) : Promise.resolve(false),
      choose: (r, k, d) => live() ? this.chooseUI(r, k, d) : Promise.resolve(k === 'rebootDir' || k === 'anyDir' ? (d && d.def) || 0 : null),
      program: r => live() ? this.doProgram(r) : Promise.resolve(),
      scramble: (a, b2) => applyScramble(this.st, b2),
      radio: (a, b2) => applyRadio(this.st, a, b2),
      shop: (r, offers) => !live() ? Promise.resolve(null)
        : (r.isBot ? mBotShop(this.st, r, offers) : mShopUI(this, r, offers)),
      tempWindow: (r, when) => live() ? mTempWindow(this, r, when) : Promise.resolve()
    };
    this.mode = 'play';
    $('#overlay').innerHTML = '';
    $('#overlay').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#btn-menu').onclick = () => { this.gen++; this.running = false; Setup.show(); };
    this.layout();
    this.renderDockIdle();
    this.running = true;
    this.loop(gen);
  },
  async loop(gen) {
    const st = this.st;
    let guard = 0;
    while (!st.over && this.gen === gen && guard++ < 300) await playRound(st, this.io);
    if (this.gen !== gen) return;
    this.mode = 'over';
    this.render();
    this.showGameOver();
  },

  /* --- Layout ----------------------------------------------------------- */
  layout() {
    if (!this.view) this.view = new BoardView($('#board'));
    const wrap = $('#boardwrap');
    const w = wrap.clientWidth - 12, h = Math.max(240, window.innerHeight - 260);
    this.view.fit(this.st.board, w, h);
    this.render();
  },
  render(opts) {
    if (!this.st) return;
    this.view.draw(this.st, Object.assign({ showStarts: this.st.turn === 0 }, opts || {}));
    this.renderHud();
    this.renderSide();
  },
  renderHud() {
    const st = this.st;
    $('#hud').innerHTML = '';
    const add = (label, val, cls) => {
      const d = el('div', 'stat ' + (cls || ''));
      d.appendChild(el('span', 'k', label));
      d.appendChild(el('span', 'v', val));
      $('#hud').appendChild(d);
    };
    add('Runde', st.turn || '—');
    add('Register', st.register ? st.register + '/5' : '—', st.register ? 'hot' : '');
    add('Kurs', st.board.name);
    add('Seed', st.seed);
  },
  renderSide() {
    const box = $('#side');
    box.innerHTML = '';
    if (this.modern) return mRenderSide(box, this.st);
    for (const r of this.st.robots) {
      const card = el('div', 'rob' + (r.out ? ' out' : '') + (r.destroyed ? ' wreck' : ''));
      card.style.setProperty('--rc', r.color);
      const top = el('div', 'rob-top');
      top.appendChild(el('span', 'chip'));
      top.appendChild(el('span', 'nm', r.name));
      const tag = el('span', 'tag', r.isBot ? 'Bot ' + r.level : 'Mensch');
      top.appendChild(tag);
      card.appendChild(top);

      const bars = el('div', 'bars');
      const dmg = el('div', 'bar dmg');
      for (let i = 0; i < 10; i++) {
        const p = el('i', i < r.dmg ? 'on' : '');
        if (i >= 4) p.classList.add('lock');
        dmg.appendChild(p);
      }
      bars.appendChild(dmg);
      card.appendChild(bars);

      const meta = el('div', 'meta');
      meta.appendChild(el('span', '', '♥ ' + Math.max(0, r.lives)));
      meta.appendChild(el('span', '', '⚑ ' + (r.nextFlag - 1) + '/' + this.st.totalFlags));
      if (r.poweredDown) meta.appendChild(el('span', 'pd', 'aus'));
      if (r.virtual) meta.appendChild(el('span', 'pd', 'virtuell'));
      if (r.out) meta.appendChild(el('span', 'pd', 'ausgeschieden'));
      card.appendChild(meta);

      if (r.options.length) {
        const os = el('div', 'opts');
        for (const o of r.options) {
          const t = el('span', 'opt', OPTIONS[o.id].n + (OPTIONS[o.id].payload ? ' ' + o.payload : ''));
          t.title = OPTIONS[o.id].d;
          os.appendChild(t);
        }
        card.appendChild(os);
      }
      box.appendChild(card);
    }
  },

  /* --- Animation -------------------------------------------------------- */
  wait(ms) {
    return new Promise(res => {
      const done = () => res();
      if (this.stepping) { this.stepResolve = done; this.setStepUI(true); return; }
      const t = Math.max(0, ms / this.speed);
      const tick = () => {
        if (this.paused) { setTimeout(tick, 60); return; }
        setTimeout(done, t);
      };
      tick();
    });
  },
  setStepUI(waiting) {
    const b = $('#btn-step');
    if (b) b.classList.toggle('ready', !!waiting);
  },
  nextStep() {
    if (this.stepResolve) { const f = this.stepResolve; this.stepResolve = null; this.setStepUI(false); f(); }
  },
  async tween(dur, apply) {
    if (this.stepping) { apply(1); this.render(); await this.wait(0); return; }
    const t0 = performance.now(), d = Math.max(30, dur / this.speed);
    return new Promise(res => {
      const frame = now => {
        if (this.paused) { requestAnimationFrame(frame); return; }
        const t = Math.min(1, (now - t0) / d);
        apply(t);
        this.render();
        if (t < 1) requestAnimationFrame(frame); else res();
      };
      requestAnimationFrame(frame);
    });
  },
  flash(f, ms) {
    f.t = 0;
    this.view.flashes.push(f);
    return this.tween(ms, t => { f.t = t; }).then(() => {
      const i = this.view.flashes.indexOf(f);
      if (i >= 0) this.view.flashes.splice(i, 1);
    });
  },
  rob(id) { return this.st.robots.find(r => r.id === id); },

  async animate(ev) {
    const v = this.view;
    try { await this.animateEvent(ev, v); }
    catch (e) { this.log('Anzeigefehler bei „' + ev.t + '": ' + e.message); }
  },
  async animateEvent(ev, v) {
    switch (ev.t) {
      case 'register':
        this.markRegister(ev.n);
        this.render();
        await this.wait(260);
        break;
      case 'reveal':
        this.render();
        await this.wait(120);
        break;
      case 'move': {
        const a = { moving: ev.r, fx: ev.from[0], fy: ev.from[1], tx: ev.to[0], ty: ev.to[1], t: 0 };
        v.anim = a;
        await this.tween(ev.cause === 'belt' ? 220 : 190, t => { a.t = t; });
        v.anim = null;
        this.render();
        break;
      }
      case 'rotate': {
        const a = { turning: ev.r, from: ev.from, to: ev.to, t: 0 };
        v.anim = a;
        await this.tween(180, t => { a.t = t; });
        v.anim = null;
        this.render();
        break;
      }
      case 'teleport': {
        await this.flash({ type: 'burst', at: ev.from, col: '#a98fd0' }, 160);
        this.render();
        await this.flash({ type: 'burst', at: ev.to, col: '#a98fd0' }, 160);
        break;
      }
      case 'laser':
        await this.flash({ type: 'laser', from: ev.from, path: ev.path, kind: ev.kind, n: ev.n }, 220);
        break;
      case 'damage': {
        const r = this.rob(ev.r);
        this.log(r.name + ' nimmt Schaden (' + ev.total + ')');
        await this.flash({ type: 'damage', at: [r.x, r.y] }, 260);
        break;
      }
      case 'absorb': {
        const r = this.rob(ev.r);
        this.log(r.name + ': ' + cardInfo(ev.by).n + ' fängt den Treffer ab');
        await this.flash({ type: 'text', at: [r.x, r.y], msg: 'abgefangen', col: '#48a3b5' }, 320);
        break;
      }
      case 'flame':
        await this.flash({ type: 'burst', at: ev.at, col: '#dd6b20' }, 200);
        break;
      case 'destroy': {
        const r = this.rob(ev.r);
        this.log(r.name + ' zerstört — ' + ev.reason + ' (' + Math.max(0, ev.lives) + ' Leben)');
        v.anim = { dying: ev.r };
        await this.flash({ type: 'burst', at: [r.x, r.y], col: '#d0393b' }, 340);
        v.anim = null;
        this.render();
        break;
      }
      case 'respawn': {
        const r = this.rob(ev.r);
        this.log(r.name + ' kehrt zurück' + (ev.virtual ? ' (virtuell)' : ''));
        await this.flash({ type: 'burst', at: ev.at, col: r.color }, 260);
        break;
      }
      case 'flag': {
        const r = this.rob(ev.r);
        this.log(r.name + ' berührt Flagge ' + ev.n);
        await this.flash({ type: 'text', at: [r.x, r.y], msg: '⚑ ' + ev.n, col: '#f0c419' }, 420);
        break;
      }
      case 'repair': this.render(); break;
      case 'energy': {
        const r = this.rob(ev.r);
        if (ev.gain) await this.flash({ type: 'text', at: [r.x, r.y], msg: '+' + ev.gain + '⚡', col: '#7fc9f0' }, 300);
        else this.render();
        break;
      }
      case 'dmgcard': {
        const r = this.rob(ev.r);
        this.log(r.name + ' nimmt ' + ev.n + '× ' + MCARDNAME[ev.kind]);
        await this.flash({ type: 'text', at: [r.x, r.y], msg: MCARDNAME[ev.kind], col: '#d0393b' }, 300);
        break;
      }
      case 'dmgplay': {
        const r = this.rob(ev.r);
        this.log(r.name + ': ' + MCARDNAME[ev.kind] + ' im Register');
        await this.flash({ type: 'burst', at: [r.x, r.y], col: '#d0393b' }, 220);
        break;
      }
      case 'reboot': {
        const r = this.rob(ev.r);
        this.log(r.name + ' startet neu — ' + ev.reason);
        await this.flash({ type: 'burst', at: ev.at, col: r.color }, 320);
        break;
      }
      case 'upgGain': {
        const r = this.rob(ev.r);
        this.log(r.name + ' baut ' + cardInfo(ev.id).n + ' ein');

        break;
      }
      case 'upgUse': this.log(this.rob(ev.r).name + ' setzt ' + cardInfo(ev.id).n + ' ein'); this.render(); break;
      case 'note': this.log((ev.r ? this.rob(ev.r).name + ' ' : '') + ev.msg); break;
      case 'shop': this.log('Laden: ' + ev.offers.map(i => cardInfo(i).n).join(', ')); break;
      case 'optGain': {
        const r = this.rob(ev.r);
        this.log(r.name + ' erhält ' + cardInfo(ev.id).n);
        await this.flash({ type: 'text', at: [r.x, r.y], msg: cardInfo(ev.id).n, col: '#74ad46' }, 420);
        break;
      }
      case 'optLost': {
        const r = this.rob(ev.r);
        this.log(r.name + ' verliert ' + cardInfo(ev.id).n);
        break;

      case 'abort': this.log(this.rob(ev.r).name + ': Notabschaltung ausgelöst'); break;
      case 'breaker': this.log(this.rob(ev.r).name + ': Sicherungsautomat schaltet ab'); break;
      case 'win': this.log('★ ' + this.rob(ev.r).name + ' gewinnt das Rennen'); break;
      case 'lastStanding': this.log('Nur noch ein Roboter im Rennen'); break;
      case 'endTurn': this.markRegister(0); this.render(); await this.wait(200); break;

  markRegister(n) {

  },
  log(msg) {
    const l = $('#log');

  /* --- Programmierphase -------------------------------------------------- */
  async doProgram(r) {
    if (r.isBot) { botPickWeapon(this.st, r); botChooseProgram(this.st, r); return; }
    const humans = this.st.robots.filter(x => !x.isBot && !x.out);
    if (humans.length > 1) await this.passScreen(r);
    this.render();
    await new Promise(res => this.modern ? mBuildProgramUI(this, r, res) : this.buildProgramUI(r, res));
    $('#dock').innerHTML = '';
    this.renderDockIdle();
  },
  buildProgramUI(r, done) {
    const dock = $('#dock');
    dock.innerHTML = '';
    const wrap = el('div', 'prog');

    const head = el('div', 'prog-head');
    head.appendChild(el('div', 'who', 'Programm für ' + r.name));
    const hint = el('div', 'hint', 'Karte antippen legt sie ins nächste freie Register. Register antippen gibt sie zurück.');
    head.appendChild(hint);
    wrap.appendChild(head);

    const regs = el('div', 'regs');
    const hand = el('div', 'hand');
    const tools = el('div', 'ptools');
    wrap.appendChild(regs); wrap.appendChild(hand); wrap.appendChild(tools);
    dock.appendChild(wrap);

    const combo = hasOpt(r, 'crab_legs') || hasOpt(r, 'dual_processor');

    const redraw = () => {
      regs.innerHTML = ''; hand.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const slot = el('div', 'slot');
        if (isLocked(r, i + 1)) slot.classList.add('locked');
        slot.appendChild(el('div', 'sn', String(i + 1)));
        const e = r.regs[i];
        if (e) {
          slot.appendChild(this.cardEl(e.c, e.mode));
          if (e.sub) slot.appendChild(this.cardEl(e.sub, null, true));
          if (!isLocked(r, i + 1)) slot.onclick = () => {
            if (e.sub) { r.hand.push(e.sub); e.sub = null; e.mode = null; }
            else { r.hand.push(e.c); r.regs[i] = null; }
            redraw();
          };
        } else if (isLocked(r, i + 1)) {
          slot.appendChild(el('div', 'lockmark', '⌧'));
        }
        regs.appendChild(slot);
      }
      r.hand.forEach((c, ci) => {
        const ce = this.cardEl(c);
        ce.onclick = () => {
          // Zweitkarte in ein Register legen (Krebsbeine / Doppelprozessor)
          if (combo && this.selected != null && this.selected.reg != null) {
            const e = r.regs[this.selected.reg];
            const mode = comboMode(r, e.c, c);
            if (e && !e.sub && mode) {
              e.sub = c; e.mode = mode;
              r.hand.splice(ci, 1);
              this.selected = null; redraw(); return;
            }
          }
          const free = r.regs.findIndex((v, i) => !v && !isLocked(r, i + 1));
          if (free < 0) return;
          r.regs[free] = { c, sub: null, mode: null };
          r.hand.splice(ci, 1);
          redraw();
        };
        hand.appendChild(ce);
      });
      if (combo) {
        for (let i = 0; i < 5; i++) {
          const e = r.regs[i];
          if (!e || e.sub || isLocked(r, i + 1)) continue;
          const slot = regs.children[i];
          const plus = el('button', 'plus', '+');
          plus.title = 'Zweite Karte in dieses Register';
          plus.onclick = ev2 => {
            ev2.stopPropagation();
            this.selected = this.selected && this.selected.reg === i ? null : { reg: i };
            redraw();
          };
          if (this.selected && this.selected.reg === i) plus.classList.add('armed');
          slot.appendChild(plus);
        }
      }
      const filled = r.regs.every((e, i) => e || isLocked(r, i + 1));
      ready.disabled = !filled;
      ready.textContent = filled ? 'Programm ausführen' : (5 - r.regs.filter(Boolean).length) + ' Register offen';
    };

    // Werkzeuge: Abschaltung, Waffe, Optionen
    const pd = el('label', 'toggle');
    const pdc = el('input'); pdc.type = 'checkbox'; pdc.checked = r.announcePD;
    pdc.onchange = () => { r.announcePD = pdc.checked; };
    pd.appendChild(pdc); pd.appendChild(el('span', '', 'Nächste Runde abschalten'));
    tools.appendChild(pd);

  async askRuntime(r, id, q) {
    if (r.isBot) return this.modern ? mBotAnswer(this.st, r, id, {}) : botAnswer(this.st, r, id, {});
    if (this.modern) {
      const up = hasUpg(r, id) || heldTemp(r).find(x => x.id === id);

    if (pol === 'nein') return false;

          for (let i = 1; i <= 5; i++)

      const tbl = el('div', 'result');
      for (const r of [...this.st.robots].sort((a, z) => (z.nextFlag - a.nextFlag) || (z.lives - a.lives))) {

};

/* Welcher Kombimodus passt zu den beiden Karten? */
function comboMode(r, main, extra) {
  if (hasOpt(r, 'crab_legs') && main.t === 'm1' && (extra.t === 'rl' || extra.t === 'rr')) return 'crab';
  if (hasOpt(r, 'dual_processor') && isMove(main) && isTurn(extra) && baseSteps(main) > 0) return 'dual';
  return null;
}
/* Kursverkuerzung: nur die ersten n Flaggen behalten */
function trimFlags(b, n) {
  for (const c of b.cells) if (c.flag && c.flag > n) delete c.flag;
}

/* --- Programmierung ------------------------------------------------------ */
function mBuildProgramUI(app, r, done) {
  const st = app.st;
  const dock = $('#dock');
  dock.innerHTML = '';
  const wrap = el('div', 'prog');
  const head = el('div', 'prog-head');
  head.appendChild(el('div', 'who', 'Programm für ' + r.name));
  head.appendChild(el('div', 'hint', 'Karte antippen legt sie ins nächste freie Register. Schadenskarten musst du mitprogrammieren, wenn du sonst nicht auf fünf kommst.'));
  wrap.appendChild(head);
  const regs = el('div', 'regs');
  const hand = el('div', 'hand');
  const tools = el('div', 'ptools');
  wrap.appendChild(regs); wrap.appendChild(hand); wrap.appendChild(tools);
  dock.appendChild(wrap);

  let ready;
  const redraw = () => {
    regs.innerHTML = ''; hand.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const slot = el('div', 'slot');
      slot.appendChild(el('div', 'sn', String(i + 1)));
      const e = r.regs[i];
      if (e) {
        slot.appendChild(mCardEl(e.c));
        slot.onclick = () => { r.hand.push(e.c); r.regs[i] = null; redraw(); };
      }
      regs.appendChild(slot);
    }
    r.hand.forEach((c, ci) => {
      const ce = mCardEl(c);
      ce.onclick = () => {
        // „Wiederholung" darf nicht ins erste Register
        const first = (c.t === 'again' || c.t === 'r_repeat') ? 1 : 0;
        let free = -1;
        for (let i = first; i < 5; i++) if (!r.regs[i]) { free = i; break; }
        if (free < 0) {
          $('.prog-head .hint').textContent = first
            ? 'Wiederholung darf nicht ins erste Register — dort passt sie nirgends mehr hin.'
            : 'Alle Register sind belegt.';
          return;
        }
        r.regs[free] = { c, sub: null, mode: null };
        r.hand.splice(ci, 1);
        redraw();
      };
      hand.appendChild(ce);
    });
    buildTools();
    const filled = r.regs.every(Boolean);
    ready.disabled = !filled;
    ready.textContent = filled ? 'Programm ausführen' : (5 - r.regs.filter(Boolean).length) + ' Register offen';
  };

  function buildTools() {
    tools.innerHTML = '';
    const e = el('div', 'stat');
    e.appendChild(el('span', 'k', 'Energie'));
    e.appendChild(el('span', 'v', String(r.energy)));
    tools.appendChild(e);
    const d = el('div', 'stat');
    d.appendChild(el('span', 'k', 'Deck'));
    d.appendChild(el('span', 'v', r.deck.length + '+' + r.disc.length));
    tools.appendChild(d);

    for (const u of heldTemp(r)) {
      const rt = UPGRADES[u.id].routine;
      const gone = rt && !st.special[rt];
      const b = el('button', 'ctl temp', UPGRADES[u.id].n);
      b.title = gone ? MCARDNAME[rt] + ' ist schon vergeben — die Karte bringt nichts mehr.'
                     : UPGRADES[u.id].d;
      b.disabled = !!gone;
      b.onclick = async () => { await useTemp(st, r, u.id, app.io); redraw(); };
      tools.appendChild(b);
    }
    for (const id of ['dings_defrag', 'zwischenspeicher']) {
      if (!hasUpg(r, id) || r.usedThisRound[id]) continue;
      const b = el('button', 'ctl', UPGRADES[id].n);
      b.title = UPGRADES[id].d;
      b.onclick = async () => { await useRoundPower(st, r, id, app.io); redraw(); };
      tools.appendChild(b);
    }
    const ASKABLE = ['bremse', 'teleporter', 'deflektorschild', 'mini_haubitze',
                     'schubsstrahl', 'magnetstrahl', 'korruptionswelle', 'blauer_todesbildschirm'];
    for (const id of ASKABLE) {
      const up = hasUpg(r, id);
      if (!up) continue;
      const sel = el('select', 'sel');
      for (const [v, t] of [['fragen', 'fragen'], ['ja', 'immer'], ['nein', 'nie']]) {
        const oe = el('option', '', t); oe.value = v; sel.appendChild(oe);
      }
      sel.value = up.policy || 'fragen';
      sel.onchange = () => { up.policy = sel.value; };
      const lb = el('label', 'toggle');
      lb.title = UPGRADES[id].d;
      lb.appendChild(el('span', '', UPGRADES[id].n));
      lb.appendChild(sel);
      tools.appendChild(lb);
    }
    ready = el('button', 'go');
    ready.onclick = () => done();
    tools.appendChild(ready);
    const filled = r.regs.every(Boolean);
    ready.disabled = !filled;
    ready.textContent = filled ? 'Programm ausführen' : (5 - r.regs.filter(Boolean).length) + ' Register offen';
  }
  redraw();
}

function mCardEl(c) {
  const dmg = isDmgCard(c);
  const e = el('div', 'card mod ' + (dmg ? 'dmg ' + c.t : (isTurn(c) ? 'turn' : 'move')));
  e.appendChild(el('div', 'cl', MCARDLABEL[c.t] || '?'));
  e.appendChild(el('div', 'cp', MCARDNAME[c.t] || c.t));
  e.title = MCARDNAME[c.t] || c.t;
  return e;
}

async function mChooseUI(app, r, kind, data) {

        b.appendChild(el('p', '', data.prompt || 'In welche Richtung soll der Roboter blicken?'));
        app.btnRow(b, [0, 1, 2, 3].map(d => [DIRLABEL[d], d]), close);
      });
    case 'sandbox':
      return app.modal(r.name + ' · Befehl wählen', (b, close) => {
        b.appendChild(el('p', '', 'Welcher Grundbefehl soll ausgeführt werden?'));
        const list = ['m1', 'm2', 'm3', 'bu', 'rl', 'rr', 'u'].concat(data.extra ? ['again'] : []);
        app.btnRow(b, list.map(t => [MCARDNAME[t], t]), close);
      });
    case 'crabSide':
      return app.modal(r.name + ' · Krabbenbeine', (b, close) => {
        b.appendChild(el('p', '', 'Ein Feld vor, eines zur Seite, eines vor — ohne dich zu drehen.'));
        app.btnRow(b, [['nach links', 'links'], ['nach rechts', 'rechts'], ['normal laufen', null]], close);
      });
    case 'pickCards':
      return mPickCards(app, r, data);
    case 'dropUpgrade':
      return app.modal(r.name + ' · Steckplatz belegt', (b, close) => {
        b.appendChild(el('p', '', UPGRADES[data.incoming].n + ' passt nur, wenn etwas weichen muss.'));
        app.btnRow(b, (data.ids || []).map(id => [UPGRADES[id].n, id, UPGRADES[id].d])
          .concat([['Kauf verfallen lassen', null]]), close);
      });
    case 'stealUpgrade':
      return app.modal(r.name + ' · Modulares Chassis', (b, close) => {
        b.appendChild(el('p', '', 'Nimm ein Upgrade von ' + data.target.name + ' und gib das Chassis ab.'));
        app.btnRow(b, data.target.upgrades.map(u => [UPGRADES[u.id].n, u.id, UPGRADES[u.id].d])
          .concat([['nichts nehmen', null]]), close);
      });
    default: return null;
  }
}

function mPickCards(app, r, data) {
  return app.modal(r.name + ' · Karten wählen', (b, close) => {
    b.appendChild(el('p', '', data.prompt || 'Karten auswählen'));
    const sel = new Set();
    const row = el('div', 'hand');
    r.hand.forEach((c, i) => {
      const ce = mCardEl(c);
      ce.onclick = () => {
        if (sel.has(i)) sel.delete(i);
        else if (!data.n || sel.size < data.n) sel.add(i);
        ce.classList.toggle('picked', sel.has(i));
        okb.textContent = data.n ? 'Übernehmen (' + sel.size + '/' + data.n + ')' : 'Übernehmen (' + sel.size + ')';
      };
      row.appendChild(ce);
    });
    b.appendChild(row);
    const okb = el('button', 'go', data.n ? 'Übernehmen (0/' + data.n + ')' : 'Übernehmen (0)');
    okb.onclick = () => close([...sel]);
    const none = el('button', 'ghost', 'Nichts wählen');
    none.onclick = () => close([]);
    const brow = el('div', 'brow');
    brow.appendChild(okb); brow.appendChild(none);
    b.appendChild(brow);
  });
}

/* Fenster für temporäre Karten mitten in der Ausführung */
async function mTempWindow(app, r, when) {
  if (r.isBot) return mBotTemps(app.st, r, app.io, when);
  if (r.rebooted || r._noAsk === app.st.turn) return;
  const usable = heldTemp(r);
  if (!usable.length) return;
  const pick = await app.modal(r.name + ' · Register ' + app.st.register, (b, close) => {
    b.appendChild(el('p', '', 'Temporäre Karte einsetzen, bevor das Register läuft?'));
    app.btnRow(b, usable.map(u => [UPGRADES[u.id].n, u.id, UPGRADES[u.id].d])
      .concat([['Weiter', null], ['Diese Runde nicht mehr fragen', 'quiet']]), close);
  });
  if (pick === 'quiet') { r._noAsk = app.st.turn; return; }
  if (pick) await useTemp(app.st, r, pick, app.io);
}
