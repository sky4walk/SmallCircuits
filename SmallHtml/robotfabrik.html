<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robotfabrik</title>
<style>
:root{
  --floor:#1b1917; --panel:#232019; --panel2:#2b2720; --line:#3d382e;
  --ink:#ede7d8; --dim:#8f877a;
  --yellow:#f0c419; --orange:#dd6b20; --red:#d0393b; --cyan:#48a3b5; --green:#74ad46;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --hazard:repeating-linear-gradient(45deg,#3d382e 0 6px,#2b2720 6px 12px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--floor); color:var(--ink);
  font:400 14px/1.5 var(--mono);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(30px,7vw,54px);letter-spacing:.22em;line-height:1.05}
h2{font-size:15px}
h3{font-size:12px;color:var(--yellow);letter-spacing:.24em}
p{margin:0 0 10px}
.dim{color:var(--dim)}

/* ---------- Rahmen ---------- */
#app{display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:16px;padding:10px 14px;
  background:var(--panel);border-bottom:2px solid var(--line);flex-wrap:wrap;
}
.brand{font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:13px;color:var(--yellow);white-space:nowrap}
.brand::before{content:"";display:inline-block;width:10px;height:10px;margin-right:9px;background:var(--yellow);vertical-align:-1px}
#hud{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.stat{display:flex;gap:7px;align-items:baseline;padding:3px 9px;background:var(--panel2);border:1px solid var(--line)}
.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-weight:700}
.stat.hot{border-color:var(--yellow)}
.stat.hot .v{color:var(--yellow)}

main{display:flex;flex:1;min-height:0;gap:12px;padding:12px}
#boardwrap{flex:1;display:flex;align-items:flex-start;justify-content:center;min-width:0;overflow:auto}
#board{background:#141210;border:2px solid var(--line);image-rendering:auto}
#sidewrap{width:250px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;min-height:0}
#side{display:flex;flex-direction:column;gap:8px;overflow:auto;flex-shrink:0;max-height:55%}

/* ---------- Roboterkarten ---------- */
.rob{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rc);padding:8px 10px}
.rob.out{opacity:.4}
.rob.wreck{border-left-color:var(--red)}
.rob-top{display:flex;align-items:center;gap:7px}
.chip{width:11px;height:11px;background:var(--rc);flex-shrink:0}
.rob-top .nm{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.bar{display:flex;gap:2px;margin:7px 0 5px}
.bar i{flex:1;height:7px;background:#332f27;border-top:1px solid #3f3a30}
.bar i.on{background:var(--red)}
.bar i.lock{border-top-color:var(--yellow)}
.bar i.lock.on{background:#8f2b2d}
.meta{display:flex;gap:10px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.meta .pd{color:var(--orange)}
.opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.opt{font-size:10px;padding:2px 5px;background:var(--panel2);border:1px solid var(--line);color:var(--cyan);cursor:help}

/* ---------- Steuerleiste ---------- */
#dock{background:var(--panel);border-top:2px solid var(--line);padding:10px 14px;min-height:74px}
.runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctl{background:var(--panel2);border:1px solid var(--line);padding:7px 13px;cursor:pointer;letter-spacing:.06em}
.ctl:hover{border-color:var(--yellow)}
.ctl.ready{border-color:var(--yellow);color:var(--yellow);animation:pulse 1.1s infinite}
@keyframes pulse{50%{background:#3a3320}}
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.toggle input[type=checkbox]{accent-color:var(--yellow);width:15px;height:15px}
.sel{background:var(--panel2);border:1px solid var(--line);padding:5px 7px}
.speed{width:90px;accent-color:var(--yellow)}
.spv{color:var(--ink);min-width:34px}

/* ---------- Register: das Kernstück ---------- */
.regs{display:flex;gap:8px;flex-wrap:wrap}
.slot{
  position:relative;width:74px;height:96px;
  background:var(--panel2);
  border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s, box-shadow .15s;
}
.slot::before,.slot::after{
  content:"";position:absolute;left:-2px;right:-2px;height:5px;
  background:var(--hazard);pointer-events:none;opacity:.8;
}
.slot::before{top:-2px}
.slot::after{bottom:-2px}
.slot.active{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(240,196,25,.22),inset 0 0 22px rgba(240,196,25,.10)}
.slot.locked{border-color:var(--red)}
.slot .sn{position:absolute;top:7px;left:5px;font-size:10px;color:var(--dim);letter-spacing:.1em;z-index:2}
.slot.active .sn{color:var(--yellow)}
.lockmark{color:var(--red);font-size:22px}
.regs.mini .slot{width:34px;height:44px}
.regs.mini .card{display:none}
.plus{position:absolute;bottom:2px;right:3px;width:19px;height:19px;line-height:1;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer;z-index:3;padding:0}
.plus.armed{border-color:var(--yellow);color:var(--yellow)}

/* ---------- Karten ---------- */
.card{
  width:56px;height:78px;background:var(--panel);border:1px solid var(--line);
  border-top:3px solid var(--cyan);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;user-select:none;position:relative;z-index:2;
}
.card.turn{border-top-color:var(--orange)}
.card:hover{border-color:var(--yellow)}
.card .cl{font-size:26px;font-weight:700;line-height:1}
.card .cp{font-size:10px;color:var(--dim)}
.card.sub{width:34px;height:48px;margin-left:-14px;margin-top:26px}
.card.sub .cl{font-size:16px}
.card.sub .cp{display:none}
.slot .card{cursor:default}

/* ---------- Fassung 2016 ---------- */
.card.mod .cp{font-size:8px;line-height:1.15;text-align:center;padding:0 2px;
  word-break:break-word;max-height:26px;overflow:hidden}
.card.dmg{border-top-color:var(--red);background:#2e2020}
.card.dmg .cl{color:var(--red)}
.card.picked{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(240,196,25,.3)}
.meta .en{color:var(--cyan)}
.meta .bad{color:var(--red)}
.opt.temp{color:var(--orange)}
.ctl.temp{border-color:var(--orange);color:var(--orange)}
.shop{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ucard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--yellow);
  padding:9px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;
  width:200px}
.ucard.temp{border-left-color:var(--orange)}
.ucard:hover:not(:disabled){border-color:var(--yellow)}
.ucard.poor{opacity:.4;cursor:not-allowed}
.uhead{display:flex;align-items:center;gap:8px}
.ucost{background:var(--yellow);color:#1b1917;font-weight:700;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uname{font-weight:700;letter-spacing:.04em;font-size:12px}
.ukind{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ucard small{color:var(--dim);font-size:10px;line-height:1.4}

/* ---------- Programmierung ---------- */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.who{font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.hint{font-size:11px;color:var(--dim)}
.hint.err{color:var(--red)}
.hand{display:flex;gap:6px;flex-wrap:wrap}
.ptools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line)}
.go{background:var(--yellow);color:#1b1917;border:none;padding:9px 18px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.go:disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed}
.go.big{padding:14px 30px;font-size:15px}
.ghost{background:none;border:1px solid var(--line);color:var(--dim);padding:9px 16px;cursor:pointer;letter-spacing:.08em}
.ghost:hover{border-color:var(--yellow);color:var(--ink)}

/* ---------- Overlay ---------- */
#overlay{position:fixed;inset:0;background:rgba(15,13,11,.93);overflow:auto;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:50}
.modal,.setup,.editor{background:var(--panel);border:2px solid var(--line);padding:22px;width:100%}
.modal{max-width:520px;margin:auto}
.setup{max-width:760px}
.editor{max-width:1100px}
.mbody{margin-top:12px}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.opt-btn{background:var(--panel2);border:1px solid var(--line);padding:10px 14px;text-align:left;
  cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:120px}
.opt-btn:hover{border-color:var(--yellow)}
.opt-btn small{color:var(--dim);font-size:10px;max-width:230px}
.pass{font-size:18px;font-weight:700;letter-spacing:.1em}

/* ---------- Startbildschirm ---------- */
.hero{border-bottom:2px solid var(--line);padding-bottom:18px;margin-bottom:18px}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--yellow);margin-bottom:10px}
.lede{color:var(--dim);max-width:48ch;margin-top:12px}
.sec{margin-bottom:20px}
.sec h3{margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chips .lbl{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-right:4px}
.chip-btn{background:var(--panel2);border:1px solid var(--line);padding:7px 13px;cursor:pointer;letter-spacing:.06em}
.chip-btn.sm{padding:5px 11px}
.chip-btn.on{border-color:var(--yellow);color:var(--yellow)}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-left:4px solid var(--rc);padding:6px 9px}
.nin{background:var(--floor);border:1px solid var(--line);padding:6px 8px;min-width:0;flex:1}
.prow .x{background:none;border:none;color:var(--dim);cursor:pointer;font-size:17px;padding:0 5px}
.prow .x:hover{color:var(--red)}
.sfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:16px;border-top:2px solid var(--line)}
.help{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.help summary{cursor:pointer;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.helpbody{margin-top:10px;color:var(--dim);max-width:62ch}
.result{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.rrow{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--panel2);border-left:4px solid var(--rc)}
.rrow .nm{flex:1;font-weight:700}

/* ---------- Editor ---------- */
.ehead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.emain{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;width:220px;flex-shrink:0;
  max-height:60vh;overflow:auto}
.tool{background:var(--panel2);border:1px solid var(--line);padding:6px 7px;cursor:pointer;
  font-size:11px;text-align:left}
.tool.on{border-color:var(--yellow);color:var(--yellow)}
.ecanvas{flex:1;min-width:0;overflow:auto}
#edboard{border:2px solid var(--line);cursor:crosshair;background:#141210}
.efoot{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.json{width:100%;height:90px;background:var(--floor);border:1px solid var(--line);
  padding:8px;font-size:11px;margin:8px 0;resize:vertical}

/* ---------- Protokoll ---------- */
#log{margin-top:8px;flex:1;min-height:80px;overflow:auto;background:var(--panel);
  border:1px solid var(--line);padding:7px 9px;font-size:11px;line-height:1.7;color:var(--dim)}
#log .line{border-bottom:1px dotted #2f2b24;padding-bottom:2px}

/* ---------- Testbericht ---------- */
.testout{margin:14px 0;max-height:60vh;overflow:auto;font-size:12px}
.tline{display:flex;gap:9px;padding:3px 0;border-bottom:1px dotted #2f2b24}
.tline .mark{width:14px}
.tline.ok .mark{color:var(--green)}
.tline.fail .mark{color:var(--red)}
.tline.fail{color:var(--red)}
.tline .nm{flex:1}
.tline .msg{color:var(--orange);flex:2}
.tsum{padding:8px 0;font-weight:700;color:var(--green);border-bottom:2px solid var(--line);margin-bottom:8px}
.tsum.bad{color:var(--red)}

@media (max-width:820px){
  main{flex-direction:column;padding:8px;gap:8px}
  #sidewrap{width:100%}
  #side{flex-direction:row;overflow-x:auto;max-height:none}
  .rob{min-width:170px}
  #log{display:none}
  .pal{width:100%;grid-template-columns:repeat(3,1fr);max-height:150px}
  .slot{width:60px;height:82px}
  .card{width:46px;height:66px}
  .card .cl{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>
<div id="app" class="hidden">
  <header>
    <div class="brand">Robotfabrik</div>
    <div id="hud"></div>
    <button id="btn-menu" class="ctl">Menü</button>
  </header>
  <main>
    <div id="boardwrap"><canvas id="board"></canvas></div>
    <aside id="sidewrap"><div id="side"></div><div id="log"></div></aside>
  </main>
  <div id="dock"></div>
</div>
<div id="overlay"></div>
<script>
/* ============================================================================
   ROBOTFABRIK — Engine
   Richtungen: 0=Nord(y-1) 1=Ost(x+1) 2=Sued(y+1) 3=West(x-1)
   Wandmaske:  1=N 2=O 4=S 8=W
   ========================================================================= */

const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const WBIT = [1, 2, 4, 8];
const DIRNAME = ['N', 'O', 'S', 'W'];
const opp = d => (d + 2) & 3;
const cw = d => (d + 1) & 3;
const ccw = d => (d + 3) & 3;

/* --- Deterministischer PRNG (mulberry32) ------------------------------- */
function makeRng(seed) {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.int = n => Math.floor(f() * n);
  f.shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = f.int(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  f.pick = arr => arr[f.int(arr.length)];
  return f;
}

/* --- Programmkarten ---------------------------------------------------- */
/* 84 Karten, Originalverteilung. p = Prioritaet (hoch zieht zuerst). */
function buildProgramDeck() {
  const d = [];
  const add = (t, from, to, step) => { for (let p = from; p <= to; p += step) d.push({ t, p }); };
  add('u', 10, 60, 10);       //  6x U-Turn
  add('rl', 70, 410, 20);     // 18x Links
  add('rr', 80, 420, 20);     // 18x Rechts
  add('bu', 430, 480, 10);    //  6x Rueckwaerts
  add('m1', 490, 660, 10);    // 18x Move 1
  add('m2', 670, 780, 10);    // 12x Move 2
  add('m3', 790, 840, 10);    //  6x Move 3
  return d;
}
const CARDLABEL = { u: 'U', rl: '↺', rr: '↻', bu: 'B', m1: '1', m2: '2', m3: '3' };
const CARDNAME = { u: 'Kehrtwende', rl: 'Links', rr: 'Rechts', bu: 'Rückwärts', m1: 'Vor 1', m2: 'Vor 2', m3: 'Vor 3' };
const isMove = c => c && (c.t === 'm1' || c.t === 'm2' || c.t === 'm3' || c.t === 'bu');
const isTurn = c => c && (c.t === 'u' || c.t === 'rl' || c.t === 'rr');
/* Grundschrittzahl, negativ = rueckwaerts */
const baseSteps = c => ({ m1: 1, m2: 2, m3: 3, bu: -1 }[c.t] || 0);

/* --- Board ------------------------------------------------------------- */
function emptyBoard(w, h, name) {
  const cells = [];
  for (let i = 0; i < w * h; i++) cells.push({});
  return { name: name || 'Namenlos', w, h, cells };
}
function cellAt(b, x, y) {
  if (x < 0 || y < 0 || x >= b.w || y >= b.h) return null;
  return b.cells[y * b.w + x];
}
const inBounds = (b, x, y) => x >= 0 && y >= 0 && x < b.w && y < b.h;

/* Blockiert eine Wand die Bewegung von (x,y) in Richtung d?
   Normale Waende zaehlen von beiden Seiten, Einwegwaende nur von ihrer Seite. */
function wallBlocks(b, x, y, d) {
  // Die Führungsspielerantenne wirkt wie eine Wand: weder durchlaufen noch
  // durchschieben noch durchschießen, und niemand darf auf ihrem Feld stehen.
  const t = cellAt(b, x + DX[d], y + DY[d]);
  if (t && t.antenna) return true;
  const a = cellAt(b, x, y);
  if (a) {
    if ((a.w || 0) & WBIT[d]) return true;
    if ((a.ow || 0) & WBIT[d]) return true;   // Einwegwand: rote Seite
  }
  const c = cellAt(b, x + DX[d], y + DY[d]);
  if (c && ((c.w || 0) & WBIT[opp(d)])) return true;
  // Einwegwand der Nachbarzelle wirkt von dieser Seite NICHT (gruene Seite)
  return false;
}
/* Laser werden von normalen Waenden immer geblockt, von Einwegwaenden
   ebenfalls nur aus ihrer roten Richtung. */
const laserBlocked = wallBlocks;

/* Aktiv in dieser Registerphase? phases ist 1-basiert */
const activeIn = (list, reg) => !!list && list.indexOf(reg) >= 0;

/* --- Roboter ----------------------------------------------------------- */
function makeRobot(id, name, color, x, y, dir, opts) {
  return {
    id, name, color,
    x, y, dir,
    ax: x, ay: y, adir: dir,          // Archivmarker
    dmg: 0, lives: 3,
    hand: [], regs: [null, null, null, null, null],
    poweredDown: false, announcePD: false,
    destroyed: false, out: false, virtual: false,
    nextFlag: 1, finished: false,
    options: [],                       // [{id, payload, policy, facing, held}]
    lockOrder: [5, 4, 3, 2, 1],        // Sperrreihenfolge der Register
    weapon: 'main',                    // gewaehlte Hauptbewaffnung
    sacrifice: 'lethal',               // nie | lethal | immer
    isBot: false, level: 2,
    // Fassung 2026: eigenes Deck, Energie, Upgrades
    deck: [], disc: [], energy: 5, upgrades: [],
    rebooted: false, claimPriority: 0, usedThisRound: {}, usedThisReg: {},
    ...opts
  };
}
/* Sperrung: bei 5+ Schaden sperren Register in der Reihenfolge r.lockOrder.
   Standard 5,4,3,2,1 — der Zielrechner darf diese Reihenfolge veraendern. */
const lockCount = r => Math.max(0, Math.min(5, r.dmg - 4));
const isLocked = (r, reg) => r.lockOrder.slice(0, lockCount(r)).indexOf(reg) >= 0;
const handSize = r => Math.max(0, 9 - r.dmg + (hasOpt(r, 'extra_memory') ? 1 : 0));

/* --- Zustand ----------------------------------------------------------- */
function newState(board, robots, seed, cfg) {
  const rng = makeRng(seed);
  const st = {
    board, robots, seed, rng,
    rules: (cfg && cfg.rules) || 'classic',
    cfg: Object.assign({ flags: 3, immortal: false, optionsOn: true }, cfg || {}),
    deck: rng.shuffle(buildProgramDeck()),
    discard: [],
    optDeck: rng.shuffle(buildOptionDeck()),
    optDiscard: [],
    turn: 0, register: 0,
    over: false, winner: null,
    log: []
  };
  st.totalFlags = countFlags(board);
  if (st.rules === 'modern') {
    st.piles = { spam: 38, virus: 18, trojan: 12, worm: 6 };
    st.upgDeck = rng.shuffle(buildUpgradeDeck());
    st.upgDisc = [];
    st.shop = [];
    st.shopStale = false;
    /* Sechs spezielle Programmierkarten, je eine Sorte. Ist eine vergeben,
       bleibt sie im Deck ihres Besitzers und kommt nicht zurueck. */
    st.special = {};
    for (const k of Object.keys(ROUTINES)) st.special[k] = 1;
    st.cubes = {};
    for (let i = 0; i < board.cells.length; i++)
      if (board.cells[i].energy) st.cubes[(i % board.w) + ',' + ((i / board.w) | 0)] = true;
    for (const r of robots) {
      r.deck = rng.shuffle(buildPlayerDeck());
      r.disc = [];
      r.energy = 5;
    }
  }
  return st;
}
function countFlags(b) {
  let n = 0;
  for (const c of b.cells) if (c.flag && c.flag > n) n = c.flag;
  return n;
}
function drawCard(st) {
  if (!st.deck.length) { st.deck = st.rng.shuffle(st.discard); st.discard = []; }
  return st.deck.pop() || { t: 'm1', p: 500 };
}
function robotAt(st, x, y) {
  return st.robots.find(r => !r.destroyed && !r.out && !r.virtual && r.x === x && r.y === y) || null;
}

/* ============================================================================
   BEWEGUNG
   ========================================================================= */

/* Schubkette aufloesen. Gibt die Liste der zu bewegenden Roboter zurueck
   (Reihenfolge: hinterster zuerst), oder null wenn blockiert. */
function pushChain(st, r, d) {
  const chain = [];
  let cx = r.x, cy = r.y, cur = r;
  for (;;) {
    chain.push(cur);
    if (wallBlocks(st.board, cx, cy, d)) return null;
    const nx = cx + DX[d], ny = cy + DY[d];
    if (!inBounds(st.board, nx, ny)) break;         // Rand: faellt runter, kein Block
    const other = robotAt(st, nx, ny);
    if (!other) break;
    if (other === r) return null;                    // Zyklus (sollte nicht auftreten)
    cur = other; cx = nx; cy = ny;
  }
  return chain.reverse();
}

/* Ein Feld weit bewegen, inkl. Schieben. Liefert true wenn der Ausloeser
   sich bewegt hat. */
async function stepMove(st, r, d, cause, io) {
  if (r.destroyed || r.out) return false;
  const chain = pushChain(st, r, d);
  if (!chain) return false;

  const pushed = chain.filter(x => x !== r);
  if (pushed.length) await onPush(st, r, pushed, d, io);

  for (const m of chain) {
    const fx = m.x, fy = m.y;
    m.x += DX[d]; m.y += DY[d];
    await io.emit({ t: 'move', r: m.id, from: [fx, fy], to: [m.x, m.y], dir: d, cause });
    await landOn(st, m, d, cause, io);
  }
  return !r.destroyed;
}

/* Effekte beim Betreten eines Feldes (Rand, Grube, Fallgrube, Portal) */
async function landOn(st, r, d, cause, io, viaPortal) {
  if (r.destroyed) return;
  if (!inBounds(st.board, r.x, r.y)) { await destroy(st, r, io, 'Rand'); return; }
  const c = cellAt(st.board, r.x, r.y);
  if (c.t === 'pit') {
    if (!(r._flying && hasUpg(r, 'flugmodul'))) { await destroy(st, r, io, 'Grube'); return; }
  }
  if (c.trap && activeIn(c.trap, st.register)) { await destroy(st, r, io, 'Fallgrube'); return; }
  if (c.portal != null && !viaPortal) {
    const dest = findPortalPartner(st.board, r.x, r.y, c.portal);
    if (dest && !robotAt(st, dest[0], dest[1])) {
      const fx = r.x, fy = r.y;
      r.x = dest[0]; r.y = dest[1];
      await io.emit({ t: 'teleport', r: r.id, from: [fx, fy], to: [r.x, r.y], kind: 'portal' });
      await landOn(st, r, d, cause, io, true);
    }
  }
}
function findPortalPartner(b, x, y, id) {
  for (let i = 0; i < b.cells.length; i++) {
    const c = b.cells[i];
    if (c.portal === id) {
      const px = i % b.w, py = (i / b.w) | 0;
      if (px !== x || py !== y) return [px, py];
    }
  }
  return null;
}

/* Rutschen auf Oel: nach Bewegungsende weitergleiten */
async function oilSlide(st, r, d, io) {
  let guard = 40;
  while (guard-- > 0) {
    if (r.destroyed || r.out) return;
    const c = cellAt(st.board, r.x, r.y);
    if (!c || c.t !== 'oil') return;
    const nx = r.x + DX[d], ny = r.y + DY[d];
    if (wallBlocks(st.board, r.x, r.y, d)) return;
    const other = robotAt(st, nx, ny);
    if (other) {
      const oc = cellAt(st.board, other.x, other.y);
      if (!oc || oc.t !== 'oil') return;            // von trockenem Roboter gestoppt
    }
    if (!await stepMove(st, r, d, 'oil', io)) return;
  }
}

/* Teleporter: Karte auf Teleporterfeld ausfuehren */
async function teleportCard(st, r, steps, io) {
  const dir = steps >= 0 ? r.dir : opp(r.dir);
  const n = steps >= 0 ? steps + 2 : 2;
  let tx = r.x + DX[dir] * n, ty = r.y + DY[dir] * n;
  if (!inBounds(st.board, tx, ty)) { await destroy(st, r, io, 'Rand'); return true; }
  if (robotAt(st, tx, ty)) return false;             // inaktiv, normal ausfuehren
  const fx = r.x, fy = r.y;
  r.x = tx; r.y = ty;
  await io.emit({ t: 'teleport', r: r.id, from: [fx, fy], to: [tx, ty], kind: 'tele' });
  await landOn(st, r, dir, 'tele', io);
  return true;
}

/* ============================================================================
   SCHADEN
   ========================================================================= */
async function damage(st, r, amount, io, source, kind, cardType) {
  if (st.rules === 'modern') return dmgModern(st, r, amount, io, source, kind, cardType);
  return dmgClassic(st, r, amount, io, source, kind);
}
async function destroy(st, r, io, reason) {
  if (st.rules === 'modern') return rebootRobot(st, r, io, reason);
  return destroyClassic(st, r, io, reason);
}

async function dmgClassic(st, r, amount, io, source, kind) {
  if (r.destroyed || r.out) return;
  for (let i = 0; i < amount; i++) {
    if (r.destroyed) return;
    // Ablative Coat / Optionen opfern
    if (await absorbDamage(st, r, io, kind, source)) continue;
    r.dmg++;
    await io.emit({ t: 'damage', r: r.id, total: r.dmg, kind, src: source ? source.id : null });
    if (r.dmg >= 10) { await destroy(st, r, io, 'Totalschaden'); return; }
  }
}
async function destroyClassic(st, r, io, reason) {
  if (r.destroyed) return;
  r.destroyed = true;
  r.dmg = 10;
  if (!st.cfg.immortal) r.lives--;
  // Eine Option geht verloren
  if (r.options.length) {
    const lost = await io.choose(r, 'destroyOption', r.options.map(o => o.id));
    const idx = r.options.findIndex(o => o.id === lost);
    if (idx >= 0) { st.optDiscard.push(r.options[idx].id); r.options.splice(idx, 1); }
  }
  await io.emit({ t: 'destroy', r: r.id, reason, lives: r.lives });
  if (r.lives <= 0 && !st.cfg.immortal) { r.out = true; await io.emit({ t: 'out', r: r.id }); }
}

/* ============================================================================
   LASER
   ========================================================================= */
/* Sichtlinie ab (x,y) in Richtung d. Liefert {hit, path} */
function traceLaser(st, x, y, d, pierce) {
  const lim = pierce === true ? 1 : (pierce | 0);
  const path = [];
  let cx = x, cy = y, through = 0, hit = null;
  for (let i = 0; i < 64; i++) {
    // Die Antenne laesst sich von keinem Laser durchschlagen
    const nxt = cellAt(st.board, cx + DX[d], cy + DY[d]);
    if (nxt && nxt.antenna) break;
    if (laserBlocked(st.board, cx, cy, d)) {
      if (through < lim) through++;              // Durchschlag verbraucht
      else break;
    }
    cx += DX[d]; cy += DY[d];
    if (!inBounds(st.board, cx, cy)) break;
    path.push([cx, cy]);
    const r = robotAt(st, cx, cy);
    if (r) {
      if (!hit) hit = [];
      hit.push(r);
      if (through >= lim) break;
      through++;
    }
  }
  return { path, hit: hit || [] };
}

async function fireBoardLasers(st, io) {
  const b = st.board;
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
    const c = cellAt(b, x, y);
    if (!c.laser) continue;
    const { path, hit } = traceLaser(st, x, y, c.laser.d, false);
    await io.emit({ t: 'laser', from: [x, y], dir: c.laser.d, path, kind: 'board', n: c.laser.n || 1 });
    if (hit[0]) await damage(st, hit[0], c.laser.n || 1, io, null, 'board');
  }
}

async function fireRobotLasers(st, io) {
  const forced = [];
  const shots = [];
  for (const r of st.robots) {
    if (r.destroyed || r.out || r.poweredDown) continue;
    for (const s of weaponShots(st, r)) shots.push(s);
  }
  // Alle Strahlen erst zeichnen, dann Schaden — Feuer ist gleichzeitig
  for (const s of shots) await io.emit({ t: 'laser', from: s.from, dir: s.dir, path: s.path, kind: 'robot', n: s.dmg, r: s.shooter.id });
  for (const s of shots) {
    for (const tgt of s.targets) {
      if (s.dmg > 0) await damage(st, tgt, s.dmg, io, s.shooter, s.weapon);
      if (s.push) forced.push({ r: tgt, d: s.dir, by: s.shooter });
      if (s.pull) forced.push({ r: tgt, d: opp(s.dir), by: s.shooter });
      if (s.scramble) await io.scramble(s.shooter, tgt);
      if (s.radio) await io.radio(s.shooter, tgt);
      if (s.selfPush) forced.push({ r: s.shooter, d: opp(s.dir), by: s.shooter });
    }
  }
  // Erzwungene Bewegung nach allen Schaeden
  for (const f of forced) {
    if (f.r.destroyed || f.r.out) continue;
    await stepMove(st, f.r, f.d, 'weapon', io);
  }
}

/* ============================================================================
   BOARDELEMENTE
   ========================================================================= */
async function moveBelts(st, io, expressOnly) {
  const b = st.board;
  const moves = [];
  for (const r of st.robots) {
    if (r.destroyed || r.out) continue;
    const c = cellAt(b, r.x, r.y);
    if (!c || !c.cv) continue;
    if (expressOnly && !c.cv.x) continue;
    const d = c.cv.d;
    if (wallBlocks(b, r.x, r.y, d)) continue;
    const nx = r.x + DX[d], ny = r.y + DY[d];
    moves.push({ r, d, nx, ny });
  }
  // Konvergenz: zwei Roboter aufs gleiche Feld -> keiner bewegt sich
  const count = {};
  for (const m of moves) count[m.nx + ',' + m.ny] = (count[m.nx + ',' + m.ny] || 0) + 1;
  // Band schiebt nicht: Zielfeld mit stehendem Roboter, der sich nicht bewegt -> blockiert
  const movingIds = new Set(moves.map(m => m.r.id));
  const valid = moves.filter(m => {
    if (count[m.nx + ',' + m.ny] > 1) return false;
    const occ = robotAt(st, m.nx, m.ny);
    if (occ && !movingIds.has(occ.id)) return false;
    return true;
  });
  for (const m of valid) {
    const fx = m.r.x, fy = m.r.y;
    m.r.x = m.nx; m.r.y = m.ny;
  }
  for (const m of valid) {
    await io.emit({ t: 'move', r: m.r.id, from: [m.r.x - DX[m.d], m.r.y - DY[m.d]], to: [m.r.x, m.r.y], dir: m.d, cause: 'belt' });
    // Kurve: Drehung, wenn die Ausrichtung des Zielbandes abweicht
    const tc = cellAt(b, m.r.x, m.r.y);
    if (tc && tc.cv && !hasOpt(m.r, 'gyro_active')) {
      const diff = (tc.cv.d - m.d + 4) & 3;
      if (diff === 1) await rotate(st, m.r, 1, io, 'belt');
      else if (diff === 3) await rotate(st, m.r, -1, io, 'belt');
    }
    await landOn(st, m.r, m.d, 'belt', io);
  }
}

async function movePushers(st, io) {
  const b = st.board;
  for (const r of [...st.robots].sort((a, z) => a.id - z.id)) {
    if (r.destroyed || r.out) continue;
    const c = cellAt(b, r.x, r.y);
    if (!c || !c.push) continue;
    if (!activeIn(c.push.phases, st.register)) continue;
    await stepMove(st, r, c.push.d, 'pusher', io);
  }
}
async function moveGears(st, io) {
  for (const r of st.robots) {
    if (r.destroyed || r.out) continue;
    const c = cellAt(st.board, r.x, r.y);
    if (!c || !c.gear) continue;
    if (hasOpt(r, 'gyro_active')) continue;
    await rotate(st, r, c.gear, io, 'gear');
  }
}
async function runCrushers(st, io) {
  for (const r of st.robots) {
    if (r.destroyed || r.out) continue;
    const c = cellAt(st.board, r.x, r.y);
    if (c && c.crush && activeIn(c.crush, st.register)) await destroy(st, r, io, 'Presse');
  }
}
async function runFlamers(st, io) {
  for (const r of st.robots) {
    if (r.destroyed || r.out) continue;
    const c = cellAt(st.board, r.x, r.y);
    if (c && c.flame && activeIn(c.flame, st.register)) {
      await io.emit({ t: 'flame', at: [r.x, r.y] });
      await damage(st, r, 1, io, null, 'flame');
    }
  }
}
async function rotate(st, r, dir, io, cause) {
  const from = r.dir;
  r.dir = dir > 0 ? cw(r.dir) : (dir < 0 ? ccw(r.dir) : opp(r.dir));
  await io.emit({ t: 'rotate', r: r.id, from, to: r.dir, cause });
}

/* Checkpoints beruehren */
async function touchCheckpoints(st, io) {
  for (const r of st.robots) {
    if (r.destroyed || r.out) continue;
    const cells = [[r.x, r.y]];
    if (hasOpt(r, 'mechanical_arm'))
      for (let d = 0; d < 4; d++)
        if (!wallBlocks(st.board, r.x, r.y, d)) cells.push([r.x + DX[d], r.y + DY[d]]);
    for (const [x, y] of cells) {
      const c = cellAt(st.board, x, y);
      if (!c) continue;
      if (c.flag) {
        if (c.flag === r.nextFlag) {
          r.nextFlag++;
          r.ax = r.x; r.ay = r.y; r.adir = r.dir;
          await io.emit({ t: 'flag', r: r.id, n: c.flag, next: r.nextFlag });
          if (r.nextFlag > st.totalFlags) {
            r.finished = true; st.over = true; st.winner = r;
            await io.emit({ t: 'win', r: r.id });
          }
        }
      } else if (c.t === 'repair' || c.t === 'upgrade') {
        if (x === r.x && y === r.y) { r.ax = r.x; r.ay = r.y; r.adir = r.dir; }
      }
    }
  }
}
/* ============================================================================

   kind: passiv | runtime | turn | phase | weapon | mod

  mechanical_arm: { n: 'Greifarm', kind: 'passiv', d: 'Berührt Flaggen auch vom Nachbarfeld. Wände blockieren, Roboter nicht.' },
  crab_legs: { n: 'Krebsbeine', kind: 'phase', d: 'Vor 1 zusammen mit einer Drehung ins selbe Register: Seitwärtsschritt ohne Drehung.' },

  mini_howitzer: { n: 'Minihaubitze', kind: 'weapon', payload: 5, d: 'Statt Hauptlaser: 1 Schaden und 1 Feld wegschieben. 5 Schuss.' },

};
const OPTION_IDS = Object.keys(OPTIONS);
const WEAPON_OPTS = OPTION_IDS.filter(id => OPTIONS[id].kind === 'weapon');

function buildOptionDeck() { return OPTION_IDS.slice(); }

/* Besitzt der Roboter die Option (und ist sie nicht leergeschossen)? */
function hasOpt(r, id) {
  if (!r) return null;
  if (id === 'gyro_active') return r.gyroActive && !!r.options.find(o => o.id === 'gyro');
  return r.options.find(o => o.id === id) || null;
}
function giveOption(st, r, io) {
  if (!st.cfg.optionsOn) return null;
  if (!st.optDeck.length) { st.optDeck = st.rng.shuffle(st.optDiscard); st.optDiscard = []; }
  const id = st.optDeck.pop();
  if (!id) return null;
  const o = { id, payload: OPTIONS[id].payload || 0 };
  r.options.push(o);
  if (OPTIONS[id].kind === 'weapon' && r.weapon === 'main') r.weapon = id;
  return o;
}

/* --- Bewegungsmodifikatoren -------------------------------------------
   Reihenfolge: Grundwert -> Optionsmodifikator -> Geländeabzug.
   Bei "Vor 3 auf Öl mit Viertem Gang" also 3 -> 4 -> 3.
   Keine Regel klärt das; die Reihenfolge ist hier bewusst festgelegt.     */
async function movementSteps(st, r, card, io) {
  let n = baseSteps(card);
  if (n > 0) {
    if (n === 3 && hasOpt(r, 'fourth_gear') && await io.ask(r, 'fourth_gear', 'Vierter Gang: 4 Felder statt 3?')) n = 4;
    if (n === 1 && hasOpt(r, 'brakes') && await io.ask(r, 'brakes', 'Bremsen: stehen bleiben statt 1 Feld?')) n = 0;
  } else if (n < 0) {
    if (hasOpt(r, 'reverse_gears') && await io.ask(r, 'reverse_gears', 'Rückwärtsgang: 2 Felder statt 1?')) n = -2;
  }
  const c = cellAt(st.board, r.x, r.y);
  if (c && (c.t === 'oil' || c.t === 'water') && n !== 0) n -= Math.sign(n);
  return n;
}

/* --- Schaden abfangen -------------------------------------------------- */
async function absorbDamage(st, r, io, kind, source) {
  // Zielrechner des Schützen: gezielte Sperre oder Optionszerstörung
  if (source && kind === 'robot' && hasOpt(source, 'fire_control')) {
    const pick = await io.choose(source, 'fireControl', { target: r });
    if (pick && pick.type === 'lock') {
      const i = r.lockOrder.indexOf(pick.reg);
      if (i >= 0) { r.lockOrder.splice(i, 1); r.lockOrder.unshift(pick.reg); }
    } else if (pick && pick.type === 'option') {
      const i = r.options.findIndex(o => o.id === pick.id);
      if (i >= 0) {
        st.optDiscard.push(r.options[i].id);
        r.options.splice(i, 1);
        await io.emit({ t: 'optLost', r: r.id, id: pick.id, by: source.id });
        return true;                       // Schaden verpufft in der Zerstörung
      }
    }
  }
  // Ablativpanzerung
  const coat = hasOpt(r, 'ablative_coat');
  if (coat && coat.payload > 0) {
    coat.payload--;
    await io.emit({ t: 'absorb', r: r.id, by: 'ablative_coat', left: coat.payload });
    if (coat.payload === 0) {
      r.options.splice(r.options.indexOf(coat), 1);
      st.optDiscard.push('ablative_coat');
    }
    return true;
  }
  // Abschaltschild: blockt 1 Schaden pro Registerphase (Vereinfachung
  // gegenüber dem Original, das je Seite ein eigenes Schild vorsieht)
  if (r.poweredDown && hasOpt(r, 'power_down_shield') && kind !== 'radiation' && r._shieldPhase !== st.register) {
    r._shieldPhase = st.register;
    await io.emit({ t: 'absorb', r: r.id, by: 'power_down_shield' });
    return true;
  }
  // Option opfern
  if (r.options.length && r.sacrifice !== 'nie') {
    const lethal = r.dmg >= 9;
    if (r.sacrifice === 'immer' || lethal) {
      const id = await io.choose(r, 'sacrifice', { lethal });
      if (id) {
        const i = r.options.findIndex(o => o.id === id);
        if (i >= 0) {
          st.optDiscard.push(id);
          r.options.splice(i, 1);
          if (r.weapon === id) r.weapon = 'main';
          await io.emit({ t: 'optLost', r: r.id, id, sacrificed: true });
          return true;
        }
      }
    }
  }
  return false;
}

/* --- Waffen ------------------------------------------------------------ */
function weaponShots(st, r) {
  const shots = [];
  const w = r.weapon && hasOpt(r, r.weapon) ? r.weapon : 'main';

  if (w === 'main' || !WEAPON_OPTS.includes(w)) {
    const pierce = !!hasOpt(r, 'high_power_laser');
    const dmg = 1 + (hasOpt(r, 'double_laser') ? 1 : 0);
    const tr = traceLaser(st, r.x, r.y, r.dir, pierce);
    if (tr.hit.length) shots.push({ shooter: r, dir: r.dir, from: [r.x, r.y], path: tr.path, targets: tr.hit, dmg, weapon: 'robot' });
    else shots.push({ shooter: r, dir: r.dir, from: [r.x, r.y], path: tr.path, targets: [], dmg, weapon: 'robot' });
  } else {
    const o = hasOpt(r, w);
    const tr = traceLaser(st, r.x, r.y, r.dir, false);
    const tgt = tr.hit[0] || null;
    const dist = tgt ? Math.abs(tgt.x - r.x) + Math.abs(tgt.y - r.y) : 0;
    const s = { shooter: r, dir: r.dir, from: [r.x, r.y], path: tr.path, targets: [], dmg: 0, weapon: w };
    if (tgt) {
      if (w === 'mini_howitzer' && o.payload > 0) { o.payload--; s.dmg = 1; s.push = true; s.targets = [tgt]; }
      else if (w === 'pressor_beam') { s.push = true; s.targets = [tgt]; }
      else if (w === 'tractor_beam' && dist > 1) { s.pull = true; s.targets = [tgt]; }
      else if (w === 'scrambler' && st.register < 5) { s.scramble = true; s.targets = [tgt]; }
      else if (w === 'radio_control' && dist <= 6) { s.radio = true; s.targets = [tgt]; }
      else if (w === 'mini_howitzer') { s.dmg = 1; s.targets = [tgt]; s.weapon = 'robot'; } // leer -> Hauptlaser
    }
    shots.push(s);
  }
  // Hecklaser feuert zusätzlich, ohne Modifikationen
  if (hasOpt(r, 'rear_laser')) {
    const d = opp(r.dir);
    const tr = traceLaser(st, r.x, r.y, d, false);
    shots.push({ shooter: r, dir: d, from: [r.x, r.y], path: tr.path, targets: tr.hit.slice(0, 1), dmg: 1, weapon: 'robot' });
  }
  return shots;
}
/* ============================================================================
   RUNDENABLAUF
   ========================================================================= */

const active = st => st.robots.filter(r => !r.out);

/* Registerinhalt auf den Ablagestapel legen. Von der Fernsteuerung kopierte
   Eintraege sind Geister und gehoeren dem Sender — sie werden nicht doppelt
   abgelegt. */
function discardEntry(st, e) {
  if (!e || e.ghost) return;
  if (e.c) st.discard.push(e.c);
  if (e.sub) st.discard.push(e.sub);
}
function wipeRegisters(st, r, force) {
  for (let i = 0; i < 5; i++)
    if (force || !isLocked(r, i + 1)) { discardEntry(st, r.regs[i]); r.regs[i] = null; }
}
const alive = st => st.robots.filter(r => !r.out && !r.destroyed);

/* --- 1. Karten austeilen ----------------------------------------------- */
async function dealPhase(st, io) {
  st.turn++;
  st.register = 0;
  for (const r of active(st)) {
    r.gyroActive = false;
    r._abort = false;
    r._radio = null;
    r._shieldPhase = -1;
    if (r.announcePD) { r.announcePD = false; r.poweredDown = true; r.dmg = 0; }
    if (r.poweredDown) { r.hand = []; continue; }
    r.hand = [];
    const n = handSize(r);
    for (let i = 0; i < n; i++) r.hand.push(drawCard(st));
    const fw = hasOpt(r, 'flywheel');
    if (fw && fw.held) { r.hand.push(fw.held); fw.held = null; }
    wipeRegisters(st, r, false);
  }
  await io.emit({ t: 'deal', turn: st.turn });
}

/* --- 2./3. Programmieren und Abschaltung ansagen ------------------------ */
async function programPhase(st, io) {
  for (const r of active(st)) {
    if (r.poweredDown || r.destroyed) continue;
    await io.program(r);
    // Leere gesperrte Register mit Zufallskarte füllen
    for (let i = 0; i < 5; i++)
      if (isLocked(r, i + 1) && !r.regs[i]) r.regs[i] = { c: drawCard(st), sub: null, mode: null };
    // Restkarten abwerfen
    for (const c of r.hand) st.discard.push(c);
    r.hand = [];
  }
}

/* --- 4. Registerphasen -------------------------------------------------- */
async function runRegister(st, io, reg) {
  st.register = reg;
  await io.emit({ t: 'register', n: reg });

  // Virtuelle Roboter werden real, sobald ihr Feld frei ist
  for (const r of alive(st))
    if (r.virtual && !st.robots.some(o => o !== r && !o.destroyed && !o.out && !o.virtual && o.x === r.x && o.y === r.y)) {
      r.virtual = false;
      await io.emit({ t: 'solid', r: r.id });
    }

  // A. Karten aufdecken
  const order = alive(st).filter(r => !r.poweredDown && r.regs[reg - 1]);
  for (const r of order) await io.emit({ t: 'reveal', r: r.id, reg });

  // B. Bewegung nach Priorität, Fernsteuerung zieht direkt nach dem Sender
  const seq = order.map(r => ({ r, p: r._radio ? r._radio.p - 0.5 : r.regs[reg - 1].c.p }))
    .sort((a, b) => b.p - a.p);
  for (const { r } of seq) {
    if (r.destroyed || r.out) continue;
    await executeRegister(st, r, reg, io);
    if (st.over) return;
  }

  // C. Boardelemente
  await moveBelts(st, io, true);      // Expressbänder
  await moveBelts(st, io, false);     // alle Bänder
  await movePushers(st, io);
  await moveGears(st, io);
  await runCrushers(st, io);

  // D. Laserfeuer
  await fireBoardLasers(st, io);
  await fireRobotLasers(st, io);
  await runFlamers(st, io);

  // E. Checkpoints
  await touchCheckpoints(st, io);
}

async function executeRegister(st, r, reg, io) {
  const entry = r.regs[reg - 1];
  if (!entry) return;
  let card = entry.c;

  // Notabschaltung: ab Auslösung zieht die Runde zufällig
  let drawn = null;
  if (r._abort) card = drawn = drawCard(st);
  else if (hasOpt(r, 'abort_switch') && await io.ask(r, 'abort_switch', 'Notabschaltung: Karte verwerfen und zufällig ziehen?')) {
    r._abort = true;
    card = drawn = drawCard(st);
    await io.emit({ t: 'abort', r: r.id, card });
  }
  if (drawn) st.discard.push(drawn);

  const c = cellAt(st.board, r.x, r.y);

  // Krebsbeine: seitwärts ohne Drehung
  if (entry.mode === 'crab' && entry.sub) {
    const d = entry.sub.t === 'rl' ? ccw(r.dir) : cw(r.dir);
    await stepMove(st, r, d, 'card', io);
    await oilSlide(st, r, d, io);
    return;
  }

  // Doppelprozessor: Bewegung verkürzt, dann drehen
  if (entry.mode === 'dual' && entry.sub) {
    let n = baseSteps(card) - (entry.sub.t === 'u' ? 2 : 1);
    if (n < 0) n = 0;
    await runSteps(st, r, n, io);
    if (!r.destroyed) await rotate(st, r, entry.sub.t === 'rl' ? -1 : entry.sub.t === 'rr' ? 1 : 0, io, 'card');
    return;
  }

  if (isTurn(card)) {
    await rotate(st, r, card.t === 'rl' ? -1 : card.t === 'rr' ? 1 : 0, io, 'card');
    return;
  }

  // Teleporterfeld: Karte wird zum Sprung
  if (c && c.tele) {
    const n = baseSteps(card);
    if (await teleportCard(st, r, n, io)) return;
  }
  const n = await movementSteps(st, r, card, io);
  await runSteps(st, r, n, io);
}

async function runSteps(st, r, n, io) {
  const d = n >= 0 ? r.dir : opp(r.dir);
  const k = Math.abs(n);
  for (let i = 0; i < k; i++) {
    if (r.destroyed || r.out || st.over) return;
    if (!await stepMove(st, r, d, 'card', io)) break;
  }
  if (!r.destroyed && k > 0) await oilSlide(st, r, d, io);
}

/* --- 5. Rundenende ------------------------------------------------------ */
async function endOfTurn(st, io) {
  st.register = 0;
  for (const r of alive(st)) {
    const c = cellAt(st.board, r.x, r.y);
    if (!c) continue;
    if (c.t === 'radiation') await damage(st, r, 1, io, null, 'radiation');
  }
  for (const r of alive(st)) {
    const c = cellAt(st.board, r.x, r.y);
    if (!c) continue;
    let rep = 0;
    if (c.t === 'repair') rep = 1;
    if (c.t === 'upgrade') rep = 1;
    if (c.flag) rep = 1;
    if (rep && r.dmg > 0) {
      r.dmg = Math.max(0, r.dmg - rep);
      await io.emit({ t: 'repair', r: r.id, total: r.dmg });
    }
    if (c.t === 'upgrade' && st.cfg.optionsOn) {
      const o = giveOption(st, r, io);
      if (o) await io.emit({ t: 'optGain', r: r.id, id: o.id });
    }
  }
  // Register wischen passiert beim Austeilen; hier nur Abschaltung und Neustart
  for (const r of active(st)) {
    if (r.poweredDown) {
      const stay = await io.choose(r, 'continuePowerDown', {});
      if (stay) r.announcePD = true;
      else r.poweredDown = false;
    } else if (!r.destroyed && hasOpt(r, 'circuit_breaker') && r.dmg >= 3) {
      r.announcePD = true;
      await io.emit({ t: 'breaker', r: r.id });
    }
  }
  for (const r of st.robots) {
    if (!r.destroyed || r.out) continue;
    r.destroyed = false;
    r.x = r.ax; r.y = r.ay;
    r.dir = await io.choose(r, 'respawnDir', { def: r.adir });
    const sup = hasOpt(r, 'superior_archive');
    r.dmg = sup ? 0 : 2;
    if (sup) { r.options.splice(r.options.indexOf(sup), 1); st.optDiscard.push('superior_archive'); }
    r.lockOrder = [5, 4, 3, 2, 1];
    wipeRegisters(st, r, true);
    r.virtual = !!st.robots.find(o => o !== r && !o.destroyed && !o.out && !o.virtual && o.x === r.x && o.y === r.y);
    await io.emit({ t: 'respawn', r: r.id, at: [r.x, r.y], dir: r.dir, virtual: r.virtual });
  }
  if (alive(st).length <= 1 && st.robots.length > 1) {
    st.over = true;
    st.winner = alive(st)[0] || null;
    await io.emit({ t: 'lastStanding', r: st.winner ? st.winner.id : null });
  }
  await io.emit({ t: 'endTurn', turn: st.turn });
}

async function playTurn(st, io) {
  await dealPhase(st, io);
  await programPhase(st, io);
  for (let reg = 1; reg <= 5 && !st.over; reg++) await runRegister(st, io, reg);
  if (!st.over) await endOfTurn(st, io);
}

/* --- Störsender und Fernsteuerung --------------------------------------- */
function applyScramble(st, target) {
  const next = st.register;               // nächstes Register (0-basiert = aktuelles)
  if (next >= 5) return;
  discardEntry(st, target.regs[next]);
  target.regs[next] = { c: drawCard(st), sub: null, mode: null };
}
function applyRadio(st, shooter, target) {
  target._radio = { p: shooter.regs[st.register - 1] ? shooter.regs[st.register - 1].c.p : 500 };
  for (let i = st.register; i < 5; i++) {
    discardEntry(st, target.regs[i]);
    target.regs[i] = shooter.regs[i] ? { ...shooter.regs[i], ghost: true } : null;
  }
}
/* ============================================================================
   BOT-KI
   Sucht über alle Permutationen der Handkarten auf die freien Register.
   9 Karten auf 5 Plätze = 15.120 Varianten. Jede wird vollständig
   durchsimuliert (Bänder, Pusher, Zahnräder, Gruben, Wände), andere
   Roboter gelten dabei als feststehende Hindernisse.
   ========================================================================= */

/* Distanzfeld per BFS vom Ziel aus — respektiert Wände und Gruben. */
function distField(board, tx, ty) {
  const N = board.w * board.h;
  const d = new Int32Array(N).fill(9999);
  if (tx < 0) return d;
  const q = [ty * board.w + tx];
  d[ty * board.w + tx] = 0;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % board.w, y = (i / board.w) | 0;
    for (let dir = 0; dir < 4; dir++) {
      const nx = x + DX[dir], ny = y + DY[dir];
      if (!inBounds(board, nx, ny)) continue;
      const j = ny * board.w + nx;
      if (d[j] <= d[i] + 1) continue;
      if (wallBlocks(board, x, y, dir)) continue;
      const c = board.cells[j];
      if (c.t === 'pit') continue;
      d[j] = d[i] + 1;
      q.push(j);
    }
  }
  return d;
}
function flagPos(board, n) {
  for (let i = 0; i < board.cells.length; i++)
    if (board.cells[i].flag === n) return [i % board.w, (i / board.w) | 0];
  return [-1, -1];
}

/* --- Schnelle, synchrone Simulation ------------------------------------ */
function simRun(board, start, plan, blockers, regOffset) {
  const s = { x: start.x, y: start.y, dir: start.dir, dead: false, dmg: 0, hit: 0 };
  const occupied = (x, y) => blockers.some(b => b.x === x && b.y === y);
  const step = (d) => {
    if (s.dead) return false;
    if (wallBlocks(board, s.x, s.y, d)) return false;
    const nx = s.x + DX[d], ny = s.y + DY[d];
    if (occupied(nx, ny)) return false;                 // schieben wird nicht geplant
    s.x = nx; s.y = ny;
    if (!inBounds(board, s.x, s.y)) { s.dead = true; return false; }
    const c = board.cells[s.y * board.w + s.x];
    if (c.t === 'pit') { s.dead = true; return false; }
    return true;
  };
  for (let k = 0; k < plan.length && !s.dead; k++) {
    const reg = regOffset + k + 1;
    const e = plan[k];
    if (!e) continue;
    const card = e.c;
    if (isTurn(card)) {
      s.dir = card.t === 'rl' ? ccw(s.dir) : card.t === 'rr' ? cw(s.dir) : opp(s.dir);
    } else {
      let n = baseSteps(card);
      const c0 = board.cells[s.y * board.w + s.x];
      if (c0 && (c0.t === 'oil' || c0.t === 'water') && n !== 0) n -= Math.sign(n);
      const d = n >= 0 ? s.dir : opp(s.dir);
      for (let i = 0; i < Math.abs(n); i++) if (!step(d)) break;
    }
    if (s.dead) break;
    // Boardelemente
    for (const pass of [1, 0]) {
      const c = board.cells[s.y * board.w + s.x];
      if (c && c.cv && (pass === 0 || c.cv.x)) {
        const md = c.cv.d;
        if (step(md)) {
          const tc = board.cells[s.y * board.w + s.x];
          if (tc && tc.cv) {
            const diff = (tc.cv.d - md + 4) & 3;
            if (diff === 1) s.dir = cw(s.dir); else if (diff === 3) s.dir = ccw(s.dir);
          }
        }
      }
      if (s.dead) break;
    }
    if (s.dead) break;
    let c = board.cells[s.y * board.w + s.x];
    if (c.push && activeIn(c.push.phases, reg)) step(c.push.d);
    if (s.dead) break;
    c = board.cells[s.y * board.w + s.x];
    if (c.gear) s.dir = c.gear > 0 ? cw(s.dir) : ccw(s.dir);
    if (c.crush && activeIn(c.crush, reg)) { s.dead = true; break; }
    if (c.trap && activeIn(c.trap, reg)) { s.dead = true; break; }
    if (c.flame && activeIn(c.flame, reg)) s.dmg++;
    if (c.t === 'radiation') s.dmg++;
    if (c.laser) s.dmg += c.laser.n || 1;
  }
  return s;
}

/* Ist das Feld von einem Boardlaser bestrichen? (grobe Näherung) */
function laserExposure(board, x, y) {
  let n = 0;
  for (let d = 0; d < 4; d++) {
    let cx = x, cy = y;
    for (let i = 0; i < 20; i++) {
      if (wallBlocks(board, cx, cy, d)) break;
      cx += DX[d]; cy += DY[d];
      if (!inBounds(board, cx, cy)) break;
      const c = board.cells[cy * board.w + cx];
      if (c.laser && c.laser.d === opp(d)) { n += c.laser.n || 1; break; }
    }
  }
  return n;
}

function botChooseProgram(st, r) {
  const board = st.board;
  const [fx, fy] = flagPos(board, Math.min(r.nextFlag, st.totalFlags));
  const df = distField(board, fx, fy);
  const blockers = st.robots.filter(o => o !== r && !o.destroyed && !o.out).map(o => ({ x: o.x, y: o.y }));

  const free = [];
  for (let i = 0; i < 5; i++) if (!isLocked(r, i + 1)) free.push(i);
  if (!free.length) return;

  const hand = r.hand.slice();
  const k = Math.min(free.length, hand.length);
  const CAP = 256;                 // nur die besten Varianten behalten
  const results = [];
  let cut = -1e9, total = 0;
  const used = new Array(hand.length).fill(false);
  const pick = new Array(k).fill(null);

  const evaluate = () => {
    // Vollständigen Plan aus gesperrten und neuen Karten bauen
    const plan = [];
    let pi = 0;
    for (let i = 0; i < 5; i++) {
      if (isLocked(r, i + 1)) plan.push(r.regs[i]);
      else plan.push(pi < k ? { c: hand[pick[pi++]], sub: null, mode: null } : null);
    }
    const s = simRun(board, r, plan, blockers, 0);
    let score = 0;
    if (s.dead) score -= 900;
    else {
      const d = df[s.y * board.w + s.x];
      score -= (d >= 9999 ? 60 : d) * 10;
      if (d === 0) score += 1200;
      // Blickrichtung Richtung Ziel belohnen
      const ahead = df[Math.max(0, Math.min(board.h - 1, s.y + DY[s.dir])) * board.w
        + Math.max(0, Math.min(board.w - 1, s.x + DX[s.dir]))];
      if (ahead < d) score += 15;
      score -= laserExposure(board, s.x, s.y) * 25;
    }
    score -= s.dmg * 30;
    total++;
    if (results.length < CAP) {
      results.push({ score, order: pick.slice() });
      if (results.length === CAP) { results.sort((a, z) => z.score - a.score); cut = results[CAP - 1].score; }
    } else if (score > cut) {
      results[CAP - 1] = { score, order: pick.slice() };
      for (let i = CAP - 1; i > 0 && results[i].score > results[i - 1].score; i--)
        [results[i], results[i - 1]] = [results[i - 1], results[i]];
      cut = results[CAP - 1].score;
    }
  };

  const rec = (depth) => {
    if (depth === k) { evaluate(); return; }
    for (let i = 0; i < hand.length; i++) {
      if (used[i]) continue;
      used[i] = true; pick[depth] = i;
      rec(depth + 1);
      used[i] = false;
    }
  };
  rec(0);

  results.sort((a, b) => b.score - a.score);
  const frac = r.level >= 3 ? 0 : r.level === 2 ? 0.05 : 0.30;
  const band = Math.max(1, Math.min(results.length, Math.round(total * frac)));
  const chosen = results[st.rng.int(Math.min(band, results.length))];

  const take = chosen.order.map(i => hand[i]);
  let ti = 0;
  for (const idx of free) r.regs[idx] = ti < take.length ? { c: take[ti++], sub: null, mode: null } : null;
  // benutzte Karten aus der Hand nehmen
  const set = new Set(chosen.order);
  r.hand = hand.filter((_, i) => !set.has(i));

  // Abschaltung, wenn schwer beschädigt und keine Flagge in Reichweite
  r.announcePD = r.dmg >= 6 && r.lives > 1;
}

/* Bot-Antworten auf Laufzeitfragen */
function botAnswer(st, r, kind, data) {
  switch (kind) {
    case 'fourth_gear': return true;
    case 'reverse_gears': return true;
    case 'brakes': {
      const s = simRun(st.board, r, [{ c: { t: 'm1', p: 500 }, sub: null, mode: null }],
        st.robots.filter(o => o !== r && !o.destroyed).map(o => ({ x: o.x, y: o.y })), st.register - 1);
      return s.dead;                                    // nur bremsen, wenn es sonst tödlich wäre
    }
    case 'abort_switch': return false;
    case 'continuePowerDown': return r.dmg >= 5;
    case 'respawnDir': {
      const [fx, fy] = flagPos(st.board, Math.min(r.nextFlag, st.totalFlags));
      const df = distField(st.board, fx, fy);
      let best = data.def, bd = 1e9;
      for (let d = 0; d < 4; d++) {
        const nx = r.x + DX[d], ny = r.y + DY[d];
        if (!inBounds(st.board, nx, ny) || wallBlocks(st.board, r.x, r.y, d)) continue;
        const v = df[ny * st.board.w + nx];
        if (v < bd) { bd = v; best = d; }
      }
      return best;
    }
    case 'sacrifice': return r.options.length ? r.options[r.options.length - 1].id : null;
    case 'destroyOption': return data.length ? data[data.length - 1] : null;
    case 'fireControl': {
      const t = data.target;
      if (t.options.length) return { type: 'option', id: t.options[0].id };
      return { type: 'lock', reg: 1 };
    }
    default: return null;
  }
}

/* Waffenwahl: nimm die erste Optionswaffe, wenn ein Ziel in Sicht ist */
function botPickWeapon(st, r) {
  const opts = r.options.filter(o => OPTIONS[o.id].kind === 'weapon');
  if (!opts.length) { r.weapon = 'main'; return; }
  const tr = traceLaser(st, r.x, r.y, r.dir, false);
  const tgt = tr.hit[0];
  if (!tgt) { r.weapon = 'main'; return; }
  const dist = Math.abs(tgt.x - r.x) + Math.abs(tgt.y - r.y);
  const pref = ['radio_control', 'scrambler', 'mini_howitzer', 'tractor_beam', 'pressor_beam'];
  for (const id of pref) {
    const o = opts.find(x => x.id === id);
    if (!o) continue;
    if (id === 'mini_howitzer' && o.payload <= 0) continue;
    if (id === 'tractor_beam' && dist <= 1) continue;
    if (id === 'radio_control' && dist > 6) continue;
    if (id === 'scrambler' && st.register >= 5) continue;
    r.weapon = id; return;
  }
  r.weapon = 'main';
}
/* ============================================================================
   BOARDS
   Kompaktes Textformat: eine Karte fuer den Untergrund, eine fuer Baender.
   Untergrund  .=Boden  #=Grube  o=Oel  ~=Wasser  r=Reparatur  u=Werkbank
               x=Strahlung  T=Teleporter  P=Portal(via Liste)
   Baender     ^>v< = normal    URDL = Express (Up Right Down Left)
   ========================================================================= */
const BDIR = { '^': 0, '>': 1, 'v': 2, '<': 3, 'U': 0, 'R': 1, 'D': 2, 'L': 3 };
const TERR = { '#': 'pit', 'o': 'oil', '~': 'water', 'r': 'repair', 'u': 'upgrade', 'x': 'radiation' };
/* Fassung 2016: e = Energiefeld, A = Prioritätsantenne, R = Reboot-Punkt */

function parseBoard(spec) {
  const g = spec.ground.trim().split('\n').map(s => s.trim());
  const h = g.length, w = g[0].length;
  const b = emptyBoard(w, h, spec.name);
  const belts = spec.belts ? spec.belts.trim().split('\n').map(s => s.trim()) : [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = cellAt(b, x, y);
    const ch = g[y][x];
    if (TERR[ch]) c.t = TERR[ch];
    else if (ch === 'T') c.tele = true;
    else if (ch === 'e') c.energy = true;
    else if (ch === 'A') c.antenna = { d: 2 };      // Schüssel zeigt ins Feld
    const bc = belts[y] ? belts[y][x] : '.';
    if (bc && BDIR[bc] !== undefined) c.cv = { d: BDIR[bc], x: bc === bc.toUpperCase() && 'URDL'.includes(bc) };
  }
  for (const [x, y, s] of spec.walls || []) {
    const c = cellAt(b, x, y);
    c.w = (c.w || 0) | [...s].reduce((m, ch) => m | WBIT['NOSW'.indexOf(ch === 'E' ? 'O' : ch)], 0);
  }
  for (const [x, y, s] of spec.oneway || []) {
    const c = cellAt(b, x, y);
    c.ow = (c.ow || 0) | [...s].reduce((m, ch) => m | WBIT['NOSW'.indexOf(ch === 'E' ? 'O' : ch)], 0);
  }
  for (const [x, y, d, n] of spec.lasers || []) cellAt(b, x, y).laser = { d, n: n || 1 };
  for (const [x, y, d, ph] of spec.pushers || []) cellAt(b, x, y).push = { d, phases: ph };
  for (const [x, y, g2] of spec.gears || []) cellAt(b, x, y).gear = g2;
  for (const [x, y, ph] of spec.crushers || []) cellAt(b, x, y).crush = ph;
  for (const [x, y, ph] of spec.traps || []) cellAt(b, x, y).trap = ph;
  for (const [x, y, ph] of spec.flames || []) cellAt(b, x, y).flame = ph;
  for (const [x, y, id] of spec.portals || []) cellAt(b, x, y).portal = id;
  for (const [x, y, n] of spec.flags || []) cellAt(b, x, y).flag = n;
  for (const [x, y, n] of spec.starts || []) cellAt(b, x, y).start = n;
  for (const [x, y, d] of spec.respawn || []) cellAt(b, x, y).respawn = { d };
  for (const [x, y, d] of spec.antenna || []) cellAt(b, x, y).antenna = { d };
  b.rules = spec.rules || 'classic';
  return b;
}

/* Startpositionen in Reihenfolge der Docknummer */
function startPositions(board) {
  const list = [];
  for (let i = 0; i < board.cells.length; i++) {
    const c = board.cells[i];
    if (c.start) list.push({ n: c.start, x: i % board.w, y: (i / board.w) | 0 });
  }
  list.sort((a, b) => a.n - b.n);
  if (!list.length) list.push({ n: 1, x: 0, y: 0 });
  return list;
}
/* Blickrichtung beim Start: zur Boardmitte */
function startFacing(board, x, y) {
  const cx = (board.w - 1) / 2, cy = (board.h - 1) / 2;
  return Math.abs(cx - x) > Math.abs(cy - y) ? (cx > x ? 1 : 3) : (cy > y ? 2 : 0);
}

/* Programmierdeck: 20 Karten je Roboter */
function buildPlayerDeck() {
  const d = [];
  const add = (t, n) => { for (let i = 0; i < n; i++) d.push({ t }); };
  add('m1', 5); add('m2', 3); add('m3', 1); add('bu', 1);
  add('rr', 3); add('rl', 3); add('u', 1);
  add('pwr', 1); add('again', 2);
  return d;
}
const DMG_CARDS = ['spam', 'virus', 'trojan', 'worm'];
const isDmgCard = c => c && DMG_CARDS.indexOf(c.t) >= 0;
/* Routinekarten, die temporäre Upgrades dauerhaft ins Deck legen */
const ROUTINES = {
  r_sandbox: 'Sandbox-Routine', r_spin: 'Dreh-Routine', r_repeat: 'Wiederholungs-Routine',
  r_energy: 'Energie-Routine', r_spamfilter: 'SPAM-Filter-Routine', r_speed: 'Speed-Routine'
};
const MCARDNAME = Object.assign({}, CARDNAME, {
  pwr: 'Energie', again: 'Wiederholung',
  spam: 'SPAM', virus: 'VIRUS', trojan: 'TROJANER', worm: 'WURM'
}, ROUTINES);
const MCARDLABEL = Object.assign({}, CARDLABEL, {
  pwr: '⚡', again: '↻↻', spam: '✱', virus: '☣', trojan: '⚿', worm: '⌇',
  r_sandbox: '□', r_spin: '⟳', r_repeat: '↻↻', r_energy: '⚡', r_spamfilter: '⌫', r_speed: '»'
});

function shuffleInto(st, r) {
  r.deck = st.rng.shuffle(r.disc.slice());
  r.disc = [];
}
function drawFrom(st, r) {
  if (!r.deck.length) shuffleInto(st, r);
  if (!r.deck.length) return { t: 'm1' };            // Notfall, sollte nicht auftreten
  return r.deck.pop();
}
function deckCount(r) { return r.deck.length + r.disc.length; }

/* --- Schadenskarten ----------------------------------------------------- */
function takeCards(st, r, n, type, io, onTop) {
  let got = 0, kind = type;
  for (let i = 0; i < n; i++) {
    // Ist der passende Ziehstapel leer, wird eine andere Art genommen
    let t = st.piles[type] > 0 ? type : DMG_CARDS.find(k => st.piles[k] > 0);
    if (!t) continue;
    st.piles[t]--;
    kind = t; got++;
    if (onTop) r.deck.push({ t }); else r.disc.push({ t });
  }
  return io && got ? io.emit({ t: 'dmgcard', r: r.id, kind, n: got }) : null;
}
/* Karte aus dem Spiel nehmen: Schadenskarten zurueck in den Vorrat,
   alles andere auf den Ablagestapel des Besitzers. */
function binCard(st, owner, c) {
  if (!c) return;
  if (c.spent) return;                    // liegt schon wieder im Vorrat
  if (isDmgCard(c)) st.piles[c.t]++;
  else owner.disc.push(c);
}
/* Eine im Register gespielte Schadenskarte wandert sofort zurück in ihren
   Ziehstapel — sie ist damit aus dem Deck des Spielers verschwunden. */
function spendDmg(st, card) {
  if (card && isDmgCard(card) && !card.spent) { st.piles[card.t]++; card.spent = true; }
}
function clearRegs(st, r, from) {
  for (let i = from || 0; i < 5; i++) {
    if (r.regs[i]) { binCard(st, r, r.regs[i].c); binCard(st, r, r.regs[i].sub); }
    r.regs[i] = null;
  }
}

async function dmgModern(st, r, amount, io, source, kind, cardType) {
  if (r.out) return;
  // Deflektorschild: einmal je Register alle Roboterlaser abwehren
  if (kind === 'robot' && !r.rebooted && hasUpg(r, 'deflektorschild') && r.energy > 0) {
    if (r.usedThisReg.deflektorschild === st.register ||
        await io.ask(r, 'deflektorschild', 'Deflektorschild: 1 Energie zahlen und alle Roboterlaser dieses Registers abwehren?')) {
      if (r.usedThisReg.deflektorschild !== st.register) { r.energy--; r.usedThisReg.deflektorschild = st.register; }
      await io.emit({ t: 'absorb', r: r.id, by: 'deflektorschild' });
      return;
    }
  }
  let type = cardType || 'spam';
  if (source && kind !== 'board') {
    if (hasUpg(source, 'blauer_todesbildschirm') && Math.abs(source.x - r.x) + Math.abs(source.y - r.y) <= 1
        && await io.ask(source, 'blauer_todesbildschirm', 'Blauer Todesbildschirm: WURM statt SPAM austeilen?')) type = 'worm';
    else if (hasUpg(source, 'trojaner_spritze')) type = 'trojan';
  }
  const onTop = source && type === 'spam' && hasUpg(source, 'korruptionswelle')
    && await io.ask(source, 'korruptionswelle', 'Korruptionswelle: SPAM oben auf das Deck von ' + r.name + ' legen?');
  await takeCards(st, r, amount, type, io, onTop);
}

/* --- Reboot ------------------------------------------------------------- */
async function rebootRobot(st, r, io, reason) {
  if (r.out) return;
  r.rebooted = true;
  clearRegs(st, r, st.register);           // Restliche Register verfallen
  if (!hasUpg(r, 'firewall')) await takeCards(st, r, 2, 'spam', io);
  const spot = rebootSpot(st, r);
  r.x = spot.x; r.y = spot.y;
  r.dir = await io.choose(r, 'rebootDir', { def: spot.d });
  // Steht dort jemand, wird er geschoben
  // Steht dort schon jemand, schiebt der Neuankömmling ihn in Pfeilrichtung
  const occ = st.robots.find(o => o !== r && !o.out && o.x === r.x && o.y === r.y);
  if (occ) await stepMove(st, occ, spot.d, 'reboot', io);
  await io.emit({ t: 'reboot', r: r.id, at: [r.x, r.y], dir: r.dir, reason });
}
function rebootSpot(st, r) {
  const b = st.board;
  for (let i = 0; i < b.cells.length; i++)
    if (b.cells[i].respawn) return { x: i % b.w, y: (i / b.w) | 0, d: b.cells[i].respawn.d };
  return { x: r.ax, y: r.ay, d: r.adir };
}

/* --- Prioritätsantenne -------------------------------------------------- */
function antennaPos(b) {
  for (let i = 0; i < b.cells.length; i++)
    if (b.cells[i].antenna) {
      const d = b.cells[i].antenna.d;
      return [i % b.w, (i / b.w) | 0, d == null ? 2 : d];
    }
  return [(b.w / 2) | 0, 0, 2];
}
/* Nächster Roboter zuerst. Bei Gleichstand wandert eine gedachte Linie aus
   der Antennenschüssel im Uhrzeigersinn — wen sie zuerst erreicht, der zieht. */
function priorityOrder(st, list) {
  const [ax, ay, ad] = antennaPos(st.board);
  const base = ad * Math.PI / 2;
  return list.slice().sort((p, q) => {
    const pc = p.claimPriority === st.turn * 10 + st.register ? 1 : 0;
    const qc = q.claimPriority === st.turn * 10 + st.register ? 1 : 0;
    if (pc !== qc) return qc - pc;
    const dp = Math.abs(p.x - ax) + Math.abs(p.y - ay);
    const dq = Math.abs(q.x - ax) + Math.abs(q.y - ay);
    if (dp !== dq) return dp - dq;
    const ang = r => (Math.atan2(r.x - ax, -(r.y - ay)) - base + Math.PI * 4) % (Math.PI * 2);
    return ang(p) - ang(q);
  });
}

/* --- Rundenablauf -------------------------------------------------------- */
const mAlive = st => st.robots.filter(r => !r.out);

async function mShopPhase(st, io) {
  if (!st.cfg.optionsOn) return;
  const n = mAlive(st).length;
  // Wurde in der Vorrunde nichts gekauft, kommt neue Ware in die Auslage
  // Hat in der Vorrunde niemand gekauft, verlassen die Karten das Spiel
  if (st.shopStale) { st.shop = []; st.shopStale = false; }
  while (st.shop.length < n) {
    if (!st.upgDeck.length) { st.upgDeck = st.rng.shuffle(st.upgDisc); st.upgDisc = []; }
    if (!st.upgDeck.length) break;
    st.shop.push(st.upgDeck.pop());
  }
  await io.emit({ t: 'shop', offers: st.shop.slice() });
  let bought = 0;
  for (const r of priorityOrder(st, mAlive(st))) {
    const afford = st.shop.filter(id => UPGRADES[id].cost <= r.energy);
    if (!afford.length) continue;
    const pick = await io.shop(r, st.shop.slice());
    if (!pick) continue;
    const i = st.shop.indexOf(pick);
    if (i < 0 || UPGRADES[pick].cost > r.energy) continue;
    r.energy -= UPGRADES[pick].cost;
    st.shop.splice(i, 1);
    await installUpgrade(st, r, pick, io);
    bought++;
  }
  st.shopStale = bought === 0;
}

async function mDealPhase(st, io) {
  st.turn++;
  st.register = 0;
  for (const r of mAlive(st)) {
    r.rebooted = false;
    r.usedThisRound = {};
    r.usedThisReg = {};
    clearRegs(st, r, 0);
    for (const c of r.hand) binCard(st, r, c);
    r.hand = [];
    const n = 9 + (hasUpg(r, 'memory_stick') ? 1 : 0);
    for (let i = 0; i < n; i++) r.hand.push(drawFrom(st, r));
  }
  await io.emit({ t: 'deal', turn: st.turn });
}

async function mProgramPhase(st, io) {
  for (const r of priorityOrder(st, mAlive(st))) {
    await io.program(r);
    for (const c of r.hand) binCard(st, r, c);
    r.hand = [];
  }
}

async function mRunRegister(st, io, reg) {
  st.register = reg;
  await io.emit({ t: 'register', n: reg });
  for (const r of mAlive(st)) r.usedThisReg = {};

  const order = priorityOrder(st, mAlive(st).filter(r => !r.rebooted && r.regs[reg - 1]));
  for (const r of order) await io.emit({ t: 'reveal', r: r.id, reg });
  for (const r of order) {
    if (r.rebooted || r.out || st.over) continue;
    if (io.tempWindow) await io.tempWindow(r, 'reg');
    if (r.rebooted || r.out || st.over || !r.regs[reg - 1]) continue;
    await mResolve(st, r, r.regs[reg - 1].c, reg, io, 0);
  }

  await moveBelts(st, io, true);      // blaue Bänder: zwei Felder
  await moveBelts(st, io, false);     // grüne Bänder: ein Feld
  await movePushers(st, io);
  await moveGears(st, io);
  await fireBoardLasers(st, io);
  await mFireRobots(st, io);
  await mEnergySpaces(st, io, reg);
  await touchCheckpoints(st, io);
}

async function mResolve(st, r, card, reg, io, depth) {
  if (!card || r.rebooted || r.out || depth > 5) return;
  switch (card.t) {
    /* Schadenskarten: aufdecken, ausfuehren, danach ablegen.
       Die Schadenskarte selbst liegt im Register und wird am Rundenende
       verbucht — hier darf sie nicht doppelt in den Vorrat wandern. */
    case 'spam': {
      spendDmg(st, card);
      await io.emit({ t: 'dmgplay', r: r.id, kind: 'spam' });
      const nc = drawFrom(st, r);
      await mResolve(st, r, nc, reg, io, depth + 1);
      binCard(st, r, nc);
      return;
    }
    case 'virus': {
      spendDmg(st, card);
      await io.emit({ t: 'dmgplay', r: r.id, kind: 'virus' });
      for (const o of mAlive(st))
        if (Math.abs(o.x - r.x) + Math.abs(o.y - r.y) <= 6) await takeCards(st, o, 1, 'virus', io);
      const nc = drawFrom(st, r);
      await mResolve(st, r, nc, reg, io, depth + 1);
      binCard(st, r, nc);
      return;
    }
    case 'trojan': {
      spendDmg(st, card);
      await io.emit({ t: 'dmgplay', r: r.id, kind: 'trojan' });
      await takeCards(st, r, 2, 'spam', io);
      const nc = drawFrom(st, r);
      await mResolve(st, r, nc, reg, io, depth + 1);
      binCard(st, r, nc);
      return;
    }
    case 'worm':
      spendDmg(st, card);
      await io.emit({ t: 'dmgplay', r: r.id, kind: 'worm' });
      return rebootRobot(st, r, io, 'WURM');
    case 'pwr': case 'r_energy':
      r.energy++;
      await io.emit({ t: 'energy', r: r.id, n: r.energy, gain: 1 });
      return;
    case 'again': case 'r_repeat': {
      const prev = reg >= 2 ? r.regs[reg - 2] : null;
      if (prev) return mResolve(st, r, prev.c, reg, io, depth + 1);
      return;
    }
    case 'r_spin':
      r.dir = await io.choose(r, 'anyDir', { def: r.dir });
      await io.emit({ t: 'rotate', r: r.id, from: r.dir, to: r.dir, cause: 'card' });
      return;
    case 'r_sandbox': {
      const t = await io.choose(r, 'sandbox', {});
      return mResolve(st, r, { t: t || 'm1' }, reg, io, depth + 1);
    }
    case 'r_spamfilter': {
      // Entfernt eine SPAM-Karte endgültig aus dem Ablagestapel
      const i = r.disc.findIndex(c => c.t === 'spam');
      if (i >= 0) { st.piles.spam++; r.disc.splice(i, 1); }
      return;
    }
    case 'r_speed':
      return mSteps(st, r, 3, io);
    case 'rl': case 'rr': case 'u':
      return rotate(st, r, card.t === 'rl' ? -1 : card.t === 'rr' ? 1 : 0, io, 'card');
    default: {
      let n = baseSteps(card);
      if (n === 1 && hasUpg(r, 'bremse') && await io.ask(r, 'bremse', 'Bremse: stehen bleiben statt 1 Feld?')) n = 0;
      // Krabbenbeine: 1 vor, dann seitwärts, dann 1 vor
      if (n === 1 && hasUpg(r, 'krabbenbeine')) {
        const side = await io.choose(r, 'crabSide', {});
        if (side) {
          await mStep(st, r, r.dir, io);
          if (!r.rebooted) await mStep(st, r, side === 'links' ? ccw(r.dir) : cw(r.dir), io);
          if (!r.rebooted) await mStep(st, r, r.dir, io);
          return;
        }
      }
      return mSteps(st, r, n, io);
    }
  }
}

async function mSteps(st, r, n, io) {
  const d = n >= 0 ? r.dir : opp(r.dir);
  const k = Math.abs(n);
  for (let i = 0; i < k; i++) {
    if (r.rebooted || r.out || st.over) { r._flying = false; return; }
    r._flying = i < k - 1;                       // Zwischenschritte dürfen über Gruben
    if (!await mStep(st, r, d, io)) break;
  }
  r._flying = false;
}
/* Ein Feld weit, mit Teleporter- und Flugmodul-Sonderfällen */
async function mStep(st, r, d, io) {
  if (hasUpg(r, 'teleporter') && r.energy > 0 &&
      (wallBlocks(st.board, r.x, r.y, d) || robotAt(st, r.x + DX[d], r.y + DY[d])) &&
      await io.ask(r, 'teleporter', 'Teleporter: 1 Energie zahlen und das Hindernis überspringen?')) {
    r.energy--;
    const nx = r.x + DX[d], ny = r.y + DY[d];
    if (!inBounds(st.board, nx, ny)) { await rebootRobot(st, r, io, 'Rand'); return false; }
    const occ = robotAt(st, nx, ny);
    if (occ) { occ.x = r.x; occ.y = r.y; }
    const fx = r.x, fy = r.y;
    r.x = nx; r.y = ny;
    await io.emit({ t: 'teleport', r: r.id, from: [fx, fy], to: [nx, ny], kind: 'swap' });
    await mLand(st, r, d, io);
    return !r.rebooted;
  }
  const moved = await stepMove(st, r, d, 'card', io);
  return moved;
}
/* Flugmodul: über Gruben hinweg, aber nicht darauf landen */
async function mLand(st, r, d, io) {
  const c = cellAt(st.board, r.x, r.y);
  if (c && c.t === 'pit' && hasUpg(r, 'flugmodul')) {
    const nx = r.x + DX[d], ny = r.y + DY[d];
    if (inBounds(st.board, nx, ny) && !wallBlocks(st.board, r.x, r.y, d) && !robotAt(st, nx, ny)) {
      r.x = nx; r.y = ny;
      await io.emit({ t: 'move', r: r.id, from: [r.x - DX[d], r.y - DY[d]], to: [r.x, r.y], dir: d, cause: 'fly' });
      return;
    }
  }
  await landOn(st, r, d, 'card', io);
}

async function mEnergySpaces(st, io, reg) {
  for (const r of mAlive(st)) {
    if (r.rebooted) continue;
    const c = cellAt(st.board, r.x, r.y);
    if (!c || !c.energy) continue;
    const key = r.x + ',' + r.y;
    if (st.cubes[key] || reg === 5) {
      if (st.cubes[key]) delete st.cubes[key];
      r.energy++;
      await io.emit({ t: 'energy', r: r.id, n: r.energy, gain: 1, at: [r.x, r.y] });
    }
  }
}

async function mEndTurn(st, io) {
  st.register = 0;
  for (const r of mAlive(st)) clearRegs(st, r, 0);
  await io.emit({ t: 'endTurn', turn: st.turn });
}

async function mPlayTurn(st, io) {
  await mShopPhase(st, io);
  await mDealPhase(st, io);
  await mProgramPhase(st, io);
  for (let reg = 1; reg <= 5 && !st.over; reg++) await mRunRegister(st, io, reg);
  if (!st.over) await mEndTurn(st, io);
}

/* Einheitlicher Einstieg für beide Regelwerke */
async function playRound(st, io) {
  return st.rules === 'modern' ? mPlayTurn(st, io) : playTurn(st, io);
}
