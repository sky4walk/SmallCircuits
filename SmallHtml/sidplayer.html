<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SID Player</title>
<style>
  :root{
    --c64-blue:#4040e0;
    --c64-lightblue:#a0a0ff;
    --bg:#1a1a2e;
    --panel:#25254a;
    --text:#c8c8ff;
    --accent:#7c7cff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg);
    font-family:'Courier New', monospace; color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px;
  }
  .player{
    background:var(--panel); border:3px solid var(--c64-blue);
    border-radius:8px; padding:24px; width:100%; max-width:560px;
    box-shadow:0 0 40px rgba(64,64,224,0.35);
  }
  h1{
    font-size:20px; letter-spacing:2px; margin:0 0 16px; color:var(--c64-lightblue);
    text-align:center; text-shadow:0 0 8px rgba(160,160,255,0.6);
  }
  .drop{
    border:2px dashed var(--accent); border-radius:6px; padding:18px;
    text-align:center; cursor:pointer; margin-bottom:16px; font-size:13px;
    transition:background .15s;
  }
  .drop.drag{ background:rgba(124,124,255,0.15); }
  #fileInput{ display:none; }
  .meta{ font-size:13px; line-height:1.6; margin-bottom:14px; min-height:64px; word-break:break-word; }
  .meta .label{ color:var(--accent); }
  canvas#scope{
    width:100%; height:80px; background:#0d0d1a; border:1px solid var(--c64-blue);
    border-radius:4px; display:block; margin-bottom:16px;
  }
  .controls{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  button{
    background:var(--c64-blue); color:#fff; border:none; border-radius:4px;
    padding:8px 14px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  button:hover{ background:var(--accent); }
  button:disabled{ opacity:.4; cursor:default; }
  .row{ display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  label{ font-size:12px; color:var(--accent); }
  input[type=range]{ width:120px; }
  select{ background:#0d0d1a; color:var(--text); border:1px solid var(--c64-blue); border-radius:4px; padding:4px; font-family:inherit; }
  #subtunes{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  #subtunes button{ padding:4px 10px; background:#333366; }
  #subtunes button.active{ background:var(--accent); }
  #status{ font-size:12px; color:#8888cc; min-height:16px; }
  footer{ margin-top:14px; font-size:12px; color:#8888cc; text-align:center; }
  footer a{ color:var(--c64-lightblue); }
</style>
</head>
<body>
<div class="player">
  <h1>&#9835; SID PLAYER</h1>

  <div class="drop" id="drop">
    .sid / .psid Datei hier ablegen oder klicken zum Auswählen
    <input type="file" id="fileInput" accept=".sid,.psid">
  </div>

  <div class="meta" id="meta">Keine Datei geladen.</div>

  <canvas id="scope" width="600" height="80"></canvas>

  <div id="subtunes"></div>

  <div class="controls">
    <button id="playBtn" disabled>&#9654; Play</button>
    <button id="pauseBtn" disabled>&#10074;&#10074; Pause</button>
    <button id="stopBtn" disabled>&#9632; Stop</button>
  </div>

  <div class="row">
    <label>Volume</label>
    <input type="range" id="volume" min="0" max="100" value="80">
    <label><input type="checkbox" id="filterOn" checked> Filter</label>
    <label>Modell
      <select id="sidModel">
        <option value="6581">MOS 6581</option>
        <option value="8580">MOS 8580</option>
      </select>
    </label>
  </div>

  <div id="status"></div>
</div>
<footer>
  Mehr Basteleien: <a href="https://itzwieseltal.wordpress.com" target="_blank" rel="noopener">itzwieseltal.wordpress.com</a>
  &middot; <a href="https://zwieselbrau.wordpress.com" target="_blank" rel="noopener">zwieselbrau.wordpress.com</a>
</footer>

<script>
/* ============================================================
   SID PLAYER
   6502-CPU, CIA1/CIA2, VIC-Rasterzähler und SID laufen komplett in
   einem AudioWorkletProcessor. Die CPU läuft durchgehend zyklusgenau
   gegen den Audiotakt; init/play werden – wie beim PSID-Treiber von
   sidplay – aus einer Leerlaufschleife heraus angesprungen. Dadurch
   blockiert nichts den Audio-Thread, und NMIs (CIA2-Digis) laufen
   auch während init/play weiter.
   ============================================================ */

// ---------- Worklet-Code als String (läuft in eigenem Audio-Thread) ----------
const workletCode = `
// ============================================================
// 6502 / 6510 (inkl. stabiler illegaler Opcodes)
// ============================================================
class CPU6502 {
  constructor(readFn, writeFn){
    this.read = readFn;
    this.write = writeFn;
    this.reset();
  }
  reset(){
    this.a=0; this.x=0; this.y=0; this.sp=0xFF; this.pc=0;
    this.n=false; this.v=false; this.b=false; this.d=false; this.i=true; this.z=false; this.c=false;
    this.jam=false; this.px=0; this.extra=0;
  }
  getP(){
    return (this.n?0x80:0)|(this.v?0x40:0)|0x20|(this.b?0x10:0)|(this.d?0x08:0)|(this.i?0x04:0)|(this.z?0x02:0)|(this.c?0x01:0);
  }
  setP(p){
    this.n=!!(p&0x80); this.v=!!(p&0x40); this.b=!!(p&0x10);
    this.d=!!(p&0x08); this.i=!!(p&0x04); this.z=!!(p&0x02); this.c=!!(p&0x01);
  }
  push(v){ this.write(0x100+this.sp, v&0xff); this.sp=(this.sp-1)&0xff; }
  pop(){ this.sp=(this.sp+1)&0xff; return this.read(0x100+this.sp); }
  irq(){
    this.push((this.pc>>8)&0xff); this.push(this.pc&0xff);
    this.push(this.getP()&~0x10);
    this.i = true;
    this.pc = this.read(0xFFFE) | (this.read(0xFFFF)<<8);
    return 7;
  }
  nmi(){
    this.jam = false;
    this.push((this.pc>>8)&0xff); this.push(this.pc&0xff);
    this.push(this.getP()&~0x10);
    this.i = true;
    this.pc = this.read(0xFFFA) | (this.read(0xFFFB)<<8);
    return 7;
  }
  setNZ(v){ this.n = !!(v&0x80); this.z = (v&0xff)===0; }
  fetch(){ const v=this.read(this.pc); this.pc=(this.pc+1)&0xffff; return v; }
  fetch16(){ const lo=this.fetch(), hi=this.fetch(); return lo|(hi<<8); }

  // Adressierungsarten: liefern die Adresse, setzen this.px bei Seitenwechsel
  imm(){ const a=this.pc; this.pc=(a+1)&0xffff; return a; }
  zp(){ return this.fetch(); }
  zpx(){ return (this.fetch()+this.x)&0xff; }
  zpy(){ return (this.fetch()+this.y)&0xff; }
  abs(){ return this.fetch16(); }
  absx(){ const b=this.fetch16(), a=(b+this.x)&0xffff; this.px=((b^a)&0xff00)?1:0; return a; }
  absy(){ const b=this.fetch16(), a=(b+this.y)&0xffff; this.px=((b^a)&0xff00)?1:0; return a; }
  ind(){
    const p=this.fetch16();
    return this.read(p) | (this.read((p&0xff00)|((p+1)&0xff))<<8); // 6502-Seitenfehler
  }
  indx(){
    const z=(this.fetch()+this.x)&0xff;
    return this.read(z) | (this.read((z+1)&0xff)<<8);
  }
  indy(){
    const z=this.fetch();
    const b=this.read(z) | (this.read((z+1)&0xff)<<8);
    const a=(b+this.y)&0xffff;
    this.px=((b^a)&0xff00)?1:0;
    return a;
  }

  step(){
    if(this.jam) return 2;
    const op=this.fetch();
    const ins=OPS[op];
    this.px=0; this.extra=0;
    const ea = ins.mode ? this[ins.mode]() : 0;
    ins.fn.call(this, ea, op);
    return ins.cycles + (ins.pageExtra?this.px:0) + this.extra;
  }
}

// ----- ALU-Hilfsfunktionen -----
function ADC(cpu, v){
  const cin = cpu.c?1:0;
  if(cpu.d){
    let lo=(cpu.a&0x0f)+(v&0x0f)+cin;
    let hi=(cpu.a>>4)+(v>>4);
    if(lo>9){ lo+=6; hi++; }
    cpu.z = ((cpu.a+v+cin)&0xff)===0;
    cpu.n = !!(hi&0x08);
    cpu.v = !!(~(cpu.a^v) & (cpu.a^(hi<<4)) & 0x80);
    if(hi>9){ hi+=6; }
    cpu.c = hi>15;
    cpu.a = ((hi<<4)|(lo&0x0f)) & 0xff;
  } else {
    const sum = cpu.a + v + cin;
    cpu.v = !!(~(cpu.a^v) & (cpu.a^sum) & 0x80);
    cpu.c = sum>0xff;
    cpu.a = sum & 0xff;
    cpu.setNZ(cpu.a);
  }
}
function SBC(cpu, v){
  const bin = cpu.c?0:1;
  const diff = cpu.a - v - bin;
  if(cpu.d){
    let lo = (cpu.a&0x0f) - (v&0x0f) - bin;
    let hi = (cpu.a>>4) - (v>>4);
    if(lo<0){ lo-=6; hi--; }
    if(hi<0){ hi-=6; }
    cpu.v = !!((cpu.a^v) & (cpu.a^diff) & 0x80);
    cpu.c = diff >= 0;
    cpu.setNZ(diff&0xff);
    cpu.a = ((hi<<4)|(lo&0x0f)) & 0xff;
  } else {
    cpu.v = !!((cpu.a^v) & (cpu.a^diff) & 0x80);
    cpu.c = diff >= 0;
    cpu.a = diff & 0xff;
    cpu.setNZ(cpu.a);
  }
}
function CMP(cpu, reg, v){ cpu.c = reg>=v; cpu.setNZ((reg-v)&0xff); }
function ASL(c,v){ c.c=!!(v&0x80); v=(v<<1)&0xff; c.setNZ(v); return v; }
function LSR(c,v){ c.c=!!(v&1); v=v>>1; c.setNZ(v); return v; }
function ROL(c,v){ const o=c.c?1:0; c.c=!!(v&0x80); v=((v<<1)|o)&0xff; c.setNZ(v); return v; }
function ROR(c,v){ const o=c.c?0x80:0; c.c=!!(v&1); v=(v>>1)|o; c.setNZ(v); return v; }
function INC(c,v){ v=(v+1)&0xff; c.setNZ(v); return v; }
function DEC(c,v){ v=(v-1)&0xff; c.setNZ(v); return v; }

const OPS = new Array(256);
function def(op, mode, cycles, fn, pageExtra){ OPS[op] = {mode, cycles, fn, pageExtra:!!pageExtra}; }

// Lesebefehle in 8 Adressierungsarten (ORA/AND/EOR/ADC/LDA/CMP/SBC)
function aluGroup(base, fn){
  def(base+0x09,'imm',2,fn); def(base+0x05,'zp',3,fn); def(base+0x15,'zpx',4,fn);
  def(base+0x0D,'abs',4,fn); def(base+0x1D,'absx',4,fn,true); def(base+0x19,'absy',4,fn,true);
  def(base+0x01,'indx',6,fn); def(base+0x11,'indy',5,fn,true);
}
aluGroup(0x00, function(a){ this.a|=this.read(a); this.setNZ(this.a); });
aluGroup(0x20, function(a){ this.a&=this.read(a); this.setNZ(this.a); });
aluGroup(0x40, function(a){ this.a^=this.read(a); this.setNZ(this.a); });
aluGroup(0x60, function(a){ ADC(this, this.read(a)); });
aluGroup(0xA0, function(a){ this.a=this.read(a); this.setNZ(this.a); });
aluGroup(0xC0, function(a){ CMP(this,this.a,this.read(a)); });
aluGroup(0xE0, function(a){ SBC(this, this.read(a)); });
def(0xEB,'imm',2,function(a){ SBC(this, this.read(a)); }); // illegales SBC #imm

// STA (kein Zusatzzyklus, feste Zykluszahl)
def(0x85,'zp',3,function(a){ this.write(a,this.a); });
def(0x95,'zpx',4,function(a){ this.write(a,this.a); });
def(0x8D,'abs',4,function(a){ this.write(a,this.a); });
def(0x9D,'absx',5,function(a){ this.write(a,this.a); });
def(0x99,'absy',5,function(a){ this.write(a,this.a); });
def(0x81,'indx',6,function(a){ this.write(a,this.a); });
def(0x91,'indy',6,function(a){ this.write(a,this.a); });

def(0xA2,'imm',2,function(a){ this.x=this.read(a); this.setNZ(this.x); });
def(0xA6,'zp',3,function(a){ this.x=this.read(a); this.setNZ(this.x); });
def(0xB6,'zpy',4,function(a){ this.x=this.read(a); this.setNZ(this.x); });
def(0xAE,'abs',4,function(a){ this.x=this.read(a); this.setNZ(this.x); });
def(0xBE,'absy',4,function(a){ this.x=this.read(a); this.setNZ(this.x); },true);
def(0xA0,'imm',2,function(a){ this.y=this.read(a); this.setNZ(this.y); });
def(0xA4,'zp',3,function(a){ this.y=this.read(a); this.setNZ(this.y); });
def(0xB4,'zpx',4,function(a){ this.y=this.read(a); this.setNZ(this.y); });
def(0xAC,'abs',4,function(a){ this.y=this.read(a); this.setNZ(this.y); });
def(0xBC,'absx',4,function(a){ this.y=this.read(a); this.setNZ(this.y); },true);
def(0x86,'zp',3,function(a){ this.write(a,this.x); });
def(0x96,'zpy',4,function(a){ this.write(a,this.x); });
def(0x8E,'abs',4,function(a){ this.write(a,this.x); });
def(0x84,'zp',3,function(a){ this.write(a,this.y); });
def(0x94,'zpx',4,function(a){ this.write(a,this.y); });
def(0x8C,'abs',4,function(a){ this.write(a,this.y); });

def(0xE0,'imm',2,function(a){ CMP(this,this.x,this.read(a)); });
def(0xE4,'zp',3,function(a){ CMP(this,this.x,this.read(a)); });
def(0xEC,'abs',4,function(a){ CMP(this,this.x,this.read(a)); });
def(0xC0,'imm',2,function(a){ CMP(this,this.y,this.read(a)); });
def(0xC4,'zp',3,function(a){ CMP(this,this.y,this.read(a)); });
def(0xCC,'abs',4,function(a){ CMP(this,this.y,this.read(a)); });
def(0x24,'zp',3,function(a){ const v=this.read(a); this.z=(this.a&v)===0; this.n=!!(v&0x80); this.v=!!(v&0x40); });
def(0x2C,'abs',4,function(a){ const v=this.read(a); this.z=(this.a&v)===0; this.n=!!(v&0x80); this.v=!!(v&0x40); });

// Read-Modify-Write: wie der echte 6502 wird erst der alte, dann der neue Wert
// geschrieben (wichtig für das übliche "INC $D019"/"ASL $D019" zum IRQ-Quittieren)
function rmw(op){ return function(a){ const v=this.read(a); this.write(a,v); this.write(a, op(this,v)); }; }
function rmwGroup(base, op){
  const f=rmw(op);
  def(base+0x06,'zp',5,f); def(base+0x16,'zpx',6,f); def(base+0x0E,'abs',6,f); def(base+0x1E,'absx',7,f);
}
rmwGroup(0x00, ASL); rmwGroup(0x20, ROL); rmwGroup(0x40, LSR); rmwGroup(0x60, ROR);
rmwGroup(0xC0, DEC); rmwGroup(0xE0, INC);
def(0x0A,null,2,function(){ this.a=ASL(this,this.a); });
def(0x4A,null,2,function(){ this.a=LSR(this,this.a); });
def(0x2A,null,2,function(){ this.a=ROL(this,this.a); });
def(0x6A,null,2,function(){ this.a=ROR(this,this.a); });

// Illegale RMW-Kombinationen (SLO, RLA, SRE, RRA, DCP, ISC)
function illRmwGroup(base, fn){
  def(base+0x07,'zp',5,fn); def(base+0x17,'zpx',6,fn); def(base+0x0F,'abs',6,fn);
  def(base+0x1F,'absx',7,fn); def(base+0x1B,'absy',7,fn); def(base+0x03,'indx',8,fn); def(base+0x13,'indy',8,fn);
}
illRmwGroup(0x00, function(a){ let v=this.read(a); this.write(a,v); v=ASL(this,v); this.write(a,v); this.a|=v; this.setNZ(this.a); });
illRmwGroup(0x20, function(a){ let v=this.read(a); this.write(a,v); v=ROL(this,v); this.write(a,v); this.a&=v; this.setNZ(this.a); });
illRmwGroup(0x40, function(a){ let v=this.read(a); this.write(a,v); v=LSR(this,v); this.write(a,v); this.a^=v; this.setNZ(this.a); });
illRmwGroup(0x60, function(a){ let v=this.read(a); this.write(a,v); v=ROR(this,v); this.write(a,v); ADC(this,v); });
illRmwGroup(0xC0, function(a){ let v=this.read(a); this.write(a,v); v=(v-1)&0xff; this.write(a,v); CMP(this,this.a,v); });
illRmwGroup(0xE0, function(a){ let v=this.read(a); this.write(a,v); v=(v+1)&0xff; this.write(a,v); SBC(this,v); });

// LAX / SAX
const LAX=function(a){ this.a=this.x=this.read(a); this.setNZ(this.a); };
def(0xA7,'zp',3,LAX); def(0xB7,'zpy',4,LAX); def(0xAF,'abs',4,LAX);
def(0xBF,'absy',4,LAX,true); def(0xA3,'indx',6,LAX); def(0xB3,'indy',5,LAX,true);
def(0xAB,'imm',2,LAX);
const SAX=function(a){ this.write(a, this.a&this.x); };
def(0x87,'zp',3,SAX); def(0x97,'zpy',4,SAX); def(0x8F,'abs',4,SAX); def(0x83,'indx',6,SAX);

// Weitere illegale Immediate-Befehle
def(0x0B,'imm',2,function(a){ this.a&=this.read(a); this.setNZ(this.a); this.c=this.n; });  // ANC
def(0x2B,'imm',2,function(a){ this.a&=this.read(a); this.setNZ(this.a); this.c=this.n; });  // ANC
def(0x4B,'imm',2,function(a){ this.a=LSR(this, this.a&this.read(a)); });                     // ALR
def(0x6B,'imm',2,function(a){                                                                // ARR
  const t=this.a&this.read(a); this.a=((t>>1)|(this.c?0x80:0))&0xff; this.setNZ(this.a);
  this.c=!!(this.a&0x40); this.v=!!(((this.a>>6)^(this.a>>5))&1);
});
def(0xCB,'imm',2,function(a){ const t=this.a&this.x, v=this.read(a); this.c=t>=v; this.x=(t-v)&0xff; this.setNZ(this.x); }); // SBX
def(0x8B,'imm',2,function(a){ this.a=(this.a|0xEE)&this.x&this.read(a); this.setNZ(this.a); });   // ANE (instabil)
// Instabile Speicherbefehle (Näherung über High-Byte+1)
function hiPlus1(a, idx){ return ((((a-idx)&0xffff)>>8)+1)&0xff; }
def(0x9F,'absy',5,function(a){ this.write(a, this.a&this.x&hiPlus1(a,this.y)); }); // SHA
def(0x93,'indy',6,function(a){ this.write(a, this.a&this.x&hiPlus1(a,this.y)); }); // SHA
def(0x9E,'absy',5,function(a){ this.write(a, this.x&hiPlus1(a,this.y)); });        // SHX
def(0x9C,'absx',5,function(a){ this.write(a, this.y&hiPlus1(a,this.x)); });        // SHY
def(0x9B,'absy',5,function(a){ this.sp=this.a&this.x; this.write(a, this.sp&hiPlus1(a,this.y)); }); // TAS
def(0xBB,'absy',4,function(a){ const v=this.read(a)&this.sp; this.a=this.x=this.sp=v; this.setNZ(v); },true); // LAS

// NOPs mit Operanden (Operanden müssen übersprungen werden!)
const NOP=function(){};
const NOPR=function(a){ this.read(a); };
for(const op of [0x1A,0x3A,0x5A,0x7A,0xDA,0xFA,0xEA]) def(op,null,2,NOP);
for(const op of [0x80,0x82,0x89,0xC2,0xE2]) def(op,'imm',2,NOP);
for(const op of [0x04,0x44,0x64]) def(op,'zp',3,NOP);
for(const op of [0x14,0x34,0x54,0x74,0xD4,0xF4]) def(op,'zpx',4,NOP);
def(0x0C,'abs',4,NOPR);
for(const op of [0x1C,0x3C,0x5C,0x7C,0xDC,0xFC]) def(op,'absx',4,NOPR,true);
// JAM/KIL: CPU bleibt stehen
for(const op of [0x02,0x12,0x22,0x32,0x42,0x52,0x62,0x72,0x92,0xB2,0xD2,0xF2])
  def(op,null,2,function(){ this.jam=true; this.pc=(this.pc-1)&0xffff; });

// Transfers
def(0xAA,null,2,function(){ this.x=this.a; this.setNZ(this.x); });
def(0xA8,null,2,function(){ this.y=this.a; this.setNZ(this.y); });
def(0xBA,null,2,function(){ this.x=this.sp; this.setNZ(this.x); });
def(0x8A,null,2,function(){ this.a=this.x; this.setNZ(this.a); });
def(0x9A,null,2,function(){ this.sp=this.x; });
def(0x98,null,2,function(){ this.a=this.y; this.setNZ(this.a); });
// Stack
def(0x48,null,3,function(){ this.push(this.a); });
def(0x68,null,4,function(){ this.a=this.pop(); this.setNZ(this.a); });
def(0x08,null,3,function(){ this.push(this.getP()|0x10); });
def(0x28,null,4,function(){ this.setP(this.pop()); });
// Inc/Dec Register
def(0xE8,null,2,function(){ this.x=(this.x+1)&0xff; this.setNZ(this.x); });
def(0xC8,null,2,function(){ this.y=(this.y+1)&0xff; this.setNZ(this.y); });
def(0xCA,null,2,function(){ this.x=(this.x-1)&0xff; this.setNZ(this.x); });
def(0x88,null,2,function(){ this.y=(this.y-1)&0xff; this.setNZ(this.y); });
// Flags
def(0x18,null,2,function(){ this.c=false; });
def(0x38,null,2,function(){ this.c=true; });
def(0x58,null,2,function(){ this.i=false; });
def(0x78,null,2,function(){ this.i=true; });
def(0xB8,null,2,function(){ this.v=false; });
def(0xD8,null,2,function(){ this.d=false; });
def(0xF8,null,2,function(){ this.d=true; });

// Verzweigungen: +1 Zyklus wenn genommen, +1 bei Seitenwechsel
function branchOp(cond){
  return function(){
    const off=this.fetch();
    if(cond(this)){
      const old=this.pc;
      this.pc=(old + (off<0x80?off:off-256))&0xffff;
      this.extra = 1 + (((old^this.pc)&0xff00)?1:0);
    }
  };
}
def(0x90,null,2,branchOp(c=>!c.c)); // BCC
def(0xB0,null,2,branchOp(c=>c.c));  // BCS
def(0xF0,null,2,branchOp(c=>c.z));  // BEQ
def(0xD0,null,2,branchOp(c=>!c.z)); // BNE
def(0x30,null,2,branchOp(c=>c.n));  // BMI
def(0x10,null,2,branchOp(c=>!c.n)); // BPL
def(0x50,null,2,branchOp(c=>!c.v)); // BVC
def(0x70,null,2,branchOp(c=>c.v));  // BVS

// Sprünge / Unterprogramme
def(0x4C,'abs',3,function(a){ this.pc=a; });
def(0x6C,'ind',5,function(a){ this.pc=a; });
def(0x20,null,6,function(){
  const target=this.fetch16();
  const ret=(this.pc-1)&0xffff;
  this.push((ret>>8)&0xff); this.push(ret&0xff);
  this.pc=target;
});
def(0x60,null,6,function(){
  const lo=this.pop(), hi=this.pop();
  this.pc=((lo|(hi<<8))+1)&0xffff;
});
def(0x00,null,7,function(){
  this.pc=(this.pc+1)&0xffff;
  this.push((this.pc>>8)&0xff); this.push(this.pc&0xff);
  this.push(this.getP()|0x10);
  this.i=true;
  this.pc = this.read(0xFFFE)|(this.read(0xFFFF)<<8);
});
def(0x40,null,6,function(){
  this.setP(this.pop());
  const lo=this.pop(), hi=this.pop();
  this.pc=lo|(hi<<8);
});

// ============================================================
// CIA 6526 (Timer A/B, ICR)
// ============================================================
class CIA {
  constructor(){ this.reset(); }
  reset(){
    this.taLatch=0xffff; this.ta=0xffff; this.tbLatch=0xffff; this.tb=0xffff;
    this.cra=0; this.crb=0; this.icrMask=0; this.icrFlags=0;
    this.regs=new Uint8Array(16).fill(0xff);
  }
  get irq(){ return (this.icrFlags & this.icrMask & 0x1f) !== 0; }
  read(r){
    switch(r){
      case 0x00: case 0x01: return 0xff;           // Ports: keine Taste gedrückt
      case 0x04: return this.ta & 0xff;
      case 0x05: return (this.ta>>8) & 0xff;
      case 0x06: return this.tb & 0xff;
      case 0x07: return (this.tb>>8) & 0xff;
      case 0x0d: {
        const v = (this.icrFlags & 0x1f) | (this.irq?0x80:0);
        this.icrFlags = 0;                          // Lesen quittiert
        return v;
      }
      case 0x0e: return this.cra & 0xef;
      case 0x0f: return this.crb & 0xef;
      default: return this.regs[r];
    }
  }
  write(r, v){
    switch(r){
      case 0x04: this.taLatch=(this.taLatch&0xff00)|v; break;
      case 0x05: this.taLatch=(this.taLatch&0x00ff)|(v<<8); if(!(this.cra&1)) this.ta=this.taLatch; break;
      case 0x06: this.tbLatch=(this.tbLatch&0xff00)|v; break;
      case 0x07: this.tbLatch=(this.tbLatch&0x00ff)|(v<<8); if(!(this.crb&1)) this.tb=this.tbLatch; break;
      case 0x0d:
        if(v & 0x80) this.icrMask |= (v & 0x1f);
        else this.icrMask &= ~(v & 0x1f);
        break;
      case 0x0e: if(v&0x10) this.ta=this.taLatch; this.cra=v&0xef; break;
      case 0x0f: if(v&0x10) this.tb=this.tbLatch; this.crb=v&0xef; break;
      default: this.regs[r]=v;
    }
  }
  tick(c){
    let aUnder = 0;
    if(this.cra & 1){
      let t = this.ta - c;
      while(t < 0){                                 // Periode = Latch+1 Takte
        aUnder++; this.icrFlags |= 0x01;
        if(this.cra & 0x08){ this.cra &= ~1; t = this.taLatch; break; }
        t += this.taLatch + 1;
      }
      this.ta = t;
    }
    if(this.crb & 1){
      const mode = this.crb & 0x60;
      const dec = mode===0x00 ? c : (mode===0x40 ? aUnder : 0);
      if(dec){
        let t = this.tb - dec;
        while(t < 0){
          this.icrFlags |= 0x02;
          if(this.crb & 0x08){ this.crb &= ~1; t = this.tbLatch; break; }
          t += this.tbLatch + 1;
        }
        this.tb = t;
      }
    }
  }
}

// ============================================================
// SID 6581 / 8580
// ============================================================
// Echte Zählerperioden des SID-Hüllkurvengenerators (Takte pro Schritt)
const RATE = [9,32,63,95,149,220,267,313,392,977,1954,3126,3907,11720,19532,31251];
function expDivisor(level){
  if(level>=93) return 1;
  if(level>=54) return 2;
  if(level>=26) return 4;
  if(level>=14) return 8;
  if(level>=6) return 16;
  if(level>0) return 30;
  return 1;
}
const ENV_ATTACK=0, ENV_DECAY=1, ENV_RELEASE=2;

class Voice {
  constructor(){
    this.freq=0; this.pw=0; this.ctrl=0; this.ad=0; this.sr=0;
    this.acc=0;                    // 24-Bit-Phasenakku
    this.noiseShift=0x7ffff8;      // 23-Bit-LFSR
    this.env=0; this.envState=ENV_RELEASE; this.rateCnt=0;
    this.msbRose=false; this.over=0;
  }
  writeCtrl(v){
    const gate=!!(v&1), prevGate=!!(this.ctrl&1);
    if(gate && !prevGate) this.envState=ENV_ATTACK;
    else if(!gate && prevGate) this.envState=ENV_RELEASE;
    if(v&0x08){ this.acc=0; this.noiseShift=0x7fffff; }   // Test-Bit
    this.ctrl=v;
  }
  clockNoise(){
    const bit = ((this.noiseShift>>22)^(this.noiseShift>>17))&1;
    this.noiseShift = ((this.noiseShift<<1)|bit) & 0x7fffff;
  }
  advance(c){
    this.msbRose=false;
    if(this.ctrl & 0x08){ this.acc=0; return; }
    const a0=this.acc, a1=a0+this.freq*c;
    // Rauschen: jede steigende Flanke von Bit 19 taktet das LFSR
    let n = Math.floor((a1-0x80000)/0x100000) - Math.floor((a0-0x80000)/0x100000);
    if(n>32) n=32;
    while(n-- > 0) this.clockNoise();
    // steigende MSB-Flanke für Hard-Sync merken (inkl. Restzeit danach)
    const k = Math.floor((a1-0x800000)/0x1000000) - Math.floor((a0-0x800000)/0x1000000);
    if(k>0 && this.freq>0){ this.msbRose=true; this.over=((a1-0x800000)%0x1000000)/this.freq; }
    this.acc = a1 % 0x1000000;
  }
  advanceEnvelope(c){
    this.rateCnt += c;
    let guard = 0;
    for(;;){
      let period;
      if(this.envState===ENV_ATTACK) period = RATE[this.ad>>4];
      else if(this.envState===ENV_DECAY) period = RATE[this.ad&0x0f]*expDivisor(this.env);
      else period = RATE[this.sr&0x0f]*expDivisor(this.env);
      if(this.rateCnt < period) break;
      if(++guard > 16){ this.rateCnt %= period; break; }
      this.rateCnt -= period;
      if(this.envState===ENV_ATTACK){
        this.env++;
        if(this.env>=255){ this.env=255; this.envState=ENV_DECAY; }
      } else if(this.envState===ENV_DECAY){
        // Decay und Sustain sind ein Zustand: es wird nur abwärts gezählt,
        // solange der Pegel über dem Sustain-Wert liegt (nie aufwärts)
        if(this.env > (this.sr>>4)*17) this.env--;
      } else {
        if(this.env>0) this.env--;
      }
    }
  }
  // 12-Bit-Wellenformausgang, -1 = keine Wellenform gewählt
  wave(srcAcc){
    const w=(this.ctrl>>4)&0x0f;
    if(!w) return -1;
    const acc=this.acc|0;
    let out=0xfff;
    if(w&1){ // Dreieck, ggf. mit Ringmodulation (MSB XOR Quelle)
      const msb = ((this.ctrl&0x04) ? ((acc^srcAcc)>>23) : (acc>>23)) & 1;
      let t=(acc>>11)&0xfff;
      if(msb) t^=0xfff;
      out&=t;
    }
    if(w&2) out &= (acc>>12)&0xfff;
    if(w&4) out &= ((this.ctrl&0x08) || ((acc>>12)&0xfff) >= this.pw) ? 0xfff : 0;
    if(w&8){
      const n=this.noiseShift;
      const nz = ((n>>22)&1)<<7 | ((n>>20)&1)<<6 | ((n>>16)&1)<<5 | ((n>>13)&1)<<4 |
                 ((n>>11)&1)<<3 | ((n>>7)&1)<<2 | ((n>>4)&1)<<1 | ((n>>2)&1);
      out &= nz<<4;
    }
    return out;
  }
}

class SID {
  constructor(model){
    this.voices=[new Voice(), new Voice(), new Voice()];
    this.fcLo=0; this.fcHi=0; this.resFilt=0; this.modeVol=0;
    this.filterOn=true;
    this.lp=0; this.bp=0;
    this.dcIn=0; this.dcOut=0;
    this.setModel(model||6581);
  }
  setModel(m){ this.model = (m==8580) ? 8580 : 6581; }
  writeRegister(reg, val){
    reg &= 0x1f;
    if(reg<7) this.writeVoice(0, reg, val);
    else if(reg<14) this.writeVoice(1, reg-7, val);
    else if(reg<21) this.writeVoice(2, reg-14, val);
    else if(reg===21) this.fcLo=val;
    else if(reg===22) this.fcHi=val;
    else if(reg===23) this.resFilt=val;
    else if(reg===24) this.modeVol=val;
  }
  readRegister(reg){
    reg &= 0x1f;
    if(reg===0x19 || reg===0x1a) return 0xff;              // Paddles: nicht angeschlossen
    if(reg===0x1b){                                        // OSC3: oberste 8 Bit der Wellenform von Stimme 3
      const w=this.voices[2].wave(this.voices[1].acc|0);
      return w<0 ? 0 : (w>>4);
    }
    if(reg===0x1c) return this.voices[2].env;              // ENV3
    return 0;                                              // Schreibregister
  }
  writeVoice(idx, r, val){
    const vo=this.voices[idx];
    switch(r){
      case 0: vo.freq=(vo.freq&0xff00)|val; break;
      case 1: vo.freq=(vo.freq&0x00ff)|(val<<8); break;
      case 2: vo.pw=(vo.pw&0x0f00)|val; break;
      case 3: vo.pw=(vo.pw&0x00ff)|((val&0x0f)<<8); break;
      case 4: vo.writeCtrl(val); break;
      case 5: vo.ad=val; break;
      case 6: vo.sr=val; break;
    }
  }
  cutoffHz(){
    const reg=((this.fcHi<<3)|(this.fcLo&0x07))&0x7ff;
    const x=reg/2047;
    // 8580: nahezu linear bis ~12,5 kHz; 6581: unten flach (~200 Hz), dann steil (Näherung)
    return this.model===8580 ? 30 + x*12470 : 200 + 17800*Math.pow(x, 2.2);
  }
  process(c){
    const vs=this.voices;
    for(let i=0;i<3;i++) vs[i].advance(c);
    // Hard-Sync: Stimme 1<-3, 2<-1, 3<-2
    for(let i=0;i<3;i++){
      const v=vs[i], s=vs[(i+2)%3];
      if((v.ctrl&0x02) && s.msbRose && !(v.ctrl&0x08)) v.acc=(v.freq*s.over)%0x1000000;
    }
    const out=[0,0,0];
    for(let i=0;i<3;i++){
      const v=vs[i];
      v.advanceEnvelope(c);
      const w=v.wave(vs[(i+2)%3].acc|0);
      out[i] = w<0 ? 0 : ((w-2048)/2048) * (v.env/255);
    }
    const filtSelect = this.resFilt & 0x07;
    const voice3Off = !!(this.modeVol & 0x80);
    let filtered=0, unfiltered=0;
    for(let i=0;i<3;i++){
      if(filtSelect & (1<<i)) filtered += out[i];
      else if(!(i===2 && voice3Off)) unfiltered += out[i];   // 3OFF wirkt nur ungefiltert
    }
    let filterOutput = filtered;
    if(this.filterOn){
      // Chamberlin-State-Variable-Filter, 2-fach überabgetastet (stabil bis in den kHz-Bereich)
      const sr=this.sampleRateHint;
      const hz=Math.min(this.cutoffHz(), sr*0.45);
      const f=2*Math.sin(Math.PI*hz/(2*sr));
      const res=(this.resFilt>>4)&0x0f;
      const damp = this.model===8580 ? 1.4 - res*0.085 : 1.4 - res*0.075;
      let hp=0;
      for(let k=0;k<2;k++){
        this.lp += f*this.bp;
        hp = filtered - this.lp - damp*this.bp;
        this.bp += f*hp;
      }
      if(this.lp>4) this.lp=4; else if(this.lp<-4) this.lp=-4;
      if(this.bp>4) this.bp=4; else if(this.bp<-4) this.bp=-4;
      let o=0;
      if(this.modeVol & 0x10) o+=this.lp;
      if(this.modeVol & 0x20) o+=this.bp;
      if(this.modeVol & 0x40) o+=hp;
      filterOutput = o;                 // kein Modus gewählt -> gefilterte Stimmen stumm
    }
    const master=(this.modeVol & 0x0f)/15;
    // Der 6581 hat einen deutlichen DC-Anteil im Mischer; dadurch werden schnelle
    // Schreibzugriffe auf das Lautstärkeregister (Digis) hörbar. Beim 8580 ist er
    // fast null. Anschließend wird – wie durch den Koppelkondensator am Audio-
    // ausgang – der Gleichanteil per Hochpass (~15 Hz) entfernt.
    const bias = this.model===8580 ? 0.02 : 0.25;
    const mix = ((filterOutput + unfiltered)/3 + bias) * master;
    const R = Math.exp(-2*Math.PI*15/this.sampleRateHint);
    const y = mix - this.dcIn + R*this.dcOut;
    this.dcIn=mix; this.dcOut=y;
    let s=y;
    if(s>1) s=1; else if(s<-1) s=-1;    // Begrenzung (sollte im Normalfall nicht greifen)
    return s;
  }
}

// ============================================================
// Minimal-KERNAL ($E000-$FFFF), nur sichtbar wenn HIRAM gesetzt
// ============================================================
function buildKernal(){
  const k=new Uint8Array(0x2000).fill(0x60);    // unbekannte KERNAL-Aufrufe: RTS
  const put=(addr, bytes)=>{ for(let i=0;i<bytes.length;i++) k[addr-0xe000+i]=bytes[i]; };
  put(0xFF48,[0x48,0x8A,0x48,0x98,0x48,0x6C,0x14,0x03]); // IRQ: PHA TXA PHA TYA PHA JMP ($0314)
  put(0xEA31,[0x4C,0x7E,0xEA]);                         // JMP $EA7E
  put(0xEA7E,[0xAD,0x0D,0xDC]);                         // LDA $DC0D (CIA1-IRQ quittieren)
  put(0xEA81,[0x68,0xA8,0x68,0xAA,0x68,0x40]);          // PLA TAY PLA TAX PLA RTI
  put(0xFE43,[0x78,0x6C,0x18,0x03]);                    // NMI: SEI JMP ($0318)
  put(0xFE47,[0x40]);                                   // Default-NMI-Handler: RTI
  put(0xFE66,[0x4C,0x7E,0xEA]);                         // BRK-Default
  put(0xFEBC,[0x68,0xA8,0x68,0xAA,0x68,0x40]);          // PLA TAY PLA TAX PLA RTI
  put(0xFFFA,[0x43,0xFE, 0xE2,0xFC, 0x48,0xFF]);        // NMI, RESET, IRQ
  return k;
}
const KERNAL = buildKernal();

// Leerlauf-Adresse des Treibers: $0001 ist der CPU-Port, dort liegt nie Code.
const IDLE = 0x0001;

// ============================================================
// Worklet Processor
// ============================================================
class SidPlayerProcessor extends AudioWorkletProcessor {
  constructor(){
    super();
    this.mem = new Uint8Array(65536);
    this.cpu = new CPU6502((a)=>this.memRead(a), (a,v)=>this.memWrite(a,v));
    this.cia1 = new CIA(); this.cia2 = new CIA();
    this.vicRegs = new Uint8Array(0x40);
    this.sid = null;
    this.ready=false; this.playing=false;
    this.gain=0.8; this.filterOn=true; this.model=6581;
    this.port.onmessage = (e)=>this.handleMessage(e.data);
  }

  // ---------- Speicher mit $01-Banking ----------
  cpuPort(){ return (this.mem[1] | (~this.mem[0])) & 7; }
  memRead(addr){
    if(addr >= 0xd000){
      const p=this.cpuPort();
      if(addr >= 0xe000) return (p & 2) ? KERNAL[addr-0xe000] : this.mem[addr];
      if((p & 4) && (p & 3)) return this.ioRead(addr);
    }
    return this.mem[addr];
  }
  memWrite(addr,val){
    if(addr >= 0xd000 && addr < 0xe000){
      const p=this.cpuPort();
      if((p & 4) && (p & 3)){ this.ioWrite(addr, val); return; }
    }
    this.mem[addr]=val;
  }
  ioRead(addr){
    if(addr < 0xd400) return this.vicRead(addr & 0x3f);
    if(addr < 0xd800) return this.sid.readRegister(addr);
    if(addr < 0xdc00) return this.mem[addr] | 0xf0;          // Farb-RAM (4 Bit)
    if(addr < 0xdd00) return this.cia1.read(addr & 0x0f);
    if(addr < 0xde00) return this.cia2.read(addr & 0x0f);
    return 0xff;                                             // offener Bus I/O1/I/O2
  }
  ioWrite(addr, val){
    if(addr < 0xd400) this.vicWrite(addr & 0x3f, val);
    else if(addr < 0xd800) this.sid.writeRegister(addr, val);
    else if(addr < 0xdc00) this.mem[addr] = val & 0x0f;
    else if(addr < 0xdd00) this.cia1.write(addr & 0x0f, val);
    else if(addr < 0xde00) this.cia2.write(addr & 0x0f, val);
  }

  // ---------- VIC (nur Rasterzähler und Raster-IRQ) ----------
  vicRead(r){
    switch(r){
      case 0x11: return (this.vicRegs[0x11] & 0x7f) | ((this.rasterLine & 0x100) ? 0x80 : 0);
      case 0x12: return this.rasterLine & 0xff;
      case 0x19: return (this.vicIrqFlags & 0x0f) | 0x70 | ((this.vicIrqFlags & this.vicIrqMask) ? 0x80 : 0);
      case 0x1a: return this.vicIrqMask | 0xf0;
      default: return this.vicRegs[r];
    }
  }
  vicWrite(r, val){
    this.vicRegs[r]=val;
    switch(r){
      case 0x11: this.rasterCompare = (this.rasterCompare & 0xff) | ((val & 0x80) ? 0x100 : 0); break;
      case 0x12: this.rasterCompare = (this.rasterCompare & 0x100) | val; break;
      case 0x19: this.vicIrqFlags &= ~val & 0x0f; break;     // 1 schreiben = quittieren
      case 0x1a: this.vicIrqMask = val & 0x0f; break;
    }
  }
  irqLine(){ return this.cia1.irq || ((this.vicIrqFlags & this.vicIrqMask) !== 0); }

  tickHw(c){
    this.cia1.tick(c);
    this.cia2.tick(c);
    const nl=this.cia2.irq;                       // CIA2 -> NMI ist flankengetriggert
    if(nl && !this.nmiLine) this.nmiPending=true;
    this.nmiLine=nl;
    this.lineCycles += c;
    while(this.lineCycles >= this.cyclesPerLine){
      this.lineCycles -= this.cyclesPerLine;
      if(++this.rasterLine >= this.totalLines) this.rasterLine=0;
      if(this.rasterLine === this.rasterCompare) this.vicIrqFlags |= 0x01;
    }
    if(this.playMode){
      if(this.initDone){
        this.frameCnt -= c;
        if(this.frameCnt <= 0){
          this.frameCnt += this.framePeriod();
          this.playPending = true;   // läuft play noch, wird der Aufruf einfach nachgeholt
        }
      } else {
        this.initCycles += c;
        if(this.initCycles > this.clockHz*3 && !this.initWarned){
          this.initWarned=true;
          this.port.postMessage({type:'warn', text:'Init-Routine kehrt nicht zurück – Tune evtl. inkompatibel.'});
        }
      }
    }
  }
  framePeriod(){
    if(this.speedCIA){
      const p=this.cia1.taLatch+1;
      return p < 500 ? this.vbiCycles : p;
    }
    return this.vbiCycles;
  }
  bankFor(addr){
    if(this.img.isRSID) return 0x37;
    if(addr < 0xa000) return 0x37;
    if(addr < 0xd000) return 0x36;
    if(addr >= 0xe000) return 0x35;
    return 0x34;
  }
  callFromIdle(addr){
    const ret=(IDLE-1)&0xffff;
    this.cpu.push((ret>>8)&0xff); this.cpu.push(ret&0xff);
    this.cpu.pc=addr;
  }

  // Tune (neu) in den Speicher legen und Subtune initialisieren
  start(subtune){
    const img=this.img;
    this.subtune=subtune;
    this.mem.fill(0);
    for(let i=0;i<img.data.length;i++) this.mem[(img.loadAddress+i)&0xffff]=img.data[i];
    this.mem[0]=0x2f;
    // KERNAL-Softvektoren
    this.mem[0x0314]=0x31; this.mem[0x0315]=0xea;
    this.mem[0x0316]=0x66; this.mem[0x0317]=0xfe;
    this.mem[0x0318]=0x47; this.mem[0x0319]=0xfe;

    this.clockHz = img.clockHz;
    const ntsc = img.clock==='NTSC';
    this.totalLines = ntsc ? 263 : 312;
    this.cyclesPerLine = ntsc ? 65 : 63;
    this.vbiCycles = this.totalLines*this.cyclesPerLine;
    this.rasterLine=0; this.lineCycles=0; this.rasterCompare=0;
    this.vicIrqFlags=0; this.vicIrqMask=0; this.vicRegs.fill(0);

    // CIAs wie nach KERNAL-Reset: CIA1 Timer A läuft (~60 Hz) mit IRQ
    this.cia1.reset(); this.cia2.reset();
    this.cia1.taLatch = ntsc ? 0x4295 : 0x4025;
    this.cia1.ta = this.cia1.taLatch;
    this.cia1.cra = 0x01; this.cia1.icrMask = 0x01;
    this.nmiPending=false; this.nmiLine=false;

    this.sid = new SID(this.model);
    this.sid.sampleRateHint = sampleRate;
    this.sid.filterOn = this.filterOn;

    // PSID mit play-Adresse: Treiber ruft play im Takt auf.
    // RSID oder PSID mit play=0: Tune installiert eigenen Interrupt.
    this.playMode = !img.isRSID && img.playAddress!==0;
    this.speedCIA = this.playMode && !!((img.speed >>> Math.min(subtune,31)) & 1);
    this.idleCli = !this.playMode;
    this.initDone=false; this.initCycles=0; this.initWarned=false; this.jamWarned=false;
    this.playPending=false; this.frameCnt=0; this.cycleDebt=0;

    const cpu=this.cpu;
    cpu.reset();
    this.mem[1] = this.bankFor(img.initAddress);
    this.callFromIdle(img.initAddress);
    cpu.a = subtune & 0xff;
    cpu.i = !img.isRSID;      // RSID startet wie per SYS aus BASIC (IRQs an)
    this.ready=true;
  }

  runOne(){
    const cpu=this.cpu;
    let c;
    if(this.nmiPending){
      this.nmiPending=false;
      c=cpu.nmi();
    } else if(!cpu.i && this.irqLine()){
      c=cpu.irq();
    } else if(cpu.pc===IDLE && !cpu.jam){
      if(!this.initDone){
        this.initDone=true;
        this.frameCnt=this.framePeriod();
      }
      if(this.playPending){
        this.playPending=false;
        this.mem[1]=this.bankFor(this.img.playAddress);
        this.callFromIdle(this.img.playAddress);
        cpu.i=true;            // play läuft wie in einer IRQ-Routine
        return 0;
      }
      if(this.idleCli) cpu.i=false;
      c = Math.min(Math.max(2, Math.ceil(this.cycleDebt)), 64);
    } else {
      c=cpu.step();
      if(cpu.jam && !this.jamWarned){
        this.jamWarned=true;
        this.port.postMessage({type:'warn', text:'CPU ist auf einen JAM-Opcode gelaufen ($'+cpu.pc.toString(16).toUpperCase()+').'});
      }
    }
    this.tickHw(c);
    return c;
  }

  handleMessage(msg){
    if(msg.type==='load'){
      this.img = {
        data: new Uint8Array(msg.data), loadAddress: msg.loadAddress,
        initAddress: msg.initAddress, playAddress: msg.playAddress,
        clockHz: msg.clockHz, clock: msg.clock, isRSID: !!msg.isRSID, speed: msg.speed>>>0
      };
      this.filterOn = msg.filterOn;
      this.model = msg.model;
      this.start(msg.subtune);
      this.playing = true;
      this.port.postMessage({type:'loaded', mode: this.playMode ? (this.speedCIA?'cia':'vbi') : 'irq'});
    } else if(msg.type==='subtune'){
      if(!this.img) return;
      this.start(msg.subtune);
      this.port.postMessage({type:'loaded', mode: this.playMode ? (this.speedCIA?'cia':'vbi') : 'irq'});
    } else if(msg.type==='play'){
      this.playing = true;
    } else if(msg.type==='pause'){
      this.playing = false;
    } else if(msg.type==='stop'){
      this.playing = false;
      if(this.img) this.start(this.subtune);
    } else if(msg.type==='filter'){
      this.filterOn = msg.on;
      if(this.sid) this.sid.filterOn = msg.on;
    } else if(msg.type==='model'){
      this.model = msg.model;
      if(this.sid) this.sid.setModel(msg.model);
    } else if(msg.type==='volume'){
      this.gain = msg.value;
    }
  }

  process(inputs, outputs){
    const out = outputs[0][0];
    if(!this.ready || !this.playing || !this.sid){
      out.fill(0);
      return true;
    }
    const cps = this.clockHz / sampleRate;
    for(let i=0;i<out.length;i++){
      this.cycleDebt += cps;
      while(this.cycleDebt > 0) this.cycleDebt -= this.runOne();
      out[i] = this.sid.process(cps) * this.gain;
    }
    return true;
  }
}
registerProcessor('sid-player', SidPlayerProcessor);
`;

// ---------- Main-Thread: PSID-Parser, UI, AudioWorkletNode ----------
let audioCtx=null, workletNode=null, analyser=null;
let audioReady=null;
let currentHeader=null;

function parsePSID(buf){
  if(buf.byteLength < 0x76) throw new Error('Datei zu kurz für einen PSID/RSID-Header');
  const dv = new DataView(buf);
  const magic = String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3));
  if(magic!=='PSID' && magic!=='RSID') throw new Error('Kein gültiges PSID/RSID-File');
  const version = dv.getUint16(4);
  const dataOffset = dv.getUint16(6);
  let loadAddress = dv.getUint16(8);
  const initAddressRaw = dv.getUint16(10);
  const playAddress = dv.getUint16(12);
  const songs = Math.max(1, dv.getUint16(14));
  let startSong = dv.getUint16(16);
  if(startSong<1 || startSong>songs) startSong=1;
  const speed = dv.getUint32(0x12);
  const readStr = (off,len)=>{
    let s='';
    for(let i=0;i<len;i++){
      const c = dv.getUint8(off+i);
      if(c===0) break;
      s+=String.fromCharCode(c);
    }
    return s;
  };
  const name = readStr(0x16,32);
  const author = readStr(0x36,32);
  const released = readStr(0x56,32);
  let flags=0, clock='PAL', model=null, secondSid=0;
  if(version>=2 && buf.byteLength>=0x7c){
    flags = dv.getUint16(0x76);
    const clockBits = (flags>>2)&0x03;
    clock = (clockBits===2) ? 'NTSC' : 'PAL';
    const modelBits = (flags>>4)&0x03;
    if(modelBits===1) model=6581; else if(modelBits===2) model=8580;
    if(version>=3) secondSid = dv.getUint8(0x7a);
  }
  const isRSID = magic==='RSID';
  if(!isRSID && (flags & 1)) throw new Error('Compute!-Sidplayer-Format (MUS) wird nicht unterstützt');
  if(dataOffset >= buf.byteLength) throw new Error('Datenoffset liegt hinter dem Dateiende');
  let data = new Uint8Array(buf, dataOffset);
  if(loadAddress===0){
    if(data.length<2) throw new Error('Keine Ladeadresse in den Daten');
    loadAddress = data[0] | (data[1]<<8);
    data = data.slice(2);
  }
  const initAddress = initAddressRaw || loadAddress;   // init=0 heißt: init = Ladeadresse
  return { version, loadAddress, initAddress, playAddress, songs, startSong, speed, name, author, released,
           clock, model, flags, secondSid, data, isRSID, needsBasic: isRSID && !!(flags & 2) };
}

function setStatus(t){ document.getElementById('status').textContent = t; }

function setupUI(){
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  drop.addEventListener('click', ()=>fileInput.click());
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', ()=>drop.classList.remove('drag'));
  drop.addEventListener('drop', e=>{
    e.preventDefault(); drop.classList.remove('drag');
    if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e=>{
    if(e.target.files.length) loadFile(e.target.files[0]);
    fileInput.value='';
  });
  document.getElementById('playBtn').addEventListener('click', ()=>{
    if(!workletNode) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    workletNode.port.postMessage({type:'play'});
    setStatus('Spielt.');
  });
  document.getElementById('pauseBtn').addEventListener('click', ()=>{
    if(!workletNode) return;
    workletNode.port.postMessage({type:'pause'});
    setStatus('Pausiert.');
  });
  document.getElementById('stopBtn').addEventListener('click', ()=>{
    if(!workletNode) return;
    workletNode.port.postMessage({type:'stop'});
    setStatus('Gestoppt (zurück auf Anfang).');
  });
  document.getElementById('volume').addEventListener('input', e=>{
    if(workletNode) workletNode.port.postMessage({type:'volume', value:e.target.value/100});
  });
  document.getElementById('filterOn').addEventListener('change', e=>{
    if(workletNode) workletNode.port.postMessage({type:'filter', on:e.target.checked});
  });
  document.getElementById('sidModel').addEventListener('change', e=>{
    if(workletNode) workletNode.port.postMessage({type:'model', model:+e.target.value});
  });
}

function ensureAudio(){
  if(!audioReady){
    audioReady = (async ()=>{
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const blob = new Blob([workletCode], {type:'application/javascript'});
      const url = URL.createObjectURL(blob);
      await audioCtx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      workletNode = new AudioWorkletNode(audioCtx, 'sid-player', {outputChannelCount:[1]});
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      workletNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      workletNode.port.onmessage = (e)=>{
        const d=e.data;
        if(d.type==='loaded'){
          const modeTxt = d.mode==='irq' ? 'eigener Interrupt (IRQ/NMI)'
                        : d.mode==='cia' ? 'play per CIA-Timer' : 'play per Rasterzeile';
          const extra = audioCtx.state==='suspended' ? ' – zum Abspielen „Play“ drücken.' : '';
          setStatus('Bereit: '+modeTxt+'.'+extra);
        } else if(d.type==='warn'){
          setStatus('Hinweis: '+d.text);
        }
      };
      drawScope();
    })();
  }
  return audioReady;
}

function drawScope(){
  const canvas = document.getElementById('scope');
  const ctx = canvas.getContext('2d');
  const buf = new Uint8Array(analyser.fftSize);
  function frame(){
    requestAnimationFrame(frame);
    analyser.getByteTimeDomainData(buf);
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#7c7cff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const step = canvas.width/buf.length;
    for(let i=0;i<buf.length;i++){
      const y = (buf[i]/255)*canvas.height;
      if(i===0) ctx.moveTo(0,y); else ctx.lineTo(i*step,y);
    }
    ctx.stroke();
  }
  frame();
}

async function loadFile(file){
  const buf = await file.arrayBuffer();
  let header;
  try{ header = parsePSID(buf); }
  catch(err){ setStatus('Fehler: '+err.message); return; }
  currentHeader = header;
  try{ await ensureAudio(); }
  catch(err){ setStatus('Audio konnte nicht gestartet werden: '+err.message); return; }
  if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});

  const modelSel = document.getElementById('sidModel');
  if(header.model) modelSel.value = String(header.model);

  const notes=[];
  if(header.secondSid) notes.push('2. SID ($D'+(header.secondSid).toString(16).toUpperCase()+'0) wird nicht emuliert');
  if(header.needsBasic) notes.push('Tune braucht das BASIC-ROM – läuft evtl. nicht');

  document.getElementById('meta').innerHTML =
    '<span class="label">Titel:</span> '+escapeHtml(header.name)+'<br>'+
    '<span class="label">Autor:</span> '+escapeHtml(header.author)+'<br>'+
    '<span class="label">Copyright:</span> '+escapeHtml(header.released)+'<br>'+
    '<span class="label">Format:</span> '+(header.isRSID?'RSID':'PSID')+' v'+header.version+' &middot; '+header.clock+' &middot; '+header.songs+' Subtune(s)'+
    (header.model?' &middot; '+header.model:'')+
    (notes.length?'<br><span class="label">Hinweis:</span> '+escapeHtml(notes.join('; ')):'');

  const subtunesDiv = document.getElementById('subtunes');
  subtunesDiv.innerHTML='';
  for(let s=1;s<=header.songs;s++){
    const b = document.createElement('button');
    b.textContent = s;
    if(s===header.startSong) b.classList.add('active');
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#subtunes button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      if(audioCtx.state==='suspended') audioCtx.resume();
      workletNode.port.postMessage({type:'subtune', subtune:s-1});
      workletNode.port.postMessage({type:'play'});
    });
    subtunesDiv.appendChild(b);
  }

  const clockHz = header.clock==='NTSC' ? 1022727 : 985248;

  workletNode.port.postMessage({
    type:'load',
    data: header.data.buffer.slice(header.data.byteOffset, header.data.byteOffset+header.data.byteLength),
    loadAddress: header.loadAddress,
    initAddress: header.initAddress,
    playAddress: header.playAddress,
    subtune: header.startSong-1,
    speed: header.speed,
    clockHz, clock: header.clock,
    isRSID: header.isRSID,
    model: +modelSel.value,
    filterOn: document.getElementById('filterOn').checked
  });
  workletNode.port.postMessage({type:'volume', value: document.getElementById('volume').value/100});

  document.getElementById('playBtn').disabled=false;
  document.getElementById('pauseBtn').disabled=false;
  document.getElementById('stopBtn').disabled=false;
  setStatus('Lädt...');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setupUI();
</script>
