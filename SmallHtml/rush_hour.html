<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rush Hour</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;overflow-x:hidden}
  header{text-align:center;padding:18px 16px 6px;width:100%;max-width:520px}
  header h1{font-size:2rem;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#e74c3c,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  header .subtitle{font-size:.78rem;color:#666;margin-top:2px}
  .top-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;padding:6px 16px;gap:8px}
  .level-info{font-weight:700;font-size:.95rem}
  .difficulty{font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
  .diff-0{background:#27ae60;color:#fff}.diff-1{background:#f39c12;color:#fff}
  .diff-2{background:#2980b9;color:#fff}.diff-3{background:#e74c3c;color:#fff}
  .diff-4{background:#8e44ad;color:#fff}
  .moves-display{font-size:.85rem;font-weight:600;color:#aaa;white-space:nowrap}
  .moves-display span{color:#f1c40f;font-size:1.05rem}
  .goal-line{font-size:.72rem;color:#8a8aa8;max-width:520px;padding:0 16px;text-align:center;min-height:1.1em}
  .board-wrap{position:relative;margin:8px auto}
  canvas{display:block;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .exit-arrow{position:absolute;right:-22px;width:22px;font-size:1.6rem;color:#e74c3c;display:flex;align-items:center;justify-content:center;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .controls{display:flex;gap:8px;padding:10px 16px;width:100%;max-width:520px;justify-content:center;flex-wrap:wrap}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:.82rem;padding:9px 18px;border:none;border-radius:8px;cursor:pointer;transition:all .15s}
  button:active{transform:scale(.95)}
  button:focus-visible{outline:2px solid #f39c12;outline-offset:2px}
  .btn-p{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
  .btn-p:hover{background:linear-gradient(135deg,#ff6b5a,#e74c3c)}
  .btn-s{background:#2a2a4a;color:#ccc;border:1px solid #3a3a5a}
  .btn-s:hover{background:#3a3a5a}
  .btn-h{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff}
  .hint-msg{text-align:center;font-size:.78rem;color:#f39c12;min-height:1.1em;padding:0 16px}
  .level-picker{width:100%;max-width:520px;padding:6px 16px 32px}
  .picker-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  .tab{font-size:.74rem;font-weight:600;padding:6px 11px;border-radius:7px;background:#22223c;color:#8080a0;border:1px solid #32324e}
  .tab.on{background:#e74c3c;color:#fff;border-color:#e74c3c}
  .chip{font-size:.68rem;font-weight:600;padding:4px 9px;border-radius:12px;background:#22223c;color:#7a7a98;border:1px solid #32324e}
  .chip.on{background:#3a3a5a;color:#fff}
  .picker-meta{font-size:.7rem;color:#666;text-align:center;margin:2px 0 8px}
  .level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
  .lv-btn{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border-radius:8px;background:#2a2a4a;color:#777;border:2px solid transparent;padding:0}
  .lv-btn.cur{border-color:#e74c3c;color:#fff;background:#3a2a3a}
  .lv-btn.done{background:#1a3a2a;color:#27ae60;border-color:#27ae60}
  .lv-btn.done.cur{border-color:#e74c3c}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
  .overlay.show{opacity:1;pointer-events:all}
  .win-card{background:#1e1e3a;border-radius:16px;padding:28px 32px;text-align:center;border:2px solid #f39c12;box-shadow:0 0 60px rgba(243,156,18,.25);transform:scale(.8);transition:transform .3s;max-width:340px}
  .overlay.show .win-card{transform:scale(1)}
  .win-card h2{font-size:1.7rem;font-weight:900;color:#f39c12;margin-bottom:6px}
  .win-card p{color:#aaa;margin-bottom:16px;line-height:1.5}
  .win-card p span{color:#f1c40f;font-weight:700}
  .win-btns{display:flex;gap:8px;justify-content:center}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header>

  </div>
</div>

function decode(code){
  const out=[];
  for(let i=0;i<code.length;i+=4){
    const r=+code[i],c=+code[i+1],s=SHAPE[+code[i+2]];
    out.push({r:r,c:c,len:s[0],dir:s[1],ci:B36.indexOf(code[i+3]),out:false});
  }
  return out;
}

function init(){

  updFreeBtn();buildTabs();loadLvl(0);

function resize(){
  const mw=Math.min(window.innerWidth-32,480);
  cs=Math.floor(mw/G);const sz=cs*G;
  cv.width=sz;cv.height=sz;cv.style.width=sz+'px';cv.style.height=sz+'px';
  const bw=document.getElementById('bw');bw.style.width=sz+'px';bw.style.height=sz+'px';
  const ea=document.getElementById('exitArrow');
  ea.style.top=(2*cs)+'px';ea.style.height=cs+'px';
  draw();
}

function goalText(L){
  if(L.nt>1)return 'Beide roten Autos müssen raus.';
  const s=SHAPE[+L.code[2]];
  return s[0]===3?'Die lange weiße Limousine muss raus.':'Das markierte Auto muss raus.';
}

function updGoal(){
  const L=LEVELS[cur];let t=goalText(L);
  if(NEEDFREE.has(L.set+'-'+L.num)&&!allowFree)
    t+=' ⚠ Diese Karte ist nur lösbar, wenn andere Fahrzeuge ausfahren dürfen.';
  document.getElementById('goal').textContent=t;
}
function toggleFree(){
  allowFree=!allowFree;
  try{localStorage.setItem(FKEY,allowFree?'1':'0')}catch(e){}
  updFreeBtn();updGoal();document.getElementById('hm').textContent='';
}
function updFreeBtn(){
  const b=document.getElementById('freeTgl');
  b.className='chip'+(allowFree?' on':'');
  b.setAttribute('aria-pressed',allowFree?'true':'false');
  b.textContent=(allowFree?'☑':'☐')+' Andere Fahrzeuge dürfen ausfahren';
}
function loadLvl(i){
  cur=i;const L=LEVELS[i];
  vehs=decode(L.code);
  mc=0;hist=[];
  document.getElementById('mc').textContent='0';
  document.getElementById('hm').textContent='';
  updGoal();
  const title=L.set===4?('Eigene · '+L.name):(SETNAMES[L.set]+' · Karte '+L.num);
  document.getElementById('lvInfo').innerHTML=
    title+' <span class="difficulty diff-'+L.diff+'">'+DIFFNAMES[L.diff]+'</span>';
  if(L.set!==pickSet){pickSet=L.set;pickDiff=-1;buildTabs()}
  buildGrid();draw();
}
function resetLvl(){loadLvl(cur)}
function step(d){closeOv();const n=cur+d;if(n>=0&&n<LEVELS.length)loadLvl(n)}
function undo(){
  if(!hist.length)return;
  vehs=hist.pop();mc=Math.max(0,mc-1);
  document.getElementById('mc').textContent=mc;
  document.getElementById('hm').textContent='';
  draw();
}
function snapshot(){hist.push(vehs.map(v=>({...v})));if(hist.length>200)hist.shift()}

// ── Level-Auswahl ──
function buildTabs(){
  const st=document.getElementById('setTabs');st.innerHTML='';
  SETNAMES.forEach((n,i)=>{
    const b=document.createElement('button');b.className='tab'+(i===pickSet?' on':'');
    b.textContent=n;b.onclick=()=>{pickSet=i;pickDiff=-1;buildTabs();buildGrid()};st.appendChild(b);
  });
  const dc=document.getElementById('diffChips');dc.innerHTML='';
  const avail=[...new Set(LEVELS.filter(l=>l.set===pickSet).map(l=>l.diff))].sort();
  const mk=(lbl,val)=>{const b=document.createElement('button');
    b.className='chip'+(pickDiff===val?' on':'');b.textContent=lbl;
    b.onclick=()=>{pickDiff=val;buildTabs();buildGrid()};dc.appendChild(b)};
  mk('Alle',-1);avail.forEach(d=>mk(DIFFNAMES[d],d));
}
function visible(){
  return LEVELS.map((l,i)=>[l,i]).filter(([l])=>l.set===pickSet&&(pickDiff<0||l.diff===pickDiff));
}
function buildGrid(){
  const g=document.getElementById('lg');g.innerHTML='';
  const vis=visible();
  vis.forEach(([l,i])=>{
    const b=document.createElement('button');b.className='lv-btn';
    b.textContent=l.set===4?l.num:l.num;
    b.title=l.name||(SETNAMES[l.set]+' '+l.num);
    if(i===cur)b.classList.add('cur');
    if(solvedSet.has(lvId(l)))b.classList.add('done');
    b.onclick=()=>{closeOv();loadLvl(i)};g.appendChild(b);
  });
  const done=vis.filter(([l])=>solvedSet.has(lvId(l))).length;
  document.getElementById('pMeta').textContent=done+' von '+vis.length+' gelöst';
}
function saveP(){try{localStorage.setItem(SKEY,JSON.stringify([...solvedSet]))}catch(e){}}

// ── Zeichnen ──
function draw(){
  if(!cx)return;const S=cs*G;
  cx.clearRect(0,0,S,S);
  cx.fillStyle='#16213e';cx.fillRect(0,0,S,S);
  for(let r=0;r<G;r++)for(let c=0;c<G;c++){
    cx.fillStyle=(r+c)%2===0?'rgba(255,255,255,.012)':'rgba(0,0,0,.015)';
    cx.fillRect(c*cs,r*cs,cs,cs);
  }
  cx.strokeStyle='#1e2d50';cx.lineWidth=1;
  for(let i=1;i<G;i++){cx.beginPath();cx.moveTo(i*cs,0);cx.lineTo(i*cs,S);cx.stroke();
    cx.beginPath();cx.moveTo(0,i*cs);cx.lineTo(S,i*cs);cx.stroke()}
  cx.fillStyle='rgba(231,76,60,.14)';cx.fillRect(S-5,2*cs,5,cs);
  vehs.forEach((v,i)=>{if(!v.out)drawV(v,i)});
}
function drawV(v,idx){
  const p=3,rad=7,tgt=idx<LEVELS[cur].nt;
  let x,y,w,h;
  if(v.dir==='h'){x=v.c*cs+p;y=v.r*cs+p;w=v.len*cs-p*2;h=cs-p*2}
  else{x=v.c*cs+p;y=v.r*cs+p;w=cs-p*2;h=v.len*cs-p*2}
  const col=PAL[v.ci%PAL.length];
  cx.save();cx.shadowColor='rgba(0,0,0,.45)';cx.shadowBlur=8;cx.shadowOffsetY=3;
  cx.beginPath();rr(cx,x,y,w,h,rad);
  const gr=cx.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,lighter(col,25));gr.addColorStop(1,col);
  cx.fillStyle=gr;cx.fill();cx.restore();
  cx.beginPath();rr(cx,x+2,y+2,w-4,h*.35,rad-2);cx.fillStyle='rgba(255,255,255,.13)';cx.fill();
  cx.beginPath();rr(cx,x,y,w,h,rad);
  cx.strokeStyle=tgt?'rgba(255,255,255,.9)':'rgba(0,0,0,.25)';cx.lineWidth=tgt?2.5:1;cx.stroke();
  if(tgt){cx.fillStyle='rgba(255,255,255,.9)';cx.font='bold '+(cs*.34)+'px Inter,sans-serif';
    cx.textAlign='center';cx.textBaseline='middle';cx.fillText('▶',x+w/2,y+h/2)}
}
function rr(c,x,y,w,h,r){c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y)}
function lighter(hex,n){const v=parseInt(hex.slice(1),16);return'rgb('+Math.min(255,(v>>16)+n)+','+Math.min(255,((v>>8)&0xff)+n)+','+Math.min(255,(v&0xff)+n)+')'}

function bGrid(vs){
  const g=Array.from({length:G},()=>Array(G).fill(-1));
  vs.forEach((v,i)=>{if(v.out)return;
    for(let s=0;s<v.len;s++){const r=v.dir==='h'?v.r:v.r+s;const c=v.dir==='h'?v.c+s:v.c;
      if(r>=0&&r<G&&c>=0&&c<G)g[r][c]=i}});
  return g;
}
// Darf dieses Fahrzeug durch die Lücke fahren?
function canExit(v,i){return v.dir==='h'&&v.r===2&&(allowFree||i<LEVELS[cur].nt)}

// ── Eingabe ──
function onDown(e){
  cv.setPointerCapture(e.pointerId);
  const rect=cv.getBoundingClientRect();
  const px=e.clientX-rect.left,py=e.clientY-rect.top;
  const col=Math.floor(px/cs),row=Math.floor(py/cs);
  const g=bGrid(vehs);
  if(row>=0&&row<G&&col>=0&&col<G&&g[row][col]>=0){
    const idx=g[row][col],v=vehs[idx];
    drag={i:idx,mx:px,my:py,sc:v.c,sr:v.r};
  }
}
function onMove(e){
  if(!drag)return;
  const rect=cv.getBoundingClientRect();
  const px=e.clientX-rect.left,py=e.clientY-rect.top;
  const v=vehs[drag.i],g=bGrid(vehs);
  if(v.dir==='h'){
    v.c=clamp(drag.i,v,drag.sc+Math.round((px-drag.mx)/cs),'c',g);
  }else{
    v.r=clamp(drag.i,v,drag.sr+Math.round((py-drag.my)/cs),'r',g);
  }
  draw();
}
function onUp(){
  if(!drag)return;
  const v=vehs[drag.i],moved=(v.c!==drag.sc||v.r!==drag.sr);
  const oc=v.c,or_=v.r;
  if(moved){
    v.c=drag.sc;v.r=drag.sr;snapshot();v.c=oc;v.r=or_;
    if(canExit(v,drag.i)&&v.c+v.len>G){v.out=true;v.c=G}
    mc++;document.getElementById('mc').textContent=mc;
    document.getElementById('hm').textContent='';
  }
  drag=null;draw();checkWin();
}
function clamp(idx,v,np,axis,g){
  const op=axis==='c'?v.c:v.r;if(np===op)return op;
  // Ausfahrt: Reihe-2-Fahrzeuge dürfen eine Position über den Rand hinaus
  const lim=(axis==='c'&&canExit(v,idx))?G-v.len+1:G-v.len;
  if(np>lim)np=lim;
  if(np<0)np=0;
  const d=np>op?1:-1;let best=op;
  for(let p=op+d;d>0?p<=np:p>=np;p+=d){
    let ok=true;
    for(let s=0;s<v.len;s++){
      const r=axis==='r'?p+s:v.r+(v.dir==='v'?s:0);
      const c=axis==='c'?p+s:v.c+(v.dir==='h'?s:0);
      if(r<0||r>=G||c<0)  {ok=false;break}
      if(c>=G)continue;                       // ragt aus der Lücke heraus
      if(g[r][c]!==-1&&g[r][c]!==idx){ok=false;break}
    }
    if(ok)best=p;else break;
  }
  return best;
}

// ── Gewonnen? ──
function checkWin(){
  const L=LEVELS[cur];
  for(let i=0;i<L.nt;i++)if(!vehs[i].out)return;
  solvedSet.add(lvId(L));saveP();buildGrid();
  document.getElementById('wm').textContent=mc;
  const opt=L.min,r=mc/opt;
  document.getElementById('wo').textContent=
    mc<=opt?'⭐ Optimal!':r<=1.5?'👏 Stark – optimal wären '+opt:'Optimal wären '+opt+' Züge';
  setTimeout(()=>document.getElementById('ov').classList.add('show'),300);
}
function closeOv(){document.getElementById('ov').classList.remove('show')}

// ── BFS-Solver (mit Ausfahrt) ──
function solveFrom(vs,nt,free){
  const n=vs.length,meta=vs.map(v=>[v.len,v.dir]);
  const key=(p,o)=>p.join(',')+'#'+o;
  const p0=vs.map(v=>v.out?-1:v.r*8+v.c);
  let o0=0;vs.forEach((v,i)=>{if(v.out)o0|=1<<i});
  const seen=new Set([key(p0,o0)]);
  const q=[{p:p0,o:o0,d:0,f:null}];let head=0,it=0;
  const full=(1<<nt)-1;
  if((o0&full)===full)return{d:0,f:null};
  while(head<q.length&&it<400000){
    it++;const cur=q[head++];
    const g=Array.from({length:G},()=>Array(G).fill(-1));
    for(let i=0;i<n;i++){if(cur.o>>i&1)continue;
      const r=cur.p[i]>>3,c=cur.p[i]&7,[L,dr]=meta[i];
      for(let s=0;s<L;s++)g[dr==='h'?r:r+s][dr==='h'?c+s:c]=i;}
    for(let i=0;i<n;i++){
      if(cur.o>>i&1)continue;
      const r=cur.p[i]>>3,c=cur.p[i]&7,[L,dr]=meta[i];
      const push=(nr,nc,ex)=>{
        const np=cur.p.slice();np[i]=ex?-1:nr*8+nc;
        const no=ex?(cur.o|1<<i):cur.o;
        const k=key(np,no);if(seen.has(k))return false;
        seen.add(k);
        const f=cur.f||{i:i,r:nr,c:nc,ex:ex};
        if((no&full)===full){q.length=0;q.push({p:np,o:no,d:cur.d+1,f:f});head=0;return true}
        q.push({p:np,o:no,d:cur.d+1,f:f});return false;
      };
      if(dr==='h'){
        for(let nc=c-1;nc>=0&&g[r][nc]===-1;nc--)if(push(r,nc,false))return q[0];
        for(let nc=c+L;nc<G&&g[r][nc]===-1;nc++)if(push(r,nc-L+1,false))return q[0];
        if(r===2&&(free||i<nt)){let clear=true;
          for(let x=c+L;x<G;x++)if(g[2][x]!==-1){clear=false;break}
          if(clear&&push(r,c,true))return q[0];}
      }else{
        for(let nr=r-1;nr>=0&&g[nr][c]===-1;nr--)if(push(nr,c,false))return q[0];
        for(let nr=r+L;nr<G&&g[nr][c]===-1;nr++)if(push(nr-L+1,c,false))return q[0];
      }
    }
  }
  return null;
}

function showHint(){
  const L=LEVELS[cur];
  const res=solveFrom(vehs,L.nt,allowFree);
  const hm=document.getElementById('hm');
  if(!res){hm.textContent=(NEEDFREE.has(L.set+'-'+L.num)&&!allowFree)
    ?'Diese Karte braucht die Regel „Andere Fahrzeuge dürfen ausfahren“.'
    :'Kein Weg mehr zum Ziel – bitte Neustart.';return}
  if(!res.f){hm.textContent='🎉 Schon gelöst!';return}
  const m=res.f,v=vehs[m.i];
  const nm=m.i<L.nt?'Zielfahrzeug':'Fahrzeug #'+(m.i+1);
  if(m.ex){hm.textContent='💡 '+nm+' durch die Lücke rausfahren – noch '+res.d+' Züge';return}
  let dir,steps;
  if(v.dir==='h'){dir=m.c>v.c?'nach rechts':'nach links';steps=Math.abs(m.c-v.c)}
  else{dir=m.r>v.r?'nach unten':'nach oben';steps=Math.abs(m.r-v.r)}
  hm.textContent='💡 '+nm+' '+dir+' ('+steps+(steps===1?' Feld':' Felder')+') – noch '+res.d+' Züge';
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='r'||e.key==='R')resetLvl();
  else if(e.key==='h'||e.key==='H')showHint();
  else if(e.key==='z'||e.key==='Z')undo();
});

init();
</script>
