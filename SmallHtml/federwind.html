<body>
<div id="wrap"><canvas id="cv" width="800" height="600"></canvas></div>
<div id="hint">Maus = zielen &middot; Links = Schuss &middot; Rechts/R = nachladen &middot; P/Esc = Pause &middot; M = Ton &middot; D = Debug</div>
<script>
"use strict";
/* =====================================================================
   FEDERWIND – Panorama-Rail-Shooter
   Ein einziges HTML-File, keine externen Assets, keine Dependencies.
   Alle Grafiken prozedural (Canvas 2D), alle Klänge per WebAudio synthetisiert.
   ===================================================================== */

/* ============================ CONFIG ================================ */
const CONFIG = {

  BIRD_SPEED_NEAR: 90,         // px/s bei d=0

  GRAVITY: 900,                // px/s^2 im Fall
  FALL_DRAG_X: 0.40,           // horizontale Restgeschwindigkeit
  HIT_POSE_MS: 120,
  LANDED_MS: 600,
  HITBOX_PADDING: 0.10,        // Trefferbox 10% größer

  SCORE_NEAR: 5,

  DUSK_TINT: 0.55,             // Stärke der warmen Multiply-Tönung
  DUSK_BLUE: 0.22,             // Stärke des blauen Abendschleiers

  /* --- Farbpalette: Tag- und Dämmerungsvariante --- */
  PALETTE: {
    day: {
      skyTop:'#3f8fd0', skyMid:'#79bfe6', skyBot:'#d8ecf7',
      sun:'#fff6c2', sunGlow:'#ffe27a',
      cloud:'#ffffff', cloudShade:'#d6e4ee',
      mtnFar:'#88a9c4', mtnNear:'#628ba8', mtnSnow:'#e9f2f8',
      hillFar:'#74995a',
      treeFarL:'#6d9a63', treeFarD:'#4d7a4c',
      treeL:'#5c9247', treeM:'#3f6f38', treeD:'#28492a',
      trunk:'#6b4a2c', trunkD:'#4a3220',
      grassL:'#86bb52', grassM:'#6ea141', grassD:'#4d7a30',
      fgGrass:'#3f6b2c', fgGrassL:'#588f3a',
      wood:'#9a6a3c', woodD:'#6d4826',
      barn:'#a8463a', barnD:'#7d3129', roof:'#4b3b34',
      cloth:'#c8b48a', shirt:'#8d6e8f',
      zeppelin:'#c8ccd2', zeppelinD:'#9aa1a9',
      haze:'#bcd8ea', hazeAmt:0.35,

    },
    dusk: {
      skyTop:'#2a2a5e', skyMid:'#a4538a', skyBot:'#f2a15e',
      sun:'#ffd8a0', sunGlow:'#ff9d4d',
      cloud:'#f0c0a0', cloudShade:'#b2758c',
      mtnFar:'#6a5a86', mtnNear:'#4a3f63', mtnSnow:'#e2c3c8',
      hillFar:'#5c5449',
      treeFarL:'#4e4f52', treeFarD:'#37383f',
      treeL:'#4a5238', treeM:'#343c2c', treeD:'#1f2620',
      trunk:'#453220', trunkD:'#2c2016',
      grassL:'#6a6b3f', grassM:'#535733', grassD:'#3a4028',
      fgGrass:'#2b3220', fgGrassL:'#3d4a2a',
      wood:'#6c4a2c', woodD:'#4a301c',
      barn:'#75352f', barnD:'#4f221e', roof:'#332728',
      cloth:'#a08b6a', shirt:'#6b5069',
      zeppelin:'#9d8c92', zeppelinD:'#75666e',
      haze:'#c58a7a', hazeAmt:0.45,
      hud:'#fdf0e2', hudDim:'#c4a08e'
    }
  }
};

/* ============================ UTILS ================================= */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a + (b-a)*t;
const invlerp=(a,b,v)=> (v-a)/(b-a);
const rnd   = (a,b)=> a + Math.random()*(b-a);
const rndi  = (a,b)=> (a + Math.random()*(b-a+1))|0;
const pick  = arr => arr[(Math.random()*arr.length)|0];

/* deterministischer PRNG (mulberry32) – für reproduzierbare Sprite-Seeds */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* --- Farb-Hilfen (Hex <-> RGB, Interpolation, Cache) --- */
const _hexCache = Object.create(null);
function hex2rgb(h){
  let c = _hexCache[h];
  if (c) return c;
  const n = parseInt(h.slice(1),16);
  c = [ (n>>16)&255, (n>>8)&255, n&255 ];
  _hexCache[h] = c;
  return c;
}
function rgb2hex(r,g,b){
  return '#' + (((1<<24) + ((r|0)<<16) + ((g|0)<<8) + (b|0)).toString(16).slice(1));
}
function mixHex(h1,h2,t){
  const a = hex2rgb(h1), b = hex2rgb(h2);
  return rgb2hex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t);
}
function shade(h, amt){ // amt<0 dunkler, >0 heller
  const c = hex2rgb(h);
  const t = amt < 0 ? 0 : 255, k = Math.abs(amt);
  return rgb2hex(c[0]+(t-c[0])*k, c[1]+(t-c[1])*k, c[2]+(t-c[2])*k);
}

/* Offscreen-Canvas erzeugen */
function makeCanvas(w,h){
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}

/* Panorama-Wrap: Weltposition -> Bildschirmposition in [0, WORLD_W) */
function wrapX(worldX, offset){
  let x = (worldX - offset) % CONFIG.WORLD_W;
  if (x < 0) x += CONFIG.WORLD_W;
  return x;
}
/* kürzeste Distanz auf dem Ring (für Nähe-Abfragen) */
function ringDelta(a,b){
  let d = (b - a) % CONFIG.WORLD_W;
  if (d >  CONFIG.WORLD_W/2) d -= CONFIG.WORLD_W;
  if (d < -CONFIG.WORLD_W/2) d += CONFIG.WORLD_W;
  return d;
}

/* 1D-Value-Noise, das über die Panoramabreite nahtlos schließt */
function makeWrapNoise(seed, periods){
  const rng = mulberry32(seed);
  const vals = new Float32Array(periods);
  for (let i=0;i<periods;i++) vals[i] = rng();
  return function(t){ // t in [0,1)
    const x = ((t % 1) + 1) % 1 * periods;
    const i0 = Math.floor(x) % periods;
    const i1 = (i0 + 1) % periods;
    const f = x - Math.floor(x);
    const s = f*f*(3-2*f);
    return vals[i0] + (vals[i1]-vals[i0]) * s;
  };
}
function fbmWrap(seed, octaves){
  const layers = [];
  let amp = 1, per = 3, total = 0;
  for (let o=0;o<octaves;o++){
    layers.push({ n: makeWrapNoise(seed + o*911, per), a: amp });
    total += amp; amp *= 0.5; per *= 2;
  }
  return function(t){
    let v = 0;
    for (let i=0;i<layers.length;i++) v += layers[i].n(t) * layers[i].a;
    return v / total;
  };
}

/* =========================== ASSETS =================================
   Alle Sprites werden einmalig beim Start in Offscreen-Canvases
   gerendert und danach nur noch per drawImage benutzt.
   ==================================================================== */
const Assets = (function(){

  const PD = CONFIG.PALETTE.day;      // Sprites werden in der Tagpalette gebacken
  const D_LEVELS = 5;                 // Diskrete Stufen atmosphärischer Perspektive

  /* --- Hilfsfunktion: Dunst/Blaustich auf ein Sprite legen --- */
  function hazeCopy(src, amount){
    if (amount <= 0.001) return src;
    const c = makeCanvas(src.width, src.height);
    const g = c.getContext('2d');
    g.drawImage(src,0,0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = PD.haze;
    g.globalAlpha = amount;
    g.fillRect(0,0,c.width,c.height);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    return c;
  }

  /* ------------------------- VOGEL ------------------------------- */
  const BW = 78, BH = 62, BCX = 39, BCY = 32;

  const BIRD_COLORS = [
    { body:'#4a3a2c', belly:'#c9a06a', wing:'#3a2c22', wingD:'#241a13', beak:'#e0a03a', eye:'#111111', crest:'#a8492e' },
    { body:'#3c4a5a', belly:'#b9c6d2', wing:'#2c3745', wingD:'#1a222c', beak:'#d8c04a', eye:'#111111', crest:'#6a8fb0' },
    { body:'#5a3a3a', belly:'#d8c0a0', wing:'#43292a', wingD:'#2a1818', beak:'#e8b050', eye:'#111111', crest:'#c98a4a' }
  ];

  /* Flügelspitzen-Winkel der vier Schlagphasen (Bogenmaß) */
  const WING_PHASE = [-1.05, -0.25, 0.62, -0.25];

  function wingPath(g, ang, len, col, colD, back){
    g.save();
    g.rotate(ang);
    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(-len*0.15, -len*0.30, -len*0.70, -len*0.42, -len, -len*0.05);
    g.bezierCurveTo(-len*0.72,  len*0.20, -len*0.30,  len*0.26, 0, len*0.10);
    g.closePath();
    g.fillStyle = back ? colD : col;
    g.fill();
    // Schwungfedern andeuten
    g.strokeStyle = back ? shade(colD,-0.25) : shade(col,-0.30);
    g.lineWidth = 1;
    for (let i=1;i<=3;i++){
      const t = i/4;
      g.beginPath();
      g.moveTo(-len*t*0.95, -len*0.10*t);
      g.lineTo(-len*t*0.62,  len*0.12);
      g.stroke();
    }
    g.restore();
  }

  function drawBirdBody(g, c, squash, headDrop){
    // Schwanz
    g.beginPath();
    g.moveTo(-16, 0);
    g.lineTo(-30, -7);
    g.lineTo(-33, 1);
    g.lineTo(-28, 7);
    g.closePath();
    g.fillStyle = c.wing; g.fill();
    // Körper
    g.beginPath();
    g.ellipse(0, 0, 19, 13*squash, 0, 0, TAU);
    g.fillStyle = c.body; g.fill();
    // Bauch
    g.beginPath();
    g.ellipse(1, 5*squash, 14, 7*squash, 0, 0, TAU);
    g.fillStyle = c.belly; g.fill();
    // Kopf
    g.beginPath();
    g.arc(17, -7 + headDrop, 9.5, 0, TAU);
    g.fillStyle = c.body; g.fill();
    // Federhaube
    g.beginPath();
    g.moveTo(14, -15 + headDrop);
    g.quadraticCurveTo(10, -24 + headDrop, 18, -20 + headDrop);
    g.quadraticCurveTo(22, -23 + headDrop, 22, -14 + headDrop);
    g.closePath();
    g.fillStyle = c.crest; g.fill();
    // Schnabel
    g.beginPath();
    g.moveTo(25, -8 + headDrop);
    g.lineTo(37, -4 + headDrop);
    g.lineTo(25, -1 + headDrop);
    g.closePath();
    g.fillStyle = c.beak; g.fill();
  }

  function makeBird(colIdx, pose){
    const c  = BIRD_COLORS[colIdx];
    const cv = makeCanvas(BW,BH);
    const g  = cv.getContext('2d');
    g.translate(BCX,BCY);
    g.lineJoin = 'round';

    if (pose <= 3){                       // ---- Flugphasen ----
      const ang = WING_PHASE[pose];
      wingPath(g, ang*0.85 + 0.15, 30, c.wing, c.wingD, true);   // hinterer Flügel
      drawBirdBody(g, c, 1, 0);
      wingPath(g, ang, 34, c.wing, c.wingD, false);              // vorderer Flügel
      g.beginPath(); g.arc(20,-9,1.9,0,TAU); g.fillStyle = c.eye; g.fill();
      g.beginPath(); g.arc(20.6,-9.6,0.7,0,TAU); g.fillStyle='#ffffff'; g.fill();
    } else if (pose === 4){               // ---- Trefferpose ----
      wingPath(g, -1.9, 22, c.wingD, c.wingD, true);
      drawBirdBody(g, c, 0.86, 3);
      wingPath(g, 2.1, 24, c.wing, c.wingD, false);
      // X-Augen
      g.strokeStyle = '#101010'; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(17,-8); g.lineTo(23,-2); g.moveTo(23,-8); g.lineTo(17,-2);
      g.stroke();
    } else {                              // ---- Fallpose ----
      wingPath(g, -2.5, 26, c.wingD, c.wingD, true);
      drawBirdBody(g, c, 0.80, 6);
      wingPath(g, 2.6, 27, c.wing, c.wingD, false);
      g.strokeStyle = '#101010'; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(16,-4); g.lineTo(22,2); g.moveTo(22,-4); g.lineTo(16,2);
      g.stroke();
    }
    return cv;
  }

  /* ------------------------- FEDER ------------------------------- */
  function makeFeather(colIdx){
    const cv = makeCanvas(16,26), g = cv.getContext('2d');
    const c = BIRD_COLORS[colIdx];
    g.translate(8,3);
    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(7,6, 7,16, 0,22);
    g.bezierCurveTo(-7,16, -7,6, 0,0);
    g.closePath();
    g.fillStyle = c.belly; g.fill();
    g.strokeStyle = shade(c.wing,-0.1); g.lineWidth = 1;
    g.beginPath(); g.moveTo(0,0); g.lineTo(0,22); g.stroke();
    return cv;
  }

  /* -------------------------- BAUM -------------------------------- */
  function makeTree(seed, w, h, far){
    const rng = mulberry32(seed);
    const cv = makeCanvas(w,h), g = cv.getContext('2d');
    const cx = w/2, base = h-1;
    const trunkW = w*0.10 + rng()*w*0.04;
    const trunkH = h*(far?0.30:0.38);

    // Stamm als sich verjüngendes Polygon
    const lean = (rng()-0.5) * w*0.06;
    g.beginPath();
    g.moveTo(cx - trunkW, base);
    g.lineTo(cx - trunkW*0.42 + lean, base - trunkH);
    g.lineTo(cx + trunkW*0.42 + lean, base - trunkH);
    g.lineTo(cx + trunkW, base);
    g.closePath();
    g.fillStyle = far ? shade(PD.trunk,0.15) : PD.trunk; g.fill();
    g.strokeStyle = PD.trunkD; g.lineWidth = 1; g.stroke();

    // Krone: Cluster überlagerter Kreise mit Farbrauschen
    const cLight = far ? PD.treeFarL : PD.treeL;
    const cMid   = far ? PD.treeFarL : PD.treeM;
    const cDark  = far ? PD.treeFarD : PD.treeD;
    const crownY = base - trunkH - h*0.10;
    const rBase  = w*0.30;
    const blobs  = far ? 9 : 16;
    for (let i=0;i<blobs;i++){
      const a = rng()*TAU, rr = Math.pow(rng(),0.6);
      const bx = cx + lean + Math.cos(a)*rr*w*0.34;
      const by = crownY - Math.abs(Math.sin(a))*rr*h*0.20 - rng()*h*0.10;
      const br = rBase*(0.55 + rng()*0.55);
      const t  = clamp((by - (crownY - h*0.30)) / (h*0.35), 0, 1);
      g.beginPath(); g.arc(bx,by,br,0,TAU);
      g.fillStyle = mixHex(cLight, cDark, clamp(t*0.9 + rng()*0.25,0,1));
      g.fill();
    }
    // Lichtkante oben links
    for (let i=0;i<(far?3:6);i++){
      const bx = cx + lean - rBase*0.5 + rng()*rBase*0.8;
      const by = crownY - h*0.14 - rng()*h*0.10;
      g.beginPath(); g.arc(bx,by,rBase*(0.25+rng()*0.25),0,TAU);
      g.fillStyle = mixHex(cLight,'#ffffff',0.14); g.globalAlpha = 0.30; g.fill();
      g.globalAlpha = 1;
    }
    // eine dunkle Basis für Kontrast
    g.beginPath(); g.arc(cx+lean, crownY + h*0.06, rBase*0.9, 0, TAU);
    g.fillStyle = cMid; g.globalAlpha = 0.55; g.fill(); g.globalAlpha = 1;
    return cv;
  }

  /* -------------------------- BUSCH ------------------------------- */
  function makeBush(seed,w,h){
    const rng = mulberry32(seed);
    const cv = makeCanvas(w,h), g = cv.getContext('2d');
    for (let i=0;i<10;i++){
      const bx = w*0.5 + (rng()-0.5)*w*0.7;
      const by = h - rng()*h*0.7;
      const br = w*(0.16+rng()*0.16);
      g.beginPath(); g.arc(bx,by,br,0,TAU);
      g.fillStyle = mixHex(PD.treeL,PD.treeD,rng());
      g.fill();
    }
    return cv;
  }

  /* -------------------------- WOLKE ------------------------------- */
  function makeCloud(seed,w,h){
    const rng = mulberry32(seed);
    // 1. Silhouette aus überlagerten Kreisen
    const shape = makeCanvas(w,h), sg = shape.getContext('2d');
    sg.fillStyle = '#ffffff';
    const puffs = 7 + (rng()*5|0);
    for (let i=0;i<puffs;i++){
      const t = i/(puffs-1);
      const px = w*0.13 + t*w*0.74 + (rng()-0.5)*w*0.05;
      const py = h*0.68 - Math.sin(t*Math.PI)*h*0.30 - rng()*h*0.06;
      const pr = h*(0.17 + Math.sin(t*Math.PI)*0.16 + rng()*0.09);
      sg.beginPath(); sg.arc(px,py,pr,0,TAU); sg.fill();
    }
    sg.fillRect(w*0.15, h*0.56, w*0.70, h*0.13);   // flache Unterseite
    // 2. weiche Kante + Farbverlauf
    const cv = makeCanvas(w,h), g = cv.getContext('2d');
    try { g.filter = 'blur(3px)'; } catch(e){}
    g.drawImage(shape,0,0);
    try { g.filter = 'none'; } catch(e){}
    g.globalCompositeOperation = 'source-atop';
    const grd = g.createLinearGradient(0, h*0.22, 0, h*0.80);
    grd.addColorStop(0, PD.cloud);
    grd.addColorStop(1, PD.cloudShade);
    g.fillStyle = grd; g.fillRect(0,0,w,h);
    g.globalCompositeOperation = 'source-over';
    return cv;
  }

  /* ------------------------- BERGE -------------------------------- */
  function makeMountains(){
    const W = CONFIG.WORLD_W, H = 230;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    const far  = fbmWrap(1337, 4);
    const near = fbmWrap(4242, 5);

    // hintere Kette
    g.beginPath(); g.moveTo(0,H);
    for (let x=0;x<=W;x+=6){
      const t = x/W;
      const y = H*0.66 - far(t)*H*0.62;
      g.lineTo(x,y);
    }
    g.lineTo(W,H); g.closePath();
    g.fillStyle = PD.mtnFar; g.fill();

    // Schneekappen der hinteren Kette
    g.save(); g.clip();
    g.fillStyle = PD.mtnSnow; g.globalAlpha = 0.8;
    for (let x=0;x<=W;x+=6){
      const t = x/W;
      const y = H*0.66 - far(t)*H*0.62;
      if (y < H*0.24) g.fillRect(x, y, 6, (H*0.24 - y)*0.95);
    }
    g.globalAlpha = 1; g.restore();

    // vordere Kette
    g.beginPath(); g.moveTo(0,H);
    for (let x=0;x<=W;x+=5){
      const t = x/W;
      const y = H*0.84 - near(t)*H*0.46;
      g.lineTo(x,y);
    }
    g.lineTo(W,H); g.closePath();
    g.fillStyle = PD.mtnNear; g.fill();

    // sanfte Hügel davor
    const hill = fbmWrap(777, 2);
    g.beginPath(); g.moveTo(0,H);
    for (let x=0;x<=W;x+=8){
      const t = x/W;
      g.lineTo(x, H*0.94 - hill(t)*H*0.16);
    }
    g.lineTo(W,H); g.closePath();
    g.fillStyle = PD.hillFar; g.fill();
    return cv;
  }

  /* ------------------------- BODEN -------------------------------- */
  function makeGround(){
    const W = CONFIG.WORLD_W, H = CONFIG.VIEW_H - CONFIG.GROUND_Y + 4;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    const grd = g.createLinearGradient(0,0,0,H);
    grd.addColorStop(0, PD.grassD);
    grd.addColorStop(0.18, PD.grassM);
    grd.addColorStop(1, PD.grassL);
    g.fillStyle = grd; g.fillRect(0,0,W,H);

    const rng = mulberry32(9091);
    // Grasstriche
    g.lineWidth = 1.4;
    for (let i=0;i<2600;i++){
      const x = rng()*W, y = rng()*H;
      const depth = y/H;
      const len = 3 + depth*9;
      g.strokeStyle = mixHex(PD.grassD, PD.grassL, rng()*0.9);
      g.globalAlpha = 0.35 + rng()*0.4;
      g.beginPath();
      g.moveTo(x,y);
      g.lineTo(x + (rng()-0.5)*4, y - len);
      g.stroke();
    }
    g.globalAlpha = 1;
    // Blümchen
    for (let i=0;i<180;i++){
      const x = rng()*W, y = H*0.25 + rng()*H*0.75;
      g.fillStyle = pick(['#f3e07a','#f0f0f0','#e8a0c0','#f5c05a']);
      g.beginPath(); g.arc(x,y,1.3 + rng()*1.2,0,TAU); g.fill();
    }
    // Erdweg-Flecken – dreifach gezeichnet, damit die Naht bei x=0 verschwindet
    g.fillStyle = mixHex(PD.grassD,'#8a7a4a',0.45);
    g.globalAlpha = 0.16;
    for (let i=0;i<22;i++){
      const x = rng()*W, y = H*0.3 + rng()*H*0.6;
      const rx = 18+rng()*38, ry = 4+rng()*7;
      for (let k=-1;k<=1;k++){
        g.beginPath(); g.ellipse(x + k*W, y, rx, ry, 0,0,TAU); g.fill();
      }
    }
    g.globalAlpha = 1;
    return cv;
  }

  /* ------------------------- ZAUN --------------------------------- */
  function makeFence(){
    const W = 120, H = 62;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    g.fillStyle = PD.wood;
    g.strokeStyle = PD.woodD; g.lineWidth = 1;
    // Riegel
    for (const y of [H*0.34, H*0.62]){
      g.fillRect(0, y, W, 6); g.strokeRect(0.5, y+0.5, W-1, 5);
    }
    // Pfosten
    for (const x of [8, 68]){
      g.fillStyle = shade(PD.wood,-0.12);
      g.fillRect(x, H*0.16, 9, H*0.80);
      g.strokeRect(x+0.5, H*0.16+0.5, 8, H*0.80-1);
      g.beginPath(); g.moveTo(x-1,H*0.16); g.lineTo(x+4.5,H*0.16-7); g.lineTo(x+10,H*0.16);
      g.closePath(); g.fillStyle = shade(PD.wood,-0.22); g.fill();
      g.fillStyle = PD.wood;
    }
    return cv;
  }

  /* ------------------------ SCHEUNE ------------------------------- */
  function makeBarn(){
    const W = 230, H = 165;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    const bodyY = H*0.36;
    g.fillStyle = PD.barn; g.fillRect(14, bodyY, W-28, H-bodyY-1);
    g.fillStyle = PD.barnD;
    for (let x=14;x<W-14;x+=26) g.fillRect(x, bodyY, 2, H-bodyY-1);
    // Dach
    g.beginPath();
    g.moveTo(4,bodyY+3); g.lineTo(W/2, 8); g.lineTo(W-4, bodyY+3);
    g.lineTo(W-14, bodyY+9); g.lineTo(W/2, 20); g.lineTo(14, bodyY+9);
    g.closePath(); g.fillStyle = PD.roof; g.fill();
    // Giebelfenster
    g.fillStyle = '#2b2320';
    g.beginPath(); g.arc(W/2, bodyY+22, 12, 0, TAU); g.fill();
    g.strokeStyle = PD.cloth; g.lineWidth=2;
    g.beginPath(); g.moveTo(W/2-12,bodyY+22); g.lineTo(W/2+12,bodyY+22);
    g.moveTo(W/2,bodyY+10); g.lineTo(W/2,bodyY+34); g.stroke();
    // Torrahmen
    g.fillStyle = '#39221d';
    g.fillRect(W/2-42, H-84, 84, 83);
    return cv;
  }
  function makeBarnDoor(){
    const W = 42, H = 83;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    g.fillStyle = PD.wood; g.fillRect(0,0,W,H);
    g.strokeStyle = PD.woodD; g.lineWidth = 2;
    g.strokeRect(1,1,W-2,H-2);
    g.beginPath(); g.moveTo(0,0); g.lineTo(W,H*0.5); g.moveTo(0,H*0.5); g.lineTo(W,H);
    g.stroke();
    return cv;
  }

  /* ---------------------- VOGELSCHEUCHE ---------------------------- */
  function makeScarecrow(){
    const W = 74, H = 120;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    const cx = W/2;
    g.strokeStyle = PD.woodD; g.lineWidth = 6; g.lineCap='round';
    g.beginPath(); g.moveTo(cx,H-2); g.lineTo(cx,26); g.stroke();
    g.beginPath(); g.moveTo(10,44); g.lineTo(W-10,44); g.stroke();
    // Hemd
    g.fillStyle = PD.shirt;
    g.beginPath();
    g.moveTo(cx-22,40); g.lineTo(cx+22,40); g.lineTo(cx+17,92);
    g.lineTo(cx-17,92); g.closePath(); g.fill();
    g.fillRect(8,40,W-16,11);
    // Stroh
    g.strokeStyle = '#d8bd6a'; g.lineWidth = 2;
    for (let i=0;i<12;i++){
      const a = -0.5 + i*0.09;
      g.beginPath(); g.moveTo(cx-16+i*2.6, 92);
      g.lineTo(cx-18+i*3 + Math.sin(a)*6, 104); g.stroke();
    }
    // Kopf (Sack)
    g.fillStyle = PD.cloth;
    g.beginPath(); g.ellipse(cx, 26, 15, 17, 0, 0, TAU); g.fill();
    g.fillStyle = '#3a2c20';
    g.beginPath(); g.arc(cx-5,23,2.4,0,TAU); g.fill();
    g.beginPath(); g.arc(cx+5,23,2.4,0,TAU); g.fill();
    g.strokeStyle='#3a2c20'; g.lineWidth=2;
    g.beginPath(); g.arc(cx,30,6,0.15*Math.PI,0.85*Math.PI); g.stroke();
    return cv;
  }
  function makeHat(){
    const W = 46, H = 26;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    g.fillStyle = '#7a5a30';
    g.beginPath(); g.ellipse(W/2, H-7, W/2-1, 6, 0, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(W/2, H-13, 12, 10, 0, 0, TAU); g.fill();
    g.fillStyle = '#4a3520';
    g.fillRect(W/2-12, H-13, 24, 4);
    return cv;
  }

  /* -------------------------- SCHILD ------------------------------ */
  function makeSignPost(){
    const cv = makeCanvas(10,74), g = cv.getContext('2d');
    g.fillStyle = PD.wood; g.fillRect(2,0,6,74);
    g.strokeStyle = PD.woodD; g.strokeRect(2.5,0.5,5,73);
    return cv;
  }
  function makeSignBoard(){
    const W = 78, H = 24;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    g.fillStyle = shade(PD.wood,0.12);
    g.beginPath();
    g.moveTo(0,0); g.lineTo(W-14,0); g.lineTo(W,H/2); g.lineTo(W-14,H); g.lineTo(0,H);
    g.closePath(); g.fill();
    g.strokeStyle = PD.woodD; g.lineWidth = 2; g.stroke();

    g.font = 'bold 12px Georgia,serif'; g.textBaseline='middle';
    g.fillText('MOORWEG', 6, H/2+1);
    return cv;

  /* ------------------------- WINDMÜHLE ---------------------------- */
  function makeMillBody(){
    const W = 96, H = 150;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    g.beginPath();
    g.moveTo(W*0.30, 40); g.lineTo(W*0.70, 40);
    g.lineTo(W*0.86, H-1); g.lineTo(W*0.14, H-1);
    g.closePath();
    g.fillStyle = '#cfc2ad'; g.fill();
    g.strokeStyle = '#a5977f'; g.lineWidth=1; g.stroke();
    // Fensterchen
    g.fillStyle='#4a3f34';
    g.fillRect(W*0.44, 66, 11, 13);
    g.fillRect(W*0.30, 104, 11, 13);
    g.fillRect(W*0.60, 104, 11, 13);
    // Dach
    g.beginPath();
    g.moveTo(W*0.24,42); g.lineTo(W*0.50,12); g.lineTo(W*0.76,42);
    g.closePath(); g.fillStyle = PD.roof; g.fill();
    return cv;
  }
  function makeMillBlade(){
    const L = 78, W2 = 22;
    const cv = makeCanvas(L, W2), g = cv.getContext('2d');
    g.fillStyle = '#e2d8c4';
    g.beginPath();
    g.moveTo(0, W2/2 - 2); g.lineTo(L-2, 1); g.lineTo(L-2, W2-1); g.lineTo(0, W2/2 + 2);
    g.closePath(); g.fill();
    g.strokeStyle = PD.woodD; g.lineWidth = 1.2; g.stroke();
    g.beginPath();
    for (let i=1;i<5;i++){ const x = L*i/5; g.moveTo(x, 2); g.lineTo(x, W2-2); }
    g.stroke();
    return cv;
  }

  /* ------------------------- ZEPPELIN ----------------------------- */
  function makeZeppelin(){
    const W = 190, H = 66;
    const cv = makeCanvas(W,H), g = cv.getContext('2d');
    const grd = g.createLinearGradient(0,6,0,H-18);
    grd.addColorStop(0, '#eef1f4');
    grd.addColorStop(0.5, PD.zeppelin);
    grd.addColorStop(1, PD.zeppelinD);
    g.beginPath(); g.ellipse(W*0.48, H*0.42, W*0.45, H*0.30, 0,0,TAU);
    g.fillStyle = grd; g.fill();
    g.strokeStyle = '#8b929a'; g.lineWidth = 1; g.stroke();
    // Leitwerk
    g.fillStyle = '#b8452f';
    g.beginPath(); g.moveTo(W*0.05,H*0.42); g.lineTo(W*0.00,H*0.10); g.lineTo(W*0.16,H*0.30);
    g.closePath(); g.fill();
    g.beginPath(); g.moveTo(W*0.05,H*0.42); g.lineTo(W*0.00,H*0.74); g.lineTo(W*0.16,H*0.56);
    g.closePath(); g.fill();
    // Gondel
    g.fillStyle = '#4d5158';
    g.beginPath();
    g.roundRect ? g.roundRect(W*0.38, H*0.68, W*0.22, H*0.20, 5)
                : g.rect(W*0.38, H*0.68, W*0.22, H*0.20);
    g.fill();
    g.strokeStyle='#31353a'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(W*0.42,H*0.68); g.lineTo(W*0.42,H*0.60);
    g.moveTo(W*0.56,H*0.68); g.lineTo(W*0.56,H*0.60); g.stroke();
    // Streifen
    g.strokeStyle = 'rgba(80,90,100,.5)'; g.lineWidth = 1;
    for (let i=1;i<5;i++){
      const x = W*0.10 + i*W*0.16;
      g.beginPath(); g.ellipse(x, H*0.42, 4, H*0.28*Math.sin(i/5*Math.PI)+6, 0, 0, TAU); g.stroke();
    }
    return cv;
  }

  /* ---------------------- GRAS / SCHILF --------------------------- */
  function makeTuft(seed, w, h, reed){
    const rng = mulberry32(seed);
    const cv = makeCanvas(w,h), g = cv.getContext('2d');
    const n = reed ? 7 : 11;
    for (let i=0;i<n;i++){
      const x0 = w*0.5 + (rng()-0.5)*w*0.7;
      const hh = h*(reed ? (0.55+rng()*0.45) : (0.4+rng()*0.6));
      const bend = (rng()-0.5)*w*0.5;
      g.beginPath();
      g.moveTo(x0-1.6, h);
      g.quadraticCurveTo(x0 + bend*0.4, h-hh*0.55, x0 + bend, h-hh);
      g.quadraticCurveTo(x0 + bend*0.5 + 1.8, h-hh*0.5, x0+1.6, h);
      g.closePath();
      g.fillStyle = mixHex(PD.fgGrass, PD.fgGrassL, rng());
      g.fill();
      if (reed && rng() > 0.4){    // Schilfkolben
        g.beginPath();
        g.ellipse(x0+bend, h-hh-3, 2.6, 7, bend*0.02, 0, TAU);
        g.fillStyle = '#6d5a34'; g.fill();
      }
    }
    return cv;
  }

  /* ---------------------- MUNITIONSKISTE -------------------------- */
  function makeAmmoBox(){
    const W=34,H=24, cv = makeCanvas(W,H), g = cv.getContext('2d');
    g.fillStyle='#5a6a3a'; g.fillRect(0,4,W,H-4);
    g.fillStyle='#71844a'; g.fillRect(0,0,W,6);
    g.strokeStyle='#2f3a1e'; g.lineWidth=2; g.strokeRect(1,1,W-2,H-2);
    g.fillStyle='#d8c86a'; g.font='bold 9px monospace'; g.fillText('AMMO',4,18);
    return cv;
  }

  /* ------------------------- AUFBAU ------------------------------- */
  const A = {
    birds: [],        // [variant][pose][dLevel]
    feathers: [],
    trees: [], treesFar: [], bushes: [], clouds: [],
    mountains: null, ground: null, fence: null,
    barn: null, barnDoor: null, scarecrow: null, hat: null,
    signPost: null, signBoard: null,
    millBody: null, millBlade: null, zeppelin: null,
    grass: [], reeds: [], ammoBox: null,
    D_LEVELS, BW, BH, BCX, BCY,
    hazeFor(d){ return clamp(Math.round(d*(D_LEVELS-1)),0,D_LEVELS-1); }
  };

  A.build = function(){
    for (let v=0; v<BIRD_COLORS.length; v++){
      const poses = [];
      for (let p=0;p<6;p++){
        const base = makeBird(v,p);
        const levels = [];
        for (let d=0; d<D_LEVELS; d++)
          levels.push(hazeCopy(base, (d/(D_LEVELS-1)) * PD.hazeAmt));
        poses.push(levels);
      }
      A.birds.push(poses);
      A.feathers.push(makeFeather(v));
    }
    for (let i=0;i<8;i++)  A.trees.push(makeTree(100+i*37, 130, 175, false));
    for (let i=0;i<6;i++)  A.treesFar.push(hazeCopy(makeTree(500+i*53, 86, 108, true), 0.22));
    for (let i=0;i<4;i++)  A.bushes.push(makeBush(900+i*17, 70, 40));
    for (let i=0;i<5;i++)  A.clouds.push(makeCloud(1500+i*29, 210+i*26, 88));
    A.mountains = makeMountains();
    A.ground    = makeGround();
    A.fence     = makeFence();
    A.barn      = makeBarn();
    A.barnDoor  = makeBarnDoor();
    A.scarecrow = makeScarecrow();
    A.hat       = makeHat();
    A.signPost  = makeSignPost();
    A.signBoard = makeSignBoard();
    A.millBody  = makeMillBody();
    A.millBlade = makeMillBlade();
    A.zeppelin  = makeZeppelin();
    for (let i=0;i<6;i++) A.grass.push(makeTuft(2000+i*13, 64, 40, false));
    for (let i=0;i<5;i++) A.reeds.push(makeTuft(3000+i*19, 74, 96, true));
    A.ammoBox = makeAmmoBox();
  };
  return A;
})();

/* =========================== AUDIO ==================================
   Alles synthetisiert – kein einziges Sample. AudioContext wird erst
   bei der ersten Nutzerinteraktion erzeugt (Autoplay-Policy).
   ==================================================================== */
const AudioSys = (function(){
  let ctx = null, master = null, windGain = null, noiseBuf = null, started = false;
  let muted = false;

  function ensure(){
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch(e){ return false; }
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(ctx.destination);
    // 2 s weißes Rauschen als wiederverwendbarer Puffer
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    return true;
  }

  function now(){ return ctx.currentTime; }

  function noiseSource(){
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = true;
    s.playbackRate.value = 0.8 + Math.random()*0.4;
    return s;
  }

  /* --- Schuss: Rauschimpuls durch Tiefpass + Bandpass-Knall --- */
  function shot(){
    if (!ensure()) return;
    const t = now();
    const src = noiseSource();
    const lp = ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.setValueAtTime(2600,t);
    lp.frequency.exponentialRampToValueAtTime(300, t+0.09);
    const bp = ctx.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value = 180; bp.Q.value = 1.2;
    const g1 = ctx.createGain(), g2 = ctx.createGain();
    g1.gain.setValueAtTime(0.75,t);
    g1.gain.exponentialRampToValueAtTime(0.0008, t+0.11);
    g2.gain.setValueAtTime(0.9,t);
    g2.gain.exponentialRampToValueAtTime(0.0008, t+0.22);
    src.connect(lp); lp.connect(g1); g1.connect(master);
    src.connect(bp); bp.connect(g2); g2.connect(master);
    src.start(t); src.stop(t+0.25);
  }

  /* --- kurzer Klick-Transient (Nachladen, Klappern) --- */
  function click(delay, freq, vol){
    if (!ensure()) return;
    const t = now() + (delay||0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='square'; o.frequency.setValueAtTime(freq||420, t);
    o.frequency.exponentialRampToValueAtTime((freq||420)*0.45, t+0.05);
    g.gain.setValueAtTime(vol||0.25, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t+0.06);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.08);
  }

  function reload(){ click(0, 520, 0.22); click(0.35, 380, 0.24); }
  function clatter(){ for (let i=0;i<5;i++) click(i*0.055, 700 - i*70, 0.12); }

  /* --- Treffer: gefiltertes Rauschen mit fallender Tonhöhe --- */
  function hit(){
    if (!ensure()) return;
    const t = now();
    const src = noiseSource();
    const bp = ctx.createBiquadFilter();
    bp.type='bandpass'; bp.Q.value = 3.2;
    bp.frequency.setValueAtTime(1600 + Math.random()*500, t);
    bp.frequency.exponentialRampToValueAtTime(240, t+0.20);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.5,t);
    g.gain.exponentialRampToValueAtTime(0.0008, t+0.24);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t+0.26);
  }

  /* --- Vogelruf: einfache FM-Synthese --- */
  function birdCall(pitch){
    if (!ensure()) return;
    const t = now();
    const base = (900 + Math.random()*500) * (pitch||1) * (0.85 + Math.random()*0.30);
    const car = ctx.createOscillator(), mod = ctx.createOscillator();
    const mg = ctx.createGain(), g = ctx.createGain();
    car.type='sine'; mod.type='sine';
    car.frequency.setValueAtTime(base, t);
    car.frequency.exponentialRampToValueAtTime(base*1.45, t+0.06);
    car.frequency.exponentialRampToValueAtTime(base*0.80, t+0.20);
    mod.frequency.value = base*1.8;
    mg.gain.value = base*0.55;
    mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0004, t+0.24);
    car.connect(g); g.connect(master);
    car.start(t); mod.start(t); car.stop(t+0.26); mod.stop(t+0.26);
  }

  /* --- Timer-Warnpiep --- */
  function beep(freq, dur, vol){
    if (!ensure()) return;
    const t = now();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value = freq||880;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.22, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0004, t+(dur||0.08));
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+(dur||0.08)+0.02);
  }

  /* --- Motor-Stottern (Zeppelin) --- */
  function engineStutter(){
    if (!ensure()) return;
    const t = now();
    for (let i=0;i<7;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sawtooth';
      o.frequency.setValueAtTime(70 + Math.random()*35, t+i*0.09);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
      g.gain.setValueAtTime(0.0001, t+i*0.09);
      g.gain.exponentialRampToValueAtTime(0.16, t+i*0.09+0.02);
      g.gain.exponentialRampToValueAtTime(0.0004, t+i*0.09+0.08);
      o.connect(lp); lp.connect(g); g.connect(master);
      o.start(t+i*0.09); o.stop(t+i*0.09+0.10);
    }
  }

  /* --- Rascheln (Schilf) --- */
  function rustle(){
    if (!ensure()) return;
    const t = now();
    const src = noiseSource();
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2400;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.10, t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0005, t+0.30);
    src.connect(hp); hp.connect(g); g.connect(master);
    src.start(t); src.stop(t+0.32);
  }

  /* --- Windschleife: gefiltertes Rauschen mit langsamer LFO --- */
  function startAmbient(){
    if (!ensure() || started) return;
    started = true;
    const src = noiseSource();
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 520;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 340; bp.Q.value=0.6;
    windGain = ctx.createGain(); windGain.gain.value = 0.045;
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = 0.09; lfoG.gain.value = 0.030;
    lfo.connect(lfoG); lfoG.connect(windGain.gain);
    const lfo2 = ctx.createOscillator(), lfo2G = ctx.createGain();
    lfo2.frequency.value = 0.037; lfo2G.gain.value = 180;
    lfo2.connect(lfo2G); lfo2G.connect(lp.frequency);
    src.connect(lp); lp.connect(bp); bp.connect(windGain); windGain.connect(master);
    src.start(); lfo.start(); lfo2.start();
  }

  return {
    unlock(){ if (ensure() && ctx.state === 'suspended') ctx.resume(); startAmbient(); },
    toggleMute(){
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.9;
      return muted;
    },
    isMuted(){ return muted; },
    shot, reload, hit, birdCall, beep, click, clatter, engineStutter, rustle
  };
})();

/* =========================== INPUT ================================== */
const Input = (function(){
  const st = {
    mx: CONFIG.VIEW_W/2, my: CONFIG.VIEW_H/2,
    inside: false,
    left: false, right: false,
    keys: Object.create(null)
  };
  const listeners = { shoot:[], reload:[], key:[], click:[] };
  let canvas = null;

  function toLocal(e){
    const r = canvas.getBoundingClientRect();
    const sx = CONFIG.VIEW_W / r.width, sy = CONFIG.VIEW_H / r.height;
    st.mx = clamp((e.clientX - r.left) * sx, 0, CONFIG.VIEW_W);
    st.my = clamp((e.clientY - r.top ) * sy, 0, CONFIG.VIEW_H);
  }

  function on(evt, fn){ listeners[evt].push(fn); }
  function emit(evt, a){ const l = listeners[evt]; for (let i=0;i<l.length;i++) l[i](a); }

  function attach(cv){
    canvas = cv;
    cv.addEventListener('mousemove', e => { toLocal(e); st.inside = true; });
    cv.addEventListener('mouseenter', e => { toLocal(e); st.inside = true; });
    cv.addEventListener('mouseleave', () => { st.inside = false; });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('mousedown', e => {
      e.preventDefault();
      AudioSys.unlock();
      toLocal(e);
      if (e.button === 0){ st.left = true; emit('click', {x:st.mx,y:st.my}); emit('shoot'); }
      else if (e.button === 2){ st.right = true; emit('reload'); }
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) st.left = false;
      if (e.button === 2) st.right = false;
    });
    // Touch: tippen = zielen + schießen
    cv.addEventListener('touchstart', e => {
      e.preventDefault(); AudioSys.unlock();
      const t = e.changedTouches[0];
      toLocal(t); st.inside = true;
      emit('click', {x:st.mx,y:st.my}); emit('shoot');
    }, {passive:false});
    cv.addEventListener('touchmove', e => {
      e.preventDefault(); toLocal(e.changedTouches[0]);
    }, {passive:false});

    window.addEventListener('keydown', e => {
      st.keys[e.code] = true;
      AudioSys.unlock();
      if (['ArrowLeft','ArrowRight','Space','KeyP','Escape','KeyR','KeyM','KeyD'].indexOf(e.code) >= 0)
        e.preventDefault();
      emit('key', e);
    });
    window.addEventListener('keyup',   e => { st.keys[e.code] = false; });
    window.addEventListener('blur',    () => { for (const k in st.keys) st.keys[k] = false; });
  }

  return { st, on, attach, down(code){ return !!st.keys[code]; } };
})();

/* Bird-Zustände */
const S_FLY=0, S_PERCH=1, S_HIT=2, S_FALL=3, S_LANDED=4, S_EXIT=5, S_DEAD=6;
/* Bahntypen */
const P_STRAIGHT=0, P_ARC=1, P_STARTLE=2, P_FAST=3;

/* Basis-Trefferbox eines Vogels in Sprite-Einheiten */
const BIRD_BOX = { ox: 1, oy: -3, w: 70, h: 44 };

function Bird(){
  this.active=false; this.state=S_DEAD;
  this.x=0; this.y=0; this.vx=0; this.vy=0;
  this.d=0; this.scale=1; this.variant=0; this.dir=1;
  this.path=P_STRAIGHT; this.t=0; this.amp=0; this.freq=1; this.baseY=0;
  this.frame=0; this.frameT=0; this.rot=0; this.rotV=0;
  this.timer=0; this.travelled=0; this.range=0;
  this.points=0; this.landY=0; this.hazeLvl=0; this.depth=0;
}

/* Tiefe für die Sortierung "vorne gewinnt" (klein = vorne) */
function birdDepth(d){
  if (d < 0.28) return 0.10 + d * (0.18/0.28);
  if (d < 0.72) return 0.35 + (d-0.28) * (0.22/0.44);
  return 0.65 + (d-0.72) * (0.10/0.28);
}

function Particle(){
  this.active=false; this.kind=0; // 0 Feder, 1 Wolkenfetzen, 2 Hut, 3 Staub
  this.x=0; this.y=0; this.vx=0; this.vy=0; this.rot=0; this.rotV=0;
  this.life=0; this.maxLife=1; this.size=1; this.sprite=null;
  this.layer=1; this.col='#fff';
}

function Popup(){
  this.active=false; this.x=0; this.y=0; this.life=0; this.text=''; this.col='#fff'; this.big=false;
}

/* generischer Pool ohne Allokation im Hot Path */
function Pool(Ctor, n){
  this.items = new Array(n);
  for (let i=0;i<n;i++) this.items[i] = new Ctor();
  this.count = n;
}
Pool.prototype.get = function(){
  const it = this.items;
  for (let i=0;i<this.count;i++) if (!it[i].active) { it[i].active = true; return it[i]; }
  return null;
};
Pool.prototype.countActive = function(){
  let n=0; const it=this.items;
  for (let i=0;i<this.count;i++) if (it[i].active) n++;
  return n;
};

/* =========================== WORLD ================================== */
const World = (function(){
  const W = CONFIG.WORLD_W, GY = CONFIG.GROUND_Y;
  const A = Assets;

  const LAYER = { sky:0.15, mtn:0.30, mid:0.60, game:1.00, fg:1.35 };

  const w = {
    cam: 0, camVel: 0, camVelTarget: 0,
    time: 0,
    duskT: 0, duskTimer: 0,
    windPhase: 0,
    props: [],
    birds: new Pool(Bird, 40),
    parts: new Pool(Particle, 320),
    pops:  new Pool(Popup, 48),
    ammoBoxes: [],
    LAYER
  };

  /* --- Palette interpolieren (Tag <-> Dämmerung) --- */
  const PD = CONFIG.PALETTE.day, PN = CONFIG.PALETTE.dusk;
  const _pcache = Object.create(null);
  let _pkey = -1;
  function P(key){
    const q = Math.round(w.duskT*20);
    if (q !== _pkey){ for (const k in _pcache) delete _pcache[k]; _pkey = q; }
    let v = _pcache[key];
    if (v === undefined){
      v = (typeof PD[key] === 'number')
        ? lerp(PD[key], PN[key], q/20)
        : mixHex(PD[key], PN[key], q/20);
      _pcache[key] = v;
    }
    return v;
  }
  w.P = P;

  /* --------------------- Prop-Definitionen ----------------------- */
  function prop(o){
    o.cd = 0; o.hittable = (o.hittable !== false);
    w.props.push(o); return o;
  }

  function buildProps(){
    w.props.length = 0;

    /* --- Himmelsebene (0.15) --- */
    prop({ type:'sun', layer:LAYER.sky, x: 520, y: 96, r: 44, depth: 0.90 });
    for (let i=0;i<6;i++){
      prop({ type:'cloud', layer:LAYER.sky, x: 120 + i*400 + rnd(-90,90),
             y: 40 + rnd(0,110), spr: A.clouds[i % A.clouds.length],
             vx: rnd(3,9), depth: 0.85, alive:true, respawn:0, sc: rnd(0.7,1.25) });
    }

    /* --- Mittelebene (0.60): Windmühle, ferne Bäume, Zeppelin --- */
    prop({ type:'mill', layer:LAYER.mid, x: 760, y: GY + 4, depth: 0.62,
           spin: 0.55, boost: 0, ang: 0 });
    for (let i=0;i<10;i++){
      prop({ type:'ftree', layer:LAYER.mid, x: i*236 + rnd(-70,70), y: GY + 4,
             spr: A.treesFar[i % A.treesFar.length], depth: 0.63, hittable:false });
    }
    prop({ type:'zeppelin', layer:LAYER.mid, x: -300, y: 120, depth: 0.60,
           active:false, next: rnd(8,16), vx: 46, sink: 0, stut: 0 });

    /* --- Spielebene (1.00) --- */
    // Zäune (kachelbar) – dienen auch als Sitzplätze
    prop({ type:'fence', layer:LAYER.game, x: 130, y: GY + 12, len: 6, depth:0.30, hittable:false });
    prop({ type:'fence', layer:LAYER.game, x: 1460, y: GY + 12, len: 5, depth:0.30, hittable:false });

    // Bäume mit anschreckbaren Ästen
    const treeX = [70, 300, 640, 900, 1300, 1620, 1960, 2210];
    for (let i=0;i<treeX.length;i++){
      prop({ type:'tree', layer:LAYER.game, x: treeX[i], y: GY + 14,
             spr: A.trees[i % A.trees.length], depth: 0.30, sway: rnd(0,TAU) });
    }
    for (let i=0;i<10;i++){
      prop({ type:'bush', layer:LAYER.game, x: rnd(0,W), y: GY + 16,
             spr: A.bushes[i % A.bushes.length], depth:0.30, hittable:false });
    }
    prop({ type:'barn', layer:LAYER.game, x: 1040, y: GY + 16, depth: 0.30, door: 0, doorOpen:false });
    prop({ type:'scarecrow', layer:LAYER.game, x: 470, y: GY + 14, depth: 0.30, hat: true, wob:0 });
    prop({ type:'sign', layer:LAYER.game, x: 1830, y: GY + 12, depth: 0.30, spin: 0 });

    /* --- Vordergrund (1.35): Gras & Schilf --- */
    for (let i=0;i<26;i++){
      prop({ type:'grass', layer:LAYER.fg, x: (i*92 + rnd(-30,30) + W) % W,
             y: CONFIG.VIEW_H - rnd(0,60), spr: A.grass[i % A.grass.length],
             depth: 0.05, ph: rnd(0,TAU), hittable:false });
    }
    for (let i=0;i<14;i++){
      prop({ type:'reed', layer:LAYER.fg, x: (i*171 + rnd(-40,40) + W) % W,
             y: CONFIG.VIEW_H - rnd(0,28), spr: A.reeds[i % A.reeds.length],
             depth: 0.04, ph: rnd(0,TAU) });
    }
  }

  /* Sitzplätze (Zaunpfosten & Äste) für Aufschrecker */
  function perchSpots(out){
    out.length = 0;
    for (let i=0;i<w.props.length;i++){
      const p = w.props[i];
      if (p.type === 'fence'){
        for (let s=0;s<p.len;s++)
          out.push({ x: p.x + s*120 + 60, y: p.y - 52, prop:p });
      } else if (p.type === 'tree'){
        out.push({ x: p.x - 26, y: p.y - 118, prop:p });
        out.push({ x: p.x + 24, y: p.y - 132, prop:p });
      }
    }
    return out;
  }

  /* --------------------------- Update ---------------------------- */
  w.update = function(dt){
    w.time += dt;
    w.windPhase += dt * 1.15;

    if (w.duskTimer > 0){
      w.duskTimer -= dt;
      w.duskT = Math.min(1, w.duskT + dt*2.2);
    } else {
      w.duskT = Math.max(0, w.duskT - dt*0.8);
    }

    for (let i=0;i<w.props.length;i++){
      const p = w.props[i];
      if (p.cd > 0) p.cd -= dt;
      switch(p.type){
        case 'cloud':
          p.x = (p.x + p.vx*dt) % W;
          if (!p.alive){
            p.respawn -= dt;
            if (p.respawn <= 0){ p.alive = true; p.x = (p.x + rnd(400,900)) % W; }
          }
          break;
        case 'mill':
          if (p.boost > 0) p.boost -= dt;
          p.ang += (p.boost > 0 ? p.spin*3.2 : p.spin) * dt;
          break;
        case 'sign':
          if (p.spin > 0) p.spin = Math.max(0, p.spin - dt*3.2);
          break;
        case 'scarecrow':
          if (p.wob > 0) p.wob = Math.max(0, p.wob - dt*2.5);
          break;
        case 'barn':
          if (p.doorOpen && p.cd <= 0) p.doorOpen = false;
          if (p.doorOpen){ p.door = Math.min(1, p.door + dt*2.2); }
          else if (p.door > 0){ p.door = Math.max(0, p.door - dt*1.2); }
          break;
        case 'zeppelin':
          if (!p.active){
            p.next -= dt;
            if (p.next <= 0){
              p.active = true; p.sink = 0; p.stut = 0;
              p.x = (w.cam*LAYER.mid - 260 + W) % W;
              p.y = rnd(70,150);
              p.vx = rnd(40,58);
            }
          } else {
            p.x = (p.x + p.vx*dt) % W;
            p.travel = (p.travel||0) + p.vx*dt;
            if (p.sink > 0){ p.y += 16*dt; }
            if (p.stut > 0) p.stut -= dt;
            if (p.travel > W*0.92){
              p.active = false; p.travel = 0; p.next = rnd(25,40);
            }
          }
          break;
      }
    }
  };

  /* ------------------------ Kamera ------------------------------- */
  w.updateCamera = function(dt, allowInput){
    let target = 0;
    if (allowInput){
      const edge = CONFIG.VIEW_W * CONFIG.SCROLL_EDGE;
      if (Input.st.inside){
        if (Input.st.mx < edge)
          target = -CONFIG.SCROLL_MAX * (1 - Input.st.mx/edge);
        else if (Input.st.mx > CONFIG.VIEW_W - edge)
          target =  CONFIG.SCROLL_MAX * (1 - (CONFIG.VIEW_W - Input.st.mx)/edge);
      }
      if (Input.down('ArrowLeft'))  target = -CONFIG.SCROLL_KEYS;
      if (Input.down('ArrowRight')) target =  CONFIG.SCROLL_KEYS;
    }
    w.camVelTarget = target;
    const k = 1 - Math.exp(-dt / CONFIG.CAM_SMOOTH);
    w.camVel += (w.camVelTarget - w.camVel) * k;
    w.cam = (w.cam + w.camVel*dt) % W;
    if (w.cam < 0) w.cam += W;
  };

  w.reset = function(){
    w.cam = 0; w.camVel = 0; w.time = 0; w.duskT = 0; w.duskTimer = 0;
    buildProps();
    const bi = w.birds.items;  for (let i=0;i<bi.length;i++){ bi[i].active=false; bi[i].state=S_DEAD; }
    const pi = w.parts.items;  for (let i=0;i<pi.length;i++) pi[i].active=false;
    const oi = w.pops.items;   for (let i=0;i<oi.length;i++) oi[i].active=false;
    w.ammoBoxes.length = 0;
    if (CONFIG.LIMITED_AMMO){
      for (let i=0;i<5;i++)
        w.ammoBoxes.push({ x: rnd(0,W), y: GY + 26, taken:false, respawn:0 });
    }
  };

  w.perchSpots = perchSpots;
  w.buildProps = buildProps;
  return w;
})();
