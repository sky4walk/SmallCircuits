function updateParticles(dt){
  const it = World.parts.items;
  for (let i=0;i<it.length;i++){
    const p = it[i];
    if (!p.active) continue;
    p.life += dt;
    if (p.life >= p.maxLife){ p.active = false; continue; }
    if (p.kind === 0){                 // Feder: Luftwiderstand + Taumeln
      p.vy += 120*dt;
      p.vy *= (1 - 1.9*dt);
      p.vx *= (1 - 1.2*dt);
      p.vx += Math.sin(p.life*4 + p.rot)*26*dt;
      p.rot += p.rotV*dt;
    } else if (p.kind === 1){          // Wolkenfetzen
      p.vy += 6*dt; p.vx *= (1-0.5*dt); p.rot += p.rotV*dt;
    } else if (p.kind === 2){          // Hut segelt
      p.vy += 150*dt; p.vy *= (1-2.4*dt);
      p.vx *= (1-0.8*dt);
      p.vx += Math.sin(p.life*3)*40*dt;
      p.rot += p.rotV*dt;
      if (p.y > CONFIG.GROUND_Y + 40){ p.vy = 0; p.vx *= 0.8; p.rotV *= 0.9; }
    } else {                           // Staub
      p.vy += 40*dt; p.vx *= (1-2*dt);
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  const po = World.pops.items;
  for (let i=0;i<po.length;i++){
    const q = po[i];
    if (!q.active) continue;
    q.life += dt;
    if (q.life >= 0.8) q.active = false;
  }
}

/* =========================== SPAWNER ================================ */
const Spawner = (function(){
  const spots = [];
  let acc = 0, interval = CONFIG.SPAWN_INTERVAL_START;

  function reset(){
    acc = 0; interval = CONFIG.SPAWN_INTERVAL_START;
    World.perchSpots(spots);
  }

  /* Grundbesatz, damit das Panorama nicht leer beginnt */
  function seed(nFly, nPerch){
    for (let i=0;i<nFly;i++){
      const b = spawnFlying();
      if (b) b.travelled = rnd(0, 400);
    }
    for (let i=0;i<nPerch && spots.length;i++)
      spawnPerched(spots[(Math.random()*spots.length)|0]);
  }

  /* Weltposition außerhalb des Sichtfensters wählen */
  function offscreenX(){
    const lo = CONFIG.VIEW_W + CONFIG.SPAWN_MARGIN;
    const hi = CONFIG.WORLD_W - CONFIG.SPAWN_MARGIN;
    return (World.cam + rnd(lo, hi)) % CONFIG.WORLD_W;
  }

  function configureBird(b, d, path){
    b.active = true;
    b.d = d;
    b.hazeLvl = Assets.hazeFor(d);
    b.scale = lerp(CONFIG.BIRD_SCALE_NEAR, CONFIG.BIRD_SCALE_FAR, d);
    b.depth = birdDepth(d);
    b.variant = rndi(0,2);
    b.frame = rndi(0,3); b.frameT = rnd(0,0.08);
    b.rot = 0; b.rotV = 0; b.timer = 0; b.travelled = 0;
    b.path = path;
    b.points = Math.round(lerp(CONFIG.SCORE_NEAR, CONFIG.SCORE_FAR, d)/5)*5;
    b.landY = CONFIG.GROUND_Y + lerp(64, 6, d);
    b.range = rnd(1400, 2300);
  }

  function spawnFlying(){
    const b = World.birds.get();
    if (!b) return null;
    const roll = Math.random();
    let path, d;
    if (roll < 0.46)      { path = P_STRAIGHT; d = rnd(0.05,0.75); }
    else if (roll < 0.76) { path = P_ARC;      d = rnd(0.10,0.70); }
    else                  { path = P_FAST;     d = rnd(0.70,1.00); }

    configureBird(b, d, path);
    b.dir = Math.random() < 0.5 ? -1 : 1;
    const speed = lerp(CONFIG.BIRD_SPEED_NEAR, CONFIG.BIRD_SPEED_FAR, d)
                * (path === P_FAST ? 1.45 : 1);
    b.x = offscreenX();
    b.baseY = rnd(lerp(120,330,d), lerp(370,415,d));
    b.y = b.baseY;
    b.vx = speed * b.dir;
    b.vy = 0;
    b.amp = rnd(8,18);
    b.freq = rnd(0.9,1.8);
    b.t = rnd(0,TAU);
    if (path === P_ARC){
      b.vy = -rnd(95,150);      // steigt an, kippt am Scheitel, sinkt wieder
      b.baseY = b.y;
    }
    b.state = S_FLY;
    if (Math.random() < 0.35) AudioSys.birdCall(lerp(1.0,1.35,d));
    return b;
  }

  function spawnPerched(spot){
    const b = World.birds.get();
    if (!b) return null;
    const d = rnd(0.05, 0.30);
    configureBird(b, d, P_STARTLE);
    b.x = spot.x; b.y = spot.y;
    b.dir = Math.random() < 0.5 ? -1 : 1;
    b.vx = 0; b.vy = 0;
    b.baseY = b.y;
    b.timer = rnd(3,9);
    b.state = S_PERCH;
    return b;
  }

  /* Vogel direkt an einer Weltposition starten lassen (Scheune, Baum) */
  function burst(x, y, n, d0, d1){
    // Ereignis-Schwärme dürfen MAX_BIRDS kurzzeitig überschreiten, aber gedeckelt
    const cap = CONFIG.MAX_BIRDS + 5;
    const it0 = World.birds.items;
    let live = 0;
    for (let i=0;i<it0.length;i++) if (it0[i].active) live++;
    for (let i=0;i<n && live < cap;i++, live++){
      const b = World.birds.get();
      if (!b) break;
      configureBird(b, rnd(d0,d1), P_STARTLE);
      b.x = x + rnd(-24,24);
      b.y = y + rnd(-14,14);
      b.dir = Math.random() < 0.5 ? -1 : 1;
      b.vx = rnd(40,110)*b.dir;
      b.vy = -rnd(140,230);
      b.baseY = b.y;
      b.amp = rnd(6,14); b.freq = rnd(1.2,2.2); b.t = rnd(0,TAU);
      b.state = S_FLY;
    }
    AudioSys.birdCall(1.15);
  }

  function update(dt, progress){
    interval = lerp(CONFIG.SPAWN_INTERVAL_START, CONFIG.SPAWN_INTERVAL_END, progress);
    acc += dt;
    if (acc >= interval){
      acc -= interval;
      let n = 0;
      const it = World.birds.items;
      for (let i=0;i<it.length;i++) if (it[i].active) n++;
      if (n < CONFIG.MAX_BIRDS){
        // gelegentlich einen Sitzer setzen statt eines Fliegers
        if (spots.length && Math.random() < 0.16){
          const s = spots[(Math.random()*spots.length)|0];
          // nicht direkt vor der Nase des Spielers aufsetzen
          const sx = wrapX(s.x, World.cam);
          if (sx > CONFIG.VIEW_W + 60) spawnPerched(s); else spawnFlying();
        } else spawnFlying();
      }
    }
  }

  return { reset, seed, update, spawnFlying, spawnPerched, burst, spots };
})();

/* ====================== VOGEL-ZUSTANDSAUTOMAT ======================= */
function updateBirds(dt){
  const it = World.birds.items;
  const wf = 1 / CONFIG.WING_FPS;
  for (let i=0;i<it.length;i++){
    const b = it[i];
    if (!b.active) continue;

    switch(b.state){
      case S_FLY: {
        b.frameT += dt;
        while (b.frameT >= wf){ b.frameT -= wf; b.frame = (b.frame+1) & 3; }
        b.t += dt;
        if (b.path === P_ARC){
          b.vy += 58*dt;                        // Parabel
          b.y  += b.vy*dt;
          if (b.y > CONFIG.GROUND_Y - 40 && b.vy > 0){ b.state = S_EXIT; b.vy = -60; }
        } else if (b.path === P_STARTLE){
          b.vy += 70*dt;                        // steigt aus, flacht ab
          b.y  += b.vy*dt;
          if (b.y < 60){ b.state = S_EXIT; }
        } else {
          b.y = b.baseY + Math.sin(b.t*b.freq*TAU*0.5) * b.amp;
        }
        b.x = (b.x + b.vx*dt) % CONFIG.WORLD_W;
        if (b.x < 0) b.x += CONFIG.WORLD_W;
        b.travelled += Math.abs(b.vx)*dt;
        if (b.travelled > b.range){ b.state = S_EXIT; b.vy = -rnd(60,120); }
        break;
      }
      case S_PERCH: {
        b.frame = 0;
        b.timer -= dt;
        if (b.timer <= 0) startle(b);
        break;
      }
      case S_HIT: {
        b.timer -= dt;
        b.x += b.vx*dt*0.3;
        if (b.timer <= 0){
          b.state = S_FALL;
          b.vx *= CONFIG.FALL_DRAG_X;
          b.vy = -40;
          b.rotV = rnd(-3.2,3.2);
        }
        break;
      }
      case S_FALL: {
        b.vy += CONFIG.GRAVITY*dt;
        b.x = (b.x + b.vx*dt) % CONFIG.WORLD_W;
        if (b.x < 0) b.x += CONFIG.WORLD_W;
        b.y += b.vy*dt;
        b.rot += b.rotV*dt;
        if (b.rot >  0.70) { b.rot =  0.70; b.rotV = -Math.abs(b.rotV); }
        if (b.rot < -0.70) { b.rot = -0.70; b.rotV =  Math.abs(b.rotV); }
        if (b.y >= b.landY){
          b.y = b.landY; b.state = S_LANDED; b.timer = CONFIG.LANDED_MS/1000;
          b.rot = 1.35;
          spawnDust(b.x, b.y, 6);
        }
        break;
      }
      case S_LANDED: {
        b.timer -= dt;
        if (b.timer <= 0){ b.active = false; b.state = S_DEAD; }
        break;
      }
      case S_EXIT: {
        b.frameT += dt;
        while (b.frameT >= wf){ b.frameT -= wf; b.frame = (b.frame+1) & 3; }
        b.vy -= 40*dt;
        b.y += b.vy*dt;
        b.x = (b.x + b.vx*dt) % CONFIG.WORLD_W;
        if (b.x < 0) b.x += CONFIG.WORLD_W;
        b.travelled += Math.abs(b.vx)*dt;
        if (b.y < -90 || b.travelled > b.range + 900){ b.active = false; b.state = S_DEAD; }
        break;
      }
    }
  }
}

/* Sitzenden Vogel aufschrecken */
function startle(b){
  if (b.state !== S_PERCH) return;
  b.state = S_FLY;
  b.path  = P_STARTLE;
  b.vx = rnd(30,90) * b.dir;
  b.vy = -rnd(170,250);
  b.amp = 0; b.t = 0;
  AudioSys.birdCall(1.1);
  spawnFeathers(b.x, b.y, b.variant, 3, b.scale);
}

/* ========================== RENDERER ================================
   Zeichnet Parallax-Ebenen von hinten nach vorn. Alle Objekte werden
   über wrapX() zweimal geprüft (x und x-WORLD_W), damit der Übergang
   am Panoramarand nahtlos ist.
   ==================================================================== */
const Renderer = (function(){
  const VW = CONFIG.VIEW_W, VH = CONFIG.VIEW_H, GY = CONFIG.GROUND_Y;
  const WW = CONFIG.WORLD_W;
  const A = Assets;
  const DUSK_MUL = CONFIG.DUSK_TINT, DUSK_BLUE = CONFIG.DUSK_BLUE;

  const _xs = [0,0];
  function visX(sx, halfW){
    let n = 0;
    if (sx + halfW > 0 && sx - halfW < VW) _xs[n++] = sx;
    const s2 = sx - WW;
    if (s2 + halfW > 0 && s2 - halfW < VW) _xs[n++] = s2;
    return n;
  }

  /* Sky-Gradient wird nur bei Palettenwechsel neu erzeugt */
  let skyGrad = null, skyKey = -1;
  function sky(g){
    const q = Math.round(World.duskT*20);
    if (q !== skyKey || !skyGrad){
      skyKey = q;
      skyGrad = g.createLinearGradient(0,0,0,GY+10);
      skyGrad.addColorStop(0,   World.P('skyTop'));
      skyGrad.addColorStop(0.55,World.P('skyMid'));
      skyGrad.addColorStop(1,   World.P('skyBot'));
    }
    g.fillStyle = skyGrad;
    g.fillRect(0,0,VW,GY+10);
  }

  /* ------------------------ Ebene 1: Himmel --------------------- */
  function drawSky(g){
    sky(g);
    const props = World.props;
    // Sonne / Mond
    for (let i=0;i<props.length;i++){
      const p = props[i];
      if (p.type !== 'sun') continue;
      const sx = wrapX(p.x, World.cam*p.layer);
      const n = visX(sx, p.r+70);
      for (let k=0;k<n;k++){
        const x = _xs[k];
        const grd = g.createRadialGradient(x,p.y,p.r*0.4, x,p.y,p.r*2.6);
        grd.addColorStop(0, World.P('sunGlow'));
        grd.addColorStop(1, 'rgba(255,220,120,0)');
        g.globalAlpha = 0.55; g.fillStyle = grd;
        g.beginPath(); g.arc(x,p.y,p.r*2.6,0,TAU); g.fill();
        g.globalAlpha = 1;
        g.fillStyle = World.P('sun');
        g.beginPath(); g.arc(x,p.y,p.r,0,TAU); g.fill();
      }
    }
    // Wolken
    for (let i=0;i<props.length;i++){
      const p = props[i];
      if (p.type !== 'cloud' || !p.alive) continue;
      const w2 = p.spr.width*p.sc*0.5, h2 = p.spr.height*p.sc;
      const sx = wrapX(p.x, World.cam*p.layer);
      const n = visX(sx, w2+10);
      for (let k=0;k<n;k++)
        g.drawImage(p.spr, _xs[k]-w2, p.y, p.spr.width*p.sc, h2);
    }
    // Wolkenfetzen
    drawParticles(g, 1);
  }

  /* ------------------------ Ebene 2: Berge ---------------------- */
  function drawMountains(g){
    const sx = wrapX(0, World.cam*World.LAYER.mtn);
    const y  = GY - A.mountains.height + 26;
    g.drawImage(A.mountains, sx - WW, y);
    g.drawImage(A.mountains, sx, y);
    // Dunstband am Horizont
    const grd = g.createLinearGradient(0, GY-52, 0, GY+6);
    grd.addColorStop(0,'rgba(255,255,255,0)');
    grd.addColorStop(1, World.P('haze'));
    g.globalAlpha = 0.42; g.fillStyle = grd; g.fillRect(0,GY-52,VW,60);
    g.globalAlpha = 1;
  }

  /* ------------------- Ebene 3: mittlere Objekte ---------------- */
  function drawMid(g){
    const props = World.props;
    for (let i=0;i<props.length;i++){
      const p = props[i];
      if (p.type === 'ftree'){
        const w2 = p.spr.width*0.5;
        const sx = wrapX(p.x, World.cam*p.layer);
        const n = visX(sx, w2+4);
        for (let k=0;k<n;k++) g.drawImage(p.spr, _xs[k]-w2, p.y - p.spr.height);
      }
    }
    for (let i=0;i<props.length;i++){
      const p = props[i];
      if (p.type === 'mill'){
        const sx = wrapX(p.x, World.cam*p.layer);
        const n = visX(sx, 110);
        for (let k=0;k<n;k++){
          const x = _xs[k];
          g.drawImage(A.millBody, x - A.millBody.width/2, p.y - A.millBody.height);
          const hx = x, hy = p.y - A.millBody.height + 30;
          for (let b=0;b<4;b++){
            g.save();
            g.translate(hx,hy);
            g.rotate(p.ang + b*Math.PI/2);
            g.drawImage(A.millBlade, 6, -A.millBlade.height/2);
            g.restore();
          }
          g.fillStyle='#5a4a38';
          g.beginPath(); g.arc(hx,hy,5,0,TAU); g.fill();
        }
      } else if (p.type === 'zeppelin' && p.active){
        const w2 = A.zeppelin.width*0.5;
        const sx = wrapX(p.x, World.cam*p.layer);
        const n = visX(sx, w2+6);
        for (let k=0;k<n;k++){
          const x = _xs[k];
          g.drawImage(A.zeppelin, x-w2, p.y);
          if (p.stut > 0){
            g.globalAlpha = 0.5*Math.random();
            g.fillStyle = '#4a4a4a';
            g.beginPath(); g.arc(x-w2+A.zeppelin.width*0.5+rnd(-8,8), p.y+A.zeppelin.height*0.9, rnd(3,9),0,TAU); g.fill();
            g.globalAlpha = 1;
          }
        }
      }
    }
  }

  /* ------------------------- Boden ------------------------------ */
  function drawGround(g){
    const sx = wrapX(0, World.cam);
    const y = GY - 4;
    g.drawImage(A.ground, sx - WW, y);
    g.drawImage(A.ground, sx, y);
  }

  /* -------------------- Ebene 4: Spielebene --------------------- */
  function drawGamePlane(g){
    const props = World.props;
    for (let i=0;i<props.length;i++){
      const p = props[i];
      const sx = wrapX(p.x, World.cam);
      switch(p.type){
        case 'fence': {
          const total = p.len*120;
          const n = visX(sx + total/2, total/2 + 10);
          for (let k=0;k<n;k++){
            const x0 = _xs[k] - total/2;
            for (let s=0;s<p.len;s++){
              const xx = x0 + s*120;
              if (xx > VW || xx+120 < 0) continue;
              g.drawImage(A.fence, xx, p.y - A.fence.height);
            }
          }
          break;
        }
        case 'bush': {
          const w2 = p.spr.width*0.5;
          const n = visX(sx, w2+4);
          for (let k=0;k<n;k++) g.drawImage(p.spr, _xs[k]-w2, p.y - p.spr.height);
          break;
        }
        case 'tree': {
          const w2 = p.spr.width*0.5;
          const n = visX(sx, w2+10);
          const sway = Math.sin(World.windPhase*0.6 + p.sway)*0.012;
          for (let k=0;k<n;k++){
            g.save();
            g.translate(_xs[k], p.y);
            g.rotate(sway);
            g.drawImage(p.spr, -w2, -p.spr.height);
            g.restore();
          }
          break;
        }
        case 'barn': {
          const w2 = A.barn.width*0.5;
          const n = visX(sx, w2+8);
          for (let k=0;k<n;k++){
            const x = _xs[k];
            g.drawImage(A.barn, x-w2, p.y - A.barn.height);
            // Torflügel öffnen sich nach außen
            const dy = p.y - 83;
            const ow = Math.cos(p.door*1.35);
            g.save();
            g.translate(x-42, dy); g.scale(ow,1);
            g.drawImage(A.barnDoor, 0, 0); g.restore();
            g.save();
            g.translate(x+42, dy); g.scale(-ow,1);
            g.drawImage(A.barnDoor, 0, 0); g.restore();
          }
          break;
        }
        case 'scarecrow': {
          const w2 = A.scarecrow.width*0.5;
          const n = visX(sx, w2+16);
          for (let k=0;k<n;k++){
            const x = _xs[k];
            g.save();
            g.translate(x, p.y);
            g.rotate(Math.sin(World.time*14)*0.06*p.wob);
            g.drawImage(A.scarecrow, -w2, -A.scarecrow.height);
            if (p.hat) g.drawImage(A.hat, -A.hat.width/2, -A.scarecrow.height - 14);
            g.restore();
          }
          break;
        }
        case 'sign': {
          const n = visX(sx, 60);
          for (let k=0;k<n;k++){
            const x = _xs[k];
            g.drawImage(A.signPost, x-5, p.y - A.signPost.height);
            g.save();
            g.translate(x, p.y - A.signPost.height + 12);
            g.scale(Math.cos(p.spin*7), 1);
            g.drawImage(A.signBoard, -4, -A.signBoard.height/2);
            g.restore();
          }
          break;
        }
      }
    }
    // Munitionskisten
    if (CONFIG.LIMITED_AMMO){
      for (let i=0;i<World.ammoBoxes.length;i++){
        const b = World.ammoBoxes[i];
        if (b.taken) continue;
        const sx = wrapX(b.x, World.cam);
        const n = visX(sx, 24);
        for (let k=0;k<n;k++)
          g.drawImage(A.ammoBox, _xs[k]-17, b.y - A.ammoBox.height);
      }
    }
  }

  /* ------------------------- Vögel ------------------------------ */
  function birdSprite(b){
    const poses = A.birds[b.variant];
    let pose;
    if (b.state === S_HIT) pose = 4;
    else if (b.state === S_FALL || b.state === S_LANDED) pose = 5;
    else if (b.state === S_PERCH) pose = 0;
    else pose = b.frame;
    return poses[pose][b.hazeLvl];
  }

  function drawBirds(g, dMin, dMax){
    const it = World.birds.items;
    for (let i=0;i<it.length;i++){
      const b = it[i];
      if (!b.active) continue;
      if (b.d < dMin || b.d >= dMax) continue;
      const spr = birdSprite(b);
      const half = A.BW*b.scale*0.6;
      const sx = wrapX(b.x, World.cam);
      const n = visX(sx, half+10);
      for (let k=0;k<n;k++){
        g.save();
        g.translate(_xs[k], b.y);
        if (b.rot) g.rotate(b.rot);
        g.scale(b.dir*b.scale, b.scale);
        g.drawImage(spr, -A.BCX, -A.BCY);
        g.restore();
      }
    }
  }

  /* ------------------------ Partikel ---------------------------- */
  function drawParticles(g, wantKindCloud){
    const it = World.parts.items;
    for (let i=0;i<it.length;i++){
      const p = it[i];
      if (!p.active) continue;
      const isCloud = (p.kind === 1);
      if (wantKindCloud === 1 && !isCloud) continue;
      if (wantKindCloud === 0 && isCloud) continue;
      const fade = 1 - Math.max(0, (p.life - p.maxLife*0.65) / (p.maxLife*0.35));
      const sx = wrapX(p.x, World.cam*(isCloud ? World.LAYER.sky : 1));
      const n = visX(sx, 60);
      for (let k=0;k<n;k++){
        const x = _xs[k];
        g.globalAlpha = clamp(fade,0,1);
        if (p.sprite){
          g.save();
          g.translate(x, p.y);
          g.rotate(p.rot);
          g.scale(p.size, p.size);
          g.drawImage(p.sprite, -p.sprite.width/2, -p.sprite.height/2);
          g.restore();
        } else {
          g.fillStyle = p.col + clamp(fade,0,1).toFixed(2) + ')';
          g.beginPath(); g.arc(x, p.y, p.size, 0, TAU); g.fill();
        }
        g.globalAlpha = 1;
      }
    }
  }

  /* ---------------------- Punkte-Popups ------------------------- */
  function drawPopups(g){
    const it = World.pops.items;
    g.textAlign = 'center';
    for (let i=0;i<it.length;i++){
      const q = it[i];
      if (!q.active) continue;
      const t = q.life/0.8;
      const sx = wrapX(q.x, World.cam);
      const n = visX(sx, 90);
      for (let k=0;k<n;k++){
        g.globalAlpha = clamp(1 - t*t, 0, 1);
        g.font = (q.big ? 'bold 26px ' : 'bold 20px ') + 'Georgia,serif';
        g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.55)';
        g.strokeText(q.text, _xs[k], q.y - t*40);
        g.fillStyle = q.col;
        g.fillText(q.text, _xs[k], q.y - t*40);
        g.globalAlpha = 1;
      }
    }
    g.textAlign = 'left';
  }

  /* -------------------- Ebene 5: Vordergrund -------------------- */
  function drawForeground(g){
    const props = World.props;
    for (let i=0;i<props.length;i++){
      const p = props[i];
      if (p.type !== 'grass' && p.type !== 'reed') continue;
      const w2 = p.spr.width*0.5;
      const sx = wrapX(p.x, World.cam*p.layer);
      const n = visX(sx, w2+12);
      const sway = Math.sin(World.windPhase + p.ph)*0.045 + (p.shake ? Math.sin(World.time*40)*0.08*p.shake : 0);
      for (let k=0;k<n;k++){
        g.save();
        g.translate(_xs[k], p.y);
        g.transform(1, 0, sway, 1, 0, 0);
        g.drawImage(p.spr, -w2, -p.spr.height);
        g.restore();
      }
      if (p.shake) p.shake = Math.max(0, p.shake - 0.03);
    }
  }

  /* ---------------------- Dämmerungs-Tönung --------------------- */
  function duskTint(g){
    const t = World.duskT;
    if (t <= 0.002) return;
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = mixHex('#ffffff', CONFIG.PALETTE.dusk.sunGlow, t*DUSK_MUL);
    g.fillRect(0,0,VW,VH);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = t*DUSK_BLUE;
    g.fillStyle = CONFIG.PALETTE.dusk.skyTop;
    g.fillRect(0,0,VW,VH);
    g.globalAlpha = 1;
  }

  /* --------------------------- Welt ----------------------------- */
  function drawWorld(g){
    drawSky(g);
    drawMountains(g);
    drawBirds(g, 0.72, 1.01);      // ferne Vögel hinter Ebene 3
    drawMid(g);
    drawGround(g);
    drawBirds(g, 0.28, 0.72);      // mittlere Vögel hinter Ebene 4
    drawGamePlane(g);
    drawBirds(g, -0.01, 0.28);     // nahe Vögel davor
    drawParticles(g, 0);
    drawPopups(g);
    drawForeground(g);
    duskTint(g);
  }

  return { drawWorld, visX, _xs, drawParticles };
})();

/* ====================== TREFFERERKENNUNG ============================
   Punkt-in-Box gegen alle Kandidaten; es gewinnt der kleinste
   depth-Wert, also das vorderste Ziel.
   ==================================================================== */
const Hit = (function(){
  const A = Assets;
  const box = { x0:0, y0:0, x1:0, y1:0 };
  const result = { kind:'', ref:null, sx:0 };

  function propBox(p, sx){
    switch(p.type){
      case 'sun':
        box.x0=sx-p.r; box.x1=sx+p.r; box.y0=p.y-p.r; box.y1=p.y+p.r; return true;
      case 'cloud': {
        if (!p.alive) return false;
        const w = p.spr.width*p.sc, h = p.spr.height*p.sc;
        box.x0=sx-w*0.42; box.x1=sx+w*0.42; box.y0=p.y+h*0.15; box.y1=p.y+h*0.80; return true;
      }
      case 'mill':
        box.x0=sx-86; box.x1=sx+86; box.y0=p.y-A.millBody.height-34; box.y1=p.y-6; return true;
      case 'zeppelin':
        if (!p.active) return false;
        box.x0=sx-A.zeppelin.width*0.46; box.x1=sx+A.zeppelin.width*0.46;
        box.y0=p.y+6; box.y1=p.y+A.zeppelin.height*0.82; return true;
      case 'tree': {
        const w = p.spr.width, h = p.spr.height;
        box.x0=sx-w*0.42; box.x1=sx+w*0.42; box.y0=p.y-h; box.y1=p.y-h*0.38; return true;
      }
      case 'barn':
        box.x0=sx-42; box.x1=sx+42; box.y0=p.y-83; box.y1=p.y; return true;
      case 'scarecrow':
        box.x0=sx-26; box.x1=sx+26;
        box.y0=p.y-A.scarecrow.height-16; box.y1=p.y; return true;
      case 'sign':
        box.x0=sx-8; box.x1=sx+74; box.y0=p.y-78; box.y1=p.y-46; return true;
      case 'reed': {
        const w = p.spr.width, h = p.spr.height;
        box.x0=sx-w*0.38; box.x1=sx+w*0.38; box.y0=p.y-h*0.95; box.y1=p.y; return true;
      }
    }
    return false;
  }

  function birdBox(b, sx){
    const s = b.scale, pad = 1 + CONFIG.HITBOX_PADDING;
    const w = BIRD_BOX.w*s*pad, h = BIRD_BOX.h*s*pad;
    const cx = sx + BIRD_BOX.ox*s*b.dir;
    const cy = b.y + BIRD_BOX.oy*s;
    box.x0=cx-w/2; box.x1=cx+w/2; box.y0=cy-h/2; box.y1=cy+h/2;
    return true;
  }

  function inside(mx,my){
    return mx >= box.x0 && mx <= box.x1 && my >= box.y0 && my <= box.y1;
  }

  function pick(mx,my){
    let bestD = Infinity;
    result.kind = ''; result.ref = null;

    // Vögel
    const it = World.birds.items;
    for (let i=0;i<it.length;i++){
      const b = it[i];
      if (!b.active) continue;
      if (b.state !== S_FLY && b.state !== S_PERCH && b.state !== S_EXIT) continue;
      if (b.depth >= bestD) continue;
      const sx = wrapX(b.x, World.cam);
      const n = Renderer.visX(sx, A.BW*b.scale);
      for (let k=0;k<n;k++){
        birdBox(b, Renderer._xs[k]);
        if (inside(mx,my)){
          bestD = b.depth; result.kind='bird'; result.ref=b; result.sx=Renderer._xs[k];
          break;
        }
      }
    }
    // Deko-Objekte
    const props = World.props;
    for (let i=0;i<props.length;i++){
      const p = props[i];
      if (!p.hittable || p.depth >= bestD) continue;
      const sx = wrapX(p.x, World.cam*p.layer);
      const n = Renderer.visX(sx, 260);
      for (let k=0;k<n;k++){
        if (!propBox(p, Renderer._xs[k])) break;
        if (inside(mx,my)){
          bestD = p.depth; result.kind='prop'; result.ref=p; result.sx=Renderer._xs[k];
          break;
        }
      }
    }
    // Munitionskisten
    if (CONFIG.LIMITED_AMMO){
      for (let i=0;i<World.ammoBoxes.length;i++){
        const bx = World.ammoBoxes[i];
        if (bx.taken || 0.29 >= bestD) continue;
        const sx = wrapX(bx.x, World.cam);
        const n = Renderer.visX(sx, 30);
        for (let k=0;k<n;k++){
          const x = Renderer._xs[k];
          box.x0=x-17; box.x1=x+17; box.y0=bx.y-24; box.y1=bx.y;
          if (inside(mx,my)){ bestD=0.29; result.kind='ammo'; result.ref=bx; result.sx=x; break; }
        }
      }
    }
    return result.kind ? result : null;
  }

  return { pick, propBox, birdBox, box };
})();

/* ============================ HUD =================================== */
const HUD = (function(){
  const VW = CONFIG.VIEW_W, VH = CONFIG.VIEW_H;

  function bullet(g, x, y, used){
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, 9, 22, 3); else g.rect(x, y, 9, 22);
    g.fillStyle = used ? 'rgba(90,100,110,.55)' : '#d8b45a';
    g.fill();
    g.fillStyle = used ? 'rgba(70,80,90,.55)' : '#b8863a';
    g.fillRect(x, y, 9, 7);
  }

  function draw(g, G){
    g.save();
    g.globalAlpha = 0.75;

    /* --- Punkte oben links --- */
    g.save();
    g.translate(20, 42);
    g.scale(G.scorePulse, G.scorePulse);
    g.font = 'bold 34px Georgia,serif';
    g.textAlign = 'left'; g.textBaseline='alphabetic';
    g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.6)';
    g.strokeText(String(G.score), 0, 0);
    g.fillStyle = '#f7e9a0'; g.fillText(String(G.score), 0, 0);
    g.restore();
    g.font = '12px Georgia,serif'; g.fillStyle = 'rgba(255,255,255,.7)';
    g.fillText('PUNKTE', 21, 58);

    /* --- Timer oben Mitte --- */
    const bw = 240, bx = (VW-bw)/2, by = 20;
    const frac = clamp(G.timeLeft / CONFIG.ROUND_TIME, 0, 1);
    const warn = G.timeLeft <= CONFIG.WARN_TIME && G.timeLeft > 0;
    const pulse = warn ? (0.55 + 0.45*Math.abs(Math.sin(G.clock*6))) : 1;
    g.fillStyle = 'rgba(0,0,0,.42)';
    g.fillRect(bx-2, by-2, bw+4, 16);
    g.fillStyle = warn ? 'rgba(230,70,50,' + pulse.toFixed(2) + ')' : '#8fd06a';
    g.fillRect(bx, by, bw*frac, 12);
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1;
    g.strokeRect(bx-2.5, by-2.5, bw+5, 17);
    const m = Math.floor(Math.max(0,G.timeLeft)/60);
    const s = Math.floor(Math.max(0,G.timeLeft)%60);
    g.font = 'bold 18px monospace'; g.textAlign='center';
    g.fillStyle = warn ? '#ff8a72' : '#eef6ff';
    g.fillText((m<10?'0':'')+m+':'+(s<10?'0':'')+s, VW/2, by+34);

    /* --- Kombo oben rechts --- */
    if (G.mult >= 2){
      g.textAlign='right';
      g.font = 'bold 26px Georgia,serif';
      g.fillStyle = '#ffd06a';
      g.lineWidth = 4; g.strokeStyle='rgba(0,0,0,.6)';
      g.strokeText('x'+G.mult, VW-20, 44);
      g.fillText('x'+G.mult, VW-20, 44);
      g.font = '12px Georgia,serif'; g.fillStyle='rgba(255,255,255,.7)';
      g.fillText('KOMBO', VW-21, 58);
    }

    /* --- Magazin unten links --- */
    const by2 = VH - 40;
    for (let i=0;i<CONFIG.MAG_SIZE;i++)
      bullet(g, 20 + i*13, by2, i >= G.mag);
    if (CONFIG.LIMITED_AMMO){
      g.textAlign='left'; g.font='12px monospace'; g.fillStyle='#e8dfc0';
      g.fillText('VORRAT ' + G.ammo, 20, by2 - 8);
    }
    if (G.reloading){
      const p = 1 - G.reloadT/(CONFIG.RELOAD_MS/1000);
      g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(20, by2+27, CONFIG.MAG_SIZE*13-4, 6);
      g.fillStyle='#f0c860';        g.fillRect(20, by2+27, (CONFIG.MAG_SIZE*13-4)*p, 6);
      g.font='11px Georgia,serif'; g.fillStyle='#ffe9a0'; g.textAlign='left';
      g.fillText('NACHLADEN', 20, by2 - 8);
    }

    /* --- Trefferquote unten rechts --- */
    g.textAlign='right'; g.font='bold 20px monospace';
    g.fillStyle = '#dfe9f2';
    const acc = G.shots ? Math.round(G.hits/G.shots*100) : 0;
    g.fillText(acc + '%', VW-20, VH-24);
    g.font='11px Georgia,serif'; g.fillStyle='rgba(255,255,255,.7)';
    g.fillText('TREFFERQUOTE', VW-20, VH-10);

    g.restore();
    g.textAlign='left'; g.globalAlpha = 1;
  }

  return { draw };
})();

/* =========================== HIGHSCORES ============================= */
const Scores = (function(){
  function load(){
    try {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
      if (!raw) return [];
      const a = JSON.parse(raw);
      return Array.isArray(a) ? a.slice(0, CONFIG.HISCORE_COUNT) : [];
    } catch(e){ return []; }               // Storage blockiert -> still degradieren
  }
  function save(list){
    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(list)); }
    catch(e){ /* ignorieren */ }
  }
  function qualifies(pts){
    const l = load();
    return pts > 0 && (l.length < CONFIG.HISCORE_COUNT || pts > l[l.length-1].p);
  }
  function add(name, pts){
    const l = load();
    l.push({ n: (name||'???').slice(0,CONFIG.NAME_MAX), p: pts });
    l.sort((a,b)=> b.p - a.p);
    l.length = Math.min(l.length, CONFIG.HISCORE_COUNT);
    save(l);
    return l;
  }
  return { load, add, qualifies };
})();

/* ============================ GAME ================================== */
const Game = (function(){
  const VW = CONFIG.VIEW_W, VH = CONFIG.VIEW_H;
  const STEP = 1/60;

  const G = {
    state: 'TITLE', paused: false, debug: false,
    clock: 0, timeLeft: CONFIG.ROUND_TIME, countT: 0, lastBeep: -1,
    score: 0, shots: 0, hits: 0, comboHits: 0, mult: 1, bestCombo: 1, bestStreak: 0,
    bonus: 0, scorePulse: 1, entryChecked: false,
    mag: CONFIG.MAG_SIZE, ammo: CONFIG.AMMO_START,
    reloading: false, reloadT: 0, cooldownT: 0, autoT: 0,
    muzzleT: 0, shakeT: 0, endT: 0, revealT: 0, revealN: 0,
    name: '', caret: 0, lines: [], scoreList: [], fps: 60
  };

  /* --------------------------- Screens -------------------------- */
  const BTN = {
    title:  [ {id:'start',  x:300, y:392, w:200, h:46, label:'Runde starten'},
              {id:'scores', x:300, y:448, w:200, h:38, label:'Bestenliste'} ],
    results:[ {id:'again',  x:236, y:498, w:150, h:40, label:'Nochmal'},
              {id:'title',  x:414, y:498, w:150, h:40, label:'Titel'} ],
    scores: [ {id:'title',  x:325, y:500, w:150, h:40, label:'Zurück'} ],
    entry:  [ {id:'ok',     x:325, y:410, w:150, h:42, label:'Eintragen'} ]
  };
  function buttonsFor(state){
    if (state==='TITLE')   return BTN.title;
    if (state==='RESULTS') return BTN.results;
    if (state==='SCORES')  return BTN.scores;
    if (state==='ENTRY')   return BTN.entry;
    return null;
  }
  function btnAt(x,y){
    const list = buttonsFor(G.state);
    if (!list) return null;
    for (let i=0;i<list.length;i++){
      const b = list[i];
      if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h) return b;
    }
    return null;
  }

  /* ------------------------ Rundenverwaltung -------------------- */
  function startRound(){
    World.reset();
    Spawner.reset();
    Spawner.seed(7, 3);
    G.entryChecked = false;
    G.score=0; G.shots=0; G.hits=0; G.comboHits=0; G.mult=1; G.bestCombo=1; G.bestStreak=0;
    G.bonus=0; G.scorePulse=1;
    G.mag=CONFIG.MAG_SIZE; G.ammo=CONFIG.AMMO_START;
    G.reloading=false; G.reloadT=0; G.cooldownT=0; G.autoT=0;
    G.timeLeft = CONFIG.ROUND_TIME;
    G.countT = CONFIG.COUNTDOWN + 0.999;
    G.lastBeep = -1;
    G.paused = false;
    G.state = 'COUNT';
  }

  function endRound(){
    G.state = 'ENDING';
    G.endT = 0;
  }

  function buildResults(){
    const acc = G.shots ? G.hits/G.shots : 0;
    G.bonus = 0;
    for (let i=0;i<CONFIG.ACC_BONUS.length;i++){
      if (acc >= CONFIG.ACC_BONUS[i].acc){ G.bonus = CONFIG.ACC_BONUS[i].pts; break; }
    }
    G.score += G.bonus;
    G.lines = [
      ['Treffer',        String(G.hits)],
      ['Schüsse',        String(G.shots)],
      ['Trefferquote',   Math.round(acc*100) + ' %'],
      ['Beste Kombo',    'x' + G.bestCombo + '  (' + G.bestStreak + ' in Folge)'],
      ['Genauigkeitsbonus', G.bonus ? '+' + G.bonus : '—'],
      ['Endpunktzahl',   String(G.score)]
    ];
    G.revealT = 0; G.revealN = 0;
    G.state = 'RESULTS';
  }

  /* ---------------------------- Waffe --------------------------- */
  function startReload(){
    if (G.reloading || G.mag === CONFIG.MAG_SIZE) return;
    if (CONFIG.LIMITED_AMMO && G.ammo <= 0) return;
    G.reloading = true;
    G.reloadT = CONFIG.RELOAD_MS/1000;
    AudioSys.reload();
  }

  function fire(){
    if (G.state !== 'PLAY' || G.paused) return;
    if (G.reloading || G.cooldownT > 0) return;
    if (G.mag <= 0){ G.autoT = 0; startReload(); return; }
    if (CONFIG.LIMITED_AMMO && G.ammo <= 0 && G.mag <= 0) return;

    G.mag--; G.shots++;
    G.cooldownT = CONFIG.FIRE_COOLDOWN_MS/1000;
    G.muzzleT   = CONFIG.MUZZLE_MS/1000;
    G.shakeT    = CONFIG.RECOIL_SHAKE_MS/1000;
    AudioSys.shot();

    const mx = Input.st.mx, my = Input.st.my;
    const t = Hit.pick(mx,my);

    // Schuss in der Nähe schreckt sitzende Vögel auf
    const it = World.birds.items;
    for (let i=0;i<it.length;i++){
      const b = it[i];
      if (!b.active || b.state !== S_PERCH) continue;
      const sx = wrapX(b.x, World.cam);
      const dx = Math.min(Math.abs(sx-mx), Math.abs(sx-CONFIG.WORLD_W-mx));
      if (dx < 110 && Math.abs(b.y - my) < 130) startle(b);
    }

    if (!t){ miss(); return; }

    if (t.kind === 'bird'){
      hitBird(t.ref);
    } else if (t.kind === 'ammo'){
      t.ref.taken = true;
      G.ammo += CONFIG.AMMO_BOX_AMOUNT;
      spawnPopup(World.cam + t.sx, t.ref.y - 30, '+' + CONFIG.AMMO_BOX_AMOUNT + ' Schuss', '#cfe89a');
      AudioSys.click(0, 900, 0.2);
    } else {
      hitProp(t.ref, t.sx);
    }
  }

  function miss(){
    G.score = Math.max(0, G.score - CONFIG.MISS_PENALTY);
    G.comboHits = 0; G.mult = 1;
    spawnDust(World.cam + Input.st.mx, Input.st.my, 4);
    spawnPopup(World.cam + Input.st.mx, Input.st.my - 10, '-' + CONFIG.MISS_PENALTY, '#ff9a8a');
  }

  function currentMult(){
    let m = 1;
    for (let i=0;i<CONFIG.COMBO_STEPS.length;i++)
      if (G.comboHits >= CONFIG.COMBO_STEPS[i].hits) m = CONFIG.COMBO_STEPS[i].mult;
    return m;
  }

  function hitBird(b){
    G.hits++;
    G.comboHits++;
    G.mult = currentMult();
    if (G.mult > G.bestCombo)      G.bestCombo  = G.mult;
    if (G.comboHits > G.bestStreak) G.bestStreak = G.comboHits;
    const pts = b.points * G.mult;
    G.score += pts;
    G.scorePulse = 1.35;
    spawnPopup(b.x, b.y - 14*b.scale, '+' + pts, G.mult>1 ? '#ffd86a' : '#fff8d0', G.mult>1);
    spawnFeathers(b.x, b.y, b.variant, rndi(8,12), b.scale);
    AudioSys.hit();
    AudioSys.birdCall(1.5);
    b.state = S_HIT;
    b.timer = CONFIG.HIT_POSE_MS/1000;
    b.rot = 0; b.rotV = 0;
  }

  /* Deko-Treffer: keine Fehlschüsse, brechen die Kombo nicht */
  function hitProp(p, sx){
    const worldX = World.cam + sx;
    if (p.cd > 0){ AudioSys.click(0, 260, 0.1); return; }
    let pts = 0;
    switch(p.type){
      case 'mill':
        p.boost = 5; pts = 25; AudioSys.clatter(); break;
      case 'sign':
        p.spin = 1; pts = 25; AudioSys.clatter(); break;
      case 'scarecrow':
        p.wob = 1;
        if (p.hat){
          p.hat = false; pts = 50;
          spawnHat(p.x, p.y - Assets.scarecrow.height - 14);
        }
        AudioSys.click(0,300,0.2);
        break;
      case 'zeppelin':
        p.sink = 1; p.stut = 1.4; pts = 100; AudioSys.engineStutter(); break;
      case 'sun':
        World.duskTimer = CONFIG.DUSK_SECONDS; pts = 75; AudioSys.beep(320,0.45,0.16); break;
      case 'cloud':
        p.alive = false; p.respawn = rnd(10,18); pts = 10;
        spawnShreds(p.x, p.y + p.spr.height*0.4, 7, p.spr);
        AudioSys.rustle(); break;
      case 'barn':
        p.doorOpen = true;
        Spawner.burst(p.x, p.y - 96, 5, 0.10, 0.40);
        AudioSys.clatter();
        break;
      case 'tree': {
        // sitzende Vögel im Baum aufschrecken, sonst welche starten lassen
        let n = 0;
        const it = World.birds.items;
        for (let i=0;i<it.length;i++){
          const b = it[i];
          if (b.active && b.state === S_PERCH && Math.abs(ringDelta(p.x, b.x)) < 90){
            startle(b); n++;
          }
        }
        if (n === 0) Spawner.burst(p.x, p.y - 130, rndi(1,3), 0.08, 0.30);
        AudioSys.rustle();
        break;
      }
      case 'reed':
        p.shake = 1; AudioSys.rustle(); break;
    }
    if (pts > 0){
      G.score += pts;
      G.scorePulse = 1.2;
      spawnPopup(worldX, p.type==='cloud' ? p.y + 40 : p.y - 40, '+' + pts, '#bfe8ff');
    }
    p.cd = CONFIG.PROP_COOLDOWN;
  }

  /* --------------------------- Update --------------------------- */
  function update(dt){
    G.clock += dt;
    G.scorePulse += (1 - G.scorePulse) * Math.min(1, dt*8);

    if (G.muzzleT > 0) G.muzzleT -= dt;
    if (G.shakeT  > 0) G.shakeT  -= dt;

    if (G.state === 'TITLE'){
      World.cam = (World.cam + 26*dt) % CONFIG.WORLD_W;
      World.update(dt);
      Spawner.update(dt, 0);
      updateBirds(dt);
      updateParticles(dt);
      return;
    }
    if (G.paused) return;

    if (G.state === 'COUNT'){
      World.update(dt);
      World.updateCamera(dt, true);
      updateBirds(dt);
      updateParticles(dt);
      const before = Math.ceil(G.countT);
      G.countT -= dt;
      const after = Math.ceil(G.countT);
      if (after !== before && after >= 0) AudioSys.beep(after===0?1320:660, 0.14, 0.24);
      if (G.countT <= 0) G.state = 'PLAY';
      return;
    }

    if (G.state === 'PLAY'){
      // Waffe
      if (G.cooldownT > 0) G.cooldownT -= dt;
      if (G.reloading){
        G.reloadT -= dt;
        if (G.reloadT <= 0){
          G.reloading = false;
          let need = CONFIG.MAG_SIZE - G.mag;
          if (CONFIG.LIMITED_AMMO){ need = Math.min(need, G.ammo); G.ammo -= need; }
          G.mag += need;
        }
      } else if (G.mag <= 0){
        G.autoT += dt;
        if (G.autoT >= CONFIG.AUTO_RELOAD_DELAY_MS/1000){ G.autoT = 0; startReload(); }
      }

      const prev = Math.ceil(G.timeLeft);
      G.timeLeft -= dt;
      const now = Math.ceil(G.timeLeft);
      if (now !== prev && now <= CONFIG.WARN_TIME && now > 0) AudioSys.beep(880, 0.08, 0.2);

      World.update(dt);
      World.updateCamera(dt, true);
      Spawner.update(dt, clamp(1 - G.timeLeft/CONFIG.ROUND_TIME, 0, 1));
      updateBirds(dt);
      updateParticles(dt);

      if (G.timeLeft <= 0){ G.timeLeft = 0; endRound(); }
      return;
    }

    if (G.state === 'ENDING'){
      G.endT += dt;
      World.update(dt);
      World.updateCamera(dt, false);
      updateBirds(dt);
      updateParticles(dt);
      // warten bis alle Treffer/Fälle ausanimiert sind (max. 3,5 s)
      let busy = false;
      const it = World.birds.items;
      for (let i=0;i<it.length;i++){
        const b = it[i];
        if (b.active && (b.state===S_HIT || b.state===S_FALL || b.state===S_LANDED)) { busy = true; break; }
      }
      if (!busy || G.endT > 3.5) buildResults();
      return;
    }

    if (G.state === 'RESULTS'){
      World.cam = (World.cam + 12*dt) % CONFIG.WORLD_W;
      World.update(dt); updateBirds(dt); updateParticles(dt);
      G.revealT += dt;
      const want = Math.min(G.lines.length, Math.floor(G.revealT/0.25));
      if (want > G.revealN){ G.revealN = want; AudioSys.click(0, 700, 0.1); }
      if (G.revealN >= G.lines.length && !G.entryChecked){
        G.entryChecked = true;
        if (Scores.qualifies(G.score)){ G.name = ''; G.state = 'ENTRY'; }
      }
      return;
    }

    if (G.state === 'ENTRY' || G.state === 'SCORES'){
      World.cam = (World.cam + 10*dt) % CONFIG.WORLD_W;
      World.update(dt); updateBirds(dt); updateParticles(dt);
      G.caret += dt;
      return;
    }
  }

  /* ---------------------------- Render -------------------------- */
  function panel(g, x, y, w, h){
    g.fillStyle = 'rgba(12,18,26,.78)';
    g.beginPath();
    if (g.roundRect) g.roundRect(x,y,w,h,14); else g.rect(x,y,w,h);
    g.fill();
    g.strokeStyle = 'rgba(230,220,180,.35)'; g.lineWidth = 2; g.stroke();
  }
  function drawButton(g, b){
    const hov = Input.st.mx>=b.x && Input.st.mx<=b.x+b.w && Input.st.my>=b.y && Input.st.my<=b.y+b.h;
    g.fillStyle = hov ? 'rgba(240,205,110,.92)' : 'rgba(40,52,64,.9)';
    g.beginPath();
    if (g.roundRect) g.roundRect(b.x,b.y,b.w,b.h,9); else g.rect(b.x,b.y,b.w,b.h);
    g.fill();
    g.strokeStyle = hov ? '#fff3c0' : 'rgba(230,220,180,.5)'; g.lineWidth = 2; g.stroke();
    g.fillStyle = hov ? '#23180a' : '#eee6cf';
    g.font = 'bold 18px Georgia,serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(b.label, b.x+b.w/2, b.y+b.h/2+1);
    g.textAlign='left'; g.textBaseline='alphabetic';
  }
  function drawButtons(g){
    const list = buttonsFor(G.state);
    if (!list) return;
    for (let i=0;i<list.length;i++) drawButton(g, list[i]);
  }

  function crosshair(g){
    if (G.state === 'ENDING') return;
    let x = Input.st.mx, y = Input.st.my;
    if (G.reloading){
      const p = 1 - G.reloadT/(CONFIG.RELOAD_MS/1000);
      y += Math.sin(p*Math.PI) * 14;
    }
    if (G.muzzleT > 0){
      const a = G.muzzleT/(CONFIG.MUZZLE_MS/1000);
      const grd = g.createRadialGradient(x,y,2,x,y,46);
      grd.addColorStop(0,'rgba(255,244,190,'+(0.9*a).toFixed(2)+')');
      grd.addColorStop(1,'rgba(255,180,60,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x,y,46,0,TAU); g.fill();
    }
    g.save();
    g.strokeStyle = 'rgba(20,24,28,.85)'; g.lineWidth = 4;
    ring(g,x,y); g.stroke();
    g.strokeStyle = '#f5f7fa'; g.lineWidth = 2;
    ring(g,x,y); g.stroke();
    g.fillStyle = '#f5f7fa';
    g.beginPath(); g.arc(x,y,1.6,0,TAU); g.fill();
    g.restore();
  }
  function ring(g,x,y){
    g.beginPath();
    g.arc(x,y,16,0,TAU);
    g.moveTo(x-24,y); g.lineTo(x-6,y);
    g.moveTo(x+6, y); g.lineTo(x+24,y);
    g.moveTo(x,y-24); g.lineTo(x,y-6);
    g.moveTo(x,y+6);  g.lineTo(x,y+24);
  }

  function drawDebug(g){
    g.save();
    g.font = '11px monospace'; g.textAlign='left';
    // Hitboxen der Vögel
    const it = World.birds.items;
    for (let i=0;i<it.length;i++){
      const b = it[i];
      if (!b.active) continue;
      const sx = wrapX(b.x, World.cam);
      const n = Renderer.visX(sx, Assets.BW*b.scale);
      for (let k=0;k<n;k++){
        Hit.birdBox(b, Renderer._xs[k]);
        g.strokeStyle = (b.state===S_FLY||b.state===S_PERCH||b.state===S_EXIT) ? '#4dff88' : '#ff5555';
        g.lineWidth = 1;
        g.strokeRect(Hit.box.x0, Hit.box.y0, Hit.box.x1-Hit.box.x0, Hit.box.y1-Hit.box.y0);
        g.fillStyle = '#c8ffdd';
        g.fillText('d=' + b.d.toFixed(2) + ' z=' + b.depth.toFixed(2), Hit.box.x0, Hit.box.y0-2);
      }
    }
    // Hitboxen der Deko
    const props = World.props;
    for (let i=0;i<props.length;i++){
      const p = props[i];
      if (!p.hittable) continue;
      const sx = wrapX(p.x, World.cam*p.layer);
      const n = Renderer.visX(sx, 260);
      for (let k=0;k<n;k++){
        if (!Hit.propBox(p, Renderer._xs[k])) break;
        g.strokeStyle = p.cd>0 ? 'rgba(255,160,60,.8)' : 'rgba(120,190,255,.8)';
        g.strokeRect(Hit.box.x0, Hit.box.y0, Hit.box.x1-Hit.box.x0, Hit.box.y1-Hit.box.y0);
        g.fillStyle='rgba(190,225,255,.9)';
        g.fillText(p.type+' z='+p.depth.toFixed(2), Hit.box.x0+2, Hit.box.y0+10);
      }
    }
    let active = 0;
    for (let i=0;i<it.length;i++) if (it[i].active) active++;
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(VW-146, VH-74, 138, 62);
    g.fillStyle = '#9dffb0';
    g.fillText('fps      ' + G.fps.toFixed(1), VW-138, VH-58);
    g.fillText('birds    ' + active,           VW-138, VH-44);
    g.fillText('parts    ' + World.parts.countActive(), VW-138, VH-30);
    g.fillText('cam      ' + World.cam.toFixed(0), VW-138, VH-16);
    g.restore();
  }

  function drawTitle(g){
    panel(g, 170, 130, 460, 380);
    g.textAlign='center';
    g.fillStyle = '#f3e2a8';
    g.font = 'bold 52px Georgia,serif';
    g.fillText('FEDERWIND', VW/2, 200);
    g.font = 'italic 17px Georgia,serif'; g.fillStyle='#cfd8e0';
    g.fillText('Panorama-Jagd in 90 Sekunden', VW/2, 228);
    g.font = '14px Georgia,serif'; g.fillStyle='#b6c3cf';
    const rows = [
      'Maus bewegen — zielen. Rand des Bildes — Panorama drehen.',
      'Linksklick — Schuss.  Rechtsklick oder R — nachladen.',
      'P / Esc — Pause    M — Ton    D — Debug    ← → — scrollen',
      '',
      'Nicht nur die Vögel reagieren auf Blei.'
    ];
    for (let i=0;i<rows.length;i++) g.fillText(rows[i], VW/2, 274 + i*24);
    g.textAlign='left';
    drawButtons(g);
  }

  function drawCountdown(g){
    const n = Math.ceil(G.countT);
    const f = 1 - (G.countT - Math.floor(G.countT));
    g.save();
    g.textAlign='center'; g.textBaseline='middle';
    g.globalAlpha = clamp(1.2 - f*0.9, 0, 1);
    g.font = 'bold ' + (110 + f*46) + 'px Georgia,serif';
    g.lineWidth = 8; g.strokeStyle='rgba(0,0,0,.5)';
    const txt = n > 0 ? String(n) : 'LOS!';
    g.strokeText(txt, VW/2, VH/2 - 40);
    g.fillStyle = n>0 ? '#ffe9a0' : '#a8f08a';
    g.fillText(txt, VW/2, VH/2 - 40);
    g.restore();
    g.textAlign='left'; g.textBaseline='alphabetic';
  }

  function drawPause(g){
    g.fillStyle='rgba(6,10,16,.62)'; g.fillRect(0,0,VW,VH);
    panel(g, 260, 220, 280, 150);
    g.textAlign='center';
    g.fillStyle='#f3e2a8'; g.font='bold 38px Georgia,serif';
    g.fillText('PAUSE', VW/2, 278);
    g.fillStyle='#c3cdd6'; g.font='15px Georgia,serif';
    g.fillText('P oder Esc — weiter', VW/2, 316);
    g.fillText('Ton: ' + (AudioSys.isMuted()?'aus':'an') + '  (M)', VW/2, 342);
    g.textAlign='left';
  }

  function drawResults(g){
    g.fillStyle='rgba(6,10,16,.55)'; g.fillRect(0,0,VW,VH);
    panel(g, 190, 96, 420, 380);
    g.textAlign='center';
    g.fillStyle='#f3e2a8'; g.font='bold 32px Georgia,serif';
    g.fillText('Auswertung', VW/2, 146);
    g.font='18px Georgia,serif';
    for (let i=0;i<G.revealN;i++){
      const last = (i === G.lines.length-1);
      g.textAlign='left';
      g.fillStyle = last ? '#ffe08a' : '#cfd8e0';
      g.font = (last?'bold 24px ':'18px ') + 'Georgia,serif';
      g.fillText(G.lines[i][0], 230, 196 + i*42);
      g.textAlign='right';
      g.fillText(G.lines[i][1], 570, 196 + i*42);
    }
    g.textAlign='center'; g.fillStyle='#93a3b1'; g.font='13px Georgia,serif';
    g.fillText('Enter — nochmal    Esc — Titel', VW/2, 470);
    g.textAlign='left';
    if (G.revealN >= G.lines.length) drawButtons(g);
  }

  function drawEntry(g){
    g.fillStyle='rgba(6,10,16,.6)'; g.fillRect(0,0,VW,VH);
    panel(g, 210, 210, 380, 260);
    g.textAlign='center';
    g.fillStyle='#f3e2a8'; g.font='bold 26px Georgia,serif';
    g.fillText('Bestenliste!', VW/2, 260);
    g.fillStyle='#cfd8e0'; g.font='16px Georgia,serif';
    g.fillText(G.score + ' Punkte — Name eingeben:', VW/2, 292);
    g.fillStyle='rgba(255,255,255,.10)'; g.fillRect(275, 312, 250, 44);
    g.strokeStyle='rgba(240,225,170,.6)'; g.lineWidth=2; g.strokeRect(275,312,250,44);
    g.fillStyle='#fff3c8'; g.font='bold 22px monospace';
    const car = (Math.floor(G.caret*2)%2) ? '_' : ' ';
    g.fillText(G.name + car, VW/2, 342);
    g.fillStyle='#93a3b1'; g.font='12px Georgia,serif';
    g.fillText('max. ' + CONFIG.NAME_MAX + ' Zeichen — Enter bestätigt', VW/2, 380);
    g.textAlign='left';
    drawButtons(g);
  }

  function drawScores(g){
    g.fillStyle='rgba(6,10,16,.6)'; g.fillRect(0,0,VW,VH);
    panel(g, 210, 70, 380, 470);
    g.textAlign='center';
    g.fillStyle='#f3e2a8'; g.font='bold 28px Georgia,serif';
    g.fillText('Bestenliste', VW/2, 118);
    const l = G.scoreList;
    g.font='17px monospace';
    if (!l.length){
      g.fillStyle='#93a3b1'; g.font='15px Georgia,serif';
      g.fillText('Noch keine Einträge.', VW/2, 200);
    }
    for (let i=0;i<l.length;i++){
      g.textAlign='left';  g.fillStyle = i===0 ? '#ffe08a' : '#cfd8e0';
      g.fillText((i+1)+'.', 246, 164 + i*33);
      g.fillText(l[i].n,    282, 164 + i*33);
      g.textAlign='right';
      g.fillText(String(l[i].p), 554, 164 + i*33);
    }
    g.textAlign='left';
    drawButtons(g);
  }

  function render(g){
    const sh = G.shakeT > 0 ? CONFIG.RECOIL_SHAKE_PX * (G.shakeT/(CONFIG.RECOIL_SHAKE_MS/1000)) : 0;
    g.save();
    if (sh) g.translate(rnd(-sh,sh), rnd(-sh,sh));
    Renderer.drawWorld(g);
    g.restore();

    if (G.state==='PLAY' || G.state==='COUNT' || G.state==='ENDING') HUD.draw(g, G);
    if (G.debug) drawDebug(g);

    switch(G.state){
      case 'TITLE':   drawTitle(g); break;
      case 'COUNT':   drawCountdown(g); break;
      case 'RESULTS': drawResults(g); break;
      case 'ENTRY':   drawEntry(g); break;
      case 'SCORES':  drawScores(g); break;
    }
    if (G.paused && G.state!=='TITLE') drawPause(g);
    crosshair(g);
  }

  /* ------------------------- Eingaben --------------------------- */
  function onClick(pt){
    const b = btnAt(pt.x, pt.y);
    if (b){
      if (b.id==='start'){ startRound(); }
      else if (b.id==='scores'){ G.scoreList = Scores.load(); G.state='SCORES'; }
      else if (b.id==='title'){ G.state='TITLE'; G.entryChecked=false; }
      else if (b.id==='again'){ startRound(); G.entryChecked=false; }
      else if (b.id==='ok'){ submitName(); }
      return true;
    }
    return false;
  }

  function submitName(){
    G.scoreList = Scores.add(G.name.trim() || 'Jäger', G.score);
    G.state = 'SCORES';
  }

  function onKey(e){
    const c = e.code;
    if (G.state === 'ENTRY'){
      if (c === 'Enter'){ submitName(); return; }
      if (c === 'Backspace'){ G.name = G.name.slice(0,-1); return; }
      if (e.key && e.key.length === 1 && G.name.length < CONFIG.NAME_MAX)
        G.name += e.key;
      return;
    }
    if (c === 'KeyM'){ AudioSys.toggleMute(); return; }
    if (c === 'KeyD'){ G.debug = !G.debug; return; }
    if (c === 'KeyP' || c === 'Escape'){
      if (G.state === 'PLAY' || G.state === 'COUNT') G.paused = !G.paused;
      else if (G.state === 'RESULTS' || G.state === 'SCORES' || G.state === 'ENTRY'){
        G.state = 'TITLE'; G.entryChecked = false;
      }
      return;
    }
    if (c === 'KeyR'){ if (G.state==='PLAY' && !G.paused) startReload(); return; }
    if (c === 'Enter' || c === 'Space'){
      if (G.state === 'TITLE'){ startRound(); }
      else if (G.state === 'RESULTS'){ startRound(); G.entryChecked = false; }
      else if (G.state === 'SCORES'){ G.state='TITLE'; G.entryChecked=false; }
      return;
    }
  }

  return {
    G, update, render, onClick, onKey, fire,
    reload(){ if (G.state==='PLAY' && !G.paused) startReload(); },
    STEP
  };
})();

/* ============================ MAIN ================================== */
(function main(){
  const canvas = document.getElementById('cv');
  const g = canvas.getContext('2d', { alpha:false });
  g.imageSmoothingEnabled = true;

  Assets.build();
  World.reset();
  Spawner.reset();
  Spawner.seed(6, 2);           // Attract-Demo startet belebt
  Input.attach(canvas);

  Input.on('shoot',  () => Game.fire());
  Input.on('reload', () => Game.reload());
  Input.on('click',  pt => Game.onClick(pt));
  Input.on('key',    e  => Game.onKey(e));

  /* --- Letterboxing: internes 800x600 auf das Fenster skalieren --- */
  function fit(){
    const ar = CONFIG.VIEW_W / CONFIG.VIEW_H;
    let w = window.innerWidth - 4, h = window.innerHeight - 26;
    if (w/h > ar) w = h*ar; else h = w/ar;
    canvas.style.width  = Math.floor(w) + 'px';
    canvas.style.height = Math.floor(h) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  /* --- Feste Logikschrittweite mit Akkumulator --- */
  const STEP = Game.STEP;
  let last = performance.now(), acc = 0, fpsAcc = 0, fpsN = 0;

  function frame(now){
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;          // Tab-Wechsel abfangen
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 8){ Game.update(STEP); acc -= STEP; }
    if (acc > STEP) acc = 0;

    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.4){ Game.G.fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; }

    Game.render(g);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
