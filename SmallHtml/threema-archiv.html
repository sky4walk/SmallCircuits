/* Deckungsleiste: eine Spur je Quellarchiv ueber die Zeitachse des Threads. */
function renderCoverage(t) {
  const box = $('#coverage'); box.textContent = '';
  if (!t.from || t.to === t.from) { box.hidden = true; return; }
  box.hidden = false;
  const span = t.to - t.from, BINS = 300;
  const lanes = new Map();
  for (const s of t.sourceList) lanes.set(s.archive, new Uint8Array(BINS));
  for (const m of t.messages) {
    const b = Math.min(BINS - 1, Math.floor(((m.ts - t.from) / span) * BINS));
    for (const src of m.sources) lanes.get(src)?.fill(1, b, b + 1);
  }
  for (const [name, bins] of lanes) {
    const lane = el('div', 'lane');
    lane.title = name;
    let i = 0, delay = 0;
    while (i < BINS) {
      if (!bins[i]) { i++; continue; }
      let j = i; while (j < BINS && bins[j]) j++;
      const seg = el('i');
      seg.style.left = (i / BINS * 100) + '%';
      seg.style.width = Math.max(0.35, (j - i) / BINS * 100) + '%';
      seg.style.background = archColor(name);
      if (archKind(name) === 'export')
        seg.style.backgroundImage = 'repeating-linear-gradient(45deg,#ffffff00 0 2px,#ffffffb0 2px 4px)';
      seg.style.animationDelay = (delay += 12) + 'ms';
      lane.append(seg);
      i = j;
    }
    box.append(lane);
  }
  const axis = el('div', 'axis');
  axis.append(el('span', null, fmtShort.format(new Date(t.from))));
  axis.append(el('span', null, fmtShort.format(new Date(t.to))));
  box.append(axis);

  const lg = el('div', 'legend');
  for (const s of t.sourceList) {
    const sp = el('span');
    const i = el('i'); i.style.background = archColor(s.archive);
    if (archKind(s.archive) === 'export')
      i.style.backgroundImage = 'repeating-linear-gradient(45deg,#ffffff00 0 2px,#ffffffb0 2px 4px)';
    sp.append(i, el('span', null, `${s.archive} · ${s.added} eigen, ${s.dup} auch anderswo`));
    lg.append(sp);
  }
  box.append(lg);
}

/* Exportthreads ohne Threema-ID lassen sich nicht automatisch zuordnen. */
function renderAssign(t) {
  const box = $('#assign');
  if (!t.unresolved) { box.hidden = true; return; }
  box.hidden = false; box.textContent = '';
  box.append(el('span', null, `„${t.title}" stammt aus einem Chatexport ohne Threema-ID. Zuordnen zu:`));
  const sel = el('select');
  sel.append(new Option('— eigenständig lassen —', ''));
  for (const o of S.threads) {
    if (o.key === t.key || o.unresolved) continue;
    sel.append(new Option(`${o.title}${o.identity ? ' (' + o.identity + ')' : ''}`, o.key));
  }
  const apply = el('button', 'primary', 'Zusammenführen');
  apply.onclick = () => {
    if (!sel.value) return;
    for (const a of S.archives)
      for (const th of a.data.threads)
        if (th.source === 'export' && th.title === t.title) S.manual[a.name + '\u0000' + th.key] = sel.value;
    S.current = { key: sel.value };
    rebuild();
    toast('Verläufe zusammengeführt');
  };
  box.append(sel, apply);
}

/* ---------- Nachrichten ----------------------------------------------- */

const URL_RE = /\bhttps?:\/\/[^\s<>"')]+/g;

function textNodes(text, q) {
  const frag = document.createDocumentFragment();
  const pushPlain = s => {
    if (!q) { frag.append(document.createTextNode(s)); return; }
    const lc = s.toLowerCase(); let i = 0, k;
    while ((k = lc.indexOf(q, i)) >= 0) {
      if (k > i) frag.append(document.createTextNode(s.slice(i, k)));
      frag.append(el('mark', null, s.slice(k, k + q.length)));
      i = k + q.length;
    }
    frag.append(document.createTextNode(s.slice(i)));
  };
  let last = 0;
  for (const m of text.matchAll(URL_RE)) {
    if (m.index > last) pushPlain(text.slice(last, m.index));
    const a = el('a', null, m[0]);
    a.href = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
    frag.append(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) pushPlain(text.slice(last));
  return frag;
}

function renderMessages() {
  const t = S.current, log = $('#log');
  log.textContent = '';
  if (!t) return showEmpty();
  const msgs = t.messages;
  const q = S.query.trim().toLowerCase();

  if (S.windowStart > 0) {
    const more = el('button', null, `${S.windowStart} ältere Nachrichten laden`);
    more.id = 'more';
    more.onclick = () => {
      const anchor = log.children[1];
      const before = anchor?.offsetTop ?? 0;
      S.windowStart = Math.max(0, S.windowStart - 500);
      renderMessages();
      const after = log.children[1]?.offsetTop ?? 0;
      log.scrollTop += (after - before);
    };
    log.append(more);
  }

  let lastDay = null;
  const byApiId = new Map(msgs.filter(m => m.apiid).map(m => [m.apiid, m]));
  for (let i = S.windowStart; i < msgs.length; i++) {
    const m = msgs[i];
    const dk = dayKey(m.ts);
    if (dk !== lastDay) { log.append(el('div', 'daysep', fmtDay.format(new Date(m.ts)))); lastDay = dk; }
    log.append(messageNode(m, t, q, byApiId));
  }
  log.scrollTop = log.scrollHeight;
}

function messageNode(m, t, q, byApiId) {
  const row = el('div', 'msg' + (m.out ? ' out' : '') + (m.deletedAt ? ' deleted' : ''));

  const prov = el('div', 'prov');
  for (const s of m.sources) {
    const i = el('i');
    i.style.background = archColor(s);
    if (archKind(s) === 'export') i.classList.add('ex');
    prov.append(i);
  }
  prov.title = 'Aus: ' + m.sources.join(', ');
  row.append(prov);

  const card = el('div', 'card');

  if (!m.out && t.kind === 'group') {
    const who = m.senderName || m.senderId || 'unbekannt';
    const c = [...S.archives].map(a => a.data.contacts?.get(m.senderId)).find(Boolean);
    card.append(el('div', 'who', c ? `${[c.firstname, c.lastname].filter(Boolean).join(' ') || c.nickname} · ${m.senderId}` : who));
  } else if (!m.out && m.senderName && m.senderName !== t.title) {
    card.append(el('div', 'who', m.senderName));
  }

  if (m.quote && byApiId.has(m.quote)) {
    const src = byApiId.get(m.quote);
    card.append(el('div', 'quote', (src.body || src.caption || '(Anhang)').slice(0, 220)));
  }

  if (m.deletedAt) {
    card.append(el('div', 'body', 'Diese Nachricht wurde gelöscht.'));
  } else {
    if (m.attachment) card.append(attachmentNode(m));
    const main = bodyFor(m);
    if (main != null) { const b = el('div', 'body'); b.append(textNodes(main, q)); card.append(b); }
    if (m.caption) { const c = el('div', 'cap'); c.append(textNodes(m.caption, q)); card.append(c); }
  }

  const foot = el('div', 'foot');
  const time = m.tsPrecision === 'minute' ? fmtTime.format(new Date(m.ts)) : fmtTimeS.format(new Date(m.ts));
  foot.append(el('span', null, time));
  if (m.tsPrecision === 'minute') { const s = el('span', 'flag', '~'); s.title = 'Nur minutengenau — aus einem Chatexport'; foot.append(s); }
  if (m.starred) { const s = el('span', 'star', '★'); s.title = 'Markiert'; foot.append(s); }
  if (m.editedAt) { const s = el('span', 'flag', 'bearbeitet'); s.title = new Date(m.editedAt).toLocaleString('de-DE'); foot.append(s); }
  if (m.out && m.state) foot.append(el('span', null, String(m.state).toLowerCase()));
  if (m.sources.length > 1) { const s = el('span', null, `${m.sources.length}×`); s.title = 'In mehreren Archiven vorhanden'; foot.append(s); }
  card.append(foot);

  if (m.type === 'unknown' || Object.keys(m.raw).length) {
    const d = el('details', 'raw');
    d.append(el('summary', null, m.type === 'unknown' ? `unbekannter Typ: ${m.rawType}` : 'Rohdaten'));
    const pre = el('pre', null, JSON.stringify({ typ: m.rawType, body: m.body, ...m.raw }, null, 2));
    d.append(pre);
    card.append(d);
  }

  row.append(card);
  return row;
}

/* Der Textkoerper haengt am Typ: bei Sonderformen steckt im body JSON. */
function bodyFor(m) {
  if (m.type === 'text') return m.body || '';
  if (m.type === 'location') {
    const [head, ...rest] = (m.body || '').split('\n');
    const [lat, lng] = head.split(',');
    const name = rest.filter(Boolean).join(', ');
    return `Standort${name ? ': ' + name : ''}\n${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`;
  }
  if (m.type === 'call') {
    try {
      const j = JSON.parse(m.body || '{}');
      const d = j.duration ? ` · ${Math.floor(j.duration / 60)}:${String(j.duration % 60).padStart(2, '0')}` : '';
      return `Anruf${d}`;
    } catch { return 'Anruf'; }
  }
  if (m.type === 'ballot') {
    try { const j = JSON.parse(m.body || '{}'); return `Umfrage: ${j.t || j.title || ''}`.trim(); }
    catch { return 'Umfrage'; }
  }
  if (m.type === 'status') return m.body || '';
  if (['image', 'video', 'audio', 'file'].includes(m.type)) return m.body ? m.body : null;
  return m.body || '';
}

const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
  webp: 'image/webp', mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm',
  mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', ogg: 'audio/ogg', opus: 'audio/ogg',
  pdf: 'application/pdf' };

function attachmentNode(m) {
  const wrap = el('div', 'att');
  const a = m.attachment;
  if (!a.entry) {
    const ph = el('div', 'ph missing');
    ph.append(el('span', null, `Datei fehlt im Archiv: ${a.name}`));
    wrap.append(ph); return wrap;
  }
  const ph = el('div', 'ph');
  const sz = a.size ? ` · ${(a.size / 1024).toFixed(0)} kB` : '';
  ph.append(el('span', null, `${a.name}${sz}`));
  const btn = el('button', 'load', 'anzeigen');
  ph.append(btn);
  wrap.append(ph);

  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'entschlüsselt …';
    try {
      const url = await blobFor(m.src.archive, a.entry, a.name);
      const mime = S.mimes.get(m.src.archive + '\u0000' + a.entry) || '';
      let node;
      if (mime.startsWith('image/')) { node = el('img'); node.src = url; node.alt = a.name; node.loading = 'lazy'; }
      else if (mime.startsWith('video/')) { node = el('video'); node.src = url; node.controls = true; }
      else if (mime.startsWith('audio/')) { node = el('audio'); node.src = url; node.controls = true; }
      else {
        node = el('div', 'ph');
        const dl = el('a', null, `${a.name} herunterladen`);
        dl.href = url; dl.download = a.name; node.append(dl);
      }
      wrap.replaceChildren(node);
      if (mime.startsWith('image/')) {
        node.style.cursor = 'zoom-in';
        node.onclick = () => window.open(url, '_blank');
      }
    } catch (err) {
      btn.disabled = false; btn.textContent = 'anzeigen';
      toast(`${a.name}: ${err.message}`, 5000);
    }
  };
  return wrap;
}

/* Medien in Datensicherungen heissen nach der Nachrichten-uid und haben
   keine Endung — der Typ muss aus dem Dateianfang kommen. */
function sniffMime(b) {
  const s = (...v) => v.every((x, i) => b[i] === x);
  if (s(0x89, 0x50, 0x4e, 0x47)) return 'image/png';
  if (s(0xff, 0xd8, 0xff)) return 'image/jpeg';
  if (s(0x47, 0x49, 0x46, 0x38)) return 'image/gif';
  if (s(0x52, 0x49, 0x46, 0x46) && b[8] === 0x57 && b[9] === 0x45) return 'image/webp';
  if (s(0x25, 0x50, 0x44, 0x46)) return 'application/pdf';
  if (s(0x4f, 0x67, 0x67, 0x53)) return 'audio/ogg';
  if (s(0x49, 0x44, 0x33) || (b[0] === 0xff && (b[1] & 0xe0) === 0xe0)) return 'audio/mpeg';
  if (b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70) {
    const brand = String.fromCharCode(b[8], b[9], b[10], b[11]);
    return /^(M4A|mp42|isom|avc1|mp41|iso2|qt)/.test(brand)
      ? (brand.startsWith('M4A') ? 'audio/mp4' : 'video/mp4') : 'video/mp4';
  }
  if (s(0x1a, 0x45, 0xdf, 0xa3)) return 'video/webm';
  return null;
}

async function blobFor(archiveName, entry, fname) {
  const key = archiveName + '\u0000' + entry;
  if (S.blobs.has(key)) return S.blobs.get(key);
  const arch = S.archives.find(a => a.name === archiveName);
  if (!arch) throw new Error('Archiv nicht mehr geladen');
  const bytes = await arch.zip.extract(entry);
  const ext = (fname.split('.').pop() || '').toLowerCase();
  const type = sniffMime(bytes) || MIME[ext] || 'application/octet-stream';
  const url = URL.createObjectURL(new Blob([bytes], { type }));
  S.mimes.set(key, type);
  if (S.blobs.size > 60) {
    const [old, oldUrl] = S.blobs.entries().next().value;
    URL.revokeObjectURL(oldUrl); S.blobs.delete(old); S.mimes.delete(old);
  }
  S.blobs.set(key, url);
  return url;
}

/* ---------- Thread als Textdatei sichern ------------------------------ */

function saveThread() {
  const t = S.current; if (!t) return;
  const lines = [
    `# ${t.title}${t.identity ? ' (' + t.identity + ')' : ''}`,
    `# ${t.messages.length} Nachrichten, zusammengeführt aus: ${t.sourceList.map(s => s.archive).join(', ')}`,
    '',
  ];
  for (const m of t.messages) {
    const d = new Date(m.ts);
    const stamp = d.toLocaleString('de-DE');
    const who = m.out ? 'Ich' : (m.senderName || m.senderId || t.title);
    let body = m.deletedAt ? '(gelöscht)' : (bodyFor(m) || '');
    if (m.attachment) body = `[${m.attachment.name}]` + (body ? ' ' + body : '');
    if (m.caption) body += (body ? ' — ' : '') + m.caption;
    lines.push(`[${stamp}] ${who}: ${body.replace(/\n/g, '\n    ')}`);
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = el('a');
  a.href = URL.createObjectURL(blob);
  a.download = t.title.replace(/[^\p{L}\p{N}._-]+/gu, '_') + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- Untersuchung ----------------------------------------------- */

let lastReport = null;

async function runInspect(file) {
  if (!file) return;
  busy(`${file.name} wird untersucht …`);
  await yieldUI();
  // Erst ohne Passwort pruefen; nur wenn noetig, danach fragen.
  let R = await inspectArchive(file, null);
  const needsPw = R.stages.some(s => s.name === 'Passwort' && s.state === 'offen');
  if (needsPw) {
    let pw = null;
    for (const cand of S.passwords) {
      const t = await inspectArchive(file, cand);
      if (t.stages.some(s => s.name === 'Passwort' && s.state === 'ok')) { R = t; pw = cand; break; }
    }
    if (pw == null) {
      busy(null);
      pw = await askPassword(file.name);
      if (pw != null) {
        busy(`${file.name} wird untersucht …`);
        await yieldUI();
        R = await inspectArchive(file, pw);
        if (R.stages.some(s => s.name === 'Passwort' && s.state === 'ok') && !S.passwords.includes(pw))
          S.passwords.push(pw);
      }
    }
  }
  busy(null);
  lastReport = R;
  showInspect();
}

function showInspect() {
  if (!lastReport) return;
  $('#insp-out').textContent = reportText(lastReport, $('#insp-anon').checked);
  $('#insp').showModal();
}

/* ---------- Diagnose --------------------------------------------------- */

function showDiag() {
  const b = $('#diag-body'); b.textContent = '';
  const d = S.diag;
  const sec = (title, node) => { b.append(el('h4', null, title)); b.append(node); };
  const table = (head, rows) => {
    const t = el('table');
    if (head) { const tr = el('tr'); head.forEach(h => tr.append(el('th', null, h))); t.append(tr); }
    for (const r of rows) { const tr = el('tr'); r.forEach(c => { const td = el('td'); if (c instanceof Node) td.append(c); else td.textContent = c; tr.append(td); }); t.append(tr); }
    return t;
  };

  sec('Geladene Archive', table(['Datei', 'Art', 'Threads', 'Nachrichten'],
    S.archives.map(a => [a.name, a.kind === 'export' ? 'Chatexport' : 'Datensicherung',
      String(a.data.threads.length),
      String(a.data.threads.reduce((s, t) => s + t.messages.length, 0))])));

  sec('Erkannte Spaltenschemata', table(['Datei', 'Spalten'],
    d.schemas.map(s => [s.archive + ' › ' + s.file, s.columns.join(', ')])));

  const unk = d.unknownColumns.filter(u => u.columns.length);
  sec('Nicht zugeordnete Spalten', unk.length
    ? table(['Datei', 'Spalte'], unk.map(u => [u.file, u.columns.join(', ')]))
    : el('div', 'good', 'Alle Spalten konnten zugeordnet werden.'));

  sec('Unbekannte Nachrichtentypen', d.unknownTypes.size
    ? table(null, [...d.unknownTypes].map(t => [t, 'wird als Rohdatensatz angezeigt']))
    : el('div', 'good', 'Alle Nachrichtentypen sind bekannt.'));

  sec('Fehlende Mediendateien', d.missingMedia.length
    ? table(['Datei', 'Referenz'], d.missingMedia.slice(0, 200).map(m => [m.file, m.name]))
    : el('div', 'good', 'Jede Medienreferenz hat eine Datei im Archiv.'));

  sec('Übersprungene Einträge', d.skipped.length
    ? table(null, d.skipped.map(s => [s]))
    : el('div', 'good', 'Keine.'));

  sec('Datumsformat der Chatexporte', d.dateOrder.length
    ? table(['Datei', 'gelesen als', 'Begründung'], d.dateOrder.map(x => [x.file, x.order, x.reason]))
    : el('div', 'good', 'Keine Chatexporte geladen.'));

  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const note = el('div');
  note.append(el('div', null, `Zeitzone dieses Rechners: ${tz}`));
  note.append(el('div', 'warn', 'Chatexporte enthalten Ortszeit ohne Zonenangabe. Wurde ein Export in '
    + 'einer anderen Zeitzone erstellt, können seine Nachrichten gegenüber der Datensicherung um Stunden '
    + 'verschoben liegen — dann greift der Abgleich nicht und Nachrichten erscheinen doppelt.'));
  sec('Zeitzone', note);

  const unres = S.threads.filter(t => t.unresolved);
  sec('Threads ohne Threema-ID', unres.length
    ? table(['Titel', 'Nachrichten'], unres.map(t => [t.title, String(t.messages.length)]))
    : el('div', 'good', 'Alle Threads konnten einer ID zugeordnet werden.'));

  $('#diag').showModal();
}

/* ---------- Start ------------------------------------------------------ */

function init() {
  S.diag = newDiag();

  if (!window.crypto?.subtle) {
    document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;padding:40px;max-width:60ch;line-height:1.6">'
      + 'Diese Seite braucht die WebCrypto-API. Der Browser stellt sie nur in einem sicheren Kontext bereit. '
      + 'Wenn die Datei per Doppelklick nicht funktioniert, im selben Ordner <code>python3 -m http.server</code> '
      + 'starten und die Seite über <code>http://localhost:8000</code> öffnen.</p>';
    return;
  }


  $('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('#add-btn').onclick = () => $('#file').click();
  $('#diag-btn').onclick = showDiag;
  $('#inspect-btn').onclick = () => $('#file-inspect').click();
  $('#file-inspect').onchange = e => { const f = e.target.files[0]; e.target.value = ''; runInspect(f); };
  $('#insp-anon').onchange = showInspect;
  $('#insp-close').onclick = () => $('#insp').close();
  $('#insp-copy').onclick = async () => {
    try { await navigator.clipboard.writeText($('#insp-out').textContent); toast('Bericht in die Zwischenablage kopiert'); }
    catch { toast('Kopieren nicht möglich — Text markieren und von Hand kopieren', 5000); }
  };
  $('#insp-save').onclick = () => {
    const b = new Blob([$('#insp-out').textContent], { type: 'text/plain;charset=utf-8' });
    const a = el('a'); a.href = URL.createObjectURL(b);
    a.download = 'threema-bericht.txt'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  $('#diag-close').onclick = () => $('#diag').close();
  $('#save-btn').onclick = saveThread;
  $('#back').onclick = () => document.body.classList.remove('reading');

  let tq;
  $('#search').oninput = e => {
    clearTimeout(tq);
    tq = setTimeout(() => { S.query = e.target.value; renderThreadList(); if (S.current) renderMessages(); }, 180);
  };

  for (const ev of ['dragenter', 'dragover']) document.addEventListener(ev, e => {
    e.preventDefault(); document.body.classList.add('dragging');
  });
  for (const ev of ['dragleave', 'drop']) document.addEventListener(ev, e => {
    if (ev === 'drop') e.preventDefault();
    if (e.relatedTarget == null) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragging');
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });

  showEmpty();
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
