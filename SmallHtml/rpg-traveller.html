<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traveller – Werkzeugkasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000; --sheet:#f6f6f4; --ink:#000; --mute:#5b5b57; --rule:#cfcfca; --faint:#e6e6e2;
  --red:#d21f2b; --amber:#d99a16; --green:#2f7d4f;
  --head:"Tenor Sans", Optima, Candara, "Segoe UI", sans-serif;
  --body:"IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", Roboto, sans-serif;
  --code:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;color:#fff;background:var(--black);font:16px/1.45 var(--body)}
a{color:inherit}
button,select,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Kopf im Stil der schwarzen Regelhefte */
header{padding:28px 20px 0;max-width:1240px;margin:0 auto;position:relative}
.logo{font:400 clamp(44px,8vw,86px)/1 var(--head);letter-spacing:.01em;margin:0}
.redline{height:3px;background:var(--red);margin:14px 0 10px;width:100%}
.sub{color:#bdbdb8;margin:0 0 18px;max-width:62ch}
nav{display:flex;flex-wrap:wrap;gap:2px 22px;padding-bottom:14px;border-bottom:1px solid #2a2a2a}
nav button{background:none;border:0;color:#bdbdb8;padding:6px 0;cursor:pointer;font:400 17px var(--head);border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--red)}

main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
section.tab{display:none}
section.tab.on{display:block}

/* Blätter wie die Tabellenseiten im Regelbuch */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.grid.two{grid-template-columns:minmax(320px,1fr) minmax(320px,1.35fr)}
@media (max-width:820px){.grid.two{grid-template-columns:1fr}}
.sheet{background:var(--sheet);color:var(--ink);padding:18px 20px 20px;min-width:0}
.sheet.dark{background:#0d0d0d;color:#fff;border:1px solid #2a2a2a}
.sheet h2{font:400 22px/1.2 var(--head);margin:0 0 4px}
.sheet h3{font:600 15px/1.3 var(--body);margin:16px 0 6px}
.sheet .note{color:var(--mute);font-size:14px;margin:2px 0 12px;max-width:70ch}
.sheet.dark .note{color:#a9a9a4}
hr.r{border:0;border-top:2px solid var(--red);margin:14px 0;width:48px}

.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin:8px 0}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
.sheet.dark label.f{color:#a9a9a4}
input[type=text],input[type=number],select,textarea{border:1px solid #9d9d98;background:#fff;color:#000;padding:6px 8px;border-radius:2px;min-width:0}
input[type=number]{width:90px}
input.uwp{font-family:var(--code);width:130px;text-transform:uppercase}
.btn{background:#000;color:#fff;border:1px solid #000;padding:7px 13px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;color:#000;border-color:#8e8e89}
.btn.ghost:hover{border-color:var(--red);color:var(--red);background:transparent}
.sheet.dark .btn{background:#fff;color:#000;border-color:#fff}
.sheet.dark .btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.small{padding:3px 8px;font-size:14px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px}

table.t{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
table.t th{text-align:left;font-weight:600;border-bottom:1.5px solid #000;padding:4px 6px}
table.t td{border-bottom:1px solid var(--rule);padding:4px 6px;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.code{font-family:var(--code)}
.big{font:400 40px/1.05 var(--code);letter-spacing:.04em}
.pill{display:inline-block;border:1px solid #000;padding:0 6px;margin:1px 3px 1px 0;font-size:13px;border-radius:2px}
.pill.red{border-color:var(--red);color:var(--red)}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:#9a6a00}
.log{font-size:14.5px;border-left:2px solid var(--red);padding:2px 0 2px 12px;max-height:420px;overflow:auto}
.log p{margin:2px 0}
.log .h{font-weight:600;margin-top:8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:15px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.hist{font-family:var(--code);font-size:14px;max-height:260px;overflow:auto;color:var(--mute)}
.hist div:first-child{color:#000;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0;max-width:420px}
.stats div{border:1px solid #000;text-align:center;padding:4px 0}
.stats b{display:block;font:500 22px var(--code)}
.stats span{font-size:11px;color:var(--mute)}

/* Subsektorkarte */
.mapwrap{background:#000;overflow:auto;padding:6px}
svg.map{display:block;margin:0 auto;max-width:100%;height:auto}
svg.map .hx{fill:#000;stroke:#3b3b3b;stroke-width:1}
svg.map .hx.sel{fill:#2a0a0c;stroke:var(--red);stroke-width:2}
svg.map .hx.sel2{fill:#101820;stroke:#7aa7d6;stroke-width:2}
svg.map .hx.inr{fill:#141414}
svg.map text{fill:#fff;font-family:var(--body);pointer-events:none}
svg.map .lab{fill:#6d6d6a;font-size:9px;font-family:var(--code)}
svg.map g.cell{cursor:pointer}
.legend{font-size:13px;color:#bdbdb8;margin-top:6px}

@media print{nav,.noprint{display:none}body,html{background:#fff;color:#000}.sheet{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="logo">Traveller</h1>
  <div class="redline" aria-hidden="true"></div>
  <p class="sub">Werkzeugkasten für das Science-Fiction-Rollenspiel der fernen Zukunft – nach dem Regelbuch von 1985 (Fantasy Productions, Lizenz Game Designers' Workshop).</p>
  <nav role="tablist" id="nav"></nav>
</header>
<main id="main"></main>
<script>
"use strict";
/* ================= Kern ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d6 = () => 1 + Math.floor(Math.random() * 6);
const nd = n => { let s = 0; for (let i = 0; i < n; i++) s += d6(); return s; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const HEXA = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const hx = v => HEXA[clamp(v, 0, 33)] ?? "?";
const unhx = c => HEXA.indexOf(String(c).toUpperCase());
const cr = n => "Cr " + Math.round(n).toLocaleString("de-DE");
const mcr = n => "MCr " + (Math.round(n * 1000) / 1000).toLocaleString("de-DE", {maximumFractionDigits: 3});
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
const store = {
  get(k, d) { try { const v = localStorage.getItem("trav." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("trav." + k, JSON.stringify(v)); } catch (e) {} }
};
function download(name, text, type = "text/plain") {
  const b = new Blob([text], {type: type + ";charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function readFile(cb) {
  const i = document.createElement("input"); i.type = "file"; i.accept = ".json,application/json";
  i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch (e) { alert("Die Datei ist kein gültiges JSON."); } }; r.readAsText(f); };
  i.click();
}
/* Wahrscheinlichkeit, mit 2W (plus WM) mindestens t zu werfen */
const P2 = (() => { const c = {}; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) c[a + b] = (c[a + b] || 0) + 1; return c; })();
function p2d(target, dm = 0) { let s = 0; for (let r = 2; r <= 12; r++) if (r + dm >= target) s += P2[r]; return s / 36; }
const pct = p => Math.round(p * 100) + " %";

/* ================= Namen ================= */
const VORN = ["Alexander","Hylan","Kira","Marcus","Jaen","Dmitri","Soren","Lysa","Tomas","Anya","Elias","Mira","Konrad","Talia","Isak","Renate","Oskar","Yuki","Farid","Leila","Brand","Neha","Ivo","Sabeth","Arvid","Katrin","Rurik","Selene","Jonas","Petra","Casimir","Ilse","Nadim","Aurelia","Viktor","Edda","Hanno","Zuri","Lorant","Maren"];
const NACH = ["Johannson","Vincent","Morrow","Castell","Brenner","Okafor","Lindqvist","Voss","Hartmann","Iwakura","Rask","Sturm","Delacroix","Arkadi","Tessler","Bauer","Nakamura","Quell","Haldane","Marek","Ostrow","Kovacs","Valtieri","Engström","Ashgrove","Dunmore","Kerensky","Albrecht","Moreau","Thibault"];
const VIL1 = ["Ka","Shi","Ar","Lim","Gi","Ku","Ush","Di","Ma","Ne","Ri","Sa","Ta","Ve","Zo","Ir","Ek","Lu","Mi","Ga","Ro","Ya","Ce","Da","Ha","Ol","Pa","Ti","Xa","Bel","Nor","Vel","Tor","Kes","Ran","Sol","Gha","Qua"];
const VIL2 = ["ra","shi","lim","kar","gii","dor","nis","ven","ta","mar","lon","dis","ros","kan","via","ria","lus","gan","ther","mis","ka","dun","sa","tos","rel","phi","nia","mek"];
const VIL3 = ["","","","","n","a","is","on","ar","ia","us","ex"," Prime"," Minor"," II"];
function worldName() { let s = pick(VIL1) + pick(VIL2); if (Math.random() < .45) s += pick(VIL2); s += pick(VIL3); return s.charAt(0).toUpperCase() + s.slice(1); }
function personName() { return pick(VORN) + " " + pick(NACH); }

/* ================= Tabs ================= */
const TABS = [];
function addTab(id, title, build) { TABS.push({id, title, build}); }
function showTab(id) {
  $$("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  $$("section.tab").forEach(s => s.classList.toggle("on", s.id === "tab-" + id));
  store.set("tab", id);
}

/* ================= Würfel ================= */
const diceHist = [];
function diceLog(txt) {
  diceHist.unshift(txt); if (diceHist.length > 30) diceHist.pop();
  $("#dice-hist").innerHTML = diceHist.map(t => `<div>${t}</div>`).join("");
}
function rollExpr(expr) {
  const m = String(expr).replace(/\s+/g, "").toUpperCase().match(/^(\d*)[WD](\d*)([+-]\d+)?$/);
  if (!m) return null;
  const n = +(m[1] || 1), sides = +(m[2] || 6), mod = +(m[3] || 0);
  if (n < 1 || n > 100 || sides < 2) return null;
  const r = []; for (let i = 0; i < n; i++) r.push(1 + Math.floor(Math.random() * sides));
  return {r, total: r.reduce((a, b) => a + b, 0) + mod, mod};
}
addTab("wuerfel", "Würfel", sec => {
  sec.innerHTML = `
  <div class="grid">
    <div class="sheet">
      <h2>Würfelbecher</h2>
      <p class="note">Traveller kommt mit sechsseitigen Würfeln aus. 2W ist der Standardwurf, W66 (zwei Würfel nacheinander gelesen) wird für viele Tafeln gebraucht.</p>
      <div class="choices">
        <button class="btn" data-r="1W">1W</button><button class="btn" data-r="2W">2W</button><button class="btn" data-r="3W">3W</button><button class="btn" data-r="4W">4W</button><button class="btn" data-r="W66">W66</button>
      </div>
      <div class="big" id="dice-out" aria-live="polite">–</div>
      <div class="row">
        <label class="f">Eigener Ausdruck<input type="text" id="dice-expr" value="3W+2" style="width:120px"></label>
        <button class="btn ghost" id="dice-go">Würfeln</button>
      </div>
      <h3>Verlauf</h3>
      <div class="hist" id="dice-hist"></div>
    </div>
    <div class="sheet">
      <h2>Zielwurf</h2>
      <p class="note">Fast jeder Wurf im Spiel lautet „x+ auf 2W“, abgewandelt durch Wurfmodifikatoren (WM).</p>
      <div class="row">
        <label class="f">Ziel (x+)<input type="number" id="tg-t" value="8" min="2" max="20"></label>
        <label class="f">WM<input type="number" id="tg-dm" value="0" min="-12" max="12"></label>
        <button class="btn" id="tg-go">Wurf</button>
      </div>
      <p id="tg-p" class="note"></p>
      <div class="big" id="tg-out">–</div>
      <h3>Wahrscheinlichkeiten auf 2W</h3>
      <div class="scroll"><table class="t" id="tg-tab"></table></div>
    </div>
    <div class="sheet">
      <h2>Hexadezimal</h2>
      <p class="note">Charakteristika und Weltprofile werden in Hexadezimalziffern notiert (A = 10 … F = 15; darüber G, H, J … ohne I und O).</p>
      <div class="row"><label class="f">Zahl<input type="number" id="hx-n" value="12" min="0" max="33"></label><div class="big" id="hx-o">C</div></div>
      <div class="row"><label class="f">Ziffer<input type="text" id="hx-c" value="B" maxlength="1" style="width:60px;text-transform:uppercase"></label><div class="big" id="hx-o2">11</div></div>
    </div>
  </div>`;
  const out = $("#dice-out", sec);
  $$("[data-r]", sec).forEach(b => b.onclick = () => {
    const k = b.dataset.r;
    if (k === "W66") { const a = d6(), c = d6(); out.textContent = "" + a + c; diceLog(`W66 → ${a}${c}`); return; }
    const r = rollExpr(k); out.textContent = r.total; diceLog(`${k} → ${r.total}  [${r.r.join(" ")}]`);
  });
  $("#dice-go", sec).onclick = () => {
    const e = $("#dice-expr", sec).value, r = rollExpr(e);
    if (!r) { out.textContent = "?"; diceLog(`„${esc(e)}“ verstehe ich nicht – Beispiel: 2W+3`); return; }
    out.textContent = r.total; diceLog(`${esc(e)} → ${r.total}  [${r.r.join(" ")}${r.mod ? " " + sgn(r.mod) : ""}]`);
  };
  const upd = () => { const t = +$("#tg-t", sec).value, dm = +$("#tg-dm", sec).value; $("#tg-p", sec).textContent = `Erfolgschance: ${pct(p2d(t, dm))}`; };
  $("#tg-t", sec).oninput = upd; $("#tg-dm", sec).oninput = upd; upd();
  $("#tg-go", sec).onclick = () => {
    const t = +$("#tg-t", sec).value, dm = +$("#tg-dm", sec).value, r = nd(2), tot = r + dm, ok = tot >= t;
    $("#tg-out", sec).innerHTML = `${tot} <span class="${ok ? "ok" : "bad"}" style="font-size:20px">${ok ? "Erfolg" : "Fehlschlag"}</span>`;
    diceLog(`${t}+ mit WM ${sgn(dm)} → ${r}${dm ? " " + sgn(dm) + " = " + tot : ""} ${ok ? "✓" : "✗"}`);
  };
  let tb = "<tr><th>Ziel</th>" + [-2, -1, 0, 1, 2, 3].map(d => `<th class="n">WM ${sgn(d)}</th>`).join("") + "</tr>";
  for (let t = 2; t <= 12; t++) tb += `<tr><td>${t}+</td>` + [-2, -1, 0, 1, 2, 3].map(d => `<td class="n">${pct(p2d(t, d))}</td>`).join("") + "</tr>";
  $("#tg-tab", sec).innerHTML = tb;
  $("#hx-n", sec).oninput = e => $("#hx-o", sec).textContent = hx(+e.target.value);
  $("#hx-c", sec).oninput = e => { const v = unhx(e.target.value); $("#hx-o2", sec).textContent = v < 0 ? "?" : v; };
});

/* ================= Charaktere ================= */
const STN = ["Stärke","Geschicklichkeit","Ausdauer","Intelligenz","Bildung","Sozialstatus"];
const STK = ["Str","Ges","Aus","Int","Bil","Soz"];
const st = (i, v) => ({st: i, v});
const BLADES = ["Dolch","Kampfklinge","Degen","Schwert","Entermesser","Breitschwert","Bajonett","Speer","Hellebarde","Pike","Knüppel"];
const GUNS = ["Körperpistole","Automatikpistole","Revolver","Karabiner","Gewehr","Automatikgewehr","Schrotflinte","Maschinenpistole","Laserkarabiner","Lasergewehr"];
const VEHICLES = ["Gleiter","Propellerflugzeug","Jetflugzeug","Helikopter","Kettenfahrzeug","Radfahrzeug","Boot","Luftkissenboot","U-Boot","Schiff"];
const CASCADE = {"Klingenwaffen": BLADES, "Schußwaffen": GUNS, "Fahrzeug": VEHICLES};
const NOBLE = {11: "Ritter / Dame", 12: "Baron / Baronin", 13: "Markgraf / Markgräfin", 14: "Graf / Gräfin", 15: "Fürst / Fürstin"};
// Reihenfolge der Tabellen: persönliche Weiterbildung, Dienstfertigkeiten, höhere Bildung, höhere Bildung (Bil 8+)
const CAREERS = [
 {id:"navy", n:"Raumflotte", enl:8, enlDM:[[3,8,1],[4,9,2]], draft:1, surv:5, survDM:[3,7], com:10, comDM:[5,9], pro:8, proDM:[4,8], re:6,
  ranks:["Kadett","Leutnant","Korvettenkapitän","Fregattenkapitän","Kapitän","Admiral"],
  mat:["Unterdeckpassage",st(3,1),st(4,2),"Klinge","THD",  "Oberdeckpassage",st(5,2)],
  cash:[1000,5000,5000,10000,20000,50000,50000],
  tabs:[[st(0,1),st(1,1),st(2,1),st(3,1),st(4,1),st(5,1)],
        ["Raumboot","Raumanzug","Vorgeschobener Beobachter","Bordschütze","Klingenwaffen","Schußwaffen"],
        ["Raumanzug","Mechanik","Elektronik","Ingenieur","Bordschütze","Vielseitigkeit"],
        ["Medizin","Navigation","Ingenieur","Computer","Pilot","Verwaltung"]]},
 {id:"marines", n:"Raumgarde", enl:9, enlDM:[[3,8,1],[0,8,2]], draft:2, surv:6, survDM:[2,8], com:9, comDM:[4,7], pro:9, proDM:[5,8], re:6,
  ranks:["Leutnant","Hauptmann","Kommandant","Oberstleutnant","Oberst","Brigadegeneral"],
  mat:["Unterdeckpassage",st(3,2),st(4,1),"Klinge","THD","Oberdeckpassage",st(5,2)],
  cash:[2000,5000,5000,10000,20000,30000,40000],
  tabs:[[st(0,1),st(1,1),st(2,1),"Glücksspiel","Handgemenge","Klingenwaffen"],
        ["AGF","Raumanzug","Klingenwaffen","Schußwaffen","Klingenwaffen","Schußwaffen"],
        ["Fahrzeug","Mechanik","Elektronik","Taktik","Klingenwaffen","Schußwaffen"],
        ["Medizin","Taktik","Taktik","Computer","Führung","Verwaltung"]]},
 {id:"army", n:"Heer", enl:5, enlDM:[[1,6,1],[2,5,2]], draft:3, surv:5, survDM:[4,6], com:5, comDM:[2,7], pro:6, proDM:[4,7], re:7,
  ranks:["Leutnant","Hauptmann","Major","Oberstleutnant","Oberst","General"],
  mat:["Unterdeckpassage",st(3,1),st(4,2),"Schußwaffe","Oberdeckpassage","Mitteldeckpassage",st(5,1)],
  cash:[2000,5000,10000,10000,10000,20000,30000],
  tabs:[[st(0,1),st(1,1),st(2,1),"Glücksspiel",st(4,1),"Handgemenge"],
        ["AGF","Gleiter","Schußwaffen","Vorgeschobener Beobachter","Klingenwaffen","Schußwaffen"],
        ["Fahrzeug","Mechanik","Elektronik","Taktik","Klingenwaffen","Schußwaffen"],
        ["Medizin","Taktik","Taktik","Computer","Führung","Verwaltung"]]},
 {id:"scouts", n:"Scoutdienst", enl:7, enlDM:[[3,6,1],[0,8,2]], draft:4, surv:7, survDM:[2,9], com:0, pro:0, re:3,
  ranks:[],
  mat:["Unterdeckpassage",st(3,2),st(4,2),"Klinge","Schußwaffe","Scoutschiff",null],
  cash:[20000,20000,30000,30000,50000,50000,50000],
  tabs:[[st(0,1),st(1,1),st(2,1),st(3,1),st(4,1),"Schußwaffen"],
        ["Gleiter","Raumanzug","Mechanik","Navigation","Elektronik","Vielseitigkeit"],
        ["Fahrzeug","Mechanik","Elektronik","Vielseitigkeit","Bordschütze","Medizin"],
        ["Medizin","Navigation","Ingenieur","Computer","Pilot","Vielseitigkeit"]]},
 {id:"merchants", n:"Handelsflotte", enl:7, enlDM:[[0,7,1],[3,6,2]], draft:5, surv:5, survDM:[3,7], com:4, comDM:[3,6], pro:10, proDM:[3,9], re:4,
  ranks:["4. Offizier","3. Offizier","2. Offizier","1. Offizier","Kapitän"],
  mat:["Unterdeckpassage",st(3,1),st(4,1),"Schußwaffe","Klinge","Unterdeckpassage","Freihändler"],
  cash:[1000,5000,10000,20000,20000,40000,40000],
  tabs:[[st(0,1),st(1,1),st(2,1),st(0,1),"Klingenwaffen","Bestechung"],
        ["Fahrzeug","Raumanzug","Vielseitigkeit","Steward","Elektronik","Schußwaffen"],

  t.push(skillStr(c));

function designCalc(d) {
  const T = d.t, J = potOf(T, d.j), M = potOf(T, d.m), P = potOf(T, d.p);
  const lines = [], warn = [];
  const std = d.std && STDHULL[T];
  const hullCost = std ? STDHULL[T][0] : T * 0.1;
  lines.push(["Rumpf " + T + " t" + (std ? " (Standardrumpf)" : " (Sonderanfertigung)"), 0, hullCost]);
  const ji = DL.indexOf(d.j), mi = DL.indexOf(d.m), pi = DL.indexOf(d.p);
  if (d.j !== "-") lines.push([`Sprungtriebwerk ${d.j} → Sprung-${J}`, 10 + 5 * ji, 10 * (ji + 1)]);
  if (d.m !== "-") lines.push([`Schubtriebwerk ${d.m} → ${M} g`, 1 + 2 * mi, 4 * (mi + 1)]);
  if (d.p !== "-") lines.push([`Konverter ${d.p} → ${P}`, 4 + 3 * pi, 8 * (pi + 1)]);
  if (d.j !== "-" && !J) warn.push(`Sprungtriebwerk ${d.j} passt nicht zu ${T} t.`);
  if (d.m !== "-" && !M) warn.push(`Schubtriebwerk ${d.m} passt nicht zu ${T} t.`);
  if (d.p !== "-" && !P) warn.push(`Konverter ${d.p} passt nicht zu ${T} t.`);
  if (P < J || P < M) warn.push("Der Konverter muss mindestens die Sprung- und Schubnummer erreichen.");
  const fuelMin = 0.1 * T * J + 10 * P, fuel = d.fuel == null ? fuelMin : +d.fuel;
  if (fuel < fuelMin) warn.push(`${fuel} t Treibstoff reichen nicht für Konverterbetrieb und einen vollen Sprung-${J} (dafür wären ${fuelMin.toLocaleString("de-DE")} t nötig).`);
  lines.push([`Treibstofftanks (Minimum ${fuelMin.toLocaleString("de-DE")} t: Sprung ${(0.1 * T * J).toLocaleString("de-DE")} t + Konverter ${10 * P} t)`, fuel, 0]);
  const br = Math.max(20, T * 0.02); lines.push(["Brücke", br, 0.5 * T / 100]);
  const cp = COMPUTERS[d.comp]; lines.push([`Computer Modell/${d.comp} (TG ${cp[3]})`, cp[1], cp[0]]);
  if (cp[2] < J) warn.push(`Modell/${d.comp} kann höchstens Sprung-${cp[2]} steuern.`);
  if (d.sr) lines.push([`${d.sr} Kabinen`, d.sr * 4, d.sr * 0.5]);
  if (d.lb) lines.push([`${d.lb} Kälteschlafkammern`, d.lb * 0.5, d.lb * 0.05]);
  if (d.elb) lines.push([`${d.elb} Notschlafkammern`, d.elb, d.elb * 0.1]);
  const maxHp = Math.floor(T / 100);
  if (d.hp > maxHp) warn.push(`Höchstens ${maxHp} Geschützbasen bei ${T} t.`);
  if (d.hp) lines.push([`${d.hp} Geschützbasen mit Geschützkontrolle`, d.hp, d.hp * 0.1]);
  (d.tur || []).forEach((tu, i) => {
    const [kind, weps] = tu; if (!kind) return;
    const wc = weps.reduce((s, w) => s + (SWEAP[w] || 0), 0);
    if (weps.length > kind) warn.push(`Turm ${i + 1}: ${TURRET[kind][0]} trägt höchstens ${kind} Waffe(n).`);
    lines.push([`Turm ${i + 1}: ${TURRET[kind][0]}${weps.length ? " – " + weps.join(", ") : " (unbewaffnet)"}`, 0, TURRET[kind][1] + wc]);
  });
  if ((d.tur || []).length > d.hp) warn.push("Mehr Türme als Geschützbasen.");
  (d.craft || []).forEach(c => lines.push([c, CRAFT[c][0], CRAFT[c][1]]));
  if (d.spec) lines.push(["Sonderräume (Labor, Käfige …)", +d.spec, 0]);
  if (d.stream) lines.push(["Stromlinienform", 0, T / 100]);
  const used = lines.reduce((s, l) => s + l[1], 0), cargo = T - used;
  if (cargo < 0) warn.push(`Der Rumpf ist um ${(-cargo).toLocaleString("de-DE")} t überladen.`);
  const drives = lines.filter(l => /^(Sprung|Schub|Konverter)/.test(l[0])).reduce((s, l) => s + l[1], 0);
  const hint = []; if (std && drives > {100:15,200:15,400:50,600:85,800:165,1000:165}[T]) hint.push(`Die Antriebe (${drives} t) sind größer als der Maschinenraum des Standardrumpfs; das Regelbuch baut solche Schiffe trotzdem.`);
  const base = lines.reduce((s, l) => s + l[2], 0);
  const final = d.stdDesign ? base * 0.9 : base * 1.01;
  const build = std ? STDHULL[T][1] : POTBUILD[potRow(T)];
  return {J, M, P, lines, warn, hint, cargo, fuelMin, base, final, build, drives, fuel};
}

  }

const AARM = [null,null,"kein","kein","Leder","kein","kein","kein","kein","kein","Leder","kein",null,"Maschen+1","Tuch+1","Maschen","Tuch","Gefecht+4","Reflektor","Schmelz","Kampfanzug"];
function sixRoll(dm, tab) { // Ergebnis 1 oder 13 (+6) heißt neu würfeln mit +6
  let r = clamp(nd(2) + dm, 1, 20);
  if (tab[r] === null) { r = clamp(nd(2) + dm + 6, 1, 20); if (tab[r] === null) r = clamp(nd(2) + dm + 6, 1, 20); if (tab[r] === null) r = r === 1 ? 2 : 14; }

const rollDice = s => { const m = String(s).match(/(\d+)W/); return m ? nd(+m[1]) : 0; };
function genAnimal(cat, terr, w) {
  const tdm = TERRAIN.find(t => t[0] === terr);

  const at = ATTR[clamp(nd(2) + adm, 2, 12)][ATTRCOL(terr)];

  const si = sixRoll(sdm, SIZET), sz = SIZET[si];

  let dmg = nd(base), m = sz[3];
  if (m.startsWith("−")) dmg -= rollDice(m); else if (m.startsWith("+")) dmg += rollDice(m); else if (m.startsWith("×")) dmg *= +m.slice(1);
  dmg = Math.max(1, dmg);

}

    ${tab("Techgrad", list(TL))}
    ${tab("Handelsklassifikationen", `<tr><td>Ag</td><td>Agrarwelt: Atm 4–9, Hyd 4–8, Bev 5–7</td></tr><tr><td>NA</td><td>Nichtagrarisch: Atm 0–3, Hyd 0–3, Bev 6+</td></tr><tr><td>In</td><td>Industriewelt: Atm 0, 1, 2, 4, 7 oder 9, Bev 9+</td></tr><tr><td>NI</td><td>Nichtindustriell: Bev 0–6</td></tr><tr><td>Re</td><td>Reich: Atm 6 oder 8, Bev 6–8, Reg 4–9</td></tr><tr><td>Ar</td><td>Arm: Atm 2–5, Hyd 0–3</td></tr><tr><td>Wa</td><td>Wasserwelt: Hyd A</td></tr><tr><td>Wü</td><td>Wüstenwelt: Hyd 0, Atm 2+</td></tr><tr><td>Va</td><td>Vakuumwelt: Atm 0</td></tr><tr><td>As</td><td>Asteroidengürtel: Größe 0</td></tr><tr><td>Ei</td><td>Eiskappen: Atm 0–1, Hyd 1+</td></tr>`)}
    ${tab("Adel", Object.entries(NOBLE).map(([k, v]) => `<tr><td class="code">${hx(+k)}</td><td>${v}</td></tr>`).join("") + `<tr><td></td><td class="note">Ritter werden mit „Sir“ angeredet, ab Baron ist das Prädikat „von“, „haut“ oder „hault“ üblich.</td></tr>`)}
    ${tab("Reaktionen", Object.entries(REACT).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join(""))}
    ${tab("Drogen", `<tr><th>Droge</th><th class="n">Cr</th><th class="n">TG</th><th>Wirkung</th></tr>` + DRUGS.map(d => `<tr><td>${d[0]}</td><td class="n">${d[1]}</td><td class="n">${d[2]}</td><td>${d[3]}</td></tr>`).join(""))}
    ${tab("Mannschaftsgehälter", `<tr><td>Pilot</td><td>Pilot-1</td><td class="n">${cr(6000)}</td></tr><tr><td>Navigator</td><td>Navigation-1</td><td class="n">${cr(5000)}</td></tr><tr><td>Ingenieur</td><td>Ingenieur-1</td><td class="n">${cr(4000)}</td></tr><tr><td>Steward</td><td>Steward-0</td><td class="n">${cr(3000)}</td></tr><tr><td>Sanitäter</td><td>Medizin-1</td><td class="n">${cr(2000)}</td></tr><tr><td>Kanonier</td><td>Bordschütze-1</td><td class="n">${cr(1000)}</td></tr><tr><td colspan="3" class="note">Pro Fertigkeitsstufe über 1: 10 % mehr Gehalt.</td></tr>`)}
    ${tab("Passagen und Fracht", `<tr><td>Oberdeck</td><td class="n">${cr(10000)}</td></tr><tr><td>Mitteldeck</td><td class="n">${cr(8000)}</td></tr><tr><td>Unterdeck</td><td class="n">${cr(1000)}</td></tr><tr><td>Fracht pro Tonne</td><td class="n">${cr(1000)}</td></tr><tr><td>Post</td><td class="n">${cr(25000)}</td></tr><tr><td>Treibstoff raffiniert / unraffiniert</td><td class="n">500 / 100 pro t</td></tr>`)}
  </div>`;
});

/* ================= Start ================= */
(function init() {
  const nav = $("#nav"), main = $("#main");
  const ORDER = ["charaktere","kampf","welten","subsektor","tiere","begegnungen","reisen","handel","werft","wuerfel","nachschlagen"];
  TABS.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
  TABS.forEach(t => {
    const b = document.createElement("button"); b.textContent = t.title; b.dataset.tab = t.id; b.setAttribute("role", "tab");
    b.onclick = () => showTab(t.id); nav.appendChild(b);
    const s = document.createElement("section"); s.className = "tab"; s.id = "tab-" + t.id; s.setAttribute("role", "tabpanel"); main.appendChild(s);
    try { t.build(s); } catch (e) { s.innerHTML = `<div class="sheet"><p class="bad">Dieser Bereich konnte nicht geladen werden: ${esc(e.message)}</p></div>`; console.error(e); }
  });
  const last = store.get("tab", "charaktere");
  showTab(TABS.some(t => t.id === last) ? last : "charaktere");
})();
</script>
</body>
