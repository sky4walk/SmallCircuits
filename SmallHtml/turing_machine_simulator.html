<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turing Machine Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080d08;
    --bg2:       #0d140d;
    --bg3:       #111a11;
    --green:     #00ff41;
    --green-dim: #00cc33;
    --green-lo:  #006618;
    --amber:     #ff8c00;
    --amber-dim: #c46800;
    --red:       #ff3030;
    --white:     #d0e8d0;
    --border:    #1a2e1a;
    --font:      'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* CRT scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* Outer glow */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
    z-index: 999;
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg2);
  }

  .header-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--green-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .header-title span {
    color: var(--green);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green-lo);
    flex-shrink: 0;
  }
  .status-dot.idle    { background: var(--green-lo); }
  .status-dot.running { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1s infinite; }
  .status-dot.halted  { background: var(--red);   box-shadow: 0 0 8px var(--red); }
  .status-dot.stopped { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .status-text {
    font-size: 10px;
    color: var(--green-dim);
    letter-spacing: 0.1em;
  }

  .status-text.running { color: var(--green); }
  .status-text.halted  { color: var(--red); }
  .status-text.stopped { color: var(--amber); }

  .main {
    display: grid;
    grid-template-rows: auto auto auto 1fr;
    height: calc(100vh - 45px);
    gap: 0;
  }

  /* ── TAPE ── */
  .tape-section {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }

  .section-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--green-lo);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .tape-viewport {
    overflow: hidden;
    position: relative;
    height: 72px;
  }

  .tape-track {
    display: flex;
    align-items: center;
    gap: 2px;
    transition: transform 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: absolute;
    left: 0; top: 0;
  }

  .tape-cell {
    width: 48px;
    height: 60px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--bg);
    transition: background 0.15s, border-color 0.15s;
    position: relative;
    cursor: pointer;
    user-select: none;
  }

  .tape-cell:not(.head):hover {
    background: var(--bg3);
    border-color: var(--green-lo);
  }

  .tape-cell:not(.head):hover .cell-symbol {
    color: var(--green);
  }

  .tape-viewport { cursor: grab; }
  .tape-viewport.dragging { cursor: grabbing; }

  .tape-cell.head {
    background: var(--bg3);
    border-color: var(--amber);
    box-shadow: 0 0 12px rgba(255,140,0,0.25), inset 0 0 8px rgba(255,140,0,0.08);
  }

  .tape-cell.head .cell-symbol {
    color: var(--amber);
    font-weight: 700;
    font-size: 20px;
  }

  .cell-symbol {
    font-size: 18px;
    font-weight: 600;
    color: var(--green);
    line-height: 1;
  }

  .cell-idx {
    font-size: 8px;
    color: var(--green-lo);
    letter-spacing: 0.05em;
  }

  /* Head arrow */
  .tape-cell.head::after {
    content: '▼';
    position: absolute;
    top: -18px;
    font-size: 11px;
    color: var(--amber);
    animation: blink 0.8s infinite;
  }

  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ── CONTROLS + STATE ── */
  .controls-section {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    background: var(--bg);
    border: 1px solid var(--green-lo);
    color: var(--green-dim);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.1s;
  }

  .btn:hover {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 6px rgba(0,255,65,0.2);
  }

  .btn:active { transform: scale(0.97); }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn.primary {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 6px rgba(0,255,65,0.15);
  }

  .btn.danger {
    border-color: var(--red);
    color: var(--red);
  }

  .btn.danger:hover {
    box-shadow: 0 0 6px rgba(255,48,48,0.25);
  }

  .btn.amber {
    border-color: var(--amber-dim);
    color: var(--amber-dim);
  }

  .btn.amber:hover {
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: 0 0 6px rgba(255,140,0,0.2);
  }

  .btn.sm { padding: 3px 8px; font-size: 9px; letter-spacing: 0.08em; }

  .btn.on {
    border-color: var(--amber);
    color: var(--bg);
    background: var(--amber-dim);
  }

  .divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  .state-info {
    display: flex;
    gap: 16px;
    margin-left: auto;
    flex-wrap: wrap;
  }

  .info-chip {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 11px;
  }

  .info-chip .lbl {
    color: var(--green-lo);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .info-chip .val {
    color: var(--amber);
    font-weight: 700;
    min-width: 28px;
  }

  .speed-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--green-lo);
  }

  .speed-group input[type=range] {
    -webkit-appearance: none;
    width: 80px;
    height: 2px;
    background: var(--border);
    outline: none;
  }
  .speed-group input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
    cursor: pointer;
  }

  /* File input */
  .file-label {
    background: var(--bg);
    border: 1px dashed var(--green-lo);
    color: var(--green-lo);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .file-label:hover {
    border-color: var(--green-dim);
    color: var(--green-dim);
  }
  #file-input { display: none; }

  .sel {
    background: var(--bg);
    border: 1px solid var(--green-lo);
    color: var(--green-dim);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 6px 8px;
    cursor: pointer;
    outline: none;
    transition: all 0.1s;
  }
  .sel:hover, .sel:focus {
    border-color: var(--green);
    color: var(--green);
  }
  .sel option { background: var(--bg2); color: var(--green-dim); }

  /* ── BOTTOM PANELS ── */
  .bottom {
    display: grid;
    grid-template-columns: 1fr 470px;
    min-height: 0;
    overflow: hidden;
  }

  /* Debug Log */
  .debug-panel {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg2);
    flex-shrink: 0;
  }

  .debug-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    font-size: 11px;
    line-height: 1.7;
    background: var(--bg);
  }

  .debug-log::-webkit-scrollbar { width: 4px; }
  .debug-log::-webkit-scrollbar-track { background: var(--bg); }
  .debug-log::-webkit-scrollbar-thumb { background: var(--green-lo); }

  .log-entry {
    display: flex;
    gap: 8px;
    padding: 1px 4px;
    border-left: 2px solid transparent;
  }

  .log-entry:hover { background: var(--bg2); }

  .log-entry.step {
    border-left-color: var(--green-lo);
  }

  .log-entry.halt {
    border-left-color: var(--red);
    color: var(--red);
  }

  .log-entry.info {
    border-left-color: var(--amber-dim);
    color: var(--amber-dim);
  }

  .log-entry.error {
    border-left-color: var(--red);
    color: var(--red);
    font-weight: 600;
  }

  .log-step-num {
    color: var(--green-lo);
    min-width: 42px;
    font-size: 10px;
    text-align: right;
  }

  .log-arrow { color: var(--green-lo); }

  .log-state { color: var(--amber); font-weight: 600; }
  .log-sym   { color: var(--green); font-weight: 600; }
  .log-dir   { color: var(--green-dim); }
  .log-pos   { color: var(--green-lo); font-size: 10px; }

  /* Transitions panel */
  .trans-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
  }

  /* Tabs */
  .tab-group { display: flex; margin-left: auto; }

  .tab {
    background: transparent;
    border: 1px solid var(--border);
    border-right: none;
    color: var(--green-lo);
    font-family: var(--font);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .tab:last-child { border-right: 1px solid var(--border); }
  .tab:hover { color: var(--green-dim); }
  .tab.active {
    color: var(--green);
    border-color: var(--green-lo);
    background: var(--bg3);
  }

  .trans-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .trans-view[hidden] { display: none; }

  .trans-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-wrap: wrap;
  }

  .stat-line {
    font-size: 9px;
    color: var(--green-lo);
    letter-spacing: 0.06em;
    margin-left: auto;
    text-align: right;
  }
  .stat-line b { color: var(--green-dim); font-weight: 600; }
  .stat-line .bad { color: var(--red); font-weight: 600; }

  .quick-add {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .quick-add input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font);
    font-size: 11px;
    padding: 4px 6px;
    outline: none;
  }
  .quick-add input:focus { border-color: var(--green-lo); }
  .quick-add input::placeholder { color: var(--green-lo); }

  .trans-table {
    flex: 1;
    overflow-y: auto;
    padding: 4px;
  }

  .trans-table::-webkit-scrollbar { width: 4px; }
  .trans-table::-webkit-scrollbar-thumb { background: var(--green-lo); }

  .trans-row, .trans-header {
    display: grid;
    grid-template-columns: 12px 60px 26px 60px 26px 26px;
    gap: 6px;
    align-items: center;
  }

  .trans-row {
    padding: 2px 6px;
    font-size: 10px;
    border-left: 2px solid transparent;
    cursor: pointer;
  }

  .trans-row:hover { background: var(--bg2); }

  .trans-row.active {
    background: rgba(255,140,0,0.08);
    border-left-color: var(--amber);
  }

  .trans-row.breakpoint {
    background: rgba(255,48,48,0.06);
    border-left-color: var(--red);
  }

  .trans-row.breakpoint.active {
    background: rgba(255,48,48,0.12);
  }

  .trans-row.err { background: rgba(255,48,48,0.10); }
  .trans-row.err .t-state,
  .trans-row.err .t-sym,
  .trans-row.err .t-nstate,
  .trans-row.err .t-nsym,
  .trans-row.err .t-dir { color: var(--red); }

  .t-bp {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .trans-row.breakpoint .t-bp {
    background: var(--red);
    box-shadow: 0 0 4px var(--red);
  }

  .trans-row:not(.breakpoint) .t-bp {
    border: 1px solid var(--green-lo);
    opacity: 0;
  }

  .trans-row:hover .t-bp { opacity: 1; }

  .trans-row .t-state { color: var(--amber-dim); }
  .trans-row .t-sym   { color: var(--green-dim); }
  .trans-row .t-nstate { color: var(--amber); font-weight: 600; }
  .trans-row .t-nsym  { color: var(--green); font-weight: 600; }
  .trans-row .t-dir   { color: var(--green-dim); }
  .trans-row.active .t-state,
  .trans-row.active .t-sym   { color: var(--amber); }

  .trans-header {
    padding: 4px 6px;
    font-size: 9px;
    color: var(--green-lo);
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    position: sticky;
    top: -4px;
    background: var(--bg);
    z-index: 2;
  }

  /* ── Edit mode rows ── */
  .trans-row.edit, .trans-header.edit {
    grid-template-columns: 12px 1fr 30px 1fr 30px 34px 16px;
    gap: 4px;
  }

  .trans-row.edit { cursor: default; padding: 1px 6px; }

  .trans-row.edit input {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font);
    font-size: 10px;
    padding: 3px 2px;
    width: 100%;
    min-width: 0;
    outline: none;
    text-align: center;
  }
  .trans-row.edit input:focus {
    border-color: var(--green);
    background: var(--bg3);
  }
  .trans-row.edit input.f-state,
  .trans-row.edit input.f-nstate { color: var(--amber); }
  .trans-row.edit.err input { border-color: var(--red); }
  .trans-row.edit .t-bp { opacity: 1; cursor: pointer; }
  .trans-row.edit:not(.breakpoint) .t-bp { border: 1px solid var(--green-lo); }

  .t-del {
    color: var(--red);
    cursor: pointer;
    text-align: center;
    opacity: 0.45;
    font-size: 13px;
    line-height: 1;
    user-select: none;
  }
  .t-del:hover { opacity: 1; }

  /* ── Source view ── */
  #source-area {
    flex: 1;
    width: 100%;
    background: var(--bg);
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font);
    font-size: 11px;
    line-height: 1.55;
    padding: 8px;
    outline: none;
    resize: none;
    white-space: pre;
    overflow: auto;
    tab-size: 2;
  }
  #source-area:focus { background: var(--bg2); }

  .source-toolbar {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px 8px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  /* Tape init input */
  .tape-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .tape-input-row .lbl {
    font-size: 9px;
    color: var(--green-lo);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tape-input-row input[type=text] {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--green);
    font-family: var(--font);
    font-size: 12px;
    padding: 4px 8px;
    outline: none;
    max-width: 420px;
    min-width: 60px;
  }

  .tape-input-row input:focus {
    border-color: var(--green-lo);
  }

  /* empty tape msg */
  .empty-msg {
    color: var(--green-lo);
    font-size: 11px;
    padding: 10px 8px;
    letter-spacing: 0.05em;
    line-height: 1.7;
  }

  /* scrollbar global */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--green-lo); }

  :focus-visible { outline: 1px solid var(--green); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .site-footer {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--green-lo);
    padding: 8px 0 14px;
  }
  .site-footer a { color: var(--green-dim); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="status-dot" id="status-dot"></div>
  <div class="header-title">TURING MACHINE SIMULATOR <span>v1.2</span></div>
  <div class="status-text" id="status-text">IDLE</div>
</div>

<div class="main">

  <!-- Tape -->
  <div class="tape-section">
    <div class="section-label">Tape</div>
    <div class="tape-viewport" id="tape-viewport">
      <div class="tape-track" id="tape-track"></div>
    </div>
  </div>

  <!-- Tape init input -->
  <div class="tape-input-row">
    <span class="lbl">Tape:</span>
    <input type="text" id="tape-init-input" placeholder="Bandinhalt eingeben oder .tm Datei laden …" value="">
    <span class="lbl" style="margin-left:8px">Startzustand:</span>
    <input type="text" id="init-state-input" value="000" style="width:54px;flex:none">
    <span class="lbl">Kopf-Pos:</span>
    <input type="text" id="init-head-input" value="0" style="width:42px;flex:none">
    <button class="btn" id="btn-load-tape">Setzen</button>
  </div>

  <!-- Meta / save row -->
  <div class="tape-input-row">
    <span class="lbl">Kommentar:</span>
    <input type="text" id="comment-input" placeholder="Titel bzw. Beschreibung der Maschine" value="">
    <span class="lbl" style="margin-left:8px">Datei:</span>
    <input type="text" id="filename-input" value="machine.tm" style="width:150px;flex:none">
    <button class="btn primary" id="btn-save">💾 .tm speichern</button>
  </div>

  <!-- Controls -->
  <div class="controls-section">
    <label class="file-label" for="file-input">📂 .tm laden</label>
    <input type="file" id="file-input" accept=".tm,.txt">

    <select class="sel" id="example-select" title="Eingebautes Beispiel laden">
      <option value="increment">Binär-Inkrement</option>
      <option value="unary">Unäre Addition</option>
      <option value="beaver">Busy Beaver (3 Zustände)</option>
      <option value="minsky">Minsky UTM</option>
      <option value="flipjump">FlipJump: Hello World (Turbo!)</option>
    </select>

    <div class="divider"></div>

    <button class="btn primary" id="btn-run">▶ Run</button>
    <button class="btn primary" id="btn-turbo" title="So schnell wie möglich rechnen; Anzeige nur zwischendurch, Breakpoints und Step-Limit gelten weiter">⚡ Turbo</button>
    <button class="btn amber"   id="btn-step">⏭ Step</button>
    <button class="btn danger"  id="btn-stop" disabled>■ Stop</button>
    <button class="btn"         id="btn-reset">↺ Reset</button>

    <div class="divider"></div>

    <div class="speed-group">
      <span>Speed:</span>
      <input type="range" id="speed-slider" min="1" max="6" value="3">
      <span id="speed-label">200 ms</span>
    </div>

    <div class="divider"></div>

    <div class="speed-group">
      <span>Break after:</span>

// ─────────────────────────────────────────────
// TM Parser
// ─────────────────────────────────────────────
const TRANS_RX = /\(([^,()]*),([^,()]*),([^,()]*),([^,()]*),([^,()]*)\)/g;

function parseTM(text) {
  const list = [];
  const comments = [];
  let initialState = null;
  let initialHeadPos = 0;
  let initialTape = null;

  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;

    if (line.startsWith('#')) { comments.push(line.replace(/^#\s?/, '')); continue; }

    // A line that is exactly one bracketed group, no nested parens
    const single = line.match(/^\(([^()]*)\)$/);
    if (single) {
      const parts = single[1].split(',');
      // (startState,headPos)
      if (parts.length === 2 && initialState === null) {
        initialState = parts[0].trim();
        const h = parseInt(parts[1].trim(), 10);
        initialHeadPos = isNaN(h) ? 0 : h;
        continue;
      }
      // (tapeContent)
      if (parts.length === 1 && initialTape === null) {
        initialTape = single[1];
        continue;
      }
      // length 5 falls through to the transition scanner below
    }

    TRANS_RX.lastIndex = 0;
    let m;
    while ((m = TRANS_RX.exec(line)) !== null) {
      const [, s, sym, ns, nsym, d] = m.map(x => x.trim());
      list.push({ state: s, symbol: sym, newState: ns, newSymbol: nsym, dir: d.toUpperCase() });
    }
  }

  return {
    list, map: {}, comments,
    initialState,
    initialHeadPos,
    initialTape: initialTape === null ? '' : initialTape
  };
}

// ─────────────────────────────────────────────
// Serializer  (model → .tm text)
// ─────────────────────────────────────────────
function natCmp(a, b) {
  const na = parseInt(a, 10), nb = parseInt(b, 10);
  if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
  return a < b ? -1 : a > b ? 1 : 0;
}

function fmtTrans(t) {
  return `(${t.state},${t.symbol},${t.newState},${t.newSymbol},${t.dir})`;
}

function serializeTM() {
  const out = [];

  const comments = [];
  const head = $('comment-input').value.trim();
  if (head) comments.push(head);
  for (const c of tm.comments.slice(1)) if (c.trim()) comments.push(c.trim());
  for (const c of comments) out.push('# ' + c);
  if (comments.length) out.push('');

  const st = $('init-state-input').value.trim() || '0';
  const hp = ($('init-head-input').value.trim() || '0');
  out.push(`(${st},${hp})`, '');
  out.push(`(${$('tape-init-input').value})`, '');

  // Group transitions by source state, one line per state
  const groups = new Map();
  for (const t of tm.list) {
    if (!groups.has(t.state)) groups.set(t.state, []);
    groups.get(t.state).push(t);
  }
  for (const s of [...groups.keys()].sort(natCmp)) {
    out.push(groups.get(s).map(fmtTrans).join(' '));
  }

  return out.join('\n') + '\n';
}

function downloadTM() {
  const errs = tm.list.filter(t => t.err).length;
  let name = $('filename-input').value.trim() || 'machine.tm';
  if (!/\.tm$/i.test(name)) name += '.tm';
  $('filename-input').value = name;

  const blob = new Blob([serializeTM()], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  logEntry(`Gespeichert: ${name} — ${tm.list.length} Übergänge` +
           (errs ? ` (Achtung: ${errs} fehlerhafte Zeilen mitgeschrieben)` : ''),
           errs ? 'error' : 'info');
}

// ─────────────────────────────────────────────
// Validation + index
// ─────────────────────────────────────────────
function validateTrans(t) {
  if (!t.state)               return 'Zustand fehlt';
  if (t.symbol.length !== 1)  return 'Lesesymbol muss genau ein Zeichen sein';
  if (!t.newState)            return 'Folgezustand fehlt';
  if (t.newSymbol.length !== 1) return 'Schreibsymbol muss genau ein Zeichen sein';
  if (!DIRS.includes(t.dir))  return 'Richtung muss L, R oder N sein';
  return null;
}

function reindex() {
  tm.map = {};
  const seen = new Set();
  for (const t of tm.list) {
    t.key = t.state + ',' + t.symbol;
    t.err = validateTrans(t);
    if (!t.err && seen.has(t.key)) {
      t.err = 'Doppelter Eintrag für (' + t.key + ')';
      t.dup = true;
    } else {
      t.dup = false;
    }
    if (!t.err) { seen.add(t.key); tm.map[t.key] = t; }
  }
}

function stats() {
  const srcStates = new Set(), symbols = new Set();
  for (const t of tm.list) {
    if (t.state) srcStates.add(t.state);
    if (t.symbol.length === 1) symbols.add(t.symbol);
    if (t.newSymbol.length === 1) symbols.add(t.newSymbol);
  }
  const errors = tm.list.filter(t => t.err).length;
  const defined = Object.keys(tm.map).length;
  const gaps = Math.max(0, srcStates.size * symbols.size - defined);
  return { states: srcStates, symbols, errors, defined, gaps };
}

function updateStats() {
  const s = stats();
  $('trans-count').textContent = tm.list.length;
  $('stat-line').innerHTML =
    `<b>${s.states.size}</b> Zust. · <b>${s.symbols.size}</b> Sym. · ` +
    (s.errors ? `<span class="bad">${s.errors} Fehler</span> · ` : '') +
    `<b>${s.gaps}</b> Lücken`;
}

function listGaps() {
  const s = stats();
  const missing = [];
  for (const st of [...s.states].sort(natCmp))
    for (const sym of [...s.symbols].sort())
      if (!tm.map[st + ',' + sym]) missing.push(`(${st},${sym})`);

  if (!missing.length) { logEntry('Keine Lücken — die Übergangsfunktion ist total.', 'info'); return; }
  logEntry(`${missing.length} undefinierte Kombinationen (hier hält die Maschine):`, 'info');
  for (let i = 0; i < missing.length; i += 12)
    logEntry('  ' + missing.slice(i, i + 12).join(' '), 'info');
}

// ─────────────────────────────────────────────
// Tape helpers
// ─────────────────────────────────────────────
function speedMs() { return SPEEDS[parseInt($('speed-slider').value) - 1]; }

function tapeGet(pos) {
  const idx = pos + tapeOffset;
  if (idx < 0 || idx >= tape.length) return BLANK;
  return tape[idx];
}

function tapeSet(pos, sym) {
  let idx = pos + tapeOffset;
  if (idx < 0) {
    const ext = Array(-idx).fill(BLANK);
    tape = ext.concat(tape);
    tapeOffset += -idx;
    idx = 0;
  }
  while (idx >= tape.length) tape.push(BLANK);
  tape[idx] = sym;
}

function commitSnapshotFromFields() {
  initialSnapshot = {
    tapeStr: $('tape-init-input').value,
    state:   $('init-state-input').value.trim() || '000',
    headPos: parseInt($('init-head-input').value.trim(), 10) || 0
  };
}

function resetMachine() {
  const tapeStr = initialSnapshot.tapeStr;
  tape = [];
  tapeOffset = 0;
  for (let i = 0; i < tapeStr.length; i++) tapeSet(i, tapeStr[i]);
  headPos      = initialSnapshot.headPos;
  currentState = initialSnapshot.state;
  stepCount    = 0;
  halted       = false;
  activeTransKey   = null;
  tapeScrollOffset = 0;
  $('tape-init-input').value  = tapeStr;
  $('init-state-input').value = initialSnapshot.state;
  $('init-head-input').value  = String(initialSnapshot.headPos);
  renderTape();
  updateInfoBar();
  setStatus('idle');
  renderTransitions();
}

// ─────────────────────────────────────────────
// Step
// ─────────────────────────────────────────────
function stopRun(status, msg, type) {
  running = false;
  clearTimeout(runTimer);
  setStatus(status);
  if (msg) logEntry(msg, type || 'info');
  $('btn-run').disabled  = halted;
  $('btn-step').disabled = halted;
  $('btn-stop').disabled = true;
}

function step() {
  if (halted) return false;

  const sym = tapeGet(headPos);
  const key = currentState + ',' + sym;
  const trans = tm.map[key];

  if (!trans) {
    halted = true;
    activeTransKey = null;
    updateActiveRow();
    stopRun('halted', `Kein Übergang für (${currentState},${sym}) — HALT nach ${stepCount} Schritten.`, 'halt');
    return false;
  }

  const prevState = currentState;
  const prevSym = sym;

  tapeSet(headPos, trans.newSymbol);
  currentState = trans.newState;
  stepCount++;
  activeTransKey = key;

  const move = trans.dir === 'R' ? +1 : trans.dir === 'L' ? -1 : 0;
  headPos += move;
  tapeScrollOffset = 0; // re-center view on head after each step

  logStep(stepCount, prevState, prevSym, trans.newState, trans.newSymbol, trans.dir, headPos - move, headPos);

  renderTape();
  updateInfoBar();
  updateActiveRow();

  // ── Breakpoint check ──
  const newKey = currentState + ',' + tapeGet(headPos);
  if (breakpoints.has(newKey)) {
    stopRun('stopped', `Breakpoint erreicht: (${newKey}) nach ${stepCount} Schritten.`, 'info');
    return false;
  }

  // ── Step-limit check ──
  const limitVal = parseInt($('break-steps').value, 10);
  if (!isNaN(limitVal) && limitVal > 0 && stepCount >= limitVal) {
    stopRun('stopped', `Step-Limit ${limitVal} erreicht — angehalten.`, 'info');
    return false;
  }

  return true;
}

function logStep(n, state, sym, nstate, nsym, dir, oldPos, newPos) {
  const log = $('debug-log');
  const e = document.createElement('div');
  e.className = 'log-entry step';
  e.innerHTML =
    `<span class="log-step-num">${String(n).padStart(5)}</span>` +
    `<span class="log-state">${esc(state)}</span>` +
    `<span class="log-arrow"> + </span>` +
    `<span class="log-sym">${esc(sym)}</span>` +
    `<span class="log-arrow"> → </span>` +
    `<span class="log-state">${esc(nstate)}</span>` +
    `<span class="log-arrow"> / </span>` +
    `<span class="log-sym">${esc(nsym)}</span>` +
    `<span class="log-arrow"> / </span>` +
    `<span class="log-dir">${esc(dir)}</span>` +
    `<span class="log-pos">  pos:${newPos}</span>`;
  log.appendChild(e);
  log.scrollTop = log.scrollHeight;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

function logEntry(msg, type = 'info') {
  const log = $('debug-log');
  const e = document.createElement('div');
  e.className = `log-entry ${type}`;
  e.innerHTML = `<span class="log-step-num">SYS</span><span>${esc(msg)}</span>`;
  log.appendChild(e);
  log.scrollTop = log.scrollHeight;
}

// ─────────────────────────────────────────────
// Render tape
// ─────────────────────────────────────────────
const VISIBLE_CELLS = 19;
const CELL_W = 50; // px (cell width + gap)
let tapeScrollOffset = 0;

function renderTape() {
  const track = $('tape-track');
  track.innerHTML = '';

  const half = Math.floor(VISIBLE_CELLS / 2);
  const viewCenter = headPos - tapeScrollOffset;
  const start = viewCenter - half;
  const end   = viewCenter + half + 1;

  for (let i = start; i < end; i++) {
    const cell = document.createElement('div');
    cell.className = 'tape-cell' + (i === headPos ? ' head' : '');
    cell.innerHTML =
      `<span class="cell-symbol">${esc(tapeGet(i))}</span>` +
      `<span class="cell-idx">${i}</span>`;
    cell.addEventListener('click', () => {
      headPos = i;
      tapeScrollOffset = 0;
      $('init-head-input').value = String(i);
      renderTape();
      updateInfoBar();
      logEntry(`Kopf manuell auf Position ${i} gesetzt.`, 'info');
    });
    track.appendChild(cell);
  }
}

// ── Tape scroll: wheel ──
$('tape-viewport').addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 1 : -1;
  tapeScrollOffset = Math.max(-40, Math.min(40, tapeScrollOffset + delta));
  renderTape();
}, { passive: false });

// ── Tape scroll: drag ──
{
  const vp = $('tape-viewport');
  let dragStartX = null;
  let dragStartOffset = 0;
  let didDrag = false;

  vp.addEventListener('mousedown', e => {
    dragStartX = e.clientX;
    dragStartOffset = tapeScrollOffset;
    didDrag = false;
    vp.classList.add('dragging');
  });

  window.addEventListener('mousemove', e => {
    if (dragStartX === null) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 4) didDrag = true;
    const cellsMoved = Math.round(dx / CELL_W);
    tapeScrollOffset = Math.max(-40, Math.min(40, dragStartOffset - cellsMoved));
    renderTape();
  });

  window.addEventListener('mouseup', () => {
    dragStartX = null;
    vp.classList.remove('dragging');
  });

  vp.addEventListener('click', e => { if (didDrag) e.stopPropagation(); }, true);
}

// ─────────────────────────────────────────────
// Breakpoints
// ─────────────────────────────────────────────
const breakpoints = new Set();

function toggleBreakpoint(key) {
  if (breakpoints.has(key)) {
    breakpoints.delete(key);
    logEntry(`Breakpoint entfernt: (${key})`, 'info');
  } else {
    breakpoints.add(key);
    logEntry(`Breakpoint gesetzt: (${key})`, 'info');
  }
  renderTransitions();
}

// ─────────────────────────────────────────────
// Transition editing
// ─────────────────────────────────────────────
function modelChanged({ rerender = true } = {}) {
  reindex();
  updateStats();
  if (rerender) renderTransitions();
  if (!$('view-source').hidden) $('source-area').value = serializeTM();
}

function addTransitions(text) {
  let added = 0;
  TRANS_RX.lastIndex = 0;
  let m;
  while ((m = TRANS_RX.exec(text)) !== null) {
    const [, s, sym, ns, nsym, d] = m.map(x => x.trim());
    tm.list.push({ state: s, symbol: sym, newState: ns, newSymbol: nsym, dir: d.toUpperCase() });
    added++;
  }
  if (!added) {
    // bare form without parentheses: 00,0,01,a,L
    const p = text.trim().split(',').map(x => x.trim());
    if (p.length === 5) {
      tm.list.push({ state: p[0], symbol: p[1], newState: p[2], newSymbol: p[3], dir: p[4].toUpperCase() });
      added = 1;
    }
  }
  return added;
}

function deleteTransition(t) {
  const i = tm.list.indexOf(t);
  if (i >= 0) {
    tm.list.splice(i, 1);
    logEntry(`Übergang gelöscht: ${fmtTrans(t)}`, 'info');
    modelChanged();
  }
}

function setEditMode(on) {
  editMode = on;
  $('btn-edit-toggle').classList.toggle('on', on);
  $('btn-edit-toggle').textContent = on ? '✓ Fertig' : '✎ Bearbeiten';
  $('quick-add').hidden = !on;
  renderTransitions();
  if (on) $('quick-add-input').focus();
}

// ─────────────────────────────────────────────
// Render transitions table
// ─────────────────────────────────────────────
const ROW_LIMIT = 2000;   // mehr Zeilen werden nicht als Tabelle aufgebaut
const FIELDS = [
  { key: 'state',     cls: 'f-state',  max: 12, ph: 'q'   },
  { key: 'symbol',    cls: 'f-sym',    max: 1,  ph: 'a'   },
  { key: 'newState',  cls: 'f-nstate', max: 12, ph: 'q\'' },
  { key: 'newSymbol', cls: 'f-nsym',   max: 1,  ph: 'b'   },
  { key: 'dir',       cls: 'f-dir',    max: 1,  ph: 'R'   }
];

function renderTransitions() {
  const container = $('trans-table');
  reindex();
  updateStats();
  container.innerHTML = '';

  if (tm.list.length === 0) {
    container.innerHTML = editMode
      ? '<div class="empty-msg">Noch keine Übergänge.<br>Tippe oben z.&nbsp;B. <b>(0,1,0,0,R)</b> und drücke Enter.</div>'
      : '<div class="empty-msg">Keine Übergänge geladen.<br>Klicke „✎ Bearbeiten“, um welche zu schreiben.</div>';
    return;
  }

  const header = document.createElement('div');
  header.className = 'trans-header' + (editMode ? ' edit' : '');
  header.innerHTML = editMode
    ? '<span></span><span>State</span><span>Sym</span><span>→State</span><span>Sym</span><span>Dir</span><span></span>'
    : '<span></span><span>State</span><span>Sym</span><span>→ State</span><span>Sym</span><span>Dir</span>';
  container.appendChild(header);

  // Sehr große Maschinen (z. B. erzeugte Interpreter) nur teilweise als Zeilen
  // aufbauen, sonst wird die Seite träge. Vollständig bleibt alles im Quelltext-Tab.
  const shown = tm.list.length > ROW_LIMIT ? tm.list.slice(0, ROW_LIMIT) : tm.list;

  for (const t of shown) {
    const row = document.createElement('div');
    row.className = 'trans-row' +
      (editMode ? ' edit' : '') +
      (t.key === activeTransKey && !t.err ? ' active' : '') +
      (breakpoints.has(t.key) ? ' breakpoint' : '') +
      (t.err ? ' err' : '');
    row.title = t.err || 'Klick: Breakpoint setzen/entfernen';
    t._el = row;

    if (editMode) {
      const bp = document.createElement('span');
      bp.className = 't-bp';
      bp.title = 'Breakpoint umschalten';
      bp.addEventListener('click', ev => { ev.stopPropagation(); toggleBreakpoint(t.key); });
      row.appendChild(bp);

      for (const f of FIELDS) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = f.cls;
        inp.value = t[f.key];
        inp.maxLength = f.max;
        inp.placeholder = f.ph;
        inp.spellcheck = false;
        inp.addEventListener('input', () => {
          t[f.key] = f.key === 'dir' ? inp.value.trim().toUpperCase() : inp.value.trim();
          if (f.key === 'dir') inp.value = t.dir;
          // light-weight update: never re-render while the user is typing
          reindex();
          updateStats();
          row.classList.toggle('err', !!t.err);
          row.title = t.err || 'Klick auf den Punkt: Breakpoint';
        });
        inp.addEventListener('blur', () => {
          if (!$('view-source').hidden) $('source-area').value = serializeTM();
        });
        inp.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); }
        });
        row.appendChild(inp);
      }

      const del = document.createElement('span');
      del.className = 't-del';
      del.textContent = '×';
      del.title = 'Übergang löschen';
      del.addEventListener('click', () => deleteTransition(t));
      row.appendChild(del);

    } else {
      row.innerHTML =
        `<span class="t-bp"></span>` +
        `<span class="t-state">${esc(t.state)}</span>` +
        `<span class="t-sym">${esc(t.symbol)}</span>` +
        `<span class="t-nstate">${esc(t.newState)}</span>` +
        `<span class="t-nsym">${esc(t.newSymbol)}</span>` +
        `<span class="t-dir">${esc(t.dir)}</span>`;
      row.addEventListener('click', () => toggleBreakpoint(t.key));
    }

    container.appendChild(row);
  }

  if (shown.length < tm.list.length) {
    const more = document.createElement('div');
    more.className = 'empty-msg';
    more.textContent = `… und ${tm.list.length - shown.length} weitere Übergänge. ` +
                       'Angezeigt werden die ersten ' + ROW_LIMIT + ', vollständig im Tab „Quelltext“.';
    container.appendChild(more);
  }

  updateActiveRow();
}

// Cheap highlight update — used on every step instead of a full rebuild
function updateActiveRow() {
  let target = null;
  for (const t of tm.list) {
    if (!t._el || !t._el.isConnected) continue;
    const on = !t.err && t.key === activeTransKey;
    t._el.classList.toggle('active', on);
    if (on && !target) target = t._el;
  }
  if (target && !$('view-table').hidden) target.scrollIntoView({ block: 'nearest' });
}

// ─────────────────────────────────────────────
// Info bar / status
// ─────────────────────────────────────────────
function updateInfoBar() {
  $('info-state').textContent = currentState ?? '—';
  $('info-sym').textContent   = tapeGet(headPos);
  $('info-head').textContent  = headPos;
  $('info-steps').textContent = stepCount;
  $('info-tape-len').textContent = tape.filter(c => c !== BLANK).length;
}

const statusLabels = { idle: 'IDLE', running: 'RUNNING', halted: 'HALT', stopped: 'STOPPED' };

function setStatus(s) {
  $('status-dot').className  = 'status-dot ' + s;
  $('status-text').className = 'status-text ' + s;
  $('status-text').textContent = statusLabels[s] || s.toUpperCase();
}

// ─────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────
$('btn-run').addEventListener('click', () => {
  if (halted || running) return;
  const errs = tm.list.filter(t => t.err).length;
  if (errs) logEntry(`${errs} fehlerhafte Übergänge werden ignoriert.`, 'error');
  running = true;
  setStatus('running');
  $('btn-run').disabled = true;
  $('btn-stop').disabled = false;
  $('btn-step').disabled = true;

  (function tick() {
    if (!running || halted) return;
    if (step() && running) runTimer = setTimeout(tick, speedMs());
  })();
});

$('btn-step').addEventListener('click', () => {
  if (halted || running) return;
  step();
});

// ─────────────────────────────────────────────
// Turbo: dieselbe Semantik wie step(), aber in einer schnellen Schleife
// über Zahlen statt Zeichenketten. Angezeigt wird nur zwischendurch.
// Breakpoints und Step-Limit gelten wie bei Run.
// ─────────────────────────────────────────────
const TURBO_SLICE_MS = 60;
let turboTimer = null;

function compileTurbo() {
  const stIdx = new Map(), syIdx = new Map(), stNames = [], syNames = [];
  const st = s => { let i = stIdx.get(s); if (i === undefined) { i = stNames.length; stIdx.set(s, i); stNames.push(s); } return i; };
  const sy = s => { let i = syIdx.get(s); if (i === undefined) { i = syNames.length; syIdx.set(s, i); syNames.push(s); } return i; };
  sy(BLANK);                                    // Leerzeichen hat immer die Nummer 0
  const list = Object.values(tm.map);
  for (const t of list) { st(t.state); st(t.newState); sy(t.symbol); sy(t.newSymbol); }
  st(currentState);
  for (const c of tape) sy(c);
  for (const k of breakpoints) { st(k.slice(0, -2)); sy(k.slice(-1)); }

  const NS = syNames.length, size = stNames.length * NS;
  const next  = new Int32Array(size).fill(-1);
  const write = new Int32Array(size);
  const move  = new Int8Array(size);
  const bp    = new Uint8Array(size);
  for (const t of list) {
    const i = st(t.state) * NS + sy(t.symbol);
    next[i]  = st(t.newState);
    write[i] = sy(t.newSymbol);
    move[i]  = t.dir === 'R' ? 1 : t.dir === 'L' ? -1 : 0;
  }
  for (const k of breakpoints) bp[st(k.slice(0, -2)) * NS + sy(k.slice(-1))] = 1;
  return { stIdx, syIdx, stNames, syNames, NS, next, write, move, bp, hasBp: breakpoints.size > 0 };
}

function runTurbo() {
  if (halted || running) return;
  const errs = tm.list.filter(t => t.err).length;
  if (errs) logEntry(`${errs} fehlerhafte Übergänge werden ignoriert.`, 'error');
  running = true;
  setStatus('running');
  $('btn-run').disabled = true;
  $('btn-stop').disabled = false;
  $('btn-step').disabled = true;

  const C = compileTurbo();
  const { NS, next, write, move, bp, hasBp } = C;

  // Band als Zahlen, mit Rand auf beiden Seiten
  let pad = 4096;
  let arr = new Int32Array(tape.length + 2 * pad);
  for (let i = 0; i < tape.length; i++) arr[pad + i] = C.syIdx.get(tape[i]);
  let off = tapeOffset + pad;                   // Index von Bandposition 0
  let h = headPos + off;
  let q = C.stIdx.get(currentState);
  let sc = stepCount;
  let lastIdx = -1;

  const limitVal = parseInt($('break-steps').value, 10);
  const limit = (!isNaN(limitVal) && limitVal > 0) ? limitVal : Infinity;
  const t0 = performance.now(), steps0 = stepCount;
  let myTape = tape;                            // erkennt Reset/Laden während des Turbos

  function grow() {
    const more = Math.max(4096, arr.length);
    const n = new Int32Array(arr.length + 2 * more);
    n.set(arr, more);
    arr = n; off += more; h += more;
  }

  function writeBack() {
    tape = Array.from(arr, id => C.syNames[id]);
    myTape = tape;
    tapeOffset = off;
    headPos = h - off;
    currentState = C.stNames[q];
    stepCount = sc;
    if (lastIdx >= 0) activeTransKey = C.stNames[Math.floor(lastIdx / NS)] + ',' + C.syNames[lastIdx % NS];
    tapeScrollOffset = 0;
  }

  function summary() {
    const sec = (performance.now() - t0) / 1000;
    const n = stepCount - steps0;
    logEntry(`Turbo: ${n.toLocaleString('de-DE')} Schritte in ${sec.toFixed(2)} s` +
             (sec > 0 ? ` (${(n / sec / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 1 })} Mio./s)` : '') + '.', 'info');
  }

  function slice() {
    turboTimer = null;
    if (!running) {                             // Stop gedrückt – oder Reset/Laden, dann ist das Band neu
      if (tape === myTape && stepCount !== steps0) summary();
      return;
    }
    const tEnd = performance.now() + TURBO_SLICE_MS;
    let reason = null;
    outer:
    for (;;) {
      for (let n = 0; n < 200000; n++) {
        const i = q * NS + arr[h];
        const nq = next[i];
        if (nq < 0) { reason = 'halt'; break outer; }
        arr[h] = write[i];
        q = nq;
        h += move[i];
        sc++;
        lastIdx = i;
        if (h < 0 || h >= arr.length) grow();
        if (hasBp && bp[q * NS + arr[h]]) { reason = 'bp'; break outer; }
        if (sc >= limit) { reason = 'limit'; break outer; }
      }
      if (performance.now() > tEnd) break;
    }
    writeBack();
    renderTape();
    updateInfoBar();

    if (reason === 'halt') {
      halted = true;
      activeTransKey = null;
      updateActiveRow();
      summary();
      stopRun('halted', `Kein Übergang für (${currentState},${tapeGet(headPos)}) — HALT nach ${stepCount} Schritten.`, 'halt');
    } else if (reason === 'bp') {
      updateActiveRow();
      summary();
      stopRun('stopped', `Breakpoint erreicht: (${currentState},${tapeGet(headPos)}) nach ${stepCount} Schritten.`, 'info');
    } else if (reason === 'limit') {
      updateActiveRow();
      summary();
      stopRun('stopped', `Step-Limit ${limitVal} erreicht — angehalten.`, 'info');
    } else {
      turboTimer = setTimeout(slice, 0);
    }
  }
  turboTimer = setTimeout(slice, 0);
}

$('btn-turbo').addEventListener('click', runTurbo);

// Der Turbo-Knopf ist genau dann bedienbar, wenn es Run auch ist.
new MutationObserver(() => { $('btn-turbo').disabled = $('btn-run').disabled; })
  .observe($('btn-run'), { attributes: true, attributeFilter: ['disabled'] });

$('btn-stop').addEventListener('click', () => stopRun('stopped', 'Angehalten.', 'info'));

$('btn-reset').addEventListener('click', () => {
  running = false;
  clearTimeout(runTimer);
  resetMachine();
  $('btn-run').disabled = false;
  $('btn-step').disabled = false;
  $('btn-stop').disabled = true;
  logEntry('Maschine zurückgesetzt.', 'info');
});

$('btn-load-tape').addEventListener('click', () => {
  running = false;
  clearTimeout(runTimer);
  commitSnapshotFromFields();
  resetMachine();
  $('btn-run').disabled = false;
  $('btn-step').disabled = false;
  logEntry(`Snapshot gesetzt — Tape: "${initialSnapshot.tapeStr}", Zustand: ${initialSnapshot.state}, Kopf: ${initialSnapshot.headPos}`, 'info');
});

$('tape-init-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btn-load-tape').click();
});

$('btn-clear-log').addEventListener('click', () => { $('debug-log').innerHTML = ''; });

$('btn-save').addEventListener('click', downloadTM);

// ── Editor controls ──
$('btn-edit-toggle').addEventListener('click', () => setEditMode(!editMode));

$('btn-sort').addEventListener('click', () => {
  tm.list.sort((a, b) => natCmp(a.state, b.state) || (a.symbol < b.symbol ? -1 : a.symbol > b.symbol ? 1 : 0));
  modelChanged();
  logEntry('Übergänge nach Zustand und Symbol sortiert.', 'info');
});

$('btn-gaps').addEventListener('click', listGaps);

function quickAdd() {
  const inp = $('quick-add-input');
  const n = addTransitions(inp.value);
  if (!n) { logEntry('Nicht erkannt. Erwartet: (zustand,lies,folgezustand,schreib,L|R|N)', 'error'); return; }
  inp.value = '';
  modelChanged();
  logEntry(`${n} Übergang${n > 1 ? 'e' : ''} hinzugefügt.`, 'info');
  $('trans-table').scrollTop = $('trans-table').scrollHeight;
}

$('btn-quick-add').addEventListener('click', quickAdd);
$('quick-add-input').addEventListener('keydown', e => { if (e.key === 'Enter') quickAdd(); });

$('btn-blank-row').addEventListener('click', () => {
  const last = tm.list[tm.list.length - 1];
  tm.list.push({ state: last ? last.state : '', symbol: '', newState: '', newSymbol: '', dir: 'R' });
  modelChanged();
  const rows = $('trans-table').querySelectorAll('.trans-row.edit input.f-state');
  const el = rows[rows.length - 1];
  if (el) { el.focus(); el.select(); }
});

// ── Tabs ──
function showTab(which) {
  const isTable = which === 'table';
  $('view-table').hidden  = !isTable;
  $('view-source').hidden = isTable;
  $('tab-table').classList.toggle('active', isTable);
  $('tab-source').classList.toggle('active', !isTable);
  if (!isTable) {
    $('source-area').value = serializeTM();
    $('source-msg').textContent = 'Bearbeiten und „Übernehmen“ drücken.';
  }
}
$('tab-table').addEventListener('click', () => showTab('table'));
$('tab-source').addEventListener('click', () => showTab('source'));

$('btn-refresh-source').addEventListener('click', () => {
  $('source-area').value = serializeTM();
  $('source-msg').textContent = 'Aus dem Modell neu erzeugt.';
});

$('btn-apply-source').addEventListener('click', () => {
  const parsed = parseTM($('source-area').value);
  running = false;
  clearTimeout(runTimer);

  tm = parsed;
  if (parsed.initialState !== null) $('init-state-input').value = parsed.initialState;
  $('init-head-input').value  = String(parsed.initialHeadPos);
  $('tape-init-input').value  = parsed.initialTape;
  $('comment-input').value    = parsed.comments[0] ?? '';

  commitSnapshotFromFields();
  resetMachine();
  reindex();
  updateStats();

  const errs = tm.list.filter(t => t.err).length;
  $('source-msg').innerHTML = errs
    ? `<span class="bad">Übernommen, ${errs} Fehler</span>`
    : `Übernommen: ${tm.list.length} Übergänge.`;
  logEntry(`Quelltext übernommen — ${tm.list.length} Übergänge` + (errs ? `, ${errs} fehlerhaft` : '') + '.',
           errs ? 'error' : 'info');

  $('btn-run').disabled = false;
  $('btn-step').disabled = false;
});

// ─────────────────────────────────────────────
// File loading
// ─────────────────────────────────────────────
function loadFromText(text, name, note) {
  tm = parseTM(text);
  reindex();

  $('tape-init-input').value  = tm.initialTape;
  $('init-state-input').value = tm.initialState ?? '000';
  $('init-head-input').value  = String(tm.initialHeadPos ?? 0);
  $('comment-input').value    = tm.comments[0] ?? '';
  $('filename-input').value   = name;

  commitSnapshotFromFields();
  running = false;
  clearTimeout(runTimer);
  resetMachine();
  if (!$('view-source').hidden) $('source-area').value = serializeTM();

  const errs = tm.list.filter(t => t.err).length;
  logEntry(`${name} geladen — ${tm.list.length} Übergänge, Startzustand: ${tm.initialState}, Kopf: ${tm.initialHeadPos}` +
           (errs ? ` (${errs} fehlerhaft)` : ''), errs ? 'error' : 'info');
  if (note) logEntry(note, 'info');

  $('btn-run').disabled = false;
  $('btn-step').disabled = false;
  $('btn-stop').disabled = true;
}

$('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => loadFromText(evt.target.result, file.name);
  reader.readAsText(file);
  e.target.value = '';
});

$('example-select').addEventListener('change', e => {
  const ex = EXAMPLES[e.target.value];
  if (ex) loadFromText(ex.src, ex.file, ex.note);
});

// ─────────────────────────────────────────────
// Speed slider + shortcuts
// ─────────────────────────────────────────────
$('speed-slider').addEventListener('input', e => {
  $('speed-label').textContent = speedLabels[e.target.value - 1];
});

window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    downloadTM();
  }
});

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
renderTape();
updateInfoBar();
setStatus('idle');
loadFromText(EXAMPLES.increment.src, EXAMPLES.increment.file, EXAMPLES.increment.note);
logEntry('Weitere Beispiele im Menü oben, oder „✎ Bearbeiten“ für eigene Übergänge.', 'info');
</script>
</body>
</html>
