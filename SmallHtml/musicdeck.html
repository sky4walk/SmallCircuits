<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DECK — lokaler MP3-Player</title>
<style>
:root{
  --panel:      #24272c;
  --panel-hi:   #31353c;
  --panel-lo:   #15171a;
  --glass:      #0d1211;
  --amber:      #f2a93b;
  --amber-dim:  #6b4d1d;
  --steel:      #8b939e;
  --steel-dim:  #5b626b;
  --alert:      #cf6a5a;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#0b0c0e;
  background-image:radial-gradient(120% 80% at 50% 0%, #1b1e22 0%, #0b0c0e 70%);
  color:var(--steel); font-family:var(--sans); font-size:14px;
  padding:20px; display:flex; justify-content:center;
}
.deck{
  width:100%; max-width:860px; display:flex; flex-direction:column;
  background:linear-gradient(180deg,var(--panel-hi) 0%, var(--panel) 3%, var(--panel) 100%);
  border:1px solid #0a0b0d; border-radius:4px;
  box-shadow:0 1px 0 #454a52 inset, 0 24px 60px rgba(0,0,0,.6);
  overflow:hidden;
}

/* ---------- Kopfleiste ---------- */
.rail{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 16px; background:linear-gradient(180deg,#2b2f35,#212429);
  border-bottom:1px solid var(--panel-lo);
}
.brand{font-family:var(--mono); font-size:13px; letter-spacing:.34em; color:var(--amber); text-transform:uppercase}
.brand small{display:block; font-size:9px; letter-spacing:.2em; color:var(--steel-dim); margin-top:3px}
.rail-actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}

button, .btn{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--steel); background:linear-gradient(180deg,#383d45,#282c32);
  border:1px solid #14161a; border-radius:3px; padding:8px 12px; cursor:pointer;
  box-shadow:0 1px 0 #4d535c inset, 0 1px 2px rgba(0,0,0,.4);
}
button:hover, .btn:hover{color:#e6ebf2; background:linear-gradient(180deg,#424852,#2e333a)}
button:active, .btn:active{box-shadow:0 2px 4px rgba(0,0,0,.5) inset; transform:translateY(1px)}
button:focus-visible, .btn:focus-visible, input:focus-visible, li:focus-visible{
  outline:2px solid var(--amber); outline-offset:2px;
}
button[disabled]{opacity:.35; cursor:default}
button.on{color:#161006; background:linear-gradient(180deg,#f6bc5b,#dd9427); border-color:#7a5518; box-shadow:0 0 12px rgba(242,169,59,.25)}

/* ---------- Anzeige ---------- */
.readout{
  margin:16px; padding:16px 18px 14px; border-radius:3px;
  background:var(--glass);
  box-shadow:0 2px 10px rgba(0,0,0,.7) inset, 0 0 0 1px #05100d, 0 0 0 2px #2f343b;
}
.meter-row{display:flex; align-items:flex-end; gap:14px; margin-bottom:14px}
#meter{width:100%; height:26px; display:block; flex:1}
.now{display:flex; align-items:baseline; gap:12px; min-height:44px}
.now .idx{font-family:var(--mono); font-size:26px; color:var(--amber-dim); letter-spacing:.05em}
.now .txt{min-width:0}
.now .title{
  font-family:var(--mono); font-size:17px; color:var(--amber); letter-spacing:.04em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-shadow:0 0 14px rgba(242,169,59,.35);
}
.now .sub{font-size:11px; color:var(--steel-dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.time{display:flex; align-items:center; gap:12px; margin:14px 0 4px}
.time span{font-family:var(--mono); font-size:12px; color:var(--steel); min-width:44px}
.time span.r{text-align:right}

input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:16px; background:transparent; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:4px; background:#1e2a27; border-radius:2px; box-shadow:0 0 0 1px #060d0b}
input[type=range]::-moz-range-track{height:4px; background:#1e2a27; border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:6px; height:16px; margin-top:-6px; border-radius:1px;
  background:var(--amber); box-shadow:0 0 10px rgba(242,169,59,.6);
}
input[type=range]::-moz-range-thumb{width:6px; height:16px; border:0; border-radius:1px; background:var(--amber)}

.transport{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px}
.transport .keys{display:flex; gap:6px}
.transport .keys button{padding:9px 14px}
.transport svg{width:14px; height:14px; fill:currentColor; display:block}
.spacer{flex:1}
.vol{display:flex; align-items:center; gap:8px; min-width:150px}
.vol label{font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--steel-dim)}

/* ---------- Listenkopf ---------- */
.list-head{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:0 16px 12px; border-bottom:1px solid var(--panel-lo);
}
.list-head .label{font-family:var(--mono); font-size:9px; letter-spacing:.2em; color:var(--steel-dim); text-transform:uppercase}
#filter{
  margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--steel);
  background:#1a1d21; border:1px solid #0e1013; border-radius:3px; padding:7px 10px; width:190px;
}
#filter::placeholder{color:#4d545d}

/* ---------- Titelliste ---------- */
ol{list-style:none; margin:0; padding:6px 0 0; overflow-y:auto; max-height:46vh; min-height:120px}
li{
  display:flex; align-items:center; gap:10px; padding:7px 16px; cursor:pointer;
  border-left:2px solid transparent; border-top:1px solid transparent; border-bottom:1px solid transparent;
}
li:hover{background:#282c32}
li.playing{background:#2c2418; border-left-color:var(--amber)}
li.playing .name{color:var(--amber)}
li.missing{opacity:.4}
li.drop-before{border-top-color:var(--amber)}
li.drop-after{border-bottom-color:var(--amber)}
li.dragging{opacity:.35}
li .num{font-family:var(--mono); font-size:11px; color:var(--steel-dim); width:34px; flex:none}
li .meta{min-width:0; flex:1}
li .name{font-size:13px; color:#c3cad3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
li .path{font-family:var(--mono); font-size:10px; color:#565d66; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
li .dur{font-family:var(--mono); font-size:11px; color:var(--steel-dim); flex:none}
li .grip{
  flex:none; width:18px; text-align:center; color:#464c55; cursor:grab;
  font-size:14px; line-height:1; letter-spacing:-1px; user-select:none;
}
li .kill{flex:none; padding:4px 7px; font-size:11px; letter-spacing:0; line-height:1}
li .kill:hover{color:var(--alert)}

/* ---------- Fuß ---------- */
.status{
  padding:10px 16px; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  color:var(--steel-dim); background:#1c1f23; border-top:1px solid #0d0f11;
  display:flex; gap:14px; flex-wrap:wrap;
}
.status b{color:var(--amber); font-weight:400}
.empty{padding:36px 16px; text-align:center; color:var(--steel-dim); font-family:var(--mono); font-size:11px; letter-spacing:.1em; line-height:2}
body.dragover .deck{box-shadow:0 0 0 2px var(--amber), 0 24px 60px rgba(0,0,0,.6)}
.hidden{display:none}

@media (max-width:560px){
  body{padding:0}
  .deck{border-radius:0; min-height:100vh}
  li .path{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>
<div class="deck">

  <header class="rail">
    <div class="brand">Deck<small>lokaler mp3-player</small></div>
    <div class="rail-actions">
      <button id="bFolder">Ordner wählen</button>
      <button id="bLoad">Playlist laden</button>
      <button id="bSave" disabled>Playlist speichern</button>
      <button id="bClear" disabled>Leeren</button>
    </div>
  </header>

  <section class="readout">
    <div class="meter-row"><canvas id="meter" height="26"></canvas></div>
    <div class="now">
      <span class="idx" id="nIdx">––</span>
      <div class="txt">
        <div class="title" id="nTitle">Kein Titel geladen</div>
        <div class="sub" id="nSub">Wähle einen Ordner oder zieh ihn auf dieses Fenster</div>
      </div>
    </div>
    <div class="time">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position im Titel">
      <span class="r" id="tDur">0:00</span>
    </div>
    <div class="transport">
      <div class="keys">
        <button id="bPrev" title="Vorheriger Titel" aria-label="Vorheriger Titel"><svg viewBox="0 0 16 16"><path d="M4 2h2v12H4zM14 2v12L6 8z"/></svg></button>
        <button id="bPlay" title="Abspielen (Leertaste)" aria-label="Abspielen"><svg id="icPlay" viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg></button>
        <button id="bNext" title="Nächster Titel" aria-label="Nächster Titel"><svg viewBox="0 0 16 16"><path d="M10 2h2v12h-2zM2 2l8 6-8 6z"/></svg></button>
      </div>
      <button id="bShuffle">Zufall</button>
      <button id="bRepeat">Wdh. aus</button>
      <span class="spacer"></span>
      <div class="vol">
        <label for="vol">Vol</label>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Lautstärke">
      </div>
    </div>
  </section>

  <div class="list-head">
    <span class="label">Titel — ziehen zum Umsortieren</span>
    <input id="filter" type="search" placeholder="filtern…" aria-label="Titel filtern">
  </div>

  <ol id="list"></ol>
  <div class="empty" id="empty">Noch nichts geladen.<br>„Ordner wählen“ liest alle MP3s samt Unterordnern ein.</div>

  <footer class="status">
    <span><b id="sCount">0</b> Titel</span>
    <span><b id="sTime">0:00</b> Gesamtlänge</span>
    <span id="sNote">Leertaste = Play/Pause · ← → = 5 s spulen</span>
  </footer>
</div>

<input type="file" id="fFolder" webkitdirectory directory multiple class="hidden">
<input type="file" id="fList" accept=".m3u,.m3u8,text/plain" class="hidden">
<audio id="au"></audio>

<script>
"use strict";

const AUDIO_RE = /\.(mp3|m4a|aac|ogg|oga|opus|flac|wav|wma)$/i;
const $ = id => document.getElementById(id);

const au = $("au");
let tracks = [];          // {file, name, rel, dir, dur, missing}
let cur = -1;
let shuffle = false;
let repeat = 0;           // 0 aus, 1 alle, 2 eins
let history = [];
let curURL = null;
let probeAbort = 0;

/* ---------------- Einlesen ---------------- */

function baseName(p){ return p.split("/").pop(); }
function stripExt(n){ return n.replace(/\.[^.]+$/, ""); }
function stripRoot(rel){ const i = rel.indexOf("/"); return i < 0 ? rel : rel.slice(i+1); }

function makeTrack(file, rel){
  rel = (rel || file.webkitRelativePath || file.name).replace(/\\/g,"/");
  return { file, rel, name: stripExt(baseName(rel)), dir: rel.split("/").slice(0,-1).join("/"), dur:null, missing:false };
}

function addFiles(files, replace){
  const found = files.filter(f => AUDIO_RE.test(f.name || ""));
  if(!found.length){ note("Keine Audiodateien gefunden."); if(replace) return; }
  const list = found.map(f => makeTrack(f));
  list.sort((a,b) => a.rel.localeCompare(b.rel, "de", {numeric:true, sensitivity:"base"}));
  if(replace){ stop(); tracks = list; cur = -1; history = []; }
  else{
    const known = new Set(tracks.map(t => t.rel));
    tracks = tracks.concat(list.filter(t => !known.has(t.rel)));
  }
  render(); probeDurations();
  note(found.length + " Datei" + (found.length===1?"":"en") + " eingelesen.");
}

$("bFolder").onclick = () => $("fFolder").click();
$("fFolder").onchange = e => { addFiles([...e.target.files], true); e.target.value = ""; };

$("bClear").onclick = () => { stop(); tracks = []; cur = -1; history = []; render(); note("Liste geleert."); };

/* Ordner/Dateien per Drag & Drop vom Dateimanager */
let dragDepth = 0;
addEventListener("dragenter", e => {
  if(![...e.dataTransfer.types].includes("Files")) return;
  dragDepth++; document.body.classList.add("dragover");
});
addEventListener("dragleave", () => { if(--dragDepth <= 0) document.body.classList.remove("dragover"); });
addEventListener("dragover", e => { if([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
addEventListener("drop", async e => {
  if(![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragover");
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if(entries.length){
    const out = [];
    for(const en of entries) await walk(en, out);
    const list = out.filter(o => AUDIO_RE.test(o.file.name)).map(o => makeTrack(o.file, o.rel));
    list.sort((a,b) => a.rel.localeCompare(b.rel,"de",{numeric:true,sensitivity:"base"}));
    const known = new Set(tracks.map(t => t.rel));
    tracks = tracks.concat(list.filter(t => !known.has(t.rel)));
    render(); probeDurations(); note(list.length + " Datei(en) hinzugefügt.");
  } else {
    addFiles([...e.dataTransfer.files], false);
  }
});

function walk(entry, out, prefix){
  prefix = prefix || "";
  return new Promise(res => {
    if(entry.isFile){
      entry.file(f => { out.push({file:f, rel: prefix + entry.name}); res(); }, res);
    } else if(entry.isDirectory){
      const rd = entry.createReader(); const all = [];
      const step = () => rd.readEntries(async ents => {
        if(!ents.length){
          for(const c of all) await walk(c, out, prefix + entry.name + "/");
          return res();
        }
        all.push(...ents); step();
      }, res);
      step();
    } else res();
  });
}

/* ---------------- Spieldauern im Hintergrund ---------------- */

async function probeDurations(){
  const run = ++probeAbort;
  const probe = new Audio(); probe.preload = "metadata";
  for(const t of tracks){
    if(run !== probeAbort) return;
    if(t.dur != null || t.missing) continue;
    const url = URL.createObjectURL(t.file);
    t.dur = await new Promise(res => {
      const done = v => { probe.onloadedmetadata = probe.onerror = null; res(v); };
      probe.onloadedmetadata = () => done(isFinite(probe.duration) ? probe.duration : 0);
      probe.onerror = () => done(0);
      probe.src = url;
    });
    URL.revokeObjectURL(url);
    const row = document.querySelector('li[data-i="' + tracks.indexOf(t) + '"] .dur');
    if(row) row.textContent = fmt(t.dur);
    updateTotals();
  }
}

/* ---------------- Liste ---------------- */

const listEl = $("list");

function render(){
  const q = $("filter").value.trim().toLowerCase();
  listEl.innerHTML = "";
  const frag = document.createDocumentFragment();
  tracks.forEach((t, i) => {
    if(q && !(t.rel.toLowerCase().includes(q))) return;
    const li = document.createElement("li");
    li.dataset.i = i;
    li.draggable = true;
    li.tabIndex = 0;
    if(i === cur) li.classList.add("playing");
    if(t.missing) li.classList.add("missing");
    li.innerHTML =
      '<span class="grip" title="Ziehen zum Umsortieren">⣿</span>' +
      '<span class="num">' + String(i+1).padStart(3,"0") + '</span>' +
      '<span class="meta"><span class="name"></span><span class="path"></span></span>' +
      '<span class="dur">' + (t.dur ? fmt(t.dur) : (t.missing ? "fehlt" : "–:––")) + '</span>' +
      '<button class="kill" title="Aus der Liste nehmen" aria-label="Titel entfernen">✕</button>';
    li.querySelector(".name").textContent = t.name;
    li.querySelector(".path").textContent = t.dir || "./";
    frag.appendChild(li);
  });
  listEl.appendChild(frag);
  $("empty").style.display = tracks.length ? "none" : "block";
  $("bSave").disabled = $("bClear").disabled = !tracks.length;
  updateTotals();
}

function updateTotals(){
  $("sCount").textContent = tracks.length;
  const s = tracks.reduce((a,t) => a + (t.dur || 0), 0);
  $("sTime").textContent = fmtLong(s);
}

listEl.addEventListener("click", e => {
  const li = e.target.closest("li"); if(!li) return;
  const i = +li.dataset.i;
  if(e.target.closest(".kill")){
    const wasCur = i === cur;
    tracks.splice(i,1);
    if(cur > i) cur--; else if(wasCur){ cur = Math.min(i, tracks.length-1); }
    render();
    if(wasCur){ if(tracks.length) play(cur); else stop(); }
    return;
  }
  if(tracks[i].missing){ note("Datei nicht geladen — Ordner erneut wählen."); return; }
  play(i);
});

listEl.addEventListener("keydown", e => {
  const li = e.target.closest("li"); if(!li) return;
  if(e.key === "Enter"){ e.preventDefault(); play(+li.dataset.i); }
  if(e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    e.preventDefault();
    const i = +li.dataset.i, j = i + (e.key === "ArrowUp" ? -1 : 1);
    if(j < 0 || j >= tracks.length) return;
    move(i, j);
    const nx = listEl.querySelector('li[data-i="' + j + '"]'); if(nx) nx.focus();
  }
});

/* Umsortieren per Drag & Drop innerhalb der Liste */
let dragIdx = null;
listEl.addEventListener("dragstart", e => {
  const li = e.target.closest("li"); if(!li) return;
  dragIdx = +li.dataset.i; li.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(dragIdx));
});
listEl.addEventListener("dragend", () => {
  dragIdx = null;
  listEl.querySelectorAll("li").forEach(l => l.classList.remove("dragging","drop-before","drop-after"));
});
listEl.addEventListener("dragover", e => {
  if(dragIdx === null) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  const li = e.target.closest("li"); if(!li) return;
  const r = li.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  listEl.querySelectorAll("li").forEach(l => l.classList.remove("drop-before","drop-after"));
  li.classList.add(after ? "drop-after" : "drop-before");
});
listEl.addEventListener("drop", e => {
  if(dragIdx === null) return;
  e.preventDefault(); e.stopPropagation();
  const li = e.target.closest("li"); if(li === null) return;
  const r = li.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  let to = +li.dataset.i + (after ? 1 : 0);
  if(to > dragIdx) to--;
  move(dragIdx, to);
});

function move(from, to){
  if(from === to || from < 0 || to < 0 || to >= tracks.length) return;
  const [t] = tracks.splice(from,1);
  tracks.splice(to,0,t);
  if(cur === from) cur = to;
  else if(from < cur && to >= cur) cur--;
  else if(from > cur && to <= cur) cur++;
  render();
}

$("filter").oninput = render;

/* ---------------- Wiedergabe ---------------- */

function play(i){
  if(i < 0 || i >= tracks.length) return;
  const t = tracks[i];
  if(t.missing) return;
  if(cur !== i){
    if(cur >= 0) history.push(cur);
    if(curURL) URL.revokeObjectURL(curURL);
    curURL = URL.createObjectURL(t.file);
    au.src = curURL;
    cur = i;
  }
  au.play().catch(() => note("Wiedergabe abgelehnt — Datei nicht lesbar?"));
  showNow();
  render();
  const li = listEl.querySelector("li.playing");
  if(li) li.scrollIntoView({block:"nearest"});
}

function stop(){
  au.pause(); au.removeAttribute("src"); au.load();
  if(curURL){ URL.revokeObjectURL(curURL); curURL = null; }
  cur = -1; showNow();
}

function showNow(){
  const t = tracks[cur];
  $("nIdx").textContent = cur >= 0 ? String(cur+1).padStart(2,"0") : "––";
  $("nTitle").textContent = t ? t.name : "Kein Titel geladen";
  $("nSub").textContent  = t ? (t.dir || "./") : "Wähle einen Ordner oder zieh ihn auf dieses Fenster";
  $("icPlay").innerHTML = (t && !au.paused) ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M3 2l11 6-11 6z"/>';
  $("bPlay").title = (t && !au.paused) ? "Pause (Leertaste)" : "Abspielen (Leertaste)";
}

function nextIndex(auto){
  if(!tracks.length) return -1;
  if(auto && repeat === 2) return cur;
  if(shuffle){
    if(tracks.length === 1) return 0;
    let n; do { n = Math.floor(Math.random()*tracks.length); } while(n === cur);
    return n;
  }
  if(cur+1 < tracks.length) return cur+1;
  return (repeat === 1 || !auto) ? 0 : -1;
}

$("bPlay").onclick = () => {
  if(cur < 0){ if(tracks.length) play(0); return; }
  au.paused ? au.play() : au.pause();
};
$("bNext").onclick = () => { const n = nextIndex(false); if(n >= 0) play(n); };
$("bPrev").onclick = () => {
  if(au.currentTime > 3){ au.currentTime = 0; return; }
  if(shuffle && history.length){ const p = history.pop(); cur = -1; play(p); return; }
  play(cur > 0 ? cur-1 : tracks.length-1);
};
$("bShuffle").onclick = e => { shuffle = !shuffle; e.target.classList.toggle("on", shuffle); };
$("bRepeat").onclick = e => {
  repeat = (repeat+1) % 3;
  e.target.textContent = ["Wdh. aus","Wdh. alle","Wdh. eins"][repeat];
  e.target.classList.toggle("on", repeat > 0);
};

au.onplay = au.onpause = showNow;
au.onended = () => {
  if(repeat === 2){ au.currentTime = 0; au.play(); return; }
  const n = nextIndex(true);
  if(n >= 0) play(n); else { showNow(); note("Ende der Liste."); }
};
au.onerror = () => { if(cur >= 0) note("Fehler bei: " + tracks[cur].name); };
au.ontimeupdate = () => {
  if(seeking) return;
  $("tCur").textContent = fmt(au.currentTime);
  $("tDur").textContent = isFinite(au.duration) ? fmt(au.duration) : "0:00";
  $("seek").value = isFinite(au.duration) && au.duration ? (au.currentTime/au.duration*1000) : 0;
};
au.onloadedmetadata = () => {
  if(cur >= 0 && isFinite(au.duration)){ tracks[cur].dur = au.duration; updateTotals(); }
};

let seeking = false;
$("seek").oninput = e => { seeking = true; if(isFinite(au.duration)) $("tCur").textContent = fmt(e.target.value/1000*au.duration); };
$("seek").onchange = e => { if(isFinite(au.duration)) au.currentTime = e.target.value/1000*au.duration; seeking = false; };
$("vol").oninput = e => { au.volume = e.target.value/100; };
au.volume = 0.8;

addEventListener("keydown", e => {
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.code === "Space"){ e.preventDefault(); $("bPlay").click(); }
  else if(e.code === "ArrowRight" && cur >= 0){ e.preventDefault(); au.currentTime = Math.min(au.duration||0, au.currentTime+5); }
  else if(e.code === "ArrowLeft" && cur >= 0){ e.preventDefault(); au.currentTime = Math.max(0, au.currentTime-5); }
});

/* ---------------- Pegelanzeige ---------------- */

const cv = $("meter"), cx = cv.getContext("2d");
let analyser = null, bins = null;

function initAnalyser(){
  if(analyser) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(au);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser); analyser.connect(ctx.destination);
    bins = new Uint8Array(analyser.frequencyBinCount);
    au.addEventListener("play", () => ctx.resume());
  }catch(err){ analyser = false; }
}
au.addEventListener("play", initAnalyser, {once:true});

function drawMeter(){
  const dpr = devicePixelRatio || 1;
  const w = cv.clientWidth, h = 26;
  if(cv.width !== w*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.clearRect(0,0,w,h);
  const cols = 40, gap = 2, cw = (w - gap*(cols-1))/cols, rows = 6, rh = (h - gap*(rows-1))/rows;
  if(analyser && !au.paused) analyser.getByteFrequencyData(bins);
  for(let c=0;c<cols;c++){
    let v = 0;
    if(analyser && !au.paused && bins){
      const idx = Math.floor(Math.pow(c/cols, 1.7) * bins.length);
      v = bins[Math.min(idx, bins.length-1)]/255;
      v = Math.min(1, v*1.25);
    }
    const lit = Math.round(v*rows);
    for(let r=0;r<rows;r++){
      const on = (rows-r) <= lit;
      cx.fillStyle = on ? (r === 0 ? "#e8705a" : r < 2 ? "#f2c85b" : "#f2a93b") : "#182220";
      cx.fillRect(c*(cw+gap), r*(rh+gap), cw, rh);
    }
  }
  requestAnimationFrame(drawMeter);
}
requestAnimationFrame(drawMeter);

/* ---------------- Playlist speichern / laden ---------------- */

$("bSave").onclick = () => {
  let out = "#EXTM3U\n";
  for(const t of tracks){
    out += "#EXTINF:" + Math.round(t.dur || -1) + "," + t.name + "\n";
    out += stripRoot(t.rel) + "\n";
  }
  const root = (tracks[0] && tracks[0].rel.includes("/")) ? tracks[0].rel.split("/")[0] : "playlist";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"audio/x-mpegurl"}));
  a.download = root.replace(/[^\w\-. ]+/g,"_") + ".m3u";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  note("Playlist gespeichert (" + tracks.length + " Einträge).");
};

$("bLoad").onclick = () => $("fList").click();
$("fList").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  const text = await f.text();
  const paths = text.split(/\r?\n/).map(s => s.trim())
    .filter(s => s && !s.startsWith("#")).map(s => s.replace(/\\/g,"/"));
  if(!paths.length){ note("Playlist enthält keine Einträge."); return; }

  const byRel = new Map(), byBase = new Map();
  for(const t of tracks){
    byRel.set(stripRoot(t.rel).toLowerCase(), t);
    byRel.set(t.rel.toLowerCase(), t);
    if(!byBase.has(baseName(t.rel).toLowerCase())) byBase.set(baseName(t.rel).toLowerCase(), t);
  }
  const ordered = [], used = new Set();
  let miss = 0;
  for(const p of paths){
    const key = p.toLowerCase().replace(/^\.\//,"");
    let t = byRel.get(key) || byBase.get(baseName(key));
    if(t && !used.has(t)){ used.add(t); ordered.push(t); }
    else if(!t){
      miss++;
      ordered.push({file:null, rel:p, name:stripExt(baseName(p)), dir:p.split("/").slice(0,-1).join("/"), dur:null, missing:true});
    }
  }
  const rest = tracks.filter(t => !used.has(t));
  stop();
  tracks = ordered.concat(rest);
  render();
  note("Playlist geladen." + (miss ? " " + miss + " Datei(en) nicht im geladenen Ordner." : ""));
};

/* ---------------- Hilfen ---------------- */

function fmt(s){
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function fmtLong(s){
  s = Math.floor(s || 0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? h + ":" + String(m).padStart(2,"0") + ":" + String(s%60).padStart(2,"0") : fmt(s);
}
let noteTimer;
function note(msg){
  $("sNote").textContent = msg;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { $("sNote").textContent = "Leertaste = Play/Pause · ← → = 5 s spulen"; }, 6000);
}

render();
</script>
