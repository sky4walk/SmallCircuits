<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kronenduell — Arena-Kampf</title>
<style>
  :root{
    --bg:#0d1220; --panel:#161e33; --panel2:#1e2947; --ink:#eaf0ff;
    --muted:#8a97b8; --gold:#f4c14e; --blue:#3a7bff; --red:#ff5a52;
    --elx:#d14bff; --line:#2a3556; --ok:#54d98c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:360/640;
    width:min(100vw, 56.25vh);
    width:min(100vw, calc(100dvh * 0.5625));
    max-height:100vh; max-height:100dvh;
    background:var(--bg);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .screen{position:absolute;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  .fill{flex:1;min-height:0}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:.5px}
  .brand{font-size:34px;line-height:1;text-align:center;
    background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 4px 24px rgba(244,193,78,.25)}
  .sub{color:var(--muted);text-align:center;font-size:13px;margin-top:6px}
  .pad{padding:18px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .btn{appearance:none;border:0;cursor:pointer;color:#0a0f1e;font-weight:800;
    background:linear-gradient(180deg,var(--gold),#d99b2c);border-radius:12px;
    padding:14px 22px;font-size:16px;box-shadow:0 6px 0 #a9741f,0 10px 18px rgba(0,0,0,.4);
    transition:transform .05s}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #a9741f}
  .btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0c1122}
  .btn.sm{padding:9px 14px;font-size:13px;border-radius:9px}
  .row{display:flex;gap:10px;align-items:center}
  .grid{display:grid;gap:10px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar h2{font-size:16px}
  .scroll{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .card-pick{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px;display:flex;flex-direction:column;gap:8px}
  .card-pick.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,193,78,.35) inset}
  .card-pick .hd{display:flex;justify-content:space-between;align-items:center}
  .tag{font-size:11px;color:var(--muted)}
  .mini-deck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .mini{background:var(--panel2);border-radius:8px;padding:6px 4px;text-align:center;
    font-size:10px;line-height:1.2;position:relative;min-height:44px;
    display:flex;flex-direction:column;justify-content:center;gap:2px}
  .mini .c{position:absolute;top:2px;left:3px;color:var(--elx);font-weight:800;font-size:10px}
  .arena-pick{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;
    cursor:pointer}
  .arena-pick.sel{outline:3px solid var(--gold)}
  .arena-pick .lvl{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.45);
    border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700}
  .arena-pick h3{font-size:18px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .arena-pick p{margin:2px 0 0;font-size:12px;color:#dfe6ff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  /* battle */
  #hudTop{display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
    font-size:13px;font-weight:700}
  .crowns{display:flex;gap:8px;align-items:center}
  .crown{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
    font-size:12px;background:var(--panel2)}
  .crown.b{color:var(--blue)} .crown.r{color:var(--red)}
  #clock{font-variant-numeric:tabular-nums}
  #clock.dbl{color:var(--elx)}
  #fieldWrap{position:relative;flex:1;min-height:0;background:#0a1020}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #hudBot{background:var(--panel);border-top:1px solid var(--line);padding:8px 8px 10px}
  #elixWrap{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  #elixNum{width:22px;text-align:center;font-weight:800;color:var(--elx)}
  #hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .hcard{background:linear-gradient(180deg,#243156,#1a2340);border:2px solid #33406b;
    border-radius:11px;padding:5px 4px;text-align:center;cursor:pointer;position:relative;
    min-height:74px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .hcard .nm{font-size:10px;font-weight:700;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .hcard .art{height:38px;border-radius:6px;margin:1px 0}
  .hcard .cost{position:absolute;bottom:2px;right:4px;background:var(--elx);color:#fff;
    font-weight:800;font-size:11px;border-radius:6px;padding:0 5px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .hcard.sel{border-color:var(--gold);transform:translateY(-4px);
    box-shadow:0 6px 14px rgba(244,193,78,.35)}
  .hcard.cant{opacity:.45}
  #elixBar{flex:1;height:16px;background:#1a1030;border-radius:9px;overflow:hidden;
    display:flex;position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
  .pip{flex:1;border-right:2px solid #0a0f1e}
  .pip:last-child{border-right:0}
  .pip.f{background:linear-gradient(180deg,#f0a0ff,var(--elx) 60%,#a020d0)}
  #nextCard{margin-top:6px;font-size:11px;color:var(--muted);text-align:center}
  /* result */
  #result{background:rgba(6,9,18,.86);align-items:center;justify-content:center;z-index:5}
  #result .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:26px;width:82%;text-align:center;display:flex;flex-direction:column;gap:14px}
  #result h2{font-size:26px}
  .hint{color:var(--muted);font-size:12px;text-align:center;line-height:1.5}
  .pill{display:inline-block;background:var(--panel2);border-radius:20px;padding:4px 12px;
    font-size:12px;color:var(--muted)}
  a{color:var(--gold)}
</style>
</head>
<body>
<div id="app"><div id="stage">

  <!-- MENU -->
  <section id="menu" class="screen on">
    <div class="fill center pad">
      <div>
        <h1 class="brand">KRONENDUELL</h1>
        <div class="sub">Echtzeit-Arena — du gegen die KI</div>
      </div>
      <div style="height:8px"></div>
      <button class="btn" id="toArena">Spielen</button>
      <button class="btn ghost sm" id="toDeck">Deck wählen</button>
      <div class="hint" style="max-width:260px">Wähle eine Arena (bestimmt Schwierigkeit) und ein
        Deck. Sammle Elixier, spiele Karten aus und zerstöre mehr Türme als der Gegner.</div>
    </div>
  </section>

  <!-- ARENA SELECT -->
  <section id="arenaSelect" class="screen">
    <div class="topbar"><button class="btn ghost sm" data-back="menu">‹ Zurück</button>
      <h2>Arena wählen</h2><span style="width:56px"></span></div>
    <div class="scroll fill" id="arenaList"></div>
    <div class="pad"><button class="btn" id="startBattle" style="width:100%">Kampf starten ▶</button>
      <div class="hint" style="margin-top:8px">Aktuelles Deck: <span id="curDeckName">—</span> ·
        <a id="quickDeck" href="#">ändern</a></div></div>
  </section>

  <!-- DECK SELECT -->
  <section id="deckSelect" class="screen">
    <div class="topbar"><button class="btn ghost sm" data-back="menu">‹ Zurück</button>
      <h2>Deck wählen</h2><span style="width:56px"></span></div>
    <div class="scroll fill" id="deckList"></div>
    <div class="pad"><button class="btn" id="deckDone" style="width:100%">Übernehmen</button></div>
  </section>

  <!-- BATTLE -->
  <section id="battle" class="screen">
    <div id="hudTop">
      <div class="crowns" id="crownsEnemy"></div>
      <div id="clock">3:00</div>
      <div class="crowns" id="crownsPlayer"></div>
    </div>
    <div id="fieldWrap"><canvas id="cv"></canvas></div>
    <div id="hudBot">
      <div id="elixWrap"><div id="elixBar"></div><div id="elixNum">0</div></div>
      <div id="hand"></div>
      <div id="nextCard">Nächste: —</div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="box">
      <h2 id="resTitle">Sieg!</h2>
      <div class="pill" id="resScore">Kronen 0 – 0</div>
      <div class="hint" id="resSub"></div>
      <button class="btn" id="again">Nochmal</button>
      <button class="btn ghost sm" id="toMenu2">Hauptmenü</button>
    </div>
  </section>

</div></div>

<script>
"use strict";
/* ============================================================
   KRONENDUELL — Single-File Arena-Kampf (Clash-Royale-artig)
   Eigene Karten/Designs, keine Original-IP. Nur Canvas + JS.
   ============================================================ */

/* ---------- Feld-Geometrie (logische Einheiten) ---------- */
const W = 360, H = 560;               // Spielfeld-Koordinaten
const RIVER_T = 262, RIVER_B = 298;   // Fluss-Band (y)
const RIVER_MID = (RIVER_T+RIVER_B)/2;
const BRIDGE_X = [96, 264];           // zwei Brücken (Lane-Mitte)
const BRIDGE_W = 34;
const CENTER_X = W/2;

/* Türme: {x,y,side,king} */
function makeTowers(){
  return [
    // Gegner (oben)
    {id:'eL', x:80,  y:78,  side:'enemy',  king:false, hp:1400,max:1400, r:130, dmg:90, hit:0.8, cd:0, alive:true},
    {id:'eR', x:280, y:78,  side:'enemy',  king:false, hp:1400,max:1400, r:130, dmg:90, hit:0.8, cd:0, alive:true},
    {id:'eK', x:180, y:34,  side:'enemy',  king:true,  hp:2400,max:2400, r:142, dmg:110,hit:1.0, cd:0, alive:true, active:false},
    // Spieler (unten)
    {id:'pL', x:80,  y:482, side:'player', king:false, hp:1400,max:1400, r:130, dmg:90, hit:0.8, cd:0, alive:true},
    {id:'pR', x:280, y:482, side:'player', king:false, hp:1400,max:1400, r:130, dmg:90, hit:0.8, cd:0, alive:true},
    {id:'pK', x:180, y:526, side:'player', king:true,  hp:2400,max:2400, r:142, dmg:110,hit:1.0, cd:0, alive:true, active:false},
  ];
}

/* ---------- Karten-Datenbank (eigene Namen) ----------
   type: troop | building | spell
   air: fliegt  | targetsAir: kann Luft treffen
   buildingOnly: greift nur Gebäude/Türme an
   splash: Flächenschaden (Radius r)                                   */
const CARDS = {
  koloss:    {name:'Koloss',       type:'troop', cost:5, hp:2000, dmg:140, hit:1.5, spd:26, range:24, count:1, air:false, targetsAir:false, buildingOnly:true, size:14, color:'#c9a06a', desc:'Riesen-Tank, greift nur Gebäude an'},
  eisenwache:{name:'Eisenwache',   type:'troop', cost:5, hp:1600, dmg:95,  hit:1.2, spd:30, range:24, count:1, air:false, targetsAir:false, buildingOnly:false,size:13, color:'#8fa3c8', desc:'Zäher Nahkämpfer'},
  sturmritter:{name:'Sturmritter', type:'troop', cost:4, hp:950, dmg:130, hit:1.3, spd:40, range:22, count:1, air:false, targetsAir:false, buildingOnly:false,size:12, color:'#e0d0a0', desc:'Mini-Tank, solider Schaden'},
  walkuere:  {name:'Walküre',      type:'troop', cost:4, hp:820,  dmg:110, hit:1.4, spd:38, range:26, count:1, air:false, targetsAir:false, buildingOnly:false,size:12, color:'#e58bb0', splash:34, desc:'Flächen-Nahkampf gegen Schwärme'},
  drachling: {name:'Drachling',    type:'troop', cost:4, hp:720,  dmg:90,  hit:1.4, spd:44, range:92, count:1, air:true,  targetsAir:true,  buildingOnly:false,size:12, color:'#7ad0ff', splash:26, ranged:true, desc:'Fliegt, Flächenschaden, trifft Luft'},
  bogen:     {name:'Bogenschützinnen',type:'troop',cost:3,hp:170, dmg:48,  hit:1.1, spd:42, range:118,count:2, air:false, targetsAir:true,  buildingOnly:false,size:8,  color:'#8ce0a0', ranged:true, desc:'2 Fernkämpferinnen, treffen Luft'},
  speer:     {name:'Speerträger',  type:'troop', cost:3, hp:130,  dmg:42,  hit:1.0, spd:46, range:104,count:3, air:false, targetsAir:true,  buildingOnly:false,size:7,  color:'#c8b48c', ranged:true, desc:'3 günstige Fernkämpfer'},
  kobolde:   {name:'Kobold-Schwarm',type:'troop',cost:2, hp:95,   dmg:58,  hit:0.9, spd:60, range:20, count:4, air:false, targetsAir:false, buildingOnly:false,size:7,  color:'#b6d95a', desc:'4 schnelle, fragile Nahkämpfer'},
  fledermaus:{name:'Fledermäuse',  type:'troop', cost:3, hp:50,   dmg:34,  hit:1.0, spd:64, range:18, count:5, air:true,  targetsAir:true,  buildingOnly:false,size:6,  color:'#a88cff', desc:'5 fliegende Mini-Angreifer'},
  scharf:    {name:'Scharfschütze',type:'troop', cost:3, hp:140,  dmg:135, hit:1.7, spd:36, range:190,count:1, air:false, targetsAir:true,  buildingOnly:false,size:9,  color:'#d0d0d0', ranged:true, desc:'Extreme Reichweite, Einzelziel'},
  turm:      {name:'Wächterturm',  type:'building',cost:3,hp:400,  dmg:72,  hit:0.9, spd:0,  range:132,count:1, air:false, targetsAir:false, buildingOnly:false,size:13, color:'#9a9a9a', ranged:true, life:30, desc:'Statische Verteidigung, verfällt'},
  rammbock:  {name:'Rammbock',     type:'troop', cost:5, hp:1500, dmg:120, hit:1.6, spd:34, range:22, count:1, air:false, targetsAir:false, buildingOnly:true, size:13, color:'#a97b4c', desc:'Tank, stürmt nur auf Gebäude'},
  // Zauber
  feuersturm:{name:'Feuersturm',   type:'spell', cost:4, radius:46, dmg:360, color:'#ff7a2c', desc:'Großer Flächenschaden'},
  blitz:     {name:'Blitzschlag',  type:'spell', cost:2, radius:34, dmg:130, stun:0.9, color:'#ffe14d', desc:'Kleiner Schaden + Betäubung'},
  pfeile:    {name:'Pfeilhagel',   type:'spell', cost:3, radius:62, dmg:150, color:'#a0e0ff', desc:'Weiter Radius, gegen Schwärme'},
  frost:     {name:'Frostnova',    type:'spell', cost:3, radius:46, dmg:70, slow:0.55, slowDur:3.0, color:'#7fd8ff', desc:'Verlangsamt Gegner stark'},
};

/* Sprite-Silhouetten pro Karte (k = Zeichen-Routine) */
const SHAPE = {
  koloss:    {k:'humanoid', bulk:1.7, helmet:true,  weapon:'club',  skin:'#caa06a'},
  rammbock:  {k:'ram'},
  eisenwache:{k:'humanoid', bulk:1.25,helmet:true,  weapon:'shield',skin:'#e8c39a'},
  sturmritter:{k:'humanoid',bulk:1.15,helmet:true,  weapon:'sword', skin:'#e8c39a'},
  walkuere:  {k:'humanoid', bulk:1.05,helmet:false, weapon:'axe',   skin:'#f0d0b0', hair:'#e8b04d'},
  bogen:     {k:'humanoid', bulk:0.9, helmet:false, weapon:'bow',   skin:'#f0d0b0', hair:'#6a4a2a'},
  speer:     {k:'humanoid', bulk:0.85,helmet:true,  weapon:'spear', skin:'#e8c39a'},
  scharf:    {k:'humanoid', bulk:0.95,helmet:true,  weapon:'rifle', skin:'#e0e0e0'},
  kobolde:   {k:'goblin'},
  drachling: {k:'dragon'},
  fledermaus:{k:'bat'},
  turm:      {k:'cannon'},
};
Object.keys(SHAPE).forEach(id=>{ if(CARDS[id]) CARDS[id].sp = SHAPE[id]; });

/* ---------- Decks (je 8 Karten) ---------- */
const DECKS = [
  {name:'Beatdown', desc:'Großer Push mit Koloss & Support', cards:['koloss','drachling','bogen','feuersturm','blitz','speer','walkuere','kobolde']},
  {name:'Schwarm-Zyklus', desc:'Günstig, schnell, viele Einheiten', cards:['kobolde','fledermaus','speer','bogen','blitz','turm','sturmritter','pfeile']},
  {name:'Kontrolle', desc:'Defensiv kontern, dann kontern', cards:['eisenwache','walkuere','scharf','turm','frost','feuersturm','bogen','drachling']},
  {name:'Luftangriff', desc:'Druck aus der Luft', cards:['drachling','fledermaus','bogen','sturmritter','blitz','feuersturm','speer','rammbock']},
];

/* ---------- Arenen (Thema + Schwierigkeit) ---------- */
const ARENAS = [
  {name:'Übungshof', desc:'Ruhiger Start für neue Kommandanten', diff:'Leicht',
   grass:'#294a2e', grass2:'#22402a', river:'#2f5f8a', river2:'#3a72a3', path:'#6b5636', accent:'#4caf6a'},
  {name:'Frostgipfel', desc:'Eisige Höhen, wachsame Gegner', diff:'Normal',
   grass:'#26384f', grass2:'#20304a', river:'#6fb7d9', river2:'#8fd0ec', path:'#c9d6e6', accent:'#8fd0ec'},
  {name:'Lavagrube', desc:'Heißer Boden, aggressive KI', diff:'Schwer',
   grass:'#3a241f', grass2:'#301c19', river:'#c4471f', river2:'#e6631f', path:'#5a3320', accent:'#ff7a2c'},
  {name:'Königsarena', desc:'Prunk & Präzision — Meister-KI', diff:'Schwer',
   grass:'#2a2350', grass2:'#221c44', river:'#7a52c0', river2:'#9a6ee0', path:'#c9a94e', accent:'#f4c14e'},
];
const DIFF = {
  'Leicht': {react:1.5, eff:0.55, aggr:0.5},
  'Normal': {react:0.9, eff:0.8,  aggr:0.75},
  'Schwer': {react:0.5, eff:1.0,  aggr:1.0},
};

/* ---------- Globaler Zustand ---------- */
let sel = { deck:0, arena:0 };
let G = null;         // aktives Spiel
let canvas, ctx, scaleX=1, scaleY=1;
let raf=0, lastT=0, acc=0;
const DT = 1/60;

/* ---------- Audio (dezente Blips, optional) ---------- */
let AC=null;
function beep(freq,dur,vol){ try{
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(), g=AC.createGain();
  o.frequency.value=freq; o.type='triangle'; g.gain.value=vol||0.04;
  o.connect(g); g.connect(AC.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+(dur||0.08));
  o.stop(AC.currentTime+(dur||0.08));
}catch(e){} }

/* ---------- Screen-Management ---------- */
const screens = {};
['menu','arenaSelect','deckSelect','battle','result'].forEach(id=>screens[id]=document.getElementById(id));
function show(id){ for(const k in screens) screens[k].classList.toggle('on', k===id); }

/* ---------- Deck-Auswahl UI ---------- */
function renderDeckList(){
  const el = document.getElementById('deckList'); el.innerHTML='';
  DECKS.forEach((d,i)=>{
    const box=document.createElement('div');
    box.className='card-pick'+(i===sel.deck?' sel':'');
    box.innerHTML = `<div class="hd"><h3 style="font-size:16px">${d.name}</h3>
      <span class="tag">${avgCost(d).toFixed(1)} ⌀ Elixier</span></div>
      <div class="tag">${d.desc}</div>
      <div class="mini-deck">${d.cards.map(miniCard).join('')}</div>`;
    box.onclick=()=>{ sel.deck=i; renderDeckList(); };
    el.appendChild(box);
  });
}
function miniCard(id){ const c=CARDS[id];
  return `<div class="mini"><span class="c">${c.cost||''}</span>${c.name}</div>`; }
function avgCost(d){ return d.cards.reduce((s,id)=>s+(CARDS[id].cost||0),0)/d.cards.length; }

/* ---------- Arena-Auswahl UI ---------- */
function renderArenaList(){
  const el=document.getElementById('arenaList'); el.innerHTML='';
  ARENAS.forEach((a,i)=>{
    const box=document.createElement('div');
    box.className='arena-pick'+(i===sel.arena?' sel':'');
    box.style.background=`linear-gradient(160deg,${a.grass},${a.river2})`;
    box.innerHTML=`<span class="lvl">${a.diff}</span><h3>${a.name}</h3><p>${a.desc}</p>`;
    box.onclick=()=>{ sel.arena=i; renderArenaList(); };
    el.appendChild(box);
  });
  document.getElementById('curDeckName').textContent = DECKS[sel.deck].name;
}

/* ============================================================
   SPIEL-START
   ============================================================ */
function startGame(){
  const arena = ARENAS[sel.arena];
  const diff = DIFF[arena.diff];
  G = {
    arena, diff,
    time: 180, overtime:false, ended:false,
    t: 0, shake: 0,
    towers: makeTowers(),
    units: [], projectiles: [], effects: [],
    player: newSide(DECKS[sel.deck].cards.slice()),
    enemy:  newSide(pickEnemyDeck().slice()),
    selCard: -1,
    lanesOpenEnemy:{L:false,R:false},   // Spieler-Türme des Gegners zerstört -> tiefer deployen
    lanesOpenPlayer:{L:false,R:false},
    aiTimer: 0,
    destroyed:{player:0, enemy:0},      // wie viele gegnerische Türme ich (player) zerstört habe etc.
  };
  G.bg = buildArenaBg(arena, G.towers);
  show('battle');
  setupCanvas();
  buildHand();
  updateHUD();
  lastT = performance.now(); acc=0;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}
function pickEnemyDeck(){ // Gegner nutzt ein anderes Deck als der Spieler
  let i = (sel.deck+1+Math.floor(Math.random()*(DECKS.length-1)))%DECKS.length;
  return DECKS[i].cards;
}
function newSide(deckCards){
  const d = deckCards.slice();
  // mischen
  for(let i=d.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[d[i],d[j]]=[d[j],d[i]];}
  return { elixir:5, deck:d, hand:d.slice(0,4), queue:d.slice(4) };
}
function cycleCard(side, handIndex){
  const played = side.hand[handIndex];
  side.queue.push(played);
  side.hand[handIndex] = side.queue.shift();
}

/* ============================================================
   CANVAS / INPUT
   ============================================================ */
function setupCanvas(){
  canvas=document.getElementById('cv'); ctx=canvas.getContext('2d');
  const wrap=document.getElementById('fieldWrap');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const rect=wrap.getBoundingClientRect();
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scaleX = rect.width / W; scaleY = rect.height / H;
  canvas.onpointerdown = onField;
}
window.addEventListener('resize', ()=>{ if(G && screens.battle.classList.contains('on')) setupCanvas(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(G && screens.battle.classList.contains('on')) setupCanvas(); }, 250); });

function onField(e){
  if(!G || G.ended) return;
  if(G.selCard<0) return;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*W;
  const y=(e.clientY-rect.top)/rect.height*H;
  tryDeploy(G.selCard, x, y);
}

function canDeployPlayer(x,y){
  // Spieler deployt in eigener Hälfte (y > Fluss). Lanes öffnen sich bei zerstörten Gegner-Prinzentürmen.
  let minY = RIVER_B + 4;
  const lane = x<CENTER_X ? 'L':'R';
  if(G.lanesOpenEnemy[lane]) minY = 120;   // Gegner-Prinzenturm dieser Lane gefallen
  return y>=minY && y<=H-14 && x>=10 && x<=W-10;
}
function tryDeploy(handIndex, x, y){
  const id = G.player.hand[handIndex];
  const c = CARDS[id];
  if(G.player.elixir < c.cost) return;
  if(c.type==='spell'){
    castSpell('player', id, x, y);
  } else {
    if(!canDeployPlayer(x,y)) return;
    spawnCard('player', id, x, y);
  }
  G.player.elixir -= c.cost;
  cycleCard(G.player, handIndex);
  G.selCard=-1;
  buildHand(); updateHUD();
  beep(520,0.06,0.05);
}

/* ============================================================
   SPAWN / ZAUBER
   ============================================================ */
function spawnCard(side, id, x, y){
  const c=CARDS[id];
  const n=c.count||1;
  for(let i=0;i<n;i++){
    let ox=0, oy=0;
    if(n>1){ const a=(i/n)*Math.PI*2; ox=Math.cos(a)*11; oy=Math.sin(a)*9; }
    const u = {
      id, side, card:c,
      x: clamp(x+ox,8,W-8), y: clamp(y+oy,8,H-8),
      hp: c.hp, max:c.hp,
      cd: 0, target:null, crossed:false,
      slow:0, slowT:0, stun:0,
      air: !!c.air,
      bridge: nearestBridge(x),
      isBuilding: c.type==='building',
      life: c.life||0,
      anim: Math.random()*6, attackFx:0, hitFlash:0, faceX:1,
    };
    // Startseite bzgl. Fluss:
    u.crossed = side==='player' ? (u.y < RIVER_MID) : (u.y > RIVER_MID);
    G.units.push(u);
  }
  G.effects.push({type:'spawn', x, y, t:0, dur:0.4, color:c.color||'#fff'});
}
function castSpell(side, id, x, y){
  const c=CARDS[id];
  G.effects.push({type:'spell', x, y, t:0, dur:0.5, r:c.radius, color:c.color});
  const foes = side==='player' ? 'enemy':'player';
  // Einheiten
  for(const u of G.units){ if(u.side===foes && dist(u,{x,y})<=c.radius){
    u.hp -= c.dmg;
    if(c.stun) u.stun=Math.max(u.stun,c.stun);
    if(c.slow){ u.slow=Math.max(u.slow,c.slow); u.slowT=c.slowDur; }
  }}
  // Türme
  for(const t of G.towers){ if(t.alive && t.side===foes && dist(t,{x,y})<=c.radius){
    // Zauber machen an Türmen reduzierten Schaden
    t.hp -= c.dmg*0.35;
    if(t.hp<=0) killTower(t);
  }}
  beep(180,0.14,0.06);
}

/* ============================================================
   GAME LOOP
   ============================================================ */
function loop(now){
  raf=requestAnimationFrame(loop);
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  while(acc>=DT){ step(DT); acc-=DT; }
  render();
}

function elixirRate(){
  if(G.overtime) return 3/2.8;
  if(G.time<=60) return 2/2.8;
  return 1/2.8;
}
function step(dt){
  if(G.ended) return;
  G.t += dt;
  if(G.shake>0) G.shake*=0.86;
  // Zeit
  G.time -= dt;
  if(G.time<=0 && !G.overtime){
    if(G.destroyed.player===G.destroyed.enemy){ G.overtime=true; G.time=60; }
    else return finish();
  }
  if(G.overtime && G.time<=0) return finish();

  // Elixier
  const rate=elixirRate();
  G.player.elixir=Math.min(10, G.player.elixir+rate*dt);
  G.enemy.elixir =Math.min(10, G.enemy.elixir +rate*dt);

  // KI
  aiThink(dt);

  // Einheiten
  for(const u of G.units) updateUnit(u,dt);
  // Projektile
  for(const p of G.projectiles) updateProjectile(p,dt);
  // Türme
  for(const t of G.towers) if(t.alive) updateTower(t,dt);
  // Effekte
  for(const e of G.effects) e.t+=dt;

  // Aufräumen
  G.units = G.units.filter(u=>{
    if(u.hp<=0){ deathFx(u); return false; }
    if(u.isBuilding && u.life>0){ u.life-=dt; if(u.life<=0){ deathFx(u); return false; } }
    return true;
  });
  G.projectiles = G.projectiles.filter(p=>!p.dead);
  G.effects = G.effects.filter(e=>e.t<e.dur);

  // Overtime: erster Turm entscheidet
  if(G.overtime && (G.destroyed.player!==G.destroyed.enemy)) return finish();

  updateHUD();
}

/* ---------- Einheiten-Logik ---------- */
function updateUnit(u,dt){
  if(u.attackFx>0) u.attackFx-=dt;
  if(u.hitFlash>0) u.hitFlash-=dt;
  if(u.stun>0){ u.stun-=dt; return; }
  if(u.slowT>0){ u.slowT-=dt; if(u.slowT<=0) u.slow=0; }

  const c=u.card;
  // Statisches Gebäude: nur schießen
  if(u.isBuilding){ buildingFire(u,dt); return; }

  // Ziel suchen
  acquireTarget(u);

  // Bewegung / Angriff
  let goal = movementGoal(u);
  const tgt = u.target;
  if(tgt){
    const d = dist(u, tgt);
    const reach = c.range + (tgt.size||14);
    if(d<=reach){
      // Angreifen
      u.cd-=dt;
      if(u.cd<=0){ attack(u,tgt); u.cd=c.hit; }
      return;
    }
  }
  // laufen Richtung goal
  moveToward(u, goal, dt);
}

function movementGoal(u){
  const c=u.card;
  const enemySide = u.side==='player'?'enemy':'player';
  // Falls Ziel eine Einheit ist -> direkt dorthin
  if(u.target && u.target.card){ return {x:u.target.x, y:u.target.y}; }
  // Ansonsten Richtung Zielturm über Brücke
  const tower = u.target && u.target.hp!==undefined && u.target.max!==undefined ? u.target : nearestTower(u, enemySide);
  if(!tower) return {x:u.x, y:u.y};
  if(u.air || u.crossed){ return {x:tower.x, y:tower.y}; }
  // noch nicht über den Fluss -> zur Brücke
  const bx = BRIDGE_X[u.bridge];
  const crossY = u.side==='player' ? RIVER_T-6 : RIVER_B+6;
  // markiere crossed sobald über Flussmitte
  if(u.side==='player' && u.y<RIVER_MID) u.crossed=true;
  if(u.side==='enemy'  && u.y>RIVER_MID) u.crossed=true;
  return {x:bx, y:crossY};
}

function moveToward(u, goal, dt){
  const c=u.card;
  let dx=goal.x-u.x, dy=goal.y-u.y;
  const d=Math.hypot(dx,dy)||1;
  let spd=c.spd*(1-(u.slow||0));
  // Fluss-Sperre für Bodeneinheiten: nur auf Brücken queren
  let nx=u.x+dx/d*spd*dt, ny=u.y+dy/d*spd*dt;
  if(!u.air){
    if(ny>RIVER_T && ny<RIVER_B){
      const onBridge = BRIDGE_X.some(b=>Math.abs(nx-b)<BRIDGE_W/2);
      if(!onBridge){
        // horizontal zur nächsten Brücke drücken, vertikal bremsen
        const b=BRIDGE_X[nearestBridge(u.x)];
        nx = u.x + Math.sign(b-u.x)*spd*dt;
        ny = u.y + (dy>0?1:-1)*spd*dt*0.15;
      }
    }
  }
  // Separation (leichtes Auseinanderdrücken)
  for(const o of G.units){
    if(o===u || o.air!==u.air) continue;
    const ox=nx-o.x, oy=ny-o.y; const od=Math.hypot(ox,oy);
    const mind=(u.card.size+o.card.size)*0.9;
    if(od>0 && od<mind){ nx+=ox/od*(mind-od)*0.4; ny+=oy/od*(mind-od)*0.4; }
  }
  u.x=clamp(nx,6,W-6); u.y=clamp(ny,6,H-6);
  u.anim=(u.anim||0)+dt;
  const mdx=goal.x-u.x;
  if(Math.abs(mdx)>3) u.faceX = mdx<0 ? -1 : 1;
}

function acquireTarget(u){
  const c=u.card;
  // Ziel noch gültig?
  if(u.target){
    const t=u.target;
    const alive = t.card ? t.hp>0 : t.alive;
    if(!alive) u.target=null;
    else if(t.card && dist(u,t)>c.range+120) u.target=null; // Truppe zu weit -> neu bewerten
  }
  const enemySide=u.side==='player'?'enemy':'player';
  // Nur-Gebäude-Angreifer: immer Turm
  if(c.buildingOnly){ u.target=nearestTower(u,enemySide); return; }
  // sonst: nächste Truppe im Aggro-Radius, sonst Turm
  let best=null, bd=1e9; const aggro=Math.max(c.range+40, 90);
  for(const o of G.units){
    if(o.side===enemySide){
      if(o.air && !c.targetsAir) continue;   // kann Luft nicht treffen
      const d=dist(u,o);
      if(d<aggro && d<bd){ bd=d; best=o; }
    }
  }
  if(best){ u.target=best; return; }
  // sonst Turm (Turm zählt als Boden -> immer angreifbar)
  u.target=nearestTower(u,enemySide);
}

function attack(u,tgt){
  const c=u.card;
  u.attackFx=0.2;
  if(c.ranged){
    G.projectiles.push({x:u.x,y:u.y, tx:tgt.x,ty:tgt.y, target:tgt, side:u.side,
      dmg:c.dmg, splash:c.splash||0, spd:260, color:c.color, dead:false});
  } else {
    applyDamage(tgt, c.dmg, u.side, c.splash||0, u);
  }
}
function buildingFire(u,dt){
  const c=u.card; u.cd-=dt;
  const enemySide=u.side==='player'?'enemy':'player';
  // Ziel: nächste Truppe in Reichweite
  let best=null,bd=1e9;
  for(const o of G.units){ if(o.side===enemySide){
    if(o.air && !c.targetsAir) continue;
    const d=dist(u,o); if(d<c.range && d<bd){bd=d;best=o;}
  }}
  if(best && u.cd<=0){
    G.projectiles.push({x:u.x,y:u.y,tx:best.x,ty:best.y,target:best,side:u.side,
      dmg:c.dmg,splash:0,spd:280,color:c.color,dead:false});
    u.cd=c.hit;
  }
}

function updateProjectile(p,dt){
  const t=p.target;
  const tx = t && (t.hp>0||t.alive) ? t.x : p.tx;
  const ty = t && (t.hp>0||t.alive) ? t.y : p.ty;
  const dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy);
  if(d<8){
    if(t && (t.card? t.hp>0 : t.alive)) applyDamage(t,p.dmg,p.side,p.splash,null,{x:tx,y:ty});
    else if(p.splash) splashAt(tx,ty,p.splash,p.dmg,p.side);
    p.dead=true; return;
  }
  p.x+=dx/d*p.spd*dt; p.y+=dy/d*p.spd*dt;
}

function applyDamage(tgt, dmg, side, splash, attacker, at){
  if(splash){ splashAt(tgt.x,tgt.y,splash,dmg,side); return; }
  if(tgt.card){ tgt.hp-=dmg; tgt.hitFlash=0.12; }
  else if(tgt.alive){ tgt.hp-=dmg; if(tgt.hp<=0) killTower(tgt); }
}
function splashAt(x,y,r,dmg,side){
  const foes=side==='player'?'enemy':'player';
  for(const o of G.units){ if(o.side===foes && dist(o,{x,y})<=r){ o.hp-=dmg; o.hitFlash=0.12; } }
  for(const t of G.towers){ if(t.alive && t.side===foes && dist(t,{x,y})<=r){ t.hp-=dmg*0.5; if(t.hp<=0) killTower(t);} }
  G.effects.push({type:'hit',x,y,t:0,dur:0.25,r});
}

/* ---------- Türme ---------- */
function updateTower(t,dt){
  if(t.king && !t.active) return;      // König inaktiv bis aktiviert
  t.cd-=dt;
  const enemySide=t.side==='player'?'enemy':'player';
  let best=null,bd=1e9;
  for(const o of G.units){ if(o.side===enemySide){
    const d=dist(t,o); if(d<t.r && d<bd){bd=d;best=o;}
  }}
  if(best && t.cd<=0){
    G.projectiles.push({x:t.x,y:t.y,tx:best.x,ty:best.y,target:best,side:t.side,
      dmg:t.dmg,splash:0,spd:300,color:'#fff',dead:false});
    t.cd=t.hit; t.fireFx=0.15;
  }
  if(t.fireFx>0) t.fireFx-=dt;
}
function killTower(t){
  if(!t.alive) return;
  t.alive=false; t.hp=0;
  G.shake = t.king ? 9 : 6;
  beep(120,0.3,0.08);
  G.effects.push({type:'boom',x:t.x,y:t.y,t:0,dur:0.6});
  // König aktivieren, wenn ein Prinzenturm derselben Seite fällt
  if(!t.king){
    const king=G.towers.find(k=>k.king && k.side===t.side);
    if(king) king.active=true;
    // Lane öffnen für Angreifer
    const lane = t.x<CENTER_X?'L':'R';
    if(t.side==='enemy') G.lanesOpenEnemy[lane]=true;
    else G.lanesOpenPlayer[lane]=true;
  }
  // Kronen zählen
  if(t.side==='enemy') G.destroyed.player++;   // ich habe Gegner-Turm zerstört
  else G.destroyed.enemy++;
  // König tot -> Ende
  if(t.king){ G.ended=true; finish(); }
}

/* ---------- KI-Gegner ---------- */
function aiThink(dt){
  const S=G.enemy, d=G.diff;
  G.aiTimer-=dt;
  if(G.aiTimer>0) return;
  G.aiTimer = d.react*(0.7+Math.random()*0.6);

  // Bedrohung: eigene (Spieler-)Einheiten auf Gegnerhälfte
  let threat=null, tval=0;
  for(const u of G.units){ if(u.side==='player' && u.y<RIVER_B+40){
    const v=u.card.cost*(u.hp/u.max); if(v>tval){tval=v;threat=u;}
  }}

  // Verteidigen bei Bedrohung
  if(threat && Math.random()<d.eff){
    // Schwarm? -> Zauber
    const swarm = G.units.filter(u=>u.side==='player'&&dist(u,threat)<40).length>=3;
    if(swarm){ const sp=handSpell(S); if(sp && S.elixir>=CARDS[sp.id].cost){ aiPlay(S,sp.i,threat.x,threat.y); return; } }
    // günstige Konter-Einheit hinter/gegen die Bedrohung
    const def=cheapestTroop(S);
    if(def && S.elixir>=CARDS[def.id].cost){
      const px = threat.x<CENTER_X?BRIDGE_X[0]:BRIDGE_X[1];
      aiPlay(S,def.i, px, RIVER_T-30); return;
    }
  }

  // Angreifen bei Elixiervorteil
  const wantPush = S.elixir> (7 - d.aggr*2) && S.elixir>=G.player.elixir-1;
  if(wantPush && Math.random()<0.6+d.aggr*0.3){
    // Tank falls vorhanden, sonst irgendeine Einheit
    const tank=handTank(S), lane=Math.random()<0.5?0:1;
    const px=BRIDGE_X[lane], py=70;
    if(tank && S.elixir>=CARDS[tank.id].cost){ aiPlay(S,tank.i,px,py); return; }
    const any=cheapestTroop(S);
    if(any && S.elixir>=CARDS[any.id].cost){ aiPlay(S,any.i,px,py); return; }
  }

  // Support hinter eigenem vorrückenden Tank
  const myTank=G.units.find(u=>u.side==='enemy'&&u.card.hp>=900&&u.y>120);
  if(myTank){
    const sup=handSupport(S);
    if(sup && S.elixir>=CARDS[sup.id].cost && Math.random()<d.eff){
      aiPlay(S,sup.i, myTank.x, Math.max(60,myTank.y-40)); return;
    }
  }
}
function aiPlay(S,handIndex,x,y){
  const id=S.hand[handIndex], c=CARDS[id];
  if(S.elixir<c.cost) return;
  // Gegner-Deployzone: obere Hälfte (y<Fluss), Lanes öffnen bei zerstörten Spielertürmen
  if(c.type!=='spell'){
    let maxY=RIVER_T-4; const lane=x<CENTER_X?'L':'R';
    if(G.lanesOpenPlayer[lane]) maxY=440;
    y=clamp(y,20,maxY); x=clamp(x,12,W-12);
    spawnCard('enemy',id,x,y);
  } else {
    castSpell('enemy',id,x,y);
  }
  S.elixir-=c.cost; cycleCard(S,handIndex);
}
function handSpell(S){ for(let i=0;i<4;i++){ if(CARDS[S.hand[i]].type==='spell') return {i,id:S.hand[i]}; } return null; }
function handTank(S){ let best=null; for(let i=0;i<4;i++){ const c=CARDS[S.hand[i]]; if(c.type==='troop'&&c.hp>=900){ if(!best||c.hp>CARDS[best.id].hp) best={i,id:S.hand[i]}; } } return best; }
function handSupport(S){ for(let i=0;i<4;i++){ const c=CARDS[S.hand[i]]; if(c.type==='troop'&&c.ranged) return {i,id:S.hand[i]}; } return null; }
function cheapestTroop(S){ let best=null; for(let i=0;i<4;i++){ const c=CARDS[S.hand[i]]; if(c.type!=='spell'){ if(!best||c.cost<CARDS[best.id].cost) best={i,id:S.hand[i]}; } } return best; }

/* ============================================================
   RENDERING
   ============================================================ */
function render(){
  if(!G) return;
  const a=G.arena;
  ctx.fillStyle='#05070d'; ctx.fillRect(-12,-12,W+24,H+24);
  ctx.save();
  if(G.shake>0.4){ ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake); }
  if(G.bg) ctx.drawImage(G.bg,0,0,W,H);
  drawRiver(a); drawBridges(a);

  // Deploy-Zone Hinweis (pulsierend)
  if(G.selCard>=0){
    const c=CARDS[G.player.hand[G.selCard]];
    const pulse=0.09+Math.sin(G.t*6)*0.04;
    if(c.type!=='spell'){
      ctx.fillStyle='rgba(90,155,255,'+pulse+')';
      ctx.fillRect(0, RIVER_B+4, W, H-(RIVER_B+4));
      if(G.lanesOpenEnemy.L){ ctx.fillRect(0,120,CENTER_X,H-120); }
      if(G.lanesOpenEnemy.R){ ctx.fillRect(CENTER_X,120,CENTER_X,H-120); }
    } else {
      ctx.fillStyle='rgba(255,120,60,'+pulse*0.7+')'; ctx.fillRect(0,0,W,H);
    }
  }

  for(const t of G.towers) drawTower(t);
  for(const e of G.effects) if(e.type==='spell'||e.type==='hit') drawEffect(e);
  // Einheiten nach y sortieren -> Tiefeneindruck
  const us=G.units.slice().sort((p,q)=>p.y-q.y);
  for(const u of us) drawSprite(u);
  for(const p of G.projectiles) drawProjectile(p);
  for(const e of G.effects) if(e.type!=='spell'&&e.type!=='hit') drawEffect(e);
  drawVignette(a);
  ctx.restore();
}

function drawTower(t){
  const team=t.side==='player'?'#3a7bff':'#ff5a52';
  const s=t.king?22:18;
  if(!t.alive){
    ctx.fillStyle='rgba(28,28,36,0.65)'; roundRect(t.x-s,t.y-s*0.3,2*s,s*1.1,4);ctx.fill();
    ctx.fillStyle='rgba(65,65,78,0.7)';
    for(let i=0;i<6;i++){const a=i*1.25;ctx.beginPath();
      ctx.arc(t.x+Math.cos(a)*s*0.7,t.y+Math.sin(a)*s*0.45,s*0.22,0,7);ctx.fill();}
    return;
  }
  drawShadow(t.x, t.y+s*0.95, s*1.15);
  // Stein-Sockel
  ctx.fillStyle=shade(team,-58); roundRect(t.x-s,t.y-s*0.55,2*s,s*1.75,5);ctx.fill();
  // Turmkörper mit Schräg-Schattierung

function drawSprite(u){

  const lunge = u.attackFx>0 ? Math.sin((1-u.attackFx/0.2)*Math.PI)*s*0.45 : 0;

  ctx.save();

  const o={s, team:u.side==='player'?'#3a7bff':'#ff5a52', flash, phase:u.anim,

  const k=(c.sp&&c.sp.k) || (u.air?'bat':'goblin');
  (SPRITES[k]||SPRITES.goblin)(o);
  ctx.restore();
  // Status-Ringe
  if(u.slow>0){ ctx.strokeStyle='rgba(127,216,255,0.9)'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(u.x,u.y,s+4,0,7);ctx.stroke(); }
  if(u.stun>0){ ctx.fillStyle='#ffe14d';
    for(let i=0;i<3;i++){const a=G.t*7+i*2.1;
      ctx.beginPath();ctx.arc(u.x+Math.cos(a)*(s+3),u.y-s*1.6+Math.sin(a)*2,1.5,0,7);ctx.fill();}}
  hpbar(u.x, u.y - s*1.85 - hover, Math.max(22,s*2.3), u.hp/u.max, o.team, 6);
}

  goblin(o){

function spWeapon(o,bw,bh){
  const s=o.s, w=o.sp.weapon, hx=bw*0.5, hy=-bh*0.1;
  const metal=o.flash?'#fff':'#d8dde6', wood=o.flash?'#fff':'#7a5230';

  if(w==='spear'){ ctx.strokeStyle=wood; ctx.lineWidth=s*0.14;
    ctx.beginPath();ctx.moveTo(hx,-bh*0.95);ctx.lineTo(hx+s*0.1,bh*0.5);ctx.stroke();
    ctx.fillStyle=metal;ctx.beginPath();ctx.moveTo(hx,-bh*1.1);ctx.lineTo(hx-s*0.16,-bh*0.82);ctx.lineTo(hx+s*0.16,-bh*0.82);ctx.closePath();ctx.fill(); }
  else if(w==='bow'){ ctx.strokeStyle=wood; ctx.lineWidth=s*0.12;
    ctx.beginPath();ctx.arc(hx+s*0.2,hy,s*0.75,-Math.PI*0.55,Math.PI*0.55);ctx.stroke(); }
  else if(w==='sword'){ ctx.strokeStyle=metal;ctx.lineWidth=s*0.16;
    ctx.beginPath();ctx.moveTo(hx,hy*0.5);ctx.lineTo(hx+s*0.2,-bh*0.75);ctx.stroke(); }
  else if(w==='axe'){ ctx.strokeStyle=wood;ctx.lineWidth=s*0.13;
    ctx.beginPath();ctx.moveTo(hx,-bh*0.7);ctx.lineTo(hx,bh*0.3);ctx.stroke();
    ctx.fillStyle=metal;ctx.beginPath();ctx.arc(hx,-bh*0.55,s*0.34,-Math.PI*0.5,Math.PI*0.5);ctx.fill(); }
  else if(w==='club'){ ctx.strokeStyle=wood;ctx.lineWidth=s*0.3;
    ctx.beginPath();ctx.moveTo(hx*0.8,bh*0.2);ctx.lineTo(hx+s*0.2,-bh*0.65);ctx.stroke();
    ctx.fillStyle=wood;ctx.beginPath();ctx.arc(hx+s*0.2,-bh*0.72,s*0.34,0,7);ctx.fill(); }
  else if(w==='rifle'){ ctx.strokeStyle=o.flash?'#fff':'#4a4a55';ctx.lineWidth=s*0.14;
    ctx.beginPath();ctx.moveTo(hx-s*0.2,hy);ctx.lineTo(hx+bh*0.95,hy-s*0.1);ctx.stroke(); }
  else if(w==='shield'){ ctx.fillStyle=o.flash?'#fff':o.team;
    ctx.beginPath();ctx.arc(-bw*0.55,hy,s*0.42,0,7);ctx.fill();
    ctx.strokeStyle=metal;ctx.lineWidth=s*0.12;
    ctx.beginPath();ctx.moveTo(hx,hy*0.5);ctx.lineTo(hx+s*0.15,-bh*0.6);ctx.stroke(); }
}
function drawShadow(x,y,rx){ ctx.fillStyle='rgba(0,0,0,0.26)';
  ctx.beginPath();ctx.ellipse(x,y,rx,rx*0.45,0,0,7);ctx.fill(); }

function drawProjectile(p){
  const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy)||1;
  ctx.strokeStyle=p.color||'#fff'; ctx.globalAlpha=0.5; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-dx/d*9,p.y-dy/d*9);ctx.stroke();
  ctx.globalAlpha=1;
  ctx.save(); ctx.shadowColor=p.color||'#fff'; ctx.shadowBlur=7;
  ctx.fillStyle=p.color||'#fff'; ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
  ctx.restore();
}

function drawEffect(e){
  const k=e.t/e.dur;
  ctx.save();
  if(e.type==='spell'){
    ctx.globalAlpha=0.4*(1-k); ctx.fillStyle=e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*(0.5+k*0.8),0,7);ctx.fill();
    ctx.globalAlpha=0.85*(1-k); ctx.strokeStyle=e.color; ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*(0.6+k*0.7),0,7);ctx.stroke();
  } else if(e.type==='hit'){
    ctx.globalAlpha=0.7*(1-k); ctx.fillStyle='#fff';
    for(let i=0;i<6;i++){ const a=i*1.05+e.x; const rr=(e.r||10)*(0.3+k);
      ctx.beginPath();ctx.arc(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr,1.6,0,7);ctx.fill(); }
  } else if(e.type==='boom'){
    ctx.globalAlpha=1-k;
    ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(e.x,e.y,16*k+3,0,7);ctx.fill();
    ctx.fillStyle='#ffb14d'; ctx.beginPath();ctx.arc(e.x,e.y,34*k+6,0,7);ctx.fill();
    ctx.strokeStyle='#ff7a2c'; ctx.lineWidth=3; ctx.beginPath();ctx.arc(e.x,e.y,46*k+6,0,7);ctx.stroke();
    ctx.fillStyle='#ffd24d';
    for(let i=0;i<8;i++){ const a=i*0.8; const rr=48*k+8;
      ctx.beginPath();ctx.arc(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr,2.4*(1-k)+1,0,7);ctx.fill(); }
  } else if(e.type==='spawn'){
    ctx.globalAlpha=1-k; ctx.strokeStyle=e.color; ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(e.x,e.y,18*(1-k)+4,0,7);ctx.stroke();
  } else if(e.type==='death'){
    ctx.globalAlpha=1-k; ctx.fillStyle=e.color;
    for(let i=0;i<5;i++){ const a=i*1.3; const rr=e.size*(1+k*1.6);
      ctx.beginPath();ctx.arc(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr,e.size*0.35*(1-k)+0.5,0,7);ctx.fill(); }
  }
  ctx.restore();
}
function deathFx(u){ G.effects.push({type:'death',x:u.x,y:u.y,t:0,dur:0.3,size:u.card.size,color:u.card.color}); }

/* ---------- Zeichen-Helfer ---------- */
function hpbar(cx,y,w,frac,col,h){
  h=h||6; frac=clamp(frac,0,1);
  ctx.fillStyle='rgba(0,0,0,0.72)'; roundRect(cx-w/2-1.5,y-1.5,w+3,h+3,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(cx-w/2,y,w,h);
  ctx.fillStyle = frac>0.35 ? col : '#ff4d44';
  ctx.fillRect(cx-w/2,y,w*frac,h);
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(cx-w/2,y,w*frac,1.5);
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }

/* ---------- Farb-Helfer ---------- */
function shade(hex,amt){ const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function hexA(hex,al){ const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+al+')'; }

/* ---------- Statischer Arena-Hintergrund (einmal pro Spiel) ---------- */
function buildArenaBg(a, towers){
  const cn=document.createElement('canvas'); cn.width=W; cn.height=H;
  const g=cn.getContext('2d');
  g.fillStyle=a.grass; g.fillRect(0,0,W,H);
  const T=26;
  for(let y=0;y<H;y+=T){ for(let x=0;x<W;x+=T){
    if((((x/T)|0)+((y/T)|0))%2===0){ g.fillStyle=a.grass2; g.fillRect(x,y,T,T); }
  }}
  for(let i=0;i<650;i++){ g.fillStyle='rgba(255,255,255,'+(Math.random()*0.03)+')';
    g.fillRect(Math.random()*W,Math.random()*H,2,2); }
  // Lane-Pfade
  g.fillStyle=hexA(a.path,0.45);
  BRIDGE_X.forEach(bx=>{ g.fillRect(bx-11,0,22,H); });
  // Turm-Podeste
  towers.forEach(t=>{ const s=t.king?26:22;
    g.fillStyle='rgba(0,0,0,0.16)'; g.beginPath();g.ellipse(t.x,t.y+s*0.5,s*1.25,s*0.7,0,0,7);g.fill();
    g.fillStyle=hexA(a.path,0.7); g.beginPath();g.ellipse(t.x,t.y+s*0.35,s*1.1,s*0.62,0,0,7);g.fill(); });
  // Rahmen
  g.strokeStyle=a.accent; g.globalAlpha=0.5; g.lineWidth=6; g.strokeRect(3,3,W-6,H-6);
  g.globalAlpha=1; g.strokeStyle='rgba(0,0,0,0.3)'; g.lineWidth=2; g.strokeRect(7,7,W-14,H-14);
  return cn;
}
function drawRiver(a){
  const g=ctx.createLinearGradient(0,RIVER_T,0,RIVER_B);
  g.addColorStop(0,a.river); g.addColorStop(0.5,a.river2); g.addColorStop(1,a.river);
  ctx.fillStyle=g; ctx.fillRect(0,RIVER_T,W,RIVER_B-RIVER_T);
  ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fillRect(0,RIVER_T,W,2); ctx.fillRect(0,RIVER_B-2,W,2);
  ctx.save(); ctx.beginPath();ctx.rect(0,RIVER_T,W,RIVER_B-RIVER_T);ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=1.5;
  for(let i=0;i<5;i++){ const yy=RIVER_T+5+i*6; const off=(G.t*28+i*40);
    ctx.beginPath(); for(let x=-30;x<W+30;x+=8){ ctx.lineTo(x, yy+Math.sin((x+off)*0.12)*2); } ctx.stroke(); }
  ctx.restore();
}
function drawBridges(a){
  BRIDGE_X.forEach(bx=>{
    ctx.fillStyle=shade(a.path,-18); roundRect(bx-BRIDGE_W/2,RIVER_T-3,BRIDGE_W,RIVER_B-RIVER_T+6,4);ctx.fill();
    ctx.fillStyle=a.path; roundRect(bx-BRIDGE_W/2+3,RIVER_T-3,BRIDGE_W-6,RIVER_B-RIVER_T+6,3);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1;
    for(let y=RIVER_T; y<RIVER_B+4; y+=5){ ctx.beginPath();ctx.moveTo(bx-BRIDGE_W/2+3,y);ctx.lineTo(bx+BRIDGE_W/2-3,y);ctx.stroke(); }
    ctx.fillStyle=shade(a.path,-34);
    ctx.fillRect(bx-BRIDGE_W/2,RIVER_T-3,3,RIVER_B-RIVER_T+6);
    ctx.fillRect(bx+BRIDGE_W/2-3,RIVER_T-3,3,RIVER_B-RIVER_T+6);
  });
}
function drawVignette(a){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.32, W/2,H/2,H*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

/* ---------- Karten-Thumbnails (gleiche Figuren wie im Feld) ---------- */
const THUMBS={};
function makeThumb(id){
  if(THUMBS[id]) return THUMBS[id];
  const c=CARDS[id], S=60;
  const cn=document.createElement('canvas'); cn.width=S; cn.height=S;
  const old=ctx; ctx=cn.getContext('2d');
  ctx.translate(S/2, S*0.6);
  if(c.type==='spell'){
    ctx.save(); ctx.shadowColor=c.color; ctx.shadowBlur=10;
    ctx.fillStyle=c.color; ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath();ctx.arc(-4,-4,4,0,7);ctx.fill();
  } else {
    const sc = c.size>=13 ? 1.5 : 1.9; ctx.scale(sc,sc);
    const o={s:c.size, team:'#3a7bff', flash:false, phase:0.5, sp:c.sp||{}, color:c.color, gt:0.2};
    (SPRITES[(c.sp&&c.sp.k)||'goblin']||SPRITES.goblin)(o);
  }
  ctx=old;
  THUMBS[id]=cn.toDataURL(); return THUMBS[id];
}

/* ============================================================
   HUD
   ============================================================ */
function buildHand(){
  const hand=document.getElementById('hand'); hand.innerHTML='';
  G.player.hand.forEach((id,i)=>{
    const c=CARDS[id];
    const el=document.createElement('div');
    const cant = G.player.elixir < c.cost;
    el.className='hcard'+(G.selCard===i?' sel':'')+(cant?' cant':'');
    el.innerHTML=`<div class="nm">${c.name}</div>
      <div class="art" style="background-image:url(${makeThumb(id)});background-size:contain;background-repeat:no-repeat;background-position:center;"></div>
      <div class="cost">${c.cost}</div>`;
    el.onclick=()=>{ if(G.ended) return;
      G.selCard = (G.selCard===i? -1 : i); buildHand(); };
    hand.appendChild(el);
  });
  document.getElementById('nextCard').textContent = 'Nächste: '+CARDS[G.player.queue[0]].name;
}
function updateHUD(){
  // Elixier
  const bar=document.getElementById('elixBar');
  const full=Math.floor(G.player.elixir);
  if(bar.children.length!==10){ bar.innerHTML=''; for(let i=0;i<10;i++){const p=document.createElement('div');p.className='pip';bar.appendChild(p);} }
  for(let i=0;i<10;i++) bar.children[i].className='pip'+(i<full?' f':'');
  document.getElementById('elixNum').textContent=full;
  // Uhr
  const t=Math.max(0,Math.ceil(G.time));
  const mm=Math.floor(t/60), ss=t%60;
  const clk=document.getElementById('clock');
  clk.textContent=(G.overtime?'+':'')+mm+':'+String(ss).padStart(2,'0');
  clk.classList.toggle('dbl', G.time<=60 || G.overtime);
  // Kronen
  drawCrowns('crownsEnemy', G.destroyed.enemy, 'r');   // Kronen, die der Gegner geholt hat
  drawCrowns('crownsPlayer', G.destroyed.player, 'b');
  // Handkarten evtl. aktualisieren (Elixier-Gating)
  const hc=document.getElementById('hand').children;
  for(let i=0;i<hc.length;i++){ const id=G.player.hand[i]; if(!id) continue;
    hc[i].classList.toggle('cant', G.player.elixir<CARDS[id].cost); }
}
function drawCrowns(elId, n, cls){
  const el=document.getElementById(elId); el.innerHTML='';
  for(let i=0;i<3;i++){ const d=document.createElement('div');
    d.className='crown '+(i<n?cls:''); d.textContent=i<n?'♛':'·'; el.appendChild(d); }
}

/* ============================================================
   ENDE
   ============================================================ */
function finish(){
  if(G._done) return; G._done=true; G.ended=true;
  cancelAnimationFrame(raf);
  const mine=G.destroyed.player, foe=G.destroyed.enemy;
  let win = mine>foe;
  // König-Tod entscheidet direkt
  const pKing=G.towers.find(t=>t.king&&t.side==='player');
  const eKing=G.towers.find(t=>t.king&&t.side==='enemy');
  if(eKing && !eKing.alive) win=true;
  if(pKing && !pKing.alive) win=false;
  const draw = mine===foe && (pKing.alive&&eKing.alive);
  document.getElementById('resTitle').textContent = draw?'Unentschieden':(win?'Sieg! 🏆':'Niederlage');
  document.getElementById('resScore').textContent = `Kronen ${mine} – ${foe}`;
  document.getElementById('resSub').textContent = win
    ? 'Gut gepusht, Kommandant.'
    : draw ? 'Keiner konnte den Vorsprung holen.' : 'Der Gegner hatte die bessere Verteidigung.';
  show('result');
}

/* ============================================================
   UTILS
   ============================================================ */
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function nearestBridge(x){ return Math.abs(x-BRIDGE_X[0])<=Math.abs(x-BRIDGE_X[1])?0:1; }
function nearestTower(u,side){
  let best=null,bd=1e9, king=null;
  for(const t of G.towers){ if(t.side!==side||!t.alive) continue;
    if(t.king){ king=t; if(!t.active) continue; }  // König nur angreifen wenn keine anderen? -> wähle Prinzentürme zuerst
    const d=dist(u,t); if(d<bd){bd=d;best=t;}
  }
  if(best) return best;
  // sonst König (auch inaktiv als Ziel, damit Spiel endet)
  return king;
}
