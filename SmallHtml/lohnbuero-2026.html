<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lohnbüro 2026</title>
<style>
/* Layout: Arbeitsfläche mit Reitern links/oben, rechts daneben das Abrechnungsblatt wie ein Papierbeleg */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#18242c; --muted:#5b6a74; --line:#d3dade;
  --accent:#0d5c6e; --accent-ink:#ffffff; --accent-soft:#dcebee;
  --good:#1f7a43; --warn:#a15c00; --bad:#b3261e; --paper:#ffffff; --field:#f7f9fa;
  --f-ui: "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
  --f-head: "Bahnschrift", "DIN Alternate", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-num: "Cascadia Mono", "Consolas", "DejaVu Sans Mono", "Menlo", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11181c; --panel:#18222a; --ink:#e3eaee; --muted:#93a3ad; --line:#2c3a43;
  --accent:#5fb3c4; --accent-ink:#0b1a1f; --accent-soft:#1e3640;
  --good:#6cc48d; --warn:#e3a54f; --bad:#f08a80; --paper:#1b262e; --field:#141d23; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11181c; --panel:#18222a; --ink:#e3eaee; --muted:#93a3ad; --line:#2c3a43;
  --accent:#5fb3c4; --accent-ink:#0b1a1f; --accent-soft:#1e3640;
  --good:#6cc48d; --warn:#e3a54f; --bad:#f08a80; --paper:#1b262e; --field:#141d23; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:16px 10px;border-bottom:2px solid var(--ink)}
header.top h1{font-size:1.55rem;letter-spacing:.01em}
header.top h1 small{font:600 .72rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:600 13px var(--f-ui);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:4px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:3px solid transparent;background:none;border-radius:0;padding:9px 14px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:18px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 4px}
fieldset:first-of-type{border-top:0;padding-top:0}
legend{font:700 .72rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0 0 6px}
details>summary{cursor:pointer;font:700 .72rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:10px 0 6px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px}
input,select{font:14px var(--f-ui);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num);text-align:right}
input[type=checkbox]{width:auto}
.hint{font-size:11px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>label.f{flex:1 1 180px}
.notes{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.note{border-left:3px solid var(--warn);background:var(--field);padding:6px 10px;font-size:13px}
.note.info{border-left-color:var(--accent)}
.note.bad{border-left-color:var(--bad)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:700 .7rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr.sum td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
tr.sub td{font-weight:600;background:var(--field)}
.pill{display:inline-block;font:700 10px var(--f-ui);letter-spacing:.06em;padding:2px 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.pill.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.flag{font:600 10px var(--f-num);color:var(--muted)}
/* Abrechnungsbeleg */
.slip{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:22px 22px 18px;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(0,0,0,.4);min-width:0}
.slip-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.slip-head h2{font-size:1.15rem}
.slip .meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:12px;margin-bottom:14px}
.slip .meta div span{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.slip h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 4px;color:var(--accent)}
.payout{display:flex;justify-content:space-between;align-items:baseline;border:2px solid var(--ink);padding:10px 14px;margin-top:16px;font-family:var(--f-head);font-size:1.1rem}
.payout .num{font-size:1.35rem;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.legal{font-size:11px;color:var(--muted);margin-top:14px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{border-top:1px solid var(--line);padding-top:8px}
.step b{font-family:var(--f-head);font-weight:600}
.step code{font-family:var(--f-num);font-size:12px;white-space:pre-wrap;display:block;color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--field)}
.kpi span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:700 1.1rem var(--f-num)}
.malist{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.malist button{text-align:left;display:flex;justify-content:space-between;gap:8px}
.malist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
footer{margin-top:28px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px}
a{color:var(--accent)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-weight:600}
@media print{
  :root{--bg:#fff;--ink:#000;--paper:#fff;--line:#999;--muted:#444;--accent:#000;--field:#fff;color-scheme:light}
  body{padding:0}
  header.top,nav.tabs,footer,.noprint,#tab-abr .cols>.panel,.toast{display:none!important}
  section[hidden]{display:none!important}
  .cols{display:block}
  .slip{border:0;box-shadow:none;padding:0}
  #rechenweg{break-before:page}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Lohnbüro 2026 <small>Entgeltabrechnung &amp; Lohnkonto</small></h1>
  <div class="tools">
    <label class="btn" for="fileLoad">Datei öffnen</label>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
    <button id="btnSave" class="pri" type="button">Lohnkonten speichern</button>
    <button id="btnPrint" type="button">Abrechnung drucken</button>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="abr" aria-selected="true">Abrechnung</button>
  <button class="tab" role="tab" data-tab="ma" aria-selected="false">Mitarbeiter</button>
  <button class="tab" role="tab" data-tab="konto" aria-selected="false">Lohnkonto</button>
  <button class="tab" role="tab" data-tab="buch" aria-selected="false">Buchungssätze</button>
  <button class="tab" role="tab" data-tab="firma" aria-selected="false">Firma &amp; Werte 2026</button>
</nav>
<main>
  <section id="tab-abr">
    <div class="cols">
      <div class="panel">
        <div class="row">
          <label class="f">Mitarbeiter<select id="selMa"></select></label>
          <label class="f">Abrechnungsmonat<select id="selMonat"></select></label>
        </div>
        <div id="abrStatus" class="notes"></div>
        <form id="formMonat" autocomplete="off"></form>
        <div class="row" style="margin-top:12px">
          <button type="button" class="pri" id="btnBuchen">Im Lohnkonto speichern</button>
          <button type="button" id="btnVerwerfen">Monat aus Lohnkonto löschen</button>
        </div>
        <div id="confirmBox" class="note bad" hidden></div>
      </div>
      <div>
        <div id="slip" class="slip"></div>
        <div id="rechenweg" class="panel" style="margin-top:16px"></div>
      </div>
    </div>
  </section>

  <section id="tab-ma" hidden>
    <div class="cols">
      <div class="panel">
        <div class="malist" id="maList"></div>
        <div class="row"><button type="button" id="btnNeuMa">Neuer Mitarbeiter</button><button type="button" id="btnDelMa">Mitarbeiter löschen</button></div>
        <div id="delMaBox" class="note bad" hidden></div>
      </div>
      <div class="panel"><form id="formMa" autocomplete="off"></form></div>
    </div>
  </section>

  <section id="tab-konto" hidden>
    <div class="panel">
      <div class="row noprint"><label class="f">Mitarbeiter<select id="selMaKonto"></select></label><button type="button" id="btnCsv">Lohnkonto als CSV</button></div>
      <div id="kontoView"></div>
    </div>
  </section>

  <section id="tab-buch" hidden>
    <div class="panel">
      <div class="row"><label class="f">Monat<select id="selMonatBuch"></select></label></div>
      <div id="buchView"></div>
    </div>
  </section>

  <section id="tab-firma" hidden>
    <div class="cols">
      <div class="panel"><form id="formFirma" autocomplete="off"></form></div>
      <div class="panel" id="werteView"></div>
    </div>
  </section>
</main>
<footer>
  <span>Lohnbüro 2026 · Lohnsteuer nach BMF-Programmablaufplan 2026 (Bibliothek „lohnsteuerrechner“, MIT-Lizenz) · Keine Steuer- oder Rechtsberatung, Ergebnisse vor Verwendung prüfen.</span>
  <span>Mehr Selbstgebautes: <a href="https://itzwieseltal.wordpress.com" target="_blank" rel="noopener">itzwieseltal.wordpress.com</a></span>
</footer>
<div id="toast" class="toast" hidden></div>

/* ============================================================

function alterAm(geb, jahr, monat) {
  if (!geb) return 30;
  const g = new Date(geb + "T00:00:00");
  let a = jahr - g.getFullYear();
  if (monat < g.getMonth() + 1) a--;
  return a;
}

  return r2(F * ug + (og / (og - ug) - ug / (og - ug) * F) * (ae - ug));
}

  const { ug, og } = P.midi;
  return r2(og / (og - ug) * (ae - ug));
}
/* Summen der Vormonate aus dem Lohnkonto */
function ytd(maId, monat) {
  const k = state.konten[maId] || {};
  const s = { svTage: 0, beKV: 0, beRV: 0, re4: 0, sonstb: 0, fehlend: [] };
  for (let m = 1; m < monat; m++) {
    const rec = k[m];
    if (!rec) { s.fehlend.push(m); continue; }
    const r = rec.res;
    s.svTage += r.svTage; s.beKV += r.beKVjahr; s.beRV += r.beRVjahr; s.re4 += r.re4; s.sonstb += r.sonstb;
  }
  return s;

function compute(ma, monat, inp) {
  const F = state.firma, W = [], warn = [], lines = [], korr = [];
  const bl = blInfo(F.bundesland), sachsen = F.bundesland === "SN";
  const step = (t, c) => W.push({ t, c });
  const add = (bez, betrag, st, sv, art, sach) => { if (Math.abs(betrag) < 0.005 && !st && !sv) return; lines.push({ bez, betrag: r2(betrag), st: r2(st), sv: r2(sv), art, sach: !!sach }); };
  const svTage = Math.max(0, Math.min(30, num(inp.svTage) || 0));
  const teil = svTage / 30;
  const mini = ma.art === "minijob";
  const Y = ytd(ma.id, monat);
  if (Y.fehlend.length) warn.push(`Im Lohnkonto fehlen Vormonate (${Y.fehlend.map(m => MON[m - 1].slice(0, 3)).join(", ")}). Jahreswerte für Einmalzahlungen und sonstige Bezüge sind dann unvollständig.`);

  /* 1. Bezüge */
  let stdBasis;
  if (ma.lohnart === "monat") {
    const g = r2(num(ma.gehalt) * teil);
    stdBasis = num(ma.wochenstunden) > 0 ? num(ma.gehalt) / (num(ma.wochenstunden) * 13 / 3) : 0;
    add("Gehalt" + (svTage < 30 ? ` (${svTage}/30 Tage)` : ""), g, g, g, "lfd");
    step("Gehalt", `${eur(num(ma.gehalt))} €` + (svTage < 30 ? ` × ${svTage}/30 = ${eur(g)} €  (30-Tage-Methode, Teilmonat)` : ""));
    step("Stundenbasis für Zuschläge", `${eur(num(ma.gehalt))} € ÷ (${num(ma.wochenstunden)} h × 13/3) = ${eur(r2(stdBasis))} €/h`);
  } else {
    stdBasis = num(ma.stundenlohn);
    const g = r2(stdBasis * num(inp.stunden));

    step("Überstunden", `${num(inp.ueStunden)} h × ${eur(r2(stdBasis))} € × ${1 + num(inp.ueZuschlag) / 100} = ${eur(u)} €  (voll steuer- und SV-pflichtig)`);

  /* bAV */
  const bavEU = num(ma.bavEU), bavZ = r2(bavEU * num(ma.bavZuschussPct) / 100), bavAG = num(ma.bavAG);

  if (bavZ) add("bAV-Zuschuss Arbeitgeber (§ 1a Abs. 1a BetrAVG)", bavZ, bavZ, bavZ, "lfd");
  if (bavAG) add("bAV arbeitgeberfinanziert", bavAG, bavAG, bavAG, "lfd");
  if (bavT) {
    const sf = Math.min(bavT, P.bav.st), vf = Math.min(bavT, P.bav.sv);
    korr.push({ bez: "bAV steuerfrei (§ 3 Nr. 63 EStG) / SV-frei (§ 1 Abs. 1 Nr. 9 SvEV)", st: -sf, sv: -vf });
    step("Betriebliche Altersversorgung", `Beitrag gesamt = Entgeltumwandlung ${eur(bavEU)} € + AG-Zuschuss ${eur(bavZ)} € (${num(ma.bavZuschussPct)} %) + AG-finanziert ${eur(bavAG)} € = ${eur(bavT)} €\nsteuerfrei bis 8 % BBG RV (${eur(P.bav.st)} €/Monat): ${eur(sf)} €\nSV-frei bis 4 % BBG RV (${eur(P.bav.sv)} €/Monat): ${eur(vf)} €\nDer Gesamtbeitrag wird vom Netto an den Versorgungsträger abgeführt.`);
    if (bavT > P.bav.st) warn.push("bAV-Beitrag übersteigt die monatliche Steuerfreigrenze; der Mehrbetrag wird versteuert. (Die Grenze gilt jahresbezogen, hier vereinfacht monatlich.)");
  }

  /* Sachbezüge */
  const gs = num(inp.gutschein);
  if (gs) {
    const frei = gs <= P.sach.gutschein;
    add(`Sachbezug Gutschein/Guthabenkarte${frei ? " (50-€-Freigrenze)" : ""}`, gs, frei ? 0 : gs, frei ? 0 : gs, "lfd", true);
    step("Sachbezug Gutschein", frei ? `${eur(gs)} € ≤ 50 € Freigrenze (§ 8 Abs. 2 Satz 11 EStG) → steuer- und SV-frei` : `${eur(gs)} € > 50 € → Freigrenze entfällt, voller Betrag steuer- und SV-pflichtig`);
  }
  [["frueh", "Frühstück", P.sach.frueh], ["mittag", "Mittagessen", P.sach.mittag], ["abend", "Abendessen", P.sach.abend]].forEach(([k, b, w]) => {
    const n = num(inp[k]); if (!n) return;
    const v = r2(n * w);
    add(`Sachbezug ${b} (${n} × ${eur(w)} €)`, v, v, v, "lfd", true);
    step(`Sachbezug ${b}`, `${n} Mahlzeiten × amtlicher Sachbezugswert ${eur(w)} € = ${eur(v)} €`);
  });
  if (inp.unterkunft) {
    const v = r2(P.sach.unterkunft * teil);
    add("Sachbezug Unterkunft", v, v, v, "lfd", true);
  }
  /* Dienstwagen */
  let dwWert = 0, dwUSt = 0;
  if (num(ma.dwBLP) > 0) {
    const blp = Math.floor(num(ma.dwBLP) / 100) * 100;
    const satz = ma.dwArt === "elektro" ? (blp <= P.eAutoGrenze ? 0.25 : 0.5) : ma.dwArt === "hybrid" ? 0.5 : 1;
    const priv = r2(blp * satz / 100);
    let fahrt = 0, ftxt;
    if (ma.dwMethode === "tage") { fahrt = r2(blp * 0.002 / 100 * satz * num(ma.dwKm) * num(inp.dwTage)); ftxt = `${eur(blp)} € × 0,002 % × ${satz} × ${num(ma.dwKm)} km × ${num(inp.dwTage)} Tage = ${eur(fahrt)} €  (Einzelbewertung, max. 180 Tage/Jahr)`; }
    else { fahrt = r2(blp * 0.03 / 100 * satz * num(ma.dwKm)); ftxt = `${eur(blp)} € × 0,03 % × ${satz} × ${num(ma.dwKm)} km = ${eur(fahrt)} €`; }
    dwWert = Math.max(0, r2(priv + fahrt - num(ma.dwZuzahlung)));
    add(`Geldwerter Vorteil Firmenwagen (${satz} %-Regel)`, dwWert, dwWert, dwWert, "lfd", true);
    step("Firmenwagen", `Bruttolistenpreis abgerundet auf volle 100 €: ${eur(blp)} €\nPrivatnutzung: ${eur(blp)} € × ${satz} % = ${eur(priv)} €` + (satz < 1 ? `  (${ma.dwArt === "elektro" ? "Elektro" : "Hybrid"}: Bemessungsgrundlage gemindert)` : "") + `\nWohnung–Arbeit: ${ftxt}\nabzüglich Zuzahlung AN ${eur(num(ma.dwZuzahlung))} € → ${eur(dwWert)} €`);
  }
  /* Einmalzahlung */
  const ez = num(inp.ezBetrag);
  if (ez) add(inp.ezBez || "Einmalzahlung", ez, ez, ez, "ez");
  /* pauschal versteuert & steuerfrei */
  if (num(inp.pausch15)) add("Fahrtkostenzuschuss (pauschal 15 %, § 40 Abs. 2 S. 2 EStG)", num(inp.pausch15), 0, 0, "pausch");
  if (num(inp.pausch25)) add("Pauschal versteuert 25 % (z. B. Internet, Erholungsbeihilfe)", num(inp.pausch25), 0, 0, "pausch");
  if (num(inp.stfrei)) add("Steuer- und SV-freie Zuschüsse (z. B. Kita, Jobticket)", num(inp.stfrei), 0, 0, "stfrei");

  /* Summen */
  const brutto = r2(lines.reduce((a, l) => a + l.betrag, 0));
  const kSt = korr.reduce((a, k) => a + k.st, 0), kSv = korr.reduce((a, k) => a + k.sv, 0);
  const sum = (f, arts) => lines.filter(l => arts.includes(l.art)).reduce((a, l) => a + l[f], 0);
  const stLfd = Math.max(0, r2(sum("st", ["lfd"]) + kSt));
  const stEZ = r2(sum("st", ["ez"]));
  const svLfd = Math.max(0, r2(sum("sv", ["lfd"]) + kSv));
  const svEZ = r2(sum("sv", ["ez"]));
  step("Steuer- und SV-Brutto", `Gesamtbrutto ${eur(brutto)} €\nsteuerpflichtig laufend ${eur(stLfd)} € · sonstiger Bezug ${eur(stEZ)} €\nSV-pflichtig laufend ${eur(svLfd)} € · Einmalzahlung ${eur(svEZ)} €`);

  /* 2. Lohnsteuer */
  let lst = 0, soli = 0, kist = 0, pap = null, re4 = stLfd, sonstb = stEZ, pauschMini = 0;
  const kistSatz = bl[2];
  if (mini && ma.miniPauschal) {
    pauschMini = r2((stLfd + stEZ) * P.mini.st / 100);
    step("Lohnsteuer Minijob", `einheitliche Pauschsteuer 2 % trägt der Arbeitgeber: ${eur(stLfd + stEZ)} € × 2 % = ${eur(pauschMini)} €  (inkl. Soli und Kirchensteuer)`);
    re4 = 0; sonstb = 0;
  } else {
    const c = x => Math.round(x * 100);
    const age = alterAm(ma.geburt, P.jahr - 1, 12);
    const gebJ = ma.geburt ? +ma.geburt.slice(0, 4) : 1990;
    const alter1 = ma.geburt && ma.geburt <= "1962-01-01" ? 1 : 0;
    const pkvZuschussMon = ma.kv === "pkv" && !mini ? pkvZuschuss(ma, 1, sachsen) : 0;
    const inPAP = {
      LZZ: 2, STKL: +ma.stkl, RE4: c(re4), ZKF: +ma.stkl <= 4 ? num(ma.zkf) : 0, R: ma.konf === "-" ? 0 : 1,
      KVZ: ma.kv === "gkv" && !mini ? num(ma.zb) : 0, PKV: ma.kv === "pkv" || mini ? 1 : 0,
      PKPV: ma.kv === "pkv" && !mini ? c(num(ma.pkvKV) + num(ma.pkvPV)) : 0, PKPVAGZ: c(pkvZuschussMon),
      PVS: sachsen ? 1 : 0, PVZ: !ma.eltern && age >= 23 ? 1 : 0,
      PVA: ma.eltern ? Math.min(Math.max(num(ma.kinderU25) - 1, 0), 4) : 0,
      KRV: ma.rvFrei ? 1 : 0, ALV: ma.avFrei || mini ? 1 : 0,
      ALTER1: alter1, AJAHR: alter1 ? gebJ + 65 : 0,
      LZZFREIB: c(num(ma.freibetrag)), LZZHINZU: c(num(ma.hinzurechnung)),
      af: +ma.stkl === 4 && num(ma.faktor) > 0 && num(ma.faktor) < 1 ? 1 : 0, f: +ma.stkl === 4 && num(ma.faktor) > 0 ? num(ma.faktor) : 1
    };
    if (sonstb > 0) {
      inPAP.SONSTB = c(sonstb);
      inPAP.JRE4 = c(Y.re4 + re4 * (13 - monat) + Y.sonstb);
      inPAP.JFREIB = c(num(ma.freibetrag) * 12); inPAP.JHINZU = c(num(ma.hinzurechnung) * 12);
    }
    pap = window.PAP.calculate(2026, inPAP);
    lst = (pap.LSTLZZ + pap.STS) / 100;
    soli = (pap.SOLZLZZ + pap.SOLZS) / 100;
    const bk = (pap.BK + pap.BKS) / 100;
    kist = ma.konf === "-" ? 0 : fl2(bk * kistSatz / 100);
    step("Lohnsteuer (BMF-PAP 2026)", `Eingaben: Steuerklasse ${ma.stkl}${+ma.stkl === 4 && num(ma.faktor) < 1 ? " mit Faktor " + ma.faktor : ""}, Kinderfreibeträge ${inPAP.ZKF}, laufender Arbeitslohn ${eur(re4)} €` + (num(ma.freibetrag) ? `, Freibetrag ${eur(num(ma.freibetrag))} €` : "") + `\nVorsorgepauschale aus KV/PV/RV/AV-Merkmalen (Zusatzbeitrag ${inPAP.KVZ} %, PV-Zuschlag ${inPAP.PVZ ? "ja" : "nein"}, Abschläge ${inPAP.PVA})\nLohnsteuer laufend: ${eur(pap.LSTLZZ / 100)} €, Solidaritätszuschlag: ${eur(pap.SOLZLZZ / 100)} €` +
      (sonstb > 0 ? `\nSonstiger Bezug ${eur(sonstb)} € nach Jahrestabelle (Fünftelregelung nicht angewendet):\n  voraussichtlicher Jahresarbeitslohn = bisher ${eur(Y.re4)} € + ${13 - monat} × ${eur(re4)} € + frühere sonstige Bezüge ${eur(Y.sonstb)} € = ${eur(inPAP.JRE4 / 100)} €\n  Lohnsteuer darauf: ${eur(pap.STS / 100)} €, Soli: ${eur(pap.SOLZS / 100)} €` : "") +
      (ma.konf !== "-" ? `\nKirchensteuer: Bemessungsgrundlage ${eur(bk)} € × ${kistSatz} % (${bl[1]}) = ${eur(kist)} €` : ""));
  }

  /* 3. Sozialversicherung */
  const sv = { kv: { be: 0, an: 0, ag: 0 }, pv: { be: 0, an: 0, ag: 0 }, rv: { be: 0, an: 0, ag: 0 }, av: { be: 0, an: 0, ag: 0 } };
  const um = { u1: 0, u2: 0, u3: 0 };
  let beKVjahr = 0, beRVjahr = 0, maerz = false, modus = "regulär";
  const age = alterAm(ma.geburt, P.jahr, monat);
  const pvZ = !ma.eltern && age >= 23 ? P.pvZuschlag : 0;
  const pvA = ma.eltern ? Math.min(Math.max(num(ma.kinderU25) - 1, 0), 4) * P.pvAbschlag : 0;
  const zb = num(ma.zb);
  const rate = {
    kv: [P.kv / 2 + zb / 2, P.kv / 2 + zb / 2],
    pv: sachsen ? [P.pvSachsenAN, P.pvSachsenAG] : [P.pv / 2, P.pv / 2],
    rv: [P.rv / 2, P.rv / 2], av: [P.av / 2, P.av / 2]
  };
  const pflicht = {
    kv: ma.kv === "gkv" && !mini, pv: ma.kv === "gkv" && !mini, rv: !ma.rvFrei && !mini, av: !ma.avFrei && !mini
  };
  const aeGes = r2(svLfd + svEZ);

  if (mini) {
    modus = "Minijob";
    if (aeGes > P.mini.grenze) warn.push(`Entgelt ${eur(aeGes)} € übersteigt die Minijob-Grenze von 603 € (gelegentliches Überschreiten max. 2 Monate im Jahr zulässig).`);
    sv.kv.ag = ma.miniKV ? r2(aeGes * P.mini.kv / 100) : 0; sv.kv.be = ma.miniKV ? aeGes : 0;
    sv.rv.be = aeGes; sv.rv.ag = r2(aeGes * P.mini.rv / 100);
    sv.rv.an = ma.miniRVbefreit ? 0 : Math.max(0, r2(r2(Math.max(aeGes, P.mini.rvMin) * P.rv / 100) - sv.rv.ag));
    um.u1 = F.u1Pflicht ? r2(aeGes * P.mini.u1 / 100) : 0; um.u2 = r2(aeGes * P.mini.u2 / 100); um.u3 = r2(aeGes * P.mini.u3 / 100);
    beKVjahr = aeGes; beRVjahr = aeGes;
    step("Sozialversicherung Minijob (Minijob-Zentrale)", `Arbeitgeber: KV pauschal 13 %${ma.miniKV ? "" : " (entfällt, nicht gesetzlich versichert)"} = ${eur(sv.kv.ag)} €, RV pauschal 15 % = ${eur(sv.rv.ag)} €\nArbeitnehmer RV: ${ma.miniRVbefreit ? "befreit" : `18,6 % × max(${eur(aeGes)} €; 175 €) − AG-Anteil = ${eur(sv.rv.an)} €`}\nUmlagen: U1 0,80 % ${eur(um.u1)} € · U2 0,22 % ${eur(um.u2)} € · Insolvenzgeld 0,15 % ${eur(um.u3)} €`);
  } else {
    const bbgK = r2(P.bbgKVm * teil), bbgR = r2(P.bbgRVm * teil);
    const midi = ma.art === "svpflichtig" && aeGes > P.midi.ug && aeGes <= P.midi.og;
    const gering = ma.art === "azubi" && aeGes <= P.azubiGrenze;
    if (midi) {
      modus = "Übergangsbereich";
      const be = midiBE(aeGes), bean = midiBEan(aeGes);
      step("Übergangsbereich (§ 20 Abs. 2a SGB IV)", `Arbeitsentgelt ${eur(aeGes)} € liegt zwischen 603,01 € und 2.000 €\nBE gesamt = 0,6619 × 603 + (2000/1397 − 603/1397 × 0,6619) × (${eur(aeGes)} − 603) = ${eur(be)} €\nBE Arbeitnehmer = 2000/1397 × (${eur(aeGes)} − 603) = ${eur(bean)} €\nGesamtbeitrag = halber Satz × BE gerundet × 2; AN-Anteil = halber Satz × BE AN; AG-Anteil = Differenz`);
      for (const z of ["kv", "pv", "rv", "av"]) {
        if (!pflicht[z]) continue;
        const half = (rate[z][0] + rate[z][1]) / 2;
        const ges = sachsen && z === "pv" ? r2(be * P.pv / 100) : r2(r2(be * half / 100) * 2);
        let an = r2(bean * (sachsen && z === "pv" ? rate.pv[0] : half) / 100);
        sv[z].be = be; sv[z].ag = r2(ges - an);
        if (z === "pv") an = Math.max(0, r2(an + r2(be * pvZ / 100) - r2(be * pvA / 100)));
        sv[z].an = an;
      }
      um.u1 = F.u1Pflicht ? r2(aeGes * num(F.u1) / 100) : 0; um.u2 = r2(aeGes * num(F.u2) / 100); um.u3 = r2(aeGes * P.u3 / 100);
      beKVjahr = aeGes; beRVjahr = aeGes;
    } else {
      /* laufendes Entgelt */
      const kvL = Math.min(svLfd, bbgK), rvL = Math.min(svLfd, bbgR);
      let kvE = 0, rvE = 0;
      if (svEZ > 0) {
        const tage = Y.svTage + svTage;
        const antK = r2(P.bbgKV * tage / 360), antR = r2(P.bbgRV * tage / 360);
        const remK = Math.max(0, r2(antK - Y.beKV - kvL)), remR = Math.max(0, r2(antR - Y.beRV - rvL));
        const ref = pflicht.kv ? remK : remR;
        if (monat <= 3 && svEZ > ref && num(ma.vjTage) > 0) {
          maerz = true;
          const pK = Math.max(0, r2(P.vorjahr.bbgKV * num(ma.vjTage) / 360 - num(ma.vjKV)));
          const pR = Math.max(0, r2(P.vorjahr.bbgRV * num(ma.vjTage) / 360 - num(ma.vjRV)));
          kvE = Math.min(svEZ, pK); rvE = Math.min(svEZ, pR);
          step("Einmalzahlung: Märzklausel (§ 23a Abs. 4 SGB IV)", `Einmalzahlung ${eur(svEZ)} € im ${MON[monat - 1]} übersteigt die noch freie anteilige BBG ${eur(ref)} € → Zuordnung zum letzten Entgeltabrechnungszeitraum 2025\nfreie BBG 2025 KV/PV: ${eur(P.vorjahr.bbgKV)} € × ${num(ma.vjTage)}/360 − ${eur(num(ma.vjKV))} € = ${eur(pK)} € → beitragspflichtig ${eur(kvE)} €\nfreie BBG 2025 RV/AV: ${eur(P.vorjahr.bbgRV)} € × ${num(ma.vjTage)}/360 − ${eur(num(ma.vjRV))} € = ${eur(pR)} € → beitragspflichtig ${eur(rvE)} €\nBeitragssätze 2026 verwendet (Zusatzbeitrag des Vorjahres ggf. abweichend).`);
        } else {
          kvE = Math.min(svEZ, remK); rvE = Math.min(svEZ, remR);
          step("Einmalzahlung: anteilige Jahres-BBG (§ 23a SGB IV)", `SV-Tage bisher inkl. ${MON[monat - 1]}: ${tage}\nKV/PV: ${eur(P.bbgKV)} € × ${tage}/360 = ${eur(antK)} € − bisher ${eur(Y.beKV)} € − laufend ${eur(kvL)} € = frei ${eur(remK)} € → beitragspflichtig ${eur(kvE)} €\nRV/AV: ${eur(P.bbgRV)} € × ${tage}/360 = ${eur(antR)} € − bisher ${eur(Y.beRV)} € − laufend ${eur(rvL)} € = frei ${eur(remR)} € → beitragspflichtig ${eur(rvE)} €`);
          if (monat <= 3 && svEZ > ref && !num(ma.vjTage)) warn.push("Märzklausel wäre anwendbar, aber für 2025 sind keine SV-Tage hinterlegt (Mitarbeiterstamm → Vorjahr).");
        }
      }
      const be = { kv: r2(kvL + kvE), pv: r2(kvL + kvE), rv: r2(rvL + rvE), av: r2(rvL + rvE) };
      for (const z of ["kv", "pv", "rv", "av"]) {
        if (!pflicht[z]) continue;
        sv[z].be = be[z];
        let an = r2(be[z] * rate[z][0] / 100), ag = r2(be[z] * rate[z][1] / 100);
        if (z === "pv") an = Math.max(0, r2(be[z] * (rate.pv[0] + pvZ - pvA) / 100));
        if (gering) { ag = r2(ag + an); an = 0; }
        sv[z].an = an; sv[z].ag = ag;
      }
      if (gering) { modus = "Geringverdiener (Azubi)"; step("Geringverdienergrenze", `Auszubildender mit Entgelt bis 325 €: der Arbeitgeber trägt den gesamten Beitrag (§ 20 Abs. 3 SGB IV).`); }
      const kvSatzTxt = `KV ${pct(rate.kv[0])} AN / ${pct(rate.kv[1])} AG (14,6 % + Zusatzbeitrag ${pct(zb)})`;
      step("Sozialversicherung", `BBG ${MON[monat - 1]}: KV/PV ${eur(bbgK)} €, RV/AV ${eur(bbgR)} €` + (svTage < 30 ? ` (anteilig ${svTage} Tage)` : "") +
        `\nBemessung KV/PV ${eur(be.kv)} €, RV/AV ${eur(be.rv)} €\n${kvSatzTxt}\nPV ${pct(rate.pv[0])} AN / ${pct(rate.pv[1])} AG${pvZ ? " + 0,6 % Kinderlosenzuschlag (AN)" : ""}${pvA ? ` − ${pct(pvA)} Abschlag für Kinder (AN)` : ""}${sachsen ? " (Sachsen)" : ""}\nRV 9,3 % / 9,3 % · AV 1,3 % / 1,3 %` + (!pflicht.rv ? "\nRV: versicherungsfrei" : "") + (!pflicht.av ? "\nAV: versicherungsfrei" : "") + (!pflicht.kv ? "\nKV/PV: nicht gesetzlich versichert" : ""));
      um.u1 = F.u1Pflicht ? r2(Math.min(svLfd, bbgR) * num(F.u1) / 100) : 0;
      um.u2 = r2(Math.min(svLfd, bbgR) * num(F.u2) / 100);
      um.u3 = r2((rvL + rvE) * P.u3 / 100);
      beKVjahr = maerz ? kvL : r2(kvL + kvE); beRVjahr = maerz ? rvL : r2(rvL + rvE);
    }
    step("Umlagen (Arbeitgeber)", `U1 ${F.u1Pflicht ? pct(num(F.u1)) : "entfällt (mehr als 30 Beschäftigte)"} = ${eur(um.u1)} € · U2 ${pct(num(F.u2))} = ${eur(um.u2)} € · Insolvenzgeldumlage 0,15 % = ${eur(um.u3)} €`);
  }

  /* PKV-Zuschuss */
  const pkvZ = ma.kv === "pkv" && !mini ? pkvZuschuss(ma, teil, sachsen) : 0;
  if (pkvZ) step("Zuschuss private Kranken-/Pflegeversicherung (§ 257 SGB V, § 61 SGB XI)", `je Hälfte des Beitrags, höchstens ${eur(P.pkvMaxKV)} € KV und ${eur(sachsen ? P.pkvMaxPVSachsen : P.pkvMaxPV)} € PV: ${eur(pkvZ)} € (steuerfrei nach § 3 Nr. 62 EStG)`);

  /* Pauschalsteuern 15/25 % */
  const kistP = num(F.kistPauschal);
  const pst = { lst: 0, soli: 0, kist: 0 };
  const p15 = num(inp.pausch15), p25 = num(inp.pausch25);
  if (p15 || p25) {
    pst.lst = r2(p15 * 0.15 + p25 * 0.25); pst.soli = r2(pst.lst * 0.055); pst.kist = r2(pst.lst * kistP / 100);
    step("Pauschale Lohnsteuer (Arbeitgeber)", `${eur(p15)} € × 15 % + ${eur(p25)} € × 25 % = ${eur(pst.lst)} €\nSoli 5,5 % = ${eur(pst.soli)} € · pauschale Kirchensteuer ${pct(kistP)} = ${eur(pst.kist)} €`);
  }

  /* 4. Netto und Auszahlung */
  const anSV = r2(sv.kv.an + sv.pv.an + sv.rv.an + sv.av.an);
  const agSV = r2(sv.kv.ag + sv.pv.ag + sv.rv.ag + sv.av.ag);
  const netto = r2(brutto - lst - soli - kist - anSV);
  const sachAbzug = r2(lines.filter(l => l.sach).reduce((a, l) => a + l.betrag, 0));
  const vwl = num(ma.vwlGesamt);
  const auszahlung = r2(netto - sachAbzug - bavT - vwl - num(inp.nettoAbz) + num(inp.nettoBez) + pkvZ);
  const umSum = r2(um.u1 + um.u2 + um.u3);
  const bg = r2((stLfd + stEZ) * num(F.bg) / 100);
  const pauschGes = r2(pauschMini + pst.lst + pst.soli + pst.kist);
  const agKosten = r2(brutto + agSV + umSum + pauschGes + pkvZ + bg);
  step("Netto und Auszahlung", `Netto = Brutto ${eur(brutto)} − Steuern ${eur(r2(lst + soli + kist))} − SV ${eur(anSV)} = ${eur(netto)} €\nAuszahlung = Netto − Sachbezüge ${eur(sachAbzug)} − bAV ${eur(bavT)} − VWL ${eur(vwl)} − Nettoabzüge ${eur(num(inp.nettoAbz))} + Nettobezüge ${eur(num(inp.nettoBez))} + PKV-Zuschuss ${eur(pkvZ)} = ${eur(auszahlung)} €`);
  if (auszahlung < 0) warn.push("Der Auszahlungsbetrag ist negativ. Pfändungsfreigrenzen und Verrechnung prüfen.");
  if (ma.dwBLP > 0) {
    dwUSt = r2(dwWert * 19 / 119);
  }

  return { monat, modus, lines, korr, brutto, stLfd, stEZ, svLfd, svEZ, re4, sonstb, lst, soli, kist, kistSatz, sv, anSV, agSV, um, umSum,
    pkvZ, pst, pauschMini, pauschGes, netto, sachAbzug, bavT, bavEU, bavZ, bavAG, vwl, vwlAG: num(ma.vwlAG), auszahlung, agKosten, bg, svTage,

    nettoBez: num(inp.nettoBez), nettoAbz: num(inp.nettoAbz), mini, pap };
}
function pkvZuschuss(ma, teil, sachsen) {
  const kv = Math.min(num(ma.pkvKV) / 2, P.pkvMaxKV * teil);
  const pv = Math.min(num(ma.pkvPV) / 2, (sachsen ? P.pkvMaxPVSachsen : P.pkvMaxPV) * teil);
  return r2(kv + pv);
}

function jahresSumme(maId, monat, R) {
  const k = state.konten[maId] || {}; const s = { st: 0, lst: 0, soli: 0, kist: 0, sv: 0, anSV: 0, aus: 0, luecke: false };
  for (let m = 1; m <= monat; m++) {
    const r = m === monat ? R : k[m] && k[m].res;
    if (!r) { s.luecke = true; continue; }
    s.st += r.pauschMini ? 0 : r.stLfd + r.stEZ; s.lst += r.lst; s.soli += r.soli; s.kist += r.kist; s.sv += r.svLfd + r.svEZ; s.anSV += r.anSV; s.aus += r.auszahlung;
  }
  for (const x in s) if (typeof s[x] === "number") s[x] = r2(s[x]);
  return s;
}

  state.konten[ma.id][cur.monat] = { inp: JSON.parse(JSON.stringify(cur.inp)), res: compute(ma, cur.monat, cur.inp) };
  const neu = nachrechnen(ma, cur.monat + 1);
  dirty = true; refreshAbr();
  toast(`${MON[cur.monat - 1]} gespeichert` + (neu ? `, ${neu} Folgemonat(e) neu berechnet` : ""));
}
function nachrechnen(ma, ab) {
  let n = 0; const k = state.konten[ma.id] || {};
  for (let m = ab; m <= 12; m++) if (k[m]) { k[m].res = compute(ma, m, k[m].inp); n++; }
  return n;
}

function buchungen(monat) {
  const K = KONTEN[state.firma.kontenrahmen] || KONTEN.SKR03;
  const B = []; const pushB = (s, h, betrag, txt) => { betrag = r2(betrag); if (Math.abs(betrag) >= 0.005) B.push({ s, h, betrag, txt }); };
  const tot = { soll: 0, haben: 0 };
  let n = 0;
  state.mitarbeiter.forEach(ma => {
    const rec = (state.konten[ma.id] || {})[monat]; if (!rec) return; n++;
    const r = rec.res, nm = ma.name;
    const lohnK = r.mini ? K.aushilfe : K.gehalt;
    const stfreiZ = r.lines.filter(l => l.art === "stfrei").reduce((a, l) => a + l.betrag, 0);
    const lohnAufw = r2(r.brutto - r.vwlAG - r.bavZ - r.bavAG - stfreiZ);
    /* Bruttolohn gegen Verbindlichkeiten */
    const haben = [];
    const steuern = r2(r.lst + r.soli + r.kist);
    if (steuern) haben.push([K.lst, steuern, "LSt/Soli/KiSt"]);
    if (r.anSV) haben.push([K.sv, r.anSV, "SV Arbeitnehmeranteil"]);
    if (r.vwl) haben.push([K.vwlV, r.vwl, "VWL an Anlageinstitut"]);
    if (r.bavT) haben.push([K.verr, r.bavT, "bAV an Versorgungsträger"]);
    if (r.gutschein) haben.push([K.verr, r.gutschein, "Gutschein (gegen Einkauf)"]);
    if (r.unterkunft) haben.push([K.sachFrei, r.unterkunft, "Sachbezug Unterkunft"]);
    if (r.mahlWert) { haben.push([K.sach, r2(r.mahlWert - r2(r.mahlWert * 19 / 119)), "Sachbezug Mahlzeiten netto"]); haben.push([K.ust, r2(r.mahlWert * 19 / 119), "USt Mahlzeiten"]); }
    if (r.dwWert) { haben.push([K.kfz, r2(r.dwWert - r.dwUSt), "Firmenwagen netto"]); haben.push([K.ust, r.dwUSt, "USt Firmenwagen"]); }
    if (r.nettoAbz) haben.push([K.verr, r.nettoAbz, "Nettoabzüge"]);
    const nettoV = r2(r.auszahlung - r.pkvZ - r.nettoBez);
    haben.push([K.netto, r.auszahlung, "Auszahlung"]);
    pushB(lohnK, null, lohnAufw, `${nm}: Lohnaufwand`);
    if (r.vwlAG) pushB(K.vwl, null, r.vwlAG, `${nm}: VWL Arbeitgeber`);
    if (r.bavZ + r.bavAG) pushB(K.bav, null, r.bavZ + r.bavAG, `${nm}: bAV Arbeitgeber`);
    if (stfreiZ) pushB(K.stfrei, null, stfreiZ, `${nm}: steuerfreie Zuschüsse`);

    if (r.nettoBez) pushB(K.verr, null, r.nettoBez, `${nm}: Auslagenersatz`);

}

    $("noDel").onclick = () => box.hidden = true;
  };
  $("btnNeuMa").onclick = () => { const m = neuerMa(); m.persnr = String(1000 + state.mitarbeiter.length + 1); state.mitarbeiter.push(m); cur.maId = m.id; dirty = true; fillSelects(); renderMa(); loadMonth(); };
  $("btnDelMa").onclick = () => {
    const ma = maById(cur.maId); if (!ma) return;
    const box = $("delMaBox");
    box.innerHTML = `${esc(ma.name)} samt Lohnkonto löschen? <button type="button" id="okDelMa">Löschen</button> <button type="button" id="noDelMa">Abbrechen</button>`; box.hidden = false;
    $("okDelMa").onclick = () => { state.mitarbeiter = state.mitarbeiter.filter(m => m.id !== ma.id); delete state.konten[ma.id]; cur.maId = state.mitarbeiter[0] ? state.mitarbeiter[0].id : null; dirty = true; fillSelects(); renderMa(); loadMonth(); };
    $("noDelMa").onclick = () => box.hidden = true;
  };
  $("btnSave").onclick = () => { download(JSON.stringify(state, (k, v) => k === "pap" || k === "W" ? undefined : v, 1), `lohnkonten-2026-${new Date().toISOString().slice(0, 10)}.json`, "application/json"); dirty = false; toast("Datei gespeichert"); };
  $("fileLoad").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { laden(JSON.parse(rd.result)); showTab("abr"); toast("Lohnkonten geladen"); } catch (err) { toast("Datei konnte nicht gelesen werden: " + err.message); } e.target.value = ""; };
    rd.readAsText(f);
  };
  $("btnPrint").onclick = () => { showTab("abr"); window.print(); };
  $("btnCsv").onclick = csvKonto;
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
}
if (typeof window !== "undefined" && document.readyState !== "loading") init(); else document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
