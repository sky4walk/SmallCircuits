}

/* ============================================================
   Ansicht: Jahresabschluss (Vermögensübersicht, Kassenbericht, Prüfblatt)
   ============================================================ */

function druckkopf(titel){
  const st=zustand.stamm;
  return `<div class="druckkopf"><h1>${esc(st.verein)}</h1><div class="mini">${esc(titel)} · Wirtschaftsjahr ${st.jahr}${st.steuernummer?" · Steuernummer "+esc(st.steuernummer):""}</div></div>`;
}

function vermoegenWerte(r){
  const st=zustand.stamm, vm=zustand.vermoegen, c=x=>Math.round(x*100)/100;
  const a=vm.anfang, e=vm.ende;
  const rl=vm.ruecklagen||[];
  const seite=(m,anlagen,kasse,bank)=>{
    const aktiva=c(anlagen+(Number(m.vorraete)||0)+(Number(m.forderungen)||0)+bank+kasse);
    const schulden=c((Number(m.darlehen)||0)+(Number(m.verbindlichkeiten)||0));
    return {anlagen, vorraete:Number(m.vorraete)||0, forderungen:Number(m.forderungen)||0, bank, kasse, aktiva,
            darlehen:Number(m.darlehen)||0, verbindlichkeiten:Number(m.verbindlichkeiten)||0, schulden, rein:c(aktiva-schulden)};
  };
  const A=seite(a, r.anlagenAnfang, st.kassenanfang, st.kontoanfang);
  const E=seite(e, r.anlagenEnde, r.kasseEnde, r.kontoEnde);
  A.ruecklagen=c(rl.reduce((x,y)=>x+(Number(y.anfang)||0),0));
  E.ruecklagen=c(rl.reduce((x,y)=>x+(Number(y.ende)||0),0));
  return {A,E,rl};
}

function ansichtAbschluss(){
  const teil=zustand.abschlussTeil||"vermoegen";
  const nav=`<div class="unternav" role="tablist">
    ${[["vermoegen","Vermögensübersicht"],["bericht","Kassenbericht"],["pruefung","Kassenprüfung"]].map(([k,n])=>`<button role="tab" data-teil="${k}" aria-selected="${teil===k}">${n}</button>`).join("")}
    <button class="tat leise" onclick="window.print()" style="margin-left:auto">Drucken oder als PDF sichern</button></div>`;
  return `<h2 class="nichtdrucken">Jahresabschluss ${zustand.stamm.jahr}</h2>${nav}${teil==="bericht"?ansichtBericht():teil==="pruefung"?ansichtPruefung():ansichtVermoegen()}`;
}

function ansichtVermoegen(){
  const r=rechne(), st=zustand.stamm, {A,E,rl}=vermoegenWerte(r), c=x=>Math.round(x*100)/100;
  const inp=(seite,feld)=>`<input class="verm nichtdrucken" inputmode="decimal" data-verm="${seite}.${feld}" value="${csvZahl(zustand.vermoegen[seite][feld])}"><span class="drucknur">${fmt(zustand.vermoegen[seite][feld])}</span>`;
  const zeile=(name,anf,ende,klasse="")=>`<tr class="${klasse}"><td>${name}</td><td class="num">${fmt(anf)}</td><td class="num">${fmt(ende)}</td><td class="num mini">${fmt(c(ende-anf))}</td></tr>`;
  const manuell=(name,feld)=>`<tr><td>${name}</td><td class="num">${inp("anfang",feld)}</td><td class="num">${inp("ende",feld)}</td><td class="num mini">${fmt(c((Number(zustand.vermoegen.ende[feld])||0)-(Number(zustand.vermoegen.anfang[feld])||0)))}</td></tr>`;
  const rlZeilen=rl.map((x,i)=>`<tr><td><input type="text" class="nichtdrucken" data-rl="${i}" data-rlf="name" value="${esc(x.name)}" style="width:100%;font-size:13px;padding:3px 6px;border:1px solid var(--linie);border-radius:3px;background:#FFFDF7"><span class="drucknur">${esc(x.name)}</span></td>
    <td class="num"><input class="verm nichtdrucken" inputmode="decimal" data-rl="${i}" data-rlf="anfang" value="${csvZahl(x.anfang)}"><span class="drucknur">${fmt(x.anfang)}</span></td>
    <td class="num"><input class="verm nichtdrucken" inputmode="decimal" data-rl="${i}" data-rlf="ende" value="${csvZahl(x.ende)}"><span class="drucknur">${fmt(x.ende)}</span></td>
    <td class="num mini">${fmt(c((Number(x.ende)||0)-(Number(x.anfang)||0)))} <button class="zeilentat nichtdrucken" data-rlweg="${i}" title="Rücklage entfernen">✕</button></td></tr>`).join("");
  const ergebnis=c(SPH_KEYS.reduce((a,x)=>a+r.sph[x].ergebnis,0));
  const aenderung=c(E.rein-A.rein);
  return `${druckkopf("Vermögensübersicht")}
    <p class="hinweis nichtdrucken">Die Vermögensübersicht zum 31.12. ergänzt die Einnahmen-Überschuss-Rechnung: Sie zeigt, was der Verein hat und was er schuldet. Kasse, Bank und Anlagevermögen kommen aus dem Kassenbuch und dem Anlagenverzeichnis, die übrigen Positionen trägst du ein — etwa offene Beitragsforderungen, noch nicht bezahlte Rechnungen, ein Darlehen oder den Wert des Malzlagers. Rücklagen sind Teil des Vereinsvermögens und gehören beim gemeinnützigen Verein mit Beschluss dokumentiert (§ 62 AO).</p>
    <div class="tabellenrahmen"><table>
      <thead><tr><th>Vermögen</th><th class="num">1.1.${st.jahr}</th><th class="num">31.12.${st.jahr}</th><th class="num">Veränderung</th></tr></thead>
      <tbody>
        ${zeile("Anlagevermögen (Buchwerte laut Anlagenverzeichnis)",A.anlagen,E.anlagen)}
        ${manuell("Vorräte (Rohstoffe, Ware, Gebinde)","vorraete")}
        ${manuell("Forderungen (offene Beiträge, Rechnungen an Dritte)","forderungen")}
        ${zeile("Bankguthaben",A.bank,E.bank)}
        ${zeile("Kasse",A.kasse,E.kasse)}
        ${zeile("Summe Vermögen",A.aktiva,E.aktiva,"summe")}
      </tbody>
      <tbody><tr><td colspan="4" style="height:12px;border:0"></td></tr>
        <tr><th>Schulden</th><th></th><th></th><th></th></tr>
        ${manuell("Darlehen","darlehen")}
        ${manuell("Verbindlichkeiten (offene Rechnungen, Steuern)","verbindlichkeiten")}
        ${zeile("Summe Schulden",A.schulden,E.schulden,"summe")}
      </tbody>
      <tbody><tr><td colspan="4" style="height:12px;border:0"></td></tr>
        ${zeile("Vereinsvermögen (Vermögen abzüglich Schulden)",A.rein,E.rein,"summe")}
        <tr><td colspan="4" class="mini">davon Rücklagen:</td></tr>
        ${rlZeilen}
        <tr><td class="mini">${rl.length?"Summe Rücklagen":"noch keine Rücklage"} <button class="zeilentat nichtdrucken" id="btnRlNeu" title="Rücklage hinzufügen">＋</button></td><td class="num mini">${fmt(A.ruecklagen)}</td><td class="num mini">${fmt(E.ruecklagen)}</td><td class="num mini">${fmt(c(E.ruecklagen-A.ruecklagen))}</td></tr>
        <tr><td class="mini">freies Vereinsvermögen</td><td class="num mini">${fmt(c(A.rein-A.ruecklagen))}</td><td class="num mini">${fmt(c(E.rein-E.ruecklagen))}</td><td class="num mini">${fmt(c((E.rein-E.ruecklagen)-(A.rein-A.ruecklagen)))}</td></tr>
      </tbody></table></div>
    <div class="kacheln">
      <div class="kachel"><div class="titel">Veränderung des Vereinsvermögens</div><div class="wert">${fmt(aenderung)}</div><div class="fuss">31.12. gegenüber 1.1.</div></div>
      <div class="kachel"><div class="titel">Ergebnis laut Auswertung</div><div class="wert">${fmt(ergebnis)}</div><div class="fuss">alle Bereiche, nach Abschreibungen</div></div>
      <div class="kachel ${Math.abs(aenderung-ergebnis)<0.005?"gruen":""}"><div class="titel">Abweichung</div><div class="wert">${fmt(c(aenderung-ergebnis))}</div><div class="fuss">${Math.abs(aenderung-ergebnis)<0.005?"stimmt überein":"erklärt sich aus Investitionen (Geldabfluss, aber kein Aufwand), Vorräten, Forderungen und Schulden"}</div></div>
    </div>
    <p class="mini nichtdrucken">Gibst du für Vorräte, Forderungen oder Schulden Werte ein, weicht die Vermögensänderung vom Ergebnis der Einnahmen-Überschuss-Rechnung ab — das ist normal, die EÜR kennt nur Zahlungen. Auch Anlagegüter, die vor Beginn des Kassenbuchs angeschafft wurden, sind hier nur über das Anlagenverzeichnis enthalten.</p>
    <div class="unterschriften"><div class="unterschrift">Ort, Datum</div><div class="unterschrift">Kassenwart / Schatzmeister</div></div>`;
}

function ansichtBericht(){
  const r=rechne(), st=zustand.stamm, vj=zustand.vorjahr, {A,E}=vermoegenWerte(r), c=x=>Math.round(x*100)/100;
  const vjKat=k=>vj&&vj.kat?vj.kat[k]:null;
  const block=(art,sph)=>{
    const ks=zustand.kategorien.filter(k=>k.art===art&&!k.transit&&!k.anlage&&(k.sphaere===sph||(k.sphaere==="aufteilen"&&sph==="wgb"))&&(r.proKategorie[k.key]>0||vjKat(k.key)>0));
    if(!ks.length) return "";
    return ks.map(k=>`<tr><td>${esc(k.text)}${k.sphaere==="aufteilen"?' <span class="mini">(gemischt, gesamt)</span>':""}</td><td class="num">${r.proKategorie[k.key]?fmt(r.proKategorie[k.key]):"—"}</td><td class="num mini">${vjKat(k.key)!=null?fmt(vjKat(k.key)):"—"}</td></tr>`).join("");
  };
  const bereich=(art)=>SPHAEREN.map(x=>{ const z=block(art,x.key); return z?`<tr class="formular"><td colspan="3">${esc(x.name)}</td></tr>${z}`:""; }).join("");
  const sumEin=c(SPH_KEYS.reduce((a,x)=>a+r.sph[x].ein,0)), sumAus=c(SPH_KEYS.reduce((a,x)=>a+r.sph[x].aus,0)), sumAfa=c(SPH_KEYS.reduce((a,x)=>a+r.sph[x].afa,0));
  const vjW=f=>vj&&vj[f]!=null?fmt(vj[f]):"—";
  return `${druckkopf("Kassenbericht für die Mitgliederversammlung")}
    <p class="hinweis nichtdrucken">Der Bericht gliedert nach Sachgebieten, nicht nach Steuerformularen — das ist es, was die Mitglieder wissen wollen. Beträge brutto, wie geflossen. Die Vorjahresspalte füllt sich ab dem zweiten Jahr, nach dem Jahreswechsel. Bemerkungen unten kannst du frei eintragen; sie werden mitgedruckt.</p>
    <div class="tabellenrahmen uebertrag"><table>
      <thead><tr><th>Kassenbestände</th><th class="num">${st.jahr}</th><th class="num">Vorjahr</th></tr></thead>
      <tbody>
        <tr><td>Kasse am 1.1.</td><td class="num">${fmt(st.kassenanfang)}</td><td class="num mini">—</td></tr>
        <tr><td>Bank am 1.1.</td><td class="num">${fmt(st.kontoanfang)}</td><td class="num mini">—</td></tr>
        <tr><td>Kasse am 31.12.</td><td class="num">${fmt(r.kasseEnde)}</td><td class="num mini">${vjW("kasseEnde")}</td></tr>
        <tr><td>Bank am 31.12.</td><td class="num">${fmt(r.kontoEnde)}</td><td class="num mini">${vjW("kontoEnde")}</td></tr>
      </tbody>
      <thead><tr><th>Einnahmen</th><th class="num">${st.jahr}</th><th class="num">Vorjahr</th></tr></thead>
      <tbody>${bereich("einnahme")}<tr class="summe"><td>Summe Einnahmen</td><td class="num">${fmt(sumEin)}</td><td class="num mini">${vjW("ein")}</td></tr></tbody>
      <thead><tr><th>Ausgaben</th><th class="num">${st.jahr}</th><th class="num">Vorjahr</th></tr></thead>
      <tbody>${bereich("ausgabe")}<tr class="summe"><td>Summe Ausgaben</td><td class="num">${fmt(sumAus)}</td><td class="num mini">${vjW("aus")}</td></tr>
        ${r.investSumme?`<tr><td>Investitionen ins Anlagevermögen (kein Aufwand)</td><td class="num">${fmt(r.investSumme)}</td><td class="num mini">${vjW("invest")}</td></tr>`:""}
        ${sumAfa?`<tr><td>Abschreibungen</td><td class="num">${fmt(sumAfa)}</td><td class="num mini">${vjW("afa")}</td></tr>`:""}
        <tr class="summe"><td>Ergebnis des Jahres (Einnahmen abzüglich Ausgaben und Abschreibungen)</td><td class="num">${fmt(c(sumEin-sumAus-sumAfa))}</td><td class="num mini">${vjW("ergebnis")}</td></tr>
      </tbody>
      <thead><tr><th>Vermögen</th><th class="num">31.12.${st.jahr}</th><th class="num">1.1.${st.jahr}</th></tr></thead>
      <tbody>
        <tr><td>Anlagevermögen (Buchwert)</td><td class="num">${fmt(E.anlagen)}</td><td class="num mini">${fmt(A.anlagen)}</td></tr>
        <tr><td>Geld (Kasse und Bank)</td><td class="num">${fmt(c(E.kasse+E.bank))}</td><td class="num mini">${fmt(c(A.kasse+A.bank))}</td></tr>
        <tr><td>Schulden</td><td class="num">${fmt(E.schulden)}</td><td class="num mini">${fmt(A.schulden)}</td></tr>
        <tr class="summe"><td>Vereinsvermögen</td><td class="num">${fmt(E.rein)}</td><td class="num mini">${fmt(A.rein)}</td></tr>

      </tbody></table></div>
    ${st.gemeinnuetzig?`<p class="mini">Einnahmen des wirtschaftlichen Geschäftsbetriebs einschließlich Umsatzsteuer: ${fmt(r.wgbBrutto)} (Besteuerungsgrenze ${fmtGanz(BESTEUERUNGSGRENZE)} ${r.unterBesteuerungsgrenze?"eingehalten":"überschritten"}). Umsatzsteuerlich ${r.regel?"regelbesteuert":"Kleinunternehmer"}.</p>`:""}
    <h3>Bemerkungen des Kassenwarts</h3>
    <textarea class="frei nichtdrucken" id="bemerkung" placeholder="z. B. besondere Einnahmen, große Anschaffungen, geplante Vorhaben, offene Posten …">${esc(zustand.vermoegen.bemerkung||"")}</textarea>
    <div class="drucknur" style="white-space:pre-wrap;font-size:13.5px">${esc(zustand.vermoegen.bemerkung||"")}</div>
    <div class="unterschriften"><div class="unterschrift">Ort, Datum</div><div class="unterschrift">Kassenwart / Schatzmeister</div></div>`;
}

function ansichtPruefung(){
  const r=rechne(), st=zustand.stamm, p=zustand.pruefung, c=x=>Math.round(x*100)/100;
  const liste=sortiert().filter(imJahr);
  // Belegnummern: Lücken und Doppelte
  const nummern=liste.map(b=>{const m=/(\d+)\s*$/.exec(b.beleg||"");return m?parseInt(m[1],10):null;}).filter(n=>n!=null).sort((a,b)=>a-b);
  const luecken=[], doppelt=new Set();
  for(let i=1;i<nummern.length;i++){ if(nummern[i]===nummern[i-1]) doppelt.add(nummern[i]); else for(let n=nummern[i-1]+1;n<nummern[i]&&luecken.length<30;n++) luecken.push(n); }
  const ohneNr=liste.filter(b=>!/\d+\s*$/.test(b.beleg||"")).length;
  const sturz=zustand.kassenstuerze.filter(k=>String(k.stichtag).startsWith(String(st.jahr))).sort((a,b)=>a.stichtag.localeCompare(b.stichtag)).pop();
  const ab=zustand.bankAbgleich&&String(zustand.bankAbgleich.datum).startsWith(String(st.jahr))?zustand.bankAbgleich:null;
  const abDiff=ab?c(rechne(ab.datum).kontoEnde-ab.saldo):null;
  const aenderungen=zustand.protokoll.filter(x=>/geändert|gelöscht/.test(x.aktion)).length;
  // Stichprobe: bis zu zwölf Buchungen, gleichmäßig über das Jahr verteilt, große Beträge bevorzugt
  const gross=liste.slice().sort((a,b)=>Math.abs(b.betrag)-Math.abs(a.betrag)).slice(0,4);
  const rest=liste.filter(b=>!gross.includes(b));
  const schritt=Math.max(1,Math.floor(rest.length/8));
  const probe=[...gross, ...rest.filter((b,i)=>i%schritt===0).slice(0,8)].sort((a,b)=>a.datum.localeCompare(b.datum));
  const zeile=(t,wert,ok)=>`<tr><td>${t}</td><td class="num">${wert}</td><td>${ok===true?'<span style="color:var(--ok)">✔</span>':ok===false?'<span style="color:var(--warn)">✘</span>':""}</td></tr>`;
  return `${druckkopf("Bericht der Kassenprüfung")}
    <p class="hinweis nichtdrucken">Dieses Blatt bereitet die Kassenprüfung vor: Die Prüfer sehen die Bestände, die Plausibilitätsprüfungen der Seite und eine Stichprobe von Belegen zum Abhaken. Feststellungen und Namen trägst du ein, sie werden mitgedruckt. Die Prüfer sollten dem Vorstand nicht angehören.</p>
    <div class="formzeile nichtdrucken">
      <div class="feld w-datum"><label for="pDatum">Prüfungstag</label><input type="date" id="pDatum" value="${esc(p.datum||"")}"></div>
      <div class="feld w-halb"><label for="pP1">Kassenprüfer/in 1</label><input type="text" id="pP1" value="${esc(p.pruefer1||"")}"></div>
      <div class="feld w-halb"><label for="pP2">Kassenprüfer/in 2</label><input type="text" id="pP2" value="${esc(p.pruefer2||"")}"></div>
    </div>
    <p class="drucknur mini">Prüfung am ${esc(p.datum||"________")} durch ${esc(p.pruefer1||"________")} und ${esc(p.pruefer2||"________")}</p>

    <h3>Bestände und Prüfungen</h3>
    <div class="tabellenrahmen"><table><thead><tr><th>Prüfpunkt</th><th class="num">Wert</th><th style="width:40px"></th></tr></thead><tbody>
      ${zeile("Buchungen im Wirtschaftsjahr", liste.length, null)}
      ${zeile("Zeitraum", liste.length?esc(liste[0].datum)+" bis "+esc(liste[liste.length-1].datum):"—", null)}
      ${zeile("Kassenbestand am 31.12. laut Kassenbuch", fmt(r.kasseEnde), null)}
      ${zeile("Letzter Kassensturz"+(sturz?" am "+esc(sturz.stichtag):""), sturz?`gezählt ${fmt(sturz.ist)}, Differenz ${fmt(sturz.differenz)}`:"kein Kassensturz festgehalten", sturz?Math.abs(sturz.differenz)<0.005:false)}
      ${zeile("Barbestand nie negativ", r.kasseNegativAb?"negativ ab "+esc(r.kasseNegativAb):"ja", !r.kasseNegativAb)}
      ${zeile("Kontostand am 31.12. laut Kassenbuch", fmt(r.kontoEnde), null)}
      ${zeile("Bankabgleich"+(ab?" am "+esc(ab.datum):""), ab?`Auszug ${fmt(ab.saldo)}, Differenz ${fmt(abDiff)}`:"kein Kontostand hinterlegt", ab?Math.abs(abDiff)<0.005:false)}
      ${zeile("Belege fortlaufend nummeriert", luecken.length||doppelt.size||ohneNr?`${luecken.length?"Lücken: "+luecken.slice(0,12).join(", ")+(luecken.length>12?" …":""):""}${doppelt.size?" doppelt: "+[...doppelt].join(", "):""}${ohneNr?" "+ohneNr+" ohne Nummer":""}`:"ja", !(luecken.length||doppelt.size||ohneNr))}
      ${zeile("Buchungen ohne Kategorie", r.ohneKategorie, r.ohneKategorie===0)}
      ${zeile("Nachträgliche Änderungen und Löschungen (Protokoll)", aenderungen, null)}
      ${zeile("Festgeschrieben bis", zustand.festBis?esc(zustand.festBis):"nicht festgeschrieben", zustand.festBis?true:null)}
      ${st.gemeinnuetzig?zeile("Einnahmen wirtschaftlicher Geschäftsbetrieb brutto", fmt(r.wgbBrutto)+" von "+fmtGanz(BESTEUERUNGSGRENZE), r.unterBesteuerungsgrenze):""}
      ${st.gemeinnuetzig?zeile("Ergebnis wirtschaftlicher Geschäftsbetrieb", fmt(r.sph.wgb.ergebnis), r.sph.wgb.ergebnis>=-0.005):""}
      ${zeile("Umsatzsteuerlicher Status", r.regel?"regelbesteuert":"Kleinunternehmer", null)}
    </tbody></table></div>

    <h3>Stichprobe</h3>
    <p class="mini">Vorgeschlagen sind die vier größten Beträge und acht über das Jahr verteilte Buchungen. Die Prüfer haken ab: Beleg vorhanden, Betrag und Datum stimmen, Kategorie und Bereich plausibel.</p>
    <div class="tabellenrahmen"><table>
      <thead><tr><th>Datum</th><th>Beleg</th><th>Vorgang</th><th class="num">Betrag</th><th>Beleg</th><th>Betrag</th><th>Zuordnung</th><th>Bemerkung</th></tr></thead>

    </div>
    <p class="mini">Wechselt der Status mitten im Jahr — etwa weil 100.000 € überschritten sind —, stellst du hier auf „Regelbesteuert“ und setzt bei den Einnahmen ab diesem Umsatz den Steuersatz. Wer auf die Kleinunternehmerregelung verzichtet, ist fünf Jahre daran gebunden.</p>
    <p class="mini">Änderungen gelten, sobald du ein Feld verlässt.</p>

    <h3>Kategorien</h3>

    <div class="formzeile">
      <div class="feld check"><input type="checkbox" id="sSphBuchung" ${s.sphaereJeBuchung?"checked":""}><label for="sSphBuchung">Bereich zusätzlich an jeder einzelnen Buchung wählbar machen — für Belege, die ausnahmsweise nicht zum Bereich ihrer Kategorie gehören</label></div>
    </div>

const STUECKELUNG=[50000,20000,10000,5000,2000,1000,500,200,100,50,20,10,5,2,1];   // in Cent
const stueckName=c=> c>=100 ? eurGanz.format(c/100)+" €" : c+" ct";

function zaehlSumme(anzahl){
  return STUECKELUNG.reduce((s,c)=>s+c*(parseInt(anzahl[c],10)||0),0)/100;
}

function ansichtWerkzeuge(){
  const st=zustand.stamm;
  if(!zustand.zaehlung) zustand.zaehlung={stichtag:"",anzahl:{}};
  const z=zustand.zaehlung;
  const stichtag = z.stichtag || (heute().startsWith(String(st.jahr))?heute():st.jahr+"-12-31");
  const soll=rechne(stichtag).kasseEnde, ist=zaehlSumme(z.anzahl), diff=Math.round((ist-soll)*100)/100;

  const raster=STUECKELUNG.map(c=>`<label><span>${stueckName(c)}</span><input type="number" min="0" step="1" data-stueck="${c}" value="${z.anzahl[c]||""}" aria-label="Anzahl ${stueckName(c)}"></label>`).join("");

  const fruehere=zustand.kassenstuerze.map((k,i)=>`<tr>
    <td class="mono">${esc(k.stichtag)}</td><td class="mini">${esc(k.zeit)}</td>
    <td class="num">${fmt(k.soll)}</td><td class="num">${fmt(k.ist)}</td>
    <td class="num" style="color:${Math.abs(k.differenz)<0.005?"var(--ok)":"var(--warn)"}">${fmt(k.differenz)}</td>
    <td class="mini">${esc(k.notiz||"")}</td>
    <td class="nichtdrucken"><button class="zeilentat" data-sturzweg="${i}" title="Zählung entfernen">✕</button></td></tr>`).join("");

  // Bankabgleich
  const ab=zustand.bankAbgleich;
  let abgleich="";
  if(ab && ab.datum){
    const rab=rechne(ab.datum);
    const rechn=rab.kontoEnde, d=Math.round((rechn-ab.saldo)*100)/100;
    const imJ=String(ab.datum).startsWith(String(st.jahr));
    abgleich=`<div class="kacheln">
      <div class="kachel"><div class="titel">Laut Auszug</div><div class="wert">${fmt(ab.saldo)}</div><div class="fuss">am ${esc(ab.datum)}${ab.quelle?", "+esc(kuerze(ab.quelle,28)):""}</div></div>
      <div class="kachel"><div class="titel">Laut Kassenbuch</div><div class="wert">${fmt(rechn)}</div><div class="fuss">Stand 1.1. plus Bankbuchungen bis zum Tag</div></div>
      <div class="kachel ${Math.abs(d)<0.005?"gruen":"rot"}"><div class="titel">Differenz</div><div class="wert">${fmt(d)}</div><div class="fuss">${Math.abs(d)<0.005?"stimmt überein":"Kassenbuch minus Auszug"}</div></div>
    </div>
    ${!imJ?`<div class="merker ruhig"><strong>Der Saldo stammt nicht aus ${st.jahr}.</strong> Ein Vergleich ist nur innerhalb des eingestellten Wirtschaftsjahres sinnvoll.</div>`
    :Math.abs(d)>=0.005?`<div class="merker"><strong>Kassenbuch und Konto weichen um ${fmt(Math.abs(d))} ab.</strong>
      Häufige Ursachen: der Kontostand am 1.1. fehlt oder ist falsch, eine Kontobuchung wurde nicht übernommen oder doppelt erfasst, eine Barbuchung ist versehentlich als „Bank“ markiert, oder ein Vormerkposten ist inzwischen gebucht. Suche im Kassenbuch nach dem Differenzbetrag.</div>`:""}`;
  }

  const prot=zustand.protokoll.slice().reverse().map(p=>`<tr>
    <td class="mini" style="white-space:nowrap">${esc(p.zeit)}</td><td>${esc(p.aktion)}</td>
    <td class="mini">${esc(p.vorher||"")}</td><td class="mini">${esc(p.nachher||"")}</td></tr>`).join("");

  const r=rechne();
  return `
    <h2>Werkzeuge</h2>

    <h3>Kassensturz</h3>
    <p class="hinweis">Bargeld nach Stückelung zählen und mit dem Kassenbestand laut Kassenbuch vergleichen. Das festgehaltene Zählprotokoll ist der Nachweis für die Kassenprüfer — drucke es aus oder speichere die Seite.</p>
    <div class="formzeile">
      <div class="feld w-datum"><label for="zStichtag">Stichtag</label><input type="date" id="zStichtag" value="${esc(stichtag)}"></div>
    </div>
    <div class="zaehlraster">${raster}</div>
    <div class="kacheln">
      <div class="kachel"><div class="titel">Gezählt</div><div class="wert" id="zIst">${fmt(ist)}</div><div class="fuss">Summe der Stückelung</div></div>
      <div class="kachel"><div class="titel">Soll laut Kassenbuch</div><div class="wert">${fmt(soll)}</div><div class="fuss">Stand am Ende des ${esc(stichtag)}</div></div>
      <div class="kachel ${Math.abs(diff)<0.005?"gruen":"rot"}" id="zDiffKachel"><div class="titel">Differenz</div><div class="wert" id="zDiff">${fmt(diff)}</div><div class="fuss">gezählt minus Soll</div></div>
    </div>
    <div class="knopfreihe nichtdrucken">
      <button class="tat messing" id="btnZaehlungMerken">Zählung festhalten</button>
      <button class="tat leise" id="btnZaehlungBuchen"${Math.abs(diff)<0.005?" disabled":""}>Differenz als Buchung vorbereiten</button>
      <button class="tat leise" id="btnZaehlungLeeren">Zählfelder leeren</button>
    </div>
    <p class="mini">Eine Kassendifferenz muss gebucht werden, damit Kassenbuch und Bargeld wieder übereinstimmen. Die Schaltfläche füllt das Buchungsformular vor; die Kategorie entscheidest du dort. Ungeklärte Differenzen sollten selten sein — häufen sie sich, zweifelt das Finanzamt an der Kassenführung.</p>
    ${fruehere?`<div class="tabellenrahmen"><table>
      <thead><tr><th>Stichtag</th><th>Gezählt am</th><th class="num">Soll</th><th class="num">Ist</th><th class="num">Differenz</th><th>Notiz</th><th class="nichtdrucken"></th></tr></thead>
      <tbody>${fruehere}</tbody></table></div>`:""}

    <h3>Bankabgleich</h3>
    <p class="hinweis">Vergleicht den Kontostand laut Kontoauszug mit dem, was sich aus dem Kassenbuch ergibt. Beim Einlesen eines CAMT-Auszugs wird der Schlusssaldo automatisch übernommen; du kannst ihn auch von Hand eintragen.</p>
    <div class="formzeile nichtdrucken">
      <div class="feld w-datum"><label for="abDatum">Datum</label><input type="date" id="abDatum" value="${esc(ab&&ab.datum||"")}"></div>
      <div class="feld w-betrag" style="width:150px"><label for="abSaldo">Kontostand</label><input type="text" inputmode="decimal" class="num" id="abSaldo" value="${ab?csvZahl(ab.saldo):""}" placeholder="0,00"></div>
      <button class="tat leise" id="btnAbgleich">Vergleichen</button>
    </div>
    ${abgleich || `<p class="mini">Noch kein Kontostand hinterlegt.</p>`}
    ${Math.abs(st.kontoanfang)<0.005&&zustand.buchungen.some(b=>b.zahlweg==="bank")?`<p class="mini" style="color:var(--warn)">Unter „Einstellungen“ ist kein Kontostand am 1.1. eingetragen — ohne ihn kann der Abgleich nicht stimmen.</p>`:""}

    <h3>Festschreibung</h3>
    <p class="hinweis">Ein Kassenbuch soll nachträglich nicht mehr unbemerkt veränderbar sein (GoBD). Schreibst du einen Monat fest, lassen sich Buchungen bis zu diesem Tag weder ändern noch löschen, und nichts mehr davor einfügen. Fehler korrigierst du danach nur noch per Gegenbuchung, die im Kassenbuch sichtbar bleibt. Üblich ist, jeden Monat nach dem Bankabgleich festzuschreiben.</p>
    <div class="formzeile nichtdrucken">
      <div class="feld" style="width:190px"><label for="festDatum">Festschreiben bis einschließlich</label><input type="date" id="festDatum" value="${esc(monatsendeVorschlag())}" min="${zustand.festBis||""}"></div>
      <button class="tat" id="btnFest">Festschreiben</button>
      ${zustand.festBis?`<button class="tat leise" id="btnFestWeg">Festschreibung aufheben</button>`:""}
    </div>
    <p class="mini">${zustand.festBis?`Derzeit festgeschrieben bis <strong>${esc(zustand.festBis)}</strong> — ${zustand.buchungen.filter(festgeschrieben).length} Buchungen. Ein Aufheben wird im Änderungsprotokoll vermerkt.`:"Noch nichts festgeschrieben."}</p>

    <h3>Jahreswechsel</h3>
    <p class="hinweis">Schließt ${st.jahr} ab und beginnt ${st.jahr+1}. Zuerst wird eine Archivkopie mit allen Daten von ${st.jahr} heruntergeladen. Danach übernimmt die Seite die Endstände als Anfangswerte, behält Kategorien und Regeln und leert das Kassenbuch. Buchungen, die schon in ${st.jahr+1} liegen, bleiben erhalten.</p>
    <div class="tabellenrahmen"><table><tbody>
      <tr><td>Anlagevermögen am 1.1.${st.jahr+1} (Buchwert)</td><td class="num">${fmt(r.anlagenEnde)}</td></tr>
      <tr><td>Kassenbestand am 1.1.${st.jahr+1}</td><td class="num">${fmt(r.kasseEnde)}</td></tr>
      <tr><td>Kontostand am 1.1.${st.jahr+1}</td><td class="num">${fmt(r.kontoEnde)}</td></tr>
      <tr><td>Umsatz im Vorjahr</td><td class="num">${fmt(r.umsatz)}</td></tr>
      <tr><td>Verlustvortrag</td><td class="num">${fmt(r.verlustRest)}</td></tr>
    </tbody></table></div>
    <div class="knopfreihe nichtdrucken"><button class="tat" id="btnJahreswechsel">Archivkopie speichern und ${st.jahr+1} beginnen</button></div>

    <h3>Änderungsprotokoll</h3>
    <p class="hinweis">Jede Änderung und Löschung einer erfassten Buchung wird hier mit Zeitpunkt und bisheriger Fassung festgehalten. Ein Kassenbuch muss nachvollziehbar bleiben; das Protokoll wird mit der Seite gespeichert und lässt sich nicht löschen.</p>
    ${prot?`<div class="tabellenrahmen"><table>
      <thead><tr><th>Zeitpunkt</th><th>Vorgang</th><th>Vorher</th><th>Nachher</th></tr></thead>
      <tbody>${prot}</tbody></table></div>`:`<p class="mini">Bisher wurde nichts geändert oder gelöscht.</p>`}`;
}

function monatsendeVorschlag(){
  const st=zustand.stamm, h=heute();
  // letzter abgeschlossener Monat im Wirtschaftsjahr, mindestens der Tag nach der bisherigen Festschreibung
  let jahr=st.jahr, monat=12;
  if(h.startsWith(String(st.jahr))){ monat=parseInt(h.slice(5,7),10)-1; if(monat<1) return st.jahr+"-01-31"; }
  const tag=new Date(jahr,monat,0).getDate();
  const v=jahr+"-"+String(monat).padStart(2,"0")+"-"+String(tag).padStart(2,"0");
  return v>(zustand.festBis||"") ? v : (zustand.festBis||v);
}

function anlageKurz(a){ return `${a.text} · ${a.datum} · ${fmt(a.kosten)} · ${a.gwg?"GWG":a.nd+" Jahre"} · ${sphKurz(a.sphaere||"wgb")}${a.abgang?" · Abgang "+a.abgang:""}`; }

function buchungKurz(b){
  if(!b) return "";
  const k=kat(b.kategorie);
  return `${b.datum} · ${b.beleg||"—"} · ${b.text} · ${k?k.text:b.kategorie} · ${fmt(b.betrag)}${Number(b.satz)>0?" ("+b.satz+" % USt)":""}${SPH_KEYS.includes(b.sphaere)?" · Bereich "+sphName(b.sphaere):""} · ${b.zahlweg==="bar"?"Bar":"Bank"}`;
}
function protokolliere(aktion, vorher, nachher){
  zustand.protokoll.push({zeit:zeitstempel(), aktion, vorher:buchungKurz(vorher), nachher:buchungKurz(nachher)});
}

/* ============================================================
   Ansicht: Anleitung
   ============================================================ */

function ansichtHilfe(){
  return `
    <h2>So arbeitest du damit</h2>

    <h3>Einmal am Anfang</h3>
    <p class="hinweis">Unter „Einstellungen“ Verein, Jahr, Hebesatz der Gemeinde, Kassenbestand am 1. Januar und den Umsatz des Vorjahres eintragen. Den Kontostand am 1.1. liefert der Jahresabschluss der Bank, den Verlustvortrag der letzte Körperschaftsteuerbescheid. Danach auf „Speichern“ — die gespeicherte HTML-Datei ist ab jetzt dein Kassenbuch, mit allen Daten darin.</p>

    <h3>Monatlich</h3>
    <p class="hinweis">Die gespeicherte Seite öffnen — alles ist wieder da. Im Sparkassen-Banking den Umsatzexport als <strong>CAMT V8</strong> herunterladen und die ZIP-Datei unter „Kontoauszug einlesen“ ablegen. Jede Zeile bekommt einen Kategorievorschlag; wo noch „offen“ steht, entscheidest du. Mit „＋Regel“ merkt sich die Seite die Zuordnung für ähnliche Buchungen.</p>
    <p class="hinweis">Bareinnahmen aus dem Ausschank erfasst du im Kassenbuch von Hand — die stehen in keinem Kontoauszug. Danach speichern (Strg+S). Unter „Werkzeuge“ prüft der Bankabgleich, ob der Kontostand passt.</p>

    <h3>Der wichtigste Punkt: Geldtransit</h3>
    <p class="hinweis">Wenn du Bargeld aus der Kasse auf das Konto einzahlst, ist das <strong>kein Umsatz</strong>. Der Umsatz ist beim Verkauf entstanden und steht schon im Kassenbuch. Zählst du die Einzahlung nochmal als Einnahme, verdoppelst du deine Erlöse — und reißt womöglich eine Grenze, die gar nicht gerissen ist.</p>
    <p class="hinweis">Dafür gibt es die zwei Transit-Kategorien. Sie verschieben Geld zwischen Kasse und Konto, ohne Gewinn oder Umsatz zu berühren. Der Import erkennt Einzahlungen und Abhebungen meist automatisch.</p>

    <h3>Anlagen</h3>
    <p class="hinweis">Anschaffungen über 800 € netto, die länger als ein Jahr genutzt werden, buchst du im Kassenbuch auf „Anschaffung Anlagevermögen“. Die Seite springt dann ins Anlagenverzeichnis, wo du Nutzungsdauer und Bereich ergänzt. Die Abschreibung wird monatsgenau berechnet und automatisch in EÜR, Auswertung und Vermögensübersicht übernommen. Ältere Anlagen trägst du mit ihrem ursprünglichen Anschaffungsdatum nach; die Seite rechnet den heutigen Buchwert aus. Bei Verkauf oder Verschrottung das Abgangsdatum eintragen, nicht die Zeile löschen.</p>

    <h3>Jahresabschluss</h3>
    <p class="hinweis">Unter „Jahresabschluss“ findest du drei Druckblätter: die <strong>Vermögensübersicht</strong> mit Anlagen, Geld, Forderungen, Schulden und Rücklagen, den <strong>Kassenbericht</strong> für die Mitgliederversammlung nach Sachgebieten mit Vorjahresvergleich und das <strong>Prüfblatt</strong> für die Kassenprüfer mit Plausibilitätsprüfungen und einer Belegstichprobe zum Abhaken. Was die Seite nicht selbst weiß — Vorräte, offene Forderungen, Darlehen, Rücklagen, Bemerkungen —, trägst du direkt in den Blättern ein.</p>

    <h3>Festschreibung</h3>
    <p class="hinweis">Nach dem monatlichen Bankabgleich den Monat unter „Werkzeuge → Festschreibung“ festschreiben. Danach sind die Buchungen gesperrt; Korrekturen laufen über ↩ als Gegenbuchung mit einem Datum nach dem Stichtag. So bleibt jede Änderung sichtbar, was die Grundsätze ordnungsmäßiger Buchführung verlangen. Der Kontoimport übernimmt nichts mehr in festgeschriebene Zeiträume.</p>

    <h3>Am Jahresende</h3>
    <p class="hinweis">Bargeld unter „Werkzeuge → Kassensturz“ zählen und die Zählung festhalten. Vermögensübersicht ausfüllen, Kassenbericht und Prüfblatt drucken, das Jahr festschreiben. Dann auf „Übertragungsblatt“ und drucken. Anschließend „Werkzeuge → Jahreswechsel“: Die Seite speichert eine Archivkopie des alten Jahres und trägt die Endstände als Anfangswerte des neuen ein. Die Werte tippst du in Mein ELSTER ab oder gibst den Ausdruck der Kanzlei.</p>

    <h3>Welchen Export die Sparkasse liefert</h3>
    <p class="hinweis">Der Umsatzexport erzeugt <strong>camt.052</strong>, einen Kontobericht. Der offizielle <strong>Kontoauszug</strong> ist camt.053 und liegt im elektronischen Postfach. Zum Buchen taugt beides und die Seite versteht beides — für die Belegablage solltest du aber den echten Kontoauszug archivieren, denn nur er ist der Nachweis. Die Aufbewahrungspflicht liegt bei dir, nicht bei der Bank: Kontoauszüge und Rechnungen sind Buchungsbelege und bleiben acht Jahre, das Kassenbuch selbst, also diese Datei samt Archivkopien, und die Jahresauswertungen zehn Jahre. Die Frist beginnt jeweils mit dem Ende des Kalenderjahres.</p>

    <h3>Worauf du sonst achten solltest</h3>
    <p class="hinweis"><strong>Echte Mitgliedsbeiträge</strong> — satzungsgemäß, von allen gleich, ohne Gegenleistung — bleiben nach § 8 Abs. 5 KStG außer Ansatz und zählen nicht auf die Kleinunternehmergrenze. Bekommt ein Mitglied für seinen Beitrag etwas Konkretes, ist es eine normale Betriebseinnahme.</p>
    <p class="hinweis"><strong>Gewerbe- und Körperschaftsteuer</strong> sind keine abziehbaren Betriebsausgaben. Sie stehen im Kassenbuch, mindern aber den Gewinn nicht.</p>

    <h3>Tätigkeitsbereiche</h3>
    <p class="hinweis">Jede Kategorie gehört zu einem Bereich: ideeller Bereich (Beiträge, Spenden, Zuschüsse), Vermögensverwaltung (Zinsen, langfristige Vermietung), Zweckbetrieb (Kurse und Veranstaltungen, die unmittelbar dem Satzungszweck dienen) oder wirtschaftlicher Geschäftsbetrieb (Verkauf, Ausschank, Werbung). Beim gemeinnützigen Verein ist nur der wirtschaftliche Geschäftsbetrieb steuerpflichtig, und auch der erst über ${fmtGanz(BESTEUERUNGSGRENZE)} Einnahmen. Ohne Gemeinnützigkeit ist alles außer dem ideellen Bereich steuerpflichtig; einen steuerbegünstigten Zweckbetrieb gibt es dann nicht.</p>
    <p class="hinweis">Gemischt genutzte Kosten verteilst du auf zwei Arten, je nachdem, was besser passt. <strong>Jahresschlüssel:</strong> Bei der Kategorie „nach Schlüssel verteilen“ wählen und die Anteile eintragen, etwa 70 % Geschäftsbetrieb und 30 % ideell für die Sudhaus-Pacht. Das gilt für alle Buchungen der Kategorie und lässt sich am Jahresende noch anpassen. <strong>Einzelne Buchung:</strong> Unter „Einstellungen“ die Bereichsauswahl an der Buchung einschalten. Dann kann jede Buchung abweichend von ihrer Kategorie einem Bereich zugeordnet werden. Beides lässt sich kombinieren; die Wahl an der Buchung hat Vorrang. Der Schlüssel sollte nachvollziehbar sein — etwa nach Nutzungsstunden oder Fläche — und von Jahr zu Jahr gleich bleiben.</p>

    <h3>Umsatzsteuer</h3>
    <p class="hinweis">Beträge werden immer brutto erfasst, so wie sie durch Kasse oder Konto geflossen sind. Neben dem Betrag steht der enthaltene Steuersatz. Als <strong>Kleinunternehmer</strong> bleiben Einnahmen bei 0 %, und aus Ausgaben wird keine Vorsteuer gezogen — der Satz an einer Ausgabe spielt dann keine Rolle. Lag der Umsatz im Vorjahr über 25.000 €, ist der Verein <strong>regelbesteuert</strong>: Die Seite rechnet Umsatzsteuer und Vorsteuer heraus, zeigt unter „Auswertung“ die Werte je Voranmeldungszeitraum und stellt in der EÜR vereinnahmte Umsatzsteuer und gezahlte Vorsteuer als eigene Zeilen dar. Überweisungen an das Finanzamt bucht du auf „Umsatzsteuer-Zahlung“, Erstattungen auf „Umsatzsteuer-Erstattung“. Umsatzsteuer entsteht in jedem Bereich, in dem du etwas gegen Entgelt leistest, auch im Zweckbetrieb; Vorsteuer zieht die Seite nur aus Ausgaben außerhalb des ideellen Bereichs.</p>
    <p class="hinweis">Beim Kontoimport bekommt jede Buchung den Steuersatz, der bei ihrer Kategorie hinterlegt ist. Weicht eine Rechnung ab — etwa Malz zu 7 % und Kronkorken zu 19 % auf einem Beleg —, änderst du den Satz danach mit ✎ oder teilst die Rechnung in zwei Buchungen.</p>

    <h3>Buchungen korrigieren</h3>
    <p class="hinweis">Mit ✎ neben einer Buchung lässt sie sich ändern, mit ✕ löschen. Beides landet mit der bisherigen Fassung im Änderungsprotokoll unter „Werkzeuge“ — ein Kassenbuch darf korrigiert werden, aber nicht spurlos.</p>

    <h3>Was diese Seite nicht kann</h3>
    <p class="hinweis">Sie übermittelt nichts an ELSTER — das geht nur mit der ERiC-Bibliothek der Finanzverwaltung. Sie ersetzt auch keine Beratung: die Zuordnung eines Belegs bleibt eine fachliche Entscheidung. Die Berechnungen folgen den Grundfällen und kennen keine Sonderregelungen wie Hinzurechnungen nach § 8 GewStG, gewerbesteuerliche Verlustvorträge, Abschreibungsverläufe, innergemeinschaftliche Erwerbe oder die Steuerschuldnerschaft des Leistungsempfängers. Die Voranmeldung selbst überträgst du in Mein ELSTER.</p>`;
}

function zeichne(){
  const b=g("blatt");
  b.innerHTML =
    zustand.tab==="kasse"     ? ansichtKasse()     :
    zustand.tab==="bank"      ? ansichtBank()      :
    zustand.tab==="anlagen"   ? ansichtAnlagen()   :
    zustand.tab==="abschluss" ? ansichtAbschluss() :
    zustand.tab==="auswert"   ? ansichtAuswertung():
    zustand.tab==="uebertrag" ? ansichtUebertrag() :
    zustand.tab==="stamm"     ? ansichtStamm()     :
    zustand.tab==="werkzeug"  ? ansichtWerkzeuge() : ansichtHilfe();
  zeichneGlas();
  verdrahte();
}

function zeigeTab(t){
  zustand.tab=t;
  document.querySelectorAll(".reiter button").forEach(x=>x.setAttribute("aria-selected", x.dataset.tab===t?"true":"false"));
}

function verdrahte(){
  // Kassenbuch: Formular
  const bb=g("btnBuchen");
  if(bb){
    bb.onclick=buchen;
    g("fBetrag").addEventListener("keydown",e=>{if(e.key==="Enter")buchen();});
    g("fText").addEventListener("keydown",e=>{if(e.key==="Enter")g("fBetrag").focus();});
    const ba=g("btnAbbrechen"); if(ba) ba.onclick=()=>{ zustand.bearbeiten=null; zeichne(); };
    g("fKat").onchange=()=>{
      const k=kat(g("fKat").value);
      g("fSatz").value=String(standardSatz(k));
      const fs=g("fSph"); if(fs&&k) fs.options[0].textContent="wie Kategorie ("+sphKurz(k.sphaere)+")";
    };
  }
  // Kassenbuch: Filter
  const ft=g("filterText");
  if(ft){
    ft.oninput=()=>{
      zustand.filter.text=ft.value; const pos=ft.selectionStart;
      zeichne(); const n=g("filterText"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){}
    };
    g("filterKat").onchange=e=>{ zustand.filter.kat=e.target.value; zeichne(); };
    g("filterMonat").onchange=e=>{ zustand.filter.monat=e.target.value; zeichne(); };
    const fw=g("btnFilterWeg"); if(fw) fw.onclick=()=>{ zustand.filter={text:"",kat:"",monat:""}; zeichne(); };
  }
  document.querySelectorAll("[data-bearbeiten]").forEach(b=>b.onclick=()=>{
    zustand.bearbeiten=b.getAttribute("data-bearbeiten"); zeichne();
    window.scrollTo({top:0,behavior:"smooth"}); const t=g("fText"); if(t) t.focus();
  });
  document.querySelectorAll("[data-storno]").forEach(b=>b.onclick=()=>{
    const buch=zustand.buchungen.find(x=>x.id===b.getAttribute("data-storno")); if(!buch) return;
    const k=kat(buch.kategorie);
    // Gegenbuchung: gleicher Betrag in umgekehrter Richtung, Datum nach dem Stichtag
    const gegenArt = k && k.art==="einnahme" ? "ausgabe" : "einnahme";
    const gegenKat = zustand.kategorien.find(x=>x.art===gegenArt && !x.transit && x.sphaere===(k?k.sphaere:"wgb")) || zustand.kategorien.find(x=>x.art===gegenArt&&!x.transit);
    const d=new Date(zustand.festBis+"T12:00:00"); d.setDate(d.getDate()+1);
    const datum=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    zustand.formVorlage={datum, text:"Storno zu Beleg "+(buch.beleg||"—")+": "+kuerze(buch.text,80), kategorie:gegenKat?gegenKat.key:"", betrag:Math.abs(buch.betrag), zahlweg:buch.zahlweg, satz:Number(buch.satz)||0, sphaere:buch.sphaere||""};
    zustand.bearbeiten=null; zeichne(); window.scrollTo({top:0,behavior:"smooth"});
    alert("Die Gegenbuchung ist vorbereitet. Prüfe Kategorie und Bereich: Sie muss den Betrag in der Gegenrichtung neutralisieren, damit Kasse beziehungsweise Konto wieder stimmen. Danach die richtige Buchung neu erfassen.");

  document.querySelectorAll("[data-loeschen]").forEach(b=>b.onclick=()=>{

function stammUebernehmen(neuZeichnen){
  const s=zustand.stamm;
  s.verein=g("sVerein").value.trim()||"Verein";
  s.betrieb=g("sBetrieb").value.trim();
  s.steuernummer=g("sStnr").value.trim();
  s.finanzamt=g("sFa").value.trim();
  s.jahr=parseInt(g("sJahr").value,10)||new Date().getFullYear();
  s.hebesatz=zahl(g("sHebe").value);
  s.verlustvortrag=zahl(g("sVv").value);
  s.kassenanfang=zahl(g("sKasse").value);
  s.kontoanfang=zahl(g("sKonto").value);
  s.umsatzVorjahr=zahl(g("sUvj").value);
  s.gemeinnuetzig=g("sGem").checked;
  s.ustModus=g("sUstModus").value;
  s.ustZeitraum=g("sUstZr").value;
  s.pauschVorsteuer=s.gemeinnuetzig && g("sPausch").checked;
  s.sphaereJeBuchung=g("sSphBuchung").checked;
  markiereSchmutzig();
  if(neuZeichnen) zeichne(); else zeichneGlas();
}

function buchen(){
  const datum=g("fDatum").value, text=g("fText").value.trim(), betrag=Math.round(zahl(g("fBetrag").value)*100)/100;
  if(!datum){alert("Bitte ein Datum eintragen.");g("fDatum").focus();return;}
  if(!text){alert("Bitte kurz beschreiben, worum es geht.");g("fText").focus();return;}
  if(betrag<=0){alert("Der Betrag muss größer als null sein. Ob Einnahme oder Ausgabe, entscheidet die Kategorie.");g("fBetrag").focus();return;}
  if(zustand.festBis && datum<=zustand.festBis){
    alert(`Das Kassenbuch ist bis ${zustand.festBis} festgeschrieben. Buchungen mit einem Datum bis dahin sind nicht mehr möglich — erfasse die Korrektur mit einem späteren Datum.`); g("fDatum").focus(); return;
  }
  if(!datum.startsWith(String(zustand.stamm.jahr)) &&
     !confirm(`Das Datum ${datum} liegt nicht im Wirtschaftsjahr ${zustand.stamm.jahr}. Die Buchung wird gespeichert, zählt aber nicht. Trotzdem buchen?`)) return;
  const beleg=g("fBeleg").value.trim();
  const felder={datum, beleg, text, kategorie:g("fKat").value, betrag, zahlweg:g("fWeg").value, satz:parseInt(g("fSatz").value,10)||0,
    sphaere: g("fSph") ? g("fSph").value : ""};

  if(zustand.bearbeiten){
    const b=zustand.buchungen.find(x=>x.id===zustand.bearbeiten);
    if(b && festgeschrieben(b)){ alert("Diese Buchung ist festgeschrieben und kann nicht mehr geändert werden."); zustand.bearbeiten=null; zeichne(); return; }
    if(b){
      const vorher={...b};
      Object.assign(b,felder);
      if(buchungKurz(vorher)!==buchungKurz(b)) protokolliere("geändert", vorher, b);
    }
    zustand.bearbeiten=null;
    markiereSchmutzig(); zeichne();
    return;
  }
  if(beleg && zustand.buchungen.some(x=>x.beleg===beleg) &&
     !confirm(`Die Beleg-Nummer ${beleg} ist schon vergeben. Trotzdem buchen?`)) return;
  const neu={id:neueId(), ...felder, bankref:""};
  zustand.buchungen.push(neu);
  zustand.letztesDatum=datum;
  markiereSchmutzig();
  const kNeu=kat(felder.kategorie);
  if(kNeu && kNeu.anlage){
    const t=buchungsTeile(neu,kNeu,regelbesteuert(),pauschalVorsteuer());
    const netto=Math.round(t.reduce((a,x)=>a+x.netto,0)*100)/100;
    zustand.anlageVorlage={text, datum, kosten:netto, buchungId:neu.id, sphaere:kNeu.sphaere, schluessel:kNeu.schluessel};
    zeigeTab("anlagen"); zeichne(); window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  const mk=g("fKat").value, mw=g("fWeg").value, ms=g("fSatz").value, mb=g("fSph")?g("fSph").value:"";
  zeichne();
  g("fKat").value=mk; g("fWeg").value=mw; g("fSatz").value=ms; if(g("fSph")) g("fSph").value=mb; g("fText").focus();
}

async function importStarten(dateien){
  try{
    statusMeldung("Lese Kontoauszug …");
    await camtEinlesen(dateien);
    if(!zustand.puffer.length){ alert("In diesen Dateien wurden keine gebuchten Umsätze gefunden."); statusMeldung(zustand.schmutzig?"Nicht gesichert":"Bereit"); return; }
    zeigeTab("bank");
    markiereSchmutzig();
    zeichne();
    statusMeldung("Kontoauszug gelesen, noch nichts übernommen");
  }catch(err){
    alert("Der Kontoauszug ließ sich nicht lesen.\n\n"+err.message);

  zustand.kategorien.forEach(k=>z.push(["#KATEGORIE",k.key,csvFeld(k.text),k.art,k.sphaere==="wgb"&&!k.nichtAbziehbar?"1":"0",k.umsatz?"1":"0",csvFeld(k.zeile),k.transit?"1":"0",k.satz||0,
    k.sphaere, k.sphaere==="aufteilen"?SPH_KEYS.map(x=>Number((k.schluessel||{})[x])||0).join("/"):"", k.nichtAbziehbar?"1":"0"].join(";")));
  zustand.regeln.forEach(r=>z.push(["#REGEL",csvFeld(r.muster),r.kategorie].join(";")));
  z.push("#FESTBIS;"+(zustand.festBis||""));
  zustand.anlagen.forEach(a=>z.push(["#ANLAGE",csvFeld(a.text),a.datum,csvZahl(a.kosten),a.nd||0,a.gwg?"1":"0",a.sphaere||"wgb",
    a.sphaere==="aufteilen"?SPH_KEYS.map(x=>Number((a.schluessel||{})[x])||0).join("/"):"",a.abgang||"",csvFeld(a.notiz||"")].join(";")));
  ["anfang","ende"].forEach(seite=>Object.keys(zustand.vermoegen[seite]).forEach(f=>z.push(["#VERMOEGEN",seite,f,csvZahl(zustand.vermoegen[seite][f])].join(";"))));
  (zustand.vermoegen.ruecklagen||[]).forEach(x=>z.push(["#RUECKLAGE",csvFeld(x.name),csvZahl(x.anfang),csvZahl(x.ende)].join(";")));
  z.push("#BUCHUNGEN");

  sortiert().forEach(b=>z.push([b.datum,csvFeld(b.beleg),csvFeld(b.text),b.kategorie,csvZahl(b.betrag),b.zahlweg,csvFeld(b.bankref||""),Number(b.satz)||0,SPH_KEYS.includes(b.sphaere)?b.sphaere:""].join(";")));

// Zerlegt den ganzen Text; Felder in Anführungszeichen dürfen Zeilenumbrüche enthalten
function csvZeilen(text){
  const zeilen=[]; let f=[], akt="", anf=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(anf){
      if(c==='"'){ if(text[i+1]==='"'){akt+='"';i++;} else anf=false; }
      else akt+=c;
    }else if(c==='"') anf=true;
    else if(c===";"){ f.push(akt); akt=""; }
    else if(c==="\r"||c==="\n"){
      if(c==="\r"&&text[i+1]==="\n") i++;
      f.push(akt); zeilen.push(f); f=[]; akt="";
    }else akt+=c;
  }
  if(akt!==""||f.length){ f.push(akt); zeilen.push(f); }
  return zeilen;
}

function csvLesen(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const stamm={...zustand.stamm}, katNeu=[], regNeu=[], buchNeu=[], anlNeu=[], rlNeu=[];
  const verm=leeresVermoegen(); let festBis="";
  let inTabelle=false;

  csvZeilen(text).forEach(f=>{
    if(!f.join("").trim()) return;
    const kopf=f[0];
    if(kopf==="#BUCHUNGEN"){ inTabelle=true; return; }
    if(kopf.startsWith("#")){
      const w=f[1]||"";
      switch(kopf){
        case "#VEREIN": stamm.verein=w; break;
        case "#BETRIEB": stamm.betrieb=w; break;
        case "#STEUERNUMMER": stamm.steuernummer=w; break;
        case "#FINANZAMT": stamm.finanzamt=w; break;
        case "#JAHR": stamm.jahr=parseInt(w,10)||stamm.jahr; break;
        case "#HEBESATZ": stamm.hebesatz=zahl(w); break;
        case "#VERLUSTVORTRAG": stamm.verlustvortrag=zahl(w); break;
        case "#KASSENANFANG": stamm.kassenanfang=zahl(w); break;
        case "#UMSATZVORJAHR": stamm.umsatzVorjahr=zahl(w); break;
        case "#KONTOANFANG": stamm.kontoanfang=zahl(w); break;
        case "#GEMEINNUETZIG": stamm.gemeinnuetzig=w==="1"; break;
        case "#USTMODUS": stamm.ustModus=["auto","ku","regel"].includes(w)?w:"auto"; break;
        case "#USTZEITRAUM": stamm.ustZeitraum=["monat","quartal","jahr"].includes(w)?w:"quartal"; break;
        case "#PAUSCHVORSTEUER": stamm.pauschVorsteuer=w==="1"; break;
        case "#BEREICHJEBUCHUNG": stamm.sphaereJeBuchung=w==="1"; break;
        case "#KATEGORIE":
          katNeu.push({key:f[1],text:f[2],art:f[3]==="einnahme"?"einnahme":"ausgabe",
                       euer:f[4]==="1",umsatz:f[5]==="1",zeile:f[6]||"",transit:f[7]==="1",
                       ...(f[8]!=null&&f[8]!==""?{satz:parseInt(f[8],10)||0}:{}),
                       ...(f[9]?{sphaere:f[9]}:{}),
                       ...(f[10]?{schluessel:Object.fromEntries(SPH_KEYS.map((x,j)=>[x,parseFloat((f[10].split("/")[j]||"0").replace(",","."))||0]))}:{}),
                       ...(f[11]==="1"?{nichtAbziehbar:true}:{})});
          break;
        case "#REGEL": regNeu.push({muster:f[1]||"",kategorie:f[2]||""}); break;
        case "#FESTBIS": festBis=w; break;
        case "#ANLAGE": anlNeu.push({id:neueId(),text:f[1]||"",datum:f[2]||"",kosten:zahl(f[3]),nd:parseInt(f[4],10)||1,gwg:f[5]==="1",sphaere:f[6]||"wgb",
          schluessel:f[7]?Object.fromEntries(SPH_KEYS.map((x,j)=>[x,parseFloat((f[7].split("/")[j]||"0").replace(",","."))||0])):undefined,abgang:f[8]||"",notiz:f[9]||""}); break;
        case "#VERMOEGEN": if(verm[f[1]]) verm[f[1]][f[2]]=zahl(f[3]); break;
        case "#RUECKLAGE": rlNeu.push({name:f[1]||"",anfang:zahl(f[2]),ende:zahl(f[3])}); break;
      }
      return;
    }
    if(!inTabelle) return;
    if(/^datum$/i.test(kopf)) return;
    if(f.length<5) return;
    buchNeu.push({id:neueId(),
      datum:f[0].trim(), beleg:f[1], text:f[2], kategorie:f[3],
      betrag:Math.abs(zahl(f[4])),
      zahlweg:(f[5]||"").trim().toLowerCase()==="bar"?"bar":"bank",
      bankref:f[6]||"", satz:parseInt(f[7],10)||0, sphaere:SPH_KEYS.includes((f[8]||"").trim())?f[8].trim():""});
  });

  zustand.stamm=stamm;
  zustand.kategorien=kategorienErgaenzen(katNeu.length ? katNeu : zustand.kategorien);
  if(regNeu.length) zustand.regeln=regNeu;
  zustand.buchungen=buchNeu;
  zustand.anlagen=anlNeu; verm.ruecklagen=rlNeu; zustand.vermoegen=verm; zustand.festBis=festBis;
  zustand.puffer=[]; zustand.pufferInfo=null; zustand.bearbeiten=null;
  zustand.protokoll.push({zeit:zeitstempel(), aktion:`CSV geladen, ${buchNeu.length} Buchungen ersetzen den bisherigen Stand`, vorher:"", nachher:""});

  const unbekannt=buchNeu.filter(b=>!kat(b.kategorie)).length;
  markiereSchmutzig();
  statusMeldung(`Aus CSV geladen: ${buchNeu.length} Buchungen`+(unbekannt?` — ${unbekannt} ohne passende Kategorie`:""));
  zeichne();
  if(unbekannt) alert(unbekannt+" Buchungen verweisen auf Kategorien, die in dieser Datei nicht definiert sind. Sie sind im Kassenbuch markiert und fließen in keine Auswertung ein.");
}

const DATENFORMAT="sudhaus-kladde";
const DATENVERSION=6;          // 4: USt je Buchung; 5: Tätigkeitsbereiche; 6: Anlagen, Vermögen, Festschreibung, Prüfung
const GESPEICHERT=["stamm","kategorien","regeln","buchungen","puffer","pufferInfo",
                   "protokoll","kassenstuerze","bankAbgleich","tab","filter","letztesDatum","zaehlung",
                   "anlagen","vermoegen","vorjahr","festBis","pruefung","abschlussTeil"];
let dateiHandle=null;          // File System Access API (Chrome/Edge), falls vorhanden
let geladenAm=0;               // Zeitstempel des eingebetteten Stands

function zustandFuerDatei(){
  const d={format:DATENFORMAT, version:DATENVERSION, gespeichertAm:Date.now()};
  GESPEICHERT.forEach(k=>{ d[k]=zustand[k]; });
  return d;
}

function zustandUebernehmen(d){
  if(!d || d.format!==DATENFORMAT) throw new Error("Unbekanntes Datenformat.");
  zustand.stamm={...STANDARD_STAMM(), ...(d.stamm||{})};
  zustand.kategorien=kategorienErgaenzen(Array.isArray(d.kategorien)&&d.kategorien.length ? d.kategorien : STANDARD_KATEGORIEN.map(k=>JSON.parse(JSON.stringify(k))));
  zustand.regeln=Array.isArray(d.regeln) ? d.regeln : STANDARD_REGELN.map(r=>({...r}));
  zustand.buchungen=(Array.isArray(d.buchungen)?d.buchungen:[]).map(b=>({...b, id:b.id||neueId()}));
  zustand.puffer=Array.isArray(d.puffer)?d.puffer:[];
  zustand.pufferInfo=d.pufferInfo||null;
  zustand.protokoll=Array.isArray(d.protokoll)?d.protokoll:[];
  zustand.kassenstuerze=Array.isArray(d.kassenstuerze)?d.kassenstuerze:[];
  zustand.bankAbgleich=d.bankAbgleich||null;
  zustand.filter={text:"",kat:"",monat:"", ...(d.filter||{})};
  zustand.letztesDatum=d.letztesDatum||"";
  zustand.zaehlung=d.zaehlung||null;
  zustand.anlagen=Array.isArray(d.anlagen)?d.anlagen:[];
  zustand.vermoegen={...leeresVermoegen(), ...(d.vermoegen||{})};
  zustand.vermoegen.anfang={...leeresVermoegen().anfang, ...(zustand.vermoegen.anfang||{})};
  zustand.vermoegen.ende={...leeresVermoegen().ende, ...(zustand.vermoegen.ende||{})};
  if(!Array.isArray(zustand.vermoegen.ruecklagen)) zustand.vermoegen.ruecklagen=[];
  zustand.vorjahr=d.vorjahr||null;
  zustand.festBis=d.festBis||"";
  zustand.pruefung={datum:"",pruefer1:"",pruefer2:"",feststellungen:"", ...(d.pruefung||{})};
  zustand.abschlussTeil=d.abschlussTeil||"vermoegen";
  zustand.anlageBearbeiten=null; zustand.anlageVorlage=null;
  zustand.bearbeiten=null; zustand.formVorlage=null;
  const tabs=[...document.querySelectorAll(".reiter button")].map(t=>t.dataset.tab);
  zeigeTab(tabs.includes(d.tab)?d.tab:"kasse");
}

// JSON so verpacken, dass es gefahrlos in einem <script>-Element stehen kann
const jsonSicher = o => JSON.stringify(o).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");

function seitenHtml(daten){
  const kopie=VORLAGE.cloneNode(true);
  const block=kopie.querySelector("#kassenbuchDaten");
  block.textContent = daten ? "\n"+jsonSicher(daten)+"\n" : "";
  return "<!DOCTYPE html>\n"+kopie.outerHTML+"\n";
}

function dateiname(zusatz){
  let n="";
  try{ n=decodeURIComponent(location.pathname.split("/").pop()||""); }catch(e){}
  if(!/\.html?$/i.test(n)) n="Kassenbuch_"+zustand.stamm.verein.replace(/[^\wÄÖÜäöüß]+/g,"_").replace(/^_|_$/g,"")+".html";
  return zusatz ? n.replace(/(\.html?)$/i, "_"+zusatz+"$1") : n;
}

function herunterladen(inhalt, name){
  const blob=new Blob([inhalt],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

async function speichern(){
  const daten=zustandFuerDatei();
  const html=seitenHtml(daten);
  try{
    if(window.showSaveFilePicker){
      if(!dateiHandle){
        dateiHandle=await window.showSaveFilePicker({suggestedName:dateiname(),
          types:[{description:"HTML-Seite",accept:{"text/html":[".html",".htm"]}}]});
      }
      const w=await dateiHandle.createWritable(); await w.write(html); await w.close();
      markiereSauber("Gespeichert in "+dateiHandle.name+" um "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
    }else{
      herunterladen(html, dateiname());
      markiereSauber("Gespeichert als "+dateiname()+" — überschreibe damit die alte Datei");
    }
    geladenAm=daten.gespeichertAm;
  }catch(err){
    if(err && err.name==="AbortError") return;           // Dialog abgebrochen
    dateiHandle=null;
    alert("Speichern hat nicht geklappt: "+(err&&err.message||err)+"\n\nDie Seite lädt die Datei stattdessen herunter.");
    herunterladen(html, dateiname());
    markiereSauber("Als Download gespeichert");
  }
}

function leereVorlageSpeichern(){
  herunterladen(seitenHtml(null), "Sudhaus-Kladde_leer.html");
  statusMeldung("Leere Vorlage heruntergeladen");
}

function jahreswechsel(){
  const alt=zustand.stamm.jahr, neu=alt+1;
  if(zustand.puffer.length && !confirm("Es liegt noch ein nicht übernommener Kontoimport vor. Er wird ins neue Jahr mitgenommen. Weiter?")) return;
  if(!confirm(`Jahreswechsel ${alt} → ${neu}\n\n1. Eine Archivkopie „${dateiname(String(alt))}“ mit allen Daten von ${alt} wird heruntergeladen.\n2. Endstände werden zu Anfangswerten von ${neu}.\n3. Die Buchungen von ${alt} und älter werden aus dieser Seite entfernt.\n\nFortfahren?`)) return;

  const archiv=zustandFuerDatei();
  herunterladen(seitenHtml(archiv), dateiname(String(alt)));

  const r=rechne(), st=zustand.stamm;
  // Kennzahlen für die Vorjahresspalte des Kassenberichts
  const kat={}; zustand.kategorien.forEach(k=>{ if(r.proKategorie[k.key]) kat[k.key]=r.proKategorie[k.key]; });
  const sEin=SPH_KEYS.reduce((a,x)=>a+r.sph[x].ein,0), sAus=SPH_KEYS.reduce((a,x)=>a+r.sph[x].aus,0), sAfa=SPH_KEYS.reduce((a,x)=>a+r.sph[x].afa,0);
  zustand.vorjahr={jahr:alt, kat, ein:Math.round(sEin*100)/100, aus:Math.round(sAus*100)/100, afa:Math.round(sAfa*100)/100,
    invest:r.investSumme, ergebnis:Math.round((sEin-sAus-sAfa)*100)/100, kasseEnde:r.kasseEnde, kontoEnde:r.kontoEnde, gewinn:r.gewinn};
  // Vermögensübersicht: Endwerte werden Anfangswerte
  const vm=zustand.vermoegen;
  vm.anfang={...vm.ende}; vm.ende={vorraete:0,forderungen:0,verbindlichkeiten:0,darlehen:0};
  (vm.ruecklagen||[]).forEach(x=>{ x.anfang=x.ende; });
  vm.bemerkung="";
  zustand.pruefung={datum:"",pruefer1:"",pruefer2:"",feststellungen:""};
  zustand.festBis="";
  st.kassenanfang=r.kasseEnde; st.kontoanfang=r.kontoEnde;
  st.umsatzVorjahr=r.umsatz; st.verlustvortrag=r.verlustRest; st.jahr=neu;
  const bleiben=zustand.buchungen.filter(b=>String(b.datum||"").slice(0,4)>String(alt));
  zustand.buchungen=bleiben;
  zustand.protokoll=[{zeit:zeitstempel(), aktion:`Jahreswechsel ${alt} → ${neu}. Archiv: ${dateiname(String(alt))}. ${bleiben.length} Buchungen aus ${neu} übernommen.`, vorher:"", nachher:""}];
  zustand.kassenstuerze=[]; zustand.zaehlung=null; zustand.filter={text:"",kat:"",monat:""};
  if(zustand.bankAbgleich && String(zustand.bankAbgleich.datum).slice(0,4)<=String(alt)) zustand.bankAbgleich=null;
  zustand.puffer.forEach(p=>{ p.fremdesJahr=!imJahr(p); if(p.fremdesJahr) p.uebernehmen=false; });
  dateiHandle=null;                                       // das neue Jahr nicht versehentlich über das Archiv schreiben
  zeigeTab("kasse");
  markiereSchmutzig(); zeichne();
  alert(`${neu} ist eingerichtet. Speichere die Seite jetzt (Strg+S) unter ihrem gewohnten Namen — die Archivkopie von ${alt} liegt in deinen Downloads.`);
}

document.querySelectorAll(".reiter button").forEach(t=>t.onclick=()=>{
  zeigeTab(t.dataset.tab); zeichne();
  window.scrollTo({top:0,behavior:"smooth"});
});
g("btnSpeichern").onclick=speichern;
g("btnCsvExport").onclick=csvSpeichern;
g("btnLaden").onclick=()=>g("dateiWahl").click();
window.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey) && !e.altKey && e.key.toLowerCase()==="s"){ e.preventDefault(); speichern(); }
});

(function starten(){
  let meldung="Bereit — noch nichts erfasst";
  const roh=(g("kassenbuchDaten").textContent||"").trim();
  if(roh){
    try{
      const d=JSON.parse(roh);
      zustandUebernehmen(d);
      geladenAm=d.gespeichertAm||0;
      const wann=geladenAm?new Date(geladenAm).toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}):"";
      meldung=`Stand vom ${wann} geöffnet — ${zustand.buchungen.length} Buchungen`;
    }catch(err){
      alert("Die in dieser Seite gespeicherten Daten ließen sich nicht lesen ("+err.message+"). Die Seite startet leer; die Datei selbst bleibt unverändert, solange du nicht speicherst.");
    }
  }
  markiereSauber(meldung);
  zeichne();
})();
