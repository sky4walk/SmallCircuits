<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudhaus-Kladde — Kassenbuch, EÜR und Kontoimport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --sud-900:#0F231B; --sud-chrome:#163327; --sud-700:#1E4535; --sud-600:#2B5C48;
  --messing:#C08A2E; --messing-hell:#E8BE63;
  --papier:#F4EFE0; --papier-tief:#EAE3D0; --linie:#D9CFB4;
  --tinte:#241F18; --tinte-2:#6A6152;
  --warn:#9E3520; --warn-bg:#F6E3DD; --ok:#33604A; --ok-bg:#E3EDE5;
  --radius:3px;
  --font-display:"Bitter",Georgia,serif;
  --font-ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --font-num:"JetBrains Mono","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--sud-900);color:var(--tinte);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--messing-hell);outline-offset:2px}

.kopf{background:var(--sud-chrome);color:var(--papier);border-bottom:1px solid #000}
.kopf-innen{max-width:1240px;margin:0 auto;padding:18px 22px 0;display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.marke{flex:1 1 260px;min-width:230px}
.marke h1{font-family:var(--font-display);font-weight:700;font-size:25px;margin:0;letter-spacing:-.01em;color:var(--papier)}
.marke .unter{font-size:13px;color:#9EB3A6;margin-top:2px}
.marke .verein{margin-top:12px;font-family:var(--font-display);font-size:16px;color:var(--messing-hell)}
.marke .verein span{color:#9EB3A6;font-family:var(--font-ui);font-size:13px;display:block}

.glas-block{display:flex;gap:16px;align-items:flex-start;flex:0 0 auto;padding-bottom:6px}
.glas-text{font-size:13px;color:#9EB3A6;max-width:215px;padding-top:4px}
.glas-text .zahl{font-family:var(--font-num);font-size:22px;font-weight:600;color:var(--papier);display:block;line-height:1.2}
.glas-text .status{margin-top:8px;font-weight:600}
.glas-text .status.gut{color:#7FBF9A}
.glas-text .status.knapp{color:var(--messing-hell)}
.glas-text .status.voll{color:#E88E76}
.glas-svg{width:74px;height:132px;flex:0 0 auto}
.fuellung{transition:transform .7s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.fuellung{transition:none}}

.reiter{max-width:1240px;margin:0 auto;padding:14px 22px 0;display:flex;gap:2px;flex-wrap:wrap}
.reiter button{font-family:var(--font-ui);font-size:14px;font-weight:600;background:transparent;color:#9EB3A6;border:0;border-bottom:3px solid transparent;padding:9px 15px;cursor:pointer;border-radius:var(--radius) var(--radius) 0 0}
.reiter button:hover{color:var(--papier);background:rgba(255,255,255,.05)}
.reiter button[aria-selected="true"]{color:var(--sud-chrome);background:var(--papier);border-bottom-color:var(--messing)}

.buehne{max-width:1240px;margin:0 auto;padding:0 22px 60px}
.blatt{background:var(--papier);border-radius:0 var(--radius) var(--radius) var(--radius);padding:24px 26px 30px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.blatt h2{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 4px}
.blatt h3{font-family:var(--font-display);font-weight:500;font-size:15px;margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--linie)}
.blatt h3:first-child{margin-top:0}
.hinweis{font-size:13.5px;color:var(--tinte-2);margin:0 0 18px;max-width:74ch}

.formzeile{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.feld{display:flex;flex-direction:column;gap:3px}
.feld label{font-size:12px;font-weight:600;color:var(--tinte-2);text-transform:uppercase;letter-spacing:.04em}
.feld input,.feld select{font-family:var(--font-ui);font-size:14.5px;color:var(--tinte);background:#FFFDF7;border:1px solid var(--linie);border-radius:var(--radius);padding:7px 9px;min-height:36px}
.feld input.num{font-family:var(--font-num);text-align:right}
.feld.w-datum{width:145px}.feld.w-beleg{width:110px}
.feld.w-text{flex:1 1 240px;min-width:180px}
.feld.w-kat{flex:1 1 300px;min-width:210px}
.feld.w-betrag{width:130px}.feld.w-weg{width:105px}
.feld.w-halb{flex:1 1 250px}

button.tat{font-family:var(--font-ui);font-size:14.5px;font-weight:600;background:var(--sud-700);color:var(--papier);border:1px solid var(--sud-900);border-radius:var(--radius);padding:8px 17px;min-height:36px;cursor:pointer}
button.tat:hover{background:var(--sud-600)}
button.tat.messing{background:var(--messing);color:#2B1E06;border-color:#8F6716}
button.tat.messing:hover{background:var(--messing-hell)}
button.tat.leise{background:transparent;color:var(--tinte-2);border-color:var(--linie)}
button.tat.leise:hover{background:var(--papier-tief);color:var(--tinte)}
button.tat[disabled]{opacity:.45;cursor:not-allowed}
.knopfreihe{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;align-items:center}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinte-2);font-weight:600;padding:6px 8px;border-bottom:1.5px solid var(--tinte-2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--linie);vertical-align:top}
tr:hover td{background:var(--papier-tief)}
td.num,th.num{text-align:right;font-family:var(--font-num);white-space:nowrap;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--font-num);font-size:13px;white-space:nowrap}
tr.negativ td{background:var(--warn-bg)}
tr.dublette td{opacity:.5}
tr.verdacht td{background:#F9F0DA}
tr.verdacht:hover td{background:#F3E6C6}
.warnzeichen{color:var(--warn);font-weight:600;cursor:help}
tr.summe td{font-weight:600;border-top:1.5px solid var(--tinte-2);border-bottom:0;background:transparent}
tr.summe:hover td{background:transparent}
.tabellenrahmen{overflow-x:auto;margin-top:4px}
.mini{font-size:12px;color:var(--tinte-2)}
button.zeilentat{background:none;border:0;color:var(--tinte-2);cursor:pointer;font-size:15px;padding:1px 5px;border-radius:var(--radius);line-height:1}
button.zeilentat:hover{background:var(--linie);color:var(--warn)}
select.katwahl{font-family:var(--font-ui);font-size:12.5px;padding:3px 5px;border:1px solid var(--linie);border-radius:var(--radius);background:#FFFDF7;max-width:230px}
select.katwahl.offen{border-color:var(--warn);background:var(--warn-bg)}

.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:6px 0 4px}
.kachel{background:#FFFDF7;border:1px solid var(--linie);border-left:3px solid var(--messing);border-radius:var(--radius);padding:11px 13px}
.kachel .titel{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--tinte-2);font-weight:600}
.kachel .wert{font-family:var(--font-num);font-size:21px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.kachel .fuss{font-size:12px;color:var(--tinte-2);margin-top:2px}
.kachel.gruen{border-left-color:var(--ok)}
.kachel.rot{border-left-color:var(--warn)}

.merker{border-left:3px solid var(--warn);background:var(--warn-bg);padding:11px 14px;border-radius:var(--radius);font-size:13.5px;margin:14px 0}
.merker.ruhig{border-left-color:var(--messing);background:#F7EFDC}
.merker.gut{border-left-color:var(--ok);background:var(--ok-bg)}
.merker strong{display:block;margin-bottom:3px}

.ablage{border:2px dashed var(--linie);border-radius:var(--radius);padding:26px 20px;text-align:center;background:#FFFDF7;margin-bottom:16px}
.ablage.bereit{border-color:var(--messing);background:#FBF4E4}
.ablage p{margin:0 0 10px;color:var(--tinte-2);font-size:13.5px}

.uebertrag td.zeile{width:70px}
.uebertrag .formular{font-family:var(--font-display);font-weight:700;font-size:14px;background:var(--papier-tief)}
.uebertrag .formular td{border-bottom:1px solid var(--tinte-2)}
.zeileneingabe{width:56px;font-family:var(--font-num);font-size:13px;text-align:center;border:1px solid var(--linie);border-radius:var(--radius);padding:3px;background:#FFFDF7}

.statusleiste{position:sticky;bottom:0;z-index:5;background:var(--sud-chrome);color:#9EB3A6;border-top:1px solid #000;font-size:13px}
.statusleiste .innen{max-width:1240px;margin:0 auto;padding:9px 22px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.punkt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.punkt.offen{background:var(--messing-hell)}

@media (max-width:640px){
  .kopf-innen{padding:14px 14px 0}.reiter{padding:12px 14px 0}
  .buehne{padding:0 14px 40px}.blatt{padding:18px 15px 24px}
  .glas-block{order:3;width:100%}
}
@media print{
  body{background:#fff}
  .kopf,.reiter,.statusleiste,.nichtdrucken{display:none !important}
  .buehne{padding:0;max-width:none}
  .blatt{box-shadow:none;background:#fff;padding:0}
  .kachel,tr{break-inside:avoid}
}
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-innen">
    <div class="marke">
      <h1>Sudhaus-Kladde</h1>
      <div class="unter">Kassenbuch, Kontoimport und EÜR — alles in einer Datei</div>
      <div class="verein" id="kopfVerein">Brauverein SC e.V.<span id="kopfZeitraum">Wirtschaftsjahr 2026</span></div>
    </div>
    <div class="glas-block">
      <svg class="glas-svg" viewBox="0 0 74 132" role="img" aria-labelledby="glasTitel">
        <title id="glasTitel">Füllstand des Umsatzes gegen die Kleinunternehmergrenze</title>
        <defs><clipPath id="glasForm">
          <path d="M14 14 L60 14 L54 118 Q53 124 47 124 L27 124 Q21 124 20 118 Z"/>
        </clipPath></defs>
        <path d="M14 14 L60 14 L54 118 Q53 124 47 124 L27 124 Q21 124 20 118 Z" fill="#0B1A14"/>
        <g clip-path="url(#glasForm)">
          <rect id="glasFuellung" class="fuellung" x="10" y="14" width="54" height="110" fill="#C98A26"/>
          <rect id="glasSchaum" class="fuellung" x="10" y="14" width="54" height="7" fill="#F0E6D2"/>
        </g>
        <line id="glasMarke" x1="12" y1="30" x2="62" y2="30" stroke="#E88E76" stroke-width="1.5" stroke-dasharray="3 2"/>
        <path d="M14 14 L60 14 L54 118 Q53 124 47 124 L27 124 Q21 124 20 118 Z" fill="none" stroke="#8FA79A" stroke-width="1.5"/>
        <line x1="14" y1="14" x2="60" y2="14" stroke="#C7D6CD" stroke-width="2.5"/>
      </svg>
      <div class="glas-text">
        <span class="zahl" id="umsatzZahl">0 €</span>
        Umsatz im laufenden Jahr
        <div class="status" id="umsatzStatus">—</div>
      </div>
    </div>
  </div>
  <nav class="reiter" role="tablist" aria-label="Bereiche">
    <button role="tab" data-tab="kasse"     aria-selected="true">Kassenbuch</button>
    <button role="tab" data-tab="bank"      aria-selected="false">Kontoauszug einlesen</button>
    <button role="tab" data-tab="auswert"   aria-selected="false">Auswertung</button>
    <button role="tab" data-tab="uebertrag" aria-selected="false">Übertragungsblatt</button>
    <button role="tab" data-tab="stamm"     aria-selected="false">Einstellungen</button>
    <button role="tab" data-tab="hilfe"     aria-selected="false">Anleitung</button>
  </nav>
</header>

<main class="buehne"><div class="blatt" id="blatt"></div></main>

<div class="statusleiste"><div class="innen">
  <div><span class="punkt" id="statusPunkt"></span><span id="statusText">Bereit</span></div>
  <div>
    <button class="tat messing" id="btnSpeichern">CSV speichern</button>
    <button class="tat leise" id="btnLaden">CSV laden</button>
    <input type="file" id="dateiWahl" accept=".csv,text/csv" hidden>
    <input type="file" id="camtWahl" accept=".zip,.xml,application/zip,text/xml" multiple hidden>
  </div>
</div></div>

<script>
"use strict";

/* ============================================================
   Kategorien
   ============================================================ */

const STANDARD_KATEGORIEN = [
  {key:"E_KU",      art:"einnahme", euer:true,  umsatz:true,  transit:false, zeile:"", text:"Betriebseinnahmen als umsatzsteuerlicher Kleinunternehmer"},
  {key:"E_UST",     art:"einnahme", euer:true,  umsatz:true,  transit:false, zeile:"", text:"Umsatzsteuerpflichtige Betriebseinnahmen (netto)"},
  {key:"E_ANL",     art:"einnahme", euer:true,  umsatz:false, transit:false, zeile:"", text:"Veräußerung von Anlagevermögen"},
  {key:"E_SONST",   art:"einnahme", euer:true,  umsatz:true,  transit:false, zeile:"", text:"Sonstige Betriebseinnahmen"},
  {key:"E_BEITRAG", art:"einnahme", euer:false, umsatz:false, transit:false, zeile:"", text:"Echte Mitgliedsbeiträge (nicht steuerbar)"},
  {key:"E_IDEELL",  art:"einnahme", euer:false, umsatz:false, transit:false, zeile:"", text:"Sonstige nicht steuerbare Einnahmen (ideeller Bereich)"},

  {key:"T_EIN",     art:"einnahme", euer:false, umsatz:false, transit:true,  zeile:"", text:"Geldtransit: Bareinzahlung auf das Konto"},
  {key:"T_AUS",     art:"ausgabe",  euer:false, umsatz:false, transit:true,  zeile:"", text:"Geldtransit: Barabhebung vom Konto"},

  {key:"A_WARE",    art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Waren, Roh- und Hilfsstoffe (Malz, Hopfen, Hefe, Gebinde)"},
  {key:"A_MIETE",   art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Miete / Pacht für Geschäftsräume und Grundstücke"},
  {key:"A_ENERGIE", art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Energie, Wasser, Reinigung"},
  {key:"A_VERS",    art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Beiträge, Gebühren, Abgaben, Versicherungen (nicht für Gebäude und Kfz)"},
  {key:"A_GELD",    art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Kontoführung und Geldverkehrskosten"},
  {key:"A_AFA",     art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Abschreibungen auf bewegliche Wirtschaftsgüter (AfA)"},
  {key:"A_GWG",     art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Geringwertige Wirtschaftsgüter"},
  {key:"A_REPA",    art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Reparatur und Instandhaltung"},
  {key:"A_WERB",    art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Werbe- und Reisekosten"},
  {key:"A_BUERO",   art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Porto, Telefon, Büromaterial"},
  {key:"A_UEBRIG",  art:"ausgabe",  euer:true,  umsatz:false, transit:false, zeile:"", text:"Übrige unbeschränkt abziehbare Betriebsausgaben"},

  {key:"A_GEWST",   art:"ausgabe",  euer:false, umsatz:false, transit:false, zeile:"", text:"Gewerbesteuer (nicht abziehbar, § 4 Abs. 5b EStG)"},
  {key:"A_KST",     art:"ausgabe",  euer:false, umsatz:false, transit:false, zeile:"", text:"Körperschaftsteuer / Solidaritätszuschlag (nicht abziehbar)"},
  {key:"A_IDEELL",  art:"ausgabe",  euer:false, umsatz:false, transit:false, zeile:"", text:"Ausgaben des ideellen Bereichs (nicht betrieblich)"}
];

const STANDARD_REGELN = [
  {muster:"SB-EINZAHLUNG", kategorie:"T_EIN"},
  {muster:"EINZAHLUNG",    kategorie:"T_EIN"},
  {muster:"GA NR",         kategorie:"T_AUS"},
  {muster:"BARGELDAUSZAHLUNG", kategorie:"T_AUS"},
  {muster:"MITGLIEDSBEITRAG", kategorie:"E_BEITRAG"},
  {muster:"JAHRESBEITRAG",    kategorie:"E_BEITRAG"},
  {muster:"ENTGELTABSCHLUSS",  kategorie:"A_GELD"},
  {muster:"RECHNUNGSABSCHLUSS",kategorie:"A_GELD"},
  {muster:"KONTOFUEHRUNG",     kategorie:"A_GELD"}
];

const zustand = {
  stamm:{verein:"Brauverein SC e.V.", betrieb:"Brauerei", steuernummer:"", finanzamt:"",
         jahr:new Date().getFullYear(), hebesatz:450, verlustvortrag:0, kassenanfang:0, umsatzVorjahr:0},
  kategorien:STANDARD_KATEGORIEN.map(k=>({...k})),
  regeln:STANDARD_REGELN.map(r=>({...r})),
  buchungen:[],
  puffer:[],
  pufferInfo:null,
  tab:"kasse",
  schmutzig:false
};

/* ============================================================
   Hilfen
   ============================================================ */

const eur = new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const eurGanz = new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});
const g = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => eur.format(n||0)+" €";
const fmtGanz = n => eurGanz.format(Math.round(n||0))+" €";
const kuerze = (s,n) => { s=String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; };

function zahl(s){
  if(typeof s==="number") return s;
  if(!s) return 0;
  let t=String(s).trim().replace(/[€\s]/g,"");
  if(t.includes(",")) t=t.replace(/\./g,"").replace(",",".");
  const n=parseFloat(t); return isNaN(n)?0:n;
}
const csvZahl = n => String((n||0).toFixed(2)).replace(".",",");
const kat = key => zustand.kategorien.find(k=>k.key===key)||null;

function markiereSchmutzig(){
  zustand.schmutzig=true;
  g("statusPunkt").className="punkt offen";
  g("statusText").textContent="Nicht gesichert — vor dem Schließen CSV speichern";
}
function markiereSauber(t){
  zustand.schmutzig=false;
  g("statusPunkt").className="punkt";
  g("statusText").textContent=t||"Gesichert";
}
window.addEventListener("beforeunload",e=>{ if(zustand.schmutzig){e.preventDefault();e.returnValue="";} });

/* ============================================================
   Rechenkern
   ============================================================ */

const sortiert = () => [...zustand.buchungen].sort((a,b)=>
  (a.datum||"").localeCompare(b.datum||"") || String(a.beleg||"").localeCompare(String(b.beleg||"")));

function rechne(){
  const r={einnahmenEUER:0,ausgabenEUER:0,proKategorie:{},umsatz:0,
           kasseEnde:zustand.stamm.kassenanfang,kasseNegativAb:null,
           bankSaldo:0,transit:0,ausserhalb:{ein:0,aus:0},ohneKategorie:0};
  zustand.kategorien.forEach(k=>{r.proKategorie[k.key]=0;});
  let kasse=zustand.stamm.kassenanfang;

  sortiert().forEach(b=>{
    const k=kat(b.kategorie), betrag=Math.abs(b.betrag||0);
    if(!k){ r.ohneKategorie++; return; }
    r.proKategorie[k.key]+=betrag;
    const vz = k.art==="einnahme" ? 1 : -1;

    if(k.transit){
      // Bankseite gemäß Richtung, Kassenseite gegenläufig — reine Umbuchung
      r.bankSaldo += vz*betrag;
      kasse -= vz*betrag;
      r.transit += betrag;
      if(kasse<-0.005 && !r.kasseNegativAb) r.kasseNegativAb=b.datum;
      return;
    }
    if(k.art==="einnahme"){
      if(k.euer) r.einnahmenEUER+=betrag; else r.ausserhalb.ein+=betrag;
      if(k.umsatz) r.umsatz+=betrag;
    }else{
      if(k.euer) r.ausgabenEUER+=betrag; else r.ausserhalb.aus+=betrag;
    }
    if(b.zahlweg==="bar"){
      kasse+=vz*betrag;
      if(kasse<-0.005 && !r.kasseNegativAb) r.kasseNegativAb=b.datum;
    }else r.bankSaldo+=vz*betrag;
  });

  r.kasseEnde=kasse;
  r.gewinn=r.einnahmenEUER-r.ausgabenEUER;

  const vv=Math.max(0,zustand.stamm.verlustvortrag);
  r.verlustAbzug=Math.max(0,Math.min(vv,r.gewinn));
  r.einkommen=r.gewinn-r.verlustAbzug;
  r.freibetragKSt=Math.max(0,Math.min(5000,r.einkommen));
  r.zvE=Math.max(0,r.einkommen-r.freibetragKSt);
  r.kst=Math.floor(r.zvE*0.15);
  r.soli=Math.round(r.kst*0.055*100)/100;
  r.verlustRest=Math.max(0,vv-r.verlustAbzug);

  r.gewerbeertrag=r.gewinn>0?Math.floor(r.gewinn/100)*100:0;
  r.freibetragGewSt=Math.min(5000,r.gewerbeertrag);
  r.gewerbeertragNachFB=Math.max(0,r.gewerbeertrag-r.freibetragGewSt);
  r.messbetrag=Math.floor(r.gewerbeertragNachFB*0.035);
  r.gewst=Math.floor(r.messbetrag*zustand.stamm.hebesatz/100);
  r.messbetragOhneFB=Math.floor(r.gewerbeertrag*0.035);
  r.gewstOhneFB=Math.floor(r.messbetragOhneFB*zustand.stamm.hebesatz/100);
  return r;
}

function umsatzLage(r){

/* ============================================================
   ZIP ohne Bibliothek
   ============================================================ */

async function zipEntpacken(datei){
  const buf=await datei.arrayBuffer();
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error("Das sieht nicht wie eine ZIP-Datei aus.");
  const anzahl=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const eintraege=[];
  for(let n=0;n<anzahl;n++){
    if(off+46>buf.byteLength || dv.getUint32(off,true)!==0x02014b50) break;
    const methode=dv.getUint16(off+10,true);
    const compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true);
    const extraLen=dv.getUint16(off+30,true);
    const kommLen=dv.getUint16(off+32,true);
    const lokal=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nameLen));
    const lNameLen=dv.getUint16(lokal+26,true);
    const lExtraLen=dv.getUint16(lokal+28,true);
    const start=lokal+30+lNameLen+lExtraLen;
    eintraege.push({name,methode,daten:u8.subarray(start,start+compSize)});
    off+=46+nameLen+extraLen+kommLen;
  }
  const raus=[];
  for(const e of eintraege){
    if(!/\.xml$/i.test(e.name)) continue;
    let bytes;
    if(e.methode===0) bytes=e.daten;
    else if(e.methode===8){
      if(typeof DecompressionStream==="undefined")
        throw new Error("Dieser Browser kann ZIP-Dateien nicht entpacken. Entpacke sie bitte selbst und wähle die XML-Dateien direkt aus.");
      const strom=new Blob([e.daten]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      bytes=new Uint8Array(await new Response(strom).arrayBuffer());
    } else continue;
    raus.push({name:e.name, text:new TextDecoder("utf-8").decode(bytes)});
  }
  return raus;
}

/* ============================================================
   CAMT lesen — camt.052 und camt.053, alle Versionen
   ============================================================ */

function camtLesen(text, quelle){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("XML in "+quelle+" ist fehlerhaft.");
  const alle=(el,tag)=>Array.from(el.getElementsByTagNameNS("*",tag));
  const erst=(el,tag)=>alle(el,tag)[0]||null;
  const art=doc.documentElement.namespaceURI||"";
  const typ=/camt\.05(\d)/.exec(art);

  const buchungen=[];
  for(const ntry of alle(doc,"Ntry")){
    const sts=erst(ntry,"Sts");
    const stsCd=sts?((erst(sts,"Cd")||sts).textContent||"").trim():"BOOK";
    if(stsCd && stsCd!=="BOOK") continue;               // Vormerkposten überspringen

    const amtEl=erst(ntry,"Amt"), cdEl=erst(ntry,"CdtDbtInd");
    if(!amtEl||!cdEl) continue;
    const betrag=Math.abs(parseFloat(amtEl.textContent));
    const richtung=cdEl.textContent.trim();
    const bd=erst(ntry,"BookgDt");
    const datum=bd?((erst(bd,"Dt")||erst(bd,"DtTm")||{textContent:""}).textContent||"").slice(0,10):"";

    let ref="";
    for(const c of Array.from(ntry.children)) if(c.localName==="AcctSvcrRef") ref=(c.textContent||"").trim();

    const txs=alle(ntry,"TxDtls");
    const basis=txs[0]||ntry;
    let gegen="";
    const rp=erst(basis,"RltdPties");
    if(rp){
      const p=erst(rp, richtung==="CRDT"?"Dbtr":"Cdtr");
      if(p){ const nm=erst(p,"Nm"); if(nm) gegen=(nm.textContent||"").trim(); }
    }
    const zweck=alle(basis,"Ustrd").map(u=>(u.textContent||"").trim()).filter(Boolean).join(" ").replace(/\s+/g," ");

    buchungen.push({
      datum, betrag, richtung, gegen, zweck,
      bankref: ref || [datum,betrag.toFixed(2),richtung,zweck.slice(0,60)].join("|"),
      teile: txs.length, quelle, camt: typ?("camt.05"+typ[1]):"camt"
    });
  }
  return buchungen;
}

function regelTreffer(b){
  const heu=((b.gegen||"")+" "+(b.zweck||"")).toUpperCase();
  for(const r of zustand.regeln){
    if(!r.muster) continue;
    if(heu.includes(r.muster.toUpperCase())){
      const k=kat(r.kategorie);
      if(k && ((k.art==="einnahme")===(b.richtung==="CRDT"))) return r.kategorie;
    }
  }
  return "";
}

// Weiche Prüfung: gibt es schon eine Buchung mit gleichem Betrag, gleicher
// Richtung und Datum in der Nähe? Trifft vor allem handgetippte Kontovorgänge.
const TAGE_FENSTER=3;
function aehnlicheBuchung(b){
  const ziel=Date.parse(b.datum);
  if(isNaN(ziel)) return null;
  for(const x of zustand.buchungen){
    if(x.bankref && x.bankref===b.bankref) continue;      // echte Dublette, separat gemeldet
    if(Math.abs(Math.abs(x.betrag)-b.betrag)>0.005) continue;
    const k=kat(x.kategorie); if(!k) continue;
    if((k.art==="einnahme")!==(b.richtung==="CRDT")) continue;
    const d=Date.parse(x.datum); if(isNaN(d)) continue;
    if(Math.abs(d-ziel)/86400000>TAGE_FENSTER) continue;
    const wie = x.bankref ? "bereits importiert" : "von Hand erfasst";
    return `${x.datum}, Beleg ${x.beleg||"—"}: ${kuerze(x.text,60)} (${wie})`;
  }
  return null;
}

async function camtEinlesen(dateien){
  const roh=[]; const namen=[];
  for(const d of dateien){
    if(/\.zip$/i.test(d.name)){
      const inhalt=await zipEntpacken(d);
      inhalt.forEach(x=>{ roh.push(...camtLesen(x.text,x.name)); namen.push(x.name); });
    }else{
      roh.push(...camtLesen(await d.text(), d.name)); namen.push(d.name);
    }
  }
  const bekannt=new Set(zustand.buchungen.map(b=>b.bankref).filter(Boolean));
  const gesehen=new Set();
  const puffer=[];
  for(const b of roh){
    const dub = bekannt.has(b.bankref) || gesehen.has(b.bankref);
    gesehen.add(b.bankref);
    puffer.push({...b, kategorie:regelTreffer(b), dublette:dub,
                 verdacht: dub ? null : aehnlicheBuchung(b), uebernehmen:!dub});
  }
  puffer.sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
  zustand.puffer=puffer;
  const format=[...new Set(roh.map(b=>b.camt))].join(", ")||"—";
  zustand.pufferInfo={
    dateien:namen.length, gefunden:roh.length,
    dubletten:puffer.filter(p=>p.dublette).length,
    verdacht:puffer.filter(p=>p.verdacht).length,
    format,
    von:puffer.length?puffer[0].datum:"", bis:puffer.length?puffer[puffer.length-1].datum:"",
    sammel:roh.filter(b=>b.teile>1).length
  };
}

function ansichtHilfe(){
  return `
    <h2>So arbeitest du damit</h2>

    <h3>Einmal am Anfang</h3>
    <p class="hinweis">Unter „Einstellungen“ Verein, Jahr, Hebesatz der Gemeinde, Kassenbestand am 1. Januar und den Umsatz des Vorjahres eintragen. Den Verlustvortrag findest du im letzten Körperschaftsteuerbescheid. Danach einmal auf „CSV speichern“ — diese Datei ist ab jetzt dein Kassenbuch.</p>

    <h3>Monatlich</h3>
    <p class="hinweis">CSV laden. Im Sparkassen-Banking den Umsatzexport als <strong>CAMT V8</strong> herunterladen und die ZIP-Datei unter „Kontoauszug einlesen“ ablegen. Jede Zeile bekommt einen Kategorievorschlag; wo noch „offen“ steht, entscheidest du. Mit „＋Regel“ merkt sich die Seite die Zuordnung für ähnliche Buchungen.</p>
    <p class="hinweis">Bareinnahmen aus dem Ausschank erfasst du im Kassenbuch von Hand — die stehen in keinem Kontoauszug. Danach CSV wieder speichern.</p>

    <h3>Der wichtigste Punkt: Geldtransit</h3>
    <p class="hinweis">Wenn du Bargeld aus der Kasse auf das Konto einzahlst, ist das <strong>kein Umsatz</strong>. Der Umsatz ist beim Verkauf entstanden und steht schon im Kassenbuch. Zählst du die Einzahlung nochmal als Einnahme, verdoppelst du deine Erlöse — und reißt womöglich eine Grenze, die gar nicht gerissen ist.</p>
    <p class="hinweis">Dafür gibt es die zwei Transit-Kategorien. Sie verschieben Geld zwischen Kasse und Konto, ohne Gewinn oder Umsatz zu berühren. Der Import erkennt Einzahlungen und Abhebungen meist automatisch.</p>

    <h3>Am Jahresende</h3>
    <p class="hinweis">Bargeld zählen und mit dem Kassenbestand vergleichen. Dann auf „Übertragungsblatt“ und drucken. Die Werte tippst du in Mein ELSTER ab oder gibst den Ausdruck der Kanzlei.</p>

    <h3>Welchen Export die Sparkasse liefert</h3>
    <p class="hinweis">Der Umsatzexport erzeugt <strong>camt.052</strong>, einen Kontobericht. Der offizielle <strong>Kontoauszug</strong> ist camt.053 und liegt im elektronischen Postfach. Zum Buchen taugt beides und die Seite versteht beides — für die Belegablage solltest du aber den echten Kontoauszug archivieren, denn nur er ist der Nachweis. Die zehnjährige Aufbewahrungspflicht liegt bei dir, nicht bei der Bank.</p>

    <h3>Worauf du sonst achten solltest</h3>
    <p class="hinweis"><strong>Echte Mitgliedsbeiträge</strong> — satzungsgemäß, von allen gleich, ohne Gegenleistung — bleiben nach § 8 Abs. 5 KStG außer Ansatz und zählen nicht auf die Kleinunternehmergrenze. Bekommt ein Mitglied für seinen Beitrag etwas Konkretes, ist es eine normale Betriebseinnahme.</p>
    <p class="hinweis"><strong>Gewerbe- und Körperschaftsteuer</strong> sind keine abziehbaren Betriebsausgaben. Sie stehen im Kassenbuch, mindern aber den Gewinn nicht.</p>

    <h3>Was diese Seite nicht kann</h3>
    <p class="hinweis">Sie übermittelt nichts an ELSTER — das geht nur mit der ERiC-Bibliothek der Finanzverwaltung. Sie ersetzt auch keine Beratung: die Zuordnung eines Belegs bleibt eine fachliche Entscheidung. Die Berechnungen folgen den Grundfällen und kennen keine Sonderregelungen wie Hinzurechnungen nach § 8 GewStG oder Abschreibungsverläufe.</p>`;
}

function zeichne(){
  const b=g("blatt");
  b.innerHTML =
    zustand.tab==="kasse"     ? ansichtKasse()     :
    zustand.tab==="bank"      ? ansichtBank()      :
    zustand.tab==="auswert"   ? ansichtAuswertung():
    zustand.tab==="uebertrag" ? ansichtUebertrag() :
    zustand.tab==="stamm"     ? ansichtStamm()     : ansichtHilfe();
  zeichneGlas();
  verdrahte();
}

function verdrahte(){
  const bb=g("btnBuchen");
  if(bb){
    bb.onclick=buchen;
    g("fBetrag").addEventListener("keydown",e=>{if(e.key==="Enter")buchen();});
    g("fText").addEventListener("keydown",e=>{if(e.key==="Enter")g("fBetrag").focus();});
  }
  document.querySelectorAll("[data-loeschen]").forEach(b=>b.onclick=()=>{
    const id=b.getAttribute("data-loeschen");
    const buch=zustand.buchungen.find(x=>x.id===id); if(!buch) return;
    if(confirm(`Buchung „${buch.text}“ über ${fmt(buch.betrag)} löschen?`)){
      zustand.buchungen=zustand.buchungen.filter(x=>x.id!==id);
      markiereSchmutzig(); zeichne();
    }
  });
  document.querySelectorAll("[data-zeile]").forEach(i=>i.onchange=()=>{
    const k=kat(i.getAttribute("data-zeile")); if(k){k.zeile=i.value.trim(); markiereSchmutzig();}
  });
  document.querySelectorAll("[data-ki]").forEach(el=>el.onchange=()=>{
    const i=parseInt(el.getAttribute("data-ki"),10), f=el.getAttribute("data-kfeld");
    const k=zustand.kategorien[i]; if(!k) return;
    k[f]= el.type==="checkbox" ? el.checked : el.value.trim();
    markiereSchmutzig(); if(f!=="text"&&f!=="zeile") zeichne();
  });
  document.querySelectorAll("[data-ri]").forEach(el=>el.onchange=()=>{
    const i=parseInt(el.getAttribute("data-ri"),10), f=el.getAttribute("data-rfeld");
    if(zustand.regeln[i]){ zustand.regeln[i][f]=el.value.trim(); markiereSchmutzig(); }
  });
  document.querySelectorAll("[data-regelweg]").forEach(b=>b.onclick=()=>{
    zustand.regeln.splice(parseInt(b.getAttribute("data-regelweg"),10),1);
    markiereSchmutzig(); zeichne();
  });

  const ab=g("ablage");
  if(ab){

    ["dragleave","drop"].forEach(ev=>ab.addEventListener(ev,e=>{e.preventDefault();ab.classList.remove("bereit");}));
    ab.addEventListener("drop",e=>{ if(e.dataTransfer.files.length) importStarten(Array.from(e.dataTransfer.files)); });
  }
  document.querySelectorAll("[data-uebernehmen]").forEach(c=>c.onchange=()=>{
    zustand.puffer[parseInt(c.getAttribute("data-uebernehmen"),10)].uebernehmen=c.checked; zeichne();
  });
  document.querySelectorAll("[data-kategorie]").forEach(s=>s.onchange=()=>{
    zustand.puffer[parseInt(s.getAttribute("data-kategorie"),10)].kategorie=s.value; zeichne();
  });
  document.querySelectorAll("[data-regel]").forEach(b=>b.onclick=()=>{
    const p=zustand.puffer[parseInt(b.getAttribute("data-regel"),10)];

    if(muster&&muster.trim()){
      zustand.regeln.unshift({muster:muster.trim(),kategorie:p.kategorie});
      zustand.puffer.forEach(x=>{ if(!x.kategorie) x.kategorie=regelTreffer(x); });

  if(bu){

        zustand.buchungen=[]; zustand.puffer=[];
        zustand.kategorien=STANDARD_KATEGORIEN.map(k=>({...k}));
        zustand.regeln=STANDARD_REGELN.map(r=>({...r}));
        markiereSauber("Leer"); zeichne();
      }
    };
  }
}

function buchen(){
  const datum=g("fDatum").value, text=g("fText").value.trim(), betrag=zahl(g("fBetrag").value);
  if(!datum){alert("Bitte ein Datum eintragen.");g("fDatum").focus();return;}
  if(!text){alert("Bitte kurz beschreiben, worum es geht.");g("fText").focus();return;}
  if(betrag<=0){alert("Der Betrag muss größer als null sein. Ob Einnahme oder Ausgabe, entscheidet die Kategorie.");g("fBetrag").focus();return;}
  zustand.buchungen.push({id:"b"+Date.now()+Math.random().toString(36).slice(2,6),
    datum, beleg:g("fBeleg").value.trim(), text, kategorie:g("fKat").value, betrag, zahlweg:g("fWeg").value, bankref:""});
  markiereSchmutzig();
  const mk=g("fKat").value, mw=g("fWeg").value, md=datum;
  zeichne();
  g("fKat").value=mk; g("fWeg").value=mw; g("fDatum").value=md; g("fText").focus();
}

async function importStarten(dateien){
  try{
    markiereSauber("Lese Kontoauszug …");
    await camtEinlesen(dateien);
    if(!zustand.puffer.length){ alert("In diesen Dateien wurden keine gebuchten Umsätze gefunden."); markiereSauber(); return; }
    zustand.tab="bank";
    document.querySelectorAll(".reiter button").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab==="bank"?"true":"false"));
    zeichne();
    if(zustand.schmutzig) markiereSchmutzig(); else markiereSauber("Kontoauszug gelesen — noch nichts übernommen");
  }catch(err){
    alert("Der Kontoauszug ließ sich nicht lesen.\n\n"+err.message);
    markiereSauber();
  }
}

function uebernehmen(){
  const nehmen=zustand.puffer.filter(p=>p.uebernehmen&&p.kategorie);
  if(!nehmen.length){ alert("Es ist nichts ausgewählt."); return; }
  let n=zustand.buchungen.map(b=>{const m=/(\d+)\s*$/.exec(b.beleg||"");return m?parseInt(m[1],10):0;}).reduce((a,b)=>Math.max(a,b),0);
  nehmen.forEach(p=>{
    n++;
    const bez=[p.gegen,p.zweck].filter(Boolean).join(" — ");
    zustand.buchungen.push({
      id:"b"+Date.now()+Math.random().toString(36).slice(2,6),
      datum:p.datum, beleg:"B-"+String(n).padStart(3,"0"),
      text:kuerze(bez||"Kontobuchung",160), kategorie:p.kategorie,
      betrag:p.betrag, zahlweg:"bank", bankref:p.bankref
    });
  });
  const anzahl=nehmen.length;
  zustand.puffer=[];
  zustand.tab="kasse";
  document.querySelectorAll(".reiter button").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab==="kasse"?"true":"false"));
  markiereSchmutzig(); zeichne();
  alert(anzahl+" Buchungen übernommen. Denk daran, die Bareinnahmen aus dem Ausschank noch von Hand zu erfassen.");
}

/* ============================================================
   CSV — Version 2
   ============================================================ */

const csvFeld=v=>{ const s=String(v==null?"":v); return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };

function csvSpeichern(){
  const s=zustand.stamm, z=[];
  z.push("#KASSENBUCH;2");
  z.push("#VEREIN;"+csvFeld(s.verein));
  z.push("#BETRIEB;"+csvFeld(s.betrieb));
  z.push("#STEUERNUMMER;"+csvFeld(s.steuernummer));
  z.push("#FINANZAMT;"+csvFeld(s.finanzamt));
  z.push("#JAHR;"+s.jahr);
  z.push("#HEBESATZ;"+csvZahl(s.hebesatz));
  z.push("#VERLUSTVORTRAG;"+csvZahl(s.verlustvortrag));
  z.push("#KASSENANFANG;"+csvZahl(s.kassenanfang));
  z.push("#UMSATZVORJAHR;"+csvZahl(s.umsatzVorjahr));
  zustand.kategorien.forEach(k=>z.push(["#KATEGORIE",k.key,csvFeld(k.text),k.art,k.euer?"1":"0",k.umsatz?"1":"0",csvFeld(k.zeile),k.transit?"1":"0"].join(";")));
  zustand.regeln.forEach(r=>z.push(["#REGEL",csvFeld(r.muster),r.kategorie].join(";")));
  z.push("#BUCHUNGEN");
  z.push("Datum;Beleg;Vorgang;Kategorie;Betrag;Zahlweg;Bankreferenz");
  sortiert().forEach(b=>z.push([b.datum,csvFeld(b.beleg),csvFeld(b.text),b.kategorie,csvZahl(b.betrag),b.zahlweg,csvFeld(b.bankref||"")].join(";")));

  const blob=new Blob(["\uFEFF"+z.join("\r\n")+"\r\n"],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Kassenbuch_"+s.jahr+"_"+s.verein.replace(/[^\wÄÖÜäöüß]+/g,"_").replace(/^_|_$/g,"")+".csv";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  markiereSauber("Gesichert als "+a.download);
}

function zerlegeZeile(z){
  const f=[]; let akt="", anf=false;
  for(let i=0;i<z.length;i++){
    const c=z[i];
    if(anf){ if(c==='"'){ if(z[i+1]==='"'){akt+='"';i++;} else anf=false; } else akt+=c; }
    else { if(c==='"') anf=true; else if(c===";"){f.push(akt);akt="";} else akt+=c; }
  }
  f.push(akt); return f;
}

function csvLesen(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const stamm={...zustand.stamm}, katNeu=[], regNeu=[], buchNeu=[];
  let inTabelle=false;

  text.split(/\r\n|\n|\r/).forEach(roh=>{
    if(!roh.trim()) return;
    const f=zerlegeZeile(roh), kopf=f[0];
    if(kopf==="#BUCHUNGEN"){ inTabelle=true; return; }
    if(kopf.startsWith("#")){
      const w=f[1]||"";
      switch(kopf){
        case "#VEREIN": stamm.verein=w; break;
        case "#BETRIEB": stamm.betrieb=w; break;
        case "#STEUERNUMMER": stamm.steuernummer=w; break;
        case "#FINANZAMT": stamm.finanzamt=w; break;
        case "#JAHR": stamm.jahr=parseInt(w,10)||stamm.jahr; break;
        case "#HEBESATZ": stamm.hebesatz=zahl(w); break;
        case "#VERLUSTVORTRAG": stamm.verlustvortrag=zahl(w); break;
        case "#KASSENANFANG": stamm.kassenanfang=zahl(w); break;
        case "#UMSATZVORJAHR": stamm.umsatzVorjahr=zahl(w); break;
        case "#KATEGORIE":
          katNeu.push({key:f[1],text:f[2],art:f[3]==="einnahme"?"einnahme":"ausgabe",
                       euer:f[4]==="1",umsatz:f[5]==="1",zeile:f[6]||"",transit:f[7]==="1"});
          break;
        case "#REGEL": regNeu.push({muster:f[1]||"",kategorie:f[2]||""}); break;
      }
      return;
    }
    if(!inTabelle) return;
    if(/^datum$/i.test(kopf)) return;
    if(f.length<5) return;
    buchNeu.push({id:"b"+Date.now()+Math.random().toString(36).slice(2,6),
      datum:f[0].trim(), beleg:f[1], text:f[2], kategorie:f[3],
      betrag:Math.abs(zahl(f[4])),
      zahlweg:(f[5]||"").trim().toLowerCase()==="bar"?"bar":"bank",
      bankref:f[6]||""});
  });

  zustand.stamm=stamm;
  if(katNeu.length) zustand.kategorien=katNeu;
  if(regNeu.length) zustand.regeln=regNeu;
  zustand.buchungen=buchNeu;
  zustand.puffer=[];

  const unbekannt=buchNeu.filter(b=>!kat(b.kategorie)).length;
  markiereSauber(`Geladen: ${buchNeu.length} Buchungen`+(unbekannt?` — ${unbekannt} ohne passende Kategorie`:""));
  zeichne();
  if(unbekannt) alert(unbekannt+" Buchungen verweisen auf Kategorien, die in dieser Datei nicht definiert sind. Sie sind im Kassenbuch markiert und fließen in keine Auswertung ein.");
}

g("dateiWahl").addEventListener("change",e=>{
  const d=e.target.files&&e.target.files[0]; if(!d) return;
  if(zustand.schmutzig&&!confirm("Die aktuellen Daten sind nicht gesichert und werden überschrieben. Trotzdem laden?")){e.target.value="";return;}
  const l=new FileReader();
  l.onload=()=>{ try{ csvLesen(String(l.result)); }catch(err){ alert("Die Datei ließ sich nicht lesen. Erwartet wird eine CSV, die diese Seite selbst gespeichert hat."); } };
  l.onerror=()=>alert("Die Datei konnte nicht geöffnet werden.");
  l.readAsText(d,"utf-8"); e.target.value="";
});

g("camtWahl").addEventListener("change",e=>{
  const d=Array.from(e.target.files||[]); e.target.value="";
  if(d.length) importStarten(d);
});
