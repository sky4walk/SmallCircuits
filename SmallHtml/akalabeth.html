<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akalabeth — World of Doom</title>
<style>
  :root{
    --void:#07070a;
    --chassis:#15151a;
    --edge:#2b2b33;
    --ink:#8d8d99;
    --ink-bright:#d6d6de;
    --phosphor:#ffffff;
    --violet:#ff44fd;
    --green:#14f53c;
    --cell:clamp(11px, 1.6vw, 14px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--void);color:var(--ink);
    font:400 var(--cell)/1.55 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    -webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;min-height:100vh}

  header{width:100%;max-width:860px;margin:0 0 18px;display:flex;flex-wrap:wrap;
    align-items:baseline;gap:0 14px;border-bottom:1px solid var(--edge);padding-bottom:10px}
  h1{margin:0;font-size:1.15em;font-weight:700;letter-spacing:.14em;color:var(--ink-bright);text-transform:uppercase}
  header .meta{font-size:.85em;letter-spacing:.03em}
  header .meta b{color:var(--ink-bright);font-weight:400}

  .crt{position:relative;width:100%;max-width:860px;background:var(--chassis);
    border:1px solid var(--edge);border-radius:8px;padding:10px}
  .crt:focus-visible{outline:2px solid var(--green);outline-offset:3px}
  canvas{display:block;width:100%;height:auto;background:#000;border-radius:3px;
    image-rendering:pixelated;image-rendering:crisp-edges}
  .scan{position:absolute;inset:10px;border-radius:3px;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.34) 0 1px,transparent 1px 3px);
    opacity:.5;mix-blend-mode:multiply}
  .glow{position:absolute;inset:10px;border-radius:3px;pointer-events:none;
    box-shadow:inset 0 0 60px rgba(0,0,0,.75)}

  .bar{width:100%;max-width:860px;margin:9px 0 0;display:flex;gap:12px;
    align-items:center;justify-content:space-between;flex-wrap:wrap}
  .hint{margin:0;font-size:.85em;color:#6d6d78}
  .hint.on{color:var(--green)}
  .speed{appearance:none;background:#101014;color:var(--ink);border:1px solid var(--edge);
    border-radius:4px;padding:5px 10px;cursor:pointer;font:inherit;font-size:.82em;white-space:nowrap;
    transition:border-color .12s,color .12s}
  .speed:hover,.speed:focus-within{border-color:#4a4a56;color:var(--ink-bright)}
  .speed[aria-pressed="false"]{color:var(--green);border-color:#2f5a35}
  label.speed{display:inline-flex;gap:6px;align-items:center;cursor:default}
  label.speed select{appearance:none;background:#0a0a0c;color:var(--ink-bright);
    border:1px solid var(--edge);border-radius:3px;padding:2px 6px;font:inherit;
    font-size:1em;cursor:pointer}
  label.speed select:focus-visible{outline:1px solid var(--green);outline-offset:1px}

  .pad{width:100%;max-width:860px;margin:16px 0 0;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
  .pad button{appearance:none;background:#101014;color:var(--ink);
    border:1px solid var(--edge);border-radius:4px;padding:7px 6px;cursor:pointer;
    font:inherit;font-size:.85em;text-align:left;line-height:1.35;transition:border-color .12s,color .12s}
  .pad button:hover,.pad button:focus-visible{border-color:#4a4a56;color:var(--ink-bright);outline:none}
  .pad button:active{background:#1b1b22}
  .pad b{display:block;color:var(--ink-bright);font-weight:700;letter-spacing:.06em}

  details{width:100%;max-width:860px;margin:22px 0 0;border-top:1px solid var(--edge);padding-top:12px;font-size:.88em}
  summary{cursor:pointer;color:var(--ink-bright);letter-spacing:.06em;text-transform:uppercase;font-size:.9em}
  summary:focus-visible{outline:1px solid var(--green);outline-offset:2px}
  details .body{padding:10px 0 0;max-width:70ch}
  details h2{font-size:1em;font-weight:700;color:var(--ink-bright);margin:16px 0 4px;letter-spacing:.04em}
  details p{margin:0 0 8px}
  details code{color:var(--green)}
  details table{border-collapse:collapse;margin:6px 0 10px;font-size:.95em}
  details td{border-top:1px solid var(--edge);padding:4px 14px 4px 0;vertical-align:top}
  details td:first-child{color:var(--ink-bright);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Akalabeth</h1>
  <span class="meta">World of Doom &nbsp;·&nbsp; <b>Richard Garriott, 1979</b> &nbsp;·&nbsp; Applesoft&nbsp;BASIC, im&nbsp;Browser interpretiert</span>
</header>

<div class="crt" id="crt" tabindex="0" aria-label="Apple II Bildschirm">
  <canvas id="screen" width="840" height="576"></canvas>
  <div class="glow"></div>
  <div class="scan"></div>
</div>
<div class="bar">
  <p class="hint" id="hint">Zum Spielen anklicken — dann nimmt der Bildschirm Tastendrücke an.</p>
  <span style="display:flex;gap:6px">
    <button class="speed" id="sound" type="button" aria-pressed="true">Ton: an</button>
    <label class="speed" for="speed">Tempo
      <select id="speed">
        <option value="0.5">&frac12;&times; behäbig</option>
        <option value="1" selected>1&times; Apple&nbsp;][</option>
        <option value="2">2&times;</option>
        <option value="4">4&times;</option>
        <option value="0">Turbo</option>
      </select>
    </label>
  </span>
</div>

<div class="pad" id="pad"></div>

<details>
  <summary>Über diese Portierung</summary>
  <div class="body" id="notes"></div>
</details>

<script>
/* ------------------------------------------------------------------
   Apple II+ Bildschirm-, Tastatur- und HiRes-Nachbau
     - Textseite 40x24 mit Fenster (WNDLFT/WNDWDTH/WNDTOP/WNDBTM)
     - HiRes-Seite 1, 280x192, monochrom; MIXED-Modus zeigt 280x160 + 4 Zeilen
     - Tastatur ueber $C000-Latch / $C010-Strobe
   ------------------------------------------------------------------ */

'use strict';

const COLS = 40, ROWS = 24, HW = 280, HH = 192;

// Apple-II-HiRes-Zeilenadresse: y = 64a + 8b + c  ->  0x400*c + 0x80*b + 0x28*a
const HGR_ROW = (() => {
  const t = new Uint16Array(HH);
  for (let y = 0; y < HH; y++) t[y] = 0x400 * (y % 8) + 0x80 * (Math.floor(y / 8) % 8) + 0x28 * Math.floor(y / 64);
  return t;
})();

class AppleIO {
  constructor() {
    this.chars = new Uint8Array(COLS * ROWS).fill(32);
    this.inv = new Uint8Array(COLS * ROWS);
    this.hires = new Uint8Array(HW * HH);
    this.dirty = true;

    this.CH = 0; this.CV = 0;
    this.WNDLFT = 0; this.WNDWDTH = COLS; this.WNDTOP = 0; this.WNDBTM = ROWS;
    this.inverse = false;
    this.mode = 'text';            // 'text' | 'mixed'
    this.colorOn = true;
    this.lastX = 0; this.lastY = 0;

    // HiRes-Seite 2 (Zwischenpuffer fuer die Wischblende des Vorspanns)
    this.hires2 = new Uint8Array(HW * HH);
    this.gfx = false; this.mixed = true; this.page = 1;
    this.mem = new Map();          // gemerkte POKEs an bekannte Adressen
    this.files = {};               // "Diskette": Name -> Rohbytes
    // Belegte Sektoren laut Katalog der Originaldiskette. Daraus wird die
    // Ladezeit berechnet -- ohne sie waeren BLOAD und RUN sofort fertig und
    // der Bildervorspann rauschte durch.
    this.fileSectors = { AKALABETH: 3, AKA0: 5, AKA1: 2, AKA2: 34, AKA3: 34, AKA4: 18, AKA5: 34, AKA6: 86 };
    this.costPerSecond = 1000;     // eine Aufwandseinheit ~ eine Millisekunde
    // DOS 3.3 war wegen seiner Sektorverschraenkung langsam: ein voller
    // HiRes-Schirm (34 Sektoren) braucht rund zwei Sekunden. Genau in diesen
    // Ladepausen stehen die Vorspannbilder -- zu schnell gerechnet, und sie
    // huschen vorbei.
    this.DISK_BPS = 4500;
    this.DISK_SEEK = 0.35;         // VTOC lesen, Katalog durchsuchen, Kopf setzen
    this.pendingRun = null;
    this.dosCapture = null;
    this.basic = null;

    this.kbdLatch = 0;
    this.seed = 1;
    this.lastRnd = 0;
    this.plotErrors = 0;
    this.pixels = 0;      // gezeichnete HiRes-Punkte, fuer die Tempobremse
  }

  // ------------------------------------------------------------ Zufall
  // Hinweis: kein bitgenauer Applesoft-RND (dafuer waere das ROM noetig).
  // Gleiche Gluecksnummer erzeugt hier aber reproduzierbar dieselbe Welt.
  rnd(x) {
    if (x === 0) return this.lastRnd;
    if (x < 0) {
      let s = Math.abs(x);
      let h = 2166136261 >>> 0;
      const buf = new Float64Array(1); buf[0] = s;
      const bytes = new Uint8Array(buf.buffer);
      for (const b of bytes) { h ^= b; h = Math.imul(h, 16777619) >>> 0; }
      this.seed = (h || 1) >>> 0;
      this.lastRnd = this.next();
      return this.lastRnd;
    }
    this.lastRnd = this.next();
    return this.lastRnd;
  }
  next() {
    let s = this.seed >>> 0;
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    this.seed = s;
    return (s >>> 8) / 16777216;
  }

  // ------------------------------------------------------------ Text
  idx(c, r) { return r * COLS + c; }

  putc(ch) {
    const col = Math.min(COLS - 1, this.WNDLFT + this.CH);
    const row = Math.min(ROWS - 1, Math.max(0, this.CV));
    const i = this.idx(col, row);
    this.chars[i] = ch;
    this.inv[i] = this.inverse ? 1 : 0;
    this.CH++;
    if (this.CH >= this.WNDWDTH) this.crlf();
    this.dirty = true;
  }
  crlf() {
    this.CH = 0;
    this.CV++;
    if (this.CV > this.WNDBTM - 1) { this.scroll(); this.CV = this.WNDBTM - 1; }
    this.dirty = true;
  }
  scroll() {
    const l = this.WNDLFT, w = this.WNDWDTH, t = this.WNDTOP, b = this.WNDBTM;
    for (let r = t; r < b - 1; r++) {
      for (let c = l; c < l + w && c < COLS; c++) {
        this.chars[this.idx(c, r)] = this.chars[this.idx(c, r + 1)];
        this.inv[this.idx(c, r)] = this.inv[this.idx(c, r + 1)];
      }
    }
    for (let c = l; c < l + w && c < COLS; c++) {
      this.chars[this.idx(c, b - 1)] = 32;
      this.inv[this.idx(c, b - 1)] = 0;
    }
  }
  print(s) {
    for (const ch of String(s)) {
      const raw = ch.charCodeAt(0);
      // CTRL-D leitet ein DOS-Kommando ein -- genau wie auf dem Apple II
      if (raw === 4) { this.dosCapture = ''; continue; }
      if (this.dosCapture !== null) {
        if (ch === '\n' || ch === '\r') { const c = this.dosCapture; this.dosCapture = null; this.dos(c); }
        else this.dosCapture += ch;
        continue;
      }
      if (raw === 7) { this.bell(); continue; }        // CHR$(7): Lautsprecher
      if (ch === '\n' || ch === '\r') { this.crlf(); continue; }
      let code = ch.toUpperCase().charCodeAt(0);
      if (code < 32 || code > 95) code = 32;
      this.putc(code);
    }
  }
  bell() { /* im Browser ueberschrieben */ }

  // Verstreichende Zeit als Aufwand buchen, damit die Tempobremse sie einhaelt
  spendTime(sec) { if (this.basic) this.basic.cost += sec * this.costPerSecond; }
  loadTime(name) {
    const sec = this.fileSectors[name];
    return sec ? this.DISK_SEEK + sec * 256 / this.DISK_BPS : 0;
  }

  // ------------------------------------------------------------ DOS 3.3
  dos(cmd) {
    const c = cmd.trim().toUpperCase();
    let m = c.match(/^RUN\s*(\S.*)$/);
    if (m) { this.pendingRun = m[1].trim(); return; }
    m = c.match(/^BLOAD\s*([^,]+?)\s*(?:,\s*A\s*(\$[0-9A-F]+|\d+))?$/);
    if (m) {
      const name = m[1].trim();
      const data = this.files[name];
      if (!data) return;
      this.spendTime(this.loadTime(name));
      let addr = m[2] ? (m[2][0] === '$' ? parseInt(m[2].slice(1), 16) : parseInt(m[2], 10)) : null;
      if (addr === null) addr = data.addr || 0;
      this.bload(data.bytes !== undefined ? data.bytes : data, addr);
      return;
    }
    // NOMON, MON, usw. brauchen wir nicht
  }
  bload(bytes, addr) {
    const target = (addr === 0x4000) ? this.hires2 : (addr === 0x2000 ? this.hires : null);
    if (!target) return;                    // z.B. AKA4 nach $8000: wird nachgebildet
    for (let y = 0; y < HH; y++) {
      const base = HGR_ROW[y];
      for (let bx = 0; bx < 40; bx++) {
        const b = bytes[base + bx] | 0;
        for (let bit = 0; bit < 7; bit++) target[y * HW + bx * 7 + bit] = (b >> bit) & 1;
      }
    }
    this.dirty = true;
  }
  printComma() {
    const target = (Math.floor(this.CH / 16) + 1) * 16;
    if (target >= this.WNDWDTH) this.crlf(); else this.CH = target;
    this.dirty = true;
  }
  tabTo(col) { if (col > this.CH) this.CH = col; this.dirty = true; }
  home() {
    for (let r = this.WNDTOP; r < this.WNDBTM; r++)
      for (let c = this.WNDLFT; c < this.WNDLFT + this.WNDWDTH && c < COLS; c++) {
        this.chars[this.idx(c, r)] = 32; this.inv[this.idx(c, r)] = 0;
      }
    this.CH = 0; this.CV = this.WNDTOP; this.dirty = true;
  }
  putAt(ch, col, row) {
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    const i = this.idx(col, row);
    this.chars[i] = ch; this.inv[i] = 0; this.dirty = true;
  }
  clreol() {
    const row = Math.min(ROWS - 1, Math.max(0, this.CV));
    for (let c = this.WNDLFT + this.CH; c < this.WNDLFT + this.WNDWDTH && c < COLS; c++) {
      this.chars[this.idx(c, row)] = 32; this.inv[this.idx(c, row)] = 0;
    }
    this.dirty = true;
  }
  vtab(n) { this.CV = Math.max(0, Math.min(ROWS - 1, n - 1)); this.dirty = true; }
  htab(n) { this.CH = Math.max(0, n - 1); this.dirty = true; }
  setInverse(v) { this.inverse = v; }
  text() {
    this.gfx = false;
    this.mode = 'text';
    this.WNDLFT = 0; this.WNDWDTH = COLS; this.WNDTOP = 0; this.WNDBTM = ROWS;
    this.CH = 0; this.CV = ROWS - 1;
    this.dirty = true;
  }

  // ------------------------------------------------------------ HiRes
  updateMode() { this.mode = !this.gfx ? 'text' : (this.mixed ? 'mixed' : 'full'); this.dirty = true; }
  hgr() {
    this.hires.fill(0);
    this.gfx = true; this.mixed = true; this.page = 1;
    this.updateMode();
    this.WNDTOP = 20;
    if (this.CV < this.WNDTOP) this.CV = this.WNDTOP;
  }
  hgr2() { this.hires2.fill(0); this.gfx = true; this.mixed = false; this.page = 2; this.updateMode(); }
  visible() { return this.page === 2 ? this.hires2 : this.hires; }
  hcolor(n) { this.colorOn = (n !== 0 && n !== 4); }
  plot(x, y) {
    const xi = Math.trunc(x), yi = Math.trunc(y);
    this.pixels++;
    if (xi < 0 || xi >= HW || yi < 0 || yi >= HH) { this.plotErrors++; return; }
    this.hires[yi * HW + xi] = this.colorOn ? 1 : 0;
  }
  hplot(x, y) { this.lastX = Math.trunc(x); this.lastY = Math.trunc(y); this.plot(x, y); this.dirty = true; }
  hplotTo(x, y) {
    let x0 = this.lastX, y0 = this.lastY;
    let x1 = Math.trunc(x), y1 = Math.trunc(y);
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      this.plot(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    this.lastX = x1; this.lastY = y1; this.dirty = true;
  }

  // ------------------------------------------------------------ POKE/PEEK/CALL
  poke(a, v) {
    if (a < 0) a += 65536;
    switch (a) {
      case 32: this.WNDLFT = v; break;
      case 33: this.WNDWDTH = Math.max(1, v); break;
      case 34: this.WNDTOP = Math.max(0, Math.min(ROWS - 1, v)); break;
      case 35: this.WNDBTM = Math.max(1, Math.min(ROWS, v)); break;
      case 36: this.CH = v; break;
      case 37: this.CV = v; break;
      case 49168: this.kbdLatch &= 0x7f; break;   // $C010 Strobe loeschen
      case 49232: this.gfx = true; this.updateMode(); break;    // $C050 Grafik
      case 49233: this.gfx = false; this.updateMode(); break;   // $C051 Text
      case 49234: this.mixed = false; this.updateMode(); break; // $C052 Vollbild
      case 49235: this.mixed = true; this.updateMode(); break;  // $C053 gemischt
      case 49236: this.page = 1; this.dirty = true; break;      // $C054 Seite 1
      case 49237: this.page = 2; this.dirty = true; break;      // $C055 Seite 2
      case 49239: break;                                        // $C057 HiRes
      default: this.mem.set(a, v); break;
    }
    this.dirty = true;
  }
  peek(a) {
    if (a < 0) a += 65536;
    if (a === 49152) { if (this.kbdLatch < 128) this.wantIdle = true; return this.kbdLatch; }
    if (a === 55) return 0x9E;      // CSWH: DOS ist geladen (nicht $FD)
    return this.mem.get(a) || 0;
  }
  async call(a) {
    if (a < 0) a += 65536;
    if (a === 32768) return this.wipe();     // $8000, Routine aus AKA4
    if (a === 64668) this.clreol();          // -868  CLREOL
    else if (a === 62450) { this.hires.fill(0); this.dirty = true; }   // $F3F2 HCLR
    else if (a === 62454) { this.hires.fill(this.colorOn ? 1 : 0); this.dirty = true; }
    else if (a === 64600) this.home();       // -936  HOME
  }

  // Nachbildung der 6502-Routine bei $8000 (Datei AKA4). Sie behandelt je
  // Durchlauf eine 7 Pixel breite Spalte ueber die volle Bildhoehe und legt
  // dazwischen eine kurze Pause ein -- daher der Wischeffekt. AKA0 stellt sie
  // vorher per POKE um: Startwert von Y, Richtung, und ob genullt oder von
  // Seite 2 kopiert wird.
  async wipe() {
    const copy = this.mem.get(32840) === 177;      // $8048: LDA ($08),Y statt LDA #$00
    const down = this.mem.get(32888) === 136;      // $8078: DEY statt INY
    const start = down ? (this.mem.get(32769) | 0) : 0;
    for (let i = 0; i < 40; i++) {
      const col = down ? start - i : start + i;
      if (col < 0 || col > 39) break;
      for (let y = 0; y < HH; y++) {
        const row = y * HW + col * 7;
        for (let b = 0; b < 7; b++) this.hires[row + b] = copy ? this.hires2[row + b] : 0;
      }
      this.dirty = true;
      this.spendTime(0.012);                       // ~12 ms je Spalte auf echter Hardware
      if (this.yield) await this.yield();
    }
  }

  // ------------------------------------------------------------ Tastatur
  pressKey(code) { this.kbdLatch = (code & 0x7f) | 0x80; }
  hasKey() { return this.kbdLatch >= 128; }
  readKey() { const c = this.kbdLatch & 0x7f; this.kbdLatch &= 0x7f; return c; }
}

if (typeof module !== 'undefined') module.exports = { AppleIO, COLS, ROWS, HW, HH };

/* ------------------------------------------------------------------
   Applesoft-BASIC-Interpreter (Teilmenge fuer AKALABETH)
   Bewusst nahe am Original:
     - Variablennamen sind auf 2 Zeichen signifikant (LEFT == LEVEL == LE)
     - Integer-Variablen/-Arrays (%) schneiden zur Null hin ab
     - FOR/NEXT testet erst beim NEXT  (Rumpf laeuft mindestens einmal)
     - IF ... THEN: bei falscher Bedingung wird der REST DER ZEILE verworfen
     - ONERR GOTO faengt Laufzeitfehler ab
   ------------------------------------------------------------------ */

'use strict';

// ---------------------------------------------------------------- Tokenizer

const KEYWORDS = [
  // laengste zuerst -- greedy match wie beim Applesoft-Tokenizer
  'HCOLOR=', 'ONERR', 'HIMEM:', 'RETURN', 'INVERSE', 'NORMAL', 'RESTORE',
  'HPLOT', 'GOSUB', 'PRINT', 'INPUT', 'CLEAR', 'RIGHT$', 'LEFT$', 'MID$',
  'THEN', 'STEP', 'GOTO', 'NEXT', 'READ', 'DATA', 'POKE', 'PEEK', 'CALL',
  'TEXT', 'HOME', 'VTAB', 'HTAB', 'STR$', 'SGN', 'INT', 'ABS', 'SQR',
  'ATN', 'RND', 'LEN', 'VAL', 'FRE', 'TAB', 'SPC', 'DIM', 'FOR', 'LET',
  'CHR$', 'ASC', 'LOMEM:',
  'REM', 'END', 'HGR2', 'HGR', 'GET', 'AND', 'NOT', 'PR#', 'IN#', 'ON',
  'TO', 'IF', 'OR',
];

// Statement-Schluesselwoerter (zum Erkennen von "THEN <stmt>")
const TOK_KW = 'kw', TOK_NUM = 'num', TOK_STR = 'str', TOK_ID = 'id', TOK_P = 'p';

function stripSpaces(line) {
  // Leerzeichen ausserhalb von Stringliteralen entfernen -- so liegt die
  // Zeile im Speicher des Apple II auch vor (LIST fuegt sie nur zur Optik ein)
  let out = '', inStr = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inStr = !inStr; out += c; continue; }
    if (!inStr && c === ' ') continue;
    out += c;
  }
  return out;
}

function tokenize(src) {
  const t = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === '"') {
      let j = i + 1, s = '';
      while (j < src.length && src[j] !== '"') s += src[j++];
      t.push({ k: TOK_STR, v: s });
      i = (j < src.length) ? j + 1 : j;
      continue;
    }
    // Schluesselwort?
    let kw = null;
    for (const w of KEYWORDS) {
      if (src.startsWith(w, i)) { kw = w; break; }
    }
    if (kw) { t.push({ k: TOK_KW, v: kw }); i += kw.length; continue; }

    if (c >= '0' && c <= '9' || c === '.') {
      let j = i, s = '';
      while (j < src.length && /[0-9.]/.test(src[j])) s += src[j++];
      if (src[j] === 'E' && /[0-9+\-]/.test(src[j + 1] || '')) {
        s += src[j++]; if (/[+\-]/.test(src[j])) s += src[j++];
        while (j < src.length && /[0-9]/.test(src[j])) s += src[j++];
      }
      t.push({ k: TOK_NUM, v: parseFloat(s) }); i = j; continue;
    }
    if (/[A-Za-z]/.test(c)) {
      let j = i, s = '';
      while (j < src.length && /[A-Za-z0-9]/.test(src[j])) {
        // Schluesselwort bricht den Bezeichner ab (Applesoft-Verhalten)
        let hit = false;
        for (const w of KEYWORDS) if (src.startsWith(w, j)) { hit = true; break; }
        if (hit && j > i) break;
        s += src[j++];
      }
      let type = '';
      if (src[j] === '%' || src[j] === '$') { type = src[j]; j++; }
      t.push({ k: TOK_ID, v: s.toUpperCase().slice(0, 2) + type, full: s.toUpperCase() + type });
      i = j; continue;
    }
    // zweizeichige Operatoren
    const two = src.substr(i, 2);
    if (['<>', '<=', '>=', '><', '=<', '=>'].includes(two)) {
      const norm = { '<>': '<>', '><': '<>', '<=': '<=', '=<': '<=', '>=': '>=', '=>': '>=' }[two];
      t.push({ k: TOK_P, v: norm }); i += 2; continue;
    }
    t.push({ k: TOK_P, v: c }); i++;
  }
  return t;
}

// ---------------------------------------------------------------- Parser

class Parser {
  constructor(toks) { this.t = toks; this.i = 0; }
  peek(n = 0) { return this.t[this.i + n]; }
  next() { return this.t[this.i++]; }
  atKw(v) { const p = this.peek(); return p && p.k === TOK_KW && p.v === v; }
  atP(v) { const p = this.peek(); return p && p.k === TOK_P && p.v === v; }
  eat(v) { if (this.atP(v) || this.atKw(v)) { this.i++; return true; } return false; }
  expect(v) { if (!this.eat(v)) throw new Error('SYNTAX: erwartet ' + v); }
  end() { return this.i >= this.t.length; }

  // ---- Ausdruecke (Applesoft-Praezedenz)
  expr() { return this.orExpr(); }
  orExpr() {
    let a = this.andExpr();
    while (this.atKw('OR')) { this.i++; const b = this.andExpr(); a = { op: 'or', a, b }; }
    return a;
  }
  andExpr() {
    let a = this.notExpr();
    while (this.atKw('AND')) { this.i++; const b = this.notExpr(); a = { op: 'and', a, b }; }
    return a;
  }
  notExpr() {
    if (this.atKw('NOT')) { this.i++; return { op: 'not', a: this.notExpr() }; }
    return this.relExpr();
  }
  relExpr() {
    let a = this.addExpr();
    for (;;) {
      const p = this.peek();
      if (p && p.k === TOK_P && ['=', '<>', '<', '>', '<=', '>='].includes(p.v)) {
        this.i++; const b = this.addExpr(); a = { op: 'rel', rel: p.v, a, b };
      } else break;
    }
    return a;
  }
  addExpr() {
    let a = this.mulExpr();
    for (;;) {
      if (this.atP('+')) { this.i++; a = { op: '+', a, b: this.mulExpr() }; }
      else if (this.atP('-')) { this.i++; a = { op: '-', a, b: this.mulExpr() }; }
      else break;
    }
    return a;
  }
  mulExpr() {
    let a = this.unary();
    for (;;) {
      if (this.atP('*')) { this.i++; a = { op: '*', a, b: this.unary() }; }
      else if (this.atP('/')) { this.i++; a = { op: '/', a, b: this.unary() }; }
      else break;
    }
    return a;
  }
  unary() {
    if (this.atP('-')) { this.i++; return { op: 'neg', a: this.unary() }; }
    if (this.atP('+')) { this.i++; return this.unary(); }
    return this.power();
  }
  power() {
    let a = this.atom();
    if (this.atP('^')) { this.i++; return { op: '^', a, b: this.unary() }; }
    return a;
  }
  atom() {
    const p = this.next();
    if (!p) throw new Error('SYNTAX: Ausdruck erwartet');
    if (p.k === TOK_NUM) return { op: 'num', v: p.v };
    if (p.k === TOK_STR) return { op: 'str', v: p.v };
    if (p.k === TOK_P && p.v === '(') { const e = this.expr(); this.expect(')'); return e; }
    if (p.k === TOK_KW) {
      const fns1 = ['SGN', 'INT', 'ABS', 'SQR', 'ATN', 'RND', 'LEN', 'VAL', 'FRE', 'PEEK', 'STR$', 'CHR$', 'ASC'];
      if (fns1.includes(p.v)) {
        this.expect('('); const a = this.expr(); this.expect(')');
        return { op: 'fn', fn: p.v, a };
      }
      throw new Error('SYNTAX: unerwartet ' + p.v);
    }
    if (p.k === TOK_ID) {
      if (this.atP('(')) {
        this.i++;
        const idx = [this.expr()];
        while (this.eat(',')) idx.push(this.expr());
        this.expect(')');
        return { op: 'arr', name: p.v, idx };
      }
      return { op: 'var', name: p.v };
    }
    throw new Error('SYNTAX: unerwartet ' + JSON.stringify(p.v));
  }

  lvalue() {
    const p = this.next();
    if (!p || p.k !== TOK_ID) throw new Error('SYNTAX: Variable erwartet');
    if (this.atP('(')) {
      this.i++;
      const idx = [this.expr()];
      while (this.eat(',')) idx.push(this.expr());
      this.expect(')');
      return { arr: true, name: p.v, idx };
    }
    return { arr: false, name: p.v };
  }

  // ---- eine Anweisung
  statement() {
    const p = this.peek();
    if (!p) return null;

    if (p.k === TOK_KW) {
      const kw = p.v;
      switch (kw) {
        case 'REM': this.i = this.t.length; return { s: 'REM' };
        case 'END': this.i++; return { s: 'END' };
        case 'LET': this.i++; { const lv = this.lvalue(); this.expect('='); return { s: 'LET', lv, e: this.expr() }; }
        case 'PRINT': {
          this.i++;
          const items = [];
          for (;;) {
            if (this.end() || this.atP(':')) break;
            if (this.atP(';')) { this.i++; items.push({ t: ';' }); continue; }
            if (this.atP(',')) { this.i++; items.push({ t: ',' }); continue; }
            if (this.atKw('TAB')) { this.i++; this.expect('('); const e = this.expr(); this.expect(')'); items.push({ t: 'TAB', e }); continue; }
            if (this.atKw('SPC')) { this.i++; this.expect('('); const e = this.expr(); this.expect(')'); items.push({ t: 'SPC', e }); continue; }
            items.push({ t: 'e', e: this.expr() });
          }
          return { s: 'PRINT', items };
        }
        case 'IF': {
          this.i++;
          const cond = this.expr();
          if (!this.eat('THEN')) this.expect('GOTO');
          if (this.peek() && this.peek().k === TOK_NUM) {
            const n = this.next().v; return { s: 'IF', cond, target: n };
          }
          if (this.atKw('GOTO')) { this.i++; const n = this.next().v; return { s: 'IF', cond, target: n }; }
          return { s: 'IF', cond, target: null };
        }
        case 'GOTO': { this.i++; return { s: 'GOTO', n: this.next().v }; }
        case 'GOSUB': { this.i++; return { s: 'GOSUB', n: this.next().v }; }
        case 'RETURN': { this.i++; return { s: 'RETURN' }; }
        case 'ON': {
          this.i++;
          const e = this.expr();
          const kind = this.atKw('GOSUB') ? 'GOSUB' : 'GOTO';
          this.i++;
          const list = [this.next().v];
          while (this.eat(',')) list.push(this.next().v);
          return { s: 'ON', e, kind, list };
        }
        case 'FOR': {
          this.i++;
          const v = this.next().v;
          this.expect('=');
          const from = this.expr();
          this.expect('TO');
          const to = this.expr();
          let step = null;
          if (this.eat('STEP')) step = this.expr();
          return { s: 'FOR', v, from, to, step };
        }
        case 'NEXT': {
          this.i++;
          const vars = [];
          while (this.peek() && this.peek().k === TOK_ID) {
            vars.push(this.next().v);
            if (!this.eat(',')) break;
          }
          return { s: 'NEXT', vars };
        }
        case 'DIM': {
          this.i++;
          const dims = [];
          for (;;) {
            const name = this.next().v;
            this.expect('(');
            const idx = [this.expr()];
            while (this.eat(',')) idx.push(this.expr());
            this.expect(')');
            dims.push({ name, idx });
            if (!this.eat(',')) break;
          }
          return { s: 'DIM', dims };
        }
        case 'DATA': {
          this.i++;
          const vals = [];
          for (;;) {
            if (this.end() || this.atP(':')) break;
            const q = this.next();
            if (q.k === TOK_STR) vals.push(q.v);
            else if (q.k === TOK_NUM) vals.push(q.v);
            else if (q.k === TOK_P && q.v === ',') continue;
            else vals.push(String(q.v));
          }
          return { s: 'DATA', vals };
        }
        case 'READ': {
          this.i++;
          const lvs = [this.lvalue()];
          while (this.eat(',')) lvs.push(this.lvalue());
          return { s: 'READ', lvs };
        }
        case 'GET': { this.i++; return { s: 'GET', lv: this.lvalue() }; }
        case 'INPUT': {
          this.i++;
          let prompt = null;
          if (this.peek() && this.peek().k === TOK_STR) { prompt = this.next().v; this.eat(';'); this.eat(','); }
          const lvs = [this.lvalue()];
          while (this.eat(',')) lvs.push(this.lvalue());
          return { s: 'INPUT', prompt, lvs };
        }
        case 'CLEAR': this.i++; return { s: 'CLEAR' };
        case 'RESTORE': this.i++; return { s: 'RESTORE' };
        case 'TEXT': this.i++; return { s: 'TEXT' };
        case 'HOME': this.i++; return { s: 'HOME' };
        case 'NORMAL': this.i++; return { s: 'NORMAL' };
        case 'INVERSE': this.i++; return { s: 'INVERSE' };
        case 'VTAB': { this.i++; return { s: 'VTAB', e: this.expr() }; }
        case 'HTAB': { this.i++; return { s: 'HTAB', e: this.expr() }; }
        case 'HGR': this.i++; return { s: 'HGR' };
        case 'HGR2': this.i++; return { s: 'HGR2' };
        case 'HCOLOR=': { this.i++; return { s: 'HCOLOR', e: this.expr() }; }
        case 'HPLOT': {
          this.i++;
          const pts = [];
          let cont = false;
          if (this.atKw('TO')) { this.i++; cont = true; }
          const x = this.expr(); this.expect(','); const y = this.expr();
          pts.push({ x, y });
          while (this.atKw('TO')) {
            this.i++;
            const x2 = this.expr(); this.expect(','); const y2 = this.expr();
            pts.push({ x: x2, y: y2 });
          }
          return { s: 'HPLOT', cont, pts };
        }
        case 'POKE': { this.i++; const a = this.expr(); this.expect(','); const v = this.expr(); return { s: 'POKE', a, v }; }
        case 'CALL': { this.i++; return { s: 'CALL', e: this.expr() }; }
        case 'PR#': { this.i++; return { s: 'NOP', e: this.expr() }; }
        case 'IN#': { this.i++; return { s: 'NOP', e: this.expr() }; }
        case 'HIMEM:': { this.i++; return { s: 'NOP', e: this.expr() }; }
        case 'LOMEM:': { this.i++; return { s: 'NOP', e: this.expr() }; }
        case 'ONERR': { this.i++; this.expect('GOTO'); return { s: 'ONERR', n: this.next().v }; }
        default:
          throw new Error('SYNTAX: unbekannte Anweisung ' + kw);
      }
    }
    if (p.k === TOK_ID) {
      const lv = this.lvalue();
      this.expect('=');
      return { s: 'LET', lv, e: this.expr() };
    }
    if (p.k === TOK_P && p.v === ':') { this.i++; return { s: 'REMNOP' }; }
    throw new Error('SYNTAX: unerwartet ' + JSON.stringify(p.v));
  }

  program() {
    const st = [];
    for (;;) {
      while (this.eat(':')) { /* leere Anweisungen */ }
      if (this.end()) break;
      const s = this.statement();
      st.push(s);
      if (this.end()) break;
      if (this.atP(':')) continue;
      // Nach "THEN" folgen Anweisungen direkt, ohne Doppelpunkt
      if (s.s === 'IF' && s.target === null) continue;
      throw new Error('SYNTAX: ":" erwartet vor ' + JSON.stringify(this.peek().v));
    }
    return st;
  }
}

// ---------------------------------------------------------------- Zahlformat

function fmtNum(x) {
  if (!isFinite(x)) return x > 0 ? '1E+38' : '-1E+38';
  if (x === 0) return '0';
  const neg = x < 0;
  let a = Math.abs(x);
  let s;
  if (a >= 1e9 || a < 1e-2 && a !== 0) {
    // Applesoft schaltet ausserhalb 0.01 .. 999999999 auf Exponentialform
    if (a >= 0.01 && a < 1e9) s = null;
  }
  if (a >= 1e-2 && a < 1e9) {
    s = a.toPrecision(9);
    if (s.indexOf('e') < 0) {
      if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
      if (s.startsWith('0.')) s = s.slice(1);
    }
  } else {
    let e = Math.floor(Math.log10(a));
    let m = a / Math.pow(10, e);
    let ms = m.toPrecision(9).replace(/0+$/, '').replace(/\.$/, '');
    s = ms + 'E' + (e < 0 ? '-' : '+') + String(Math.abs(e)).padStart(2, '0');
  }
  return (neg ? '-' : '') + s;
}

// ---------------------------------------------------------------- Interpreter

class BasicError extends Error {}

class Interpreter {
  constructor(io) {
    this.io = io;                 // Bildschirm / Tastatur
    this.lines = [];              // [{num, stmts}]
    this.lineIndex = new Map();   // Zeilennummer -> Index
    this.reset();
  }

  load(text) {
    const lines = [];
    for (const raw of text.split('\n')) {
      if (!raw.trim()) continue;
      const m = raw.match(/^\s*(\d+)(.*)$/);
      if (!m) continue;
      const num = parseInt(m[1], 10);
      const body = stripSpaces(m[2]);
      let stmts;
      try {
        stmts = new Parser(tokenize(body)).program();
      } catch (e) {
        throw new Error('Zeile ' + num + ': ' + e.message + '  [' + body + ']');
      }
      lines.push({ num, stmts, src: raw });
    }
    lines.sort((a, b) => a.num - b.num);
    this.lines = lines;
    this.lineIndex = new Map();

  gotoLine(n) {

      }

      case 'GOSUB':
        this.gosubStack.push({ li: this.li, si: this.si + 1 });
        this.gotoLine(st.n); return true;
      case 'RETURN': {
        const f = this.gosubStack.pop();
        if (!f) throw new BasicError('RETURN WITHOUT GOSUB');
        this.li = f.li; this.si = f.si; return true;
      }
      case 'ON': {
        const i = Math.trunc(this.num(this.ev(st.e)));
        if (i >= 1 && i <= st.list.length) {
          if (st.kind === 'GOSUB') this.gosubStack.push({ li: this.li, si: this.si + 1 });
          this.gotoLine(st.list[i - 1]); return true;
        }
        return;
      }
      case 'FOR': {
        const from = this.num(this.ev(st.from));
        const to = this.num(this.ev(st.to));
        const step = st.step ? this.num(this.ev(st.step)) : 1;
        this.setVar(st.v, from);
        // gleichnamige Rahmen verwerfen (Applesoft)
        for (let k = this.forStack.length - 1; k >= 0; k--) {
          if (this.forStack[k].v === st.v) { this.forStack.length = k; break; }
        }
        this.forStack.push({ v: st.v, to, step, li: this.li, si: this.si + 1 });
        return;
      }
      case 'NEXT': {
        const names = st.vars.length ? st.vars : [null];
        for (const nm of names) {
          let f;
          if (nm === null) f = this.forStack[this.forStack.length - 1];
          else {
            while (this.forStack.length && this.forStack[this.forStack.length - 1].v !== nm) this.forStack.pop();
            f = this.forStack[this.forStack.length - 1];
          }
          if (!f) throw new BasicError('NEXT WITHOUT FOR');
          const nv = this.num(this.getVar(f.v)) + f.step;
          this.setVar(f.v, nv);
          const done = f.step >= 0 ? nv > f.to : nv < f.to;
          if (!done) { this.li = f.li; this.si = f.si; return true; }
          this.forStack.pop();
        }
        return;
      }
      case 'DIM':
        for (const d of st.dims) this.dimArray(d.name, d.idx.map(e => this.num(this.ev(e))));
        return;
      case 'READ':
        for (const lv of st.lvs) {
          if (this.dataPtr >= this.dataList.length) throw new BasicError('OUT OF DATA');
          let v = this.dataList[this.dataPtr++];
          if (!lvIsStr(lv) && typeof v === 'string') v = parseFloat(v) || 0;
          if (lvIsStr(lv)) v = String(v);
          this.assign(lv, v);
        }
        return;
      case 'GET': {
        const ch = await io.getKeyChar();
        this.assign(st.lv, lvIsStr(st.lv) ? ch : (parseFloat(ch) || 0));
        return;
      }
      case 'INPUT': {
        if (st.prompt !== null) io.print(st.prompt);
        else io.print('?');
        const line = await io.inputLine();
        const parts = st.lvs.length > 1 ? line.split(',') : [line];
        st.lvs.forEach((lv, i) => {
          const raw = (parts[i] || '').trim();
          this.assign(lv, lvIsStr(lv) ? raw : (parseFloat(raw) || 0));
        });
        return;
      }
      case 'CLEAR': this.clearVars(); return;
      case 'RESTORE': this.dataPtr = 0; return;
      case 'TEXT': io.text(); return;
      case 'HOME': io.home(); return;
      case 'NORMAL': io.setInverse(false); return;
      case 'INVERSE': io.setInverse(true); return;
      case 'VTAB': io.vtab(Math.trunc(this.num(this.ev(st.e)))); return;
      case 'HTAB': io.htab(Math.trunc(this.num(this.ev(st.e)))); return;
      case 'HGR': io.hgr(); return;
      case 'HGR2': io.hgr2(); return;
      case 'HCOLOR': io.hcolor(Math.trunc(this.num(this.ev(st.e)))); return;
      case 'HPLOT': {
        const px0 = io.pixels;
        let first = 0;
        if (st.cont) {
          const p = st.pts[0];
          io.hplotTo(this.num(this.ev(p.x)), this.num(this.ev(p.y)));
          first = 1;
        } else {
          const p = st.pts[0];
          io.hplot(this.num(this.ev(p.x)), this.num(this.ev(p.y)));
          first = 1;
        }
        for (let i = first; i < st.pts.length; i++) {
          const p = st.pts[i];
          io.hplotTo(this.num(this.ev(p.x)), this.num(this.ev(p.y)));
        }
        this.cost += 1 + st.pts.length * 0.5 + (io.pixels - px0) / 20;
        return;
      }
      case 'POKE': io.poke(Math.trunc(this.num(this.ev(st.a))), Math.trunc(this.num(this.ev(st.v)))); return;
      case 'CALL': await io.call(Math.trunc(this.num(this.ev(st.e)))); return;
      case 'ONERR': this.onerr = st.n; return;
    }
    throw new BasicError('?STMT ' + st.s);
  }
}

    const c = keyFromEvent(e);
    if (c === null) return;
    if (SWALLOW.has(e.key)) e.preventDefault();
    io.pressKey(c);
  });
  crt.addEventListener('focus', () => { hint.textContent = 'Tastatur aktiv.'; hint.classList.add('on'); });
  crt.addEventListener('blur', () => { hint.textContent = 'Zum Spielen anklicken — dann nimmt der Bildschirm Tastendrücke an.'; hint.classList.remove('on'); });

  // ---------------------------------------------------------- Tastenfeld
  const PAD = [
    ['RET', 13, 'Nord / vorwärts'],
    ['←', 8, 'West / links'],
    ['→', 21, 'Ost / rechts'],
    ['/', 47, 'Süd / kehrt'],
    ['X', 88, 'Betreten / Leiter'],
    ['A', 65, 'Angriff'],
    ['SPC', 32, 'Zug aussetzen'],
    ['S', 83, 'Werte ansehen'],
    ['P', 80, 'Pause an/aus'],
    ['ESC', 27, 'Angriff / neu'],
  ];
  const pad = document.getElementById('pad');
  for (const [label, code, what] of PAD) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = '<b>' + label + '</b>' + what;
    btn.addEventListener('click', () => { io.pressKey(code); crt.focus(); });
    pad.appendChild(btn);
  }

  // ---------------------------------------------------------- Lautsprecher
  // CHR$(7) im Ausgabestrom laesst den Apple II piepen. Das Original nutzt das
  // reichlich: bei Treffern, Fallen, Gold, Fehlzaubern und beim Rittertitel.
  let audio = null, bellUntil = 0, soundOn = true;
  io.bell = function () {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const t = Math.max(audio.currentTime, bellUntil);
      bellUntil = t + 0.1;
      const osc = audio.createOscillator(), g = audio.createGain();
      osc.type = 'square';
      osc.frequency.value = 1000;
      g.gain.setValueAtTime(0.05, t);
      g.gain.setValueAtTime(0.05, t + 0.085);
      g.gain.linearRampToValueAtTime(0, t + 0.095);
      osc.connect(g); g.connect(audio.destination);
      osc.start(t); osc.stop(t + 0.1);
    } catch (e) { /* kein Ton verfuegbar */ }
  };
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? 'Ton: an' : 'Ton: aus';
    crt.focus();
  });

  const speedSel = document.getElementById('speed');
  speedSel.addEventListener('change', () => {
    const m = parseFloat(speedSel.value);
    io.throttle = m > 0;
    if (m > 0) rate = BASE_RATE * m;
    io.due = 0;
    io.lastCost = io.basic ? io.basic.cost : 0;
    crt.focus();
  });

  // ---------------------------------------------------------- Start
  // Maskierte Steuerzeichen zuruecksetzen
  function unesc(s) { return s.replace(/\\x([0-9a-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16))); }

  // PackBits auspacken (so liegen die drei HiRes-Bilder in der Datei)
  function unpack(b64) {
    const bin = atob(b64);
    const out = [];
    for (let i = 0; i < bin.length;) {
      const c = bin.charCodeAt(i++);
      if (c < 128) { for (let k = 0; k <= c; k++) out.push(bin.charCodeAt(i++)); }
      else { const b = bin.charCodeAt(i++); for (let k = 0; k < 257 - c; k++) out.push(b); }
    }
    return out;
  }

  const PROGRAMS = {};
  for (const n of ['AKALABETH', 'AKA0', 'AKA1', 'AKA6'])
    PROGRAMS[n] = unesc(document.getElementById('src-' + n).textContent);

  // "Diskette": die drei Titelbilder als HiRes-Seiten, AKA4 ist nachgebildet
  for (const n of ['AKA2', 'AKA3', 'AKA5'])
    io.files[n] = unpack(document.getElementById('img-' + n).textContent.trim());
  io.files['AKA4'] = [];

  const basic = new Interpreter(io);
  io.basic = basic;

  // Anmerkungen aufbauen
  const notes = document.getElementById('notes');
  notes.innerHTML =
    '<p>Das hier ist kein Nachbau. In dieser Datei stecken die vier Applesoft-Programme ' +
    'der Originaldiskette von 1980 &mdash; <code>AKALABETH</code>, <code>AKA0</code>, ' +
    '<code>AKA1</code> und <code>AKA6</code> &mdash; sowie die drei HiRes-Titelbilder ' +
    '<code>AKA2</code>, <code>AKA3</code> und <code>AKA5</code>. Dazu ein Interpreter f&uuml;r ' +
    'Applesoft, ein Nachbau der Apple-II-Bildschirmhardware (Textseite 40&times;24 mit ' +
    'Fensterregistern, zwei HiRes-Seiten 280&times;192, Mischmodus, Softswitches, ' +
    'Tastaturlatch) und so viel DOS 3.3, wie die Startkette braucht. Keine externen ' +
    'Abh&auml;ngigkeiten, kein Netzzugriff.</p>' +

    '<h2>Die Startkette</h2>' +
    '<p><code>AKALABETH</code> pr&uuml;ft, ob DOS geladen ist, und startet <code>AKA0</code>. ' +
    'Das zeigt den Titeltext, l&auml;dt <code>AKA2</code> auf HiRes-Seite&nbsp;1 und blendet ' +
    'dann <code>AKA5</code> und <code>AKA3</code> spaltenweise von Seite&nbsp;2 herein. Die ' +
    'Wischblende ist im Original 6502-Code in <code>AKA4</code>, der bei <code>$8000</code> ' +
    'l&auml;uft; hier ist sie nachgebildet. <code>AKA0</code> stellt die Routine zwischen den ' +
    'Durchl&auml;ufen per POKE um &mdash; Startspalte, Laufrichtung, und ob genullt oder ' +
    'kopiert wird &mdash; deshalb l&auml;uft das dritte Bild von rechts nach links herein. ' +
    'Danach <code>AKA1</code>, und das startet <code>AKA6</code>: das Spiel.</p>' +

    '<h2>Kurz zum Spiel</h2>' +
    '<p>Gl&uuml;ckszahl und Schwierigkeitsgrad 1&ndash;10 eingeben, dann die gew&uuml;rfelten ' +
    'Attribute (jede Taste au&szlig;er <b>Y</b> w&uuml;rfelt neu), dann <b>F</b> f&uuml;r Fighter ' +
    'oder <b>M</b> f&uuml;r Mage &mdash; Magier d&uuml;rfen weder Rapier noch Bogen f&uuml;hren. ' +
    'Im Laden zuerst reichlich Nahrung kaufen (<b>F</b>, zehn Rationen pro Goldst&uuml;ck), sonst ' +
    'verhungert man nach wenigen Z&uuml;gen. Erst danach kommt <em>Welcome to Akalabeth</em>, ' +
    'w&auml;hrend die Welt entsteht. Drau&szlig;en ist <b>X</b> ein Kerker, das gro&szlig;e ' +
    'Quadrat die Burg von Lord British, das kleine Doppelquadrat eine Stadt. Lord British stellt ' +
    'Aufgaben: ein bestimmtes Ungeheuer t&ouml;ten und zur&uuml;ckkehren.</p>' +

    '<h2>Warum die Diskette wichtig war</h2>' +
    '<p>Diese Fassung stammt aus dem Diskettenabbild und ist detokenisiert, also Byte f&uuml;r ' +
    'Byte das, was Garriott abgespeichert hat. Eine fr&uuml;here Fassung dieser Portierung beruhte ' +
    'auf einem abgetippten Listing aus dem Jahr 1995, und der Vergleich war lehrreich: elf Zeilen ' +
    'wichen ab. Zehn davon hatten <code>CHR$(7)</code> verloren &mdash; die Glockenzeichen, mit ' +
    'denen das Spiel bei Treffern, Fallen und Goldfunden piept. Sie stehen mitten in den ' +
    'Textkonstanten und fielen beim Abtippen einfach weg.</p>' +
    '<p>Die elfte Abweichung war Zeile 1663. Dort fehlte im Listing ein Gleichheitszeichen, ' +
    'wodurch die Zeile syntaktisch ung&uuml;ltig wurde. Ich hatte <code>= INT(</code> ' +
    'erg&auml;nzt &mdash; die Diskette zeigt aber blo&szlig; <code>=</code>, der Schaden betr&auml;gt ' +
    'also ein einziges Zeichen. Der Schadensrechnung fehlte dadurch die Nachkommastelle.</p>' +
    '<p>Und Zeile 520 lautet auf der Diskette tats&auml;chlich <code>DNG%(X,Y)=1:DNG(Y,X)=1</code>. ' +
    'Das fehlende Prozentzeichen sieht aus wie ein Tippfehler, ist aber Original: Applesoft legt ' +
    'daf&uuml;r stillschweigend ein zweites, reelles Feld an, das nie wieder gelesen wird. Die ' +
    'Ost-West-Mauern der Kerker werden also nie gesetzt. Wer das &bdquo;repariert&ldquo;, ' +
    'bekommt andere Labyrinthe als 1980. Hier steht der Code unver&auml;ndert.</p>' +

    '<h2>Tempo</h2>' +
    '<p>Das Programm l&auml;uft absichtlich gebremst, sonst w&auml;re der Vorspann in ' +
    'Sekundenbruchteilen vorbei. Der Interpreter z&auml;hlt Aufwand statt Anweisungen: eine ' +
    'Einheit entspricht etwa einer Millisekunde auf einem 1-MHz-Apple-II. Teuer sind vor allem ' +
    'Feldzugriffe &mdash; Applesoft durchsucht die Variablentabelle linear und rechnet den Index ' +
    'mit einer 16-Bit-Multiplikationsschleife aus &mdash; sowie Flie&szlig;kommapotenzen und ' +
    '<code>HPLOT</code>-Linien. Dazu kommen die Diskettenzeiten: DOS&nbsp;3.3 schaffte rund ' +
    '4,5&nbsp;KB/s &mdash; die Sektorverschr&auml;nkung kostete viel &mdash;, ein 34-Sektor-Bild ' +
    'braucht also gut zwei Sekunden. Genau in diesen Ladepausen ' +
    'stehen die Vorspannbilder.</p>' +
    '<p>Damit dauert die Warteschleife <code>FOR Z=1 TO 1000:NEXT</code> eine Sekunde, die ' +
    'Weltgenerierung knapp elf und eine Kerkeransicht mit Ungeheuer gut eine. Der Regler oben ' +
    'rechts skaliert alles gemeinsam, falls die Eichung f&uuml;r deinen Geschmack daneben liegt.</p>' +

    '<h2>Bekannte Abweichung</h2>' +
    '<p>Der Zufallsgenerator ist kein bitgenauer Nachbau von Applesofts <code>RND</code> &mdash; ' +
    'daf&uuml;r w&auml;re das Apple-ROM n&ouml;tig. Dieselbe Gl&uuml;ckszahl erzeugt hier ' +
    'reproduzierbar dieselbe Welt, aber nicht dieselbe wie auf echter Hardware. Alles andere ' +
    'l&auml;uft &uuml;ber den Originalcode.</p>' +

    '<h2>Farben</h2>' +
    '<p>Die gr&uuml;nen und violetten Linien sind kein Effekt, sondern Absicht: auf dem Apple&nbsp;II ' +
    'erscheint ein einzeln stehendes HiRes-Pixel je nach Spaltenparit&auml;t gr&uuml;n oder violett, ' +
    'zwei benachbarte ergeben wei&szlig;. Genau so sehen die Screenshots von damals aus.</p>';

  // Zugriff fuer die Browserkonsole: akalabeth.io, akalabeth.basic
  if (typeof window !== 'undefined') window.akalabeth = { io: io, basic: basic, programs: PROGRAMS };

  render(io);
  crt.focus();

  // DOS-Startkette: AKALABETH laedt AKA0 (Titel und Bilder), das AKA1,
  // das schliesslich AKA6 -- das eigentliche Spiel.
  (async function boot() {
    let name = 'AKALABETH';
    while (name) {
      if (!PROGRAMS[name]) throw new Error('Datei nicht auf der Diskette: ' + name);
      basic.load(PROGRAMS[name]);
      basic.reset();
      io.pendingRun = null;
      io.lastCost = 0;
      io.due = 0;
      io.costPerSecond = BASE_RATE;
      if (name !== 'AKALABETH') io.spendTime(io.loadTime(name));   // DOS laedt von Diskette
      await basic.run();
      name = io.pendingRun;
      io.pendingRun = null;
    }
  })().catch(err => {
    io.text(); io.home();
    io.print('INTERPRETER GESTOPPT\n' + String(err && err.message || err) + '\n');
    render(io);
  });
})();
</script>
</body>
</html>
