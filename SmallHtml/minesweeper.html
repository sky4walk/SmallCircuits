<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MINESWEEPER</title>
<style>
@import url('https://fonts.bunny.net/css?family=press-start-2p:400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#c0c0c0;
  font-family:'Press Start 2P', 'Courier New', monospace;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:12px 8px;min-height:100vh;
  user-select:none;-webkit-user-select:none;
}

/* ── CLASSIC WINDOWS 3D EFFECT ── */
.raised{
  border-top:2px solid #fff;
  border-left:2px solid #fff;
  border-bottom:2px solid #808080;
  border-right:2px solid #808080;
}
.sunken{
  border-top:2px solid #808080;
  border-left:2px solid #808080;
  border-bottom:2px solid #fff;
  border-right:2px solid #fff;
}
.deep-raised{
  border-top:3px solid #fff;
  border-left:3px solid #fff;
  border-bottom:3px solid #404040;
  border-right:3px solid #404040;
  outline:1px solid #808080;
}

#window{
  background:#c0c0c0;
  padding:4px;
  display:inline-block;
}
.deep-raised{padding:3px;}

/* Title bar */
#titlebar{
  background:#000080;color:#fff;
  font-size:9px;letter-spacing:1px;
  padding:3px 6px;
  display:flex;align-items:center;gap:6px;
  margin-bottom:4px;
}
#titlebar span{flex:1;}
.winbtn{
  width:14px;height:12px;
  background:#c0c0c0;
  border-top:1px solid #fff;border-left:1px solid #fff;
  border-bottom:1px solid #404040;border-right:1px solid #404040;
  font-size:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:#000;
}

/* Top panel */
#panel{
  background:#c0c0c0;padding:6px 8px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:4px;
}
.lcd{
  background:#000;color:#ff0000;
  font-family:'Courier New',monospace;font-size:20px;font-weight:bold;
  padding:2px 6px;letter-spacing:2px;min-width:52px;text-align:right;
}

#faceBtn{
  width:26px;height:26px;
  background:#c0c0c0;
  border-top:2px solid #fff;border-left:2px solid #fff;
  border-bottom:2px solid #404040;border-right:2px solid #404040;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
}
#faceBtn:active{
  border-top:2px solid #404040;border-left:2px solid #404040;
  border-bottom:2px solid #fff;border-right:2px solid #fff;
}

/* Difficulty selector */
#diffRow{
  display:flex;gap:4px;margin-bottom:6px;
}
.diffBtn{
  flex:1;font-size:7px;letter-spacing:0px;
  padding:4px 2px;background:#c0c0c0;cursor:pointer;
  border-top:2px solid #fff;border-left:2px solid #fff;
  border-bottom:2px solid #808080;border-right:2px solid #808080;
  font-family:'Press Start 2P',monospace;
  white-space:nowrap;
}
.diffBtn:active,.diffBtn.active{
  border-top:2px solid #808080;border-left:2px solid #808080;
  border-bottom:2px solid #fff;border-right:2px solid #fff;
  background:#b0b0b0;
}

/* No-Guess toggle */
#ngRow{display:flex;gap:4px;margin-bottom:6px;}
#ngBtn{
  flex:1;font-size:7px;letter-spacing:0px;
  padding:4px 2px;background:#c0c0c0;cursor:pointer;
  border-top:2px solid #fff;border-left:2px solid #fff;
  border-bottom:2px solid #808080;border-right:2px solid #808080;
  font-family:'Press Start 2P',monospace;
  white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;
}
#ngBtn.active{
  border-top:2px solid #808080;border-left:2px solid #808080;
  border-bottom:2px solid #fff;border-right:2px solid #fff;
  background:#b0b0b0;
}
#ngBox{
  width:11px;height:11px;background:#fff;
  border-top:2px solid #808080;border-left:2px solid #808080;
  border-bottom:2px solid #fff;border-right:2px solid #fff;
  font-size:8px;line-height:9px;color:#000;text-align:center;
}
/* Grid */
#gridWrap{
  background:#c0c0c0;
  display:inline-block;
  overflow:auto;
  max-width:calc(100vw - 16px);
}
#grid{
  display:grid;
  gap:0;
}
.cell{
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:bold;cursor:pointer;
  position:relative;
  background:#c0c0c0;
  flex-shrink:0;
}
.cell.hidden{
  border-top:2px solid #fff;
  border-left:2px solid #fff;
  border-bottom:2px solid #808080;
  border-right:2px solid #808080;
}
.cell.hidden:active{ border:1px solid #808080; }
.cell.revealed{
  border:1px solid #808080;
  background:#c0c0c0;
}
.cell.flagged{
  border-top:2px solid #fff;
  border-left:2px solid #fff;
  border-bottom:2px solid #808080;
  border-right:2px solid #808080;
}
.cell.mine-hit{ background:#ff0000; }
.cell.mine-wrong{ background:#c0c0c0; }

/* Number colors */
.n1{color:#0000ff;}
.n2{color:#008000;}
.n3{color:#ff0000;}
.n4{color:#000080;}
.n5{color:#800000;}
.n6{color:#008080;}
.n7{color:#000000;}
.n8{color:#808080;}

/* Overlay */
#overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.4);
  align-items:center;justify-content:center;
  z-index:100;
}
#overlay.show{display:flex;}
#msgbox{
  background:#c0c0c0;padding:0;
  border-top:3px solid #fff;border-left:3px solid #fff;
  border-bottom:3px solid #404040;border-right:3px solid #404040;
  min-width:220px;
}
#msgbox .tb{
  background:#000080;color:#fff;font-size:9px;letter-spacing:1px;
  padding:3px 6px;display:flex;align-items:center;
}
#msgbox .tb span{flex:1;}
#msgbox .body{padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;}
#msgbox .emoji{font-size:32px;}
#msgbox .msg{font-size:9px;letter-spacing:1px;line-height:1.8;}
#msgbox .score{font-size:8px;color:#000080;}
.okBtn{
  padding:6px 20px;background:#c0c0c0;cursor:pointer;
  border-top:2px solid #fff;border-left:2px solid #fff;
  border-bottom:2px solid #404040;border-right:2px solid #404040;
  font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:1px;
  align-self:center;
}
.okBtn:active{
  border-top:2px solid #404040;border-left:2px solid #404040;
  border-bottom:2px solid #fff;border-right:2px solid #fff;
}

/* Highscore table */
#hiTable{font-size:7px;text-align:left;width:100%;border-collapse:collapse;}
#hiTable td{padding:2px 6px;}
#hiTable tr:nth-child(even){background:rgba(0,0,128,0.08);}
</style>
</head>
<body>

<div id="window" class="deep-raised">
  <div id="titlebar">
    <span>💣 Minesweeper</span>
    <div class="winbtn">_</div>
    <div class="winbtn">□</div>
    <div class="winbtn" style="font-weight:bold;">✕</div>
  </div>

  <div style="padding:4px;">
    <!-- Difficulty -->
    <div id="diffRow">
      <button class="diffBtn active" id="dEasy"   onclick="setDiff('easy')">KLEIN</button>
      <button class="diffBtn"        id="dMedium"  onclick="setDiff('medium')">MITTEL</button>
      <button class="diffBtn"        id="dHard"    onclick="setDiff('hard')">GROSS</button>
    </div>

    <!-- No-Guess -->
    <div id="ngRow">
      <button id="ngBtn" onclick="toggleNoGuess()"><span id="ngBox"></span>OHNE RATEN</button>
    </div>

    <!-- Panel: mines left, face, timer -->
    <div id="panel" class="sunken">
      <div class="lcd" id="mineCount">010</div>
      <button id="faceBtn" onclick="newGame()">🙂</button>
      <div class="lcd" id="timer">000</div>
    </div>

    <!-- Grid -->
    <div id="gridWrap" class="sunken">
      <div id="grid"></div>
    </div>

    <!-- Highscores -->
    <div style="margin-top:6px;font-size:7px;letter-spacing:1px;">BESTZEITEN:</div>
    <table id="hiTable">
      <tr><td style="color:#000080;">KLEIN</td>  <td id="hiEasy">  —</td></tr>
      <tr><td style="color:#000080;">MITTEL</td> <td id="hiMedium">—</td></tr>
      <tr><td style="color:#000080;">GROSS</td>  <td id="hiHard">  —</td></tr>
    </table>
  </div>
</div>

<!-- Message overlay -->
<div id="overlay">
  <div id="msgbox">
    <div class="tb"><span id="msgTitle">Minesweeper</span><div class="winbtn" onclick="closeMsg()">✕</div></div>
    <div class="body">
      <div class="emoji" id="msgEmoji">🎉</div>
      <div class="msg"  id="msgText">Gewonnen!</div>
      <div class="score" id="msgScore"></div>
      <button class="okBtn" onclick="closeMsg()">OK</button>
    </div>
  </div>
</div>

<script>
// ── DIFFICULTIES ──────────────────────────────────────────
const DIFFS = {
  easy:   {cols:9,  rows:9,  mines:10, label:'KLEIN'},
  medium: {cols:16, rows:16, mines:40, label:'MITTEL'},
  hard:   {cols:30, rows:16, mines:99, label:'GROSS'},
};
const HKEY = 'minesweeper_hi_v1';
let bestTimes = {};
try{ bestTimes=JSON.parse(localStorage.getItem(HKEY)||'{}'); }catch(e){}

function saveBest(diff,t){
  if(!bestTimes[diff]||t<bestTimes[diff]){
    bestTimes[diff]=t;
    try{localStorage.setItem(HKEY,JSON.stringify(bestTimes));}catch(e){}
    renderHi();
  }
}
function renderHi(){
  ['easy','medium','hard'].forEach(d=>{
    const id={easy:'hiEasy',medium:'hiMedium',hard:'hiHard'}[d];
    document.getElementById(id).textContent=
      bestTimes[d]!=null ? bestTimes[d]+'s' : '—';
  });
}
renderHi();

// ── GAME STATE ────────────────────────────────────────────
let diff='easy';
let cols,rows,totalMines;
let cells=[];      // flat array of {mine,revealed,flagged,count,el}
let gameState='idle'; // idle | playing | won | lost
let minesLeft=0;
let timerVal=0;
let timerInterval=null;
let firstClick=true;
let NB=[];         // Nachbar-Indizes je Feld (für den Solver)
let genToken=0;    // bricht laufende Generierung bei Neustart ab

// ── NO-GUESS ──────────────────────────────────────────────
const NGKEY='minesweeper_noguess';
let noGuess=false;
try{ noGuess=localStorage.getItem(NGKEY)==='1'; }catch(e){}

function toggleNoGuess(){
  noGuess=!noGuess;
  try{localStorage.setItem(NGKEY,noGuess?'1':'0');}catch(e){}
  renderNoGuess();
  newGame();
}
function renderNoGuess(){
  document.getElementById('ngBtn').classList.toggle('active',noGuess);
  document.getElementById('ngBox').textContent=noGuess?'✔':'';
}

function idx(c,r){ return r*cols+c; }
function cell(c,r){ return (c>=0&&c<cols&&r>=0&&r<rows)?cells[idx(c,r)]:null; }
function neighbors(c,r){
  const nb=[];
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0) continue;
    const nc=c+dc, nr=r+dr;
    if(nc>=0&&nc<cols&&nr>=0&&nr<rows) nb.push(cells[idx(nc,nr)]);
  }
  return nb;
}

// ── INIT ──────────────────────────────────────────────────
function setDiff(d){
  diff=d;
  document.querySelectorAll('.diffBtn').forEach(b=>b.classList.remove('active'));
  document.getElementById({easy:'dEasy',medium:'dMedium',hard:'dHard'}[d]).classList.add('active');
  newGame();
}

function newGame(){
  const cfg=DIFFS[diff];
  cols=cfg.cols; rows=cfg.rows; totalMines=cfg.mines;
  cells=[];
  firstClick=true;
  gameState='idle';
  genToken++;
  minesLeft=totalMines;
  buildNB();
  stopTimer(); timerVal=0;
  updateLCD('mineCount',minesLeft);
  updateLCD('timer',0);
  setFace('🙂');

  // Create cells
  for(let i=0;i<cols*rows;i++){
    cells.push({mine:false,revealed:false,flagged:false,count:0,el:null});
  }

  // Build grid DOM
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  grid.style.gridTemplateColumns=`repeat(${cols},24px)`;
  grid.style.gridTemplateRows=`repeat(${rows},24px)`;

  cells.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='cell hidden';
    el.dataset.i=i;
    // Left click
    el.addEventListener('click',()=>onLeftClick(i));
    // Right click = flag
    el.addEventListener('contextmenu',e=>{e.preventDefault();onRightClick(i);});
    // Long press for mobile flag
    let longPressTimer=null;
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch'){
        longPressTimer=setTimeout(()=>{ onRightClick(i); longPressTimer=null; },400);
      }
    });
    el.addEventListener('pointerup',()=>{ if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;} });
    el.addEventListener('pointerleave',()=>{ if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;} });
    c.el=el;
    grid.appendChild(el);
  });
}

// ── PLACE MINES (after first click) ───────────────────────
function buildNB(){
  const n=cols*rows;
  NB=new Array(n);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const list=[];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc) continue;
      const nc=c+dc, nr=r+dr;
      if(nc>=0&&nc<cols&&nr>=0&&nr<rows) list.push(nr*cols+nc);
    }
    NB[r*cols+c]=Int32Array.from(list);
  }
}

// Zufällige Verteilung; das angeklickte Feld und seine 8 Nachbarn bleiben frei,
// das erste Feld hat damit immer die Zahl 0 und öffnet einen Bereich.
function randomMines(safeI){
  const n=cols*rows, m=new Uint8Array(n);
  const sc=safeI%cols, sr=Math.floor(safeI/cols);
  const safe=new Set([safeI]);
  for(const j of NB[safeI]) safe.add(j);
  const cand=[];
  for(let i=0;i<n;i++) if(!safe.has(i)) cand.push(i);
  for(let k=0;k<totalMines&&k<cand.length;k++){
    const j=k+Math.floor(Math.random()*(cand.length-k));
    const t=cand[k]; cand[k]=cand[j]; cand[j]=t;
    m[cand[k]]=1;
  }
  return m;
}

function countsFor(m){
  const n=cols*rows, cnt=new Int8Array(n);
  for(let i=0;i<n;i++){
    if(m[i]){ cnt[i]=-1; continue; }
    let k=0; const nb=NB[i];
    for(let q=0;q<nb.length;q++) if(m[nb[q]]) k++;
    cnt[i]=k;
  }
  return cnt;
}

function applyMines(m){
  const cnt=countsFor(m);
  cells.forEach((c,i)=>{ c.mine=!!m[i]; c.count=m[i]?0:cnt[i]; });
}

function placeMines(safeI){ applyMines(randomMines(safeI)); }

// ── SOLVER ────────────────────────────────────────────────
// Spielt ein Feld rein logisch durch: Einzelfeld-Regeln, Teilmengen-Regeln
// und vollständige Aufzählung kleiner Grenzbereiche. Es wird nie geraten –
// wenn der Solver stecken bleibt, ist das Feld nicht eindeutig lösbar.
function simulateSolve(m,cnt,startI){
  const n=cols*rows;
  const st=new Uint8Array(n);   // 0 = unbekannt, 1 = offen, 2 = Mine
  let opened=0, flags=0;
  const need=n-totalMines;

  function open(i){
    if(st[i]) return;
    st[i]=1; opened++;
    if(cnt[i]===0){ const nb=NB[i]; for(let q=0;q<nb.length;q++) if(!st[nb[q]]) open(nb[q]); }
  }

  function stepSimple(){
    let ch=false;
    for(let i=0;i<n;i++){
      if(st[i]!==1||cnt[i]===0) continue;
      const nb=NB[i];
      let unk=0, fl=0;
      for(let q=0;q<nb.length;q++){ const s=st[nb[q]]; if(s===0) unk++; else if(s===2) fl++; }
      if(!unk) continue;
      if(cnt[i]===fl){
        for(let q=0;q<nb.length;q++) if(st[nb[q]]===0){ open(nb[q]); ch=true; }
      } else if(cnt[i]-fl===unk){
        for(let q=0;q<nb.length;q++) if(st[nb[q]]===0){ st[nb[q]]=2; flags++; ch=true; }
      }
    }
    if(!ch){   // globale Minenzahl
      let unkTot=0;
      for(let i=0;i<n;i++) if(st[i]===0) unkTot++;
      if(unkTot){
        if(flags===totalMines){ for(let i=0;i<n;i++) if(st[i]===0){ open(i); ch=true; } }
        else if(unkTot===totalMines-flags){ for(let i=0;i<n;i++) if(st[i]===0){ st[i]=2; flags++; } ch=true; }
      }
    }
    return ch;
  }

  function constraints(){
    const cs=[];
    for(let i=0;i<n;i++){
      if(st[i]!==1||cnt[i]===0) continue;
      const nb=NB[i]; const list=[]; let fl=0;
      for(let q=0;q<nb.length;q++){ const j=nb[q], s=st[j]; if(s===0) list.push(j); else if(s===2) fl++; }
      if(list.length) cs.push({o:i,cells:list,m:cnt[i]-fl});
    }
    return cs;
  }

  // A ⊂ B  ⇒  B\A enthält (mB − mA) Minen
  function stepSubset(){
    const cs=constraints(); let ch=false;
    for(let a=0;a<cs.length;a++) for(let b=0;b<cs.length;b++){
      if(a===b) continue;
      const A=cs[a], B=cs[b];
      if(A.cells.length>=B.cells.length) continue;
      if(Math.abs(A.o%cols-B.o%cols)>2) continue;
      if(Math.abs(Math.floor(A.o/cols)-Math.floor(B.o/cols))>2) continue;
      let sub=true;
      for(const x of A.cells) if(B.cells.indexOf(x)<0){ sub=false; break; }
      if(!sub) continue;
      const diff=B.cells.filter(x=>A.cells.indexOf(x)<0);
      const dm=B.m-A.m;
      if(dm===0){ for(const x of diff) if(st[x]===0){ open(x); ch=true; } }
      else if(dm===diff.length){ for(const x of diff) if(st[x]===0){ st[x]=2; flags++; ch=true; } }
    }
    return ch;
  }

  // Vollständige Aufzählung einer Zusammenhangskomponente des Randes
  function enumComp(cellsArr,comp,remaining,otherUnknown){
    const k=cellsArr.length;
    const pos=new Map(); cellsArr.forEach((x,ix)=>pos.set(x,ix));
    const cIdx=comp.map(c=>c.cells.map(x=>pos.get(x)));
    const cM=comp.map(c=>c.m);
    const cellCons=Array.from({length:k},()=>[]);
    cIdx.forEach((arr,ci)=>arr.forEach(ix=>cellCons[ix].push(ci)));
    const asg=new Int8Array(k), sum=new Int32Array(comp.length);
    const rem=cIdx.map(a=>a.length);
    const everMine=new Uint8Array(k), everSafe=new Uint8Array(k);
    let nodes=0, ok=true;

    function rec(ix,used){
      if(++nodes>60000){ ok=false; return; }
      if(used>remaining) return;
      if(ix===k){
        if(remaining-used>otherUnknown) return;   // Rest passt nicht ins übrige Feld
        for(let t=0;t<k;t++){ if(asg[t]) everMine[t]=1; else everSafe[t]=1; }
        return;
      }
      for(let v=0;v<=1;v++){
        asg[ix]=v;
        const cc=cellCons[ix]; let feas=true;
        for(let z=0;z<cc.length;z++){
          const ci=cc[z]; sum[ci]+=v; rem[ci]--;
          if(sum[ci]>cM[ci]||sum[ci]+rem[ci]<cM[ci]) feas=false;
        }
        if(feas) rec(ix+1,used+v);
        for(let z=0;z<cc.length;z++){ const ci=cc[z]; sum[ci]-=v; rem[ci]++; }
        if(!ok) return;
      }
    }
    rec(0,0);
    return ok?{everMine,everSafe}:null;
  }

  function stepEnum(){
    const cs=constraints();
    if(!cs.length) return false;
    const byCell=new Map();
    cs.forEach((c,ci)=>c.cells.forEach(x=>{
      if(!byCell.has(x)) byCell.set(x,[]);
      byCell.get(x).push(ci);
    }));
    let unkTot=0; for(let i=0;i<n;i++) if(st[i]===0) unkTot++;
    const remaining=totalMines-flags;
    const seen=new Uint8Array(cs.length);
    let ch=false;
    for(let s=0;s<cs.length;s++){
      if(seen[s]) continue;
      const queue=[s]; seen[s]=1;
      const comp=[], cellsArr=[], inComp=new Set();
      while(queue.length){
        const ci=queue.pop(); comp.push(cs[ci]);
        for(const x of cs[ci].cells){
          if(!inComp.has(x)){ inComp.add(x); cellsArr.push(x); }
          for(const cj of byCell.get(x)) if(!seen[cj]){ seen[cj]=1; queue.push(cj); }
        }
      }
      if(cellsArr.length>24) continue;
      const r=enumComp(cellsArr,comp,remaining,unkTot-cellsArr.length);
      if(!r) continue;
      cellsArr.forEach((x,ix)=>{
        if(st[x]!==0) return;
        if(r.everMine[ix]&&!r.everSafe[ix]){ st[x]=2; flags++; ch=true; }
        else if(!r.everMine[ix]&&r.everSafe[ix]){ open(x); ch=true; }
      });
    }
    return ch;
  }

  open(startI);
  while(opened<need){
    if(stepSimple()) continue;
    if(stepSubset()) continue;
    if(stepEnum())  continue;
    break;
  }
  return {solved:opened===need, opened};
}

// ── NO-GUESS GENERATOR ────────────────────────────────────
// Verwirft Felder so lange, bis eines rein logisch lösbar ist. Läuft in
// Häppchen, damit die Oberfläche nicht einfriert.
const NG_BUDGET={easy:2500,medium:5000,hard:8000};
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function generateNoGuess(safeI,token){
  const t0=performance.now(), budget=NG_BUDGET[diff]||5000;
  let attempts=0, best=null, bestOpened=-1;
  while(true){
    for(let k=0;k<6;k++){
      attempts++;
      const m=randomMines(safeI);
      const cnt=countsFor(m);
      const res=simulateSolve(m,cnt,safeI);
      if(res.solved) return {m,attempts,ms:Math.round(performance.now()-t0),ok:true};
      if(res.opened>bestOpened){ bestOpened=res.opened; best=m; }
    }
    if(token!==genToken) return null;
    if(performance.now()-t0>budget) break;
    await sleep(0);
  }
  return {m:best,attempts,ms:Math.round(performance.now()-t0),ok:false};
}

// ── CLICK HANDLERS ────────────────────────────────────────
async function onLeftClick(i){
  if(gameState==='won'||gameState==='lost'||gameState==='generating') return;
  const c=cells[i];
  if(c.flagged||c.revealed) return;

  if(firstClick){
    firstClick=false;
    if(noGuess){
      const token=genToken;
      gameState='generating';
      setFace('⏳');
      await sleep(20);                      // Gesicht zeichnen lassen
      const res=await generateNoGuess(i,token);
      if(!res||token!==genToken) return;    // Neustart während der Suche
      applyMines(res.m);
      setFace('🙂');
      console.log(res.ok
        ? `Ohne Raten: lösbar (${res.attempts} Versuche, ${res.ms} ms)`
        : `Kein eindeutiges Feld gefunden (${res.attempts} Versuche) – bestes verwendet, Raten möglich.`);
    } else {
      placeMines(i);
    }
    gameState='playing';
    startTimer();
  }

  if(c.mine){
    // boom!
    c.el.classList.add('mine-hit');
    revealAll();
    gameState='lost';
    stopTimer();
    setFace('😵');
    setTimeout(()=>showMsg('💥','BUMM!','Leider verloren…',''),400);
    return;
  }

  reveal(i);
  checkWin();
}

function onRightClick(i){
  if(gameState==='won'||gameState==='lost'||gameState==='generating') return;
  const c=cells[i];
  if(c.revealed) return;
  c.flagged=!c.flagged;
  minesLeft+=c.flagged?-1:1;
  updateLCD('mineCount',minesLeft);
  renderCell(i);
}

// ── REVEAL ────────────────────────────────────────────────
function reveal(i){
  const c=cells[i];
  if(c.revealed||c.flagged||c.mine) return;
  c.revealed=true;
  renderCell(i);
  // flood fill for empty cells
  if(c.count===0){
    const cc=i%cols, cr=Math.floor(i/cols);
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0) continue;
      const nc=cc+dc, nr=cr+dr;
      if(nc>=0&&nc<cols&&nr>=0&&nr<rows){
        const ni=idx(nc,nr);
        if(!cells[ni].revealed&&!cells[ni].flagged) reveal(ni);
      }
    }
  }
}

function revealAll(){
  cells.forEach((c,i)=>{
    if(c.mine&&!c.flagged){ c.revealed=true; renderCell(i); }
    if(!c.mine&&c.flagged){ c.el.classList.add('mine-wrong'); renderCell(i); }
  });
}

function checkWin(){
  const unrevealed=cells.filter(c=>!c.revealed).length;
  if(unrevealed===totalMines){
    gameState='won';
    stopTimer();
    setFace('😎');
    saveBest(diff,timerVal);
    // flag all remaining mines
    cells.forEach((c,i)=>{ if(c.mine&&!c.flagged){c.flagged=true;renderCell(i);} });
    minesLeft=0; updateLCD('mineCount',0);
    setTimeout(()=>showMsg('🎉','GEWONNEN!',
      `Zeit: ${timerVal}s`,
      bestTimes[diff]===timerVal?'★ Neue Bestzeit!':''),400);
  }
}

// ── RENDER CELL ───────────────────────────────────────────
const NUM_COLS=['','n1','n2','n3','n4','n5','n6','n7','n8'];
function renderCell(i){
  const c=cells[i];
  const el=c.el;
  el.className='cell';
  el.textContent='';

  if(c.revealed){
    el.classList.add('revealed');
    if(c.mine){
      el.textContent='💣';
      if(el.classList.contains('mine-hit')) el.classList.add('mine-hit');
    } else if(c.count>0){
      el.textContent=c.count;
      el.classList.add(NUM_COLS[c.count]);
    }
  } else if(c.flagged){
    el.classList.add('flagged');
    el.textContent='🚩';
  } else {
    el.classList.add('hidden');
    // wrong flag after game over
    if(el.classList.contains('mine-wrong')){
      el.textContent='❌';
    }
  }
}

// ── TIMER ─────────────────────────────────────────────────
function startTimer(){
  timerInterval=setInterval(()=>{
    timerVal=Math.min(timerVal+1,999);
    updateLCD('timer',timerVal);
  },1000);
}
function stopTimer(){ clearInterval(timerInterval); timerInterval=null; }

// ── LCD DISPLAY ───────────────────────────────────────────
function updateLCD(id,val){
  const v=Math.max(-99,Math.min(999,val));
  const s=v<0?'-'+String(Math.abs(v)).padStart(2,'0'):String(v).padStart(3,'0');
  document.getElementById(id).textContent=s;
}

// ── FACE ──────────────────────────────────────────────────
function setFace(f){ document.getElementById('faceBtn').textContent=f; }

// ── MESSAGE ───────────────────────────────────────────────
function showMsg(emoji,title,text,sub){
  document.getElementById('msgEmoji').textContent=emoji;
  document.getElementById('msgTitle').textContent=title;
  document.getElementById('msgText').textContent=text;
  document.getElementById('msgScore').textContent=sub;
  document.getElementById('overlay').classList.add('show');
}
function closeMsg(){
  document.getElementById('overlay').classList.remove('show');
  if(gameState==='lost'||gameState==='won') newGame();
}

// ── KEYBOARD ──────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='F2'||e.key==='r'||e.key==='R') newGame();
});

// ── INIT ──────────────────────────────────────────────────
renderNoGuess();
newGame();
</script>
