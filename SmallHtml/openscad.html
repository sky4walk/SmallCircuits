    const [solids, regions] = splitItems(list);
    return { solid: new Solid(solids.flatMap(s => s.polygons)), regions };
  },

  execBlock(block, scope) {
    // 1. Definitionen hochziehen
    for (const st of block.stmts) {
      if (!st) continue;
      if (st.type === 'ModuleDef') scope.mods.set(st.name, { ...st, scope });
      else if (st.type === 'FunctionDef') scope.funcs.set(st.name, { ...st, scope });
    }
    // 2. Zuweisungen in Quelltextreihenfolge (OpenSCAD-Semantik)
    const dynSave = { ...this.dyn };
    for (const st of block.stmts) {
      if (st && st.type === 'Assign') {
        const v = this.evalExpr(st.expr, scope);
        if (st.name[0] === '$') this.dyn[st.name] = v;
        else scope.vars.set(st.name, v);
      }
    }
    // 3. Instanziierungen
    const out = [];
    for (const st of block.stmts) {
      if (!st) continue;
      if (st.type === 'Assign' || st.type === 'ModuleDef' ||
          st.type === 'FunctionDef' || st.type === 'Include') continue;
      out.push(...this.execStatement(st, scope));
    }
    this.dyn = dynSave;
    return out;
  },

  execStatement(st, scope) {
    this.tick(st.line);
    const mod = st.modifier || '';
    if (mod.includes('*')) return [];

    let result;
    switch (st.type) {
      case 'Block': result = this.execBlock(st, new Scope(scope)); break;
      case 'If':
        result = truthy(this.evalExpr(st.cond, scope))
          ? this.execChild(st.then, scope)
          : (st.else ? this.execChild(st.else, scope) : []);
        break;
      case 'For': {
        result = [];
        this.iterate(st.assigns, scope, (s) => { result.push(...this.execChild(st.body, s)); });
        break;
      }
      case 'IntersectionFor': {
        const runs = [];
        this.iterate(st.assigns, scope, (s) => { runs.push(splitItems(this.execChild(st.body, s))); });
        const S = runs.map(r => r[0]).filter(a => a.length).map(a => KERNEL.unionAll3(a));
        const R = runs.map(r => r[1]).filter(a => a.length).map(a => KERNEL.unionAll2(a));
        result = [];
        if (S.length) result.push(S.reduce((a, b) => KERNEL.intersect3(a, b)));
        if (R.length) result.push(R.reduce((a, b) => KERNEL.intersect2(a, b)));
        break;
      }
      case 'LetStmt': {
        const s = new Scope(scope);
        for (const a of st.assigns) s.vars.set(a.name, this.evalExpr(a.expr, s));
        result = this.execChild(st.body, s);
        break;
      }
      case 'Inst': result = this.execInst(st, scope); break;
      default:
        throw new ScadError(`Unbekannte Anweisung ${st.type}`, st.line);
    }

    if (mod.includes('%')) { this.background.push(...result); return []; }
    if (mod.includes('#')) this.highlight.push(...result.map(s => s.clone()));
    if (mod.includes('!')) this.rootItems = result;
    return result;
  },

  execChild(st, scope) {
    if (!st) return [];
    if (st.type === 'Block') return this.execBlock(st, new Scope(scope));
    return this.execStatement(st, scope);
  },

  execInst(st, scope) {
    const name = st.name;

    // --- benutzerdefiniertes Modul ---
    const def = scope.getMod(name);
    if (def) {
      if (++this.callDepth > 5000) {
        this.callDepth--;
        throw new ScadError(`Rekursion zu tief in module ${name}()`, st.line);
      }
      const s = this.bindArgs(def.params, st.args, scope, def.scope);
      const dynSave = { ...this.dyn };
      for (const a of st.args) {
        if (a.name && a.name[0] === '$') this.dyn[a.name] = this.evalExpr(a.expr, scope);
      }
      this.childStack.push({ ast: st.children, scope });
      this.moduleStack.push(name);
      s.vars.set('$children', countChildren(st.children));
      this.dyn.$parent_modules = this.moduleStack.length;
      let out;
      try {
        out = this.execChild(def.body, s);
      } finally {
        this.moduleStack.pop();
        this.childStack.pop();
        this.dyn = dynSave;
        this.callDepth--;
      }
      return out;
    }

    // --- children() ---
    if (name === 'children' || name === 'child') {
      const frame = this.childStack[this.childStack.length - 1];
      if (!frame) return [];
      const kids = childList(frame.ast);
      if (!st.args.length) return kids.flatMap(k => this.execStatement(k, frame.scope));
      const sel = this.evalExpr(st.args[0].expr, scope);
      const idxs = sel instanceof Range ? sel.toArray() : (isVec(sel) ? sel : [sel]);
      return idxs.flatMap(i => {
        const k = kids[Math.floor(num(i))];
        return k ? this.execStatement(k, frame.scope) : [];
      });
    }

    // --- $-Argumente wirken auf den ganzen Teilbaum ---
    const dynSave = { ...this.dyn };
    for (const a of st.args) {
      if (a.name && a.name[0] === '$') this.dyn[a.name] = this.evalExpr(a.expr, scope);
    }
    try {
      return this.execBuiltin(st, scope, name);
    } finally {
      this.dyn = dynSave;
    }
  },

  args(st, scope, names) {
    const out = {};
    const pos = st.args.filter(a => !a.name);
    names.forEach((n, i) => {
      if (i < pos.length) out[n] = this.evalExpr(pos[i].expr, scope);
    });
    for (const a of st.args) {
      if (a.name && a.name[0] !== '$') out[a.name] = this.evalExpr(a.expr, scope);
    }
    return out;
  },

  execBuiltin(st, scope, name) {
    const A = (names) => this.args(st, scope, names);
    const kids = () => this.execChild(st.children, scope);
    const F = [this.dyn.$fn || 0, this.dyn.$fa || 12, this.dyn.$fs || 2];
    const shared = { color: null };

    switch (name) {

      // ---------- Primitive ----------
      case 'cube': {
        const a = A(['size', 'center']);
        let s = a.size === undefined ? 1 : a.size;
        const size = isVec(s) ? [num(s[0]), num(s[1]), num(s[2])] : [num(s), num(s), num(s)];
        if (size.some(v => v < 0)) {
          this.log.push({ kind: 'warn', line: st.line,
            text: `Zeile ${st.line}: cube() mit negativer Kantenlänge ergibt nichts.` });
          return [];
        }
        return [primCube(size, truthy(a.center), shared)];
      }
      case 'sphere': {
        const a = A(['r']);
        const r = a.d !== undefined ? num(a.d) / 2 : (a.r === undefined ? 1 : num(a.r));
        return [primSphere(r, ...F, shared)];
      }
      case 'cylinder': {
        const a = A(['h', 'r1', 'r2', 'center']);
        const h = a.h === undefined ? 1 : num(a.h);
        let r1, r2;
        if (a.d !== undefined) { r1 = r2 = num(a.d) / 2; }
        else if (a.r !== undefined) { r1 = r2 = num(a.r); }
        else { r1 = 1; r2 = 1; }
        if (a.d1 !== undefined) r1 = num(a.d1) / 2;
        if (a.d2 !== undefined) r2 = num(a.d2) / 2;
        if (a.r1 !== undefined) r1 = num(a.r1);
        if (a.r2 !== undefined) r2 = num(a.r2);
        return [primCylinder(h, r1, r2, truthy(a.center), ...F, shared)];
      }
      case 'polyhedron': {
        const a = A(['points', 'faces']);
        const faces = a.faces || a.triangles || [];
        if (!isVec(a.points) || !isVec(faces)) {
          throw new ScadError('polyhedron() braucht points und faces', st.line);
        }
        const ph = primPolyhedron(a.points.map(p => [num(p[0]), num(p[1]), num(p[2])]), faces, shared);
        if (ph.flippedFaces) {
          this.log.push({
            kind: 'warn', line: st.line,
            text: `Zeile ${st.line}: polyhedron() — alle Flächen zeigten nach innen, `
              + 'der Körper wurde umgedreht. OpenSCAD erwartet die Punkte im Uhrzeigersinn von außen.'
          });
        }
        return [ph];
      }

      // ---------- 2D-Primitive ----------
      case 'square': {
        const a = A(['size', 'center']);
        const raw = a.size === undefined ? 1 : a.size;
        const size = isVec(raw) ? [num(raw[0]), num(raw[1])] : [num(raw), num(raw)];
        return [prim2Square(size, truthy(a.center))];
      }
      case 'circle': {
        const a = A(['r']);
        const r = a.d !== undefined ? num(a.d) / 2 : (a.r === undefined ? 1 : num(a.r));
        return [prim2Circle(r, ...F)];
      }
      case 'polygon': {
        const a = A(['points', 'paths']);
        if (!isVec(a.points)) throw new ScadError('polygon() braucht points', st.line);
        return [prim2Polygon(a.points, isVec(a.paths) ? a.paths : null)];
      }
      case 'text': {
        const a = A(['text', 'size', 'font']);
        const str = a.text === undefined ? '' : valueToString(a.text);
        if (!str) return [];
        if (a.font && !lookupFont(a.font) && String(a.font).trim()) {
          this.log.push({
            kind: 'warn', line: st.line,
            text: `Zeile ${st.line}: Schrift "${a.font}" ist nicht geladen — `
              + 'die eingebaute Strichschrift wird verwendet.'
          });
        }
        const rg = textRegion(str, {
          size: a.size === undefined ? 10 : num(a.size),
          font: a.font,
          halign: a.halign, valign: a.valign,
          spacing: a.spacing === undefined ? 1 : num(a.spacing),
          fn: F[0], fa: F[1], fs: F[2]
        });
        return rg.edges.length ? [rg] : [];
      }
      case 'fill': {
        const [, regions] = splitItems(kids());
        return regions.map(fillRegion).filter(rg => rg.edges.length);
      }
      case 'offset': {
        const a = A(['r', 'delta', 'chamfer']);
        const r = a.r !== undefined ? num(a.r)
                : a.delta !== undefined ? num(a.delta) : 0;
        if (a.r === undefined && a.delta !== undefined) {
          this.log.push({
            kind: 'warn', line: st.line,
            text: `Zeile ${st.line}: offset(delta=) wird wie offset(r=) mit runden Ecken gerechnet.`
          });
        }
        const [, regions] = splitItems(kids());
        const isDelta = a.r === undefined && a.delta !== undefined;
        return regions.map(rg => KERNEL.offset2(rg, r, isDelta, truthy(a.chamfer), F));
      }

      // ---------- Extrusion ----------
      case 'linear_extrude': {
        const a = A(['height']);
        const h = a.height === undefined ? 100 : num(a.height);
        const twist = a.twist === undefined ? 0 : num(a.twist);
        const rawS = a.scale === undefined ? 1 : a.scale;
        const sc = isVec(rawS) ? [num(rawS[0]), num(rawS[1])] : [num(rawS), num(rawS)];
        const [, regions] = splitItems(kids());
        return regions.map(rg => {
          let slices;
          if (a.slices !== undefined) {
            slices = Math.max(1, Math.floor(num(a.slices)));
          } else if (twist) {
            const b = rg.bounds();
            const rad = Math.max(Math.hypot(b.lo[0], b.lo[1]), Math.hypot(b.hi[0], b.hi[1]), 1e-6);
            const perTurn = fragments(rad, ...F);
            slices = Math.max(1, Math.ceil(Math.abs(twist) / 360 * perTurn));
          } else {
            slices = 1;
          }
          if (slices > 2000) throw new ScadError('linear_extrude(): zu viele slices', st.line);
          return KERNEL.linearExtrude(rg, h, truthy(a.center), twist, sc, slices, F, shared);
        });
      }
      case 'rotate_extrude': {
        const a = A(['angle']);
        const ang = a.angle === undefined ? 360 : num(a.angle);
        const [, regions] = splitItems(kids());
        return regions.map(rg => {
          try {
            return KERNEL.rotateExtrude(rg, ang, F, shared);
          } catch (err) {
            throw new ScadError(err.message, st.line);
          }
        });
      }
      case 'projection': {
        const a = A(['cut']);
        const [solids] = splitItems(kids());
        if (!solids.length) return [];
        if (truthy(a.cut)) return solids.map(s2 => KERNEL.projectionCut(s2));
        const body = unionSolids(solids);
        const n = body.polygons.length;
        if (n > 60000) throw new ScadError('projection(): zu viele Flächen (> 60000)', st.line);
        return [KERNEL.projectionFull(body)];
      }

      // ---------- veraltete Schreibweisen ----------
      case 'assign': {
        // assign() ist in OpenSCAD abgelöst durch let(),
        // die Wirkung ist dieselbe.
        const s2 = new Scope(scope);
        for (const arg of st.args) {
          if (arg.name && arg.name[0] !== '$') s2.vars.set(arg.name, this.evalExpr(arg.expr, scope));
        }
        return this.execChild(st.children, s2);
      }
      case 'dxf_linear_extrude': case 'dxf_rotate_extrude': {
        const a = A(['file', 'layer', 'height']);
        const sub = {
          type: 'Inst', name: 'import', line: st.line, modifier: '',
          args: st.args.filter(x => x.name === 'file' || x.name === 'layer'
            || (!x.name && st.args.indexOf(x) === 0)),
          children: { type: 'Block', stmts: [] }
        };
        const [, regions] = splitItems(this.execInst(sub, scope));
        if (!regions.length) return [];
        if (name === 'dxf_linear_extrude') {
          const h = a.height === undefined ? 100 : num(a.height);
          return regions.map(rg =>
            KERNEL.linearExtrude(rg, h, truthy(a.center), 0, [1, 1], 1, F, shared));
        }
        return regions.map(rg => KERNEL.rotateExtrude(rg, 360, F, shared));
      }

      // ---------- Minkowski-Summe ----------
      case 'minkowski': {
        const [S, R] = splitItems(kids());
        const out = [];
        if (S.length) {
          out.push(S.length === 1 ? S[0]
            : S.slice(1).reduce((acc, x) => KERNEL.minkowski3(acc, x, st.line), S[0]));
        }
        if (R.length) {
          out.push(R.length === 1 ? R[0]
            : R.slice(1).reduce((acc, x) => KERNEL.minkowski2(acc, x, st.line), R[0]));
        }
        return out;
      }

      // ---------- Dateien ----------
      case 'import': case 'import_stl': case 'import_dxf': {
        const a = A(['file']);
        const nm = a.file !== undefined ? a.file : a.filename;
        const entry = lookupData(nm);
        if (!entry) {
          const have = dataNames();
          throw new ScadError(
            `import(): "${nm === undefined ? '' : nm}" ist nicht geladen. `
            + 'Oben über "Daten laden" hinzufügen'
            + (have.length ? `. Verfügbar: ${have.join(', ')}` : '.'), st.line);
        }
        if (entry.kind === 'stl') return [entry.solid.clone()];
        if (entry.kind === 'dxf') {
          const layer = a.layer === undefined ? '' : String(a.layer);
          const ck = layer + '|' + F.join(',');
          if (!entry.cache) entry.cache = new Map();
          let res = entry.cache.get(ck);
          if (!res) {
            res = parseDXF(entry.text, ...F, layer);
            entry.cache.set(ck, res);
          }
          if (res.open) {
            this.log.push({
              kind: 'warn', line: st.line,
              text: `Zeile ${st.line}: ${res.open} Kantenzug/Kantenzüge in "${entry.name}" `
                + 'ließen sich nicht schließen.'
            });
          }
          if (!res.region.edges.length) return [];
          let rg = res.region.clone();
          // origin verschiebt den Nullpunkt der Zeichnung, scale skaliert danach
          const org = isVec(a.origin) ? [num(a.origin[0]), num(a.origin[1])] : [0, 0];
          const sc = a.scale === undefined ? 1 : num(a.scale);
          if (org[0] || org[1]) rg = rg.transform(M.translate([-org[0], -org[1], 0]));
          if (sc !== 1) rg = rg.transform(M.scale([sc, sc, 1]));
          return [rg];
        }
        throw new ScadError(
          `import(): "${entry.name}" ist ein Höhenraster — dafür surface() verwenden.`, st.line);
      }
      case 'surface': {
        const a = A(['file', 'center', 'invert']);
        const entry = lookupData(a.file);
        if (!entry) {
          const have = dataNames();
          throw new ScadError(
            `surface(): "${a.file === undefined ? '' : a.file}" ist nicht geladen. `
            + 'Oben über "Daten laden" hinzufügen'
            + (have.length ? `. Verfügbar: ${have.join(', ')}` : '.'), st.line);
        }
        if (entry.kind !== 'heightmap') {
          throw new ScadError(
            `surface(): "${entry.name}" ist kein Höhenraster. `
            + 'Textdatei mit Zahlen oder Bilddatei laden.', st.line);
        }
        try {
          return [surfaceSolid(entry.rows, truthy(a.center), truthy(a.invert), shared)];
        } catch (err) {
          throw new ScadError('surface(): ' + err.message, st.line);
        }
      }

      // ---------- Konvexe Hülle ----------
      case 'hull': {
        const [S, R] = splitItems(kids());
        try {
          if (S.length) {
            const pts = [];
            for (const sd of S) for (const p of sd.polygons) for (const v of p.vertices) pts.push(v);
            for (const rg of R) for (const e of rg.edges) {
              pts.push([e.a[0], e.a[1], 0]);
              pts.push([e.b[0], e.b[1], 0]);
            }
            const h = KERNEL.hull3(pts);
            if (!h) {
              this.log.push({
                kind: 'warn', line: st.line,
                text: `Zeile ${st.line}: hull() — die Punkte liegen alle in einer Ebene, kein Körper möglich.`
              });
              return [];
            }
            return [h];
          }
          if (R.length) {
            const pts = [];
            for (const rg of R) for (const e of rg.edges) { pts.push(e.a); pts.push(e.b); }
            const rg = KERNEL.hull2(pts);
            return rg.edges.length ? [rg] : [];
          }
        } catch (err) {
          throw new ScadError(err.message, st.line);
        }
        return [];
      }

      // ---------- Transformationen ----------
      case 'translate': {
        const v = vec3(A(['v']).v, [0, 0, 0]);
        return xf(kids(), M.translate(v));
      }
      case 'scale': {
        const raw = A(['v']).v;
        const v = isVec(raw) ? vec3(raw, [1, 1, 1], 1) : [num(raw), num(raw), num(raw)];
        return xf(kids(), M.scale(v));
      }
      case 'mirror': {
        const v = vec3(A(['v']).v, [1, 0, 0]);
        return xf(kids(), M.mirror(v));
      }
      case 'rotate': {
        const a = A(['a', 'v']);
        let m;
        if (a.v !== undefined && !isVec(a.a)) {
          m = M.rotAxis(vec3(a.v, [0, 0, 1]), num(a.a));
        } else if (isVec(a.a)) {
          const [x, y, z] = vec3(a.a, [0, 0, 0]);
          m = M.mul(M.mul(M.rotZ(z * DEG), M.rotY(y * DEG)), M.rotX(x * DEG));
        } else {
          m = M.rotZ(num(a.a) * DEG);
        }
        return xf(kids(), m);
      }
      case 'multmatrix': {
        const m4 = A(['m']).m;
        const m = M.ident();
        for (let r = 0; r < 3; r++)
          for (let c = 0; c < 4; c++)
            m[r * 4 + c] = num((m4[r] || [])[c]);
        return xf(kids(), m);
      }
      case 'resize': {
        const a = A(['newsize', 'auto']);
        const [S, R] = splitItems(kids());
        const ns = vec3(a.newsize, [0, 0, 0]);
        const autoRaw = a.auto;
        const auto = isVec(autoRaw)
          ? [truthy(autoRaw[0]), truthy(autoRaw[1]), truthy(autoRaw[2])]
          : [truthy(autoRaw), truthy(autoRaw), truthy(autoRaw)];

        // Achsen ohne Vorgabe folgen bei auto=true dem Faktor der
        // ersten vorgegebenen Achse, sonst bleiben sie unverändert.
        const factors = (cur) => {
          const f = ns.map((v, i) => (v > 0 && cur[i] > 1e-9) ? v / cur[i] : null);
          const ref = f.find(x => x !== null);
          return f.map((x, i) => x !== null ? x : (auto[i] && ref !== undefined ? ref : 1));
        };
        const out = [];
        if (S.length) {
          const g = KERNEL.unionAll3(S);
          const b = g.bounds();
          const f = factors([b.hi[0] - b.lo[0], b.hi[1] - b.lo[1], b.hi[2] - b.lo[2]]);
          out.push(g.transform(M.scale(f)));
        }
        if (R.length) {
          const g = KERNEL.unionAll2(R);
          const b = g.bounds();
          const f = factors([b.hi[0] - b.lo[0], b.hi[1] - b.lo[1], 1]);
          out.push(g.transform(M.scale([f[0], f[1], 1])));
        }
        return out;
      }

      // ---------- Boolesche Operationen ----------
      case 'union': case 'group': {
        const [S, R] = splitItems(kids());
        const out = [];
        if (S.length) out.push(KERNEL.unionAll3(S));
        if (R.length) out.push(KERNEL.unionAll2(R));
        return out;
      }
      case 'difference': {
        const [S, R] = splitItems(kids());
        const out = [];
        // Alle Subtrahenden zuerst zusammenfassen: ein BSP-Durchlauf statt n.
        if (S.length) out.push(S.length === 1 ? S[0] : KERNEL.subtract3(S[0], KERNEL.unionAll3(S.slice(1))));
        if (R.length) out.push(R.length === 1 ? R[0] : KERNEL.subtract2(R[0], KERNEL.unionAll2(R.slice(1))));
        return out;
      }
      case 'intersection': {
        const [S, R] = splitItems(kids());
        const out = [];
        if (S.length) out.push(S.reduce((a, b) => KERNEL.intersect3(a, b)));
        if (R.length) out.push(R.reduce((a, b) => KERNEL.intersect2(a, b)));
        return out;
      }
      case 'render': case 'hull_disabled':
        return kids();

      // ---------- Sonstiges ----------
      case 'color': {
        const a = A(['c', 'alpha']);
        let rgb = [.9, .9, .9], alpha = a.alpha === undefined ? 1 : num(a.alpha);
        if (typeof a.c === 'string') {
          const key = a.c.toLowerCase();
          if (NAMED_COLORS[key]) rgb = NAMED_COLORS[key];
          else if (/^#[0-9a-f]{6}$/i.test(a.c)) {
            rgb = [1, 3, 5].map(i => parseInt(a.c.substr(i, 2), 16) / 255);
          }
        } else if (isVec(a.c)) {
          rgb = [num(a.c[0]), num(a.c[1]), num(a.c[2])];
          if (a.c.length > 3 && a.alpha === undefined) alpha = num(a.c[3]);
        }
        const col = [rgb[0], rgb[1], rgb[2], alpha];
        const ks = kids();
        for (const it of ks) {
          if (it.is2D) { if (!it.color) it.color = col; continue; }
          for (const p of it.polygons) {
            if (!p.shared || p.shared.color === null) p.shared = { color: col };
          }
        }
        return ks;
      }
      case 'echo': {
        const parts = st.args.map(a =>
          (a.name ? a.name + ' = ' : '') + valueToString(this.evalExpr(a.expr, scope)));

function vec3(v, def, fill = 0) {

    v.length > 0 ? num(v[0]) : fill,
    v.length > 1 ? num(v[1]) : fill,
    v.length > 2 ? num(v[2]) : fill

}
function xf(items, m) { return items.map(s => s.transform(m)); }
function splitItems(items) {

  for (const it of items) (it.is2D ? R : S).push(it);
  return [S, R];
}
function unionSolids(list) {
  if (!list.length) return new Solid([]);
  if (list.length === 1) return list[0];

//  Einstiegspunkt
// ============================================================
function compileScad(src, opts = {}) {
  const t0 = Date.now();
  const ast = parse(src);
  const interp = new Interpreter(opts);
  try {
    let result;
    try {
      result = interp.run(ast);
    } catch (err) {
      if (err instanceof RangeError) {
        throw new ScadError(
          'Rekursion zu tief — der Aufrufstapel des Browsers ist erschöpft. '
          + 'Tail-Rekursion über lange Listen lieber als Schleife oder list comprehension schreiben.',
          interp.lastCallLine || 0);
      }
      throw err;
    }
    const { solid, regions } = result;
    // Der fremde Kern gibt seinen Speicher gleich wieder frei,
    // also muss vorher alles in Polygone übersetzt sein.
    void solid.polygons.length;
    for (const r of regions) void r.edges.length;
    for (const it of interp.background.concat(interp.highlight)) {
      if (it.is2D) void it.edges.length; else void it.polygons.length;
    }
    return {
      solid,
      regions,
      background: interp.background,
      highlight: interp.highlight,
      log: interp.log,
      kernel: KERNEL.id,
      ms: Date.now() - t0
    };
  } finally {
    KERNEL.end();
  }
}

//  STL-Export
// ============================================================
function toBinarySTL(solid, name = 'openscad-js') {
  const tris = solid.triangles();
  const buf = new ArrayBuffer(84 + tris.length * 50);
  const dv = new DataView(buf);
  const header = new Uint8Array(buf, 0, 80);
  const txt = ('Generiert mit ' + name).slice(0, 79);
  for (let i = 0; i < txt.length; i++) header[i] = txt.charCodeAt(i);
  dv.setUint32(80, tris.length, true);

  let o = 84;
  for (const t of tris) {
    const n = V.norm(V.cross(V.sub(t.b, t.a), V.sub(t.c, t.a)));
    dv.setFloat32(o, n[0], true); dv.setFloat32(o + 4, n[1], true); dv.setFloat32(o + 8, n[2], true);
    o += 12;
    for (const v of [t.a, t.b, t.c]) {
      dv.setFloat32(o, v[0], true);
      dv.setFloat32(o + 4, v[1], true);
      dv.setFloat32(o + 8, v[2], true);
      o += 12;
    }
    dv.setUint16(o, 0, true);
    o += 2;
  }
  return buf;
}

//  DXF-Export (R12, damit es überall aufgeht)
// ============================================================
function dxfNum(x) {
  const v = Math.abs(x) < 1e-9 ? 0 : x;
  return v.toFixed(6).replace(/\.?0+$/, '') || '0';
}

function toDXF(regions) {
  const L = [];
  const g = (code, val) => { L.push(String(code)); L.push(String(val)); };
  let rings = 0, open = 0;

  g(0, 'SECTION'); g(2, 'HEADER');
  g(9, '$ACADVER'); g(1, 'AC1009');
  g(0, 'ENDSEC');

  g(0, 'SECTION'); g(2, 'TABLES');
  g(0, 'TABLE'); g(2, 'LAYER'); g(70, 1);
  g(0, 'LAYER'); g(2, '0'); g(70, 0); g(62, 7); g(6, 'CONTINUOUS');
  g(0, 'ENDTAB'); g(0, 'ENDSEC');

  g(0, 'SECTION'); g(2, 'ENTITIES');
  for (const rg of regions) {
    const res = rg.toContours();
    open += res.open;
    for (const c of res.contours) {
      rings++;
      g(0, 'POLYLINE'); g(8, '0'); g(66, 1); g(70, 1);
      g(10, '0'); g(20, '0'); g(30, '0');
      for (const v of c) {
        g(0, 'VERTEX'); g(8, '0');
        g(10, dxfNum(v[0])); g(20, dxfNum(v[1])); g(30, '0');
      }
      g(0, 'SEQEND'); g(8, '0');
    }
  }
  g(0, 'ENDSEC'); g(0, 'EOF');

  return { text: L.join('\r\n') + '\r\n', rings, open };
}

function toAsciiSTL(solid, name = 'openscad_js') {
  const out = [`solid ${name}`];
  for (const t of solid.triangles()) {
    const n = V.norm(V.cross(V.sub(t.b, t.a), V.sub(t.c, t.a)));
    out.push(`  facet normal ${n[0]} ${n[1]} ${n[2]}`);
    out.push('    outer loop');
    for (const v of [t.a, t.b, t.c]) out.push(`      vertex ${v[0]} ${v[1]} ${v[2]}`);
    out.push('    endloop');
    out.push('  endfacet');
  }
  out.push(`endsolid ${name}`);
  return out.join('\n');
}

const VS_SOLID = `#version 300 es
in vec3 aPos;
in vec3 aNormal;
in vec4 aColor;
uniform mat4 uMVP;
uniform mat4 uModelView;
uniform mat3 uNormalMat;
out vec3 vNormal;
out vec3 vViewPos;
out vec4 vColor;
void main() {
  vNormal = normalize(uNormalMat * aNormal);
  vec4 mv = uModelView * vec4(aPos, 1.0);
  vViewPos = mv.xyz;
  vColor = aColor;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

const FS_SOLID = `#version 300 es
precision highp float;
in vec3 vNormal;
in vec3 vViewPos;
in vec4 vColor;
out vec4 fragColor;
void main() {
  vec3 n = normalize(vNormal);
  if (!gl_FrontFacing) n = -n;
  vec3 viewDir = normalize(-vViewPos);
  // Kopflicht plus zwei schwache Fülllichter, damit Kanten lesbar bleiben
  float key  = max(dot(n, normalize(vec3( 0.35, 0.25, 1.0))), 0.0);
  float fill = max(dot(n, normalize(vec3(-0.7, -0.4, 0.35))), 0.0);
  float rim  = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);
  vec3 base = vColor.rgb;
  vec3 col = base * (0.26 + 0.68 * key + 0.20 * fill) + vec3(0.32, 0.40, 0.48) * rim * 0.35;
  fragColor = vec4(col, vColor.a);
}`;

const VS_LINE = `#version 300 es
in vec3 aPos;
in vec4 aColor;
uniform mat4 uMVP;
out vec4 vColor;
void main() { vColor = aColor; gl_Position = uMVP * vec4(aPos, 1.0); }`;

const FS_LINE = `#version 300 es
precision highp float;
in vec4 vColor;
out vec4 fragColor;
void main() { fragColor = vColor; }`;

function mat4Perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  return [
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) / (near - far), 2 * far * near / (near - far),
    0, 0, -1, 0
  ];
}
function mat4LookAt(eye, center, up) {
  const z = V.norm(V.sub(eye, center));
  const x = V.norm(V.cross(up, z));
  const y = V.cross(z, x);
  return [
    x[0], x[1], x[2], -V.dot(x, eye),
    y[0], y[1], y[2], -V.dot(y, eye),
    z[0], z[1], z[2], -V.dot(z, eye),
    0, 0, 0, 1
  ];
}
// row-major -> column-major für WebGL
function toGL(m) {
  return new Float32Array([
    m[0], m[4], m[8], m[12],
    m[1], m[5], m[9], m[13],
    m[2], m[6], m[10], m[14],
    m[3], m[7], m[11], m[15]
  ]);
}

class Viewport {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
    if (!gl) throw new Error('WebGL2 wird von diesem Browser nicht unterstützt.');
    this.gl = gl;

    this.progSolid = this.link(VS_SOLID, FS_SOLID);
    this.progLine = this.link(VS_LINE, FS_LINE);

    this.target = [0, 0, 0];
    this.dist = 120;
    this.yaw = -55 * Math.PI / 180;
    this.pitch = 62 * Math.PI / 180;
    this.showGrid = true;
    this.showAxes = true;

    this.opaque = this.makeMesh();
    this.trans = this.makeMesh();
    this.lines = { buf: gl.createBuffer(), vao: gl.createVertexArray(), count: 0 };
    this.setupLineVAO();

  link(vsSrc, fsSrc) {

    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error('Shader: ' + gl.getShaderInfoLog(s));

    gl.attachShader(p, mk(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsSrc));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.bindAttribLocation(p, 1, 'aNormal');
    gl.bindAttribLocation(p, 2, 'aColor');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('Programm: ' + gl.getProgramInfoLog(p));

    gl.bindVertexArray(m.vao);

    const stride = 10 * 4;
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, stride, 24);
    gl.bindVertexArray(null);
    return m;
  }

  setupLineVAO() {
    const gl = this.gl;
    gl.bindVertexArray(this.lines.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.lines.buf);
    const stride = 7 * 4;
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, stride, 12);
    gl.bindVertexArray(null);
  }

  // --- Geometrie hochladen ---
  setGeometry(solid, extras) {
    const DEFAULT = [0.847, 0.784, 0.639, 1.0];
    const FLAT2D = [0.376, 0.616, 0.714, 1.0];
    const opaque = [], trans = [];

    const push = (arr, t, color) => {
      const n = V.norm(V.cross(V.sub(t.b, t.a), V.sub(t.c, t.a)));
      for (const v of [t.a, t.b, t.c]) {
        arr.push(v[0], v[1], v[2], n[0], n[1], n[2], color[0], color[1], color[2], color[3]);
      }
    };
    const asSolid = (it) => (it.is2D ? it.toSolid({ color: it.color || null }) : it);

    for (const t of solid.triangles()) {
      const c = (t.shared && t.shared.color) || DEFAULT;
      push(c[3] < 0.999 ? trans : opaque, t, c);
    }

    // Flächen ohne Extrusion liegen flach in der Ebene z = 0
    const flat = (extras.regions || []).map(asSolid);
    for (const s of flat) {
      for (const t of s.triangles()) {
        push(opaque, t, (t.shared && t.shared.color) || FLAT2D);
      }
    }

    for (const it of (extras.background || [])) {
      for (const t of asSolid(it).triangles()) push(trans, t, [0.45, 0.50, 0.56, 0.22]);
    }
    for (const it of (extras.highlight || [])) {
      for (const t of asSolid(it).triangles()) push(trans, t, [0.95, 0.42, 0.35, 0.35]);
    }

    this.upload(this.opaque, opaque, 10);
    this.upload(this.trans, trans, 10);

    const all = new Solid(solid.polygons.concat(...flat.map(s => s.polygons)));
    this.bbox = all.polygons.length ? all.bounds() : null;
    this.buildGrid();
  }

  upload(mesh, data, comps) {
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
    mesh.count = data.length / comps;
  }

  buildGrid() {
    const b = this.bbox;
    let ext = 50;
    if (b) {
      ext = Math.max(
        Math.abs(b.lo[0]), Math.abs(b.hi[0]),
        Math.abs(b.lo[1]), Math.abs(b.hi[1]), 10) * 1.6;
    }
    let step = Math.pow(10, Math.round(Math.log10(ext / 8)));
    if (ext / step > 20) step *= 5;
    if (ext / step < 4) step /= 2;
    const n = Math.ceil(ext / step);
    const R = n * step;
    const d = [];
    const line = (a, b2, c) => d.push(a[0], a[1], a[2], c[0], c[1], c[2], c[3],

    if (this.showGrid) {
      const minor = [0.16, 0.20, 0.25, 1], major = [0.24, 0.30, 0.37, 1];
      for (let i = -n; i <= n; i++) {
        const p = i * step;
        const col = (i % 5 === 0) ? major : minor;
        if (i !== 0) {
          line([p, -R, 0], [p, R, 0], col);
          line([-R, p, 0], [R, p, 0], col);
        }
      }
    }
    if (this.showAxes) {
      line([-R, 0, 0], [R, 0, 0], [0.78, 0.32, 0.30, 1]);
      line([0, -R, 0], [0, R, 0], [0.40, 0.68, 0.38, 1]);
      line([0, 0, 0], [0, 0, R * 0.6], [0.36, 0.58, 0.82, 1]);

    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.lines.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d), gl.STATIC_DRAW);
    this.lines.count = d.length / 7;
    this.gridStep = step;
  }

  fit() {
    const b = this.bbox;
    if (!b) { this.target = [0, 0, 0]; this.dist = 120; return; }
    this.target = [
      (b.lo[0] + b.hi[0]) / 2,
      (b.lo[1] + b.hi[1]) / 2,
      (b.lo[2] + b.hi[2]) / 2

    const r = Math.max(
      V.len(V.sub(b.hi, b.lo)) / 2, 1);
    this.dist = r / Math.tan(0.42) * 1.25;
  }

  eye() {
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    return V.add(this.target, [
      this.dist * sp * Math.cos(this.yaw),
      this.dist * sp * Math.sin(this.yaw),

  draw() {
    const gl = this.gl, c = this.canvas;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(c.clientWidth * dpr));
    const h = Math.max(1, Math.floor(c.clientHeight * dpr));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const eye = this.eye();
    const view = mat4LookAt(eye, this.target, [0, 0, 1]);
    const near = Math.max(this.dist * 0.002, 0.01);
    const proj = mat4Perspective(0.84, w / h, near, this.dist * 40 + 1000);
    const mvp = M.mul(proj, view);

    // Raster und Achsen
    gl.useProgram(this.progLine);
    gl.uniformMatrix4fv(gl.getUniformLocation(this.progLine, 'uMVP'), false, toGL(mvp));
    gl.bindVertexArray(this.lines.vao);
    gl.drawArrays(gl.LINES, 0, this.lines.count);

    // Körper
    gl.useProgram(this.progSolid);
    const P = this.progSolid;
    gl.uniformMatrix4fv(gl.getUniformLocation(P, 'uMVP'), false, toGL(mvp));
    gl.uniformMatrix4fv(gl.getUniformLocation(P, 'uModelView'), false, toGL(view));
    gl.uniformMatrix3fv(gl.getUniformLocation(P, 'uNormalMat'), false, new Float32Array([
      view[0], view[4], view[8],
      view[1], view[5], view[9],
      view[2], view[6], view[10]
    ]));

    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(this.opaque.vao);
    gl.drawArrays(gl.TRIANGLES, 0, this.opaque.count);

    if (this.trans.count) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.bindVertexArray(this.trans.vao);
      gl.drawArrays(gl.TRIANGLES, 0, this.trans.count);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }
    gl.bindVertexArray(null);
  }

  requestDraw() {
    if (this._pending) return;
    this._pending = true;
    requestAnimationFrame(() => { this._pending = false; this.draw(); });
  }

  bindEvents() {
    const c = this.canvas;
    let mode = 0, lx = 0, ly = 0;

    c.addEventListener('contextmenu', e => e.preventDefault());
    c.addEventListener('pointerdown', (e) => {
      c.setPointerCapture(e.pointerId);
      mode = (e.button === 0 && !e.shiftKey) ? 1 : 2;
      lx = e.clientX; ly = e.clientY;
    });
    c.addEventListener('pointerup', (e) => { mode = 0; });
    c.addEventListener('pointermove', (e) => {
      if (!mode) return;
      const dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      if (mode === 1) {
        this.yaw -= dx * 0.008;
        this.pitch = Math.max(0.02, Math.min(Math.PI - 0.02, this.pitch - dy * 0.008));
      } else {
        const eye = this.eye();
        const fwd = V.norm(V.sub(this.target, eye));
        const right = V.norm(V.cross(fwd, [0, 0, 1]));
        const up = V.cross(right, fwd);
        const s = this.dist * 0.0018;
        this.target = V.add(this.target, V.add(V.mul(right, -dx * s), V.mul(up, dy * s)));
      }
      this.requestDraw();
    });
    c.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.dist *= Math.exp(Math.sign(e.deltaY) * 0.12);
      this.dist = Math.max(0.05, Math.min(1e6, this.dist));
      this.requestDraw();
    }, { passive: false });

    new ResizeObserver(() => this.requestDraw()).observe(c);
  }

  setView(name) {
    const v = {
      front: [-Math.PI / 2, Math.PI / 2],
      back: [Math.PI / 2, Math.PI / 2],
      left: [Math.PI, Math.PI / 2],
      right: [0, Math.PI / 2],
      top: [-Math.PI / 2, 0.001],
      bottom: [-Math.PI / 2, Math.PI - 0.001],
      iso: [-55 * Math.PI / 180, 62 * Math.PI / 180]
    }[name];
    if (v) { this.yaw = v[0]; this.pitch = v[1]; this.requestDraw(); }
  }
}

cylinder(h = 4, r = 30, $fn = 64);

const $ = (id) => document.getElementById(id);

let vp = null;
let currentSolid = new Solid([]);
let currentRegions = [];
let pendingLog = [];
let currentKernelId = 'bsp';
let fileName = 'modell.scad';

function initUI() {
  const editor = $('editor');
  const gutter = $('gutter');

  try {
    vp = new Viewport($('view'));
  } catch (e) {
    $('overlay').textContent = e.message;
    $('overlay').style.display = 'block';
    return;
  }

  // Beispiel-Auswahl füllen
  const sel = $('examples');
  for (const name of Object.keys(EXAMPLES)) {
    const o = document.createElement('option');
    o.value = name;
    o.textContent = name;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    if (!sel.value) return;
    editor.value = EXAMPLES[sel.value];
    fileName = sel.value.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.scad';
    updateGutter();
    render(true);
    sel.value = '';
  });

  editor.value = EXAMPLES['Erste Schritte'];
  updateGutter();

  editor.addEventListener('input', updateGutter);
  editor.addEventListener('scroll', syncScroll);
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '    ' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 4;
      updateGutter();
      return;
    }
    // Enter übernimmt den Einzug der Zeile und rückt nach einer
    // öffnenden Klammer eine Stufe weiter ein.
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      const before = editor.value.slice(0, s);
      const lineStart = before.lastIndexOf('\n') + 1;
      const line = before.slice(lineStart);
      let indent = (line.match(/^[ \t]*/) || [''])[0];
      const trimmed = line.trimEnd();
      if (/[{(\[]$/.test(trimmed)) indent += '    ';
      const after = editor.value.slice(en);
      // Schließt die nächste Zeile die Klammer, bleibt sie eine Stufe zurück
      const closesNext = /^[ \t]*[})\]]/.test(after) && /[{(\[]$/.test(trimmed);
      const insert = closesNext
        ? '\n' + indent + '\n' + indent.slice(0, -4)
        : '\n' + indent;
      editor.value = before + insert + after;
      const pos = s + 1 + indent.length;
      editor.selectionStart = editor.selectionEnd = pos;
      updateGutter();
      editor.scrollTop = editor.scrollTop;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'F5' || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) {
      e.preventDefault();
      render(false);
    }
    if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveScad(); }
  });

  $('btn-render').addEventListener('click', () => render(false));
  $('btn-stl').addEventListener('click', saveSTL);
  $('btn-dxf').addEventListener('click', saveDXF);
  $('btn-save').addEventListener('click', saveScad);
  $('btn-open').addEventListener('click', () => $('file-input').click());
  $('btn-font').addEventListener('click', () => $('font-input').click());
  $('btn-data').addEventListener('click', () => $('data-input').click());
  $('kernel').addEventListener('change', switchKernel);

  $('data-input').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    let pending = files.length;
    if (!pending) return;
    const done = () => { if (--pending === 0) render(false); };
    for (const f of files) loadDataFile(f, done);
  });

  $('font-input').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    let pending = files.length;
    if (!pending) return;
    for (const f of files) {
      const rd = new FileReader();
      rd.onload = () => {
        const name = f.name.replace(/\.(ttf|ttc)$/i, '');
        try {
          registerFont(name, new TrueTypeFont(rd.result, name));
          pendingLog.push({
            text: `Schrift "${name}" geladen. Im Quelltext: text("…", font = "${name}")`,
            cls: 'ok'
          });
        } catch (err) {
          pendingLog.push({ text: `${f.name}: ${err.message}`, cls: 'error' });
        }
        if (--pending === 0) render(false);
      };
      rd.onerror = () => {
        pendingLog.push({ text: `${f.name} ließ sich nicht lesen.`, cls: 'error' });
        if (--pending === 0) render(false);
      };
      rd.readAsArrayBuffer(f);
    }
  });
  $('btn-fit').addEventListener('click', () => { vp.fit(); vp.requestDraw(); });
  $('btn-grid').addEventListener('click', (e) => {
    vp.showGrid = !vp.showGrid;
    e.currentTarget.classList.toggle('off', !vp.showGrid);
    vp.buildGrid();
    vp.requestDraw();
  });
  $('views').addEventListener('change', (e) => {
    vp.setView(e.target.value);
    e.target.value = '';
  });

  $('file-input').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      editor.value = r.result;
      fileName = f.name;
      updateGutter();
      render(true);
    };
    r.readAsText(f);
    e.target.value = '';
  });

  // Trennlinie zwischen Editor und Ansicht
  initSplitter();

  render(true);
}

// ------------------------------------------------------------
//  Einfärbung des Quelltextes
// ------------------------------------------------------------
const HL_KEYWORDS = new Set([
  'module', 'function', 'if', 'else', 'for', 'let', 'each',
  'include', 'use', 'true', 'false', 'undef', 'intersection_for', 'assert'
]);

// Kommentar | Zeichenkette | Zahl | Bezeichner | Operator
const HL_RE = new RegExp([
  '(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)',
  '("(?:\\\\.|[^"\\\\])*")',
  '((?:\\b\\d+(?:\\.\\d*)?|\\.\\d+)(?:[eE][+-]?\\d+)?)',
  '([A-Za-z_$][A-Za-z0-9_]*)',
  '([+\\-*/%^?:=<>!&|.#,;(){}\\[\\]])'
].join('|'), 'g');

function escHtml(s) {
  return s.replace(/[&<>]/g, (c) => (c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'));
}

function identClass(name, userMods, userFuncs) {
  if (name[0] === '$') return 'hl-var';
  if (HL_KEYWORDS.has(name)) return 'hl-key';
  if (NOT_IMPLEMENTED[name]) return 'hl-todo';
  if (BUILTIN_MODULES.has(name) || userMods.has(name)) return 'hl-mod';
  if (BUILTIN_FUNCS[name] || SPECIAL_FUNCS.has(name) || userFuncs.has(name)) return 'hl-fun';
  return null;
}

// Eigene Module und Funktionen bekommen dieselben Farben wie die eingebauten
const DECL_RE = /\b(module|function)\s+([A-Za-z_][A-Za-z0-9_]*)/g;
function collectDeclarations(src) {
  const mods = new Set(), funcs = new Set();
  let m;
  DECL_RE.lastIndex = 0;
  while ((m = DECL_RE.exec(src)) !== null) {
    (m[1] === 'module' ? mods : funcs).add(m[2]);
  }
  return [mods, funcs];
}

function highlightScad(src) {
  const [userMods, userFuncs] = collectDeclarations(src);
  const out = [];
  let last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(src)) !== null) {
    if (m.index > last) out.push(escHtml(src.slice(last, m.index)));
    let cls = null;
    if (m[1]) cls = 'hl-com';
    else if (m[2]) cls = 'hl-str';
    else if (m[3]) cls = 'hl-num';
    else if (m[4]) cls = identClass(m[4], userMods, userFuncs);
    else if (m[5]) cls = 'hl-op';
    const text = escHtml(m[0]);
    out.push(cls ? '<span class="' + cls + '">' + text + '</span>' : text);
    last = m.index + m[0].length;
  }
  if (last < src.length) out.push(escHtml(src.slice(last)));
  return out.join('');
}

let hlPending = false;
function updateGutter() {
  const ed = $('editor');
  const src = ed.value;

  const lines = src.split('\n').length;
  const g = $('gutter');
  if (g.childElementCount !== lines) {
    let html = '';
    for (let i = 1; i <= lines; i++) html += '<span>' + i + '</span>';
    g.innerHTML = html;
  }

  if (!hlPending) {
    hlPending = true;
    requestAnimationFrame(() => {
      hlPending = false;
      const t = $('editor').value;
      // Zeilenumbruch am Ende, damit die letzte Zeile dieselbe Höhe behält
      $('hl-code').innerHTML =
        (t.length > 400000 ? escHtml(t) : highlightScad(t)) + '\n';
      syncScroll();
    });
  }
  syncScroll();
}

function syncScroll() {
  const ed = $('editor');
  $('gutter').scrollTop = ed.scrollTop;
  const h = $('highlight');
  h.scrollTop = ed.scrollTop;
  h.scrollLeft = ed.scrollLeft;
}

function logLine(text, cls) {
  const c = $('console');
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function markErrorLine(line) {
  const ed = $('editor');
  const lines = ed.value.split('\n');
  if (!line || line < 1 || line > lines.length) return;
  let pos = 0;
  for (let i = 0; i < line - 1; i++) pos += lines[i].length + 1;
  ed.focus();
  ed.setSelectionRange(pos, pos + lines[line - 1].length);
}

function render(fitView) {
  const src = $('editor').value;
  $('console').innerHTML = '';
  for (const m of pendingLog) logLine(m.text, m.cls);
  pendingLog = [];
  $('status').textContent = 'rechnet …';
  $('btn-render').disabled = true;

  // kurz warten, damit der Statuswechsel sichtbar wird
  setTimeout(() => {
    const t0 = performance.now();
    try {
      const res = compileScad(src);
      currentSolid = res.solid;
      currentRegions = res.regions;
      currentKernelId = res.kernel;
      for (const l of res.log) logLine(l.text, l.kind === 'warn' ? 'warn' : 'echo');

      vp.setGeometry(res.solid, {
        regions: res.regions,
        background: res.background,
        highlight: res.highlight
      });
      if (fitView || !vp.dist) vp.fit();
      vp.requestDraw();

      const tris = res.solid.triangles().length;
      const ms = Math.round(performance.now() - t0);
      const parts = [];
      if (tris) parts.push(`${tris.toLocaleString('de-DE')} Dreiecke`);
      if (res.regions.length) {
        const flaeche = res.regions.reduce((a, r) => a + r.area(), 0);
        parts.push(`${res.regions.length} Fläche${res.regions.length > 1 ? 'n' : ''}, ${fmt(flaeche)} mm²`);
      }
      const bb = vp.bbox;
      if (bb) parts.push([0, 1, 2].map(i => fmt(bb.hi[i] - bb.lo[i])).join(' × ') + ' mm');
      parts.push(ms + ' ms', KERNEL.label, 'Raster ' + fmt(vp.gridStep) + ' mm');
      $('status').textContent = parts.join(' · ');

      if (!tris && !res.regions.length) {
        logLine('Nichts erzeugt. Prüfe, ob die oberste Ebene Geometrie liefert.', 'warn');
      }
    } catch (e) {
      const line = e.line || 0;
      $('status').textContent = 'Fehler';
      logLine(line ? `Zeile ${line}: ${e.message}` : e.message, 'error');
      if (line) markErrorLine(line);
    } finally {
      $('btn-render').disabled = false;
    }
  }, 10);
}

function fmt(x) {
  const v = Math.round(x * 100) / 100;
  return String(v).replace('.', ',');
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function saveSTL() {
  if (!currentSolid.polygons.length) {
    logLine(currentRegions.length
      ? 'STL braucht einen Körper. Die Fläche mit linear_extrude() oder '
        + 'rotate_extrude() in die dritte Dimension bringen.'
      : 'Nichts zu exportieren: das Modell ist leer.', 'warn');
    return;
  }
  if (currentRegions.length) {
    logLine(`${currentRegions.length} Fläche(n) ohne Extrusion werden nicht exportiert.`, 'warn');
  }
  const t0 = performance.now();
  // Der BSP-Baum lässt T-Stöße stehen, Manifold nicht.
  const fixed = currentKernelId === 'bsp' ? currentSolid.repair() : currentSolid;
  // Der BSP-Weg verschweißt bei 1e-4, Manifold liefert exakte
  // Indizes — dort würde die grobe Toleranz echte Nachbarn
  // fälschlich zusammenlegen.
  const q = fixed.openEdges(currentKernelId === 'bsp' ? 1e-4 : 1e-7);
  const tris = fixed.triangles().length;
  const buf = toBinarySTL(fixed, 'OpenSCAD-JS');
  download(new Blob([buf], { type: 'model/stl' }), fileName.replace(/\.scad$/i, '') + '.stl');

  const ms = Math.round(performance.now() - t0);
  logLine(`STL geschrieben: ${tris.toLocaleString('de-DE')} Dreiecke, ${ms} ms.`, 'ok');
  if (q.holes === 0 && q.touching === 0) {
    logLine('Netz ist geschlossen — jede Kante hat genau zwei Nachbarflächen.', 'ok');
  } else {
    if (q.holes) {
      logLine(`Achtung: ${q.holes} Kanten ohne Gegenstück von ${q.edges}. Der Slicer muss reparieren.`, 'warn');
    }
    if (q.touching) {
      logLine(`Hinweis: ${q.touching} Kanten mit mehr als zwei Flächen — dort berühren sich Körper. `
        + 'union() um diese Körper legen, dann wird eine geschlossene Hülle daraus.', 'warn');
    }
  }
}

// Der Manifold-Kern steckt als gepacktes WASM in dieser Datei
// und wird erst beim Umschalten ausgepackt und gestartet.
function switchKernel(e) {
  const want = e.target.value;
  if (want !== 'manifold') {
    setKernel(BSP_KERNEL);
    pendingLog.push({ text: 'Kern: BSP — schnell, näherungsweise, mit Nachbesserung des Netzes.', cls: 'ok' });
    render(false);
    return;
  }
  const sel = $('kernel');
  sel.disabled = true;
  $('status').textContent = 'Manifold wird geladen …';
  loadManifoldKernel().then(k => {
    setKernel(k);
    pendingLog.push({
      text: 'Kern: Manifold — robuster, liefert dichte Netze ohne Nachbesserung '
        + 'und kennt echte Gehrungs- und Fasenecken bei offset(delta=).',
      cls: 'ok'
    });
    sel.disabled = false;
    render(false);
  }).catch(err => {
    sel.value = 'bsp';
    sel.disabled = false;
    setKernel(BSP_KERNEL);
    pendingLog.push({ text: 'Manifold ließ sich nicht starten: ' + err.message, cls: 'error' });
    render(false);
  });
}

// Bilder werden im Browser über ein Canvas gelesen —
// ein eigener PNG-Dekoder wäre unnötiger Ballast.
const HEIGHTMAP_MAX = 256;

function imageToRows(file, cb) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, HEIGHTMAP_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(2, Math.round(img.naturalWidth * scale));
    const h = Math.max(2, Math.round(img.naturalHeight * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    g.drawImage(img, 0, 0, w, h);
    const px = g.getImageData(0, 0, w, h).data;
    const rows = [];
    for (let y = 0; y < h; y++) {
      const row = [];
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        row.push((px[i] + px[i + 1] + px[i + 2]) / 3 / 255 * 100);
      }
      rows.push(row);
    }
    URL.revokeObjectURL(url);
    cb(null, rows, w + ' × ' + h + ' Punkte');
  };
  img.onerror = () => { URL.revokeObjectURL(url); cb(new Error('Bild ließ sich nicht lesen.')); };
  img.src = url;
}

function loadDataFile(f, done) {
  const ext = (f.name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
  const ok = (msg) => { pendingLog.push({ text: msg, cls: 'ok' }); done(); };
  const bad = (msg) => { pendingLog.push({ text: `${f.name}: ${msg}`, cls: 'error' }); done(); };

  if (['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'].includes(ext)) {
    imageToRows(f, (err, rows, info) => {
      if (err) return bad(err.message);
      registerData(f.name, { kind: 'heightmap', name: f.name, rows });
      ok(`Höhenraster "${f.name}" geladen (${info}, Höhe 0 bis 100). `
        + `Im Quelltext: surface(file = "${f.name}")`);
    });
    return;
  }

  const rd = new FileReader();
  rd.onerror = () => bad('Datei ließ sich nicht lesen.');

  if (ext === 'stl') {
    rd.onload = () => {
      try {
        const solid = parseSTL(rd.result);
        registerData(f.name, { kind: 'stl', name: f.name, solid });
        const q = solid.openEdges();
        ok(`STL "${f.name}" geladen: ${solid.triangles().length.toLocaleString('de-DE')} Dreiecke`
          + (q.holes ? `, ${q.holes} Kanten ohne Gegenstück` : ', geschlossen')
          + `. Im Quelltext: import("${f.name}")`);
      } catch (err) { bad(err.message); }
    };
    rd.readAsArrayBuffer(f);
    return;
  }

  rd.onload = () => {
    const text = rd.result;
    if (ext === 'dxf') {
      registerData(f.name, { kind: 'dxf', name: f.name, text });
      ok(`DXF "${f.name}" geladen. Im Quelltext: import("${f.name}")`);
      return;
    }
    try {
      const rows = parseHeightmapText(text);
      registerData(f.name, { kind: 'heightmap', name: f.name, rows });
      ok(`Höhenraster "${f.name}" geladen (${rows[0].length} × ${rows.length} Punkte). `
        + `Im Quelltext: surface(file = "${f.name}")`);
    } catch (err) { bad(err.message); }
  };
  rd.readAsText(f);
}

function saveDXF() {
  if (!currentRegions.length) {
    logLine(currentSolid.polygons.length
      ? 'DXF braucht eine 2D-Fläche. projection() legt den Grundriss des Körpers '
        + 'in die Ebene z = 0, projection(cut = true) den Schnitt dort.'
      : 'Nichts zu exportieren: das Modell ist leer.', 'warn');
    return;
  }
  const t0 = performance.now();
  const d = toDXF(currentRegions);
  download(new Blob([d.text], { type: 'application/dxf' }),
    fileName.replace(/\.scad$/i, '') + '.dxf');

  const ms = Math.round(performance.now() - t0);
  logLine(`DXF geschrieben: ${d.rings} geschlossene Polylinie${d.rings === 1 ? '' : 'n'}, ${ms} ms.`, 'ok');
  if (d.open) {
    logLine(`${d.open} Kantenzug${d.open === 1 ? '' : 'züge'} ließ sich nicht schließen und fehlt in der Datei.`, 'warn');
  }
  if (currentSolid.polygons.length) {
    logLine('Die Körper im Modell sind nicht enthalten — DXF ist ein 2D-Format.', 'warn');
  }
}

function saveScad() {
  download(new Blob([$('editor').value], { type: 'text/plain' }), fileName);
}

document.addEventListener('DOMContentLoaded', initUI);

function initSplitter() {
  const sp = $('splitter');
  const left = $('left');
  let dragging = false;
  sp.addEventListener('pointerdown', (e) => {
    dragging = true;
    sp.setPointerCapture(e.pointerId);
  });
  sp.addEventListener('pointerup', () => { dragging = false; });
  sp.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const w = Math.max(220, Math.min(window.innerWidth - 280, e.clientX));
    left.style.width = w + 'px';
    vp.requestDraw();
  });
}
