      pushQuad(polys, at(e.a, t0), at(e.b, t0), at(e.b, t1), at(e.a, t1), shared);
    }
  }

  const cells = region.convexCells();
  for (const cell of cells) {
    pushFace(polys, cell.map(p => at(p, 0)).reverse(), shared);
    if (Math.abs(scaleV[0]) > 1e-9 && Math.abs(scaleV[1]) > 1e-9) {
      pushFace(polys, cell.map(p => at(p, 1)), shared);
    }
  }
  return new Solid(polys);
}

function rotateExtrude(region, angleDeg, fn, fa, fs, shared) {
  if (!region.edges.length) return new Solid([]);
  const b = region.bounds();
  if (b.lo[0] < -1e-6) {
    throw new ScadError('rotate_extrude(): alle Punkte der Fläche müssen x >= 0 haben', 0);
  }
  const full = Math.abs(angleDeg) >= 360 - 1e-9;
  const span = full ? 360 : angleDeg;
  const nFull = fragments(Math.max(Math.abs(b.hi[0]), 1e-6), fn, fa, fs);
  const n = full ? nFull : Math.max(2, Math.ceil(nFull * Math.abs(span) / 360));

  const at = (p, th) => [p[0] * Math.cos(th), p[0] * Math.sin(th), p[1]];
  const polys = [];

  for (let i = 0; i < n; i++) {
    const th0 = span * DEG * i / n;
    const th1 = span * DEG * (i + 1) / n;
    for (const e of region.edges) {
      pushQuad(polys, at(e.a, th0), at(e.a, th1), at(e.b, th1), at(e.b, th0), shared);
    }
  }

  if (!full) {
    const cells = region.convexCells();
    const thEnd = span * DEG;
    for (const cell of cells) {
      pushFace(polys, cell.map(p => at(p, 0)), shared);
      pushFace(polys, cell.map(p => at(p, thEnd)).reverse(), shared);
    }
  }
  return new Solid(polys);
}

// projection(cut = true): Schnitt des Körpers mit der Ebene z = 0
function projectionCut(solid) {
  const edges = [];
  for (const p of solid.polygons) {
    const nrm = p.plane.normal;
    if (Math.abs(nrm[2]) > 1 - 1e-9) continue;

    const pts = [];
    const vs = p.vertices;
    for (let i = 0; i < vs.length; i++) {
      const a = vs[i], b = vs[(i + 1) % vs.length];
      if (Math.abs(a[2]) < 1e-9) pts.push([a[0], a[1]]);
      else if ((a[2] < 0) !== (b[2] < 0)) {
        const t = a[2] / (a[2] - b[2]);
        pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
    }
    if (pts.length < 2) continue;

    // zwei am weitesten auseinanderliegende Punkte nehmen
    let best = 0, bi = 0, bj = 1;
    for (let i = 0; i < pts.length; i++)
      for (let j = i + 1; j < pts.length; j++) {
        const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
        if (d > best) { best = d; bi = i; bj = j; }
      }
    if (best < 1e-9) continue;

    let a = pts[bi], b = pts[bj];
    // so drehen, dass die äußere 2D-Normale zur Flächennormale passt
    const dx = b[0] - a[0], dy = b[1] - a[1];
    if (dy * nrm[0] - dx * nrm[1] < 0) { const t = a; a = b; b = t; }
    const e = makeEdge(a.slice(), b.slice());
    if (e) edges.push(e);
  }
  return new Region2D(edges);
}

//  Konvexe Hülle
// ============================================================

// Monotone Chain: sortieren, dann untere und obere Kette laufen.
function hull2D(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const uniq = [];
  for (const q of p) {
    const last = uniq[uniq.length - 1];
    if (!last || Math.abs(last[0] - q[0]) > 1e-12 || Math.abs(last[1] - q[1]) > 1e-12) uniq.push(q);
  }
  if (uniq.length < 3) return [];

  const cross = (o, a, b) =>
    (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

  const lower = [];
  for (const q of uniq) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  }
  const upper = [];
  for (let i = uniq.length - 1; i >= 0; i--) {
    const q = uniq[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  lower.pop();
  upper.pop();
  const ring = lower.concat(upper);
  return ring.length >= 3 ? ring : [];
}

// Inkrementelle Hülle: Startsimplex, dann Punkt für Punkt die
// sichtbaren Flächen entfernen und über den Horizont neu aufspannen.
function hull3D(points) {
  // gleiche Punkte zusammenfassen
  const map = new Map();
  const pts = [];
  for (const v of points) {
    const k = Math.round(v[0] * 1e7) + ',' + Math.round(v[1] * 1e7) + ',' + Math.round(v[2] * 1e7);
    if (map.has(k)) continue;
    map.set(k, true);
    pts.push([v[0], v[1], v[2]]);
  }
  if (pts.length < 4) return null;
  if (pts.length > 40000) throw new ScadError('hull(): zu viele Punkte (> 40000)', 0);

  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (const v of pts)
    for (let i = 0; i < 3; i++) {
      if (v[i] < lo[i]) lo[i] = v[i];
      if (v[i] > hi[i]) hi[i] = v[i];
    }
  const scale = Math.max(V.len(V.sub(hi, lo)), 1e-9);
  const eps = scale * 1e-9;

  // Startsimplex suchen
  let i0 = 0, i1 = -1;
  for (let i = 1; i < pts.length; i++) {
    if (V.len(V.sub(pts[i], pts[i0])) > eps) { i1 = i; break; }
  }
  if (i1 < 0) return null;

  let i2 = -1, bestA = eps * scale;
  for (let i = 0; i < pts.length; i++) {
    const a = V.len(V.cross(V.sub(pts[i1], pts[i0]), V.sub(pts[i], pts[i0])));
    if (a > bestA) { bestA = a; i2 = i; }
  }
  if (i2 < 0) return null;

  const nrm = V.norm(V.cross(V.sub(pts[i1], pts[i0]), V.sub(pts[i2], pts[i0])));
  let i3 = -1, bestD = eps * scale;
  for (let i = 0; i < pts.length; i++) {
    const d = Math.abs(V.dot(nrm, V.sub(pts[i], pts[i0])));
    if (d > bestD) { bestD = d; i3 = i; }
  }
  if (i3 < 0) return null;   // alle Punkte in einer Ebene

  const faces = [];
  const addFace = (a, b, c, inside) => {
    const n = V.cross(V.sub(pts[b], pts[a]), V.sub(pts[c], pts[a]));
    const L = V.len(n);
    if (L < eps * eps) return;
    const nn = V.mul(n, 1 / L);
    if (V.dot(nn, V.sub(pts[inside], pts[a])) > 0) {
      faces.push({ v: [a, c, b], n: V.mul(nn, -1), w: -V.dot(nn, pts[a]) });
    } else {
      faces.push({ v: [a, b, c], n: nn, w: V.dot(nn, pts[a]) });
    }
  };

  const centroid4 = [i0, i1, i2, i3];
  const inner = [0, 1, 2].map(k =>
    centroid4.reduce((s, idx) => s + pts[idx][k], 0) / 4);
  pts.push(inner);
  const innerIdx = pts.length - 1;

  addFace(i0, i1, i2, innerIdx);
  addFace(i0, i1, i3, innerIdx);
  addFace(i0, i2, i3, innerIdx);
  addFace(i1, i2, i3, innerIdx);

  const used = new Set(centroid4);
  for (let pi = 0; pi < pts.length - 1; pi++) {
    if (used.has(pi)) continue;
    const p = pts[pi];

    const visible = [];
    for (let f = 0; f < faces.length; f++) {
      if (V.dot(faces[f].n, p) - faces[f].w > eps) visible.push(f);
    }
    if (!visible.length) continue;

    // Horizont: Kanten, die nur zu einer sichtbaren Fläche gehören
    const vis = new Set(visible);
    const edgeCount = new Map();
    for (const f of visible) {
      const v = faces[f].v;
      for (let k = 0; k < 3; k++) {
        const a = v[k], b = v[(k + 1) % 3];
        const key = a < b ? a + ':' + b : b + ':' + a;
        const rec = edgeCount.get(key);
        if (rec) rec.n++;
        else edgeCount.set(key, { n: 1, a, b });
      }
    }
    const keep = [];
    for (let f = 0; f < faces.length; f++) if (!vis.has(f)) keep.push(faces[f]);

    for (const rec of edgeCount.values()) {
      if (rec.n !== 1) continue;
      const n = V.cross(V.sub(pts[rec.b], pts[rec.a]), V.sub(p, pts[rec.a]));
      const L = V.len(n);
      if (L < eps * eps) continue;
      const nn = V.mul(n, 1 / L);
      keep.push({ v: [rec.a, rec.b, pi], n: nn, w: V.dot(nn, pts[rec.a]) });
    }

    faces.length = 0;
    for (const f of keep) faces.push(f);
    used.add(pi);
  }

  const shared = { color: null };
  const polys = [];
  for (const f of faces) {
    polys.push(new Polygon(f.v.map(i => pts[i].slice()), shared));
  }
  return new Solid(polys);
}

// ============================================================
//  projection(cut = false)
//  Der Schattenriss eines geschlossenen Körpers ist die
//  Vereinigung der Grundrisse aller nach oben zeigenden Flächen.
//  Die nach unten zeigenden liefern dieselbe Menge, also reicht
//  eine Hälfte.
// ============================================================
function projectionFull(solid) {
  const parts = [];
  for (const p of solid.polygons) {
    if (p.plane.normal[2] <= 1e-9) continue;
    const r = Region2D.fromContour(p.vertices.map(v => [v[0], v[1]]));
    if (r.edges.length >= 3) parts.push(r);
  }
  return Region2D.unionAll(parts);
}
// ============================================================
//  Schrift
//  Eingebaut ist eine Strichschrift: jede Glyphe besteht aus
//  Polygonzügen, die beim Satz auf Strichstärke aufgedickt
//  werden. Das kostet ein paar Kilobyte statt ein paar hundert
//  und reicht für Beschriftungen auf Bauteilen.
//  Raster: Grundlinie 0, x-Höhe 8, Versalhöhe 12, Unterlänge -4.
// ============================================================
function fontArc(cx, cy, rx, ry, a0, a1, steps) {
  const n = steps || Math.max(4, Math.ceil(Math.abs(a1 - a0) / 22));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    out.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return out;
}

const STROKE_FONT_ASCENT = 12;
const STROKE_FONT_WIDTH = 1.35;   // Strichstärke im Raster der Schrift

// Unbekannte Zeichen als leeres Kästchen, damit man sie sieht
const STROKE_FALLBACK = { adv: 10, strokes: [[[1, 0], [7, 0], [7, 11], [1, 11], [1, 0]]] };

// ------------------------------------------------------------
//  Polygonzüge auf Strichstärke aufdicken
// ------------------------------------------------------------
function strokesToRegion(strokes, width, segs) {
  const r = width / 2;
  const stamps = [];
  const disc = [];
  for (let i = 0; i < segs; i++) {
    const a = 2 * Math.PI * i / segs;
    disc.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  const seen = new Set();
  const addDisc = (p) => {
    const k = Math.round(p[0] * 1e4) + ',' + Math.round(p[1] * 1e4);
    if (seen.has(k)) return;
    seen.add(k);
    stamps.push(Region2D.fromContour(disc.map(d => [d[0] + p[0], d[1] + p[1]])));
  };

  for (const pl of strokes) {
    for (let i = 0; i < pl.length; i++) {
      addDisc(pl[i]);
      if (i + 1 >= pl.length) break;
      const a = pl[i], b = pl[i + 1];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const L = Math.hypot(dx, dy);
      if (L < 1e-9) continue;
      const nx = dy / L * r, ny = -dx / L * r;
      stamps.push(Region2D.fromContour([
        [a[0] + nx, a[1] + ny], [b[0] + nx, b[1] + ny],
        [b[0] - nx, b[1] - ny], [a[0] - nx, a[1] - ny]
      ]));
    }
  }
  return Region2D.unionAll(stamps);
}

// ------------------------------------------------------------
//  Nachgeladene TrueType-Schriften
// ------------------------------------------------------------
const FONT_REGISTRY = new Map();

function registerFont(name, font) { FONT_REGISTRY.set(name.toLowerCase(), font); }
function lookupFont(spec) {
  if (!spec) return null;
  const name = String(spec).split(':')[0].trim().toLowerCase();
  if (!name || name === 'strich' || name === 'stroke' || name === 'werkbank') return null;
  return FONT_REGISTRY.get(name) || null;
}

// ------------------------------------------------------------
//  Textsatz
//  Der Satz läuft getrennt vom Aufdicken: die Maße stehen damit
//  fest, bevor eine einzige Vereinigung gerechnet wurde. Deshalb
//  ist textmetrics() billig, auch wenn text() es nicht ist.
// ------------------------------------------------------------
function textLayout(str, o) {
  const size = o.size > 0 ? o.size : 10;
  const spacing = o.spacing > 0 ? o.spacing : 1;
  const ttf = lookupFont(o.font);
  const chars = Array.from(String(str));

  const lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
  const track = (x, y) => {
    if (x < lo[0]) lo[0] = x;
    if (y < lo[1]) lo[1] = y;
    if (x > hi[0]) hi[0] = x;
    if (y > hi[1]) hi[1] = y;
  };

  const pieces = [];
  let pen = 0;
  let ascent, descent;

  if (ttf) {
    const scale = size / (ttf.ascender || ttf.unitsPerEm);
    const steps = Math.max(2, Math.min(24, Math.round(fragments(size / 2, o.fn, o.fa, o.fs) / 6)));
    ascent = ttf.ascender * scale;
    descent = -ttf.descender * scale;
    for (const ch of chars) {
      const gid = ttf.glyphIndex(ch.codePointAt(0));
      const cs = ttf.contours(gid, steps);
      if (cs.length) {
        const pts = [];
        const paths = [];
        for (const c of cs) {
          const idx = [];
          for (const p of c) {
            const x = p[0] * scale + pen, y = p[1] * scale;
            track(x, y);
            idx.push(pts.length);
            pts.push([x, y]);
          }
          paths.push(idx);
        }
        pieces.push({ kind: 'poly', pts, paths });
      }
      pen += ttf.advance(gid) * scale * spacing;
    }
  } else {
    const scale = size / STROKE_FONT_ASCENT;
    const segs = Math.max(6, Math.min(24, fragments(STROKE_FONT_WIDTH / 2 * size / 4, o.fn, o.fa, o.fs)));
    const half = STROKE_FONT_WIDTH * scale / 2;
    ascent = size;
    descent = 4 * scale;
    for (const ch of chars) {
      const gl = STROKE_FONT[ch] || (ch === '\t' ? STROKE_FONT[' '] : STROKE_FALLBACK);
      if (gl.strokes.length) {
        const moved = gl.strokes.map(pl => pl.map(p => {
          const x = p[0] * scale + pen, y = p[1] * scale;
          track(x - half, y - half);
          track(x + half, y + half);
          return [x, y];
        }));
        pieces.push({ kind: 'stroke', strokes: moved, width: STROKE_FONT_WIDTH * scale, segs });
      }
      pen += gl.adv * scale * spacing;
    }
  }

  const empty = !(lo[0] < Infinity);
  const bbox = empty ? { lo: [0, 0], hi: [0, 0] } : { lo, hi };

  let dx = 0, dy = 0;
  if (o.halign === 'center') dx = -pen / 2;
  else if (o.halign === 'right') dx = -pen;
  if (o.valign === 'center') dy = -size / 2;
  else if (o.valign === 'top') dy = -size;
  else if (o.valign === 'bottom') dy = descent;

  return { pieces, pen, bbox, offset: [dx, dy], ascent, descent, empty, font: ttf, size };
}

function textRegion(str, o) {
  const L = textLayout(str, o);
  const parts = L.pieces.map(p => p.kind === 'poly'
    ? prim2Polygon(p.pts, p.paths)
    : strokesToRegion(p.strokes, p.width, p.segs));
  let region = Region2D.unionAll(parts);
  if (!region.edges.length) return region;
  const [dx, dy] = L.offset;
  if (dx || dy) region = region.transform(M.translate([dx, dy, 0]));
  return region;
}

// textmetrics() — Maße des gesetzten Textes
function textMetrics(str, o) {
  const L = textLayout(str, o);
  const [dx, dy] = L.offset;
  const w = L.empty ? 0 : L.bbox.hi[0] - L.bbox.lo[0];
  const h = L.empty ? 0 : L.bbox.hi[1] - L.bbox.lo[1];
  return new ScadObject({
    position: [L.bbox.lo[0] + dx, L.bbox.lo[1] + dy],
    size: [w, h],
    ascent: L.empty ? 0 : L.bbox.hi[1] + dy,
    descent: L.empty ? 0 : -(L.bbox.lo[1] + dy),
    offset: [dx, dy],
    advance: [L.pen, 0]
  });
}

// fontmetrics() — Kennwerte der Schrift, unabhängig vom Text
function fontMetrics(o) {
  const size = o.size > 0 ? o.size : 10;
  const ttf = lookupFont(o.font);
  if (ttf) {
    const scale = size / (ttf.ascender || ttf.unitsPerEm);
    return new ScadObject({
      nominal: new ScadObject({
        ascent: ttf.ascender * scale,
        descent: -ttf.descender * scale
      }),
      max: new ScadObject({
        ascent: ttf.yMax * scale,
        descent: -ttf.yMin * scale
      }),
      interline: (ttf.ascender - ttf.descender + (ttf.lineGap || 0)) * scale,
      font: new ScadObject({ family: ttf.family, style: ttf.style })
    });
  }
  const scale = size / STROKE_FONT_ASCENT;
  return new ScadObject({
    nominal: new ScadObject({ ascent: 12 * scale, descent: 4 * scale }),
    max: new ScadObject({ ascent: 16 * scale, descent: 4.5 * scale }),
    interline: 20 * scale,
    font: new ScadObject({ family: 'Werkbank Strich', style: 'Regular' })
  });
}
// ============================================================
//  Interpreter
// ============================================================
class Scope {
  constructor(parent) {
    this.vars = new Map();
    this.mods = new Map();
    this.funcs = new Map();
    this.parent = parent || null;
  }
  getVar(n) {
    for (let s = this; s; s = s.parent) if (s.vars.has(n)) return s.vars.get(n);
    return undefined;
  }
  hasVar(n) {
    for (let s = this; s; s = s.parent) if (s.vars.has(n)) return true;
    return false;
  }
  getMod(n) {
    for (let s = this; s; s = s.parent) if (s.mods.has(n)) return s.mods.get(n);
    return null;
  }
  getFunc(n) {
    for (let s = this; s; s = s.parent) if (s.funcs.has(n)) return s.funcs.get(n);
    return null;
  }
}

class Range {
  constructor(start, step, end) { this.start = start; this.step = step; this.end = end; }
  toArray() {
    const out = [];
    if (this.step === 0 || !isFinite(this.step)) return out;
    if (this.step > 0) {
      for (let v = this.start; v <= this.end + 1e-12; v += this.step) out.push(v);
    } else {
      for (let v = this.start; v >= this.end - 1e-12; v += this.step) out.push(v);
    }
    if (out.length > 1000000) throw new ScadError('Range zu groß (> 1 Mio. Schritte)', 0);
    return out;
  }
}

// Wert mit benannten Feldern. Bisher kannte die Sprache nur
// Zahlen, Zeichenketten und Listen; textmetrics() und
// fontmetrics() geben ein solches Objekt zurück, und der
// Zugriff darauf läuft über denselben Punkt wie v.x bei Vektoren.
class ScadObject {
  constructor(fields) { Object.assign(this, fields); }
}

const NAMED_COLORS = {
  red: [1, 0, 0], green: [0, .5, 0], blue: [0, 0, 1], yellow: [1, 1, 0],
  cyan: [0, 1, 1], magenta: [1, 0, 1], white: [1, 1, 1], black: [0, 0, 0],
  gray: [.5, .5, .5], grey: [.5, .5, .5], orange: [1, .65, 0], purple: [.5, 0, .5],
  pink: [1, .75, .8], brown: [.65, .16, .16], lime: [0, 1, 0], silver: [.75, .75, .75],
  gold: [1, .84, 0], steelblue: [.27, .51, .71], teal: [0, .5, .5]

// Funktionen mit benannten Argumenten oder Zugriff auf den
// Interpreterzustand — sie stehen nicht in BUILTIN_FUNCS,
// sollen im Editor aber genauso eingefärbt werden.
const SPECIAL_FUNCS = new Set([
  'echo', 'assert', 'parent_module', 'dxf_cross', 'dxf_dim',
  'textmetrics', 'fontmetrics'
]);

const DEG = Math.PI / 180;
const num = (x) => (typeof x === 'number' && isFinite(x)) ? x : 0;
const isVec = Array.isArray;

// ------------------------------------------------------------
//  Builtin-Funktionen
// ------------------------------------------------------------
const BUILTIN_FUNCS = {
  sin: (a) => Math.sin(num(a[0]) * DEG),
  cos: (a) => Math.cos(num(a[0]) * DEG),
  tan: (a) => Math.tan(num(a[0]) * DEG),
  asin: (a) => Math.asin(num(a[0])) / DEG,
  acos: (a) => Math.acos(num(a[0])) / DEG,
  atan: (a) => Math.atan(num(a[0])) / DEG,
  atan2: (a) => Math.atan2(num(a[0]), num(a[1])) / DEG,
  abs: (a) => Math.abs(num(a[0])),
  sign: (a) => Math.sign(num(a[0])),
  ceil: (a) => Math.ceil(num(a[0])),
  floor: (a) => Math.floor(num(a[0])),
  round: (a) => Math.round(num(a[0])),
  sqrt: (a) => Math.sqrt(num(a[0])),
  exp: (a) => Math.exp(num(a[0])),
  ln: (a) => Math.log(num(a[0])),
  log: (a) => Math.log10(num(a[0])),
  pow: (a) => Math.pow(num(a[0]), num(a[1])),
  min(a) {
    const v = (a.length === 1 && isVec(a[0])) ? a[0] : a;
    return Math.min(...v.map(num));
  },
  max(a) {
    const v = (a.length === 1 && isVec(a[0])) ? a[0] : a;
    return Math.max(...v.map(num));
  },
  norm: (a) => Math.sqrt((a[0] || []).reduce((s, x) => s + num(x) * num(x), 0)),
  cross: (a) => V.cross(a[0], a[1]),
  len(a) {
    const x = a[0];
    if (typeof x === 'string') return x.length;
    if (isVec(x)) return x.length;
    return undefined;
  },
  concat(a) {
    const out = [];
    for (const x of a) isVec(x) ? out.push(...x) : out.push(x);
    return out;
  },
  str: (a) => a.map(valueToString).join(''),
  chr: (a) => (isVec(a[0]) ? a[0] : a).map(c => String.fromCharCode(num(c))).join(''),
  ord: (a) => typeof a[0] === 'string' && a[0].length ? a[0].charCodeAt(0) : undefined,
  is_undef: (a) => a[0] === undefined,
  is_num: (a) => typeof a[0] === 'number',
  is_bool: (a) => typeof a[0] === 'boolean',
  is_string: (a) => typeof a[0] === 'string',
  is_list: (a) => isVec(a[0]),
  rands(a) {
    const [lo, hi, cnt] = [num(a[0]), num(a[1]), Math.max(0, Math.floor(num(a[2])))];
    const out = [];
    for (let i = 0; i < cnt; i++) out.push(lo + Math.random() * (hi - lo));
    return out;
  },
  // search(needle, haystack, treffer = 1)
  // Zeichen in Zeichenkette oder Werte in Liste suchen.
  search(a) {

    const limit = a[2] === undefined ? 1 : Math.max(0, Math.floor(num(a[2])));
    if (hay === undefined) return [];

    const cell = (row) => (isVec(row) ? row[0] : row);
    const hits = (val) => {
      const found = [];
      if (typeof hay === 'string') {
        for (let i = 0; i < hay.length; i++) {
          if (hay[i] === val && (limit === 0 || found.length < limit)) found.push(i);
        }
      } else if (isVec(hay)) {
        for (let i = 0; i < hay.length; i++) {
          if (deepEq(cell(hay[i]), val) && (limit === 0 || found.length < limit)) found.push(i);
        }
      }
      return found;
    };

    const list = typeof needle === 'string' ? Array.from(needle)
               : isVec(needle) ? needle : [needle];
    const single = !isVec(needle) && typeof needle !== 'string';
    const out = list.map(v => {
      const f = hits(v);
      return limit === 1 ? (f.length ? f[0] : undefined) : f;
    });
    if (single) return limit === 1 ? (out[0] === undefined ? [] : [out[0]]) : out[0];
    return limit === 1 ? out.filter(v => v !== undefined) : out;
  },
  version: () => [2021, 1, 0],
  version_num: () => 20210100
};

function valueToString(v) {
  if (v === undefined) return 'undef';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') {
    if (!isFinite(v)) return v > 0 ? 'inf' : (v < 0 ? '-inf' : 'nan');
    return String(Math.abs(v) < 1e-12 ? 0 : parseFloat(v.toPrecision(12)));
  }
  if (typeof v === 'string') return v;
  if (v instanceof Range) return `[${v.start}:${v.step}:${v.end}]`;
  if (v instanceof ScadObject) {
    return '[' + Object.keys(v).map(k => `${k} = ${valueToString(v[k])}`).join(', ') + ']';
  }
  if (isVec(v)) return '[' + v.map(valueToString).join(', ') + ']';
  return String(v);
}

// ------------------------------------------------------------
//  Ausdrucksauswertung
// ------------------------------------------------------------
class Interpreter {
  constructor(opts = {}) {
    this.log = [];
    this.dyn = { $fn: 0, $fa: 12, $fs: 2, $t: 0, $preview: true, ...(opts.dyn || {}) };
    this.childStack = [];
    this.moduleStack = [];
    this.rootSolid = null;
    this.background = [];
    this.highlight = [];
    this.opCount = 0;
    this.maxOps = opts.maxOps || 2000000;
    this.callDepth = 0;
  }

  tick(line) {
    if (++this.opCount > this.maxOps) {
      throw new ScadError('Abbruch: zu viele Operationen (Endlosschleife?)', line || 0);
    }
  }

  lookup(name, scope, line) {
    if (name[0] === '$') {
      if (scope.hasVar(name)) return scope.getVar(name);
      return this.dyn[name];
    }
    if (scope.hasVar(name)) return scope.getVar(name);
    return undefined;
  }

  evalExpr(e, scope) {
    this.tick(e.line);
    switch (e.type) {
      case 'Num': return e.v;
      case 'Str': return e.v;
      case 'Bool': return e.v;
      case 'Undef': return undefined;
      case 'Ident': return this.lookup(e.name, scope, e.line);

      case 'Vector': {
        const out = [];
        for (const it of e.items) this.evalCompElement(it, scope, out);
        return out;
      }

      case 'Range': {
        const s = num(this.evalExpr(e.start, scope));
        const en = num(this.evalExpr(e.end, scope));
        const st = e.step === null ? 1 : num(this.evalExpr(e.step, scope));
        return new Range(s, st, en);
      }

      case 'Un': {
        const v = this.evalExpr(e.e, scope);
        if (e.op === '-') return isVec(v) ? v.map(x => -num(x)) : -num(v);
        if (e.op === '+') return v;
        return !truthy(v);
      }

      case 'Bin': return this.evalBin(e, scope);

      case 'Ternary':
        return truthy(this.evalExpr(e.cond, scope))
          ? this.evalExpr(e.then, scope)
          : this.evalExpr(e.else, scope);

      case 'Index': {
        const o = this.evalExpr(e.obj, scope);
        let i = this.evalExpr(e.idx, scope);
        if (o instanceof Range) return undefined;
        if (typeof o === 'string') return o[Math.floor(num(i))];
        if (!isVec(o)) return undefined;
        i = Math.floor(num(i));
        return (i >= 0 && i < o.length) ? o[i] : undefined;
      }

      case 'Member': {
        const o = this.evalExpr(e.obj, scope);
        if (o instanceof ScadObject) return o[e.name];
        const k = { x: 0, y: 1, z: 2 }[e.name];
        return (isVec(o) && k !== undefined) ? o[k] : undefined;
      }

      case 'Let': {
        const s = new Scope(scope);
        for (const a of e.assigns) s.vars.set(a.name, this.evalExpr(a.expr, s));
        return this.evalExpr(e.body, s);
      }

      case 'Call': return this.callFunction(e, scope);

      default:
        throw new ScadError(`Unbekannter Ausdruckstyp ${e.type}`, e.line);
    }
  }

  evalBin(e, scope) {
    const op = e.op;
    if (op === '&&') return truthy(this.evalExpr(e.l, scope)) && truthy(this.evalExpr(e.r, scope));
    if (op === '||') return truthy(this.evalExpr(e.l, scope)) || truthy(this.evalExpr(e.r, scope));

    const a = this.evalExpr(e.l, scope);
    const b = this.evalExpr(e.r, scope);

    switch (op) {
      case '+':
        if (isVec(a) && isVec(b)) return a.map((x, i) => addAny(x, b[i]));
        return num(a) + num(b);
      case '-':
        if (isVec(a) && isVec(b)) return a.map((x, i) => num(x) - num(b[i]));
        return num(a) - num(b);
      case '*': return mulAny(a, b);
      case '/':
        if (isVec(a) && !isVec(b)) return a.map(x => num(x) / num(b));
        return num(a) / num(b);
      case '%': return num(a) % num(b);
      case '^': return Math.pow(num(a), num(b));
      case '==': return deepEq(a, b);
      case '!=': return !deepEq(a, b);
      case '<': return cmp(a, b) < 0;
      case '<=': return cmp(a, b) <= 0;
      case '>': return cmp(a, b) > 0;
      case '>=': return cmp(a, b) >= 0;
    }
    throw new ScadError(`Unbekannter Operator ${op}`, e.line);
  }

  evalCompElement(e, scope, out) {
    this.tick(e.line);
    switch (e.type) {
      case 'CompFor': {
        this.iterate(e.assigns, scope, (s) => this.evalCompElement(e.body, s, out));
        return;
      }
      case 'CompIf': {
        if (truthy(this.evalExpr(e.cond, scope))) this.evalCompElement(e.then, scope, out);
        else if (e.else) this.evalCompElement(e.else, scope, out);
        return;
      }
      case 'CompEach': {
        const tmp = [];
        this.evalCompElement(e.expr, scope, tmp);
        for (const v of tmp) {
          if (isVec(v)) out.push(...v);
          else if (v instanceof Range) out.push(...v.toArray());
          else out.push(v);

        return;
      }
      case 'CompLet': {
        const s = new Scope(scope);
        for (const a of e.assigns) s.vars.set(a.name, this.evalExpr(a.expr, s));
        this.evalCompElement(e.body, s, out);
        return;
      }
      default:
        out.push(this.evalExpr(e, scope));
    }

  // for-Schleifen über mehrere Variablen (kartesisches Produkt)
  iterate(assigns, scope, fn) {
    const lists = assigns.map(a => {
      const v = this.evalExpr(a.expr, scope);
      if (v instanceof Range) return v.toArray();
      if (isVec(v)) return v;
      if (typeof v === 'string') return v.split('');
      return v === undefined ? [] : [v];
    });
    const rec = (k, s) => {
      if (k === assigns.length) { fn(s); return; }
      for (const val of lists[k]) {

        s2.vars.set(assigns[k].name, val);
        rec(k + 1, s2);

    if (name === 'echo') {
      const vals = e.args.map(a => (a.name ? a.name + ' = ' : '') + valueToString(this.evalExpr(a.expr, scope)));
      this.log.push({ kind: 'echo', text: 'ECHO: ' + vals.join(', '), line: e.line });
      return undefined;
    }
    if (name === 'assert') {
      const ok = truthy(this.evalExpr(e.args[0].expr, scope));
      if (!ok) {
        const msg = e.args[1] ? valueToString(this.evalExpr(e.args[1].expr, scope)) : '';
        throw new ScadError('assert fehlgeschlagen ' + msg, e.line);
      }
      return undefined;
    }

    if (name === 'parent_module') {
      const n = Math.floor(num(this.evalExpr(e.args[0].expr, scope)));
      // 0 ist das Modul, das das aktuelle aufgerufen hat
      const idx = this.moduleStack.length - 2 - n;
      return idx >= 0 ? this.moduleStack[idx] : undefined;
    }
    if (name === 'dxf_cross' || name === 'dxf_dim') {
      return this.dxfFunction(name, e, scope);
    }
    if (name === 'textmetrics' || name === 'fontmetrics') {
      const a = this.namedArgs(e, scope, name === 'textmetrics'
        ? ['text', 'size', 'font', 'halign', 'valign', 'spacing', 'direction', 'language', 'script']
        : ['size', 'font']);
      const opts = {
        size: a.size === undefined ? 10 : num(a.size),
        font: a.font,
        halign: a.halign, valign: a.valign,
        spacing: a.spacing === undefined ? 1 : num(a.spacing),
        fn: this.dyn.$fn || 0, fa: this.dyn.$fa || 12, fs: this.dyn.$fs || 2
      };
      if (name === 'fontmetrics') return fontMetrics(opts);
      return textMetrics(a.text === undefined ? '' : valueToString(a.text), opts);
    }

    const def = scope.getFunc(name);
    if (def) {
      if (++this.callDepth > 300) {
        this.callDepth--;
        throw new ScadError(`Rekursion zu tief in function ${name}()`, e.line);
      }
      const s = this.bindArgs(def.params, e.args, scope, def.scope);
      const r = this.evalExpr(def.expr, s);
      this.callDepth--;
      return r;
    }

    const bf = BUILTIN_FUNCS[name];
    if (bf) {
      const pos = e.args.filter(a => !a.name).map(a => this.evalExpr(a.expr, scope));
      return bf(pos);
    }

    throw new ScadError(`Unbekannte Funktion "${name}()"`, e.line);
  }

  // Stellungs- und Namensargumente in ein Objekt einsammeln
  namedArgs(e, scope, order) {
    const a = {};
    const pos = e.args.filter(x => !x.name);
    order.forEach((k, i) => { if (i < pos.length) a[k] = this.evalExpr(pos[i].expr, scope); });
    for (const x of e.args) if (x.name) a[x.name] = this.evalExpr(x.expr, scope);
    return a;
  }

  // dxf_cross(file, layer, origin, scale)
  // dxf_dim(file, name, layer, origin, scale)
  dxfFunction(name, e, scope) {

      ? ['file', 'layer', 'origin', 'scale']
      : ['file', 'name', 'layer', 'origin', 'scale']);

    const entry = lookupData(a.file);
    if (!entry) {
      const have = dataNames();
      throw new ScadError(
        `${name}(): "${a.file === undefined ? '' : a.file}" ist nicht geladen. `
        + 'Oben über "Daten laden" hinzufügen'
        + (have.length ? `. Verfügbar: ${have.join(', ')}` : '.'), e.line);
    }
    if (entry.kind !== 'dxf') {
      throw new ScadError(`${name}(): "${entry.name}" ist keine DXF-Datei.`, e.line);
    }
    const origin = isVec(a.origin) ? [num(a.origin[0]), num(a.origin[1])] : [0, 0];
    const scale = a.scale === undefined ? 1 : num(a.scale);
    const layer = a.layer === undefined ? null : String(a.layer);
    try {
      return name === 'dxf_cross'
        ? dxfCross(entry.text, layer, origin, scale)
        : dxfDim(entry.text, a.name === undefined ? null : String(a.name), layer, origin, scale);
    } catch (err) {
      throw new ScadError(`${name}(): ${err.message}`, e.line);
    }
  }

  bindArgs(params, args, callerScope, defScope) {
    const s = new Scope(defScope || callerScope);
    const pos = args.filter(a => !a.name);
    const named = args.filter(a => a.name);

    params.forEach((p, i) => {
      if (i < pos.length) s.vars.set(p.name, this.evalExpr(pos[i].expr, callerScope));
      else if (p.def !== null) s.vars.set(p.name, this.evalExpr(p.def, s));
      else s.vars.set(p.name, undefined);
    });
    for (const a of named) {
      if (a.name[0] === '$') continue;
      s.vars.set(a.name, this.evalExpr(a.expr, callerScope));
    }
    return s;
  }
}

function truthy(v) {
  if (v === undefined || v === false) return false;
  if (v === true) return true;
  if (typeof v === 'number') return v !== 0;
  if (typeof v === 'string') return v.length > 0;
  if (isVec(v)) return v.length > 0;
  return true;
}
function addAny(a, b) {
  if (isVec(a) && isVec(b)) return a.map((x, i) => addAny(x, b[i]));
  return num(a) + num(b);
}
function mulAny(a, b) {
  const va = isVec(a), vb = isVec(b);
  if (!va && !vb) return num(a) * num(b);
  if (va && !vb) return a.map(x => mulAny(x, b));
  if (!va && vb) return b.map(x => mulAny(a, x));
  // Vektor * Vektor = Skalarprodukt
  if (!isVec(a[0]) && !isVec(b[0])) {
    let s = 0;
    for (let i = 0; i < Math.min(a.length, b.length); i++) s += num(a[i]) * num(b[i]);
    return s;
  }
  return undefined;
}
function deepEq(a, b) {
  if (isVec(a) && isVec(b)) return a.length === b.length && a.every((x, i) => deepEq(x, b[i]));
  return a === b;
}
function cmp(a, b) {
  if (typeof a === 'string' && typeof b === 'string') return a < b ? -1 : a > b ? 1 : 0;
  return num(a) - num(b);
}
// ============================================================
//  minkowski()
//  Für konvexe Teile ist die Summe die Hülle aller Punktsummen.
//  Für alles andere: beide Seiten in konvexe Zellen zerlegen,
//  jede Paarung einzeln rechnen und am Ende vereinigen.
// ============================================================
const MINKOWSKI_MAX_PAIRS = 500;
const MINKOWSKI_MAX_POINTS = 120000;

function cellVertices(faces) {
  const seen = new Set();
  const out = [];
  for (const f of faces) {
    for (const v of f) {
      const k = Math.round(v[0] * 1e6) + ',' + Math.round(v[1] * 1e6) + ',' + Math.round(v[2] * 1e6);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(v);
    }
  }
  return out;
}

function minkowski3D(a, b, line) {
  if (!a.polygons.length || !b.polygons.length) return new Solid([]);
  const cellsA = a.convexCells();
  const cellsB = b.convexCells();
  if (!cellsA.length || !cellsB.length) return new Solid([]);

  if (cellsA.length * cellsB.length > MINKOWSKI_MAX_PAIRS) {
    throw new ScadError(
      `minkowski(): ${cellsA.length} × ${cellsB.length} konvexe Teile sind zu viel. `
      + 'Einfachere Formen verwenden oder das zweite Argument konvex halten.', line);
  }

  const parts = [];
  for (const fa of cellsA) {
    const pa = cellVertices(fa);
    for (const fb of cellsB) {
      const pb = cellVertices(fb);
      if (pa.length * pb.length > MINKOWSKI_MAX_POINTS) {
        throw new ScadError('minkowski(): zu viele Punktpaare — Auflösung senken', line);
      }
      const pts = [];
      for (const x of pa) {
        for (const y of pb) pts.push([x[0] + y[0], x[1] + y[1], x[2] + y[2]]);
      }
      const h = hull3D(pts);
      if (h) parts.push(h);
    }
  }
  return Solid.unionAll(parts);
}

function minkowski2D(a, b, line) {
  if (!a.edges.length || !b.edges.length) return new Region2D([]);
  const cellsA = a.convexCells();
  const cellsB = b.convexCells();
  if (!cellsA.length || !cellsB.length) return new Region2D([]);

  if (cellsA.length * cellsB.length > MINKOWSKI_MAX_PAIRS) {
    throw new ScadError(
      `minkowski(): ${cellsA.length} × ${cellsB.length} konvexe Teile sind zu viel.`, line);
  }

  const parts = [];
  for (const pa of cellsA) {
    for (const pb of cellsB) {
      if (pa.length * pb.length > MINKOWSKI_MAX_POINTS) {
        throw new ScadError('minkowski(): zu viele Punktpaare — Auflösung senken', line);
      }
      const pts = [];
      for (const x of pa) {
        for (const y of pb) pts.push([x[0] + y[0], x[1] + y[1]]);
      }
      const ring = hull2D(pts);
      if (ring.length >= 3) parts.push(Region2D.fromContour(ring));
    }
  }
  return Region2D.unionAll(parts);
}
// ============================================================
//  Nachgeladene Daten für import() und surface()
//  Im Browser gibt es kein Dateisystem, deshalb werden Dateien
//  einmal geladen und unter ihrem Namen abgelegt.
// ============================================================
const DATA_REGISTRY = new Map();

function registerData(name, entry) {
  DATA_REGISTRY.set(String(name).toLowerCase(), entry);
}
function lookupData(name) {
  if (!name) return null;
  const key = String(name).trim().toLowerCase();
  return DATA_REGISTRY.get(key)
      || DATA_REGISTRY.get(key.replace(/^.*[\\/]/, ''))
      || null;
}
function dataNames() {
  return Array.from(DATA_REGISTRY.values()).map(e => e.name);
}

// ------------------------------------------------------------
//  STL
// ------------------------------------------------------------
function parseSTL(buffer) {
  const shared = { color: null };

  if (buffer.byteLength >= 84) {
    const dv = new DataView(buffer);
    const n = dv.getUint32(80, true);
    if (84 + n * 50 === buffer.byteLength) {
      const polys = [];
      let o = 84;
      for (let i = 0; i < n; i++) {
        o += 12;
        const v = [];
        for (let k = 0; k < 3; k++) {
          v.push([dv.getFloat32(o, true), dv.getFloat32(o + 4, true), dv.getFloat32(o + 8, true)]);
          o += 12;
        }
        o += 2;
        pushFace(polys, v, shared);
      }
      return new Solid(polys);
    }
  }

  const text = new TextDecoder('utf-8', { fatal: false }).decode(buffer);
  if (!/^\s*solid/i.test(text)) {
    throw new Error('Weder binäres noch ASCII-STL erkannt.');
  }
  const polys = [];
  const re = /vertex\s+(-?[\d.eE+-]+)\s+(-?[\d.eE+-]+)\s+(-?[\d.eE+-]+)/g;
  let m, buf = [];
  while ((m = re.exec(text)) !== null) {
    buf.push([parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3])]);
    if (buf.length === 3) { pushFace(polys, buf, shared); buf = []; }
  }
  if (!polys.length) throw new Error('STL enthält keine Dreiecke.');
  return new Solid(polys);
}

// ------------------------------------------------------------
//  DXF — nur so viel, wie für Umrisse gebraucht wird
// ------------------------------------------------------------
function parseDXFPairs(text) {
  const lines = text.split(/\r\n|\r|\n/);
  const out = [];
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const code = parseInt(lines[i].trim(), 10);
    if (isNaN(code)) continue;
    out.push([code, lines[i + 1]]);
  }
  return out;
}

// Objekte eines DXF als Liste — dxf_cross() und dxf_dim()
// brauchen die Rohgruppen, nicht die fertigen Umrisse.
function dxfEntityList(text) {
  const pairs = parseDXFPairs(text);
  let i = 0;
  while (i < pairs.length && !(pairs[i][0] === 2 && pairs[i][1].trim() === 'ENTITIES')) i++;
  const out = [];
  while (i < pairs.length) {
    if (pairs[i][0] !== 0) { i++; continue; }
    const type = pairs[i][1].trim();
    if (type === 'ENDSEC' || type === 'EOF') break;
    const g = [];
    let j = i + 1;
    while (j < pairs.length && pairs[j][0] !== 0) { g.push(pairs[j]); j++; }
    out.push({
      type,
      get: (c) => { const p = g.find(x => x[0] === c); return p ? p[1].trim() : null; },
      num: function (c, d) { const v = this.get(c); return v === null ? d : parseFloat(v); }
    });
    i = j;
  }
  return out;
}

// dxf_cross(): Schnittpunkt zweier sich kreuzender Linien.
// In der Praxis legt man dafür ein Kreuz auf eine eigene Ebene
// und liest daraus den Nullpunkt der Zeichnung.
function dxfCross(text, layer, origin, scale) {
  const lines = [];
  for (const e of dxfEntityList(text)) {
    if (e.type !== 'LINE') continue;
    if (layer && e.get(8) !== layer) continue;
    lines.push([[e.num(10, 0), e.num(20, 0)], [e.num(11, 0), e.num(21, 0)]]);
  }
  if (lines.length < 2) {
    throw new Error(layer
      ? `Ebene "${layer}" enthält weniger als zwei Linien.`
      : 'Die Datei enthält weniger als zwei Linien.');
  }
  for (let i = 0; i < lines.length; i++) {
    for (let j = i + 1; j < lines.length; j++) {
      const [p, p2] = lines[i], [q, q2] = lines[j];
      const r = [p2[0] - p[0], p2[1] - p[1]];
      const s2 = [q2[0] - q[0], q2[1] - q[1]];
      const den = r[0] * s2[1] - r[1] * s2[0];
      if (Math.abs(den) < 1e-12) continue;
      const t = ((q[0] - p[0]) * s2[1] - (q[1] - p[1]) * s2[0]) / den;
      const x = p[0] + r[0] * t, y = p[1] + r[1] * t;
      return [(x - origin[0]) * scale, (y - origin[1]) * scale];
    }
  }
  throw new Error('Keine zwei sich kreuzenden Linien gefunden.');
}

// dxf_dim(): das Maß einer Bemaßung.
// Gruppe 42 trägt den gemessenen Wert; fehlt sie, wird er aus
// den Definitionspunkten gerechnet.
function dxfDim(text, name, layer, origin, scale) {
  const dims = [];
  for (const e of dxfEntityList(text)) {
    if (e.type !== 'DIMENSION') continue;
    if (layer && e.get(8) !== layer) continue;
    if (name && e.get(2) !== name && e.get(1) !== name) continue;
    dims.push(e);
  }
  if (!dims.length) {
    throw new Error(name
      ? `Keine Bemaßung mit dem Namen "${name}" gefunden.`
      : 'Die Datei enthält keine Bemaßung.');
  }
  const e = dims[0];
  const measured = e.get(42);
  if (measured !== null) return parseFloat(measured) * scale;

  const kind = (parseInt(e.get(70) || '0', 10) & 7);
  const p13 = [e.num(13, 0), e.num(23, 0)];
  const p14 = [e.num(14, 0), e.num(24, 0)];
  const p10 = [e.num(10, 0), e.num(20, 0)];
  const p15 = [e.num(15, 0), e.num(25, 0)];

  if (kind === 3 || kind === 4) {
    const r = Math.hypot(p15[0] - p10[0], p15[1] - p10[1]);
    return (kind === 3 ? 2 * r : r) * scale;
  }
  if (kind === 0) {
    const a = e.num(50, 0) * Math.PI / 180;
    const dx = p14[0] - p13[0], dy = p14[1] - p13[1];
    return Math.abs(dx * Math.cos(a) + dy * Math.sin(a)) * scale;
  }
  return Math.hypot(p14[0] - p13[0], p14[1] - p13[1]) * scale;
}

// fill(): Löcher schließen, also nur die äußeren Ringe behalten.
function fillRegion(region) {
  const { contours } = region.toContours();
  if (contours.length < 2) return region.clone();
  const outer = [];
  for (let i = 0; i < contours.length; i++) {
    let depth = 0;
    const probe = contours[i][0];
    for (let j = 0; j < contours.length; j++) {
      if (i !== j && pointInContour(probe, contours[j])) depth++;
    }
    if (depth % 2 === 0) outer.push(Region2D.fromContour(contours[i]));
  }
  return outer.length ? Region2D.unionAll(outer) : region.clone();
}

function parseDXF(text, fn, fa, fs, layer) {
  const pairs = parseDXFPairs(text);
  const wanted = layer ? String(layer) : null;
  const closedRings = [];
  const segments = [];

  let i = 0;
  // bis zum Abschnitt ENTITIES vorspulen
  while (i < pairs.length && !(pairs[i][0] === 2 && pairs[i][1].trim() === 'ENTITIES')) i++;

  const arcPoints = (cx, cy, r, a0, a1) => {
    const total = fragments(r, fn, fa, fs);
    const sweep = ((a1 - a0) % 360 + 360) % 360 || 360;
    const n = Math.max(2, Math.ceil(total * sweep / 360));
    const pts = [];
    for (let k = 0; k <= n; k++) {
      const a = (a0 + sweep * k / n) * Math.PI / 180;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return pts;
  };

  while (i < pairs.length) {
    const [code, raw] = pairs[i];
    if (code !== 0) { i++; continue; }
    const type = raw.trim();
    if (type === 'ENDSEC' || type === 'EOF') break;

    // Alle Gruppen dieses Objekts einsammeln
    const g = [];
    let j = i + 1;
    while (j < pairs.length && pairs[j][0] !== 0) { g.push(pairs[j]); j++; }
    const first = (c) => { const p = g.find(x => x[0] === c); return p ? p[1].trim() : null; };
    const numOf = (c, d) => { const v = first(c); return v === null ? d : parseFloat(v); };
    const onLayer = () => { const l = first(8); return !wanted || l === wanted; };

    if (type === 'LINE' && onLayer()) {
      segments.push([[numOf(10, 0), numOf(20, 0)], [numOf(11, 0), numOf(21, 0)]]);
      i = j;
    } else if (type === 'LWPOLYLINE' && onLayer()) {
      const xs = g.filter(x => x[0] === 10).map(x => parseFloat(x[1]));
      const ys = g.filter(x => x[0] === 20).map(x => parseFloat(x[1]));
      const pts = [];
      for (let k = 0; k < Math.min(xs.length, ys.length); k++) pts.push([xs[k], ys[k]]);
      const closed = (parseInt(first(70) || '0', 10) & 1) === 1;
      if (closed && pts.length >= 3) closedRings.push(pts);
      else for (let k = 0; k + 1 < pts.length; k++) segments.push([pts[k], pts[k + 1]]);
      i = j;
    } else if (type === 'POLYLINE' && onLayer()) {
      const closed = (parseInt(first(70) || '0', 10) & 1) === 1;
      const pts = [];
      let k = j;
      while (k < pairs.length) {
        if (pairs[k][0] !== 0) { k++; continue; }
        const t2 = pairs[k][1].trim();
        if (t2 === 'VERTEX') {
          let x = 0, y = 0, m = k + 1;
          while (m < pairs.length && pairs[m][0] !== 0) {
            if (pairs[m][0] === 10) x = parseFloat(pairs[m][1]);
            if (pairs[m][0] === 20) y = parseFloat(pairs[m][1]);
            m++;
          }
          pts.push([x, y]);
          k = m;
        } else break;
      }
      // SEQEND überspringen
      if (k < pairs.length && pairs[k][1].trim() === 'SEQEND') {
        k++;
        while (k < pairs.length && pairs[k][0] !== 0) k++;
      }
      if (closed && pts.length >= 3) closedRings.push(pts);
      else for (let q = 0; q + 1 < pts.length; q++) segments.push([pts[q], pts[q + 1]]);
      i = k;
    } else if (type === 'CIRCLE' && onLayer()) {
      closedRings.push(arcPoints(numOf(10, 0), numOf(20, 0), numOf(40, 1), 0, 360).slice(0, -1));
      i = j;
    } else if (type === 'ARC' && onLayer()) {
      const pts = arcPoints(numOf(10, 0), numOf(20, 0), numOf(40, 1), numOf(50, 0), numOf(51, 360));
      for (let k = 0; k + 1 < pts.length; k++) segments.push([pts[k], pts[k + 1]]);
      i = j;
    } else {
      i = j;
    }
  }

  // Lose Strecken zu Ringen verketten (Richtung egal)
  const tol = 1e-6;
  const key = (p) => Math.round(p[0] / tol) + ',' + Math.round(p[1] / tol);
  const at = new Map();
  segments.forEach((s, idx) => {
    for (const p of s) {
      const k = key(p);
      let a = at.get(k);
      if (!a) { a = []; at.set(k, a); }
      a.push(idx);
    }
  });
  const used = new Array(segments.length).fill(false);
  let openCount = 0;

  for (let s = 0; s < segments.length; s++) {
    if (used[s]) continue;
    used[s] = true;
    const ring = [segments[s][0], segments[s][1]];
    for (;;) {
      const endK = key(ring[ring.length - 1]);
      const cand = (at.get(endK) || []).filter(x => !used[x]);
      if (!cand.length) break;
      const seg = segments[cand[0]];
      used[cand[0]] = true;
      ring.push(key(seg[0]) === endK ? seg[1] : seg[0]);
      if (key(ring[ring.length - 1]) === key(ring[0])) { ring.pop(); break; }
    }
    if (ring.length >= 3 && key(ring[ring.length - 1]) !== key(ring[0])) {
      // nicht geschlossen — trotzdem übernehmen, aber melden
      openCount++;
    }
    if (ring.length >= 3) closedRings.push(ring);
  }

  const pts = [];
  const paths = [];
  for (const ring of closedRings) {
    const idx = [];
    for (const p of ring) { idx.push(pts.length); pts.push([p[0], p[1]]); }
    paths.push(idx);
  }
  const region = paths.length ? prim2Polygon(pts, paths) : new Region2D([]);
  return { region, rings: paths.length, open: openCount };
}

// ------------------------------------------------------------
//  Höhenraster für surface()
// ------------------------------------------------------------
function parseHeightmapText(text) {
  const rows = [];
  for (const line of text.split(/\r\n|\r|\n/)) {
    const clean = line.split('#')[0].trim();
    if (!clean) continue;
    const vals = clean.split(/[\s,;]+/).map(parseFloat).filter(v => !isNaN(v));
    if (vals.length) rows.push(vals);
  }
  if (!rows.length) throw new Error('Keine Zahlen gefunden.');
  const w = Math.max(...rows.map(r => r.length));
  for (const r of rows) while (r.length < w) r.push(r[r.length - 1] || 0);
  return rows;
}

// Die erste Zeile der Datei liegt bei größtem y — wie in OpenSCAD.
function surfaceSolid(rows, center, invert, shared) {
  const ny = rows.length, nx = rows[0].length;
  if (ny < 2 || nx < 2) throw new Error('Höhenraster braucht mindestens 2 × 2 Werte.');

  const z = (x, y) => {
    const v = rows[ny - 1 - y][x];
    return invert ? -v : v;
  };
  let zmin = Infinity;
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) zmin = Math.min(zmin, z(x, y));
  const base = zmin - 1;

  const ox = center ? -(nx - 1) / 2 : 0;
  const oy = center ? -(ny - 1) / 2 : 0;
  const P = (x, y) => [x + ox, y + oy, z(x, y)];
  const B = (x, y) => [x + ox, y + oy, base];

  const polys = [];
  for (let y = 0; y + 1 < ny; y++) {
    for (let x = 0; x + 1 < nx; x++) {
      pushQuad(polys, P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1), shared);
    }
  }
  // Boden
  pushFace(polys, [B(0, 0), B(0, ny - 1), B(nx - 1, ny - 1), B(nx - 1, 0)], shared);
  // Seitenwände
  for (let x = 0; x + 1 < nx; x++) {
    pushFace(polys, [B(x, 0), B(x + 1, 0), P(x + 1, 0), P(x, 0)], shared);
    pushFace(polys, [B(x + 1, ny - 1), B(x, ny - 1), P(x, ny - 1), P(x + 1, ny - 1)], shared);
  }
  for (let y = 0; y + 1 < ny; y++) {
    pushFace(polys, [B(0, y + 1), B(0, y), P(0, y), P(0, y + 1)], shared);
    pushFace(polys, [B(nx - 1, y), B(nx - 1, y + 1), P(nx - 1, y + 1), P(nx - 1, y)], shared);
  }
  return new Solid(polys);
}
// ============================================================
//  Ausführung von Anweisungen -> Geometrie
// ============================================================
const TRANSFORM_MODULES = new Set([
  'translate', 'rotate', 'scale', 'mirror', 'multmatrix', 'resize'
]);
// Für die Einfärbung im Editor: alles, was execBuiltin behandelt.
const BUILTIN_MODULES = new Set([
  'cube', 'sphere', 'cylinder', 'polyhedron',
  'square', 'circle', 'polygon', 'offset', 'text',
  'linear_extrude', 'rotate_extrude', 'projection',
  'translate', 'rotate', 'scale', 'mirror', 'multmatrix', 'resize',
  'union', 'difference', 'intersection', 'group', 'render', 'hull', 'minkowski',
  'import', 'import_stl', 'import_dxf', 'surface', 'fill', 'assign',
  'dxf_linear_extrude', 'dxf_rotate_extrude',
  'color', 'echo', 'assert', 'children', 'child'
]);
// Bleibt leer: der Sprachumfang ist abgedeckt. Neue Lücken
// tragen sich hier ein und werden im Editor unterstrichen.
const NOT_IMPLEMENTED = {};

Object.assign(Interpreter.prototype, {

  run(ast) {
    const root = new Scope(null);
    const items = this.execBlock(ast, root);
    const list = this.rootItems ? this.rootItems : items;
    const [solids, regions] = splitItems(list);
    return { solid: new Solid(solids.flatMap(s => s.polygons)), regions };
  },

  execBlock(block, scope) {
    // 1. Definitionen hochziehen
    for (const st of block.stmts) {
      if (!st) continue;
      if (st.type === 'ModuleDef') scope.mods.set(st.name, { ...st, scope });
      else if (st.type === 'FunctionDef') scope.funcs.set(st.name, { ...st, scope });
    }
    // 2. Zuweisungen in Quelltextreihenfolge (OpenSCAD-Semantik)
    const dynSave = { ...this.dyn };
    for (const st of block.stmts) {
      if (st && st.type === 'Assign') {
        const v = this.evalExpr(st.expr, scope);
        if (st.name[0] === '$') this.dyn[st.name] = v;
        else scope.vars.set(st.name, v);
      }
    }
    // 3. Instanziierungen
    const out = [];
    for (const st of block.stmts) {
      if (!st) continue;
      if (st.type === 'Assign' || st.type === 'ModuleDef' ||
          st.type === 'FunctionDef' || st.type === 'Include') continue;
      out.push(...this.execStatement(st, scope));
    }
    this.dyn = dynSave;
    return out;
  },

  execStatement(st, scope) {
    this.tick(st.line);
    const mod = st.modifier || '';
    if (mod.includes('*')) return [];

    let result;
    switch (st.type) {
      case 'Block': result = this.execBlock(st, new Scope(scope)); break;
      case 'If':
        result = truthy(this.evalExpr(st.cond, scope))
          ? this.execChild(st.then, scope)
          : (st.else ? this.execChild(st.else, scope) : []);
        break;
      case 'For': {
        result = [];
        this.iterate(st.assigns, scope, (s) => { result.push(...this.execChild(st.body, s)); });
        break;
      }
      case 'IntersectionFor': {
        const runs = [];
        this.iterate(st.assigns, scope, (s) => { runs.push(splitItems(this.execChild(st.body, s))); });
        const S = runs.map(r => r[0]).filter(a => a.length).map(unionSolids);
        const R = runs.map(r => r[1]).filter(a => a.length).map(Region2D.unionAll);
        result = [];
        if (S.length) result.push(S.reduce((a, b) => Solid.intersect(a, b)));
        if (R.length) result.push(R.reduce((a, b) => Region2D.intersect(a, b)));
        break;
      }
      case 'LetStmt': {
        const s = new Scope(scope);
        for (const a of st.assigns) s.vars.set(a.name, this.evalExpr(a.expr, s));
        result = this.execChild(st.body, s);
        break;
      }
      case 'Inst': result = this.execInst(st, scope); break;
      default:
        throw new ScadError(`Unbekannte Anweisung ${st.type}`, st.line);
    }

    if (mod.includes('%')) { this.background.push(...result); return []; }
    if (mod.includes('#')) this.highlight.push(...result.map(s => s.clone()));
    if (mod.includes('!')) this.rootItems = result;
    return result;
  },

  execChild(st, scope) {
    if (!st) return [];
    if (st.type === 'Block') return this.execBlock(st, new Scope(scope));
    return this.execStatement(st, scope);
  },

  execInst(st, scope) {
    const name = st.name;

    // --- benutzerdefiniertes Modul ---
    const def = scope.getMod(name);
    if (def) {
      if (++this.callDepth > 200) {
        this.callDepth--;
        throw new ScadError(`Rekursion zu tief in module ${name}()`, st.line);
      }
      const s = this.bindArgs(def.params, st.args, scope, def.scope);
      const dynSave = { ...this.dyn };
      for (const a of st.args) {
        if (a.name && a.name[0] === '$') this.dyn[a.name] = this.evalExpr(a.expr, scope);
      }
      this.childStack.push({ ast: st.children, scope });
      this.moduleStack.push(name);
      s.vars.set('$children', countChildren(st.children));
      this.dyn.$parent_modules = this.moduleStack.length;
      let out;
      try {
        out = this.execChild(def.body, s);
      } finally {
        this.moduleStack.pop();
        this.childStack.pop();
        this.dyn = dynSave;
        this.callDepth--;
      }
      return out;
    }

    // --- children() ---
    if (name === 'children' || name === 'child') {
      const frame = this.childStack[this.childStack.length - 1];
      if (!frame) return [];
      const kids = childList(frame.ast);
      if (!st.args.length) return kids.flatMap(k => this.execStatement(k, frame.scope));
      const sel = this.evalExpr(st.args[0].expr, scope);
      const idxs = sel instanceof Range ? sel.toArray() : (isVec(sel) ? sel : [sel]);
      return idxs.flatMap(i => {
        const k = kids[Math.floor(num(i))];
        return k ? this.execStatement(k, frame.scope) : [];
      });
    }

    // --- $-Argumente wirken auf den ganzen Teilbaum ---
    const dynSave = { ...this.dyn };
    for (const a of st.args) {
      if (a.name && a.name[0] === '$') this.dyn[a.name] = this.evalExpr(a.expr, scope);
    }
    try {
      return this.execBuiltin(st, scope, name);
    } finally {
      this.dyn = dynSave;
    }
  },

  args(st, scope, names) {
    const out = {};
    const pos = st.args.filter(a => !a.name);
    names.forEach((n, i) => {
      if (i < pos.length) out[n] = this.evalExpr(pos[i].expr, scope);
    });
    for (const a of st.args) {
      if (a.name && a.name[0] !== '$') out[a.name] = this.evalExpr(a.expr, scope);
    }
    return out;
  },

  execBuiltin(st, scope, name) {
    const A = (names) => this.args(st, scope, names);
    const kids = () => this.execChild(st.children, scope);
    const F = [this.dyn.$fn || 0, this.dyn.$fa || 12, this.dyn.$fs || 2];
    const shared = { color: null };

    switch (name) {

      // ---------- Primitive ----------
      case 'cube': {
        const a = A(['size', 'center']);
        let s = a.size === undefined ? 1 : a.size;
        const size = isVec(s) ? [num(s[0]), num(s[1]), num(s[2])] : [num(s), num(s), num(s)];
        return [primCube(size, truthy(a.center), shared)];
      }
      case 'sphere': {
        const a = A(['r']);
        const r = a.d !== undefined ? num(a.d) / 2 : (a.r === undefined ? 1 : num(a.r));
        return [primSphere(r, ...F, shared)];
      }
      case 'cylinder': {
        const a = A(['h', 'r1', 'r2', 'center']);
        const h = a.h === undefined ? 1 : num(a.h);
        let r1, r2;
        if (a.d !== undefined) { r1 = r2 = num(a.d) / 2; }
        else if (a.r !== undefined) { r1 = r2 = num(a.r); }
        else { r1 = 1; r2 = 1; }
        if (a.d1 !== undefined) r1 = num(a.d1) / 2;
        if (a.d2 !== undefined) r2 = num(a.d2) / 2;
        if (a.r1 !== undefined) r1 = num(a.r1);
        if (a.r2 !== undefined) r2 = num(a.r2);
        return [primCylinder(h, r1, r2, truthy(a.center), ...F, shared)];
      }
      case 'polyhedron': {
        const a = A(['points', 'faces']);
        const faces = a.faces || a.triangles || [];
        if (!isVec(a.points) || !isVec(faces)) {
          throw new ScadError('polyhedron() braucht points und faces', st.line);
        }
        return [primPolyhedron(a.points.map(p => [num(p[0]), num(p[1]), num(p[2])]), faces, shared)];
      }

      // ---------- 2D-Primitive ----------
      case 'square': {
        const a = A(['size', 'center']);
        const raw = a.size === undefined ? 1 : a.size;
        const size = isVec(raw) ? [num(raw[0]), num(raw[1])] : [num(raw), num(raw)];
        return [prim2Square(size, truthy(a.center))];
      }
      case 'circle': {
        const a = A(['r']);
        const r = a.d !== undefined ? num(a.d) / 2 : (a.r === undefined ? 1 : num(a.r));
        return [prim2Circle(r, ...F)];
      }
      case 'polygon': {
        const a = A(['points', 'paths']);
        if (!isVec(a.points)) throw new ScadError('polygon() braucht points', st.line);
        return [prim2Polygon(a.points, isVec(a.paths) ? a.paths : null)];
      }
      case 'text': {
        const a = A(['text', 'size', 'font']);
        const str = a.text === undefined ? '' : valueToString(a.text);
        if (!str) return [];
        if (a.font && !lookupFont(a.font) && String(a.font).trim()) {
          this.log.push({
            kind: 'warn', line: st.line,
            text: `Zeile ${st.line}: Schrift "${a.font}" ist nicht geladen — `
              + 'die eingebaute Strichschrift wird verwendet.'
          });
        }
        const rg = textRegion(str, {
          size: a.size === undefined ? 10 : num(a.size),
          font: a.font,
          halign: a.halign, valign: a.valign,
          spacing: a.spacing === undefined ? 1 : num(a.spacing),
          fn: F[0], fa: F[1], fs: F[2]
        });
        return rg.edges.length ? [rg] : [];
      }
      case 'fill': {
        const [, regions] = splitItems(kids());
        return regions.map(fillRegion).filter(rg => rg.edges.length);
      }
      case 'offset': {
        const a = A(['r', 'delta', 'chamfer']);
        const r = a.r !== undefined ? num(a.r)
                : a.delta !== undefined ? num(a.delta) : 0;
        if (a.r === undefined && a.delta !== undefined) {
          this.log.push({
            kind: 'warn', line: st.line,
            text: `Zeile ${st.line}: offset(delta=) wird wie offset(r=) mit runden Ecken gerechnet.`
          });
        }
        const [, regions] = splitItems(kids());
        return regions.map(rg => region2Offset(rg, r, ...F));
      }

      // ---------- Extrusion ----------
      case 'linear_extrude': {
        const a = A(['height']);
        const h = a.height === undefined ? 100 : num(a.height);
        const twist = a.twist === undefined ? 0 : num(a.twist);
        const rawS = a.scale === undefined ? 1 : a.scale;
        const sc = isVec(rawS) ? [num(rawS[0]), num(rawS[1])] : [num(rawS), num(rawS)];
        const [, regions] = splitItems(kids());
        return regions.map(rg => {
          let slices;
          if (a.slices !== undefined) {
            slices = Math.max(1, Math.floor(num(a.slices)));
          } else if (twist) {
            const b = rg.bounds();
            const rad = Math.max(Math.hypot(b.lo[0], b.lo[1]), Math.hypot(b.hi[0], b.hi[1]), 1e-6);
            const perTurn = fragments(rad, ...F);
            slices = Math.max(1, Math.ceil(Math.abs(twist) / 360 * perTurn));
          } else {
            slices = 1;
          }
          if (slices > 2000) throw new ScadError('linear_extrude(): zu viele slices', st.line);
          return linearExtrude(rg, h, truthy(a.center), twist, sc, slices, shared);
        });
      }
      case 'rotate_extrude': {
        const a = A(['angle']);
        const ang = a.angle === undefined ? 360 : num(a.angle);
        const [, regions] = splitItems(kids());
        return regions.map(rg => {
          try {
            return rotateExtrude(rg, ang, ...F, shared);
          } catch (err) {
            throw new ScadError(err.message, st.line);
          }
        });
      }
      case 'projection': {
        const a = A(['cut']);
        const [solids] = splitItems(kids());
        if (!solids.length) return [];
        if (truthy(a.cut)) return solids.map(projectionCut);
        const body = unionSolids(solids);
        const n = body.polygons.length;
        if (n > 60000) throw new ScadError('projection(): zu viele Flächen (> 60000)', st.line);
        return [projectionFull(body)];
      }

      // ---------- veraltete Schreibweisen ----------
      case 'assign': {
        // assign() ist in OpenSCAD abgelöst durch let(),
        // die Wirkung ist dieselbe.
        const s2 = new Scope(scope);
        for (const arg of st.args) {
          if (arg.name && arg.name[0] !== '$') s2.vars.set(arg.name, this.evalExpr(arg.expr, scope));
        }
        return this.execChild(st.children, s2);
      }
      case 'dxf_linear_extrude': case 'dxf_rotate_extrude': {
        const a = A(['file', 'layer', 'height']);
        const sub = {
          type: 'Inst', name: 'import', line: st.line, modifier: '',
          args: st.args.filter(x => x.name === 'file' || x.name === 'layer'
            || (!x.name && st.args.indexOf(x) === 0)),
          children: { type: 'Block', stmts: [] }
        };
        const [, regions] = splitItems(this.execInst(sub, scope));
        if (!regions.length) return [];
        if (name === 'dxf_linear_extrude') {
          const h = a.height === undefined ? 100 : num(a.height);
          return regions.map(rg =>
            linearExtrude(rg, h, truthy(a.center), 0, [1, 1], 1, shared));
        }
        return regions.map(rg => rotateExtrude(rg, 360, ...F, shared));
      }

      // ---------- Minkowski-Summe ----------
      case 'minkowski': {
        const [S, R] = splitItems(kids());
        const out = [];
        if (S.length) {
          out.push(S.length === 1 ? S[0]
            : S.slice(1).reduce((acc, x) => minkowski3D(acc, x, st.line), S[0]));
        }
        if (R.length) {
          out.push(R.length === 1 ? R[0]
            : R.slice(1).reduce((acc, x) => minkowski2D(acc, x, st.line), R[0]));
        }
        return out;
      }

      // ---------- Dateien ----------
      case 'import': case 'import_stl': case 'import_dxf': {
        const a = A(['file']);
        const nm = a.file !== undefined ? a.file : a.filename;
        const entry = lookupData(nm);
        if (!entry) {
          const have = dataNames();
          throw new ScadError(
            `import(): "${nm === undefined ? '' : nm}" ist nicht geladen. `
            + 'Oben über "Daten laden" hinzufügen'
            + (have.length ? `. Verfügbar: ${have.join(', ')}` : '.'), st.line);
        }
        if (entry.kind === 'stl') return [entry.solid.clone()];
        if (entry.kind === 'dxf') {
          const layer = a.layer === undefined ? '' : String(a.layer);
          const ck = layer + '|' + F.join(',');
          if (!entry.cache) entry.cache = new Map();
          let res = entry.cache.get(ck);
          if (!res) {
            res = parseDXF(entry.text, ...F, layer);
            entry.cache.set(ck, res);
          }
          if (res.open) {
            this.log.push({
              kind: 'warn', line: st.line,
              text: `Zeile ${st.line}: ${res.open} Kantenzug/Kantenzüge in "${entry.name}" `
                + 'ließen sich nicht schließen.'
            });
          }
          return res.region.edges.length ? [res.region.clone()] : [];
        }
        throw new ScadError(
          `import(): "${entry.name}" ist ein Höhenraster — dafür surface() verwenden.`, st.line);
      }
      case 'surface': {
        const a = A(['file', 'center', 'invert']);
        const entry = lookupData(a.file);
        if (!entry) {
          const have = dataNames();
          throw new ScadError(
            `surface(): "${a.file === undefined ? '' : a.file}" ist nicht geladen. `
            + 'Oben über "Daten laden" hinzufügen'
            + (have.length ? `. Verfügbar: ${have.join(', ')}` : '.'), st.line);
        }
        if (entry.kind !== 'heightmap') {
          throw new ScadError(
            `surface(): "${entry.name}" ist kein Höhenraster. `
            + 'Textdatei mit Zahlen oder Bilddatei laden.', st.line);
        }
        try {
          return [surfaceSolid(entry.rows, truthy(a.center), truthy(a.invert), shared)];
        } catch (err) {
          throw new ScadError('surface(): ' + err.message, st.line);
        }
      }

      // ---------- Konvexe Hülle ----------
      case 'hull': {
        const [S, R] = splitItems(kids());
        try {
          if (S.length) {
            const pts = [];
            for (const sd of S) for (const p of sd.polygons) for (const v of p.vertices) pts.push(v);
            for (const rg of R) for (const e of rg.edges) {
              pts.push([e.a[0], e.a[1], 0]);
              pts.push([e.b[0], e.b[1], 0]);
            }
            const h = hull3D(pts);
            if (!h) {
              this.log.push({
                kind: 'warn', line: st.line,
                text: `Zeile ${st.line}: hull() — die Punkte liegen alle in einer Ebene, kein Körper möglich.`
              });
              return [];
            }
            return [h];
          }
          if (R.length) {
            const pts = [];
            for (const rg of R) for (const e of rg.edges) { pts.push(e.a); pts.push(e.b); }
            const ring = hull2D(pts);
            return ring.length ? [Region2D.fromContour(ring)] : [];
          }
        } catch (err) {
          throw new ScadError(err.message, st.line);
        }
        return [];
      }

      // ---------- Transformationen ----------
      case 'translate': {
        const v = vec3(A(['v']).v, [0, 0, 0]);
        return xf(kids(), M.translate(v));
      }
      case 'scale': {
        const raw = A(['v']).v;
        const v = isVec(raw) ? vec3(raw, [1, 1, 1], 1) : [num(raw), num(raw), num(raw)];
        return xf(kids(), M.scale(v));
      }
      case 'mirror': {
        const v = vec3(A(['v']).v, [1, 0, 0]);
        return xf(kids(), M.mirror(v));
      }
      case 'rotate': {
        const a = A(['a', 'v']);
        let m;
        if (a.v !== undefined && !isVec(a.a)) {
          m = M.rotAxis(vec3(a.v, [0, 0, 1]), num(a.a));
        } else if (isVec(a.a)) {
          const [x, y, z] = vec3(a.a, [0, 0, 0]);
          m = M.mul(M.mul(M.rotZ(z * DEG), M.rotY(y * DEG)), M.rotX(x * DEG));
        } else {
          m = M.rotZ(num(a.a) * DEG);
        }
        return xf(kids(), m);
      }
      case 'multmatrix': {
        const m4 = A(['m']).m;
        const m = M.ident();
        for (let r = 0; r < 3; r++)
          for (let c = 0; c < 4; c++)
            m[r * 4 + c] = num((m4[r] || [])[c]);
        return xf(kids(), m);
      }
      case 'resize': {
        const a = A(['newsize', 'auto']);
        const [ks] = splitItems(kids());
        if (!ks.length) return [];
        const g = unionSolids(ks);
        const b = g.bounds();
        const cur = [b.hi[0] - b.lo[0], b.hi[1] - b.lo[1], b.hi[2] - b.lo[2]];
        const ns = vec3(a.newsize, [0, 0, 0]);
        const f = ns.map((v, i) => (v > 0 && cur[i] > 1e-9) ? v / cur[i] : 1);
        return [g.transform(M.scale(f))];
      }

      // ---------- Boolesche Operationen ----------
      case 'union': case 'group': {
        const [S, R] = splitItems(kids());
        const out = [];
        if (S.length) out.push(unionSolids(S));
        if (R.length) out.push(Region2D.unionAll(R));
        return out;
      }
      case 'difference': {
        const [S, R] = splitItems(kids());
        const out = [];
        // Alle Subtrahenden zuerst zusammenfassen: ein BSP-Durchlauf statt n.
        if (S.length) out.push(S.length === 1 ? S[0] : Solid.subtract(S[0], unionSolids(S.slice(1))));
        if (R.length) out.push(R.length === 1 ? R[0] : Region2D.subtract(R[0], Region2D.unionAll(R.slice(1))));
        return out;
      }
      case 'intersection': {
        const [S, R] = splitItems(kids());
        const out = [];
        if (S.length) out.push(S.reduce((a, b) => Solid.intersect(a, b)));
        if (R.length) out.push(R.reduce((a, b) => Region2D.intersect(a, b)));
        return out;
      }
      case 'render': case 'hull_disabled':
        return kids();

      // ---------- Sonstiges ----------
      case 'color': {
        const a = A(['c', 'alpha']);
        let rgb = [.9, .9, .9], alpha = a.alpha === undefined ? 1 : num(a.alpha);
        if (typeof a.c === 'string') {
          const key = a.c.toLowerCase();
          if (NAMED_COLORS[key]) rgb = NAMED_COLORS[key];
          else if (/^#[0-9a-f]{6}$/i.test(a.c)) {
            rgb = [1, 3, 5].map(i => parseInt(a.c.substr(i, 2), 16) / 255);
          }
        } else if (isVec(a.c)) {
          rgb = [num(a.c[0]), num(a.c[1]), num(a.c[2])];
          if (a.c.length > 3 && a.alpha === undefined) alpha = num(a.c[3]);
        }
        const col = [rgb[0], rgb[1], rgb[2], alpha];
        const ks = kids();
        for (const it of ks) {
          if (it.is2D) { if (!it.color) it.color = col; continue; }
          for (const p of it.polygons) {
            if (!p.shared || p.shared.color === null) p.shared = { color: col };
          }
        }
        return ks;
      }
      case 'echo': {
        const parts = st.args.map(a =>
          (a.name ? a.name + ' = ' : '') + valueToString(this.evalExpr(a.expr, scope)));
        this.log.push({ kind: 'echo', text: 'ECHO: ' + parts.join(', '), line: st.line });
        return kids();
      }
      case 'assert': {
        if (!truthy(this.evalExpr(st.args[0].expr, scope))) {
          throw new ScadError('assert fehlgeschlagen', st.line);
        }
        return kids();
      }
    }

    if (NOT_IMPLEMENTED[name]) {
      throw new ScadError(
        `${NOT_IMPLEMENTED[name]} ist in dieser Stufe noch nicht implementiert`, st.line);
    }
    throw new ScadError(`Unbekanntes Modul "${name}()"`, st.line);
  }
});

function vec3(v, def, fill = 0) {
  if (v === undefined) return def.slice();
  if (!isVec(v)) return [num(v), num(v), num(v)];
  return [
    v.length > 0 ? num(v[0]) : fill,
    v.length > 1 ? num(v[1]) : fill,
    v.length > 2 ? num(v[2]) : fill
  ];
}
function xf(items, m) { return items.map(s => s.transform(m)); }
function splitItems(items) {
  const S = [], R = [];
  for (const it of items) (it.is2D ? R : S).push(it);
  return [S, R];
}
function unionSolids(list) {
  if (!list.length) return new Solid([]);
  if (list.length === 1) return list[0];
  return list.reduce((a, b) => Solid.union(a, b));
}
function childList(ast) {
  if (!ast) return [];
  if (ast.type === 'Block') return ast.stmts.filter(Boolean);
  return [ast];
}
function countChildren(ast) { return childList(ast).length; }

// ============================================================
//  Einstiegspunkt
// ============================================================
function compileScad(src, opts = {}) {
  const t0 = Date.now();
  const ast = parse(src);
  const interp = new Interpreter(opts);
  const { solid, regions } = interp.run(ast);
  return {
    solid,
    regions,
    background: interp.background,
    highlight: interp.highlight,
    log: interp.log,
    ms: Date.now() - t0
  };
}

// ============================================================
//  STL-Export
// ============================================================
function toBinarySTL(solid, name = 'openscad-js') {
  const tris = solid.triangles();
  const buf = new ArrayBuffer(84 + tris.length * 50);
  const dv = new DataView(buf);
  const header = new Uint8Array(buf, 0, 80);
  const txt = ('Generiert mit ' + name).slice(0, 79);
  for (let i = 0; i < txt.length; i++) header[i] = txt.charCodeAt(i);
  dv.setUint32(80, tris.length, true);

  let o = 84;
  for (const t of tris) {
    const n = V.norm(V.cross(V.sub(t.b, t.a), V.sub(t.c, t.a)));
    dv.setFloat32(o, n[0], true); dv.setFloat32(o + 4, n[1], true); dv.setFloat32(o + 8, n[2], true);
    o += 12;
    for (const v of [t.a, t.b, t.c]) {
      dv.setFloat32(o, v[0], true);
      dv.setFloat32(o + 4, v[1], true);
      dv.setFloat32(o + 8, v[2], true);
      o += 12;
    }
    dv.setUint16(o, 0, true);
    o += 2;
  }
  return buf;
}

// ============================================================
//  DXF-Export (R12, damit es überall aufgeht)
// ============================================================
function dxfNum(x) {
  const v = Math.abs(x) < 1e-9 ? 0 : x;
  return v.toFixed(6).replace(/\.?0+$/, '') || '0';
}

function toDXF(regions) {
  const L = [];
  const g = (code, val) => { L.push(String(code)); L.push(String(val)); };
  let rings = 0, open = 0;

  g(0, 'SECTION'); g(2, 'HEADER');
  g(9, '$ACADVER'); g(1, 'AC1009');
  g(0, 'ENDSEC');

  g(0, 'SECTION'); g(2, 'TABLES');
  g(0, 'TABLE'); g(2, 'LAYER'); g(70, 1);
  g(0, 'LAYER'); g(2, '0'); g(70, 0); g(62, 7); g(6, 'CONTINUOUS');
  g(0, 'ENDTAB'); g(0, 'ENDSEC');

  g(0, 'SECTION'); g(2, 'ENTITIES');
  for (const rg of regions) {
    const res = rg.toContours();
    open += res.open;
    for (const c of res.contours) {
      rings++;
      g(0, 'POLYLINE'); g(8, '0'); g(66, 1); g(70, 1);
      g(10, '0'); g(20, '0'); g(30, '0');
      for (const v of c) {
        g(0, 'VERTEX'); g(8, '0');
        g(10, dxfNum(v[0])); g(20, dxfNum(v[1])); g(30, '0');
      }
      g(0, 'SEQEND'); g(8, '0');
    }
  }
  g(0, 'ENDSEC'); g(0, 'EOF');

  return { text: L.join('\r\n') + '\r\n', rings, open };
}

function toAsciiSTL(solid, name = 'openscad_js') {
  const out = [`solid ${name}`];
  for (const t of solid.triangles()) {
    const n = V.norm(V.cross(V.sub(t.b, t.a), V.sub(t.c, t.a)));
    out.push(`  facet normal ${n[0]} ${n[1]} ${n[2]}`);
    out.push('    outer loop');
    for (const v of [t.a, t.b, t.c]) out.push(`      vertex ${v[0]} ${v[1]} ${v[2]}`);
    out.push('    endloop');
    out.push('  endfacet');
  }
  out.push(`endsolid ${name}`);
  return out.join('\n');
}
// ============================================================
//  WebGL2-Renderer
// ============================================================
const VS_SOLID = `#version 300 es
in vec3 aPos;
in vec3 aNormal;
in vec4 aColor;
uniform mat4 uMVP;
uniform mat4 uModelView;
uniform mat3 uNormalMat;
out vec3 vNormal;
out vec3 vViewPos;
out vec4 vColor;
void main() {
  vNormal = normalize(uNormalMat * aNormal);
  vec4 mv = uModelView * vec4(aPos, 1.0);
  vViewPos = mv.xyz;
  vColor = aColor;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

const FS_SOLID = `#version 300 es
precision highp float;
in vec3 vNormal;
in vec3 vViewPos;
in vec4 vColor;
out vec4 fragColor;
void main() {
  vec3 n = normalize(vNormal);
  if (!gl_FrontFacing) n = -n;
  vec3 viewDir = normalize(-vViewPos);
  // Kopflicht plus zwei schwache Fülllichter, damit Kanten lesbar bleiben
  float key  = max(dot(n, normalize(vec3( 0.35, 0.25, 1.0))), 0.0);
  float fill = max(dot(n, normalize(vec3(-0.7, -0.4, 0.35))), 0.0);
  float rim  = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);
  vec3 base = vColor.rgb;
  vec3 col = base * (0.26 + 0.68 * key + 0.20 * fill) + vec3(0.32, 0.40, 0.48) * rim * 0.35;
  fragColor = vec4(col, vColor.a);
}`;

const VS_LINE = `#version 300 es
in vec3 aPos;
in vec4 aColor;
uniform mat4 uMVP;
out vec4 vColor;
void main() { vColor = aColor; gl_Position = uMVP * vec4(aPos, 1.0); }`;

const FS_LINE = `#version 300 es
precision highp float;
in vec4 vColor;
out vec4 fragColor;
void main() { fragColor = vColor; }`;

function mat4Perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  return [
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) / (near - far), 2 * far * near / (near - far),
    0, 0, -1, 0
  ];
}
function mat4LookAt(eye, center, up) {
  const z = V.norm(V.sub(eye, center));
  const x = V.norm(V.cross(up, z));
  const y = V.cross(z, x);
  return [
    x[0], x[1], x[2], -V.dot(x, eye),
    y[0], y[1], y[2], -V.dot(y, eye),
    z[0], z[1], z[2], -V.dot(z, eye),
    0, 0, 0, 1
  ];
}
// row-major -> column-major für WebGL
function toGL(m) {
  return new Float32Array([
    m[0], m[4], m[8], m[12],
    m[1], m[5], m[9], m[13],
    m[2], m[6], m[10], m[14],
    m[3], m[7], m[11], m[15]
  ]);
}

class Viewport {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
    if (!gl) throw new Error('WebGL2 wird von diesem Browser nicht unterstützt.');
    this.gl = gl;

    this.progSolid = this.link(VS_SOLID, FS_SOLID);
    this.progLine = this.link(VS_LINE, FS_LINE);

    this.target = [0, 0, 0];
    this.dist = 120;
    this.yaw = -55 * Math.PI / 180;
    this.pitch = 62 * Math.PI / 180;
    this.showGrid = true;
    this.showAxes = true;

    this.opaque = this.makeMesh();
    this.trans = this.makeMesh();
    this.lines = { buf: gl.createBuffer(), vao: gl.createVertexArray(), count: 0 };
    this.setupLineVAO();

    this.bindEvents();
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0.055, 0.071, 0.090, 1);
  }

  link(vsSrc, fsSrc) {
    const gl = this.gl;
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error('Shader: ' + gl.getShaderInfoLog(s));
      }
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsSrc));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.bindAttribLocation(p, 1, 'aNormal');
    gl.bindAttribLocation(p, 2, 'aColor');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('Programm: ' + gl.getProgramInfoLog(p));
    }
    return p;
  }

  makeMesh() {
    const gl = this.gl;
    const m = { buf: gl.createBuffer(), vao: gl.createVertexArray(), count: 0 };
    gl.bindVertexArray(m.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.buf);
    const stride = 10 * 4;
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, stride, 24);
    gl.bindVertexArray(null);
    return m;
  }

  setupLineVAO() {
    const gl = this.gl;
    gl.bindVertexArray(this.lines.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.lines.buf);
    const stride = 7 * 4;
